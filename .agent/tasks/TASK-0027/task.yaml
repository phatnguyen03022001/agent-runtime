structure_authority:
  status: RESOLVED
  source: "Existing PSRuntimeDiscovery in NativeRuntimeBackend.swift plus existing AgentRuntimeCore test target"
  rationale: "The remaining defect is one cross-component process-discovery contract mismatch. Correct the existing discovery boundary and add deterministic regression coverage; no new component or architecture is required."

objective: "Close TASK-0027 by making the native macOS Runtime discovery contract compatible with the canonical `tunnel-client run --profile-file ~/.config/tunnel-client/agent-runtime.yaml` startup path, while preserving the accepted tunnel-identity architecture and TASK-0026 lifecycle safety boundaries."

scope:
  required_changes:
    - "Fresh-bind TASK-0027 revision 3 at its exact handoff base. Fresh-resolve dev/main, this task revision, revision-2 report/review, implementation candidate 5938c45b5d5f6516293f8ab7cef0fbce2cd2ecbe, TASK-0026 accepted review, clean target state, and required execution capability before mutation."
    - "Preserve all accepted revision-1/revision-2 tunnel identity semantics: canonical YAML profile as sole persistent tunnel-ID owner, sanitized doctor/run environment, deterministic legacy convergence/fail-closed behavior, no ambient identity/config-source override, no automatic current-machine A/B migration."
    - "Correct production PSRuntimeDiscovery so a Runtime launched by the canonical current start.sh command form using `tunnel-client run --profile-file ~/.config/tunnel-client/agent-runtime.yaml` is observed as external/active rather than stopped."
    - "Keep process identification fail-closed. Discovery must still require the inspected executable identity to resolve to tunnel-client and must not treat arbitrary profile-file paths, another profile, or unrelated command text as the Agent Runtime. Retaining recognition of the legacy exact `--profile agent-runtime` form for transition compatibility is allowed, but it must not weaken canonical matching."
    - "Add deterministic Swift coverage for the production discovery command contract, not only mocked RuntimeDiscovering behavior. The tests must prove canonical profile-file invocation matches, wrong/other profile selection does not match, and the resulting backend/controller treats a detected external Runtime as read-only so explicit Start cannot create a second instance."
    - "Use the smallest repo-native implementation. A bounded extraction/injection inside the existing discovery component for deterministic parsing/testing is allowed; no new runtime service, daemon, wrapper, registry, process manager, dependency, or control plane is authorized."
    - "Do not start, stop, restart, signal, migrate, or otherwise mutate the operator's live Runtime/tunnel, live profile, live .env identity, ChatGPT connector/app binding, or port 8080 during execution. Use source/fixture/synthetic test evidence only."
    - "Run focused Swift discovery tests, the full Swift test suite, focused tunnel identity regressions, repository-native ./verify, shell syntax, git diff --check, exact four-tool MCP surface proof, and restrictive diff/lineage checks."
    - "Publish one implementation candidate non-force to dev, then update TASK-0027/report.yaml as report revision 3 in a report-only direct child, fresh-prove final dev/main and lineage, and stop at NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "macos/Sources/AgentRuntimeCore/NativeRuntimeBackend.swift"
    - "macos/Tests/AgentRuntimeCoreTests/OwnershipTests.swift"
    - "macos/Tests/AgentRuntimeCoreTests/RuntimeLifecycleTests.swift"
    - ".agent/tasks/TASK-0027/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Canonical tunnel startup remains `tunnel-client run --profile-file ~/.config/tunnel-client/agent-runtime.yaml` under the sanitized environment established by the revision-1 candidate."
  - "Native observation of the canonical CLI-started Runtime returns external/active state rather than stopped; external Runtime remains strictly read-only to the app."
  - "A native explicit Start cannot proceed when the canonical external Runtime is already running."
  - "Discovery continues to require tunnel-client executable identity and exact Agent Runtime profile selection; unrelated tunnel-client instances and arbitrary command substrings do not match."
  - "The stable tunnel identity architecture, legacy fail-closed migration semantics, and current-machine no-migration boundary remain unchanged."
  - "TASK-0026 remains intact: UI-only login launch, no Runtime autostart/watchdog/reconciliation, destructive lifecycle only for positively revalidated app ownership after explicit operator action."
  - "Python MCP semantics and exactly four public tools remain unchanged: terminal_exec, terminal_start, terminal_poll, terminal_control."
  - "No new dependency, service, daemon, database, registry, Docker/OrbStack control path, connector manager, retry identity fallback, or second tunnel abstraction is introduced."
  - "No main promotion, tag, release, connector recreation, tunnel creation/deletion, current-machine identity migration, or sibling-repository mutation is authorized."

forbidden_changes:
  - "Do not stop, restart, kill, signal, reconfigure, replace, or otherwise lifecycle-manage the currently serving Agent Runtime/tunnel or port 8080."
  - "Do not edit live ~/.config/tunnel-client/agent-runtime.yaml, live .env identity, control-plane tunnel object, Runtime API key, ChatGPT connector/app binding, or permissions."
  - "Do not change start.sh, install.sh, .env.example, README.md, Python runtime core, requirements.txt, verify, production menu-bar UI source, process ownership semantics, prior task/report/review history, or any file outside the restrictive revision-3 list."
  - "Do not solve discovery by broad substring matching that could classify arbitrary tunnel-client commands as Agent Runtime."
  - "Do not add automatic repair/reconnect/re-authorize/recreate behavior."
  - "Do not force-push, rewrite history, create a branch, move main, create a tag/release, mutate repository metadata/rulesets, or modify sibling repositories."

