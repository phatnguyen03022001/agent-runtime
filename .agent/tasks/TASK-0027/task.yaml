structure_authority:
  status: RESOLVED
  source: "Existing start.sh/install.sh configuration boundary plus one focused regression module"
  rationale: "The defect is duplicate ownership and precedence leakage, not missing infrastructure. Correct the existing shell/configuration path directly; keep the native Swift app delegating to start.sh and introduce no daemon, database, connector manager, tunnel abstraction, service, or dependency."

objective: "Make ~/.config/tunnel-client/agent-runtime.yaml the sole persistent owner of Agent Runtime's tunnel identity, remove repository-local and ambient environment paths that can silently replace that identity, preserve the exact identity across normal lifecycle/update/reinstall operations, and provide deterministic fail-closed handling for legacy split-brain installations without mutating the currently serving Runtime or guessing a migration target."

scope:
  required_changes:
    - "Fresh-bind TASK-0027 revision 1 at its exact handoff base. Before mutation, fresh-resolve dev/main, TASK-0026 accepted review, current start/install/.env.example behavior, tunnel-client version/help relevant to config precedence, clean target state, and required local execution capability. Reproduce the split-brain class using redacted/hash-only identity evidence; never print API-key literals or full tunnel IDs into report evidence."
    - "Establish the product-fixed canonical tunnel profile name `agent-runtime` and canonical profile location under the operator HOME configuration directory. The profile YAML becomes the only persistent owner of `control_plane.tunnel_id`; repository .env must no longer store or independently select the tunnel ID or profile identity."
    - "Change startup so both `tunnel-client doctor` and `tunnel-client run` execute from the same sanitized, explicitly constructed environment and exact canonical profile selection. Ambient configuration/identity selectors, including CONTROL_PLANE_TUNNEL_ID, TUNNEL_CLIENT_CONFIG, TUNNEL_CLIENT_PROFILE, TUNNEL_CLIENT_PROFILE_FILE, TUNNEL_CLIENT_PROFILE_DIR, XDG_CONFIG_HOME, and equivalent currently documented precedence paths, must not silently redirect effective tunnel identity or profile source."
    - "Keep runtime secrets and checkout-local configuration narrow. Runtime startup must obtain the control-plane runtime API key from the installed checkout configuration rather than depending on arbitrary ambient shell inheritance, and must preserve the existing absolute workspace-root validation. Do not log, echo, export to reports, or persist new copies of secret values."
    - "Correct install behavior so an existing valid canonical profile is preserved exactly during ordinary install/reinstall/update. Ordinary installation must never create another tunnel identity, replace the canonical tunnel ID, persist a second tunnel ID in .env, or validate one identity while the profile contains another."
    - "Define deterministic legacy convergence. If a legacy .env tunnel ID equals the canonical profile ID, converge by removing the duplicate repository-local identity while preserving the profile. If both exist and differ, fail closed before identity mutation and return a clear migration-required result; do not choose either ID automatically. If the canonical profile is missing, permit only explicit first-time bootstrap from one unambiguous operator-supplied/legacy identity under existing install authority; if identity is absent or ambiguous, fail clearly. Malformed/non-regular/symlink profile state must fail closed."
    - "Do not perform the current machine's live legacy A/B tunnel migration under this task. The known serving Runtime, canonical profile bytes, ChatGPT connector binding, and live .env tunnel identity are read-only production state during execution. This task implements and verifies safe future behavior and migration detection only; choosing/mutating the current canonical tunnel ID requires separate explicit operator authorization after implementation review."
    - "Preserve TASK-0026 native lifecycle architecture. The native app must continue to launch the exact checkout start.sh path with a narrow child environment; UI launch, login launch, refresh, timers, install, health checks, and app rebuild/reinstall must not start/stop/restart/signal Runtime except through existing explicit operator lifecycle actions. No production Swift change is required unless Executor proves one is necessary to satisfy a TASK-0027 acceptance predicate."
    - "Keep ./start.sh as the CLI fallback and keep the Python MCP core/public tool surface unchanged. Implementation-only code changes that do not alter MCP tool names or schemas must not rotate or recreate the tunnel identity."
    - "Add deterministic regression coverage using isolated fixtures/fake tunnel-client capture where appropriate. Tests must prove effective argv/environment/profile selection, not merely static file text, and must not require live OpenAI credentials or mutation of the operator's live Runtime/profile."
    - "Run focused regressions, Swift verification needed to preserve TASK-0026 integration, repository-native ./verify, shell syntax, diff checks, and exact four-tool surface proof. Publish the implementation candidate and report-only direct child non-force to dev, prove main unchanged, then stop at NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "start.sh"
    - "install.sh"
    - ".env.example"
    - "README.md"
    - "tests/test_surface_and_scripts.py"
    - "macos/Tests/AgentRuntimeCoreTests/RuntimeLifecycleTests.swift"
  expected_files_are_restrictive: true

invariants:
  - "One logical Agent Runtime installation has exactly one persistent tunnel identity, owned by ~/.config/tunnel-client/agent-runtime.yaml. Normal stop/start, restart, Mac reboot, native-app restart, code update, dependency reinstall, app rebuild, and reinstall do not rotate it."
  - "Repository .env does not persist CONTROL_PLANE_TUNNEL_ID and does not own a mutable tunnel profile selector after convergence."
  - "Ambient shell/app environment cannot silently redirect canonical tunnel identity, profile file/directory, config file, or equivalent source-selection precedence."
  - "Ordinary install/reinstall preserves an existing canonical profile and never performs tunnel migration as a side effect."
  - "A legacy profile/.env mismatch is a migration boundary: normal startup/install fails closed and does not guess, replace, recreate, or rotate identity."
  - "The current serving Runtime and its tunnel/ChatGPT connector are protected read-only infrastructure for this execution; no stop, restart, signal, profile mutation, connector mutation, or live identity migration is authorized."
  - "TASK-0026 lifecycle behavior remains intact: UI-only login launch, no Runtime autostart/watchdog/reconcile loop, external Runtime read-only, and destructive lifecycle only for positively revalidated app ownership after explicit operator action."
  - "Python MCP semantics and exactly four public tools remain unchanged: terminal_exec, terminal_start, terminal_poll, terminal_control."
  - "No new runtime dependency, daemon, database, queue, registry, connector manager, Docker component, orchestration service, retry-based identity fallback, or second tunnel abstraction is introduced."
  - "No main promotion, tag, release, connector recreation, tunnel deletion/creation, or sibling-repository mutation is authorized."

forbidden_changes:
  - "Do not stop, restart, kill, signal, reconfigure, replace, or otherwise lifecycle-manage the currently serving Agent Runtime/tunnel or port 8080 during this task."
  - "Do not edit the operator's live ~/.config/tunnel-client/agent-runtime.yaml, live .env tunnel identity, ChatGPT connector/app binding, control-plane tunnel object, Runtime API key, or permissions as part of execution or testing."
  - "Do not solve the defect by reconnecting/re-authorizing ChatGPT on every restart, recreating the connector, rotating tunnel IDs, retrying against alternate identities, or adding automatic repair/reconciliation."
  - "Do not add a new daemon, service, database, persistent registry, Docker/OrbStack control path, web control API, socket control plane, or tunnel wrapper abstraction."
  - "Do not modify agent_runtime/server.py, agent_runtime/executor.py, agent_runtime/session.py, requirements.txt, verify, macOS production source, prior task/report/review artifacts, or files outside the authorized list except the new TASK-0027 report and one focused regression test file allowed below."
  - "Do not force-push, rewrite history, create a branch, move main, create a tag/release, mutate repository metadata/rulesets, or modify sibling repositories."

