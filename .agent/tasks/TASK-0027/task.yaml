acceptance_criteria:
  - id: AC-1
    requirement: "The canonical agent-runtime YAML profile is the sole persistent tunnel-identity owner, and effective startup cannot be silently redirected by repository-local or ambient identity/config-source overrides."
    evidence_required: "Focused fixture tests capture effective tunnel-client argv/environment for doctor and run, prove the same exact canonical profile source is selected, prove CONTROL_PLANE_TUNNEL_ID and documented config/profile selector overrides cannot replace it, and prove .env.example/current installer no longer persist a second tunnel identity."
  - id: AC-2
    requirement: "Normal lifecycle and implementation operations preserve one tunnel identity without connector recreation."
    evidence_required: "Deterministic tests simulate repeated start/restart, reinstall, code/update-state changes, and native-app delegation while proving the canonical profile identity bytes/fingerprint remain unchanged and no identity-creation/migration path is invoked."
  - id: AC-3
    requirement: "Legacy state converges deterministically without guessing."
    evidence_required: "Tests cover: matching legacy .env/profile identity converges by removing the duplicate local identity; mismatched identities fail closed with no profile mutation; missing profile plus one unambiguous bootstrap identity creates exactly one canonical profile; missing/ambiguous identity fails; malformed/symlink/non-regular profile fails; missing API key fails without identity mutation."
  - id: AC-4
    requirement: "CLI, native app, and login behavior share the same stable identity path without weakening TASK-0026 lifecycle boundaries."
    evidence_required: "Source/integration proof shows native Start still delegates to checkout start.sh under a narrow child environment, login remains UI-only/KeepAlive=false, and no background UI/timer/install path performs Runtime lifecycle mutation or introduces an alternate tunnel identity source."
  - id: AC-5
    requirement: "MCP runtime contract and dependency/topology boundaries remain unchanged."
    evidence_required: "Repository-native ./verify plus exact diff/surface proof show exactly four existing MCP tools/signatures, unchanged Python runtime modules and requirements, no new runtime dependency/service/persistence/control-plane abstraction, and no macOS production change unless explicitly justified by a failing acceptance predicate."
  - id: AC-6
    requirement: "The implementation is production-safe for the currently serving installation."
    evidence_required: "Execution evidence proves all tests used isolated fixtures/redacted identifiers, the live Runtime PID/process start identity remained untouched, live profile/.env/connector/control-plane objects were not mutated, and no port-8080 lifecycle action occurred."
  - id: AC-7
    requirement: "Candidate/report publication is exact and reconstructible."
    evidence_required: "Task/report YAML validation, implementation candidate direct-child lineage from exact handoff base, report-only direct child, restrictive changed-path proof, non-force dev publication, fresh final dev/main proof, and stop at NEEDS_REVIEW."

