acceptance_criteria:
  - id: AC-1
    requirement: "Production Runtime discovery recognizes the canonical profile-file startup contract exactly enough to prevent false Stopped state and duplicate Start attempts."
    evidence_required: "Deterministic Swift test exercises production discovery matching logic with a canonical `tunnel-client run --profile-file <HOME>/.config/tunnel-client/agent-runtime.yaml` command and proves it resolves to the expected external PID/state."
  - id: AC-2
    requirement: "Discovery remains bounded and fail-closed."
    evidence_required: "Tests prove a different profile-file path/profile and unrelated command text do not match, and executable identity must still be tunnel-client. If legacy `--profile agent-runtime` recognition is retained, test it separately from the canonical form."
  - id: AC-3
    requirement: "Canonical externally started Runtime remains read-only and cannot be double-started by the native app."
    evidence_required: "Integration/unit proof drives backend/controller from production-compatible discovery result to external state and proves Start/Stop/Restart do not mutate or signal that external Runtime."
  - id: AC-4
    requirement: "Tunnel identity behavior from the revision-1 candidate remains unchanged and regression-free."
    evidence_required: "Focused tunnel identity suite passes unchanged, exact diff proves no shell/config identity file changed, and canonical startup invocation remains the fixed profile-file form."
  - id: AC-5
    requirement: "MCP/runtime/lifecycle topology remains unchanged outside the narrow native discovery patch."
    evidence_required: "Full Swift tests, repository-native ./verify, exact four-tool surface proof, unchanged Python runtime/dependencies, shell syntax, git diff --check, restrictive changed-path proof, and no live Runtime/profile/connector/port-8080 mutation evidence."
  - id: AC-6
    requirement: "Revision-3 publication is exact and reviewable."
    evidence_required: "Pinned task/report validation passes; implementation candidate is direct child of exact revision-3 base and changes only authorized production/test files; report revision 3 is a report-only direct child; non-force final dev resolves to report commit; main remains unchanged; result stops at NEEDS_REVIEW."

