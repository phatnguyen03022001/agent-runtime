structure_authority:
  status: RESOLVED
  source: "Existing fs_read/fs_patch/fs_write/fs_safety owners plus one new fs_manage capability module"
  rationale: "GAP-06 is metadata closure inside fs_read_batch. GAP-08 requires one bounded management tool, not four tools or a filesystem transaction framework. Reuse descriptor-relative safety and expected-state patterns; add no daemon, registry, snapshot store, generic filesystem abstraction or shell wrapper."

objective: "Close filesystem read-to-patch CAS and remove routine shell fallback for bounded local filesystem management by evolving fs_read_batch result metadata and adding one fs_manage tool for mkdir, move, delete and chmod, while preserving workspace/protected-runtime boundaries, no-symlink semantics, explicit expected state, bounded effects and the installed Runtime until Cutover B."

scope:
  required_changes:
    - "Evolve fs_read_batch result schema from 1 to 2 while keeping request schema 1. Preserve request ordering, per-item partial-error behavior, UTF-8 strictness, line-range semantics, 20-item bound, existing output ceilings and existing scan ceilings."
    - "For every successful fs_read_batch item, preserve existing fields and add size_bytes as the exact opened regular-file size, returned_bytes as the exact UTF-8 byte length of returned text, eof as whether the bounded scan reached file EOF, truncated as truthful Runtime-bound truncation state, and sha256 as the full raw-file lowercase SHA-256 when the complete file can be hashed within the existing per-item and remaining batch scan bounds. sha256 must never represent only the returned range. If a compatible successful range read cannot complete the full-file hash within existing scan bounds, preserve the successful read and return sha256=null rather than weakening limits or converting a formerly successful bounded range read into a failure solely for metadata."
    - "Use one scan whenever practical: continue a bounded opened-file scan after the selected line range only to complete whole-file SHA metadata, without retaining unrequested text. Hash work counts inside the existing item/batch scan ceilings. Do not introduce a second unaccounted full-file read or raise scan limits."
    - "The resulting CAS workflow for files eligible for current fs_patch must be fs_read_batch -> fs_patch using the returned full-file sha256. Add direct proof that an unchanged eligible file accepts that SHA and a changed file is rejected by fs_patch expected_sha256."
    - "Add exactly one new public tool fs_manage with request/result schema 1/1 and operation discriminator mkdir|move|delete|chmod. Source public tool inventory becomes exactly 20; ToolContract Kernel remains 2 and Runtime source version remains 0.3.0."
    - "fs_manage is workspace-bound, network=NONE and mutation=BOUNDED. All paths are normalized cwd-relative descendants, validated descriptor-relative beneath one validated cwd. Reject absolute paths, traversal, NUL, symlink traversal and symlink targets for every operation."
    - "Protect the currently installed/canonical Agent Runtime path explicitly in addition to workspace confinement. If a configured workspace overlaps the protected Runtime root, any source, destination or target at or below that root must fail before mutation with existing structured protected-runtime/permission semantics. Do not infer protection from shell command parsing."
    - "mkdir: target state is expected absent. Default creates exactly one directory. A bounded parents mode may create missing ancestors but may create at most 16 directories in one call, must never traverse or replace a symlink/non-directory, and must remain entirely inside cwd/workspace. Existing target is a conflict/precondition failure, not silent success."
    - "move: support regular files and directories using same-filesystem atomic rename semantics with destination expected absent. For regular files require caller expected_source_sha256; for directories require exact source kind and immediate identity/state revalidation. Use an atomic no-overwrite platform primitive; do not implement destination safety as check-then-overwriting rename. EXDEV is a structured pre-effect error. No copy+delete fallback. Revalidate source identity/expected state immediately before the rename and verify the moved destination identity afterward; any ambiguity after the rename uses TASK-0144 effect/reconciliation semantics rather than blind retry."
    - "delete: delete only one regular file matching caller expected_sha256 or one empty directory matching the requested kind. Reject symlinks, non-empty directories and recursive deletion. Revalidate target identity/expected state immediately before unlink/rmdir. No globbing and no parent cleanup."
    - "chmod: regular files only. Require caller expected_sha256 and immediate identity/hash revalidation before effect. Accept only ordinary permission bits 0o000 through 0o777; reject setuid, setgid, sticky and any non-permission bits. Preserve file content/identity and return before/after mode evidence."
    - "Each fs_manage success result must identify operation, affected normalized path(s), observed/verified before state sufficient for the operation, exact after state, and effect truth. Do not invent a cross-operation transaction receipt or make fs_manage output authorization for another mutating tool."
    - "Use existing structured TASK-0144 error/effect contract for invalid requests, expected-state mismatch, local state drift, destination conflict, protected-runtime denial, EXDEV, permission failures and post-effect ambiguity. No English-string parsing for control flow."
    - "Add deterministic security/correctness tests covering fs_read full-file SHA/size/returned_bytes/eof/truncated metadata; read->patch CAS success and SHA mismatch; source replacement between observation and mutation; destination race/no-overwrite; symlink escape; outside-workspace and protected-runtime rejection; EXDEV; non-empty-directory delete; recursive-delete absence; dangerous chmod bits; mkdir pre-existing path and bounded parents; immediate revalidation; and operation atomicity/effect classification."
    - "Update capability registry, MCP/schema conformance, runtime_capabilities source projection and only directly affected source documentation. Do not package/install/restart/reload Runtime in TASK-0148."
    - "Revision-2 recovery authority: preserve exact clean local checkpoint 53cad80758753e127fc2bf197e1125417500949e (tree 8d7e70272d16e14ab929026323d22b746eeffecc, parent d8463dab88f44b3e47a1be63cac337c26b1d3ddb) as immutable recovery evidence. Do not reset or restart implementation. After fresh-resolving this revision-2 task-authoring base, transplant/reparent the exact checkpoint patch onto the revision-2 base in a linear unpublished local lineage; verify the transplanted implementation bytes match the checkpoint before any new source edit."
    - "Close only the canonical-verifier compatibility gap in agent_runtime/doctor.py and tests/test_doctor.py: replace stale accepted nineteen-tool inventory/schema assumptions with the revision-2 source authority of exactly twenty tools, fs_read_batch request/result 1/2 and fs_manage request/result 1/1. Preserve all other doctor checks, installed-package semantics, health semantics and screen_capture governance."
    - "The checkpoint's focused 183/183 PASS may be reused only if the transplanted implementation delta excluding task.yaml is byte-equivalent to checkpoint 53cad807... and the only subsequent production-source edit is agent_runtime/doctor.py. Run focused doctor/schema compatibility tests after the doctor correction. Any other implementation change invalidates that reuse and requires rerunning the full TASK-0148 focused suite."
    - "After the doctor correction, commit a successor candidate, run canonical ./verify on that exact clean successor, fresh-reconcile remote main, publish only the exact verified successor non-force, publish report-r1.yaml as the sole report-only child, and stop NEEDS_REVIEW."

