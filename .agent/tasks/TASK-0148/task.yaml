forbidden_changes:
  - "Any new public tool other than fs_manage, or any removal/rename of existing tools."
  - "ToolContract Kernel bump, Runtime version bump, dependency change, package/install/cutover logic change, runtime.env change, ServiceManagement change, TCC/System Settings/Screen Recording change."
  - "Recursive directory removal, shelling out to rm/mv/mkdir/chmod, path globbing, symlink following, hard-coded workspace bypass, hidden copy+delete fallback or best-effort destructive cleanup."
  - "Any chmod support for setuid/setgid/sticky or file types other than regular files."
  - "Any claim that read metadata is atomic snapshot state across files; each item is independently observed."
  - "Any broad refactor of existing fs_patch/fs_write or replacement of their accepted atomic/CAS mechanisms."
  - "Any later roadmap task implementation, branch creation, PR, force push, amend, squash, tag or release publication."

