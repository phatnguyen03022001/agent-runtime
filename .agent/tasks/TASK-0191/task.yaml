structure_authority:
  status: RESOLVED
  source: "Existing package-owned lifecycle/status helper plus existing AgentRuntimeCore and menu-bar presentation components."
  rationale: "Truth ownership stays inside existing lifecycle/status responsibilities; no new top-level subsystem or service is required."

objective: "Establish one authoritative read-only Runtime observation contract and make the menu-bar presentation consume that truth so a genuinely serving canonical Runtime is never reported Unavailable merely because desired-state, process-discovery formatting, or ownership metadata disagrees. Availability and lifecycle-control authority must be separate."

scope:
  required_changes:
    - "Make one package-owned Runtime observation path the canonical source for operator-visible status. Remove duplicated status truth from the Swift menu-bar backend; Swift may adapt/present the canonical result but must not independently redefine Runtime availability."
    - "Model service availability separately from lifecycle-control authority. A canonical Runtime proven healthy/ready must present as running. If it is serving but positive lifecycle ownership cannot be proven, present it as running read-only/external rather than Unavailable and keep destructive controls disabled."
    - "Treat desired-state persistence as lifecycle intent only, never proof that Runtime is currently running or stopped."
    - "Do not trust arbitrary occupancy or arbitrary HTTP 200 on port 8080. The canonical observation must preserve positive Runtime identity/ownership safety before classifying a listener as the canonical Runtime."
    - "Preserve fail-closed lifecycle mutation: Stop/Restart require positive canonical control ownership; foreign, conflicting, or genuinely unknowable state must never be signaled or killed."
    - "Make CLI/operator status and menu-bar status derive from the same status semantics. A stale exact-argv/process-format observation must not override stronger canonical serving evidence."
    - "Keep status refresh bounded, read-only and side-effect free. Do not auto-start, repair, reinstall, restart, cut over, reboot, mutate LaunchServices, widen permissions, or change persistence while observing state."
    - "Add deterministic tests for at least: healthy managed Runtime; healthy Runtime with control ownership unproven; desired RUNNING but readiness failed; no Runtime; foreign/ambiguous port owner; stale desired-state; process/argv presentation drift. Prove the first two cannot render Unavailable solely from ownership/process-discovery uncertainty."
    - "Use focused deterministic tests before broad verification. Run the canonical ./verify at most once after focused checks pass. The canonical verification execution must have an attributable durable/reconcilable outcome across chat/transport interruption; if its result becomes unknown, reconcile existing process/log/receipt/state before any rerun and never blind-retry."
    - "Publish a truthful report only after implementation and required proof. TASK-0190 revision 8 must not be executed, rebooted, repaired, or otherwise consumed during TASK-0191."
  allowed_existing_files_or_components:
    - "start.sh lifecycle/status observation"
    - "macos/Sources/AgentRuntimeCore/"
    - "macos/Sources/AgentRuntimeMenuBar/"
    - "macos/Tests/AgentRuntimeCoreTests/"
    - "tests/"
    - "README.md status/lifecycle documentation"

invariants:
  - "MAIN ONLY; no branch or PR creation."
  - "GitHub remote remains canonical repository truth."
  - "Availability and lifecycle-control authority are distinct facts."
  - "A healthy canonical Runtime is never downgraded to Unavailable solely because desired-state, ownership metadata, or ps/argv presentation is stale or unprovable."
  - "Foreign or ambiguous Runtime identity never grants Stop/Restart authority."
  - "No requirement is added for Runtime survival across reboot/login."
  - "TASK-0190 revision 8 physical reboot budget remains unconsumed."
  - "No dependency or service-topology expansion is required for status truth."

forbidden_changes:
  - "Do not execute or continue TASK-0190 revision 8."
  - "Do not reboot the Mac or add reboot/login qualification."
  - "Do not install, cut over, rollback, recover, manually restart, or mutate the live installed Runtime as part of implementation verification."
  - "Do not add supervisor daemons, schedulers, registries, databases, caches, new services, or speculative orchestration."
  - "Do not weaken protected-port/foreign-process safety in order to make status appear green."
  - "Do not change MCP public tool semantics, tunnel identity/configuration, credentials, release assets, tags, or version."
  - "Do not add dependencies unless a revised Architect task explicitly authorizes them."

