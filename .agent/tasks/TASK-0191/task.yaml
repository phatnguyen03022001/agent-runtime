  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Runtime status has one authoritative observation owner shared by CLI/operator status and menu-bar presentation."
    evidence_required: "Diff and focused tests prove the menu-bar no longer independently reconstructs competing availability truth and both surfaces map from the same canonical status semantics."
  - id: AC-2
    requirement: "Availability is independent from lifecycle-control ownership."
    evidence_required: "Deterministic tests prove healthy managed Runtime -> Running/controllable; healthy canonical Runtime with ownership unproven -> Running read-only/external; neither case becomes Unavailable solely because desired-state or process/ownership metadata disagrees."
  - id: AC-3
    requirement: "Unsafe or genuinely unhealthy states remain fail-closed."
    evidence_required: "Tests prove desired RUNNING with failed readiness is degraded/attention rather than falsely Running; absent Runtime is Stopped; foreign/conflicting identity is non-controllable and never killed or adopted."
  - id: AC-4
    requirement: "Status observation is bounded and non-mutating and introduces no reboot-survival machinery."
    evidence_required: "Focused tests/source inspection prove refresh performs no start/stop/restart/install/reboot/repair/persistence mutation and TASK-0190 reboot authority is untouched."
  - id: AC-5
    requirement: "Implementation is deterministically verified without blind replay after chat/transport loss."
    evidence_required: "Focused Swift/status tests PASS, canonical ./verify PASS from at most one new invocation, and verification evidence is attributable/reconcilable if the controlling chat or transport disconnects."

verification:
  authoritative_verification:
    required: true
    mechanism: "./verify"
    expected_signal: "PASS from one post-focused-check invocation maximum; no blind rerun after ambiguous interruption."
  executor_checks:
    - id: CHECK-1
      command_or_check: "Run focused AgentRuntimeCore/menu-bar status tests and any focused shell/Python contract tests without touching the live installed Runtime."
      required: true
    - id: CHECK-2
      command_or_check: "Run xcrun swift test --package-path macos after focused status behavior is green."
      required: true
    - id: CHECK-3
      command_or_check: "Run the single canonical ./verify through a durable/reconcilable execution path only after focused checks pass."
      required: true

