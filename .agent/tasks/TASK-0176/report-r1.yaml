current_product_identity_contract:
  package_signing_graph: "macos/package_app.sh requires an explicit non-ad-hoc identity in source mode. Its distribution mode requires an explicit Developer ID Application identity plus notary profile, signs nested Python/native runtime code and responsible executables, signs the app, notarizes, staples, and verifies distribution identity."
  candidate_handoff: "macos/package_provenance.py serializes a non-empty real team_identifier plus exact source revision/tree, runtime manifest identity, responsible executable paths, candidate closure SHA-256, and record count."
  responsible_code: "The main app, Runtime service helper, and screen-capture helper must all expose the same non-empty TeamIdentifier; missing/not-set/none/null is rejected."
  recovery_ownership: "macos/candidate_cutover.py revalidates strict signatures and exact TeamIdentifier ownership for rollback snapshots and staged/installed candidates in addition to exact closure and external handoff checks."
  service_management: "Agent Runtime uses SMAppService.mainApp and SMAppService.agent(plistName:) with the Runtime LaunchAgent embedded in the app bundle. No manual LaunchAgent fallback is part of the accepted lifecycle."

platform_evidence:
  accessed_date: "2026-09-28"
  apple_adhoc: "Apple Security documentation states that an ad-hoc signature seals code without a signing identity; no identity can be retrieved and any code requirement restricting signing identity fails. https://developer.apple.com/documentation/security/seccodesignatureflags/adhoc"
  apple_distribution: "Apple documentation says independent Mac distribution uses a Developer ID Application identity. https://developer.apple.com/documentation/xcode/creating-distribution-signed-code-for-the-mac/"
  apple_membership: "Apple membership documentation places app distribution, Developer ID, and notarization in Apple Developer Program membership; a free Personal Team is for personal-device testing and requires periodic reprovisioning. https://developer.apple.com/support/compare-memberships/ and https://developer.apple.com/help/account/basics/about-your-developer-account"
  apple_smappservice: "Apple DTS SMAppService guidance embeds the helper with Code Sign on Copy and a selected team. Apple DTS update guidance shows launch constraints are sensitive to executable designated requirements and specifically asks whether the new executable satisfies the old DR. https://developer.apple.com/forums/thread/802443 and https://developer.apple.com/forums/thread/795022"

