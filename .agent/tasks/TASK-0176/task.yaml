structure_authority:
  status: RESOLVED
  source: "Existing macos/package_app.sh + package_provenance.py + candidate_cutover.py + native Agent Runtime.app first-run flow"
  rationale: "The only acceptable implementation is a minimal additional/replacement package mode inside the existing package lane. No second installer, service lifecycle, updater, permission manager, credential system, daemon architecture, or transport is needed or allowed."

objective: "Determine, without assuming unsigned, ad-hoc, self-signed, or free-development signing is viable, whether macOS exposes any zero-cost prebuilt signing/package form that preserves Agent Runtime's existing SMAppService registration, packaged-helper execution, strict truthful provenance, stable update/recovery ownership, and native TASK-0174/TASK-0175 newcomer lifecycle on another Apple-silicon Mac. Only if that viability gate passes, implement the smallest zero-cost package adaptation, remove obsolete paid-distribution coupling from the active product path, build exactly one immutable locally qualified release bundle from the final source candidate, and freeze exact candidate/handoff/archive identities for Fresh-Install Acceptance. If no zero-cost form satisfies every invariant, stop BLOCKED before weakening the product or manufacturing an artifact."

scope:
  required_changes:
    - "Freshly prove HEAD, origin/main, remote main, clean main-only topology, exact TASK-0176 execution base, and ancestry containing accepted TASK-0175 review 10c3810729683c6440aa1d86ae22366a04baae39."
    - "Prove the latest accepted onboarding implementation lineage is TASK-0175 source candidate 15ea3a19cb21ae8b104009dd49ebaefd89b0d8eb / tree 8ee09d9822c927ea032507187a439c121649ab86, and distinguish later governance-only commits from package-input bytes."
    - "Do not reuse TASK-0171 package qualification as if package inputs were unchanged. TASK-0174 and TASK-0175 changed app/package inputs; only still-equivalent source evidence may be reused, and every invalidated package-input predicate must be rerun narrowly."
    - "Before product mutation, inspect and record the exact current package signing graph, candidate handoff/provenance identity fields, ServiceManagement registration path, cutover/recovery signing checks, and release bundle contents."
    - "Establish a fail-closed signing viability matrix for completely unsigned, ad-hoc, self-signed/local-CA, free Personal Team/Apple Development, and any other genuinely zero-cost native form discovered from current Apple platform evidence. Do not infer viability from codesign --verify alone."
    - "Reject any form that requires Apple Developer Program membership, Developer ID Application, Apple notarization, notarytool, stapling, a paid signing service, consumer developer credentials, consumer provisioning/reprovisioning, or periodic rebuild/reinstall merely to stay runnable."
    - "Reject any form that requires the consumer to install/trust a custom root certificate, import a signing identity, disable Gatekeeper globally, remove quarantine metadata as the supported flow, or accept a new certificate/credential management subsystem."
    - "Treat ad-hoc signing as a candidate only, not an approved strategy. It must be proven compatible with the existing SMAppService main-app plus LaunchAgent ownership semantics, packaged Runtime helper execution, stable copied-app identity, update/recovery continuity, and the exact candidate provenance guarantees required by the current lifecycle."
    - "Do not fake TeamIdentifier with a sentinel such as adhoc/local/none and do not silently reinterpret the current team_identifier field. If the only possible zero-cost form lacks the stable code identity required by existing provenance/recovery or by SMAppService, return BLOCKED unless an equivalent security-preserving identity contract is proven within this task's existing architecture boundary."
    - "Do not replace SMAppService with direct ~/Library/LaunchAgents installation, raw launchctl ownership, a new login-item mechanism, a daemon, privileged helper, or parallel lifecycle merely to make unsigned/ad-hoc distribution work."
    - "If and only if one zero-cost signing form passes the viability gate, implement it inside the existing package_app.sh/prebuilt lane with the smallest possible source change. The consumer build must embed install_release.sh, packaged Runtime Python/helpers, Runtime manifest, native app binaries, app-owned LaunchAgent metadata, and the external Agent Runtime.candidate.json handoff exactly as the accepted prebuilt architecture requires."
    - "The viable zero-cost mode must sign/seal the complete executable graph in the minimum form required by macOS and by the existing product invariants. Every responsible executable and nested native Python/.so/.dylib that requires signing must be handled consistently; unsigned nested code must not be hidden behind a shallow app-level signature."
    - "Remove or make unreachable the active paid Developer-ID/notary/staple package path once a zero-cost replacement is qualified. Historical TASK-0172/TASK-0173 artifacts remain untouched and continue to describe history rather than current executable authority."
    - "Preserve one package/provenance/cutover state machine. Any required provenance evolution must remain truthful, versioned if the serialized contract changes, backward-safe for accepted installed predecessors, and no weaker than the existing exact closure + external handoff + responsible-code ownership checks."
    - "Document the exact zero-cost consumer flow: download and extract the complete release bundle; attempt first launch; perform only the bounded macOS Gatekeeper manual-open/Open Anyway action that current macOS actually requires; relaunch Agent Runtime; complete CONTROL_PLANE_API_KEY, CONTROL_PLANE_TUNNEL_ID, Runtime Git name/email, workspace picker, Background Activity approval if required, existing cutover/readiness/doctor gates; reach Runtime healthy."
    - "Document exactly what the user sees for the first launch warning. Do not claim Developer ID trust, notarization, stapling, Gatekeeper PASS, or an identified-developer experience. Do not instruct the user to disable security globally."
    - "The consumer path must require no agent-runtime checkout, host CPython 3.13, Xcode/Swift, local signing identity, Apple developer credential, notary profile, or build tooling. The official tunnel-client and existing Runtime inputs remain separate prerequisites."
    - "Qualify the final immutable source candidate with focused package/provenance/cutover/ServiceManagement/onboarding tests and relevant Swift tests. Reuse still-valid TASK-0175 evidence where exact bytes permit it; rerun only predicates invalidated by TASK-0176 changes."
    - "Run canonical ./verify at most once on the immutable final source candidate, and only through a direct local non-Agent-Runtime-durable process carrier consistent with accepted TASK-0175."
    - "After source qualification, build at most one real zero-cost prebuilt release candidate. Do not install or activate it against the live Runtime. Independently validate exact source revision/tree, executable signing form, runtime manifest, candidate provenance/handoff, bundle completeness, candidate closure SHA-256, handoff SHA-256, and complete downloadable archive SHA-256."
    - "The release archive must contain the complete release pair in one extraction root: Agent Runtime.app and Agent Runtime.candidate.json. Preserve extended metadata required for normal macOS app extraction; do not use archive tricks that strip quarantine as a security bypass."
    - "Do not publish a GitHub Release or create a tag. Keep the exact immutable candidate/handoff/archive locally under ignored build output for the next Fresh-Install Acceptance task."
    - "On PASS, create .agent/tasks/TASK-0176/report-r1.yaml, validate task/report with the pinned Foundation validator, commit only authorized tracked source/test/doc/report changes, publish non-force after fresh remote CAS proof, reconcile main cleanly, and stop NEEDS_REVIEW."
    - "If the viability gate proves no zero-cost form can preserve every hard invariant, make no product-source change, create a BLOCKED report with the exact platform/product conflict, publish only that authorized report, and do not schedule Fresh-Install Acceptance."

