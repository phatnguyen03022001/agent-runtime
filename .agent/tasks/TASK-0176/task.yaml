invariants:
  - "Agent Runtime distribution remains zero-cost: no Apple Developer Program membership, Developer ID Application, notarization, notarytool profile, stapling, or paid signing authority."
  - "TASK-0172 and TASK-0173 historical tasks/reports/reviews are immutable. Their future paid-distribution authority is superseded, not rewritten."
  - "TASK-0175 remains the latest accepted newcomer onboarding authority and its lifecycle semantics remain intact."
  - "The native Agent Runtime.app first-run flow, canonical runtime.env ownership/mode, tunnel identity, workspace selection, Background Activity approval, cutover, readiness, doctor, rollback/recovery, and same-UID threat-model semantics do not weaken."
  - "SMAppService remains the ServiceManagement authority for the main app and Runtime LaunchAgent. No direct LaunchAgent fallback becomes product behavior."
  - "Candidate provenance remains truthful. An absent TeamIdentifier must never be serialized as if it were a real team identity."
  - "The 20-tool Runtime public surface, Runtime kernel/capability semantics, and tunnel-client architecture do not change."
  - "Consumers require no checkout, build toolchain, signing identity, Apple developer credential, or package-source access."
  - "No supported instruction disables Gatekeeper globally, strips quarantine as the normal install flow, or installs a custom trust root."
  - "One immutable artifact identity is produced only after all package-input source bytes are final and qualified."
  - "No live production Runtime, canonical config, ServiceManagement state, tunnel-client, Apple account state, tag, or public release is mutated by TASK-0176."

forbidden_changes:
  - "Apple Developer Program enrollment, fee payment, Developer ID Application provisioning, Developer ID Installer provisioning, notarytool profile creation/use, notarization, stapling, or any paid distribution service."
  - "Using a free Personal Team or Apple Development provisioning workflow as customer distribution, including device registration, expiring provisioning profiles, periodic reprovisioning, or consumer Apple developer credentials."
  - "Creating or requiring a persistent self-signed/local-CA signing authority, consumer certificate trust bootstrap, root certificate installation, or a new signing credential management system."
  - "Completely unsigned packaging or ad-hoc packaging accepted solely because codesign --verify succeeds, without independent ServiceManagement and provenance compatibility proof."
  - "Inventing/faking TeamIdentifier or weakening candidate provenance, rollback ownership, cutover validation, or responsible executable identity checks."
  - "Replacing SMAppService with manual LaunchAgent plist installation, raw launchctl bootstrap ownership, a new daemon, privileged helper, installer framework, updater, permission manager, or alternate lifecycle/state machine."
  - "Changing Runtime MCP semantics, the 20-tool public surface, Runtime kernel/capability architecture, tunnel-client architecture, canonical configuration semantics, or protected Runtime threat-model claims."
  - "Opening System Settings, changing Background Activity approval, installing/activating the candidate, mutating live Runtime/config/tunnel state, or using the production bundle/service identifiers for experimental host mutation."
  - "Disabling Gatekeeper, changing global security policy, using spctl --master-disable, or documenting xattr quarantine removal as the supported consumer path."
  - "Publishing a GitHub Release, creating a version tag, uploading the candidate externally, branch creation, PRs, force push, amend, squash, or unrelated cleanup."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: forbidden
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "The zero-cost signing/package choice is evidence-based and compatible with current macOS rather than assumed."
    evidence_required: "Report records the exact current package/ServiceManagement identity requirements and a bounded comparison of unsigned, ad-hoc, self-signed/local-CA, Personal Team/Apple Development, and any discovered alternative. The selected form has direct current-platform evidence for the product requirements; unsupported forms are rejected explicitly."

  - id: AC-2
    requirement: "The selected form needs no paid Apple distribution authority and no consumer development tooling or credentials."
    evidence_required: "Package invocation and artifact inspection prove no Developer ID certificate, notarization, notary profile, stapling, paid service, consumer signing identity, provisioning profile, Apple developer credential, Xcode/Swift, CPython 3.13, or agent-runtime checkout is required."

  - id: AC-3
    requirement: "Existing ServiceManagement and helper execution semantics survive the zero-cost form without a fallback lifecycle."
    evidence_required: "Source/platform proof demonstrates that Agent Runtime.app and the embedded Runtime LaunchAgent remain valid SMAppService-owned code after the documented Gatekeeper action and normal candidate copy/cutover location change, with no manual LaunchAgent installation and no weakened Background Activity semantics. If this cannot be proven, TASK-0176 is BLOCKED."

  - id: AC-4
    requirement: "Provenance and recovery ownership remain truthful and no weaker than the accepted lifecycle."
    evidence_required: "Candidate handoff, responsible executable identity, strict signature verification, update/cutover/rollback/recovery checks, and exact closure validation continue to reject mismatched/tampered code. No fake TeamIdentifier or bundle-ID-only substitute is accepted. Any serialized contract change is explicitly versioned and backward-safe."

  - id: AC-5
    requirement: "The newcomer flow is accurate for an unidentified/unnotarized zero-cost app."
    evidence_required: "README/docs and deterministic UI/package tests describe the real first-launch warning and bounded Privacy & Security/Open Anyway or equivalent manual-open action, then reuse the accepted native setup and Background Activity flow through healthy Runtime. No notarized/identified-developer claim or global Gatekeeper bypass appears."

  - id: AC-6
    requirement: "One complete immutable zero-cost release bundle is frozen for Fresh-Install Acceptance."
    evidence_required: "Exactly one final package build yields Agent Runtime.app plus Agent Runtime.candidate.json and one complete downloadable archive. Report records exact source revision/tree, candidate closure SHA-256, handoff SHA-256, archive SHA-256, signing form, manifest identity, and package file locations. Revalidation after hashing proves bytes unchanged."

  - id: AC-7
    requirement: "The artifact descends from accepted TASK-0175 and all invalidated package-input verification is rerun narrowly."
    evidence_required: "Git ancestry proves the final source candidate descends from 10c3810729683c6440aa1d86ae22366a04baae39 and preserves TASK-0175 accepted onboarding. Focused affected tests and relevant Swift tests PASS; git diff --check PASS; canonical ./verify runs at most once via the clean direct-local carrier and PASSes on the immutable final source candidate."

  - id: AC-8
    requirement: "TASK-0176 has no production activation or publication consequence."
    evidence_required: "Report proves zero live Runtime/config/ServiceManagement/tunnel mutation, zero Apple credential/notary/trust-root effect, zero tag/release publication, and final tracked repository state is clean/synced after non-force publication of authorized task execution evidence."

