acceptance_criteria:
  - id: AC-1
    requirement: "The reproduced parent Git-control-environment repository-redirection defect is closed."
    evidence_required: "Causal isolated RED demonstrates the exact pre-fix GIT_DIR or materially equivalent repository-control redirection; final focused test proves the same polluted parent environment can no longer redirect trusted Git repository identity/operations away from the configured checkout."
  - id: AC-2
    requirement: "Materially equivalent Git repository/config control-injection families are handled coherently rather than by a one-variable special case."
    evidence_required: "Focused tests and implementation inspection show the bounded deny/scrub policy covers repository/worktree/index/object/config-control classes, including complete handling of numbered config-injection families where applicable."
  - id: AC-3
    requirement: "Normal configured Git operation and required non-control environment behavior remain functional."
    evidence_required: "Existing Git fixture inspection/sync tests and full repository verification remain green; no evidence shows normal authentication/network support was intentionally removed."
  - id: AC-4
    requirement: "Existing runtime trust boundaries do not expand or regress."
    evidence_required: "Four-tool surface, exact root/remote checks, disposable gate, clean -fd, generation binding, verifier PATH-only environment, strict PASS, and no-shell behavior remain unchanged except for the authorized Git automation environment isolation."
  - id: AC-5
    requirement: "Repository-owned verification passes on the exact final implementation."
    evidence_required: "Focused regressions PASS and ./verify exits 0 on the exact implementation commit."
  - id: AC-6
    requirement: "Execution/publication remains bounded."
    evidence_required: "Implementation commit changes only authorized existing files actually needed; separate report commit changes only .agent/tasks/TASK-0005/report.yaml; main and branch topology remain unchanged."

