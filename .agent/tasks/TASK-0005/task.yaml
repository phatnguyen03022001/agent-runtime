structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime/git_ops.py automation environment helper plus existing Git fixture tests."
  rationale: "The reproduced defect fits one existing helper and focused existing tests. No config field, module, public tool, environment framework, repository registry, or runtime redesign is justified."

objective: "Prevent inherited parent-process Git control variables from silently redirecting repository, worktree, index, object-database, ref/config, or equivalent trusted Git semantics away from the configured checkout/profile, while preserving the existing four-tool runtime, trusted-profile model, required Git authentication/network behavior, and all current synchronization/verification guarantees."

scope:
  required_changes:
    - "Use causal TDD on the exact authorized base. Before production mutation, reproduce at least the proven GIT_DIR class in an isolated Git fixture: a poisoned parent Git-control environment can cause trusted Git inspection/operations to observe repository metadata inconsistent with the configured checkout despite cwd/worktree checks. Record the causal RED evidence."
    - "Harden only agent_runtime.git_ops._automation_env (and a tiny adjacent helper/constant if useful) so Git subprocesses do not inherit environment variables that can override or inject repository/worktree/index/object-database/ref/config identity or semantics that the trusted profile and checkout are supposed to determine."
    - "The correction must cover the reproduced repository-redirection class and materially equivalent Git control/config-injection classes. Treat numbered configuration-injection families atomically rather than leaving partial GIT_CONFIG_KEY_*/GIT_CONFIG_VALUE_* state."
    - "Do not blindly scrub every GIT_* variable. Preserve parent environment needed for ordinary process execution and established authentication/network behavior unless a variable is itself part of the proven Git-control boundary. The task does not authorize redesigning credential handling, SSH policy, proxy/TLS behavior, PATH selection, or tunnel configuration."
    - "Do not weaken or replace validate_checkout_root or validate_remote_identity. Their existing checks remain required; environment isolation is an additional precondition making those checks trustworthy."
    - "Add focused regression controls proving a polluted parent Git-control environment cannot redirect inspection/sync to a foreign repository/config, while a normal configured checkout still inspects and synchronizes successfully. Tests must use isolated disposable fixtures and must not mutate any live sibling repository."
    - "If README.md currently makes a materially false statement about Git subprocess environment after this correction, update only the minimum wording needed. Do not expand documentation otherwise."
    - "Run focused regressions and the repository-owned root verifier on the exact final implementation. Produce canonical TASK-0005 report evidence in a separate report-only commit and stop at the Governing Architect review boundary."
  allowed_existing_files_or_components:
    - agent_runtime/git_ops.py
    - tests/test_git_ops.py
    - README.md
    - .agent/tasks/TASK-0005/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Public MCP surface remains exactly get_head(project), sync(project), run_verify(project), get_last_log(project); no tool/signature expansion."
  - "Trusted profile remains the owner of checkout, remote, expected_remote_url, branch, verifier argv, timeout, state root, and disposable policy. Model/MCP input gains no environment or executable-selection control."
  - "Configured checkout exact-worktree-root validation and exact remote identity validation remain intact and become resistant to parent Git-control-variable redirection."
  - "Git subprocesses remain non-interactive and bounded; no shell=True is introduced."
  - "Normal Git authentication/network operation is not intentionally broken by indiscriminate environment stripping."
  - "sync remains destructive only for disposable=true and continues fetch/switch/reset/clean -fd; ignored files remain preserved and clean -fdx remains forbidden."
  - "run_verify verifier environment remains PATH-only as currently designed; this task is about runtime-owned Git subprocesses, not verifier semantic sufficiency or verifier selection."
  - "Generation binding, exact worktree-root checks, flock handoff, strict PASS postconditions, bounded logs, atomic state, and get_last_log race correction from TASK-0004 remain unchanged."
  - "Claude's /bin/true verifier claim, frozen documents taxonomy, promotion ancestry, APPROVED/ACCEPTED vocabulary, and other rejected/deferred blind-spot findings are not implementation authority here."
  - "Branches remain exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not add a new public tool, shell/exec endpoint, arbitrary environment input, profile mutation, orchestration, scheduler, registry, database, or agent framework."
  - "Do not change config schema/version, verifier argv semantics, verifier evidence semantics, or task-to-runtime verifier binding."
  - "Do not redesign remote URL normalization/identity beyond what is strictly required by the reproduced environment defect; the previously alleged url.*.insteadOf bypass is NOT reproduced authority for a change."
  - "Do not delete all GIT_* variables mechanically without classifying their effect and preserving required non-control behavior."
  - "Do not change PATH policy, SSH credentials, proxy/TLS configuration, tunnel configuration, install/start scripts, requirements, or .env handling."
  - "Do not change clean -fd to -fdx, branch topology, main, tags, releases, repository metadata, prior task/report artifacts, or historical commits."
  - "Do not perform unrelated cleanup or split modules for style."

