  status: NOT_APPLICABLE
  source: "Qualification-only continuation"
  rationale: "No product source structure change is authorized. This task consumes the accepted distribution lane and records artifact qualification evidence only."

objective: "Produce exactly one real Agent Runtime distribution candidate through the accepted TASK-0171 distribution lane using an explicitly supplied Developer ID Application identity and an explicitly supplied Apple notarytool keychain-profile locator, obtain a successful Apple notarization result, staple the ticket, verify Gatekeeper/stapler/codesign/provenance on the exact post-staple candidate, and freeze its exact artifact identity for later fresh-install acceptance. Do not install or activate the candidate and do not publish a GitHub Release."

scope:
  required_changes:
    - "Freshly prove exact task base, clean main-only topology, accepted TASK-0171 review, unchanged live Runtime state, and no pending cutover transaction."
    - "Prove product/package-input source bytes at the task base are unchanged from accepted TASK-0171 source candidate 59e570fc... except governance descendants. If any package-input/product byte changed, STOP BLOCKED and do not reuse source qualification."
    - "Reuse TASK-0171 focused/canonical source qualification. Do not rerun canonical ./verify while product/package-input source bytes remain unchanged."
    - "Require an explicit Developer ID Application signing identity and explicit notarytool keychain-profile locator from the execution environment/operator authority. Reject empty/non-Developer-ID identity or empty profile before packaging."
    - "Do not enumerate Keychain identities, search for certificates, inspect unrelated Keychain items, create credentials, mutate signing/notary credentials, or print credential values."
    - "Before the sole distribution build, perform only bounded non-secret capability checks necessary to prove xcrun/codesign/notarytool/stapler availability and the explicit input syntax. If the explicit signing/notary authority is unavailable or invalid, STOP BLOCKED before notarization submission."
    - "Invoke the accepted macos/package_app.sh --distribution lane at most once successfully from the canonical task base. The distribution lane itself owns Developer-ID/hardened-runtime/timestamp signing, notarization submission, stapling, verification, final candidate sealing and candidate publication under build/candidates."
    - "Allow at most one Apple notarization submission. If the submission outcome is unknown, reconcile it using the exact explicit notary profile and available notarytool submission identity/output before any further consequence. Never blind-resubmit."
    - "Record the notarization submission identifier/status if returned, but never record credentials, private keys, passwords or secret profile contents."
    - "After the successful build, independently prove the exact candidate app passes: codesign --verify --deep --strict; Developer ID Application authority; hardened-runtime flag; trusted timestamp; spctl --assess execute PASS; stapler validate PASS; package provenance validation PASS; final candidate handoff validation PASS."
    - "Prove the candidate handoff/closure identity was produced after stapling and binds the exact post-staple app bytes. Record candidate SHA-256, handoff SHA-256, source revision/tree, manifest schema, service_management_contract, TeamIdentifier and record count."
    - "Prove the release bundle contains the checkout-independent install_release.sh and embedded Runtime Python/helper substrate required by TASK-0171."
    - "Do not execute install_release.sh against the live user HOME in this task. Do not install, restart, reconnect, cut over, commit, roll back or recover the live Runtime."
    - "Do not publish a GitHub Release, create a tag, upload an artifact externally, or mutate repository metadata."
    - "On PASS, create report-r1.yaml as the sole tracked child of the task-authoring base, validate/publish non-force, reconcile main cleanly, and stop NEEDS_REVIEW."

