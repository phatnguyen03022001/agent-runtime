      the unique Apple Development selection branch. Execution then rejected a valid task-owned temp
      directory because the bundle guard compared the resolved macOS path /private/tmp/... against
      literal /tmp. The selected literal existed only in process memory and was lost when that bundle
      terminated. This is an execution-bundle path-canonicalization defect, not a Keychain, certificate,
      repository-source, or Runtime defect.
    required_correction: >-
      Re-run the bounded bootstrap under revised authority with all temp-root/path guards resolved and
      proven before identity enumeration. Authorize exactly one replacement codesigning enumeration
      because revision 1 produced no durable identity and made no Keychain mutation. Use canonicalized
      tempfile/realpath semantics, then verify the selected identity on one task-owned temporary
      artifact and persist only AGENT_RUNTIME_CODESIGN_IDENTITY to repo-local .env if verification passes.

