acceptance_criteria:
  - id: AC-1
    requirement: "A unique valid Apple Development identity is discovered under the one-time bounded Keychain authorization, or ambiguity/absence is truthfully reported without arbitrary selection."
    evidence_required: "Exact allowed enumeration command count and bounded identity-selection result."
  - id: AC-2
    requirement: "The selected identity is genuinely usable by codesign and yields a non-null TeamIdentifier on a temporary test-owned artifact."
    evidence_required: "Temporary codesign invocation, strict verification PASS, selected literal display name, and TeamIdentifier only."
  - id: AC-3
    requirement: "The exact selected literal identity is persisted once as AGENT_RUNTIME_CODESIGN_IDENTITY in repository-local gitignored .env with restrictive permissions and unrelated values undisclosed."
    evidence_required: "Key-only equality proof, .gitignore confirmation, file mode, and no repository diff for .env."
  - id: AC-4
    requirement: "No production source, real candidate, installed/live Runtime, tunnel, lifecycle, runtime.env, or Keychain contents are mutated."
    evidence_required: "Explicit preservation evidence and changed-path review."
  - id: AC-5
    requirement: "Canonical report publishes non-force to dev with main unchanged."
    evidence_required: "Fresh remote refs, report-only lineage, and clean designated working tree."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh exact-base and clean-tree preflight; confirm .env is gitignored without printing its contents."
      required: true
    - id: CHECK-2
      command_or_check: "Run exactly one /usr/bin/security find-identity -v -p codesigning and apply the deterministic Apple Development selection rule."
      required: true
    - id: CHECK-3
      command_or_check: "Sign and strictly verify one temporary test-owned artifact using exactly the selected identity; record TeamIdentifier; delete only task-owned temp artifact."
      required: true
    - id: CHECK-4
      command_or_check: "Persist only AGENT_RUNTIME_CODESIGN_IDENTITY to local .env, mode 0600, prove key-only exact equality, and prove .env remains untracked/ignored."
      required: true
    - id: CHECK-5
      command_or_check: "Fresh-prove no repository source diff beyond report publication, no live mutation, non-force dev publication, clean working tree, and unchanged main."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Architect review of exact report, bounded Keychain command evidence, temp codesign proof, and local-config preservation evidence."
    expected_signal: "One durable repo-local operator-authorized signing identity is available for a fresh candidate-freeze task without future manual copy/paste."

