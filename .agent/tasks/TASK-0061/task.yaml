  - id: AC-2
    requirement: "The selected identity successfully signs and strictly verifies one temporary test-owned artifact and yields a non-null TeamIdentifier."
    evidence_required: "Exact-identity temporary codesign/verify PASS, selected-identity SHA-256 digest, TeamIdentifier non-null=true, and TeamIdentifier SHA-256 digest."
  - id: AC-3
    requirement: "The exact selected literal identity is persisted once as AGENT_RUNTIME_CODESIGN_IDENTITY in repo-local ignored .env with mode 0600; unrelated values remain undisclosed and unchanged."
    evidence_required: "Key-only equality PASS, selected-identity SHA-256 digest matching AC-2, duplicate-key guard, file mode, ignored/untracked proof, and no literal identity disclosure."
  - id: AC-4
    requirement: "No production source, candidate, installed/live Runtime, tunnel, lifecycle, runtime.env, or Keychain contents are mutated."
