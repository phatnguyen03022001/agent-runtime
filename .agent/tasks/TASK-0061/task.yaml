structure_authority:
  status: RESOLVED
  source: "Existing repo-local ignored .env policy and correction-only bootstrap flow."
  rationale: "No production source or architecture change is required."

objective: >-
  Complete the same one-time operator-authorized signing identity bootstrap after revision 1 failed on an invalid /tmp versus /private/tmp guard. Perform every non-sensitive preflight and canonical temp-root guard before identity discovery, then run exactly one replacement bounded codesigning identity enumeration, verify the uniquely selected Apple Development identity on one temporary test-owned artifact, and persist only its exact literal name as AGENT_RUNTIME_CODESIGN_IDENTITY in the repository-local gitignored .env.

scope:
  required_changes:
    - "Fresh-resolve local HEAD and origin/dev and require both equal the exact handoff base. Require designated working tree clean."
    - "Before any Keychain command, complete all non-sensitive preflight: confirm .env is ignored/untracked without printing it; establish a task-owned temporary root; canonicalize the system temp root and task temp root with realpath/Path.resolve semantics; prove the task root is a descendant of the canonical system temp root. Never compare resolved /private/tmp paths against literal /tmp."
    - "Revision 1 already consumed one enumeration. Revision 2 authorizes exactly one replacement invocation of /usr/bin/security find-identity -v -p codesigning solely because the prior selected literal was lost by the execution guard defect. No further enumeration is authorized."
    - "Parse the replacement enumeration in-process. If exactly one valid display name begins with 'Apple Development:', select it. If zero, report BLOCKED. If more than one, stop OPERATOR_INPUT_REQUIRED and expose only the candidate display names needed for operator choice. Do not persist SHA-1 fingerprints or unrelated identities."
    - "After unique selection, retain the selected literal in-process and, if needed for crash-safe command composition, only in a mode-0600 task-owned temp file inside the already-validated temp root. Never place it in repository history or chat output."
    - "Verify exactly that selected identity on one task-owned temporary signable artifact. Run codesign signing, /usr/bin/codesign --verify --strict, and read only the resulting TeamIdentifier. Require non-null TeamIdentifier. Cleanup only task-owned temporary artifacts."
    - "Only after temporary signing verification passes, add or replace exactly one AGENT_RUNTIME_CODESIGN_IDENTITY entry in /Users/tienphat/Developer/agent-runtime/.env. If the key is absent, append it; if exactly one exists, replace that entry; if duplicate entries exist, fail closed before writing. Preserve unrelated existing .env bytes/order as far as practical and never print unrelated values."
    - "Set/preserve .env mode 0600. Read back only AGENT_RUNTIME_CODESIGN_IDENTITY and prove exact equality with the selected literal without sourcing or echoing the whole file. Prove .env remains ignored and untracked."
    - "Do not invoke freeze_candidate.py, package_app.sh, install.sh, candidate cutover, Runtime lifecycle commands, or tunnel lifecycle commands."
    - "Update the canonical TASK-0061 report with revision-2 evidence, publish it report-only to dev non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - "/Users/tienphat/Developer/agent-runtime/.env as local ignored operator configuration"
    - ".agent/tasks/TASK-0061/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Keychain remains read-only; no certificate, key, password, trust setting, or Keychain item is created, imported, deleted, modified, unlocked, or exported."
  - "Exactly one replacement security find-identity -v -p codesigning invocation is authorized in revision 2; combined historical count after success is two because revision 1's result was lost by the guard defect."
  - "All temp-root/path guards complete before the replacement enumeration."
  - "No arbitrary identity selection occurs when multiple Apple Development identities are valid."
  - "Only AGENT_RUNTIME_CODESIGN_IDENTITY may be added/replaced in repository-local .env; unrelated values remain undisclosed and semantically unchanged."
  - "The selected identity must sign and strictly verify the temporary artifact with a non-null TeamIdentifier before .env persistence."
  - "No real Agent Runtime candidate freeze/sign/install/activation occurs."
  - "Installed Runtime, live tunnel/control-plane connection, port 8080, runtime.env, desired-state marker, ServiceManagement/launchd state, live transaction, installed app bytes, System Settings, TCC, and BTM remain untouched."

forbidden_changes:
  - "Do not run more than the one replacement security find-identity invocation."
  - "Do not run security find-certificate, dump-keychain, find-generic-password, find-internet-password, export, import, add-trusted-cert, unlock-keychain, set-key-partition-list, or broader Keychain commands."
  - "Do not expose private keys, certificate bodies, passwords, API keys, runtime.env values, unrelated .env values, or the selected identity in repository artifacts beyond the report fields explicitly required by this task."
  - "Do not invoke real candidate freeze/package/install/cutover or mutate production Runtime, packaging, lifecycle, Swift, tests, dependencies, README, or verification source."
  - "Do not lifecycle-mutate Runtime/tunnel or modify main, tags, releases, architect-profile, agent-skills, agent-standards, or agent-documents."
  - "Do not delegate to another ChatGPT, Codex, Claude, Antigravity, or nested executor."

