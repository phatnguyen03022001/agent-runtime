structure_authority:
  status: RESOLVED
  source: "Existing repo-local ignored .env policy and correction-only bootstrap flow."
  rationale: "No production source or architecture change is required."

objective: >-
  Complete the same operator-authorized signing identity bootstrap with all non-identity-dependent
  temporary artifact and codesign mechanics proven before discovery. Then run exactly one final
  replacement bounded codesigning identity enumeration, deterministically select a unique Apple
  Development identity, verify exactly that identity on one task-owned temporary artifact, and persist
  only its literal value as AGENT_RUNTIME_CODESIGN_IDENTITY in the repository-local gitignored .env.

scope:
  required_changes:
    - "Fresh-resolve local HEAD and origin/dev and require both equal the exact handoff base. Require designated working tree clean."
    - "Before any Keychain command, confirm .env is ignored/untracked without printing it, reject duplicate AGENT_RUNTIME_CODESIGN_IDENTITY entries, create a task-owned temporary root, canonicalize system/task temp roots with realpath/Path.resolve semantics, and prove the task root is a descendant of the canonical system temp root."
    - "Before any Keychain command, construct the complete temporary signing path. Create task-owned Mach-O probe copies from /usr/bin/true using byte-only copy semantics such as explicit binary read/write or shutil.copyfile. Do NOT use shutil.copy2, shutil.copystat, shutil.copy, metadata-preserving cp flags, or any operation intended to preserve source xattrs/file flags/ownership metadata. Set executable permissions explicitly on the new task-owned files."
    - "Before any Keychain command, prove the temp artifact itself is signable by ad-hoc signing a separate preflight probe with /usr/bin/codesign --force --sign -, then run /usr/bin/codesign --verify --strict on that preflight probe. This ad-hoc probe must not access or enumerate Keychain identities."
    - "Only after every non-sensitive path/copy/ad-hoc-signing preflight passes, revision 3 authorizes exactly one final replacement invocation of /usr/bin/security find-identity -v -p codesigning. Revisions 1 and 2 already consumed their respective attempts; no additional enumeration beyond this single revision-3 invocation is authorized."
    - "Parse the revision-3 enumeration in-process. If exactly one valid display name begins with 'Apple Development:', select it. If zero exist, report BLOCKED. If more than one exist, stop OPERATOR_INPUT_REQUIRED and disclose only the candidate display names needed for operator choice. Do not persist SHA-1 fingerprints or unrelated identities."
    - "Immediately after unique selection, retain the exact selected literal in a mode-0600 task-owned temp file inside the already-validated temp root before running any identity-dependent command. Do not print the literal in chat or repository artifacts."
    - "Using the unsigned identity probe already constructed before discovery, sign it with exactly the selected identity, run /usr/bin/codesign --verify --strict, and read only whether TeamIdentifier is non-null plus a SHA-256 digest of the TeamIdentifier for report evidence. Do not publish the TeamIdentifier literal."
    - "Only after exact-identity signing verification passes, add or replace exactly one AGENT_RUNTIME_CODESIGN_IDENTITY entry in /Users/tienphat/Developer/agent-runtime/.env. Preserve unrelated existing .env bytes/order as far as practical and never print unrelated values."
    - "Set/preserve .env mode 0600. Read back only AGENT_RUNTIME_CODESIGN_IDENTITY, prove exact equality with the selected literal in-process, and record only a SHA-256 digest of the literal in the report. Prove .env remains ignored and untracked."
    - "Cleanup task-owned temporary artifacts after persistence/evidence capture. Never delete or rewrite unrelated temp files."
    - "Do not invoke freeze_candidate.py, package_app.sh, install.sh, candidate cutover, Runtime lifecycle commands, or tunnel lifecycle commands."
    - "Update the canonical TASK-0061 report with revision-3 evidence, publish it report-only to dev non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - "/Users/tienphat/Developer/agent-runtime/.env as local ignored operator configuration"
    - ".agent/tasks/TASK-0061/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Keychain remains read-only; no certificate, key, password, trust setting, or Keychain item is created, imported, deleted, modified, unlocked, or exported."
  - "Exactly one revision-3 replacement security find-identity -v -p codesigning invocation is authorized; no fourth enumeration is authorized by this task."
  - "All path, byte-copy, executable-permission, and ad-hoc codesign/strict-verify mechanics complete successfully before the revision-3 enumeration."
  - "No metadata-preserving source copy operation is used for temporary signing probes."
  - "No arbitrary identity selection occurs when multiple Apple Development identities are valid."
  - "The selected identity literal is never committed, reported, or printed; only its local .env value and report SHA-256 digest may exist after success."
  - "Only AGENT_RUNTIME_CODESIGN_IDENTITY may be added/replaced in repo-local .env; unrelated values remain undisclosed and semantically unchanged."
  - "The selected identity must sign and strictly verify the temporary artifact with a non-null TeamIdentifier before .env persistence."
  - "No real Agent Runtime candidate freeze/sign/install/activation occurs."
  - "Installed Runtime, live tunnel/control-plane connection, port 8080, runtime.env, desired-state marker, ServiceManagement/launchd state, live transaction, installed app bytes, System Settings, TCC, and BTM remain untouched."

forbidden_changes:
  - "Do not run more than the one revision-3 replacement security find-identity invocation."
  - "Do not run security find-certificate, dump-keychain, find-generic-password, find-internet-password, export, import, add-trusted-cert, unlock-keychain, set-key-partition-list, or broader Keychain commands."
  - "Do not use shutil.copy2, shutil.copystat, shutil.copy, metadata-preserving cp options, or source-metadata cloning for temporary signing probes."
  - "Do not expose the selected signing identity literal, private keys, certificate bodies, passwords, API keys, runtime.env values, unrelated .env values, or literal TeamIdentifier in repository artifacts or chat output."
  - "Do not invoke real candidate freeze/package/install/cutover or mutate production Runtime, packaging, lifecycle, Swift, tests, dependencies, README, or verification source."
  - "Do not lifecycle-mutate Runtime/tunnel or modify main, tags, releases, architect-profile, agent-skills, agent-standards, or agent-documents."
  - "Do not delegate to another ChatGPT, Codex, Claude, Antigravity, or nested executor."

