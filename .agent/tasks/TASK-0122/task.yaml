  if_unsatisfied: CURRENT_PHASE_CAPABILITY_UNAVAILABLE

turn_atomicity:
  requirement: "The exact 11/11 surface preflight and the one screen_capture call must occur in the same assistant execution turn with no intervening user message."
  retries: 0

surface_preflight:
  required_exact_public_tools:
    - terminal_exec
    - terminal_start
    - terminal_poll
    - terminal_control
    - terminal_resize
    - capacity_observer
    - fs_read_batch
