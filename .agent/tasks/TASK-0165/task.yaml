proven_root_cause:
  component: agent_runtime/session.py
  functions:
    - start
    - _dispatch_durable
    - reap_once
    - _refresh_durable_session
  race: >
    start() inserts a runtime_restart session into the global session map with
    status/lifecycle STARTING before _dispatch_durable has published its first
    durable state.json. The live manager's background reaper scans that session.
    reap_once currently calls _refresh_durable_session for every durable session,
    including STARTING bootstrap sessions. If the reaper wins before state.json
    exists, read_snapshot fails and _refresh_durable_session permanently latches
    DURABLE_STATE_CORRUPT. The dispatch path can then publish and complete a valid
    exited/COMPLETED state, but retained lookup remains poisoned by the earlier
    in-memory fault latch.
  why_sealed_smokes_missed_it: >
    Existing durable unit/sealed smoke managers use start_reaper=False, so they
    prove finalization semantics but do not exercise the live global-manager
    bootstrap/reaper concurrency.

objective: >
  Establish a single bootstrap owner boundary for runtime_restart sessions:
  while a durable session is still STARTING, _dispatch_durable is the sole
  reconciler of pre-publication state and the background reaper must not call
  _refresh_durable_session on it. Once dispatch applies the first coherent
  durable snapshot and the session becomes running/exited, normal reaper
  reconciliation resumes unchanged. Preserve TASK-0162 finalization TOCTOU
  semantics, genuine corruption/owner-loss fail-closed behavior, one-effect
  identity semantics and all existing capacity/retention contracts.

required_implementation:
  - "Change the smallest durable reaper/bootstrap boundary in agent_runtime/session.py."
  - "reap_once must not call _refresh_durable_session for runtime_restart sessions whose in-memory status is starting / lifecycle STARTING."
  - "Do not silently convert or clear any durable fault already established after bootstrap ownership has transferred."
  - "Do not weaken _refresh_durable_session corruption handling for running/exited sessions."
  - "Do not change _DURABLE_FINALIZATION_GRACE_SECONDS=2.0."
  - "Do not change reaper interval defaults merely to hide the race."
  - "Do not delay runner execution or add retries/sleeps to make timing favorable."
  - "Preserve Runtime 0.5.0, ToolContract Kernel 2 and capability/tool counts."

