proven_root_cause:
  durable_dispatch_path: "_dispatch_durable -> _minimal_child_env -> sys.executable -m agent_runtime.durable_pipe_runner"
  normal_runtime_startup:
    sys_dont_write_bytecode: true
    PYTHONDONTWRITEBYTECODE: "1"
  durable_bootstrap_environment:
    preserves:
      - PATH
      - HOME
      - USER
      - TMPDIR
      - LANG
      - LC_*
    PYTHONDONTWRITEBYTECODE_present: false
  consequence: >
    The durable runner interpreter imports agent_runtime and dependencies from
    the signed installed application and writes Python bytecode caches into the
    sealed app bundle. A successful runtime_restart durable job therefore
    invalidates strict codesign and installed package identity.

objective: >
  Make the smallest correction that prevents the durable runner bootstrap from
  writing Python bytecode into the signed Runtime payload, preserve all terminal
  user-command environment semantics outside that bootstrap, prove the fix with
  focused tests and one effective qualification, build one new immutable Runtime
  0.5.0 package, and prove a real runtime_restart durable job leaves the sealed
  candidate byte-for-byte/codesign intact. Do not repair or restart the installed
  Runtime in this task.

required_implementation:
  - "In agent_runtime/session.py, inject PYTHONDONTWRITEBYTECODE=1 into the environment used specifically to spawn sys.executable -m agent_runtime.durable_pipe_runner."
  - "Do not add PYTHONDONTWRITEBYTECODE to the global _minimal_child_env() preserved-name contract."
  - "Do not change the environment contract for user PTY/pipe commands or terminal_exec."
  - "Do not redesign durable execution, schemas, identity, retention, recovery, capacity or process semantics."
  - "Keep Runtime version 0.5.0, ToolContract Kernel 2, 21 known / 20 advertised capabilities."

