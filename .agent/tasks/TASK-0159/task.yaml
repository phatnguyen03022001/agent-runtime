sealed_candidate_runtime_proof:
  purpose: >
    Prove the corrected packaged Runtime can execute a real runtime_restart
    durable job from inside the signed candidate without modifying its sealed
    application payload.
  preconditions:
    - "New exact package is already sealed and strict-codesign-valid."
    - "Capture candidate SHA-256/handoff SHA-256 and complete candidate closure before execution."
    - "No installation or cutover is performed."
  execution:
    - "Use the packaged Runtime's own bundled Python/interpreter and packaged agent_runtime modules."
    - "Run a real TerminalSessionManager runtime_restart durable pipe job with a fresh temporary durable state root and a caller-known start_identity."
    - "Use a short deterministic target command with bounded output."
    - "Poll to terminal natural-exit success."
    - "Perform retained lookup by the same start_identity and prove the same session is returned without respawn."
    - "Do not intentionally restart the installed Runtime."
  after_execution_require:
    - "No __pycache__ directory or *.pyc file is added anywhere inside the candidate app bundle."
    - "Candidate closure after execution equals the exact pre-execution closure."
    - "Candidate SHA-256 after execution equals the exact pre-execution candidate SHA-256."
    - "Handoff SHA-256 unchanged."
    - "Strict deep codesign PASS after execution."
    - "Pinned provenance validation PASS after execution."
  failure_policy: >
    If any sealed candidate byte changes or codesign/provenance fails, stop
    BLOCKED. Do not clean the candidate and pretend the proof passed.

