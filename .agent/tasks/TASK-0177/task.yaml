    role: "Confirms macOS can produce non-Developer-ID app artifacts, but does not establish SMAppService compatibility or trusted publisher identity."
    precedence: 8

structure_authority:
  status: RESOLVED
  source: "Existing package_app.sh + package_provenance.py + candidate_cutover.py + ServiceManagementController.swift"
  rationale: "First attempt the smallest redesign: preserve SMAppService, use ad-hoc code sealing with stable explicit designated requirements for continuity, and redefine provenance truthfully around exact package closure plus explicit responsible-code continuity metadata. Do not introduce a second lifecycle or cryptographic credential system unless evidence later proves this insufficient."

objective: "Preserve the zero-cost native prebuilt product by replacing the paid TeamIdentifier/Developer-ID ownership assumption with a truthful zero-cost code-identity contract. First prove on a disposable non-production SMAppService fixture that ad-hoc code using stable explicit signing identifiers/designated requirements can register, launch, unregister, and survive a changed-binary update/re-registration without Developer ID. Only after that proof passes, evolve Agent Runtime package provenance/cutover/recovery to treat ad-hoc signing as integrity plus code-continuity metadata rather than publisher authentication, preserve legacy signed predecessor handling, replace the stale paid distribution lane with one zero-cost prebuilt lane, fully qualify the source, and freeze one immutable local artifact for Fresh-Install Acceptance."

scope:
  required_changes:
    - "Freshly prove clean canonical main at the exact task base, accepted TASK-0176 BLOCKED review ancestry, and unchanged TASK-0175 onboarding authority before mutation."
    - "Before Agent Runtime product mutation, create exactly one disposable non-production SMAppService probe under ignored build output using unique bundle/service identifiers that cannot collide with com.picmao.agent-runtime or installed Runtime labels."
    - "The disposable probe must compare at least two different helper/app builds that share explicit stable code-signing identifiers and explicit stable designated requirements under ad-hoc signing. It must prove the bounded lifecycle needed by the product: register, observable enabled/requires-approval state as applicable, helper launch/ownership, unregister, changed-binary replacement or update/re-registration, and final cleanup."
    - "The probe may mutate only its own disposable ServiceManagement registration and files. It must never register, unregister, replace, stop, restart, or inspect secrets from the production Agent Runtime ServiceManagement identities. Reconcile and remove all disposable registration/files before implementation continues."
    - "If the disposable SMAppService probe cannot prove stable changed-binary continuity with ad-hoc explicit DRs, STOP BLOCKED before product mutation. Do not silently fall back to manual LaunchAgents in this task; that is a separate architecture boundary."
    - "If the probe passes, preserve SMAppService as the product lifecycle authority. Do not add direct ~/Library/LaunchAgents ownership, raw launchctl bootstrap as the normal path, daemon/privileged-helper architecture, installer framework, updater, or second lifecycle state machine."
    - "Add one zero-cost prebuilt package mode using ad-hoc code sealing. Responsible executables whose continuity matters to SMAppService/provenance must receive deterministic explicit signing identifiers and explicit stable designated requirements; nested executable code must remain correctly sealed and covered by exact candidate closure."
    - "Do not use TeamIdentifier as zero-cost owner identity and do not serialize a fake team value. If candidate/provenance serialization changes, version the contract and make the zero-cost representation explicitly identify its signing mode and exact responsible-code continuity properties."
    - "Redefine zero-cost provenance truthfully: strict code-signature validation proves code sealing/integrity; exact candidate closure and external handoff prove the exact artifact bytes/lineage; explicit signing identifier/DR checks prove expected continuity metadata. None of these may be described as Apple publisher authentication or Developer ID trust."
    - "Preserve legacy signed candidate/predecessor compatibility needed for current installs. Existing legacy candidate schemas with real TeamIdentifier remain validated by their legacy rules. New zero-cost candidates use the new contract. Recovery/rollback must validate each snapshot against the identity contract recorded for that snapshot rather than requiring a fake shared TeamIdentifier across legacy and zero-cost generations."
    - "Preserve fail-closed tamper detection across candidate validation, cutover, rollback, recovery, and pinned handoff validation. Mismatched closure, signing mode, signing identifier, designated requirement, executable graph, source revision/tree, or handoff identity must fail."
    - "Update the threat model and installation documentation to state the intentional security trade-off: zero-cost ad-hoc distribution has no Apple-authenticated publisher identity and Gatekeeper may require a bounded manual Open/Open Anyway action. The product does not claim Developer ID/notarization trust. Same-UID limitations remain explicit."
    - "Delete or make unreachable the active Developer-ID/notarization/stapling package lane and stale current-product documentation once the zero-cost replacement is qualified. Preserve all historical TASK-0172/TASK-0173 governance artifacts unchanged."
    - "Preserve TASK-0174/TASK-0175 native onboarding and the existing consumer sequence after launch: API key, tunnel ID, Runtime Git identity, workspace picker, Background Activity approval if required, existing cutover/readiness/doctor gates, Runtime healthy."
    - "Consumer requirements remain: no agent-runtime checkout, host CPython 3.13, Xcode/Swift, signing identity, Apple developer credentials, notary profile, or custom trust root. Existing official tunnel-client and Runtime configuration inputs remain separate prerequisites."
    - "Do not add a project signing-key/CA credential system in this task. The selected contract intentionally limits zero-cost provenance to exact artifact integrity/lineage plus stable code-continuity metadata; any future publisher-authentication layer requires separate authority."
    - "Add focused regression coverage for the new and legacy provenance schemas, stable DR/signing-identifier validation, cross-generation rollback/recovery, tamper rejection, package graph sealing, no-fake-TeamIdentifier behavior, and unchanged native onboarding/lifecycle semantics."
    - "Run relevant Swift ServiceManagement/onboarding tests and focused Python package/provenance/cutover/preflight tests. Reuse unaffected TASK-0175 evidence only where exact bytes and predicates remain equivalent."
    - "Run canonical ./verify at most once on the immutable final source candidate through a direct local non-Agent-Runtime-durable carrier consistent with TASK-0175."
    - "After final source qualification, build at most one real zero-cost release candidate and one complete archive containing Agent Runtime.app plus Agent Runtime.candidate.json. Do not install/activate it against the live production Runtime in this task."
    - "Independently record and revalidate the final source revision/tree, zero-cost signing mode, responsible signing identifiers/DRs, candidate closure SHA-256, handoff SHA-256, archive SHA-256, manifest identity, and exact local artifact paths."
    - "Do not publish a GitHub Release or tag. The exact immutable local artifact is the handoff to the next Fresh-Install Acceptance task."
    - "On PASS, report NEEDS_REVIEW. On any failed platform/security/lifecycle predicate, report BLOCKED without weakening the contract."

