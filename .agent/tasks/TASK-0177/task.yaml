    requirement: "Ad-hoc explicit designated requirements are proven viable for the existing SMAppService lifecycle before product mutation."
    evidence_required: "One revision-2 disposable fixture mirrors the real split-v1 refresh sequence and proves generation-specific execution from exact-label launchd state: v1 helper last exit status 71, Runtime unregister/absence, byte-distinct v2 replacement with the same explicit signing identifiers/DRs, main-app continuity, v2 Runtime register, v2 helper last exit status 72, and full cleanup. Production identifiers/state are untouched."

  - id: AC-2
    requirement: "The zero-cost package has a truthful, stable responsible-code continuity contract without fake Apple identity."
    evidence_required: "Artifact inspection proves ad-hoc signatures, TeamIdentifier absent, deterministic expected signing identifiers/DRs on responsible executables, strict signature validity, and exact closure coverage. Tests reject wrong signing mode/identifier/DR and any invented team value."

  - id: AC-3
    requirement: "Provenance/cutover/recovery remain fail-closed across legacy signed and new zero-cost generations."
    evidence_required: "Versioned candidate/handoff tests prove legacy TeamIdentifier candidates keep legacy validation, new candidates use the zero-cost identity contract, each rollback snapshot is checked against its own recorded contract, cross-generation transitions are deterministic, and tamper/mismatch cases fail."

  - id: AC-4
    requirement: "The security boundary is explicit rather than overstated."
    evidence_required: "THREAT_MODEL/INSTALL/README state that zero-cost ad-hoc packaging provides code sealing and project artifact integrity/lineage checks but no Apple-authenticated publisher identity or notarization trust; supported Gatekeeper handling is bounded manual user approval only."

  - id: AC-5
    requirement: "The newcomer/lifecycle product remains one coherent implementation."
    evidence_required: "Existing native setup, Background Activity handling, canonical config, candidate transaction, readiness, doctor, rollback/recovery, tunnel identity, and 20-tool public contract regressions pass with no second lifecycle/configuration mechanism."

  - id: AC-6
    requirement: "The final source candidate is fully qualified with no production consequence."
    evidence_required: "Focused Python and Swift suites PASS, git diff --check PASS, canonical ./verify runs at most once via the clean direct-local carrier and PASSes, and zero production Runtime/ServiceManagement/config/tunnel/Apple/tag/release effect is recorded."

