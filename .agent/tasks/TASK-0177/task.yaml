    role: "Two different Mach-O binaries ad-hoc signed with the same explicit identifier and designated requirement both passed strict codesign and emitted the identical DR: designated => identifier com.picmao.agent-runtime. This proves build-specific CDHash DR is avoidable, but does not prove SMAppService viability or publisher authenticity."
    precedence: 7
