invariants:
  - "Distribution remains zero-cost with no Apple Developer Program, Developer ID, notarization, notarytool, stapling, paid signing service, or consumer developer credential."
  - "SMAppService remains the preferred product lifecycle and may be preserved only if the disposable changed-binary ad-hoc custom-DR proof passes."
  - "Zero-cost code identity is never called Apple publisher authentication. TeamIdentifier is absent for ad-hoc code and must remain absent rather than fabricated."
  - "Legacy real-TeamIdentifier package evidence remains interpretable for existing predecessors; historical schemas are not rewritten."
  - "Exact closure/handoff/source-lineage validation remains fail-closed and continues to detect byte tampering."
  - "Native newcomer onboarding, canonical runtime.env semantics, tunnel identity, readiness/doctor gates, cutover transaction semantics, and the 20-tool Runtime public surface remain unchanged unless this task explicitly changes only identity/provenance handling."
  - "No production Runtime, ServiceManagement identity, config, tunnel, Apple account state, trust root, tag, or public release is mutated."
  - "MAIN_ONLY repository topology remains unchanged."

forbidden_changes:
  - "Fake TeamIdentifier, bundle-ID-only claims of publisher authenticity, or documentation that implies ad-hoc code is Developer-ID trusted."
  - "Manual LaunchAgent/raw launchctl lifecycle fallback, daemon/privileged-helper architecture, second installer/updater/state machine, or parallel configuration system."
  - "New project signing private key, self-signed CA, custom trust root, certificate installer, or credential-management subsystem."
  - "Developer ID, Apple Developer Program enrollment, notarization, stapling, notarytool profile, paid signing service, Personal Team reprovisioning, or consumer Apple developer credentials."
  - "Global Gatekeeper disabling or quarantine removal as the supported consumer path."
  - "Production ServiceManagement register/unregister/update during the disposable probe."
  - "Changes to MCP tool semantics, Runtime kernel/capability architecture, tunnel-client architecture, or unrelated refactor/cleanup."
  - "Git branch creation, PR, force push, amend, squash, tag, or public release."

