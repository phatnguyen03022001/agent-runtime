    evidence_required: "Static source-byte equality for contracts.py/server.py/timing.py plus disposable-copy dynamic proof showing exactly terminal_exec, terminal_start, terminal_poll, terminal_control, terminal_resize, capacity_observer, fs_read_batch."
  - id: AC-6
