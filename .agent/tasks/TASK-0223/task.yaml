proven_root_cause:
  id: F-0222-001
  classification: premature_timeout_to_owner_loss_projection
  code_site: agent_runtime/session.py
  current_behavior: "bootstrap.wait(timeout=2.0) immediately projects DURABLE_OWNER_LOST on TimeoutExpired."
  evidence:
    - "Remote checkpoint caa8422d40b6bcbfe02e09576de2af2ea5485c7c passed canonical verify 63/63, 936 tests with durable source/test blobs identical to the later failing checkpoint."
    - "Remote checkpoint 0e5f00a98ae79c1c9584bf8fa39e200d100942b6 failed only because one durable bootstrap process exceeded the fixed 2-second parent wait."
    - "The exact failing test passes 30/30 in isolated local execution."
    - "A controlled 2.5-second runner-start delay causes current manager.start to raise DURABLE_OWNER_LOST, after which authoritative durable state is running and both runner and target process identities verify valid."
  conclusion: "The legacy 2-second observation window means ownership outcome is not yet known; it is not proof that ownership is lost."

approved_state_machine:
  operator_approved: true
  overall_deadline:
    clock: monotonic
    count: 1
    derivation: "Preserve the accepted maximum pre-authoritative-state waiting envelope from the legacy fast observation window (~2s) plus the existing state-publication reconciliation window (5s); do not invent a larger replacement timeout."
    rule: "Compute the single overall deadline once before bootstrap dispatch/reconciliation and never reset or extend it."
  transitions:
    - condition: "valid durable state appears during fast observation"
      action: "Treat the durable state as authoritative input and reconcile its actual lifecycle/ownership outcome normally."
    - condition: "bootstrap exits during fast observation"
      action: "Perform a final durable-state re-read before classification. If authoritative state exists, reconcile it normally. If no authoritative state exists after the final read, fail closed under the existing pre-effect/effect-state truth."
    - condition: "bootstrap remains alive and no authoritative state exists after the fast observation window"
      action: "Continue condition-based reconciliation until the one overall monotonic deadline. Do not classify owner loss merely because the fast observation window expired."
    - condition: "valid running state appears before overall deadline"
      action: "Require positive exact owner/process reconciliation; if valid, accept bootstrap."
    - condition: "valid terminal state appears before overall deadline"
      action: "Treat terminal state as authoritative and preserve/propagate its actual terminal outcome. Do not convert terminal state generically to success."
    - condition: "bootstrap exits during bounded reconciliation"
      action: "Perform a final durable-state re-read, then classify from authoritative state if present; only otherwise fail closed."
    - condition: "overall deadline exhausted with no authoritative state/ownership outcome"
      action: "Project DURABLE_OWNER_LOST with reconciliation-required unknown-effect semantics."
  invariants:
    - "fast observation timeout != owner loss"
    - "one monotonic overall deadline; no deadline reset"
    - "no arbitrary replacement timeout"
    - "final state re-read before declaring ownership loss after bootstrap exit"
    - "no duplicate spawn, respawn, signal, kill or guessed completion merely because observation is delayed"
    - "six-field runner/process identity verification remains exact"
    - "corrupt/mixed-generation/integrity state remains fail-closed"

proof_lanes:
  lane_a_durable_bootstrap:
    mode: MUTATING_STABILIZATION
    objective: "Close F-0222-001 with the smallest condition-based reconciliation change."
    allowed_product_files:
      - agent_runtime/session.py
    allowed_test_files:
      - tests/test_durable_pipe.py
      - tests/test_durable_pipe_restart.py
    secondary_files_only_if_direct_evidence_requires:
      - agent_runtime/durable_pipe.py
      - agent_runtime/durable_pipe_runner.py
    required_regressions:
      - "Delayed-valid case: bootstrap remains unresolved for >2s, then publishes valid running state with valid runner+target ownership before overall deadline; manager.start must not raise DURABLE_OWNER_LOST."
      - "Stuck/no-state case: bootstrap remains unresolved and publishes no authoritative state; execution must fail closed within the one overall deadline without duplicate effect or respawn."
      - "Exit-before-state race: bootstrap exit must trigger final state re-read before classification; authoritative state discovered by that read must be reconciled, not discarded."
      - "Terminal-state case: authoritative terminal state must propagate its actual terminal semantics, including non-success terminal outcomes."
    mutation_rules:
      - "Do not implement the fix by only changing 2.0 to a larger constant."
      - "Prefer condition/state-based observation."
      - "Do not change unrelated durable hard-wall, retention, output, admission, cursor, process environment or public contracts."
      - "Do not weaken owner identity or durable-state integrity validation."
    focused_verification:
      - "RED/GREEN the delayed-valid regression."
      - "PASS stuck/no-state bounded failure regression."
      - "PASS exit-before-state final re-read regression."
      - "PASS terminal-outcome propagation regression."
      - "PASS full tests.test_durable_pipe."
      - "PASS full tests.test_durable_pipe_restart."
      - "Stress the former remote failing path under bounded scheduling delay."
