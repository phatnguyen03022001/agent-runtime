durable_implementation_rules:
  - "First write a deterministic regression for delayed-but-valid bootstrap: delay bootstrap beyond the legacy 2-second wait while allowing valid state and exact runner/process identity to appear inside the total reconciliation window; current code must RED and corrected code must GREEN."
  - "Write a deterministic negative regression for genuinely stuck/no-state bootstrap; it must still terminate in bounded time and fail closed without duplicate effect, respawn or guessed completion."
  - "Preserve exact six-field process-instance verification and current corrupt/mixed-generation/integrity fail-closed semantics."
  - "Prefer condition/state-based waiting over arbitrary sleep extension."
  - "Do not change unrelated durable lifetime, retention, output, admission or public contract semantics."
  - "Any timing constant introduced or changed must represent an explicit reconciliation bound and be covered by both positive and negative tests."

incremental_verification:
  - "Focused durable tests may be repeated during stabilization."
  - "Before each remote implementation checkpoint, require focused affected suites PASS and exactly one canonical ./verify on that exact checkpoint."
  - "If remote evidence requires further in-boundary mutation, a new checkpoint may run canonical ./verify again; this is STABILIZE, not QUALIFY."
  - "Do not replay canonical verify on an unchanged checkpoint."
  - "Packaging focused suites must run whenever packaging source/test files change."
  - "A local zero-cost package build is optional unless packaging source changes after TASK-0222; if packaging mutates, use at most one local package/candidate closure per packaging checkpoint and clean generated evidence."
  - "Do not require a local package rebuild solely for a durable-only change."

remote_stabilization_loop:
  workflow: .github/workflows/release-gate.yml
  final_required_workflow_blob: "fa0c6bc61bb660b103f3a45b239ac52def7ae1b8"
  new_dispatch_max: 3
  rerun_max: 0
  rules:
    - "Every remote execution is a NEW workflow_dispatch run at the exact current verified main SHA, attempt 1."
    - "Never rerun any historical or new workflow run/job."
    - "First remote checkpoint after durable fix must prove canonical verify passes the durable modules, then continue into candidate construction."
    - "If the accepted framework packaging correction succeeds and the complete release gate passes, stop immediately; do not consume remaining dispatch budget."
    - "If remote fails again in durable bootstrap/recovery or packaging/candidate construction, capture exact new evidence and continue bounded discovery/fix within this task while budget remains."
    - "If remote fails outside durable bootstrap/recovery and packaging/candidate construction, stop BLOCKED with a boundary-crossing finding."
    - "Temporary workflow diagnostics are allowed only if required to distinguish an in-boundary root cause and must be removed before the final successful checkpoint."
    - "The successful stabilization checkpoint must use the exact accepted release-gate workflow blob."

