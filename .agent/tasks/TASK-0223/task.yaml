proven_durable_root_cause:
  classification: premature_timeout_to_owner_loss_projection
  code_site: agent_runtime/session.py
  current_behavior: "bootstrap.wait(timeout=2.0) immediately projects DURABLE_OWNER_LOST on TimeoutExpired."
  evidence:
    - "Remote checkpoint caa8422d40b6bcbfe02e09576de2af2ea5485c7c passed canonical verify 63/63, 936 tests with durable source/test blobs identical to the later failing checkpoint."
    - "Remote checkpoint 0e5f00a98ae79c1c9584bf8fa39e200d100942b6 failed only because one durable bootstrap process exceeded the fixed 2-second parent wait."
    - "The exact failing test passes 30/30 in isolated local execution."
    - "A controlled 2.5-second runner-start delay deterministically causes current manager.start to raise DURABLE_OWNER_LOST, after which durable state becomes running and both runner and target identities verify valid."
  conclusion: "A fixed process wait is not sufficient evidence of lost durable ownership."

approved_design:
  operator_approved: true
  behavior:
    - "Do not fix by merely increasing 2.0 to another arbitrary timeout."
    - "If the initial bootstrap process wait expires, continue bounded reconciliation instead of immediately projecting owner loss."
    - "Accept delayed bootstrap if valid durable state and positively verified ownership become available within the bounded reconciliation window."
    - "If no valid state/ownership becomes available by the total bounded deadline, fail closed with structured unknown/lost-owner semantics."
    - "Persistent identity mismatch, corrupt state, missing owner and true owner loss remain fail-closed."
    - "Do not kill or respawn a potentially effectful durable runner merely because the initial parent wait expired."
    - "After durable reliability is green, continue the same release-gate stabilization far enough to exercise the accepted framework-CPython packaging correction."
    - "Only reopen packaging mutation if new remote packaging evidence proves the framework fix is incomplete."

adaptive_mutation_boundary:
