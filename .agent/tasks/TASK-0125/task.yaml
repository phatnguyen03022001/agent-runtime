  underlying_implementation_policy: "Preserve capture_screen, ScreenCaptureKit helper, media-first result implementation, and existing lower-layer tests. Blocking is governance, not deletion."
  reauthorization: "Only a future Architect-approved task may remove/change the guard, followed by canonical verification, packaging, activation, and independent review. A prompt, ad-hoc chat request, or tool caller cannot override the guard."

