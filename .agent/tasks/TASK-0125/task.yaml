      visual_perception:
        status: BLOCKED
        tool: screen_capture
        production_invocation: DENY
        error_code: VISUAL_PERCEPTION_BLOCKED
        reason: "ChatGPT custom-app -> model semantic pixel delivery remains unproven and public contract insufficient."
        forbidden_reliance:
          - model_visual_observation
          - pixel_semantic_claims
          - visual_control
          - click_type_scroll_based_on_screen_capture
          - OCR_or_textual_fallback
        reauthorization_requires:
          - architect_approved_task
          - source_change
          - canonical_verification
          - package_and_activation
          - independent_architect_review
        authority_reviews:
          - "3a41d140d5e02f4a805f6dce044f1060eeef76a0"
          - "5a256ec90314d7d44e86815a974bfc7ce5641563"
          - "672ee7950ab9bebf9eb7c326dfa140480e97f32f"
