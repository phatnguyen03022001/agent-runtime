structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime/executor.py + agent_runtime/server.py one-tool host architecture, extended by at most one cohesive persistent-session module."
  rationale: "The current bounded executor is intentionally stateless and kills descendants after each command. Persistent PTY state is a real separate ownership boundary, but does not justify a service, database, registry framework, scheduler, sandbox, or orchestration layer."

objective: "Add the smallest persistent PTY/session capability that lets ChatGPT start, observe, interact with, and terminate long-running local developer processes with near-realtime incremental output while preserving terminal_exec semantics, the existing secret/workspace safety boundary, low idle resource cost, and zero runtime-owned persistent session garbage."

scope:
  required_changes:
    - "Preserve terminal_exec as the default bounded one-shot primitive with its current literal argv, shell=False, disconnected stdin, minimal child environment, workspace-root cwd validation, bounded stdout/stderr, timeout, and process-group cleanup semantics. Do not route terminal_exec through the new persistent-session machinery merely for code reuse."
    - "Add public terminal_start(argv, cwd). It must validate literal argv and cwd using the same safety semantics as terminal_exec, start one PTY-backed process group without shell interpolation, return promptly while the child may still be running, and return a compact session identity plus current status, bounded initial output, and cursor information."
    - "Add public terminal_poll(session_id, cursor=0, wait_ms=0). It must return only output newer than the supplied cursor, current status, next cursor, and exit code when terminal. wait_ms must be bounded to at most 1000 ms so ChatGPT can near-realtime long-poll without holding a tool call indefinitely. Output retention and each response must be bounded; if requested output has already been evicted, return truthful cursor-expired/dropped-output evidence rather than silently pretending completeness."
    - "Add public terminal_control(session_id, action, data/rows/cols as applicable) with exactly four actions: write UTF-8 input to the PTY, interrupt the process group, terminate using bounded TERM-to-KILL cleanup semantics, and resize the PTY. Invalid action-specific arguments must fail explicitly."
    - "Keep persistent session state in memory only. Do not write session metadata, logs, cursor state, PID registries, databases, caches, or recovery artifacts to disk. Agent Runtime itself must leave no persistent session garbage when sessions end or the runtime shuts down normally."
    - "Bound resource ownership: at most three active sessions, a fixed 10-minute session idle TTL, bounded retained output per session, and deterministic cleanup of PTY file descriptors and process groups on explicit termination, natural exit, idle expiry, and normal runtime shutdown. A hard SIGKILL/crash is not required to provide impossible cleanup guarantees and must not justify adding a supervisor daemon."
    - "Idle expiry may use one small in-process reaper mechanism only if required to ensure unused sessions are actually reclaimed without a later tool call. Do not add PM2, launchd, a worker service, scheduler framework, persistent supervisor, or another process solely for cleanup."
    - "Preserve the current workspace model: Agent Runtime-owned cwd/session operations are rooted by AGENT_RUNTIME_WORKSPACE_ROOT, expected on the operator Mac to resolve to /Users/tienphat/Developer. Do not claim generic executable filesystem confinement; child commands continue to run with the operator account's ordinary macOS permissions."
    - "Preserve secret isolation. Persistent child processes receive the same minimal environment policy as terminal_exec. Do not add an env override parameter and do not expose control-plane/runtime credentials or ambient token/key variables to child processes."
    - "Use Python standard library plus the already-pinned mcp dependency only. PTY/session support must not introduce a new runtime dependency, Apple Sandbox profile, container, command allowlist, permission DSL, project registry, filesystem index, browser automation, GUI control, subagent, model router, or workflow authority."
    - "Update README only enough to describe the four-tool surface, near-realtime polling model, workspace/security boundary, resource bounds, idle cleanup, and non-sandbox truthfully."
    - "Measure local session overhead on the exact operator Mac candidate. Capture p50/p95 for non-wait terminal_poll over repeated calls and a start-return smoke proving terminal_start does not wait for a long-running child. Record measurements as evidence, not as a new persistent benchmark framework or invented universal SLO."
    - "Publish one bounded implementation lineage on dev followed by a separate .agent/tasks/TASK-0015/report.yaml evidence commit, then stop at Governing Architect review. Do not promote main in this task."
  allowed_existing_files_or_components:
    - agent_runtime/executor.py
    - agent_runtime/server.py
    - tests/test_terminal_exec.py
    - tests/test_surface_and_scripts.py
    - README.md
    - verify
    - .agent/tasks/TASK-0015/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Public MCP surface after implementation is exactly {terminal_exec, terminal_start, terminal_poll, terminal_control}."
  - "terminal_exec behavior remains backward-compatible and remains the preferred one-shot primitive."
  - "No command is wrapped in bash -lc, zsh -lc, or another shell by the runtime; argv remains literal."
  - "Persistent sessions use no runtime-owned disk persistence and no session survives explicit cleanup or normal runtime shutdown by design."
  - "Maximum active persistent sessions is 3 and fixed idle TTL is 600 seconds."
  - "Persistent child environment preserves the current minimal-env/secret-isolation boundary and exposes no caller-supplied env override."
  - "AGENT_RUNTIME_WORKSPACE_ROOT continues to guard cwd selection through realpath validation; the runtime does not misrepresent that guard as host filesystem sandboxing."
  - "No daemon, autostart, scheduler, PM2, launchd service, Apple Sandbox, container, database, project registry, filesystem index, browser/computer-use, subagent, or orchestration machinery is introduced."
  - "requirements.txt remains mcp==2.0.0 only unless a revised task explicitly authorizes dependency change."
  - "Branch topology remains exactly {dev, main}; main remains d15bda58cad974d94b50406a3e4b247fc5fe95b1 during TASK-0015 execution."

forbidden_changes:
  - "Do not replace or weaken terminal_exec cleanup semantics to make long-running sessions possible; persistent behavior belongs only to the new session primitives."
  - "Do not add generic file read/write/search tools, apply_patch, Git-specific tools, test-specific tools, repo/project abstractions, or command aliases in TASK-0015."
  - "Do not expose arbitrary environment variables, secrets, tunnel credentials, or a caller-controlled env map to child processes."
  - "Do not claim hard filesystem confinement outside AGENT_RUNTIME_WORKSPACE_ROOT; do not add Apple Sandbox/container machinery to manufacture that claim."
  - "Do not persist session state or logs under HOME, Library, /tmp, the repository, or another runtime-owned path. Ordinary files created intentionally by user commands are outside this runtime-owned-garbage invariant."
  - "Do not add recovery machinery for SIGKILL/power-loss orphan guarantees beyond bounded process-group design; reproduce a real residual defect before adding supervision complexity."
  - "Do not change tunnel-client profile semantics, install lifecycle, autostart behavior, credentials, main, tags, releases, repository metadata, other repositories, or branch topology."

