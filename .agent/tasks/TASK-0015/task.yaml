acceptance_criteria:
  - id: AC-1
    requirement: "ChatGPT can start and observe a long-running PTY process without blocking until that process exits."
    evidence_required: "Focused native test starts a long-running child, terminal_start returns while status is running, initial output is available or subsequently observable, and the child remains controllable by session_id."
  - id: AC-2
    requirement: "Incremental polling is bounded, truthful, and suitable for near-realtime agent use."
    evidence_required: "Tests prove cursor-based no-duplicate output, bounded wait_ms <= 1000 ms, bounded retained/returned output, truthful cursor-expiry/drop behavior, natural-exit status, and exact candidate Mac p50/p95 no-wait poll measurements are recorded."
  - id: AC-3
    requirement: "Interactive PTY control works without introducing shell interpolation or env leakage."
    evidence_required: "Native tests prove write input round-trip, SIGINT/interrupt, terminate cleanup, PTY resize, literal argv behavior, workspace cwd validation, and the same minimal child environment/secret stripping as terminal_exec."
  - id: AC-4
    requirement: "Unused runtime resources are bounded and reclaimed without persistent garbage."
    evidence_required: "Tests prove maximum three active sessions, fourth-session rejection, deterministic idle-expiry using controlled time, explicit/natural/shutdown cleanup of process groups and PTY FDs, descendant-leak resistance, and no runtime-owned session files/logs/state are created."
  - id: AC-5
    requirement: "Existing one-shot execution remains stable."
    evidence_required: "Existing terminal_exec regressions pass unchanged in meaning and root ./verify passes on the exact candidate."
  - id: AC-6
    requirement: "Architecture stays intentionally small."
    evidence_required: "Final dependency graph remains mcp==2.0.0 only; public surface is exactly four tools; implementation introduces at most the authorized session module/test file and no forbidden platform/orchestration machinery."
  - id: AC-7
    requirement: "Publication is bounded and reviewable."
    evidence_required: "Implementation changes only authorized files/new files, report is a separate report-only child on dev, main remains d15bda58..., and topology remains exactly {dev, main}."

