acceptance_criteria:
  - id: AC-1
    requirement: "Prebuilt onboarding is user/org-specific rather than developer-machine-specific."
    evidence_required: "EXPECTED_TUNNEL_FINGERPRINT and fingerprint tests are gone; arbitrary syntactically valid tunnel IDs are validated through official tunnel-client read-only metadata lookup."
  - id: AC-2
    requirement: "Bad submitted transport configuration cannot poison canonical configuration."
    evidence_required: "401/403/404/transient/missing-client/malformed validation failures leave absent canonical absent and existing canonical byte-identical; successful validation publishes atomically mode 0600."
  - id: AC-3
    requirement: "Onboarding is recoverable without Terminal."
    evidence_required: "Fresh/configured/control-panel flows provide explicit Reconfigure/Retry; existing secrets are never shown; explicit successful reconfigure can replace config after validation."
  - id: AC-4
    requirement: "Typed failure semantics survive Python -> installer -> Swift."
    evidence_required: "Closed reason mapping with actionable UI messages and safe unknown fallback; no arbitrary stderr semantic parsing and no secret leakage."
  - id: AC-5
    requirement: "Newcomer form and guidance are self-explanatory."
    evidence_required: "Set Up/Reconfigure gated on required values/workspace; inline required-state feedback; official API-key/tunnel/Secure MCP Tunnel help links present; no automated provisioning/install."
  - id: AC-6
    requirement: "Existing transactional/runtime behavior remains stable."
    evidence_required: "Focused productization/config/cutover tests PASS, menu focused/full Swift PASS, no lifecycle/provenance/cutover regression."
  - id: AC-7
    requirement: "Canonical verification passes with zero live/release effects."
    evidence_required: "Exactly one ./verify PASS; no version/package/release/install/cutover/relaunch/restart/plugin/permission/reboot/credential effects."
  - id: AC-8
    requirement: "Repository closure is minimal and truthful."
    evidence_required: "Only authorized files plus report change; README/INSTALL describe current source newcomer behavior while retaining v0.5.1 public-release truth; final main clean/synchronized MAIN ONLY."

verification:
  authoritative_verification:
    required: true
    mechanism: "Focused Python onboarding/config/preflight tests + focused/full macOS Swift + exactly one canonical ./verify."
    expected_signal: "Onboarding correctness/recovery is accepted in source with no live or release effects."

