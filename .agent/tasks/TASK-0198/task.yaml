invariants:
  - "No repository-wide tunnel fingerprint or developer-machine tunnel identity remains in the product path."
  - "Tunnel/key provisioning remains user/org-owned; Agent Runtime never creates/deletes/updates tunnels or API keys."
  - "Admin keys are never requested or used."
  - "Submitted API key never appears in argv or persisted diagnostic output."
  - "Canonical runtime.env remains mode 0600 and is the sole installed configuration authority after successful publication."
  - "Validation failure cannot create or overwrite canonical runtime.env."
  - "Existing canonical config remains unchanged without explicit user Reconfigure action."
  - "Cutover/doctor/recovery/manual lifecycle semantics remain unchanged."
  - "TASK-0197 dotenv source protection remains intact."
  - "Runtime version remains 0.5.1; twenty advertised tools/twenty-one known capabilities and screen_capture policy remain unchanged."
  - "TASK-0196 remains paused until TASK-0198 acceptance and later 9.5 qualification gates."
  - "MAIN ONLY."

forbidden_changes:
  - "Raw OpenAI HTTP implementation inside Agent Runtime for tunnel validation."
  - "Tunnel CRUD, admin-key use, automatic tunnel/API-key provisioning, automatic tunnel-client installation/update, or storing credentials outside canonical runtime.env."
  - "A new settings database, onboarding framework, daemon, background validator, retry scheduler, account subsystem or third-party dependency."
  - "Persisting an unvalidated submitted credential/tunnel as canonical config."
  - "Displaying or pre-populating existing API-key/tunnel secret values in native UI."
  - "Parsing arbitrary human stderr strings as the typed native error contract."
  - "Changing Runtime lifecycle, cutover transaction schemas, provenance, public MCP tools, screen_capture, telemetry, payload model or dependency locks."
  - "Version bump, distribution/archive build, tag/release mutation, live install/cutover/menu relaunch/Runtime lifecycle/plugin/credential rotation/reboot/security-permission effects."
  - "Any second canonical ./verify after a conclusive result or blind replay after ambiguity."
  - "Any branch or PR."

