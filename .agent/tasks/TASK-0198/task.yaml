structure_authority:
  status: RESOLVED
  source: "Existing runtime_config, install_preflight, install_release and native first-run/control-panel seams."
  rationale: "Delete the operator-specific invariant, reuse official tunnel-client validation, and add the smallest explicit reconfiguration path. Do not add a wizard framework, settings subsystem, account provisioning service, updater, database, daemon or new dependency."

problem_statement:
  - "Prebuilt product preflight currently requires SHA256(tunnel_id)[:12] == one developer-machine fingerprint, incorrectly promoting an operator invariant to a product invariant."
  - "Fresh setup publishes structurally-valid runtime.env before transport/tunnel authorization is proven. A non-empty but invalid credential/tunnel can therefore become canonical and subsequent launches offer Continue Setup without a credential re-entry path."
  - "The installer collapses useful typed preflight reasons into a generic stderr message, while native Swift surfaces only that generic detail."
  - "Fresh setup permits submit with empty required fields and does not directly guide a newcomer to official API-key/tunnel/tunnel-client setup."

objective: "Make the self-installed Mac newcomer path user/org-specific, prevalidated before canonical configuration publication, recoverable entirely in the app, and typed from Python preflight through native UI. Preserve current transactional cutover/lifecycle/product architecture and obtain focused/full Swift plus exactly one canonical ./verify PASS. Perform zero live activation/release effects."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with clean synchronized MAIN ONLY. TASK-0196 remains paused and must not execute."
    - "Remove EXPECTED_TUNNEL_FINGERPRINT and all product/prebuilt fingerprint matching. Remove tests that patch the fingerprint constant. A syntactically valid tunnel ID belongs to the current user/org configuration, not this repository or developer machine."
    - "Preserve deterministic tunnel-ID syntax validation. Use the official tunnel-client tunnel ID shape instead of a repository-specific fingerprint."
    - "Use the existing official tunnel-client binary as the transport validation authority. Do not call raw OpenAI HTTP APIs directly from Agent Runtime and do not reimplement tunnel authorization logic."
    - "For submitted newcomer/reconfigure values, perform read-only validation before canonical runtime.env publication: require tunnel-client executable; validate local config shape; then run the equivalent of 'tunnel-client admin --json tunnels get <tunnel_id>' with the submitted runtime CONTROL_PLANE_API_KEY supplied only through a sanitized child environment, never argv/log/UI text. The lookup must not use an admin key and must not mutate tunnels."
    - "Interpret the control-plane lookup conservatively and deterministically. At minimum preserve distinct internal reasons for: TUNNEL_CLIENT_UNAVAILABLE, INVALID_TUNNEL_ID, INVALID_CREDENTIAL (401), TUNNEL_ACCESS_DENIED (403), TUNNEL_NOT_FOUND (404), CONTROL_PLANE_UNAVAILABLE/transient-or-malformed response, WORKSPACE_UNAVAILABLE, RUNTIME_CONFIGURATION_INCOMPLETE, and CUTOVER_TRANSACTION_PRESENT where relevant. Do not infer credential validity from tunnel-client doctor alone because doctor validates configuration shape, not remote authentication."
    - "Never include API-key bytes in argv, stdout, stderr, structured reason metadata, logs, tests or report. Bound/sanitize all external tunnel-client output before mapping it to the closed reason set."
    - "Change configuration sequencing so a submitted new configuration is fully syntactically validated plus tunnel/control-plane validated before it becomes canonical. A failed validation must leave an absent canonical runtime.env absent, or an existing canonical runtime.env byte-for-byte unchanged."
    - "Reuse runtime_config.py's existing private mode-0600/atomic publication seam. Add only the minimal explicit staged/reconfigure operation needed to validate first and atomically publish afterward. Do not create a persistent configuration database or shadow authority."
    - "For an explicit successful reconfiguration of an existing canonical config, atomically replace it only after validation. On any failure/interruption before publication, preserve the previous canonical bytes and mode."
    - "Existing valid configuration remains authoritative unless the user explicitly chooses Reconfigure. Do not silently prompt, rewrite or rotate credentials during normal launch."
    - "Add a visible Reconfigure path in the native app that is reachable both from the configured first-run state and from the installed control panel. It must not require Terminal, deleting runtime.env, uninstalling, or reinstalling."
    - "Reconfigure must never display or prefill the existing API key or tunnel ID. Secret fields start empty and require explicit new values. Non-secret workspace/Git identity may be shown/prefilled only if already available through existing safe inspection."
    - "If Runtime is already running, reconfiguration must not silently restart/stop it. Preserve manual lifecycle authority and clearly tell the user that an explicit lifecycle action is required to apply changed configuration if applicable."
    - "Make native Set Up/Reconfigure submission locally impossible until API key, tunnel ID, Git name, Git email and a selected existing workspace are non-empty. Keep Python validation authoritative; native gating is UX, not the security boundary."
    - "Show concise inline/native guidance for required fields rather than waiting for a generic helper rejection."
    - "Add official newcomer help links without account automation: Runtime API key -> https://platform.openai.com/settings/organization/api-keys ; Tunnel ID -> https://platform.openai.com/settings/organization/tunnels ; tunnel-client/setup help -> https://developers.openai.com/api/docs/guides/secure-mcp-tunnels . Opening a link is user-initiated only. Do not create keys/tunnels, use admin credentials, or install/upgrade tunnel-client."
    - "Preserve typed preflight semantics end-to-end. install_preflight/install_release must not discard the machine-readable failure reason before Swift can consume it. Swift must map the closed reasons to bounded actionable user text, for example install tunnel-client, create/check runtime API key, create/check tunnel access, choose an existing workspace, retry later for control-plane availability, or resolve an existing cutover."
    - "Do not parse arbitrary human stderr text in Swift to recover semantics. Preserve one structured bounded reason channel from Python/installer to Swift, with a generic safe fallback for unknown failures."
    - "Preserve existing cutover transaction/doctor/recovery behavior. This task changes configuration admission/recovery and error presentation only; it must not weaken provenance, doctor gates, rollback, manual lifecycle or Runtime ownership."
    - "Update tests/test_task0141_productization.py so arbitrary valid user tunnel IDs are admitted without fingerprint monkeypatching and synthetic tunnel-client responses cover success, 401, 403, 404, transient/malformed output and missing executable."
    - "Add/update runtime_config tests proving: failed submitted config never creates canonical; failed reconfigure preserves existing canonical bytes/mode; successful validated reconfigure atomically replaces canonical; secrets remain absent from argv/output."
    - "Update macOS PresentationTests to prove: required-field gating; official help destinations; fresh setup prevalidates before canonical publication; typed reason -> actionable message mapping; configured mode exposes Reconfigure; control panel exposes Reconfigure; secrets are not prefilled; existing valid config is unchanged unless explicit reconfigure."
    - "Run focused Python onboarding/config/preflight/productization tests first."
    - "Run focused AgentRuntimeMenuBarTests, then the complete canonical macOS Swift suite."
    - "Only after all focused/Swift gates PASS, run exactly one canonical ./verify through a durable/reconcilable carrier. Never blind-replay an ambiguous invocation."
    - "Update README.md and docs/INSTALL.md to describe the corrected newcomer flow and official links, while keeping v0.5.1 as the latest public release until TASK-0196 publishes a successor."
    - "Publish one implementation candidate and truthful TASK-0198 report. Final repository clean/synchronized MAIN ONLY."
    - "Do not install/cut over/relaunch/restart the live Runtime, rotate credentials, reload plugin, build release archives, create tags/releases, mutate LaunchServices, request permissions or reboot."

