structure_authority:
  status: RESOLVED
  source: "Existing root shell entrypoints, README, tests directory, .env.example, and runtime profile schema."
  rationale: "The capability belongs in one root install.sh plus focused tests and a concise README update. No installer framework, package manager abstraction, daemon, new Python runtime module, or new service is needed."

objective: "Make a fresh macOS clone of agent-runtime reproducibly installable for the ChatGPT-to-local tunnel use case with one bounded installer that establishes Python runtime dependencies, trusted local runtime state/config, a disposable self-verification checkout, required tunnel-client availability/profile, and doctor readiness without overwriting unknown local state or starting the daemon automatically."

scope:
  required_changes:
    - "Add root install.sh as the single new-machine bootstrap entrypoint."
    - "Require macOS, Git, Python >=3.11, and Homebrew when tunnel-client is absent; install missing tunnel-client only through the official OpenAI Homebrew formula openai/tools/tunnel-client, then verify required CLI capabilities."
    - "Create/reuse .venv, install requirements.txt, and run ./verify before declaring repository runtime setup usable."
    - "Create machine-local runtime config/state/checkouts under HOME using fail-closed ownership/identity checks; never reset/delete an unknown pre-existing path."
    - "Generate a self-verification project profile from the exact current repository remote/branch using a separate explicitly disposable checkout and verify exact remote identity."
    - "Create/update .env only for non-secret installer-owned values; never overwrite non-empty CONTROL_PLANE_API_KEY or CONTROL_PLANE_TUNNEL_ID and never print their literal values. If credentials are absent, stop with clear rerun instructions."
    - "Create the agent-runtime tunnel-client profile only when absent using tunnel-client init; if present, validate rather than overwrite. Run tunnel-client doctor and do not automatically start the long-lived tunnel daemon."
    - "Update README setup flow to clone -> ./install.sh -> ./start.sh and retain manual configuration details as reference."
    - "Add focused regression tests for installer safety/idempotence/required tunnel behavior using isolated temporary HOME/PATH fixtures."
  allowed_existing_files_or_components:
    - README.md
    - .env.example
    - requirements.txt
    - start.sh
    - verify
    - config/profiles.example.toml
    - tests/
    - .agent/tasks/TASK-0001/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "Public MCP surface remains exactly get_head(project), sync(project), run_verify(project), get_last_log(project)."
  - "No runtime Python public API, config schema, sync semantics, verifier semantics, or state/log semantics change."
  - "Installer never modifies main, creates branches, pushes target changes outside authorized dev commits, tags, releases, or repository metadata."
  - "Installer never deletes or hard-resets the primary clone or any unknown pre-existing local path."
  - "Installer never stores secrets in tracked files, prints literal secrets, or overwrites non-empty user credentials."
  - "Installer never automatically starts tunnel-client run or another long-lived daemon."
  - "Existing compatible machine-local setup is reused only after identity/shape validation; incompatible or ambiguous existing state fails closed."
  - "Official tunnel-client install mechanism is Homebrew formula openai/tools/tunnel-client; no curl-pipe-shell or vendored binary download."
  - "No new dependency in requirements.txt and no installer framework or extra package manager abstraction."

forbidden_changes:
  - "Do not redesign agent-runtime or add MCP tools."
  - "Do not add Docker, launchd, system services, schedulers, background supervisors, auto-update logic, or a generic package-manager abstraction."
  - "Do not use curl|sh, download an arbitrary tunnel-client binary, or pin secrets into files."
  - "Do not overwrite an existing tunnel-client profile, runtime config, disposable checkout, .env secret, or unknown machine-local path without validation."
  - "Do not mutate main or release/tag/publish."
  - "Do not add or modify GitHub Actions workflows."

