acceptance_criteria:
  - id: AC-1
    requirement: "A fresh macOS clone has one documented ./install.sh bootstrap path and ./start.sh remains the explicit daemon start path."
    evidence_required: "install.sh + README + regression tests."
  - id: AC-2
    requirement: "Missing tunnel-client is installed only with brew install openai/tools/tunnel-client; an existing usable tunnel-client is reused; incompatible/missing Homebrew state fails closed."
    evidence_required: "Installer behavior tests with fake PATH plus source inspection."
  - id: AC-3
    requirement: "Installer creates/reuses .venv, installs pinned Python requirements, and runs the repository verifier before readiness."
    evidence_required: "Installer source/test assertions plus final ./verify PASS."
  - id: AC-4
    requirement: "Machine-local runtime config/state/disposable self-checkout are created under HOME with exact remote/branch validation and no destructive treatment of unknown pre-existing paths."
    evidence_required: "Focused isolated fixture tests and source inspection."
  - id: AC-5
    requirement: ".env handling never overwrites non-empty credentials or prints secret values; missing credentials cause a clear fail-closed stop that can be resolved by editing/exporting and rerunning."
    evidence_required: "Regression tests covering absent/present credentials and output redaction."
  - id: AC-6
    requirement: "Tunnel profile creation is non-overwriting, doctor is required, and installer never invokes tunnel-client run."
    evidence_required: "Regression tests plus exact command/source inspection."
  - id: AC-7
    requirement: "No MCP/runtime/config-schema/dependency/workflow/main/release scope drift occurs."
    evidence_required: "Exact base..final diff inventory, requirements unchanged, public tool surface unchanged, git diff --check."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Before implementation mutation, refresh dev and require exact handoff base, branches exactly {dev, main}, main still 0d72ea6bf626436e8c3f236404af13cfa8c93fe8, and isolated test execution available."
      required: true
    - id: CHECK-2
      command_or_check: "Use TDD: add tests/test_install.py first and observe focused RED caused by missing install.sh / missing required installer behavior before production installer changes."
      required: true
    - id: CHECK-3
      command_or_check: "python3 -m unittest tests.test_install"
      required: true
    - id: CHECK-4
      command_or_check: "./verify"
      required: true
    - id: CHECK-5
      command_or_check: "bash -n install.sh start.sh verify && git diff --check"
      required: true
    - id: CHECK-6
      command_or_check: "Inspect exact base..final_execution_head diff and prove only install.sh, tests/test_install.py, README.md, and the task report changed during execution; requirements.txt, runtime modules, public MCP surface, workflows, main, tags, releases, and metadata did not change."
      required: true
    - id: CHECK-7
