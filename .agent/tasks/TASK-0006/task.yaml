    - repository_content_write

acceptance_criteria:
  - id: AC-1
    requirement: "The assessment compares current runtime responsibilities against the accepted trusted generic Terminal model without changing either side."
    evidence_required: "Report resolves exact immutable runtime, agent-skills, and architect-profile identities and maps every material runtime responsibility to retained unique value, duplicated/obsolete value, compatibility obligation, or unresolved evidence."
  - id: AC-2
    requirement: "Any KEEP or partial-retention claim is tied to a concrete material failure mode and unique assurance."
    evidence_required: "Each retained mechanism states the prevented failure, why generic Terminal/governance/profile/target verification is insufficient, whether assurance is mechanical or behavioral, and why complexity cost is justified."
  - id: AC-3
    requirement: "Deletion/subtraction is considered seriously rather than blocked by sunk cost."
    evidence_required: "Report explicitly challenges historical effort/quality and identifies which responsibilities are now absorbed by simpler current owners/capabilities."
  - id: AC-4
    requirement: "Consumer/compatibility evidence is bounded and attributable."
    evidence_required: "Report records exactly what consumer-reference scope was searched, any concrete live references found, and what remains unknown; absence of evidence is not overstated as universal proof."
  - id: AC-5
    requirement: "No replacement framework is invented."
    evidence_required: "Recommendation is limited to KEEP_AS_IS, SUBTRACT_TO_SMALLER_RESPONSIBILITY, DELETE_CANDIDATE, or INSUFFICIENT_EVIDENCE plus minimum unresolved compatibility/cleanup questions, with no runtime-v2/command-broker/sandbox subsystem design."
  - id: AC-6
    requirement: "Execution is report-only and leaves runtime/topology unchanged."
    evidence_required: "Exact base-to-final Executor mutation changes only .agent/tasks/TASK-0006/report.yaml; dev advances by exactly one report commit; main and {dev, main} topology remain unchanged."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At start refresh canonical GitHub truth and require dev equals the exact revision-2 handoff base, main equals 12172419c08c1f069c7d6cf2ef8842ed2838e0bb, branches exactly {dev, main}, TASK-0006 revision 2 resolves at that base, and pinned agent-skills/profile authorities resolve. Preflight required EXECUTION capabilities before any report mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect exact runtime README and only the implementation/tests/history necessary to understand every material current runtime responsibility and its mechanical guarantees. Do not modify or run runtime merely for ceremony."
      required: true
    - id: CHECK-3
      command_or_check: "Compare those responsibilities against exact accepted agent-skills and architect-profile trust-model semantics. For each retained claim, demand a concrete current failure mode and unique material assurance; for each subtraction claim, identify the simpler current owner/capability."
      required: true
    - id: CHECK-4
      command_or_check: "Perform bounded read-only consumer-reference discovery sufficient to identify obvious live compatibility obligations without broad unrelated target investigation. Record searched scope and uncertainty exactly."
      required: true
    - id: CHECK-5
      command_or_check: "Produce a single advisory disposition and minimum unresolved compatibility/cleanup questions. Do not implement deletion, deprecation, refactor, replacement, or runtime-v2 design."
      required: true
    - id: CHECK-6
      command_or_check: "Before report publication refresh remote dev and require it still equals the exact execution base; create/commit/push only .agent/tasks/TASK-0006/report.yaml non-force to dev; then verify sole parent, report-only diff, final dev, unchanged main, and exact {dev, main} topology before returning NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

