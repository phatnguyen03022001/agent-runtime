structure_authority:
  status: RESOLVED
  source: "Existing agent-runtime task/report/review structure under accepted agent-skills protocol v3."
  rationale: "This is an evidence-producing necessity assessment. No runtime implementation, README, config, API, test, branch, release, or architecture mutation is authorized. Executor may add only the canonical report artifact; Governing Architect review is a later Architect-owned phase using existing review.yaml semantics."

objective: "Determine whether the current four-tool agent-runtime still earns its existence after trusted generic direct Terminal/local execution became the normal permitted capability model. Identify any concrete retained responsibility or failure mode that generic Terminal plus current agent-skills, architect-profile, GitHub canonical truth, exact repo binding, secret discipline, consequence guards, scratch isolation convention, and target-owned verification do not adequately absorb. Prefer deletion/subtraction when no material retained responsibility is proven; do not preserve the runtime because of sunk cost or implementation quality."

scope:
  required_changes:
    - "Treat the exact current agent-runtime implementation and README at the authorized base as the assessment subject. Do not modify runtime production code, tests, README, config examples, install/start scripts, workflows, or repository topology."
    - "Resolve the exact accepted external trust-model authorities: agent-skills@33f138c56dee6a2a1e8b8a6dc52b1399452ef177 and architect-profile@d80e30401c44dc256b01b69c1911a9797e53af3c. Distinguish generic governance from operator-specific behavioral Terminal policy."
    - "Assess each material runtime responsibility/mechanism by current necessity rather than historical effort: four project-ID-only MCP surface; trusted project profiles; disposable destructive sync; exact remote/worktree/branch identity; verifier argv pinning; inherited-environment reduction; detached worker and process-group timeout; lock handoff; config/runtime generation binding; PASS postconditions; bounded state/log handling; tunnel/bootstrap/reload machinery."
    - "For every claimed retained responsibility, state the exact failure mode it prevents, why trusted generic Terminal plus current governance/profile/target-owned verification does not sufficiently address it, whether the assurance is behavioral or mechanically enforced, and whether the value is material enough to justify ongoing repository/runtime/tunnel/config complexity."
    - "For every duplicated/obsolete responsibility, identify the current owner or simpler capability that absorbs it. Do not propose a replacement command broker, runtime v2, shell wrapper, capability registry, sandbox framework, orchestration layer, or new repository."
    - "Explicitly challenge sunk-cost, 'already built', narrow-surface aesthetics, and theoretical defense-in-depth as standalone reasons to keep the runtime. Rare but catastrophic mechanically enforced safeguards may still justify retention if a concrete failure class and materially unique assurance are proven."
    - "Do not assume normal Terminal is mechanically sandboxed. Conversely, do not count a mechanical runtime guarantee as unique merely because it exists; prove that guarantee remains needed under the accepted trusted-agent threat model."
    - "Prompt-injection distinction must remain explicit: ChatGPT is trusted, encountered repository/downloaded text is not authority. Assess whether any runtime mechanism materially protects against a realistic consequence that behavioral secret/repo/consequence rules do not adequately control."
    - "Perform bounded read-only consumer evidence discovery only as necessary to avoid deleting a live compatibility obligation. Search may inspect canonical references to agent-runtime/use of its four-tool interface in the known agent-* ecosystem and repository-owned runtime documentation/history. Do not mutate any external repository and do not broaden into unrelated target architecture. Absence of a discovered consumer is evidence only within the searched scope, not proof that no external consumer exists."
    - "Produce one canonical assessment report with a recommended Architect disposition: KEEP_AS_IS, SUBTRACT_TO_SMALLER_RESPONSIBILITY, DELETE_CANDIDATE, or INSUFFICIENT_EVIDENCE. The recommendation is advisory evidence only; Executor does not delete/deprecate runtime or make final Architect judgment."
    - "If DELETE_CANDIDATE or SUBTRACT_TO_SMALLER_RESPONSIBILITY is recommended, specify the minimum compatibility/cleanup questions the Architect must resolve before authorizing mutation. Do not implement them."
    - "Commit/push only .agent/tasks/TASK-0006/report.yaml as a report-only commit after refreshing exact dev/base/main/topology. Then verify exact report parent/diff/final refs and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - .agent/tasks/TASK-0006/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Assessment is read-only for runtime implementation and documentation; only report.yaml may be added by Executor."
  - "No assumption that agent-runtime must survive, and no assumption that it must be deleted. Evidence decides."
  - "Historical correctness/security engineering is not itself evidence of current necessity."
  - "Generic Terminal capability is not authority and is not a mechanical sandbox."
  - "Mechanical assurance may count only when tied to a concrete retained failure mode and material current value."
  - "No command broker, runtime v2, generic shell API, capability taxonomy, sandbox subsystem, central orchestrator, registry, queue, database, or sixth repository is proposed or created."
  - "No mutation of architect-profile, agent-skills, agent-documents, agent-standards, target repositories, local runtime config, tunnel config, secrets, tags, releases, workflows, or main."
  - "Final canonical Architect review after Executor report follows accepted durable review.yaml semantics; Executor does not create or self-accept that review."
  - "Branches remain exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not modify agent_runtime/*, tests/*, README.md, requirements.txt, config/*, install.sh, start.sh, verify, .github/*, existing historical tasks/reports, or any file other than the new TASK-0006 report."
  - "Do not delete, deprecate, refactor, simplify, rename, or rewrite agent-runtime in this task."
  - "Do not create review.yaml as Executor; Governing Architect owns final review persistence after resolving the report."
  - "Do not create branches, mutate main, promote, tag, release, force-push, rebase, rewrite history, mutate repository metadata, or change permissions."
  - "Do not treat lack of target-pilot evidence as permission to invent usage statistics or compatibility obligations."
  - "Do not preserve runtime solely because it is secure, tested, elegant, already deployed, or expensive to recreate."
  - "Do not recommend a mechanically bounded replacement unless a concrete retained failure mode proves that mechanical boundary is necessary; even then, recommend only the responsibility, not a new subsystem design."

gap_policy:
  local_auto_fix: false
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

