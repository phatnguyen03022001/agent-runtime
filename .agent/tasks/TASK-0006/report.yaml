necessity_assessment:
  decision_rule: "A retention claim must identify a concrete current failure mode, materially unique assurance not sufficiently absorbed by trusted generic Terminal plus current governance/profile/target verification, assurance type, and complexity value sufficient to justify ongoing runtime/tunnel/config/state maintenance."
  sunk_cost_disposition: "Historical engineering quality, security hardening, test coverage, existing installation, and recreation cost were treated as evidence that the runtime works, not evidence that its responsibility remains necessary."
  mechanism_results:
    - mechanism: four_project_id_only_mcp_surface
      assurance_type: MECHANICAL
      prevents: "The MCP caller cannot select arbitrary commands, executables, paths, remotes, branches, verifier argv, environment variables, or filesystem mutations through the runtime API."
      current_failure_mode: "An untrusted or mistaken caller could otherwise direct local execution outside a preconfigured project/verifier surface."
      simpler_current_owner: "Accepted agent-skills authority/capability/consequence semantics plus architect-profile exact target binding and trusted direct Terminal/local-shell policy."
      materially_unique_assurance: false
      result: OBSOLETE_DUPLICATION
      rationale: "Under the accepted model the same ChatGPT agent normally has generic Terminal capability. The four-tool restriction constrains only calls routed through agent-runtime and therefore is not a system-level containment boundary once direct Terminal remains available. Keeping a second narrower path does not remove the generic capability or its consequences."

    - mechanism: trusted_project_profiles
      assurance_type: MECHANICAL
      prevents: "Model input cannot dynamically choose checkout, remote, branch, verifier argv, timeout, or destructive-sync eligibility through MCP."
      current_failure_mode: "Wrong-path/wrong-repository/wrong-verifier selection by a caller."
      simpler_current_owner: "Exact owner/repo plus realpath binding, GitHub canonical truth, target-owned verification authority, and consequence-based state checks."
      materially_unique_assurance: false
      result: OBSOLETE_DUPLICATION
      rationale: "The accepted trust model deliberately lets the trusted agent select ordinary engineering commands inside exact authority. A parallel machine-local profile becomes another configuration truth that can drift and must be installed/reloaded, without removing direct-Terminal capability."

    - mechanism: disposable_destructive_sync
      assurance_type: MECHANICAL
      prevents: "reset --hard and clean -fd are refused unless the configured checkout is marked disposable and exact repository postconditions hold."
      current_failure_mode: "Accidental destructive synchronization of non-disposable or wrong local work."
      simpler_current_owner: "Architect-profile exact target binding, local-divergence protection, scratch/disposable-reference convention, and consequence-based destructive-operation checks."
      materially_unique_assurance: false
      result: ABSORBED
      rationale: "The runtime gate is stronger than prose for calls routed through sync, but direct Terminal can perform the same Git mutations outside the runtime. Under the trusted-agent model the relevant control is authority plus fresh repository/dirty-state evidence, not maintaining a separate destructive-sync service."

    - mechanism: exact_remote_worktree_branch_identity
      assurance_type: MECHANICAL
      prevents: "Configured checkout must be the exact Git worktree root, literal remote URL must match the trusted profile, configured branch must be active, and verification requires clean/in-sync state."
      current_failure_mode: "Running destructive or verification work against the wrong repository/worktree/branch or stale local state."
      simpler_current_owner: "Architect-profile realpath containment and normalized canonical owner/repo binding plus agent-skills remote-truth, rebinding, and consequence guards."
      materially_unique_assurance: false
      result: ABSORBED
      rationale: "The failure class remains important, but its ownership moved into the accepted generic local policy. No evidence shows a current consumer needs a persistent runtime to perform these checks rather than the trusted agent inspecting exact state before consequential operations."

    - mechanism: verifier_argv_pinning
      assurance_type: MECHANICAL
      prevents: "MCP/model input cannot replace the configured verifier command."
      current_failure_mode: "Caller executes an arbitrary or wrong verifier and mislabels the result as approved verification."
      simpler_current_owner: "Target-owned canonical verification authority plus exact task evidence requirements; generic execution capability does not create verification authority."
      materially_unique_assurance: false
      result: ABSORBED
      rationale: "The old protection assumes command choice must be hidden from the model. The accepted model instead trusts ChatGPT to run the exact target-owned verifier under authority, so verifier selection no longer needs a project-profile broker."

    - mechanism: inherited_environment_reduction
      assurance_type: MECHANICAL
      prevents: "Verifier subprocess inherits only PATH from the runtime rather than unrelated parent tunnel/cloud/token environment."
      current_failure_mode: "Verifier or dependency accidentally reads or emits ambient parent-process secrets."
      simpler_current_owner: "Operator secret discipline plus generic process execution with consequence-appropriate environment control when verification actually requires it."
      materially_unique_assurance: false
