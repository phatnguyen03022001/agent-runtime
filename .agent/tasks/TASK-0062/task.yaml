    - "Invoke macos/freeze_candidate.py exactly once for the exact source revision/tree/requirements.lock identity, with AGENT_RUNTIME_CODESIGN_IDENTITY supplied from the accepted local key only. Do not retry the real freeze merely to gather evidence."
    - "Require publication under build/candidates/<candidate_sha256>/ with exact sibling Agent Runtime.app and Agent Runtime.candidate.json returned by the canonical freeze contract."
    - "Record exact candidate_sha256, candidate app path, candidate handoff path, source revision, source tree, requirements.lock SHA-256, app bundle identifier, candidate record count, and relevant non-secret provenance identity fields."
    - "Run /usr/bin/codesign --verify --deep --strict on the exact frozen app."
    - "Read bounded codesign metadata from the main app and bundled Runtime service/helper. Require non-null TeamIdentifier values and consistency across required signed executable identities. Record only TeamIdentifier equality/non-null status and a SHA-256 digest, not the literal TeamIdentifier."
    - "Run canonical candidate validation against the exact frozen app/handoff pair after freeze and require candidate_sha256 equality with the freeze result."
    - "Hash the external handoff and identity-critical immutable files before and after post-freeze verification. At minimum include the handoff, main executable, Runtime service executable, Runtime start.sh, runtime-manifest.json, and bundled requirements.lock when present. Require exact byte equality."
    - "Do not reconstruct, reuse, overwrite, or claim restoration of historical TASK-0056 candidate bytes. This is a new prospective immutable artifact under TASK-0058 semantics."
    - "Do not modify production source to make freeze pass. Any source defect, signing defect, provenance mismatch, immutable-output collision, or environment blocker must be reported and returned to Architect review."
    - "Publish only the canonical TASK-0062 report to dev, non-force, then stop for Architect review."
