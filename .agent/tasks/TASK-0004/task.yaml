structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime runtime modules, README, and test suite."
  rationale: "All three corrections fit the current modules and existing tests. No new module, process layer, state schema, config schema, registry, orchestration abstraction, or public tool is justified."

objective: "Close the three proven runtime binding defects: prevent detached verification from crossing the long-lived runtime/config generation boundary, bind every configured checkout to the exact Git worktree root before destructive synchronization or verification reliance, and eliminate the get_last_log ACTIVE-state/lock TOCTOU false-INTERRUPTED result, while preserving the narrow four-tool architecture and existing explicit trust boundaries."

scope:
  required_changes:
    - "Use causal TDD on the exact authorized base. Before production changes, add focused regressions that reproduce AR-01, AR-02, and AR-04 against the pre-fix implementation and record the causal failing evidence."
    - "AR-01: bind run_verify to the long-lived AgentRuntime generation. AgentRuntime must capture an immutable launch-time identity for the trusted config bytes and worker-relevant runtime source generation. Before accepting a verification launch, refuse if the current on-disk config/runtime generation no longer matches that cached identity. The detached worker must receive enough expected generation identity to revalidate the same binding before it resolves/executes the verifier, so launch-to-worker drift cannot silently adopt a newer verify_argv/profile or runtime source. A reload/restart remains the mechanism for adopting changed runtime/config/profile state."
    - "Keep the generation binding local and deterministic. A small digest/fingerprint helper in an existing module is acceptable. Do not add a daemon, watcher, reload subsystem, manifest, registry, generated artifact, config field, or persistent generation database. Do not persist new state fields unless a concrete existing invariant makes persistence strictly necessary; if a state-schema change appears necessary, stop for revised authority rather than expanding automatically."
    - "AR-02: add an exact checkout-root invariant using Git's own worktree identity. Before destructive sync and before runtime verification relies on repository identity, require the configured resolved checkout to equal the resolved `git rev-parse --show-toplevel` result for that checkout. A configured subdirectory of a larger repository must fail closed even when remote URL/branch otherwise match. Preserve linked-worktree support when the configured path is exactly that worktree's top level."
    - "Ensure sync checks the exact worktree-root invariant before fetch/switch/reset/clean can perform destructive mutation. The regression must prove a subdirectory profile cannot cause reset/clean effects in its enclosing worktree. Preserve the existing disposable=true gate and exact remote identity checks."
    - "AR-04: make get_last_log observation internally consistent without serializing ordinary reads behind the active verifier. If the first persisted sample is ACTIVE but the subsequent lock probe reports free, reread authoritative state before synthesizing INTERRUPTED. If the reread is terminal, return that terminal state and its correctly associated finalized log. Only synthesize the existing interrupted interpretation when authoritative reread still justifies it."
    - "Do not expand AR-04 into a get_head redesign. The weaker get_head sampling observation remains outside this bounded task unless implementation mechanically shares a tiny helper without changing get_head semantics."
    - "Update README.md only if needed to make the now-enforced runtime-generation and exact-worktree-root behavior explicit. Preserve the existing condition-based capability-freshness guidance from TASK-0003."
    - "Run focused regressions plus the repository-owned root verifier on the exact final implementation. Produce canonical TASK-0004 report evidence in a separate report-only commit and stop at the Governing Architect review boundary."
  allowed_existing_files_or_components:
    - agent_runtime/runner.py
    - agent_runtime/git_ops.py
    - agent_runtime/config.py
    - README.md
    - tests/test_runner.py
    - tests/test_git_ops.py
    - tests/test_final_hardening.py
    - tests/test_release_blockers.py
    - verify
    - .agent/tasks/TASK-0004/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Public MCP surface remains exactly get_head(project), sync(project), run_verify(project), get_last_log(project); no fifth tool or signature expansion is introduced."
  - "Long-lived runtime/config/profile changes are adopted only after the runtime generation is reloaded/restarted; a detached worker cannot silently cross that boundary."
  - "The configured checkout is the exact Git worktree top level before destructive sync or trusted verification use. disposable=true remains necessary but is not sufficient by itself."
  - "get_last_log never manufactures PASS and no longer returns a false terminal INTERRUPTED merely because an ACTIVE sample became stale before a free-lock observation."
  - "Existing strict PASS requirements remain: verifier exit zero, no timeout/failure, same HEAD, configured branch, clean tree, cached-remote synchronization, and exact remote identity."
  - "Ignored state remains intentionally preserved by git clean -fd; do not change to -fdx and do not claim hermetic verification."
  - "Dependency/verifier argv remains trusted profile input; this task binds its generation but does not sandbox verifier OS effects."
  - "Per-project flock serialization, inherited zero-gap lock handoff, process-group cleanup, bounded logs, atomic state, and fail-closed corruption/recovery behavior remain intact."
  - "repository remains an operator-facing label while expected_remote_url remains the verified Git remote identity; AR-06 is not authorized for renaming or schema change here."
  - "MCP tool annotation compatibility behavior and run_verify destructiveHint are unchanged; AR-03/AR-07 are not implementation authority in this task."
  - "Branches remain exactly {dev, main}; main is not mutated."

forbidden_changes:
  - "Do not modify the four-tool public API, add shell/exec/path/command/profile mutation capability, add orchestration, scheduling, container, GitHub-writing, or multi-tenant machinery."
  - "Do not change config schema/version or add required trusted-profile fields."
  - "Do not add a runtime reload watcher/hot-reload system, global generation registry, new persistent state database, new state schema, or new top-level/module structure."
  - "Do not change clean -fd to clean -fdx or delete ignored files/state."
  - "Do not redesign verifier environment inheritance, remote freshness semantics, fixed Git timeouts, repository label semantics, MCP annotation compatibility machinery, or historical IELTS prose."
  - "Do not modify install.sh, start.sh, requirements.txt, .env.example, released branch main, prior task/report artifacts, tags, releases, repository metadata, or branch topology."
  - "Do not force-push, rebase, rewrite history, promote, tag, release, or create review.yaml."
  - "Do not perform unrelated cleanup or split runner.py merely for style."

