acceptance_criteria:
  - id: AC-1
    requirement: "AR-01 is closed: a long-lived AgentRuntime cannot launch a verifier using changed config/profile or changed worker-relevant runtime source until runtime reload/restart establishes a new generation."
    evidence_required: "Causal focused regressions reproduce pre-fix config-generation and runtime-generation drift, then prove final launch refusal/revalidation on exact changed generations and normal launch success when generation is unchanged."
  - id: AC-2
    requirement: "Detached worker execution is bound to the same generation accepted by the launcher rather than independently adopting a newer configuration/runtime generation."
    evidence_required: "Focused worker/launcher test proves expected generation identity is checked before verifier execution and a mismatch cannot execute the changed verifier."
  - id: AC-3
    requirement: "AR-02 is closed: configured checkout must equal the exact Git worktree root and a subdirectory profile cannot trigger destructive mutation of its enclosing repository."
    evidence_required: "Focused Git fixture demonstrates subdirectory rejection before destructive effects and exact-root/linked-worktree-compatible behavior remains valid."
  - id: AC-4
    requirement: "AR-04 is closed: stale ACTIVE plus newly free lock rereads state before INTERRUPTED synthesis and returns a concurrently committed terminal state when present."
    evidence_required: "Deterministic race regression controls state reads/lock transition and proves PASS/FAIL terminal reread is returned instead of transient INTERRUPTED; genuine active-with-free-lock stale case retains fail-closed interruption behavior."
  - id: AC-5
    requirement: "Existing narrow runtime safety and PASS semantics do not regress."
    evidence_required: "All existing tests plus new regressions pass; four-tool surface, disposable gate, remote identity, flock handoff, process-group cleanup, bounded logs, strict PASS, clean -fd, and PATH-only verifier environment remain covered."
  - id: AC-6
    requirement: "Repository-owned verification passes on the exact final implementation."
    evidence_required: "`./verify` exits 0 on the exact implementation commit with unittest, py_compile, shell=True guard, and clean -fdx guard all passing."
  - id: AC-7
    requirement: "Execution/publication remains bounded."
    evidence_required: "Implementation commit changes only authorized existing runtime/README/test files actually needed; separate report commit changes only .agent/tasks/TASK-0004/report.yaml; main and branch topology remain unchanged."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At execution start refresh refs and require dev equals the exact TASK-0004 handoff base, main equals 12172419c08c1f069c7d6cf2ef8842ed2838e0bb, branches exactly {dev, main}, TASK-0004 revision 1 resolves at the handoff base, and pinned agent-skills 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 is available. Preflight all required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Causal RED: on the exact base, reproduce one decisive failing regression for each AR-01 generation drift class, AR-02 subdirectory destructive-boundary class, and AR-04 stale ACTIVE/free-lock race before changing production code."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest correction inside the existing modules. No new module/config/state schema/framework is permitted."
      required: true
    - id: CHECK-4
      command_or_check: "Run the focused tests covering generation binding, exact worktree-root binding, and get_last_log reread/race behavior; require all focused tests PASS on final code."
      required: true
    - id: CHECK-5
      command_or_check: "Run ./verify on the exact final implementation and require exit 0. Explicitly verify the public tool set/signatures remain unchanged and git clean -fdx remains absent."
      required: true
    - id: CHECK-6
      command_or_check: "Before implementation commit, prove the diff is restricted to authorized files and no unrelated audit observation was implemented. Commit/push implementation non-force to dev."
      required: true
    - id: CHECK-7
      command_or_check: "Create .agent/tasks/TASK-0004/report.yaml with causal, focused, full-verification, exact-object, diff, lineage, and continuation evidence. Commit/push it separately, then verify its sole parent is the implementation commit, its diff is report-only, dev equals the report commit, main remains unchanged, and branches remain exactly {dev, main}."
      required: true
  authoritative_verification:
    required: true
    mechanism: "./verify"
    expected_signal: "exit 0"

