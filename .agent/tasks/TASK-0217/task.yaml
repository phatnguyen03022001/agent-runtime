    - "Do not increase _DURABLE_FINALIZATION_GRACE_SECONDS from 2.0 seconds."
    - "Do not add any additional owner-loss grace outside the existing 2.0-second reconciliation window."
    - "Preserve terminal-state reconciliation: if the durable runner atomically publishes status=exited while active ownership is being reconciled, accept that exact terminal snapshot through the existing finalization path."
    - "A genuinely stable mismatching or unavailable persisted owner at the end of the existing bound must still set/project DURABLE_OWNER_LOST with effect_state UNKNOWN, reconciliation_required=true and safe_next_action=RECONCILE."
    - "Preserve session lease release, timing emission, start_identity binding, durable recovery, output retention, capacity and public terminal_start/poll/control semantics."
    - "Add deterministic regressions in tests/test_durable_pipe.py for the manager-side seam."
    - "Regression A must model transient runner verification failure while target verification is independently healthy and prove target observation is not suppressed."
