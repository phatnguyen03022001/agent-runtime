    - "Regression C must model independently transient runner/target observations that become exact within the existing bound and prove manager.start/reconciliation succeeds without DURABLE_OWNER_LOST."
    - "Regression D must model a true persistent mismatch for runner and separately for target; each must remain fail-closed as DURABLE_OWNER_LOST."
    - "The deterministic regression set must fail against the exact pre-fix manager-side semantics for the coupled observation defect rather than depend on scheduler luck."
    - "Preserve TASK-0205 identity-admission tests, TASK-0211 late-identity tests and intentional owner-loss/reused-process protections."
    - "Run the exact remote failing test 50/50 in fresh unittest processes."
    - "Then run 20 stress rounds with six fresh processes executing the exact remote failing test concurrently; require 120/120 PASS."
