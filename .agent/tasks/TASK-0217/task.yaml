objective: "Make TerminalSessionManager validate persisted durable runner and target identities with bounded independent exact observation semantics during the existing reconciliation window, so transient observation failure of one owner does not suppress observation of the other. Preserve exact six-field identity equality, the existing 2.0-second finalization grace, true owner-loss behavior, durable schemas and public terminal APIs."

