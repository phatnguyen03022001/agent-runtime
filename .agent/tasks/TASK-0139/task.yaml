    - tests/test_cloudflare_adapter.py
    - tests/test_transport_conformance.py
    - requirements.lock
    - .agent/tasks/TASK-0139/report-r1.yaml
  not_admitted_repository_rule: >-
    Remove or avoid speculative production Cloudflare code before final publication.
    A NOT_ADMITTED outcome may publish report evidence and narrowly reusable test
    evidence only when it does not create a dormant production path or new contract.
  scope_exception: >-
    A required production change outside the thin adapter boundary requires
    immediate NOT_ADMITTED classification unless the change is a purely mechanical
    dependency-lock consequence of one concrete adapter import. Do not expand
    architecture through an implicit exception.

