  - "Create a custom OAuth authorization server."
  - "Disable MCP Host/Origin security or bind the HTTP origin publicly."
  - "Persist Cloudflare/OAuth/tunnel credentials in repository, reports, logs, or argv."
  - "Redesign install.sh, package provenance, ServiceManagement, cutover, or menu-bar lifecycle for Cloudflare."
  - "Productize full installation/configuration/documentation UX; that belongs to TASK-0141."
  - "Perform TASK-0140 stress/red-team/platform qualification beyond the narrow transport admission gates in this task."
  - "Create branch, PR, worktree, automatic GitHub Actions, or alternate release topology."

