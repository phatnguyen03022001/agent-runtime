external_contracts:
  verification_date: "2026-09-22"
  execution_rule: >-
    Re-check current official Cloudflare and MCP documentation before relying on
    external behavior. If a material current contract conflicts with this task's
    security or architecture invariants, classify Cloudflare NOT_ADMITTED instead
    of redesigning Runtime core or weakening protection.
  cloudflare_managed_oauth:
    authority: "Cloudflare One Managed OAuth documentation"
    required_contract:
      - "Managed OAuth is Cloudflare Access-provided OAuth for non-browser clients; Agent Runtime must not implement an OAuth authorization server."
      - "The origin validates the Cloudflare Access JWT received in Cf-Access-Jwt-Assertion."
      - "JWT verification validates signature against the team-domain Access JWKS, issuer/team domain, application audience, and temporal validity."
  cloudflare_tunnel:
    authority: "Cloudflare Tunnel documentation"
    required_contract:
      - "Use a named Cloudflare Tunnel."
      - "The public hostname routes to a local service."
      - "Agent Runtime's local HTTP origin remains loopback-only; no public bind is required."
  mcp_http:
    authority: "Current MCP SDK and MCP Streamable HTTP contract"
    required_contract:
      - "Use the MCP SDK's Streamable HTTP implementation at /mcp."
      - "Do not hand-roll MCP JSON-RPC framing, session semantics, capability negotiation, or protocol translation."
      - "Preserve DNS-rebinding Host/Origin protection with exact trusted values; do not disable it merely to make reverse-proxy routing work."

objective: >-
  Evaluate Cloudflare as an OPTIONAL external transport/auth path and admit it only
  if a thin Cloudflare-specific adapter can expose the exact same canonical Agent
  Runtime MCP contract through Streamable HTTP /mcp behind Cloudflare Access
  Managed OAuth and a named Cloudflare Tunnel, while leaving the existing OpenAI
  Secure MCP Tunnel path mandatory, default, and unchanged.

admission_outcome:
  allowed_values:
    - ADMITTED
    - NOT_ADMITTED
  completion_rule: >-
    TASK-0139 must finish with exactly one admission outcome. Cloudflare is ADMITTED
    only when every mandatory Cloudflare gate passes. Failure or inability to prove
    any mandatory gate is NOT_ADMITTED with exact durable evidence; do not create a
    rescue task merely to save Cloudflare.
  openai_requirement: "PASS and unchanged in both outcomes"

architecture:
  default_openai_path:
    status: FROZEN
    required_shape:
      - "OpenAI Secure MCP Tunnel"
      - "existing default path"
      - "canonical agent_runtime.server:mcp"
    mutation_allowed: false
  optional_cloudflare_candidate:
    required_shape:
      - "MCP client"
      - "Cloudflare Access Managed OAuth"
      - "named Cloudflare Tunnel"
      - "loopback-only local HTTP origin"
      - "thin Cloudflare-specific adapter"
      - "same canonical agent_runtime.server:mcp object/core"
    transport:
      protocol: "MCP Streamable HTTP"
      endpoint: "/mcp"
      origin_bind: "127.0.0.1 only"
      implementation: "current MCP SDK HTTP application/transport; no custom MCP proxy"
    auth:
      provider: "Cloudflare Access Managed OAuth"
      origin_identity_header: "Cf-Access-Jwt-Assertion"
      validation_order: "before MCP tool dispatch"
      required_validation:
        - "header present"
        - "cryptographic signature valid against current team-domain Access JWKS"
        - "issuer equals configured Cloudflare Access team domain"
        - "audience contains the configured Access application audience"
        - "token is not expired and all standard temporal validation used by the selected JWT verifier passes"
      rejection_rule: >-
        Missing, invalid, expired, wrong-issuer, or wrong-audience identity is
        rejected before any MCP tool implementation executes.
    transport_security:
      rule: >-
        Preserve MCP SDK DNS-rebinding protection. Configure only the exact
        loopback origin and exact trusted public hostname/origin values required
        by the deployed reverse-proxy shape. Do not disable Host/Origin validation
        as a routing workaround.
    adapter_boundary:
      rule: >-
        Cloudflare-specific logic stays outside Runtime tool implementations and
        reuses the same canonical MCP server object. It may adapt HTTP serving,
        Access identity validation, and adapter-local configuration only.
      must_not_own:
        - "tool registration"
        - "ToolContract metadata"
        - "request/result schema definitions"
        - "capability availability semantics"
        - "Runtime business logic"
        - "repo or terminal policy"
        - "OAuth authorization-server behavior"
  activation_model:
    rule: >-
      Cloudflare remains optional and opt-in. TASK-0139 does not replace, wrap,
      or auto-enable the OpenAI path and does not redesign package or
      ServiceManagement lifecycle. Qualification may start the adapter explicitly.
    concurrency_scope: >-
      Mandatory concurrency qualification covers concurrent calls through the
      Cloudflare candidate and requires the same per-Runtime capacity/session
      semantics as the frozen core. Do not invent cross-process global scheduling
      or a generic multi-transport coordinator.

contract_identity:
  rule: "Transport parity is exact contract identity, not tool-count parity."
  primary_oracle:
    source: "agent_runtime.schema_export"
    requirement: >-
      The deterministic schema bundle bytes/hash produced from the canonical
      server/core must remain identical across the default and Cloudflare paths.
  required_dimensions:
    - "server name/version/description/instructions and relevant MCP server metadata"
    - "exact ordered public capability/tool names"
    - "tool descriptions"
    - "request schemas"
    - "result schemas"
    - "tool annotations"
    - "ToolContract authority"
    - "ToolContract preconditions"
    - "ToolContract bounds"
    - "ToolContract postconditions"
    - "capability supported/available/unavailable_reason_code values"
    - "success result representation"
    - "typed validation/error representation and semantics"
    - "runtime_capabilities output"
    - "generated deterministic schema bundle bytes and bundle_sha256"
  parity_rule: >-
    Any adapter-auth or HTTP-layer error is allowed only before MCP dispatch and
    must not mutate the canonical tool contract. Once a request reaches MCP tool
    dispatch, observable tool semantics must be the frozen canonical semantics.

configuration_and_secrets:
  repository_secrets_allowed: false
  report_secret_values_allowed: false
  argv_secret_values_allowed: false
  log_secret_values_allowed: false
  public_nonsecret_values_may_include:
    - "public hostname"
    - "Cloudflare Access team/domain identifier"
    - "Access application audience identifier"
    - "loopback HTTP port"
  secret_values_include:
    - "OAuth access tokens"
    - "OAuth refresh tokens"
    - "Cloudflare Tunnel credentials/tokens"
    - "Cloudflare API credentials"
    - "Cf-Access-Jwt-Assertion token values"
  configuration_rule: >-
    TASK-0139 may introduce only the minimum adapter-local non-secret configuration
    needed for qualification. Do not productize install/config UX here. Full
    operator-facing configuration and documentation belong to TASK-0141.
  dependency_rule: >-
    Prefer already locked dependencies. Change dependency metadata/lock only if a
    concrete imported production dependency is genuinely required; dependency
    convenience alone is not authority to expand scope.

cloudflare_external_state:
  allowed: true
  rule: >-
    Qualification may create only bounded task-scoped Cloudflare resources needed
    to prove a named tunnel and Access Managed OAuth path, using credentials already
    available through operator-approved mechanisms. Never persist credential
    material in the repository or reports.
  cleanup: >-
    Remove task-scoped temporary Cloudflare resources after evidence capture unless
    the operator explicitly marks a resource as retained. Do not mutate unrelated
    zones, applications, tunnels, policies, or hostnames.
  missing_prerequisite: >-
    If the execution environment cannot obtain the operator-approved Cloudflare
    account/domain/auth prerequisites needed to prove a mandatory gate, record the
    exact missing qualification evidence and finish NOT_ADMITTED rather than
    weakening the gates or leaving the task indefinitely blocked.

mandatory_openai_gates:
  - id: OAI-1
    requirement: "Existing OpenAI Secure MCP Tunnel remains the mandatory default path with no production-path change."
  - id: OAI-2
    requirement: "Frozen Runtime version, exact 19-tool order, ToolContract Kernel v1, schema export, runtime_capabilities, reason codes, and doctor semantics remain unchanged."
  - id: OAI-3
    requirement: "Canonical OpenAI/stdin contract discovery and representative tool success/error behavior remain PASS."
  - id: OAI-4
    requirement: "No install, ServiceManagement, tunnel-client, or start.sh redesign is introduced for Cloudflare."

mandatory_cloudflare_gates:
  - id: CF-1
    requirement: "Real Streamable HTTP endpoint is /mcp and the local origin binds only to loopback."
  - id: CF-2
    requirement: "Traffic reaches the loopback origin through a real named Cloudflare Tunnel."
  - id: CF-3
    requirement: "Cloudflare Access authentication is required; unauthenticated requests cannot reach MCP dispatch."
  - id: CF-4
    requirement: "Invalid, expired, wrong-issuer, and wrong-audience Access identity are rejected before MCP tool execution."
  - id: CF-5
    requirement: "OAuth cold connect succeeds with a conforming MCP client."
  - id: CF-6
    requirement: "OAuth access-token refresh succeeds without tool-contract drift."
  - id: CF-7
    requirement: "After refresh/grant expiry, the client performs a clean re-authentication flow rather than bypassing Access."
  - id: CF-8
    requirement: "Client reconnect succeeds after a bounded tunnel/transport interruption."
  - id: CF-9
    requirement: "A representative long-running Runtime call preserves existing cancellation/result/error behavior through the HTTP path."
  - id: CF-10
    requirement: "No automatic replay occurs for an ambiguous destructive request after transport interruption."
  - id: CF-11
    requirement: "Concurrent calls through Cloudflare preserve existing Runtime capacity/session limits and failure semantics."
  - id: CF-12
    requirement: "Exact canonical contract identity passes across server metadata, tools, schemas, annotations, ToolContracts, runtime_capabilities, success/error semantics, and deterministic schema bundle."
  - id: CF-13
    requirement: "No Cloudflare/OAuth/tunnel secret appears in repository history, reports, logs, or process argv."
  - id: CF-14
    requirement: "Runtime core/tool implementation semantics remain unchanged."

immediate_not_admitted_conditions:
  - "Runtime core or canonical tool-registry redesign is required."
  - "The OpenAI default path must change."
  - "A custom MCP protocol implementation or protocol proxy is required."
  - "A custom OAuth authorization server is required."
  - "A generic transport/plugin framework is required."
  - "Host/Origin or equivalent transport security must be weakened merely to route Cloudflare."
  - "The local origin must bind to a public/non-loopback interface."
  - "Repository-held credentials are required."
  - "Correctness requires automatic replay of ambiguous destructive calls."
  - "An Enterprise-only Cloudflare feature is required solely to rescue basic correctness."
  - "Package/ServiceManagement redesign is required solely for Cloudflare."
  - "The canonical 19-tool contract cannot remain byte/semantics-identical."

qualification:
  baseline:
    - "Before implementation mutation, capture exact canonical schema bundle bytes/hash and server/tool metadata from the frozen default server."
    - "Capture current live OpenAI Runtime identity/capability evidence through AGENT_RUNTIME."
    - "Record the exact frozen files/hashes whose mutation would violate the default path."
  focused_adapter_tests:
    - "Adapter starts only on loopback and serves the MCP SDK Streamable HTTP application at /mcp."
    - "Exact Host/Origin allow-list behavior passes without disabling DNS-rebinding protection."
    - "JWT middleware rejects missing, malformed, invalid-signature, expired, wrong-issuer, and wrong-audience assertions before MCP dispatch."
    - "JWKS key rotation/cache behavior is bounded and fail-closed; never log token/JWK private material."
    - "Authenticated dispatch reaches the same canonical server object."
    - "Adapter shutdown does not change canonical terminal cleanup semantics."
  transport_conformance:
    - "Compare exact server metadata and exact ordered tools/list representation between canonical stdio/default server and Cloudflare Streamable HTTP."
    - "Compare canonical deterministic schema export bytes/hash."
    - "Compare runtime_capabilities output."
    - "Exercise representative read success, typed validation failure, capability failure, and bounded mutation behavior."
    - "Use disposable fixtures only for mutation/replay qualification; never use the production repository or unrelated host state as a destructive test target."
  auth_lifecycle:
    - "Real Managed OAuth cold connect."
    - "Real access-token refresh under a deliberately short test lifetime where operator-controlled configuration permits."
    - "Real clean re-authentication after refresh/grant expiry or revocation-equivalent bounded test condition."
  resilience:
    - "Interrupt/restart only the task-scoped Cloudflare tunnel/adapter used for qualification; prove reconnect."
    - "Exercise a representative long-running Runtime call across the Cloudflare path."
    - "Prove ambiguous destructive HTTP requests are not automatically replayed by adapter/client recovery logic."
    - "Exercise concurrent Cloudflare calls at and beyond the existing Runtime capacity boundary and compare canonical reason/error semantics."
  benchmark:
    rule: "Measure for comparison and evidence only; do not invent an SLA."
    required_observations:
      - "cold connect"
      - "warm reconnect"
      - "tool discovery"
      - "representative simple call latency distribution"
      - "representative long-running call"
      - "OAuth refresh"
      - "tunnel restart/recovery"
    statistics:
      - "sample count"
      - "min"
      - "median"
      - "p95 where sample count is sufficient"
      - "max"
    acceptance: "No arbitrary numeric threshold unless an existing Runtime contract already defines one."
  secret_audit:
    - "Inspect exact repository diff/history candidates for known Cloudflare credential/token forms without printing values."
    - "Inspect task-owned logs with redaction-safe checks."
    - "Inspect process argv for credential values using only bounded task-owned process evidence."
  final_regression:
    - "Run focused tests first."
    - "Run canonical local ./verify after final diff stabilization and before any implementation publication."
    - "Require zero failures/errors."
    - "Recompute canonical schema bundle and require exact identity with the pre-change baseline."
    - "Require OpenAI default-path files and semantics unchanged."

scope:
