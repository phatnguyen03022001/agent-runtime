    requirement: "OpenAI Secure MCP Tunnel remains mandatory, default, and unchanged."
    evidence_required: >-
      Exact diff/path proof plus live/default contract evidence and canonical regression
      verification show no OpenAI lifecycle, tool, schema, metadata, or error-semantic drift.
  - id: AC-2
    requirement: "Cloudflare admission ends with exactly ADMITTED or NOT_ADMITTED."
    evidence_required: "Report records one outcome, exact gate matrix, and decisive evidence."
  - id: AC-3
    requirement: "If ADMITTED, Cloudflare uses only a thin external adapter around the same canonical MCP server/core."
    evidence_required: >-
      Code inspection and tests prove one adapter boundary, no duplicate registry,
      no core-tool branches, and no custom MCP/OAuth-server implementation.
  - id: AC-4
    requirement: "If ADMITTED, real named-tunnel Streamable HTTP /mcp connectivity is proven with loopback-only origin."
    evidence_required: >-
      Bound local listener evidence, named tunnel identity without credential values,
      authenticated tool discovery, and exact endpoint evidence.
  - id: AC-5
    requirement: "If ADMITTED, Access Managed OAuth and origin JWT validation fail closed."
    evidence_required: >-
      Cold connect, refresh, re-authentication, and pre-dispatch rejection proofs for
      missing/invalid/expired/wrong-issuer/wrong-audience assertions.
  - id: AC-6
    requirement: "If ADMITTED, canonical contract identity is exact across both transports."
    evidence_required: >-
      Exact server metadata/tool-list comparison, deterministic schema bundle
      equality, runtime_capabilities equality, ToolContract parity, and
      representative success/error semantic parity.
  - id: AC-7
    requirement: "If ADMITTED, transport interruption does not create unsafe replay or capacity drift."
    evidence_required: >-
      Reconnect proof, representative long-running call evidence, disposable
      destructive ambiguity proof with no automatic replay, and concurrent call
      evidence preserving Runtime capacity semantics.
  - id: AC-8
    requirement: "No secret leakage occurs."
    evidence_required: >-
      Redaction-safe repository/history/log/argv audit records PASS without
      persisting credential or token values.
  - id: AC-9
    requirement: "Canonical verification is green and Runtime core semantics remain frozen."
    evidence_required: >-
      Focused tests plus canonical local ./verify complete with zero failures/errors,
      schema baseline remains exact, and forbidden frozen paths/semantics remain unchanged.
  - id: AC-10
    requirement: "If NOT_ADMITTED, rejection is clean and does not create rescue-task debt."
    evidence_required: >-
      Exact failing mandatory gate/reason is durably recorded; OpenAI remains PASS;
      speculative production Cloudflare residue is absent; TASK-0140 can proceed
