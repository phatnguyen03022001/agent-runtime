acceptance_criteria:
  - {id: AC-1, requirement: "One fresh release-gate run is uniquely bound to the authorized TASK-0204 source identity.", evidence_required: "Historical run remains attempt 1; one new workflow_dispatch run attempt 1; exact head SHA; no rerun/second dispatch; terminal success."}
  - {id: AC-2, requirement: "Remote canonical verification and frozen-candidate build gate succeed.", evidence_required: "build-release success including full canonical verify, exactly one candidate build, double deterministic assets, byte comparison, release_bundle verify and upload."}
  - {id: AC-3, requirement: "All accepted ARM64 compatibility lanes execute and pass.", evidence_required: "macOS 14/15/26 materialized jobs each PASS checksum, bundle validation, strict codesign/provenance and Python 3.13 arm64 smoke."}
  - {id: AC-4, requirement: "Remote artifact is complete and source-bound.", evidence_required: "Exactly one artifact with exactly three release payload files; checksum/manifest/local read-only release_bundle verify PASS; manifest source_revision equals new run head SHA."}
  - {id: AC-5, requirement: "No publication/live effect occurs.", evidence_required: "All tag/release/local build/live Runtime/config/plugin/reboot effect counts zero."}
  - {id: AC-6, requirement: "Canonical closure.", evidence_required: "Only report changes; evidence bytes deleted; clean synchronized MAIN ONLY."}

verification:
