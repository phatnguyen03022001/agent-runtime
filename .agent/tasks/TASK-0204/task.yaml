objective: "Dispatch exactly one NEW release-gate workflow run at the exact authorized TASK-0204 source identity, prove the remote canonical verifier, one frozen-candidate build, deterministic bundle gate and ARM64 macOS 14/15/26 compatibility matrix all succeed, and inspect the single produced release artifact. Do not rerun TASK-0202 and do not publish v0.5.2."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with local main and origin/main clean/synchronized MAIN ONLY."
    - "Confirm TASK-0203 accepted test fix is present and tests/test_durable_pipe.py contains the deterministic blocking fixture."
    - "Confirm .github/workflows/release-gate.yml blob is exactly fa0c6bc61bb660b103f3a45b239ac52def7ae1b8 and remains byte-identical to accepted TASK-0201."
    - "Confirm workflow trigger remains workflow_dispatch only, permissions contents:read, and no tag/release mutation authority exists."
    - "Fetch pre-dispatch release-gate run inventory and explicitly identify historical run 36912032079 attempt 1 as failed and not rerun. If attempt >1 exists for that run, stop BLOCKED."
    - "Record the complete pre-dispatch run-id set so the new run can be uniquely identified."
    - "Dispatch .github/workflows/release-gate.yml exactly once with ref=main. This is a NEW run, not a rerun."
    - "Do not invoke rerun-workflow, rerun-failed-jobs, rerun-job or a second dispatch under any outcome."
    - "Identify exactly one newly created run. Require event=workflow_dispatch, run_attempt=1, workflow path .github/workflows/release-gate.yml, head_branch=main and head_sha equal the exact authorized TASK-0204 base."
    - "If the new run is ambiguous, reconciliate by run inventory/id only. Never dispatch again."
    - "Observe only that exact new run to a terminal conclusion."
    - "Require final conclusion success."
    - "Require one successful build-release job and three successful materialized compatibility jobs for macos-14, macos-15 and macos-26."
    - "Inspect build-release steps/logs and require PASS for checkout, ARM64 assertion, Python 3.13 setup, locked requirements, canonical ./verify, exactly one zero-cost candidate build, deterministic release assets twice, byte comparison, release_bundle verify and upload."
    - "Record remote canonical verify classified/completed module count and test total; require the durable-pipe owner module PASS and the qualification module PASS if log detail is available."
    - "Require package candidate output appears exactly once. Record candidate_root/candidate_sha256 or corresponding bounded identity evidence from logs."
    - "Inspect each compatibility lane and require ARM64 assertion, exact artifact download, SHA256SUMS verification, release_bundle verify, strict codesign verify, package_provenance validate-zero-cost and bundled CPython 3.13 arm64 smoke all PASS."
    - "Require exactly one workflow artifact named agent-runtime-release-assets for the new run."
    - "Require zero artifacts associated with the historical failed run remain irrelevant to this qualification."
    - "Download the new run artifact exactly once."
    - "Inspect the artifact ZIP only as transport. Require exactly three release payload files: one .tar.gz, release-manifest.json and SHA256SUMS.txt; no extra release payload file."
    - "Materialize evidence only in isolated run-owned storage; do not commit binary assets."
    - "Verify SHA256SUMS.txt against the archive and require release-manifest archive filename/hash/size agreement."
    - "Run accepted macos/release_bundle.py verify locally against the downloaded assets read-only; do not build a candidate or install anything."
    - "Record manifest facts: runtime_version, source_revision, source_tree, candidate_sha256, initial_payload_closure, requirements_lock_sha256, expected_public_tool_count, expected_public_surface_sha256, substrate_manifest_schema, candidate_handoff_schema, payload_schema, archive_filename, archive_sha256, archive_size_bytes, archive_member_count."
    - "Require release manifest source_revision to equal the new workflow run head_sha under the existing package provenance identity contract."
    - "If any job, manifest, artifact or identity predicate fails, stop BLOCKED. No source fix or remote rerun is authorized."
    - "Delete downloaded/materialized artifact evidence after recording bounded hashes/manifest facts."
    - "Publish only .agent/tasks/TASK-0204/report.yaml as tracked repository mutation."
    - "Final main clean/synchronized MAIN ONLY, one worktree, no residue."

  allowed_existing_files_or_components:
