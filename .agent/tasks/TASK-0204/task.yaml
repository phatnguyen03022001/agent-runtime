invariants:
  - "The historical TASK-0202 run 36912032079 is never rerun."
  - "Exactly one new release-gate dispatch."
  - "The accepted workflow source remains unchanged."
  - "TASK-0203 reliability implementation remains unchanged."
  - "No source/test/workflow/policy/docs/version mutation."
  - "No tag/release/publication/live install/cutover/lifecycle/plugin/config/credential/reboot/permission effect."
  - "TASK-0196 remains paused."
  - "MAIN ONLY."

forbidden_changes:
  - "Any tracked file other than eventual TASK-0204 report."
  - "Any source, test, workflow, policy, docs, dependency, version or schema change."
  - "Rerunning historical run 36912032079."
  - "Any workflow rerun API/action."
  - "Any second new workflow dispatch."
  - "Any local package_app.sh build or canonical ./verify."
  - "Any tag, GitHub Release, public release asset publication or immutable-release mutation."
  - "Any live install/cutover/menu launch/Runtime Start/Stop/Restart/plugin/config/credential/permission/reboot effect."
  - "Any branch or PR."

