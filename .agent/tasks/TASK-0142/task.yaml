semantic_contract:

  start_identity:
    purpose: >-
      Caller-known correlation identity for one async execution intent. It is
      operational correlation only and grants no task/repository/security authority.
    shape:
      format: "exactly 32 lowercase hexadecimal characters"
      relation_to_foundation: >-
        Foundation Task C is expected to pass its execution_slice_id directly as
        start_identity after cutover.
    validation:
      - "validate before reservation"
      - "never derive identity from argv/cwd equality"
      - "identity is not authentication, authorization or a secret"

  exact_start_spec:
    fields:
      - "canonical validated resolved cwd"
      - "exact validated literal argv sequence"
    rule: >-
      The immutable exact start specification is bound to start_identity atomically
      at reservation time. Same identity with a different validated cwd or argv is a
      collision and fails closed before any additional process spawn.

  reserve_before_popen:
    mandatory_invariant: >-
      A keyed terminal_start MUST NOT execute Popen unless start_identity plus the
      exact validated start specification and a unique session_id have already been
      reserved atomically inside the current TerminalSessionManager incarnation.
    conceptual_order:
      - "validate start_identity"
      - "validate/canonicalize cwd and argv"
      - "under manager lock: lookup or reserve {start_identity, exact spec, session_id, lifecycle}"
      - "for a new reservation only: perform bounded capacity admission"
      - "mark STARTING"
      - "Popen"
      - "attach process/session resources to the pre-existing reservation"
      - "transition RUNNING or a truthful terminal startup-failure state"
    concurrency:
      same_key_same_spec_starting: >-
        Return/observe the same reserved operation with lifecycle STARTING, or wait
        only a very short existing bounded synchronization interval before returning
        STARTING. Do not couple the duplicate RPC lifetime to completion of Popen.
      same_key_same_spec_running_or_completed: >-
        Return the existing session/current retained result with zero additional spawn.
      same_key_different_spec: >-
        Fail closed as identity/spec conflict with zero additional spawn.
    capacity_order: >-
      Existing-key lookup/collision resolution occurs before new capacity rejection.
      A caller must be able to recover an already-running keyed session even while all
      active/heavy slots are occupied.

  startup_failure_semantics:
    pre_effect:
      definition: "reservation exists but Popen is proven never to have occurred"
      behavior:
        - "terminalize the keyed reservation as START_FAILED_PRE_EFFECT"
        - "retain it under normal completed-result retention"
        - "zero process side effect"
        - "same key does not silently spawn later; a new caller intent/new identity is required for a new execution attempt"
    post_effect:
      definition: "Popen occurred but later startup/session attachment/reader/monitor setup failed"
      behavior:
        - "start_identity MUST remain observable in the current Runtime incarnation"
        - "cleanup owned process group when required"
        - "terminalize as START_FAILED_POST_EFFECT"
        - "retain bounded result"
        - "same key MUST NOT spawn a second process"
    rule: >-
      No post-Popen failure may release the identity back to an absent state inside
      the same Runtime incarnation.

  public_start:
    legacy:
      call: "terminal_start(argv, cwd)"
      behavior: >-
        Remains accepted for backward compatibility and remains non-idempotent.
        Legacy omission of start_identity does not gain lost-ACK recovery.
    keyed:
      call: "terminal_start(argv, cwd, start_identity=<32hex>)"
      behavior: >-
        Conditional idempotency applies only to keyed mode. Because legacy mode remains
        non-idempotent, the tool's global MCP idempotent annotation stays conservative
        rather than claiming unconditional idempotency.

  public_poll:
    legacy: "terminal_poll(session_id=<id>, cursor=..., wait_ms=...)"
    keyed: "terminal_poll(start_identity=<32hex>, cursor=..., wait_ms=...)"
    selector_rule: "exactly one of session_id or start_identity"
    non_spawning_rule: >-
      terminal_poll by start_identity is observation/reconciliation only and can never
      create or restart work.
    unknown_identity: >-
      START_IDENTITY_UNKNOWN means the identity is not observable in the current
      Runtime incarnation/retention set. It is NOT proof that the process never ran.

  public_result:
    required_semantics:
      - "expose current lifecycle sufficiently to distinguish STARTING, RUNNING and terminal retained state"
      - "return session_id for a reserved keyed operation even while STARTING"
      - "include start_identity only when keyed"
      - "preserve bounded output/cursor semantics"
      - "terminal retained state exposes an attributable termination_reason"
    termination_reasons_minimum:
      - natural_exit
      - explicit_terminate
      - hard_wall_timeout
      - start_failed_pre_effect
      - start_failed_post_effect
    compatibility_rule: >-
      Legacy unkeyed successful starts continue to exhibit the existing running/exited
      behavior. New lifecycle/result fields may be additive for legacy observations;
      STARTING/start-failure lifecycle is principally a keyed-mode contract.

  lifetime:
    running:
      bound_seconds: 3600
      starts_from: "key reservation/session creation time for keyed sessions; session creation time for legacy sessions"
      rule: >-
        Client poll/control activity does not extend the hard wall. Absence of client
        polling is not permission to kill a healthy process before this bound.
      expiry:
        - "terminate owned process group"
        - "release HeavyExecutionAdmission lease"
        - "retain terminal result"
        - "termination_reason=hard_wall_timeout"
    completed:
      retention_seconds: 3600
      count_bound: 16
      starts_from: completed_at
      rule: >-
        Completed-result retention is independent of client activity and is evicted
        when either time or count bound requires it. Polling a completed result does
        not extend retention indefinitely.
    explicit_terminate:
      rule: >-
        Preserve the terminal result under the same completed retention instead of
        immediately making the session unobservable.
    client_activity:
      rule: >-
        last poll/control may remain telemetry but MUST NOT be the running-process
        kill criterion.

  output:
    retained_bytes: 65536
    poll_bytes: 16384
    rule: >-
      Preserve cursor_expired and dropped_output_bytes truthfully. Runtime console
      output is bounded transient transport evidence, not durable build/test proof.
      Do not increase output bounds in this task.

  capacity:
    active_session_ceiling: 6
    requirements:
      - "existing HeavyExecutionAdmission remains authoritative"
      - "new keyed reservation cannot bypass new-work admission"
      - "duplicate/reconciliation lookup of an existing key must work under full capacity"
      - "abandoned running jobs remain bounded by the hard wall"
      - "completed sessions release heavy execution capacity before retention"

  runtime_restart:
    rule: >-
      Session and start_identity registry remains in-memory. Graceful Runtime shutdown
      terminates owned running process groups and clears the registry. After restart,
      a prior start_identity is not observable and returns START_IDENTITY_UNKNOWN.
      No automatic respawn or cross-restart idempotency is claimed.
    crash_boundary: >-
      Hard Runtime/host crash remains an external unknown-outcome boundary. This task
      does not promise impossible child cleanup or persisted identity across process
      death.

