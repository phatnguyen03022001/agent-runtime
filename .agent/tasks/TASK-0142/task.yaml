objective: >-
  Make existing persistent terminal sessions recoverable across client/chat disconnect
  and lost terminal_start acknowledgement within one Runtime incarnation, without a
  database, daemon, generic job framework, new public tool, or cross-restart process
  supervisor. Add caller-known keyed start identity reserved atomically with the exact
  validated start specification before Popen, idempotent same-key reconciliation,
  collision fail-closed semantics, independent running hard-wall lifetime, bounded
  completed-result retention, truthful output-loss/termination evidence, and bounded
  capacity behavior while preserving legacy unkeyed calls.

