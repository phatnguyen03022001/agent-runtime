acceptance_criteria:
  AC_1:
    name: "Reserve-before-Popen atomicity"
    requirement: >-
      Keyed start_identity plus exact validated cwd/argv and session_id are reserved
      atomically before any Popen. Concurrent same-key/same-spec starts cause at most
      one Popen; same-key/different-spec causes zero additional Popen and fails closed.
  AC_2:
    name: "Lost-start-ACK recovery"
    requirement: >-
      If keyed Popen/session creation succeeds but terminal_start response is lost,
      successor terminal_poll(start_identity) observes the exact same operation/session
      without spawning a duplicate.
  AC_3:
    name: "Pre-effect/post-effect startup distinction"
    requirement: >-
      Failures proven before Popen are retained as START_FAILED_PRE_EFFECT; failures
      after Popen remain identity-observable as START_FAILED_POST_EFFECT and never
      release the key to an absent/re-spawnable state in the same Runtime incarnation.
  AC_4:
    name: "Client activity decoupled from process lifetime"
    requirement: >-
      A healthy running process is not reaped merely because no client polls for more
      than the old 600-second idle TTL. The independent 3600-second hard wall bounds
      running work and cannot be extended by polling.
  AC_5:
    name: "Completed-result retention"
    requirement: >-
      Natural exit, explicit terminate, hard-wall termination and keyed startup failure
      remain observable for bounded retention from completed_at, subject to both
      3600-second time and 16-result count bounds. Polling cannot extend retention.
  AC_6:
    name: "Capacity remains bounded"
    requirement: >-
      Active/heavy ceiling remains six; abandoned jobs cannot occupy slots past the
      hard wall; completed sessions release heavy capacity; existing-key reconciliation
      succeeds even when new-work capacity is full.
  AC_7:
    name: "Truthful bounded output"
    requirement: >-
      Existing 64KiB retained / 16KiB poll bounds and cursor_expired /
      dropped_output_bytes semantics remain truthful across keyed recovery. Output loss
      never becomes a fabricated PASS.
  AC_8:
    name: "Explicit restart boundary"
    requirement: >-
      Runtime registry remains in-memory; graceful shutdown kills owned running work and
      clears identity; post-restart keyed lookup returns START_IDENTITY_UNKNOWN and
      never respawns automatically.
  AC_9:
    name: "Backward-compatible 19-tool contract evolution"
    requirement: >-
      Public tool count/order remains 19; legacy unkeyed start and session_id poll stay
      supported; only terminal_start/poll schema versions advance to v2; Runtime version
      is 0.2.1; unrelated capability schemas/semantics remain unchanged.
  AC_10:
    name: "Regression and activation evidence"
    requirement: >-
      Focused failure-injection/concurrency/capacity/schema tests and canonical ./verify
      pass on the exact candidate; report publishes exact new schema identity and one
      runtime_activation_revision for later Foundation Task C.

failure_injection:
  mandatory:
    - "same-key same-spec concurrent calls race before reservation"
    - "same-key different-spec concurrent collision"
    - "failure after reservation before capacity admission"
    - "capacity rejection before Popen"
    - "failure immediately before Popen"
    - "Popen succeeds then exception before normal response serialization"
    - "Popen succeeds then reader/monitor/session-attachment setup fails"
    - "lost terminal_start acknowledgement simulated by discarding first call result then polling start_identity"
    - "client inactivity exceeds 600 seconds while running but remains below hard wall"
    - "running age crosses 3600-second hard wall"
    - "polling repeatedly does not extend hard wall"
    - "natural completion while client absent"
    - "explicit terminate followed by successor poll"
    - "completed age crosses 3600-second retention"
    - "completed-result count exceeds 16"
    - "polling completed result does not refresh retention"
    - "output exceeds 64KiB before successor poll"
    - "all six active/heavy slots occupied then duplicate existing-key lookup"
    - "all six active/heavy slots occupied then new keyed start"
    - "graceful Runtime shutdown with running keyed session"
    - "post-restart/brand-new manager lookup of prior start_identity"

negative_tests:
  mandatory:
    - "missing/empty/non-32hex/uppercase/oversized start_identity"
    - "terminal_poll with both session_id and start_identity"
    - "terminal_poll with neither selector"
    - "unknown start_identity must never spawn"
    - "same identity + different cwd"
    - "same identity + different argv"
    - "legacy unkeyed terminal_start remains globally non-idempotent"
    - "new keyed path cannot bypass workspace/protection validation"
    - "capacity failure cannot leave an unbounded STARTING reservation"
    - "post-Popen failure cannot delete key and permit second Popen"
    - "client poll cannot extend hard wall"
    - "completed poll cannot extend retention"
    - "no session/start registry file appears in workspace or user config"
    - "no Runtime restart persistence claim"

