execution_rules:
  - "KISS: extend the existing TerminalSessionManager; do not create a second job subsystem."
  - "Reserve keyed identity/spec before Popen; this invariant is non-negotiable."
  - "Keep duplicate same-key STARTING observation non-blocking or only minimally bounded; never wait an RPC on long process startup/completion."
  - "Existing-key lookup precedes new-work capacity rejection."
  - "Do not treat START_IDENTITY_UNKNOWN as proof that no side effect happened."
  - "Do not make poll/control frequency a correctness heartbeat."
  - "Do not persist the in-memory identity registry."
  - "Do not deploy or cut over the Runtime in this task."
