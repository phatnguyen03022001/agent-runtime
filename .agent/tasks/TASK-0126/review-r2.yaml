  principles:
    - "governance_head is remote control-plane identity and must not imply local source synchronization"
    - "source_base is an immutable commit SHA, never a branch-name substitute"
    - "source_base must bind expected branch and allowed_source_paths"
    - "future Executor preflight proves local HEAD == source_base and clean; it does not sync governance history into source checkout"
