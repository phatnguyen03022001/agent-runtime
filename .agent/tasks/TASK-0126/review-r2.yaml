  explanation: >-
    Revision 2 required the local source checkout to fast-forward through governance-only planning history
    before source work could begin. The exact repo_fast_forward request was blocked before Agent Runtime execution.
    The source checkout itself was already clean and at an immutable commit with the accepted source bytes.
    Governance identity and source identity must therefore be modeled separately.

