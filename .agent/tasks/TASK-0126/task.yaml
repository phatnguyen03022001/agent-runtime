implementation_policy:
  - "KISS and reuse-first; standard library only."
  - "No Wave-2 fs_write or repo_commit."
  - "No LSP/index/database/background worker/stateful search."
  - "No repo_exec/git_exec or generic filesystem god-tool."
  - "Source authoring through terminal_exec is FORBIDDEN in revision 2."
  - "Desktop Commander may be used only through typed filesystem operations for source authoring/readback: write_file, edit_block, read_file, read_multiple_files, get_file_info."
  - "Desktop Commander start_process, interact_with_process, read_process_output, kill/terminate, shell execution, search-process lifecycle, config mutation, and unrelated filesystem operations are forbidden."
  - "Desktop Commander writes are restricted to /Users/tienphat/Developer/agent-runtime and canonical allowed_source_paths."
  - "For existing files, prefer edit_block with exact expected replacement count and minimal unique context."
  - "For new files, require pre-write nonexistence proof, one rewrite operation, immediate readback, and later canonical diff verification."
  - "The CHATGPT_LOCAL Executor remains the sole source writer; Desktop Commander is a bounded authoring primitive, not a second Executor."
  - "terminal_exec may be used only for focused tests, git diff --check, canonical verify, and the final local git commit."
  - "Do not use terminal_exec for repository synchronization or publication when repo_fast_forward/repo_publish cover the operation."
  - "Keep terminal calls single-purpose; do not hide multiple consequence classes in giant compound commands."

