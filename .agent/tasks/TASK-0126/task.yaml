fs_list:
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
  input:
    cwd: AbsoluteCwd
    path: "optional cwd-relative directory; null means cwd"
    max_entries: "default 200; 1..1000"
  contract:
    - "Non-recursive immediate children only."
    - "Deterministic lexical ordering."
    - "Return schema_version=1, path, entries[{path,type,size_bytes}], truncated."
    - "type is file|directory|symlink; only regular files report size_bytes."
    - "Symlinks may be reported but never followed/traversed."
    - "Reject unsafe/absolute/dot-dot/NUL/outside-workspace paths."
    - "Hard scan/output/deadline bounds; no recursive tree mode."

fs_search:
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
  input:
    cwd: AbsoluteCwd
    root: "optional cwd-relative directory; null means cwd"
    target: "content|path"
    query: "non-empty UTF-8 literal"
    case_sensitive: "default true"
    max_results: "default 100; 1..500"
  contract:
    - "Recursive bounded literal search only; no regex/glob/shell/background session."
    - "No required ripgrep dependency."
    - "Never traverse symlinks or .git."
    - "Content search scans regular UTF-8 text files, skips NUL/binary-like and invalid UTF-8 files."
    - "Content results are one per matching line with 1-based line/column and bounded preview."
    - "Path results return path with null line/column/preview."
    - "Case-insensitive mode uses deterministic Unicode casefold semantics."
    - "Return schema_version=1, results, files_scanned, bytes_scanned, truncated, deadline_seconds."
    - "Server hard ceilings: 20,000 regular files, 64 MiB scanned bytes, 500 results, 256 KiB response, 5 seconds."
    - "Do not silently treat inaccessible descendants as exhaustive success; use typed failure."

repo_diff:
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
  input:
    cwd: AbsoluteCwd
    scope: "worktree|staged"
    paths: "optional <=64 literal relative paths; aggregate <=64 KiB"
    context_lines: "default 3; 0..20"
  contract:
    - "Require supported Git working tree and cwd at repository root."
    - "Use fixed /usr/bin/git, shell=False, sanitized environment, local only."
    - "Set GIT_LITERAL_PATHSPECS=1."
    - "Disable external diff, textconv, fsmonitor, pager, color, submodule recursion, and prompting."
    - "No network, fetch, hooks, arbitrary Git argv, index/worktree/ref mutation, or optional locks."
    - "scope=worktree means index-to-working-tree; scope=staged means HEAD-to-index; untracked files are not included."
    - "Return schema_version=1, head_sha, files, patch, truncated, state_token."
    - "Patch transport <=256 KiB; complete diff scan <=64 MiB; <=1000 returned file names; 5 second deadline."
    - "state_token is SHA-256 over a versioned canonical preimage containing scope, HEAD, canonical path filter, and complete raw selected diff bytes before returned-patch truncation."
    - "If complete diff state exceeds the internal ceiling, fail OUTPUT_LIMIT; never hash only a prefix."

fs_patch:
  annotations: {readOnlyHint: false, destructiveHint: true, idempotentHint: true, openWorldHint: false}
  input:
    cwd: AbsoluteCwd
    path: "required safe cwd-relative regular-file path"
    expected_sha256: "required lowercase 64-hex current file digest"
    edits: "ordered 1..20 exact old_text/new_text edits; aggregate <=256 KiB"
  contract:
    - "UTF-8 regular text only; reject NUL/binary-like and files >1 MiB."
    - "Verify expected_sha256 before mutation."
    - "Apply edits sequentially in memory; each non-empty old_text must match exactly once in the evolving text."
    - "Zero or multiple matches => PATCH_TARGET_MISMATCH and zero mutation."
    - "No regex, fuzzy matching, unified diff, line-number patch, append, chmod/chown, directory creation, or full-file write API."
    - "Write a task-owned same-directory temporary regular file, preserve original permission bits, fsync as appropriate, revalidate target pathname/inode/content before replacement, then atomic os.replace."
    - "Observed drift before commit point => LOCAL_STATE_CHANGED and zero replacement."
    - "Replay with stale expected_sha256 must fail closed without a second mutation."
    - "Return schema_version=1, path, old_sha256, new_sha256, edits_applied, bytes_before, bytes_after."
    - "Always cleanup task-owned temporary artifacts."

errors:
