authoring_failure_policy:
  - "If a Desktop Commander typed file mutation is rejected before execution, classify PLATFORM_BLOCK or TOOL_CONTRACT_FAILURE truthfully and stop; do not fall back to terminal source authoring."
  - "If a Desktop Commander write partially materializes a new file before failure, inspect exact bytes/state and either continue only when the same bounded operation has a deterministic continuation, or clean the task-owned partial artifact with typed file operations; never hide partial state."
  - "Do not switch to Codex or another shell/process surface solely to obtain a different safety judgment."

failure_policy:
  classes:
    - PLATFORM_BLOCK
    - RUNTIME_REJECTION
    - HOST_PERMISSION
    - TOOL_CONTRACT_FAILURE
    - IMPLEMENTATION_FAILURE
  rule: >-
    A platform block before Runtime execution is not an implementation failure.
    Do not obfuscate, re-encode, or switch surfaces solely to obtain a different safety decision.

terminal_states:
