    tests.test_screen_capture_mcp tests.test_mcp_contracts
    tests.test_mcp_client_conformance tests.test_surface_and_scripts
    tests.test_task0041_boundedness tests.test_timing

canonical_verification:
  command: "PYTHON=.venv/bin/python PYTHONDONTWRITEBYTECODE=1 ./verify"
  happy_path_invocations: 1
  rules:
    - "Before canonical verify, run git diff --check and require all changed paths are inside allowed_source_paths."
    - "Run canonical verify once after implementation is final."
    - "If it fails due to implementation/test failure, source correction is allowed within scope and every canonical invocation must be reported truthfully."
    - "Never rerun a passing canonical verification on unchanged bytes."

publication:
  implementation_commit:
    count: 1
    rules:
      - "Commit only after canonical verification PASS."
      - "No amend, reset, rebase, stash, merge commit, or force operation."
  repo_publish:
    authority: "0/1"
    rules:
      - "Publish the exact implementation commit to origin/dev with expected-state-guarded repo_publish."
      - "Do not use terminal git push."
      - "Require local HEAD = origin/dev = implementation commit and worktree clean."
      - "Require remote main unchanged."

