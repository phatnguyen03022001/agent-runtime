objective: >-
  Complete the final live Agent Runtime MCP proof on the accepted generation. Directly exercise all six public MCP
  tools, prove six simultaneous heavy workloads are admitted, prove a seventh heavy request fails fast before spawn,
  prove cheap read/observer calls remain responsive while x6 is saturated, and clean up every test-owned workload.
  Preserve the accepted candidate, schema-5 transaction, runtime.env, desired-state, ServiceManagement, launchd,
  installed app, Runtime/tunnel lifecycle, and production source. This task is not authority to commit-cutover or freeze.

scope:
  required_checks:
    - "Fresh-resolve GitHub dev, local HEAD, origin/dev, and require exact TASK-0068 handoff base with a clean designated working tree before proof."
    - "Require direct Agent Runtime MCP namespace is exposed in this NEW Executor session before starting workloads. If absent, stop BLOCKED without reconnect/reload workarounds."
    - "Freshly call capacity_observer and require effective capacity_parallelism_ceiling=6 with CAPACITY_X6_AVAILABLE and without LIMIT_OPERATOR_MAX."
    - "Exercise terminal_exec successfully with a bounded benign literal-argv call."
    - "Exercise terminal_start by starting bounded benign test-owned long-enough workloads using ephemeral task-owned paths/state only."
    - "Hold exactly six simultaneous heavy workloads and obtain evidence that observed heavy occupancy reaches 6."
    - "While six heavy slots are occupied, issue one seventh heavy request and require the canonical capacity/fail-fast error before spawn. Prove no seventh test process/session was created."
    - "While x6 remains occupied, require capacity_observer remains responsive and reports saturated heavy occupancy/capacity consistently."
    - "While x6 remains occupied, require fs_read_batch remains responsive using a bounded repository read."
    - "Exercise terminal_poll against test-owned terminal sessions and require valid bounded polling behavior."
    - "Exercise terminal_control only against test-owned sessions to terminate/release them cleanly."
    - "After cleanup, require zero test-owned sessions/processes remain and capacity returns to unsaturated baseline."
    - "Within this new Executor session, prove direct MCP calls succeed before saturation, during x6 saturation, and after cleanup. This is the continuity proof for TASK-0068; continuity with the dead predecessor chat is not required or salvageable."
    - "Freshly re-prove preserved bindings after workloads: transaction 5/PENDING/APP_SWAPPED metadata 589436ea..., accepted candidate 8017f538..., handoff d8bd8885..., runtime.env mode 0600 SHA 6e6fef8e..., and clean repository state."
    - "If host evidence is available without lifecycle mutation, re-prove one listener on 127.0.0.1:8080 and /healthz=/readyz=200. Absence of Remote Desktop Commander alone is not a blocker if direct Agent Runtime MCP proof and preservation bindings can be proven through allowed surfaces."
    - "Publish only .agent/tasks/TASK-0068/report.yaml to dev, non-force, then stop at ARCHITECT_REVIEW."

allowed_ephemeral_mutation:
