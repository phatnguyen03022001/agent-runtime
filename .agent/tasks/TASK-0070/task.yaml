objective: >-
  Determine the exact evidence-backed cause, or the narrowest defensible cause class, of the three Python bytecode
  files appearing inside the sealed installed Agent Runtime app bundle. The investigation must establish when the
  files were created, which installed source paths they were compiled from, whether the canonical Runtime execution
  path could have created them, and whether a prior diagnostic/probe/manual Python invocation is the supported creator
  path. Do not repair or normalize any state in this task.

scope:
  required_checks:
    - "Fresh-resolve GitHub dev, local HEAD, and origin/dev; require exact TASK-0070 handoff base and clean designated working tree before investigation."
    - "Freshly re-prove the schema-5 transaction, accepted candidate/handoff, runtime.env hash/mode, desired-state hash, healthy Runtime/tunnel/listener/health state, and presence of exactly the three known pyc drift files before forensic inspection. Stop on unrelated drift."
    - "For each of the three pyc files, record path, regular-file/symlink status, mode, owner/group, size, SHA-256, filesystem birth time, mtime, ctime, and xattr names only. Do not modify timestamps or xattrs."
    - "Read each pyc header without importing or executing it. Record Python magic/header mode and source metadata encoded by the pyc format where available."
    - "Using a bytecode-write-disabled standard-library-only inspection process, deserialize code metadata only as necessary to extract co_filename and recursively collect code-object source filenames. Never execute the code object and never import agent_runtime from the installed bundle."
    - "Require any Python forensic helper process to run with PYTHONDONTWRITEBYTECODE=1 and preferably -B. It must not import installed agent_runtime modules."
    - "Compare each pyc's source identity and metadata against the exact installed .py source and the immutable repository candidate. Prove whether the pyc was compiled from the installed bundle path or another path."
    - "Inspect the live Runtime/tunnel/MCP process environment read-only and prove whether PYTHONDONTWRITEBYTECODE=1 is present in the current canonical Runtime generation. Do not expose credentials or unrelated secret values."
    - "Read the accepted installed start.sh path and prove the canonical --serve path explicitly sets PYTHONDONTWRITEBYTECODE=1 before tunnel-client/MCP exec."
    - "Correlate pyc birth/mtime evidence against known lifecycle/config/task checkpoints and process-generation times where available. Use absolute timestamps and do not infer ordering from report prose alone."
    - "Search repository task reports/reviews and local non-secret execution evidence for prior commands/probes that directly invoked the installed Runtime Python or imported installed agent_runtime modules outside the canonical --serve environment. Pay special attention to capacity-observer diagnostics around the 4->6 parallelism investigation and any command using the installed .venv Python against Contents/Resources/runtime."
    - "If shell/process history or logs can provide read-only attribution evidence, inspect only the minimum relevant records. Do not read browser history, Photos, Keychain, unrelated shell history, or unrelated user data."
    - "Distinguish PROVEN_CREATOR, STRONGLY_SUPPORTED_CREATOR_CLASS, and UNPROVEN hypotheses. Do not claim a specific creator command unless timestamp/path/process evidence supports it."
    - "Determine whether the canonical production Runtime path itself is exonerated by environment/source evidence, or whether a production-path gap remains."
    - "Do not delete the pyc files, do not re-sign the app, and do not test a repair in place. Repair design belongs to a successor task only after Architect review."
    - "Publish only .agent/tasks/TASK-0070/report.yaml to dev, non-force, then stop at ARCHITECT_REVIEW."

forbidden_changes:
  - "Do not delete, move, rename, truncate, chmod, chown, touch, quarantine, or rewrite any pyc, source file, installed-app file, xattr, signature, or bundle resource."
  - "Do not import or execute any of the three pyc files."
  - "Do not run compileall, py_compile, importlib compilation, or any command intended to create/recreate bytecode in the installed bundle."
  - "Do not run commit-cutover, cutover, rollback, resume, recover, reinstall, uninstall, repair, or any transaction mutation."
  - "Do not start, stop, restart, signal, reload, kickstart, bootstrap, bootout, or manually execute AgentRuntimeRuntimeService or tunnel-client."
  - "Do not edit runtime.env, desired-state, ServiceManagement, launchd, installed app, repository candidate, production source, tests, dependencies, packaging, docs, tags, releases, or main."
  - "Do not expose CONTROL_PLANE_API_KEY, CONTROL_PLANE_TUNNEL_ID, signing identity, unrelated runtime.env values, Keychain contents, or private user data."
  - "Do not delegate to Codex, Claude, Antigravity, another ChatGPT, or nested executors."

invariants:
  - "Investigation is read-only with respect to Runtime lifecycle, transaction, config, installed app, candidate, and OS service ownership."
  - "The three known pyc files remain byte-identical throughout the task."
  - "No forensic command may itself create new bytecode inside the installed app."
  - "Root-cause conclusion must be evidence-graded and must separate fact from inference."
  - "No repair authorization is implied."
  - "No commit-cutover authorization is implied."
  - "No final freeze-readiness assertion is allowed."

