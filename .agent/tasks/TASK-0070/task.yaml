acceptance_criteria:
  - id: AC-1
    requirement: "Exact pre-investigation live/candidate/transaction bindings and exact three-file drift set are proven."
    evidence_required: "Exact-base/clean-tree plus transaction/candidate/handoff/config/desired-state/live-health and three pyc identities."
  - id: AC-2
    requirement: "The pyc artifacts are forensically characterized without execution or mutation."
    evidence_required: "Per-file hashes/stat timestamps/header/source filename metadata and unchanged post hashes."
  - id: AC-3
    requirement: "Canonical production bytecode-write behavior is proven."
    evidence_required: "Accepted start.sh and current live process environment evidence for PYTHONDONTWRITEBYTECODE=1, with no secret disclosure."
  - id: AC-4
    requirement: "The creator path is identified to the narrowest defensible evidence class."
    evidence_required: "Timestamp/path/process/task correlation and explicit confidence classification with competing hypotheses addressed."
  - id: AC-5
    requirement: "No repair/lifecycle/config/transaction mutation occurs and publication is report-only."
    evidence_required: "Mutation counters/observations, post-state preservation, fresh dev/main refs, clean tree, report-only compare."

