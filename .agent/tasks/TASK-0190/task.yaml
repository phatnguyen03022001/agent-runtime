objective: "Close TASK-0190 by proving one actual physical macOS reboot plus operator sign-in restores the already committed v0.5.1 lifecycle without repair. Treat LaunchServices as discovery state, not lifecycle authority: permit only the exact known retained frozen candidate record and prove real ownership from ServiceManagement/Background Task Management and exact loaded executable paths."

scope:
  required_changes:
    - "Bind exact clean synchronized main at the revision-8 handoff base. Preserve revisions 1-7 and all consumed-effect accounting. Detect competing repository writers before report authorship."
    - "Before reboot, prove SentinelX host mac-tphat-mb is connected, operational and pingable; capture its current session identity and the current macOS boot epoch using unprivileged read-only observation."
    - "Before reboot, obtain explicit current-interaction operator confirmation that the operator is physically present at the target Mac, can perform the ordinary macOS restart/sign-in flow, and will return to this task after login. If confirmation is absent, ambiguous or withdrawn, stop BLOCKED before reboot."
    - "Fresh pre-reboot product proof must show supported ./start.sh doctor --json healthy with ten PASS checks, readyz ready, no cutover transaction, SMAppService.mainApp enabled, current Runtime SMAppService.agent absent, current user LaunchAgent loaded/running, runtime.env SHA-256 b3d0d67471f6d620f53ad1ed9ee6db21a1e906fff643dd94050b7cd8def97029, exact installed closure b2a3a79b99f6dad0b8bf14765d73df869f01610a8c6f65eab50d424534ac1a7d / 1686 regular files, zero generated .pyc/__pycache__, strict codesign PASS and provenance PASS."
    - "Use unprivileged Background Task Management readback (for example sfltool dumpbtm) to prove the main-app login item for bundle identifier com.picmao.agent-runtime resolves to the canonical installed Agent Runtime.app for the current user and the Runtime LaunchAgent executable resolves inside that same canonical installed app. The current LaunchAgent Program path must likewise resolve to /Users/tienphat/Applications/Agent Runtime.app/Contents/MacOS/AgentRuntimeRuntimeService."
    - "Classify LaunchServices records for com.picmao.agent-runtime instead of requiring sole-record absence. The canonical installed app must be present. Any additional record is acceptable only when it is exactly /Users/tienphat/Developer/agent-runtime/build/candidates/b2a3a79b99f6dad0b8bf14765d73df869f01610a8c6f65eab50d424534ac1a7d/Agent Runtime.app, remains the exact frozen candidate closure/identity, is owned by the current user with safe ordinary modes, is not the Program/Executable Path of any current lifecycle owner, and has no running process from that candidate path. Any other matching record, candidate drift, candidate execution or lifecycle reference is BLOCKING."
    - "Do not unregister, delete, rename, move or otherwise mutate the retained candidate merely to influence LaunchServices. Apple documents automatic application registration when apps become known to Finder/system/boot/login, so candidate record presence by itself is informational discovery state after the exact classification above."
    - "Consume at most one physical reboot. Use the ordinary operator-visible macOS restart followed by ordinary interactive sign-in. Do not configure auto-login or persistence, use sudo/root, substitute process/service restart, or replay reboot after an ambiguous outcome. Loss of Agent Runtime transport during reboot is expected and is not retry authority."
    - "After sign-in, fresh-bind revision 8 and reconcile the consequence before any mutation. Require a changed macOS boot epoch and a newly connected operational SentinelX session for mac-tphat-mb. If the prior reboot action is ambiguous, boot-epoch evidence decides whether it occurred; never issue a second reboot."
    - "Post-login, repeat the full product and lifecycle ownership proof without repair: doctor healthy 10/10, readyz ready, transaction absent, main_app enabled, current Runtime SM agent absent, user LaunchAgent loaded/running from the canonical installed app, Background Task Management main-app URL and LaunchAgent executable bound to the canonical installed app, runtime.env unchanged, exact 1686-file installed closure, zero generated bytecode, codesign/provenance PASS. Classify LaunchServices with the same bounded rule; the exact frozen candidate record may be present or absent and is not a failure by itself."
    - "A manual service start/restart, reinstall, install-prebuilt, cutover, rollback, recovery, cache cleanup, LaunchServices unregister/reset, candidate mutation or source change before post-login evidence invalidates reboot-survival proof and must terminate BLOCKED."
    - "Reuse revision-4 canonical ./verify PASS 62/62 modules and 848 tests because source is unchanged. Do not invoke ./verify, build, package or any source/test verification that creates a new candidate."
    - "Write report revision 8 truthfully with operator-presence confirmation, pre/post boot epochs, pre/post SentinelX sessions, physical reboot count, pre/post lifecycle ownership/path evidence, LaunchServices classification, exact no-repair effect accounting and publication closure. Validate with Foundation revision 66bf111951b6b467d8c78db7985e18ef47f59a5b. Publish only report.yaml as the direct child of the revision-8 task base using non-force main CAS, then prove clean synchronized main."
