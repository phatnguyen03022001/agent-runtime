proven_root_cause:
  component: agent_runtime/session.py
  function: _refresh_durable_session
  race: >
    The function reads a snapshot whose persisted status is starting/running,
    then verifies runner/process ownership. A fast natural exit can finalize the
    durable state after that snapshot read while both runner and target process
    identities disappear before ownership verification. The current grace/reread
    path runs only when runner_live=true and process_live=false. If both identities
    are already gone, the old nonterminal snapshot is immediately latched as
    DURABLE_OWNER_LOST even though state.json may already have transitioned to
    exited/COMPLETED.
  permanent_failure_mechanism: >
    durable_fault_reason is checked before any later snapshot reread, so once the
    transient owner-loss observation is latched, subsequent lookup by either
    start_identity or session_id cannot reconcile the now-valid terminal state.

objective: >
  Make durable owner reconciliation tolerant only to the bounded finalization
  TOCTOU window: whenever a nonterminal durable snapshot has invalid owner
  identity, boundedly reread durable state before latching DURABLE_OWNER_LOST.
  Accept a valid terminal snapshot or restored valid owner continuity, but remain
  fail-closed when the state stays nonterminal with invalid ownership after the
  existing bounded grace. Preserve all durable identity, capacity, corruption,
  control and unknown-outcome semantics. Verify once, reseal one Runtime 0.5.0
  package, and leave the healthy installed Runtime untouched.

required_implementation:
  - "Change only the nonterminal invalid-owner reconciliation in agent_runtime/session.py."
  - "For any starting/running snapshot whose owner identity is invalid, use the existing bounded _DURABLE_FINALIZATION_GRACE_SECONDS reread window regardless of whether runner, process, or both identities are already unavailable."
  - "During the bounded reread, accept only when persisted status becomes exited or owner identity becomes valid again."
  - "After the grace, if state remains starting/running and owner identity remains invalid, latch DURABLE_OWNER_LOST exactly as before."
  - "Do not clear or ignore a previously established DURABLE_STATE_CORRUPT fault."
  - "Do not turn a genuinely stale nonterminal owner-lost job into success."
  - "Do not respawn a durable effect during reconciliation."
  - "Do not change the 2.0-second finalization grace unless fresh focused proof demonstrates the constant itself is defective; no such change is authorized by default."
  - "Keep Runtime version 0.5.0, ToolContract Kernel 2 and capability/tool counts unchanged."

