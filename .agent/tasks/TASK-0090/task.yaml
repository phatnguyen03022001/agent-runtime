      required: true
    - id: CHECK-FINAL
      command_or_check: "Only on canonical PASS: commit/publish exact implementation non-force to dev, create/validate/publish TASK-0090 report-only direct child with agent-skills@87a37a72a4952b1da273d9af308642f4295fda6b, fresh-resolve dev/main/lineage/local clean state and stop at NEEDS_REVIEW."
      required: true
