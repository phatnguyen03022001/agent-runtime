      command_or_check: "Fresh-resolve exact TASK-0090 base, dev/main, local branch/clean/staged/worktree/writer state, selected agent-skills authority, accepted TASK-0086/TASK-0088/TASK-0089 lineage and required current EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-RED
      command_or_check: "Add focused TASK-0090 tests first and capture genuine RED for absent repo_fast_forward/public tool 9 before production implementation."
      required: true
    - id: CHECK-FOCUSED
      command_or_check: "Iterate only focused repo_fast_forward, MCP contract, timing and directly affected repo_observer tests until GREEN. Use local temporary Git remotes only."
      required: true
    - id: CHECK-SAFETY
      command_or_check: "Inspect exact source/contract/schema and test fixed Git argv/env/deadline/error behavior, exact annotations, replay, stale-remote/non-ff preservation, forbidden verbs/knobs and repo_observer non-regression."
      required: true
    - id: CHECK-DIFF
      command_or_check: "Run git diff --check and prove exact tracked candidate scope is restricted to authorized existing/new implementation/test/README paths."
      required: true
    - id: CHECK-CANONICAL
