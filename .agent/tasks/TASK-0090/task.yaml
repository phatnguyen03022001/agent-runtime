acceptance_criteria:
  - id: AC-1
    requirement: "Public tool 9 is exactly one closed expected-state repo_fast_forward capability."
    evidence_required: "Production MCP listing/order/annotations and closed input/output schema prove exactly cwd, branch, expected_local_head, expected_remote_head inputs with no generic Git/network knobs."
  - id: AC-2
    requirement: "A clean current branch can fast-forward only from the caller-bound expected local commit to the freshly fetched expected origin commit."
    evidence_required: "Focused local-origin integration proof shows exact precondition SHA, exact fetched origin/<branch> SHA, ancestry PASS, one ff-only update, exact post HEAD/tracking/clean state and structured fast_forwarded result."
  - id: AC-3
    requirement: "Replay is exact-input idempotent and does not follow later remote drift."
    evidence_required: "Second identical call after success returns already_at_target after fresh fetch with no branch movement; a fixture where remote later advances returns REMOTE_HEAD_MISMATCH and leaves local HEAD at the prior target."
  - id: AC-4
    requirement: "Dirty, divergent, ambiguous or misbound local state fails closed before unauthorized branch movement."
    evidence_required: "Focused tests cover dirty/staged/untracked, in-progress operations, detached/branch/upstream/cwd mismatch, third local HEAD, stale remote, non-fast-forward and local-state-changed conditions with local HEAD preserved where movement was not authorized."
  - id: AC-5
    requirement: "The implementation performs only bounded fixed Git operations and exposes no hidden generic shell/Git interface."
    evidence_required: "Source/test proof shows /usr/bin/git, shell=False, fixed origin, bounded I/O/deadline/noninteractive env, hooks disabled for ff invocation, exact fetch/observation/merge-base/ff-only/post-proof path, and absence of forbidden Git verbs/caller knobs."
  - id: AC-6
    requirement: "Existing Runtime contracts remain intact while documentation matches actual source surface."
    evidence_required: "Directly affected MCP/observer/timing tests PASS; repo_observer remains read-only/local-only; README states exactly nine tools and documents tool 8 and tool 9 without changing Runtime authority model."
  - id: AC-7
    requirement: "Exact TASK-0090 candidate passes canonical repository verification once."
    evidence_required: "Focused RED->GREEN evidence plus exactly one physical canonical PYTHON=.venv/bin/python PYTHONDONTWRITEBYTECODE=1 ./verify execution exits 0 with durable identity/timing/summary evidence."
  - id: AC-8
    requirement: "Publication is bounded and independently reviewable."
    evidence_required: "Implementation candidate changes only authorized paths, report-only direct child is validator-PASS, dev publication is non-force, fresh remote lineage closes, main remains c49d777efa09db7f6c51bd8d8616db4623499fb8 and no live Runtime lifecycle consequence occurs."

