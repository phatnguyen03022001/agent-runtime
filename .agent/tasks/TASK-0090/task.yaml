invariants:
  - "Production public surface becomes exactly nine tools in this order: terminal_exec, terminal_start, terminal_poll, terminal_control, terminal_resize, capacity_observer, fs_read_batch, repo_observer, repo_fast_forward."
  - "repo_fast_forward is a narrow synchronization consequence, not repository authority. Caller/task authority supplies exact expected branch/local/remote identities."
  - "Remote is fixed to origin; caller cannot supply a remote name, URL or refspec."
  - "No force fetch/push, no push of any kind, no commit creation, no reset, no rebase, no branch switch/checkout, no stash, no clean and no divergent merge."
  - "The only permitted branch update is an exact fast-forward from expected_local_head to expected_remote_head after fresh origin/<branch> equality proof."
  - "Replay is safe only for the same expected identities: already-at-target is a fresh-verified no-op; a later remote head does not get followed automatically."
  - "repo_fast_forward is truthfully open-world because it performs one Git fetch. It is truthfully destructive because a fast-forward may replace/delete tracked working-tree paths. It is idempotent under exact bound inputs."
  - "Generic terminal tools remain available as fallback; adding the typed tool does not forbid terminal when canonical governance permits it."
  - "repo_observer remains read-only/local-only and does not gain fetch or mutation."
  - "repo_publish is explicitly deferred to a separate successor task after TASK-0090 acceptance. No publication capability is smuggled into repo_fast_forward."
  - "Image transport proof remains accepted; TASK-0090 does not perform model-vision Stage B, screen_capture, repo_diff_read, Accessibility or UI-control work."
  - "No package, candidate freeze, install, activation, Runtime/tunnel restart, cutover, rollback/recovery, TASK-0084 lifecycle action, main promotion, tag or release is authorized."
  - "No dependency, MCP SDK version, branch topology or workspace policy change is authorized."

forbidden_changes:
  - "Do not implement repo_publish, remote commit creation, push, tag, release, GitHub API mutation or arbitrary Git command execution."
  - "Do not accept arbitrary remote/refspec/URL/argv/command/timeout/force/prune/tags/submodule controls from callers."
  - "Do not use shell=True or invoke a shell for Git."
  - "Do not use git pull, reset, rebase, checkout/switch, stash, clean, cherry-pick, commit, push or branch creation/deletion as part of repo_fast_forward."
  - "Do not auto-resolve dirty state, conflicts, divergence, detached HEAD, upstream mismatch, remote drift or local-state races."
  - "Do not broaden filesystem access beyond AGENT_RUNTIME_WORKSPACE_ROOT or expose remote URLs/credentials/config/environment in results/errors."
  - "Do not change requirements.txt, requirements.lock, mcp==2.2.0 pin or add dependencies."
  - "Do not implement screen_capture, model-vision proof, repo_diff_read, Accessibility, click, scroll or type."
  - "Do not package/freeze/install/restart/reload/cut over/rollback/recover the live Runtime or tunnel."
  - "Do not mutate main, tags, releases, sibling repositories or architect-profile."

