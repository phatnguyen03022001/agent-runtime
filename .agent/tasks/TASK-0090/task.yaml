structure_authority:
  status: RESOLVED
  source: "Existing typed-tool pattern in agent_runtime/server.py, agent_runtime/contracts.py, agent_runtime/repo_observer.py and tests/test_repo_observer*.py"
  rationale: "Add one narrow source-level typed Git consequence capability using the existing MCP registration/contracts/error patterns. Do not add a Git framework, provider registry, job system, publication subsystem, dependency, or lifecycle machinery."

objective: "Add source-level public tool 9 repo_fast_forward: one replay-safe, expected-state-guarded, fixed-origin Git fetch plus exact fast-forward of the current clean branch to one caller-bound expected remote commit. The tool exists to replace generic-shell local mirror synchronization when platform-safe typed execution is available. It MUST NOT commit, push, reset, rebase, merge divergent history, change branches, accept arbitrary Git argv/refspec/remote names, or perform any Runtime lifecycle action."

scope:
  required_changes:
    - "Fresh-bind TASK-0090 at its exact planning base. Require canonical dev/main unchanged, canonical local checkout /Users/tienphat/Developer/agent-runtime on branch dev, clean with zero staged paths and no concurrent writer before mutation. Local may be clean/behind and may require one explicitly authorized operator publication/synchronization consequence before Executor mutation if the platform blocks automated synchronization; do not bypass safety."
    - "Add agent_runtime/repo_fast_forward.py as the single implementation owner for the new consequence. Use fixed /usr/bin/git, shell=False, disconnected stdin, bounded stdout/stderr handling, a fixed call deadline, GIT_TERMINAL_PROMPT=0 and noninteractive/pager/color settings. No caller-supplied executable, argv, timeout, remote, URL, refspec, fetch option, merge option, force flag or cleanup flag."
    - "Expose exactly repo_fast_forward(cwd, branch, expected_local_head, expected_remote_head). cwd uses the existing connector-portable absolute-cwd schema and Runtime workspace enforcement. branch is bounded text but MUST be validated as a legal Git branch and MUST equal the currently checked-out non-detached branch. expected_local_head and expected_remote_head MUST be exact lowercase 40-hex commit SHAs."
    - "The only remote identity is literal origin. Require current upstream to equal origin/<branch>. Require cwd to resolve to the repository root, not merely a subdirectory. Reject bare or shallow repositories, dirty tracked/staged/untracked state, conflicts, or merge/rebase/cherry-pick/bisect operation state before network consequence."
    - "Precondition local HEAD MUST equal either expected_local_head or expected_remote_head. Equality with expected_remote_head is the replay-safe already-applied case; any third local HEAD is LOCAL_HEAD_MISMATCH and MUST NOT be synchronized."
    - "Fetch exactly the named branch from fixed origin with no tags, no prune, no submodule recursion, no broad ref discovery and no arbitrary refspec. Update only refs/remotes/origin/<branch>. Do not use git pull. The fetch is the only intended network consequence."
    - "After fetch, require refs/remotes/origin/<branch> to resolve exactly expected_remote_head. Any different canonical remote head is REMOTE_HEAD_MISMATCH/STALE_REMOTE and MUST NOT move local HEAD."
    - "Require expected_local_head to be an ancestor of expected_remote_head. Divergence or reversed history is NON_FAST_FORWARD and MUST NOT move local HEAD. This ancestry contract applies even when replay observes local HEAD already at expected_remote_head so misbound inputs do not silently pass."
    - "Freshly re-check branch, HEAD, cleanliness and operation state after fetch and immediately before local branch movement. If local state changed, fail LOCAL_STATE_CHANGED. The tool is not a distributed writer lock; one-writer governance remains external authority."
    - "When local HEAD equals expected_local_head and all guards pass, perform exactly one git merge --ff-only --no-edit to expected_remote_head with Git hooks disabled for this tool invocation and submodule recursion disabled. Do not allow merge commits. Do not invoke reset, rebase, checkout/switch, cherry-pick, update-index, clean, stash, commit or push."
    - "After the fast-forward, fresh-observe and require branch unchanged, HEAD exactly expected_remote_head, origin/<branch> exactly expected_remote_head, clean tree, zero staged/untracked/conflicted paths and no in-progress Git operation. Any ambiguous or failed local update returns a typed failure instructing the caller to re-observe before another consequence; never auto-repair or auto-retry."
    - "Replay with the same exact inputs after a successful consequence MUST fresh-fetch and verify the same expected remote head, then return status already_at_target without another branch movement. If remote advanced after the first call, replay fails REMOTE_HEAD_MISMATCH instead of advancing further."
    - "Add a fixed closed RepoFastForwardResult schema containing only bounded machine-useful proof: schema_version, status fast_forwarded|already_at_target, repository_root, branch, remote literal origin, upstream, expected_local_head, expected_remote_head, head_before, head_after, tracking_head, fetched=true, network_used=true, fast_forwarded boolean and deadline_seconds. Do not return Git stdout, credentials, remote URLs, arbitrary config, environment, file contents or large changed-path lists."
    - "Add tool-specific fixed error codes sufficient to distinguish invalid arguments/workspace/repository root, dirty/in-progress/detached/branch/upstream/local-head state, stale remote, non-fast-forward, local-state-changed, fetch/deadline/transient failure, fast-forward failure and internal failure. Error messages are bounded and MUST NOT echo credentials or remote URLs. Do not broaden repo_observer's actual behavior."
    - "Register repo_fast_forward as public tool 9 after repo_observer. Annotation MUST truthfully be readOnlyHint=false, destructiveHint=true, idempotentHint=true, openWorldHint=true. Add it to timing allowlist and server instructions."
    - "Update README Tool surface to say exactly nine public tools and document both the already-accepted repo_observer and new repo_fast_forward. Keep Runtime described as an execution provider, not Git authority or orchestration. Fix only this reproduced stale seven-tool documentation while editing the tool-surface section."
    - "Add focused implementation and MCP contract tests first. Record genuine RED before implementation for missing tool 9/contract. Use local temporary Git repositories and local/bare origin fixtures for focused tests; focused tests MUST NOT require GitHub, credentials or the live Runtime."
    - "Focused tests MUST cover: successful clean fast-forward; exact replay returns already_at_target; remote-head mismatch does not move local HEAD; non-fast-forward does not move local HEAD; dirty/staged/untracked and in-progress state reject before fetch; cwd subdirectory, detached head, branch mismatch, upstream mismatch and third local HEAD reject; input schema has no remote/refspec/argv/command/force/timeout knobs; exact nine-tool order/annotations; fixed success schema; timing allowlist/server instructions; bounded error envelope; no shell=True; no push/reset/rebase/checkout/clean/stash/commit path."
    - "After focused GREEN and stable diff, run canonical PYTHON=.venv/bin/python PYTHONDONTWRITEBYTECODE=1 ./verify exactly once for TASK-0090 and preserve durable exact command/start/finish/exit/summary evidence. Do not rerun the full canonical verifier merely because control transport changes; ambiguous exactly-once verification is a blocker/successor concern, not permission for a second physical run."
    - "Only on canonical PASS, publish the exact implementation candidate non-force to dev. Then create, validate and publish .agent/tasks/TASK-0090/report.yaml as the sole report-only direct child, fresh-resolve dev/main and exact lineage, and stop at NEEDS_REVIEW."
