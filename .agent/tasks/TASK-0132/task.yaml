  - Desktop_Commander
  - Codex

failure_policy:
  - "If any pinned ref/blob/path precondition differs, stop SOURCE_CLOSURE_FAILED."
  - "If branch or Contents mutation is platform-blocked, stop PLATFORM_BLOCK and report exact remote residue."
  - "If authoring discovers an implementation contract ambiguity that cannot be resolved without expanding scope, stop NEEDS_ARCHITECTURE_REVIEW rather than inventing a new public contract."
  - "If PR CI fails, stop VERIFICATION_FAILED and leave the single branch/PR intact; do not patch in revision 1."
  - "Never switch mutation surface solely to obtain a different platform safety judgment."

terminal_states:
  success: NEEDS_REVIEW
  source_closure_failed: SOURCE_CLOSURE_FAILED
  platform_block: PLATFORM_BLOCK
  architecture_review: NEEDS_ARCHITECTURE_REVIEW
  verification_failed: VERIFICATION_FAILED

reporting:
