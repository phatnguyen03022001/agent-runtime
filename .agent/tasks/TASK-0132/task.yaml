tests:
  canonical_baseline: 476
  required_new_files:
    - tests/test_fs_list.py
    - tests/test_fs_search.py
    - tests/test_repo_diff.py
    - tests/test_fs_patch.py
    - tests/test_wave1_mcp.py
  required_existing_updates:
    - tests/test_mcp_contracts.py
    - tests/test_mcp_client_conformance.py
    - tests/test_tool_contract.py
  proof_requirements:
    fs_list:
      - "deterministic non-recursive sorting"
      - "cwd root '.' behavior"
      - "no symlink traversal"
      - "file/directory/symlink/other classification"
      - "max_entries truncation"
      - "10000-entry scan ceiling"
      - "invalid UTF-8 name handling"
    fs_search:
      - "literal path and content modes"
      - "case-sensitive and casefold modes"
      - "deterministic recursive ordering"
      - ".git skip"
      - "symlink skip"
      - "invalid UTF-8 and NUL skip"
      - "complete raw file SHA-256 on content results"
      - "500 result / 20000 file / 64MiB / 256KiB / deadline bounded behavior"
      - "line text UTF-8 truncation without splitting code points"
    repo_diff:
      - "fixed /usr/bin/git and shell=false"
      - "cwd must be repo root"
      - "worktree and staged semantics"
      - "no network and hardened Git configuration"
      - "patch truncation at 256KiB"
      - "full-state limit 64MiB"
      - "receipt hashes complete raw diff and is unaffected by display truncation"
      - "receipt changes when raw diff changes"
    fs_patch:
      - "mandatory expected SHA"
      - "1..20 edits and aggregate edit bound"
      - "file input/output size bounds"
      - "exact once semantics on evolving text"
      - "not-found / non-unique error mapping"
      - "replay after success cannot mutate again"
      - "symlink and path traversal rejection"
      - "invalid UTF-8/NUL rejection"
      - "mode preservation"
      - "same-dir temp + fsync + atomic replace"
      - "pre-replace identity/hash drift produces STATE_CHANGED with original intact"
      - "temp cleanup on failures"
    mcp:
      - "exact 15-tool order"
      - "new annotations exact"
      - "new closed schemas"
      - "new CapabilityErrorEnvelope behavior"
      - "legacy 11 tool schemas/signatures remain accepted"
      - "screen_capture governance block remains green"
    kernel:
      - "four ToolContract constants exactly match implemented authority/annotations/bounds"
      - "agent_runtime/tool_contract.py blob remains unchanged"
  canonical_requirement:
    - "Agent Runtime Verify must run >476 tests."
    - "Zero failures."

authoring:
  normal_path: GITHUB_CONTENTS_API_ON_EPHEMERAL_BRANCH
  branch:
    name: task-0132-r1
    base: "ec011f92228392b213638e6abc05a9907f362e87"
  rules:
    - "Create exactly one remote branch from exact source_base."
    - "Author only allowed_source_paths using GitHub create_file/update_file on task-0132-r1."
    - "Before each update_file, fresh-fetch current branch blob and require the expected source-base blob for the first update of that path."
    - "New files must be absent before create_file."
    - "Do not use create_blob, create_tree, create_commit, update_ref, local filesystem authoring, Agent Runtime, Desktop Commander, or Codex."
    - "Multiple branch commits are expected; Architect will squash-merge."
    - "After authoring compare main...task-0132-r1 and require only allowed changed paths."
    - "Require agent_runtime/tool_contract.py and agent_runtime/fs_read.py blobs unchanged."

