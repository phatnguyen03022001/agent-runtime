  - "Require event=pull_request and job=canonical-verify."
  - "Wait for the exact run to complete."
  - "Do not rerun a failed run in revision 1."
  - "Require workflow/job conclusion=success."
  - "Fetch final logs."
  - "Require failures=0 and test count >476."
  - "Confirm exact 15-tool surface and all Wave 1 focused suites pass."
  - "Confirm all accepted legacy tests remain green."

architect_merge_boundary:
