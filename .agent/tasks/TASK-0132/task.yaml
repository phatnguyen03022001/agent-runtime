objective: >-
  Deliver Wave 1 as one coherent native capability set on ToolContract Kernel v1:
  fs_list, fs_search, repo_diff, and fs_patch. Preserve all accepted legacy tool behavior.
  The final public MCP surface must contain exactly 15 tools. Do not implement Wave 2,
  packaging, install, restart, cutover, or any full legacy migration.

architecture:
  normal_typed_path:
    - fs_list
    - fs_search
    - fs_read_batch
    - fs_patch
    - repo_diff
  principles:
    - "typed native capabilities are the normal path"
    - "terminal_exec remains escape hatch for build/test/lint/project CLI"
    - "tool implementation != ToolContract metadata"
    - "new tools must use ToolContract Kernel v1"
    - "success payloads remain tool-specific"
    - "new Wave 1 typed failures use generic ContractErrorCode plus stable reason_code"
    - "legacy 11 tools keep their existing public error/result contracts unless this task explicitly updates only surface-order expectations"

shared_filesystem_safety:
  path: agent_runtime/fs_safety.py
  role: >-
    Shared low-level descriptor-relative filesystem safety for Wave 1 only.
    Do not migrate fs_read_batch onto this helper in TASK-0132.
  requirements:
    - "Reuse the existing workspace-root and validated-cwd authority from executor.py; do not fork workspace semantics."
    - "Open directories/files descriptor-relative with no-follow semantics."
    - "Reject absolute descendant paths, NUL, empty components, dot, and dot-dot."
    - "Never traverse a symlink component."
    - "Provide bounded helpers sufficient for safe directory traversal, regular-file open, parent-directory open, and identity revalidation."
    - "Keep low-level helpers free of tool-specific response schema or policy."
    - "No network, shell, subprocess, glob expansion, regex expansion, or hidden filesystem mutation."

public_error_contract:
  new_model_names:
    - CapabilityErrorPayload
    - CapabilityErrorEnvelope
  required_fields:
    code: ContractErrorCode_value
    reason_code: stable_nonempty_string
    message: bounded_string
    retryable: bool
  exact_code_values:
    - INVALID_ARGUMENT
    - OUTSIDE_WORKSPACE
    - PRECONDITION_FAILED
    - STATE_CHANGED
    - CONFLICT
    - LIMIT_EXCEEDED
    - TIMEOUT
    - PERMISSION_DENIED
    - NOT_FOUND
    - UNAVAILABLE
    - INTERNAL_ERROR
  rules:
    - "Do not alter TypedToolErrorEnvelope used by existing repo/screen tools."
    - "Do not add generic success envelopes."
    - "New tool failures must return MCP CallToolResult with isError=true and structuredContent=CapabilityErrorEnvelope."
    - "Messages must be bounded and contain no file content payloads."

fs_list:
  implementation_path: agent_runtime/fs_list.py
  contract_constant: FS_LIST_CONTRACT
  tool_contract:
    tool_class: read
    authority:
      workspace_bound: true
      network: none
      mutation: none
    annotations:
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
  public_input:
    cwd: AbsoluteCwd
    path:
      type: string
      default: "."
      max_chars: 4096
      semantics: "'.' means cwd; otherwise normalized cwd-relative descendant directory"
    max_entries:
      type: integer
      default: 200
      min: 1
      max: 1000
  behavior:
    - "Non-recursive only."
    - "Path itself must resolve without symlink traversal to an existing directory."
    - "List entries using no-follow metadata; never traverse entry symlinks."
    - "Entry kinds: file, directory, symlink, other."
    - "Deterministic ascending order by returned UTF-8 name."
    - "Skip names that cannot be represented as strict UTF-8 and count them."
    - "Hard scan ceiling: 10000 directory entries. If exceeded, fail LIMIT_EXCEEDED / DIRECTORY_SCAN_LIMIT."
    - "Response retains first max_entries after complete deterministic sort."
    - "No file content reads and no hashing."
  public_result:
    schema_version: 1
    fields:
      path: string
      entries:
        item_fields:
          name: string
          path: string
          kind: "file|directory|symlink|other"
          size_bytes: "integer|null"
      truncated: bool
      scanned_entries: integer
      skipped_invalid_names: integer
  bounds:
    response_entries: 1000
    scanned_entries: 10000

fs_search:
  implementation_path: agent_runtime/fs_search.py
  contract_constant: FS_SEARCH_CONTRACT
  tool_contract:
    tool_class: read
    authority:
      workspace_bound: true
      network: none
      mutation: none
    annotations:
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
  public_input:
    cwd: AbsoluteCwd
    query:
      type: strict_string
      min_chars: 1
      max_chars: 4096
    mode:
      exact_values:
        - content
        - path
    root_path:
      type: string
      default: "."
      max_chars: 4096
    case_sensitive:
      type: bool
      default: true
    max_results:
      type: integer
      default: 100
      min: 1
      max: 500
  search_semantics:
    - "Literal substring matching only. No regex, glob, shell, fuzzy matching, or external grep."
    - "case_sensitive=false uses Unicode casefold on decoded strings."
    - "Recursive deterministic traversal by normalized relative UTF-8 path."
    - "Skip every directory component named .git."
    - "Never traverse symlink directories and never search symlink file targets."
    - "Search regular files only."
    - "mode=path matches the normalized relative file path and does not read file content."
    - "mode=content reads the complete regular file within global scan bounds, computes SHA-256 over exact raw bytes, rejects files containing NUL as binary, and skips files that are not strict UTF-8."
    - "For content mode, emit at most one result per matching line, in file/path order then line-number order."
    - "Each content result must include the complete raw-file sha256 so it can be used as fs_patch.expected_sha256."
    - "Returned line_text is UTF-8 and capped at 4096 UTF-8 bytes with line_truncated=true when shortened; truncate only at a valid UTF-8 boundary."
  hard_bounds:
    max_files_scanned: 20000
    max_content_bytes_scanned: 67108864
    max_results: 500
    max_serialized_result_bytes: 262144
    deadline_seconds: 5.0
  bounded_completion:
    - "Bounds produce truthful partial success with truncated=true rather than hidden extra scanning."
    - "limit_reason is one of max_files, max_bytes, max_results, max_output, deadline, or null."
    - "Do not emit a file_sha256 for content results until the entire matched file has been read and hashed."
  public_result:
    schema_version: 1
    fields:
      results:
        item_fields:
          path: string
          line_number: "integer|null"
          line_text: "string|null"
          line_truncated: bool
          file_sha256: "lowercase_sha256|null"
      truncated: bool
      limit_reason: "max_files|max_bytes|max_results|max_output|deadline|null"
      files_scanned: integer
      bytes_scanned: integer
      skipped_invalid_utf8: integer
      skipped_nul: integer
      skipped_symlinks: integer

repo_diff:
  implementation_path: agent_runtime/repo_diff.py
  contract_constant: REPO_DIFF_CONTRACT
  tool_contract:
    tool_class: repo
    authority:
      workspace_bound: true
      network: none
      mutation: none
    annotations:
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
  public_input:
    cwd: AbsoluteCwd
    scope:
      exact_values:
        - worktree
        - staged
      default: worktree
  repository_preconditions:
    - "cwd must be inside workspace and must be exactly the repository root."
    - "Repository must be non-bare."
    - "No network call, fetch, lock-taking intent, or mutation."
  git_execution:
    executable: "/usr/bin/git"
    shell: false
    environment:
      - "GIT_LITERAL_PATHSPECS=1"
      - "GIT_OPTIONAL_LOCKS=0"
      - "GIT_TERMINAL_PROMPT=0"
      - "pager disabled"
      - "color disabled"
      - "core.fsmonitor=false"
      - "submodule.recurse=false"
      - "external diff disabled"
      - "textconv disabled"
    rules:
      - "Use fixed local Git only."
      - "No aliases or user-configured external diff/textconv/fsmonitor/pager."
      - "worktree means tracked unstaged diff relative to index."
      - "staged means index diff relative to HEAD."
      - "Untracked files are outside repo_diff v1."
  bounds:
    complete_raw_diff_bytes: 67108864
    returned_patch_bytes: 262144
    deadline_seconds: 5.0
  receipt:
    public_field: diff_receipt
    type: ReceiptV1-shaped result
    kind: repo-diff
    subject:
      - repository_root
      - head_sha
    semantic_parameters:
      - scope
    observed_state_bytes: "complete raw Git diff bytes before any display truncation"
    rules:
      - "If full raw diff exceeds 64 MiB or cannot complete before deadline, return error; never issue a receipt over partial state."
      - "The receipt digest must remain the same regardless of returned patch truncation."
  public_result:
    schema_version: 1
    fields:
      scope: "worktree|staged"
      head_sha: lowercase_git_sha
      patch: string
      patch_truncated: bool
      full_diff_bytes: integer
      diff_receipt:
        fields:
          schema_version: 1
          kind: repo-diff
          digest: lowercase_sha256
      network_used: false

fs_patch:
  implementation_path: agent_runtime/fs_patch.py
  contract_constant: FS_PATCH_CONTRACT
  tool_contract:
    tool_class: write
    authority:
      workspace_bound: true
      network: none
      mutation: bounded
    annotations:
      read_only: false
      destructive: true
      idempotent: false
      open_world: false
  public_input:
    cwd: AbsoluteCwd
    path:
      type: cwd_relative_descendant_file
      max_chars: 4096
    expected_sha256:
      type: exact_lowercase_sha256
      required: true
    edits:
      min_items: 1
      max_items: 20
      item_fields:
        old_text:
          type: strict_utf8_string
          min_chars: 1
        new_text:
          type: strict_utf8_string
  hard_bounds:
    max_input_file_bytes: 1048576
    max_output_file_bytes: 1048576
    max_edits: 20
    aggregate_old_plus_new_utf8_bytes: 262144
  edit_semantics:
    - "Read exact raw file bytes from an existing regular file using no-follow safety."
    - "Reject NUL-containing or invalid UTF-8 file content."
    - "Hash exact raw bytes; require equality with expected_sha256 before any write."
    - "Apply edits sequentially to the evolving text."
    - "For each edit, old_text must occur exactly once in the current evolving text."
    - "0 occurrences => PRECONDITION_FAILED / OLD_TEXT_NOT_FOUND."
    - ">1 occurrence => CONFLICT / OLD_TEXT_NOT_UNIQUE."
    - "No regex, fuzzy matching, unified diff parsing, whole-file replacement input, or newline normalization."
  atomic_write:
    - "Create temp file in the same parent directory."
    - "Preserve original POSIX mode bits."
    - "Write complete UTF-8 bytes and fsync temp."
    - "Immediately before replace, re-open/revalidate the target path with no-follow semantics, require original file identity and exact original SHA-256 still match."
    - "Any drift => STATE_CHANGED / LOCAL_STATE_CHANGED and no replacement."
    - "Replace atomically with os.replace using same-directory authority."
    - "fsync parent directory after replace."
    - "Best-effort remove temp file on every failure path."
    - "Do not claim preservation of xattrs/ACLs/ownership beyond what implementation explicitly preserves."
  public_result:
    schema_version: 1
    fields:
      path: string
      sha256_before: lowercase_sha256
      sha256_after: lowercase_sha256
      bytes_before: integer
      bytes_after: integer
      edits_applied: integer

tool_contract_adoption:
  required_constants:
    - FS_LIST_CONTRACT
    - FS_SEARCH_CONTRACT
    - REPO_DIFF_CONTRACT
    - FS_PATCH_CONTRACT
  rules:
    - "Every constant must be an immutable ToolContract."
    - "Server MCP annotations for all four new tools must source from the corresponding contract annotations."
    - "Bounds/preconditions/postconditions must describe only implemented behavior."
    - "Do not migrate legacy tools beyond existing fs_read_batch adoption."
    - "Do not modify agent_runtime/tool_contract.py in TASK-0132."

