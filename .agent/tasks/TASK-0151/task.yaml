    - "Phase B must validate package Runtime version 0.4.0, Kernel 2, known=21, advertised=20, package manifest runtime_revision equal to the exact Phase-A candidate, package manifest git_tree equal to that candidate tree, strict codesign PASS, provenance manifest PASS, candidate closure PASS, and pinned candidate/handoff SHA-256 PASS. Record exact candidate SHA-256, handoff SHA-256 and record_count."
