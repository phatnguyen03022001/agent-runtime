    - "Run focused integration tests for version identity, final schema/inventory freeze, runtime_revision package-process binding, package self-contained doctor payload, direct package-owned runtime_config import, predecessor compatibility, package provenance closure and candidate cutover regressions."
    - "Commit one coherent Phase-A source candidate only after focused PASS. Run canonical ./verify on that exact clean candidate. Any source/test/doc/package-script write afterward invalidates Phase-A verification and requires a new candidate plus canonical re-verification."
