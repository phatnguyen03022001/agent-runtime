    - "Use one reserved internal environment key for that installed process identity, e.g. AGENT_RUNTIME_REVISION. It is package-owned, not accepted from runtime.env, not caller authority, must validate exact lowercase 40-hex, and must be absent/null in ordinary source execution unless explicitly injected by a trusted package/bootstrap test."
    - "Close Cutover B predecessor compatibility before any installed mutation. The current installed activation revision 89111218720ddb2f12961f9375549733edd23ada must be recognized as the exact split-v1 ServiceManagement predecessor by checkout-side candidate_cutover. Add focused regression proving no other unknown predecessor becomes accepted."
