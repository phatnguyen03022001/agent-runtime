current_contract:
  runtime_public_tools: [terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, fs_read_batch]
  current_v1_evidence_ceiling: 2
  current_live_parallelism: 2
  observer_role: ADVISORY_ONLY

benchmark_design:
  tiers: [1, 2, 4, 8, 10]
  workload_classes:
    - id: LIGHTWEIGHT_CONTROL_PATH
      exact_definition: "Per job: 500 git rev-parse tree checks, 50 git ls-tree traversals, final HEAD identity read."
    - id: REPRESENTATIVE_MIXED_ENGINEERING
      exact_definition: "Per job: installed Runtime CPython runs the same 16 deterministic capacity_observer/fs_read_batch unit tests used in r1 with bytecode writes disabled."
    - id: BOUNDED_CPU_IO_HEAVY
      exact_definition: "Per job: task-owned 64 MiB write+fsync+read+SHA-256 plus 3,000,000-iteration PBKDF2 CPU work in a temporary directory."
  confirmation_method:
    - "Run one fresh controlled confirmation pass at x1/x2/x4 for every workload class using the exact r1 definitions. r1 already supplies functional repetition; do not add gratuitous repeated stress unless measurement noise makes one bounded repeat necessary."
    - "Run x8 for all three workload classes so pressure telemetry is comparable and the missing heavy tier is completed."
    - "Run x10 for all three workload classes only if every prior hard-stop predicate remains clear. x10 is a stress evidence boundary, not a target."
    - "At each tier launch exactly N independent Runtime sessions concurrently behind the same shared-barrier method used in r1."
    - "Capture bounded pre/during/post capacity_observer plus host observations for every measured workload/tier."
    - "Record aggregate wall-clock, per-job latency, throughput versus fresh x1 baseline, correctness, start spread, and caller/orchestration overhead when material."

required_pressure_evidence:
  - cpu_busy_and_load
  - memory_headroom
  - vm_compressor_bytes
  - swap_used_bytes
  - swapin_delta_pages
  - swapout_delta_pages
  - thermal_state
  - disk_headroom
  - listener_count_127_0_0_1_8080
  - healthz
  - readyz

hard_stop_conditions:
  - "Agent Runtime connector/public-tool route disappears or exact six-tool discovery is lost."
  - "Runtime healthz or readyz becomes non-green."
  - "Listener ownership becomes ambiguous, duplicated, or lost."
  - "Any lost, duplicated, cross-attributed, corrupted, or otherwise misidentified job/session result."
  - "Thermal reaches serious or critical."
  - "Meaningful swapout or memory/resource pressure indicates host instability."
  - "Repeated timeout/error behavior is incompatible with normal engineering use."
  - "Continuing would require Runtime lifecycle/config/source mutation."

invariants:
  - "Benchmark first; policy later. Executor must not derive, decide, or implement Parallelism v2 policy."
  - "Do not assume the x2 ceiling should be removed or increased."
  - "Runtime remains advisory-only; no scheduler, queue, worker manager, retry engine, or orchestration policy."
  - "Preserve responsive UX/session semantics."
  - "No source/tests/docs/dependency/runtime.env/lifecycle/LaunchAgent mutation."
  - "Preserve unrelated .env.example drift and chatgpt-sample.txt / vscode-gpu-sample.txt; do not content-read, stage, commit, stash, clean, reset, move, delete, overwrite, or adopt them."

acceptance_criteria:
