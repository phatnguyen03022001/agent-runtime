    requirement: "Exact r2 base, connector six-tool discovery, installed generation health, and operator state are proven before measurement."
  - id: AC-2
    requirement: "Fresh x1/x2/x4 telemetry-confirmation evidence exists for all workload classes, with comparable pre/during/post pressure metrics."
  - id: AC-3
    requirement: "x8 is completed for all three workload classes unless a legitimate hard stop occurs before completion."
  - id: AC-4
    requirement: "x10 is completed for all three workload classes unless a legitimate earlier hard stop prevents it."
  - id: AC-5
    requirement: "Evidence records correctness, throughput/wall-clock, latency, pressure metrics, listener, health/readiness, and Runtime tool/session integrity without policy inference."
  - id: AC-6
    requirement: "No Runtime source/config/lifecycle/policy mutation occurs and operator-owned state remains untouched."
  - id: AC-7
    requirement: "Report revision 2 separates observed facts from advisory recommendation and publishes as exactly one report-only non-force dev commit with main unchanged."

