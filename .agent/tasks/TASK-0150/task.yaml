acceptance_criteria:
  - id: AC-1
    requirement: "capacity_observer v2 truthfully combines host-advisory capacity with current Runtime operational state without becoming an admission reservation."
    evidence_required: "Schema/result tests prove preserved v1 fields plus active_heavy, available_heavy, active_sessions, recommended_additional_parallelism, observed_at and reservation_guaranteed=false; concurrent acquire/release/session tests prove counts/formula invariants and no reservation side effect."
  - id: AC-2
    requirement: "runtime_capabilities v2 default summary is compact, deterministic and sufficient for ordinary discovery."
    evidence_required: "Default call returns summary schema with exact identity/count/execution fields, no capabilities array, <=1024 canonical UTF-8 JSON bytes, no forbidden probes, and request/result schema 2/2."
  - id: AC-3
    requirement: "Full/filtered capability discovery remains exact while preserving global inventory truth."
    evidence_required: "detail=full returns exact CapabilityDescriptor v2 records; names filter returns only requested known descriptors in registry order; invalid/duplicate/empty/summary+names requests fail before body; global counts remain 21 known / 20 advertised / 20 available / 1 unavailable."
  - id: AC-4
    requirement: "screen_capture remains known but is stably absent from the advertised MCP surface."
    evidence_required: "Full discovery contains screen_capture with supported=true, available=false, advertised=false, VISUAL_PERCEPTION_BLOCKED; repeated tools/list calls contain exactly 20 stable tools and never screen_capture; MCP screen_capture invocation cannot reach capture implementation/native helper; no dynamic list changes."
  - id: AC-5
    requirement: "Exact source candidate is canonically verified and published with no live cutover."
    evidence_required: "Focused PASS, git diff --check, canonical ./verify exit_code=0 on exact candidate, source Runtime 0.3.0/Kernel 2/21 known capabilities/20 advertised tools, non-force publication reconciliation, installed Runtime unchanged, report-only child and NEEDS_REVIEW."

