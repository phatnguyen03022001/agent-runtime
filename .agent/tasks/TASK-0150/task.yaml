structure_authority:
  status: RESOLVED
  source: "Existing capacity/session/capability-registry composition boundaries"
  rationale: "All owned gaps are surface convergence. Reuse HeavyExecutionAdmission, TerminalSessionManager and the existing registry. A small lock-safe active-session observation helper is allowed; no scheduler, reservation service, dynamic tool registry, daemon or capability database is justified."

objective: "Close GAP-09, GAP-10 and GAP-11 by making capacity observation operationally truthful, making capability discovery context-efficient and filterable, and converging the stable advertised MCP surface so unavailable screen_capture remains discoverable as a known descriptor but no longer consumes tools/list or normal tool-choice context."

scope:
  required_changes:
    - "Evolve capacity_observer result schema from 1 to 2; request schema remains 1. Preserve the accepted v1 host-signal fields capacity_parallelism_ceiling, reason_codes and signals, and add point-in-time operational fields active_heavy, available_heavy, active_sessions, recommended_additional_parallelism, observed_at and reservation_guaranteed=false."
    - "active_heavy is the exact lock-protected HeavyExecutionAdmission active count observed for the Runtime process. available_heavy is max(0, hard_execution_limit - active_heavy) using the same effective admission ceiling that actually gates heavy process roots."
    - "Expose a minimal lock-protected active terminal-session count from the existing TerminalSessionManager for sessions whose status is starting or running. Do not create a second session registry. Avoid a capacity.py -> session.py circular import; compose the observations at server/session boundary or an equivalently small callback/helper boundary."
    - "recommended_additional_parallelism is explicitly additional, never total. Compute it conservatively from the current v1 capacity_parallelism_ceiling and actual heavy admission state: max(0, min(available_heavy, capacity_parallelism_ceiling - active_heavy)). It is advisory only and may become stale immediately under concurrency."
    - "observed_at is a bounded UTC RFC3339 timestamp captured for this point-in-time observation. reservation_guaranteed is literal false. No returned capacity field creates or reserves admission capacity."
    - "Add deterministic concurrent acquire/release tests proving active_heavy/available_heavy/recommended_additional_parallelism remain non-negative, recommendation never exceeds available_heavy, counts return to baseline after release, active_sessions tracks only starting/running manager state, and the observer never promises a reservation."
    - "Evolve runtime_capabilities request/result from 1/1 to 2/2. Request supports detail='summary'|'full' with summary as the default and an optional bounded exact names filter for full descriptor retrieval. Unknown names, duplicate names, an empty names list, or names supplied with detail='summary' fail closed as INVALID_ARGUMENT; omission of names with detail='full' returns all known capability descriptors in registry order."
    - "runtime_capabilities detail='summary' returns no full descriptor array. It returns schema_version=2, detail='summary', runtime_version, runtime_revision, tool_contract_kernel_version, advertised_tool_count, capability_count, available_count, unavailable_count, and execution={heavy_ceiling, active_session_ceiling, terminal_poll_max_wait_ms, running_hard_wall_ms}."
    - "runtime_revision must be truthful and must not be synthesized from a mutable branch/ref or network call. In a source/development process where no immutable activated/package revision is available through existing process/package identity, null is allowed. TASK-0151 final activation must bind the installed summary to its exact activation revision without changing this public v2 shape."
    - "Summary execution limits are process/config identity only: heavy_ceiling is the effective hard_execution_limit, active_session_ceiling is the configured TerminalSessionManager limit, terminal_poll_max_wait_ms is the accepted MAX_WAIT_MS bound, and running_hard_wall_ms is the accepted terminal running hard wall. runtime_capabilities must not call capacity_observer, inspect repositories, access network, invoke screen capture, or perform readiness/permission probes."
    - "Canonical compact JSON serialization of the unfiltered summary must remain <=1024 UTF-8 bytes. The accepted research target of roughly 500-700 bytes is advisory, not an exact contract."
    - "runtime_capabilities detail='full' returns the same top-level identity/count/execution summary plus a capabilities array of exact capability descriptors. names filters only that descriptor array, preserves registry order regardless of caller order, and does not change the global top-level inventory counts."
    - "Evolve CapabilityDescriptor schema from 1 to 2 by adding advertised:boolean. Known capability count remains exactly 21 after TASK-0150. Every normal supported available capability is advertised=true. screen_capture remains supported=true, available=false, unavailable_reason_code='VISUAL_PERCEPTION_BLOCKED', retains its descriptor and existing source implementation, and becomes advertised=false."
    - "The stable MCP tools/list advertised surface after TASK-0150 is exactly 20 tools: current twenty-one known capabilities minus screen_capture. screen_capture must not be registered with the MCP tool manager and direct MCP calls by name must not reach native capture. Do not delete its implementation, descriptor, packaging helper, governance reason or full-discovery visibility."
    - "Advertisement is versioned/static for this source line. Do not hide or re-advertise tools dynamically based on transient permission, host readiness or runtime state; do not emit list-changed flapping behavior. Re-advertisement of screen_capture requires a future separately authorized source/activation change."
    - "PUBLIC_TOOL_NAMES, MCP registration, effect-boundary inventory, timing/tool metadata, schema export, client conformance, doctor and docs must distinguish known capabilities from advertised tools. Doctor must prove capability_count=21, advertised_tool_count=20 and the hidden screen_capture descriptor exactness without expecting screen_capture in tools/list."
    - "Update server instructions/readme/docs so normal public inventory names exactly the twenty advertised tools while full runtime_capabilities documentation explains hidden known capability discovery. Remove wording that says screen_capture is exposed as an MCP tool."
    - "Preserve source Runtime version 0.3.0 and ToolContract Kernel 2. Do not package/install/restart/reload/cutover Runtime in TASK-0150. The installed Runtime remains the accepted nineteen-tool Runtime 0.3.0 line until TASK-0151 / Cutover B."
    - "Preserve TASK-0148 follow-up INSTALLED_DOCTOR_SELF_CONTAINMENT unchanged for TASK-0151. Do not fix installed packaging/self-containment in TASK-0150."
    - "After focused PASS, commit one coherent implementation candidate, run canonical ./verify on that exact clean candidate, fresh-reconcile remote main, publish exact verified candidate non-force, publish report-r1.yaml as sole report-only child, and stop NEEDS_REVIEW."

