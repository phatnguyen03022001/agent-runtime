      tunnel command, package identity, codesign, and immutable closure evidence pass.
  - id: AC-9
    requirement: "Final repository/host cleanup is bounded and complete."
    evidence_required: >-
      build/ absent, repo clean, main-only, no open PR, workflow_dispatch-only verifier,
      no cutover debris, no duplicate owner app in bounded scan, no signed-bundle pyc drift.
  - id: AC-10
    requirement: "Final Executor report is persisted through the now-working native mutation chain."
    evidence_required: >-
      report-r6 staged by native repo_stage, staged ReceiptV1, committed by native repo_commit,
