executor_flow:
  - "Fresh-resolve exact canonical main execution base and require clean local main."
  - "Fresh-require current 19-tool Agent Runtime surface."
  - "Preserve all published production implementation bytes from revision 5."
  - "Implement only revision-6 deterministic test hardening in tests/test_terminal_session.py and tests/test_screen_capture.py."
  - "Run targeted stress for both known timing-sensitive tests, then run their complete test modules once."
  - "Use native repo_diff to prove exact test-only corrective scope."
  - "Stage the test-only correction through native repo_stage and obtain repo_diff(staged) ReceiptV1."
  - "Attempt native repo_commit once; if and only if it returns GIT_IDENTITY_UNAVAILABLE, use the revision-6 one-forward-local-commit exception bound to the exact revision-6 execution base."
  - "Publish the revision-6 correction through native repo_publish exact CAS and fresh-prove remote main."
  - "Require clean published implementation checkout."
  - "Run exactly one canonical ./install.sh with validated repo .venv packaging Python, existing signing Authority, and the already-migrated canonical runtime.env; capture its internal ./verify totals."
  - "Validate PENDING / APP_SWAPPED candidate and live Runtime gates."
  - "Prove native repo_commit on a disposable fixture and installed doctor healthy through live Runtime environment."
  - "Commit cutover canonically."
  - "Fresh-prove transaction absent and final installed identity/health/codesign/closure."
  - "Capture candidate/provenance hashes, then delete repository build/ transient artifacts."
  - "Run final bounded repository/host audit."
  - "Create report-r6 with complete freeze evidence."
  - "Stage report through native repo_stage, obtain ReceiptV1, commit through native repo_commit, publish through native repo_publish."
  - "Fresh-prove local HEAD = origin/main, ahead/behind 0/0, worktree/index clean, then stop for independent Architect review."

forbidden_changes:
  - "Add or remove MCP tools."
  - "Change Runtime semantic version from 0.2.0."
  - "Change ToolContract Kernel v1."
  - "Change doctor report contract/check inventory."
  - "Add worktrees, fan-out, workers, scheduler, orchestration, SQLite, plugin scanning, policy DSL, or model loop."
  - "Add Git-config fallback inside repo_commit."
  - "Print/persist Git identity values in report/log evidence."
  - "Read/export private signing keys or enumerate Keychain."
  - "Prompt or widen TCC permissions."
  - "Invoke native screen capture."
  - "Touch Photos, SSH secrets, browser cookies/history, or unrelated user data."
  - "Create branch/PR/staging/dev/control topology."
  - "Enable automatic push/pull_request GitHub Actions."
  - "Rewrite accepted history."

failure_policy:
  - "Fail closed on identity drift or unexpected diff."
  - "Do not chase green with repeated full verifier runs."
  - "Do not commit cutover when any pending-cutover gate fails."
  - "Do not use shell Git push."
  - "Do not switch execution surface solely to obtain a different platform safety judgment."
  - "If signing requires interactive approval unavailable in the current GUI session, stop with exact signing evidence."
  - "If live Runtime reconnect is required after cutover and the current context cannot reacquire the same 19-tool surface, preserve transaction state and return a continuation packet rather than bypassing native proof."

