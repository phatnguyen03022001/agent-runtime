    - "live Runtime/tunnel point to the canonical installed app"
    - "health/ready remain good"
    - "strict codesign remains good"
    - "no generated pyc/__pycache__ drift inside signed installed bundle"
  freeze_evidence: >-
    TASK-0138 report plus final Architect review are the freeze evidence. Do not introduce a
    second freeze framework or new governance repository.

acceptance_criteria:
  - id: AC-1
    requirement: "Runtime Git identity propagation is canonical and migration-safe."
    evidence_required: >-
      Focused tests prove precedence, atomic migration, preservation, pair validation, 0600 mode,
      no value disclosure, and start.sh forwarding.
  - id: AC-2
    requirement: "Native repo_commit works after final install with no persistence exception."
    evidence_required: >-
      Live installed Runtime commits a bounded disposable Git fixture through native repo_commit;
      exact commit/receipt evidence is recorded without exposing Git identity values.
  - id: AC-3
    requirement: "Final implementation preserves accepted public architecture."
    evidence_required: >-
      Runtime version 0.2.0, exact nineteen-tool order, ToolContract Kernel v1, schema export,
      repo_publish CAS, and screen_capture governance regressions remain green.
  - id: AC-4
    requirement: "Canonical install verification is green."
    evidence_required: "The ./install.sh internal ./verify invocation records exact zero-failure totals and exit 0."
  - id: AC-5
