      runtime manifest, candidate validation, and strict codesign all pass.
  - id: AC-6
    requirement: "Schema-5 install/cutover completes safely from the current installed predecessor."
    evidence_required: >-
      Exact predecessor split-v1 proof, PENDING/APP_SWAPPED validation, live health gates, then
