  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "A newcomer blocked on Background Activity approval can reach the correct macOS authorization control directly from Agent Runtime."
    evidence_required: "Deterministic native UI/controller tests prove the approval-required state explains the need, exposes a direct action, and that action resolves to the supported SMAppService.openSystemSettingsLoginItems() handoff without requiring manual System Settings navigation."

  - id: AC-2
    requirement: "The settings handoff does not weaken macOS authorization or Agent Runtime lifecycle boundaries."
    evidence_required: "Tests prove opening settings performs no resume/commit/rollback/recover/config mutation and does not produce success; approval remains human-owned and a still-unapproved continuation remains non-success/actionable."

  - id: AC-3
    requirement: "After approval, setup continues only through the existing accepted lifecycle."
    evidence_required: "Deterministic orchestration tests prove continuation dispatches the existing resume path, then preserves TASK-0174 doctor/readiness gates; no new ServiceManagement/activation state machine or direct cutover path is introduced."

  - id: AC-4
    requirement: "Existing onboarding, ServiceManagement, security, and configured-install behavior remains compatible."
    evidence_required: "Full AgentRuntimeMenuBar Swift regressions PASS, including ServiceManagement and FirstRun coverage; source inspection/diff proves no secret/config/provenance/tunnel/doctor/runtime contract drift and no new source file/dependency."

  - id: AC-5
    requirement: "Newcomer documentation matches the native authorization flow."
    evidence_required: "README/INSTALL state that the app explains Background Activity approval and opens the relevant System Settings control; manual pane discovery is not a required fresh-user step."

  - id: AC-6
    requirement: "One immutable source candidate is qualified without live consequence."
    evidence_required: "git diff --check PASS, required Swift tests PASS, canonical ./verify PASS exactly once on the immutable final candidate, task/report validation PASS, and report records zero live System Settings, ServiceManagement, Runtime/config/tunnel, Apple credential/notary, dependency, tag, or release effects."
