structure_authority:
  status: RESOLVED
  source: "Existing AgentRuntimeMenuBar first-run controller and ServiceManagement ownership."
  rationale: "The smallest sufficient correction is a native action inside the existing approval-required onboarding state. No new subsystem, helper, permission manager, installer, service, or configuration owner is required."

objective: "Close the newcomer Background Activity authorization gap without changing Runtime lifecycle semantics: when the accepted first-run flow reaches the existing macOS approval-required state, explain why Background Activity is required and provide a direct native action that opens the macOS Login Items/Background Activity settings through the supported ServiceManagement API; after the user acts, continue only through the already-accepted resume/doctor/readiness/cutover path and never treat opening System Settings as approval or success."
scope:
  required_changes:
    - "When first-run onboarding reaches FirstRunSetupOutcome.approvalRequired, present a clear newcomer-facing explanation that Agent Runtime needs macOS Background Activity authorization for its existing Runtime service and that macOS requires the user to approve it."
    - "Provide an explicit native action from that approval-required UI which opens the correct Login Items/Background Activity System Settings pane using SMAppService.openSystemSettingsLoginItems() or the exact supported ServiceManagement equivalent. Do not require the user to manually discover or type a System Settings path."
    - "Opening System Settings is navigation only. It must not be interpreted as authorization, must not mark setup complete, must not mutate canonical Runtime configuration, and must not directly commit/resume/rollback/recover the cutover."
    - "Preserve an explicit bounded continuation after the operator has changed the macOS setting. That continuation must reuse the existing --resume-cutover/evaluate-and-finalize lifecycle and current package-owned doctor/readiness gates; do not create a second ServiceManagement or activation state machine."
    - "If the user returns without granting approval, the flow must remain in a truthful approval-required/non-success state and allow the supported settings handoff again. It must not commit, relabel the state healthy, or fall into destructive recovery merely because approval is still pending."
    - "If approval has been granted, continuation may proceed only through existing lifecycle behavior and terminal success remains gated by transaction absence, readiness ready, and package-owned doctor healthy exactly as accepted in TASK-0174."
    - "Keep existing ServiceManagement registration semantics authoritative. This task may expose platform navigation from the UI but must not change which services are registered, registration order, error classification, approval status semantics, or unregister/rollback compensation behavior."
    - "Keep valid-existing-config bypass, secure secret handling, workspace selection, canonical runtime.env ownership/mode, provenance, candidate cutover, doctor composition, readiness probing, tunnel-client prerequisite, and existing recovery behavior unchanged."
    - "Update newcomer documentation so Background Activity approval is app-guided: the app explains the requirement and opens the relevant System Settings pane; documentation may describe what to enable, but manual discovery of that pane is no longer the primary flow."
    - "Qualify entirely with deterministic source tests. Tests must not open real System Settings, change actual Login Items/Background Activity state, install/activate Runtime, or require Apple credentials."
  allowed_existing_files_or_components:
    - "macos/Sources/AgentRuntimeMenuBar/FirstRunSetupController.swift"
    - "macos/Sources/AgentRuntimeMenuBar/ServiceManagementController.swift only if a narrow existing-owner hook is materially useful; do not move onboarding lifecycle into it"
    - "macos/Sources/AgentRuntimeMenuBar/AppDelegate.swift only if needed for existing-window wiring; no new app lifecycle subsystem"
    - "macos/Tests/AgentRuntimeMenuBarTests/PresentationTests.swift"
    - "macos/Tests/AgentRuntimeMenuBarTests/ServiceManagementTests.swift"
    - "README.md"
    - "docs/INSTALL.md"
    - "docs/RECOVERY.md only if newcomer recovery wording materially requires correction"
    - ".agent/tasks/TASK-0175/**"

