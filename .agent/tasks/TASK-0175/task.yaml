invariants:
  - "macOS remains the sole authority that grants or denies Background Activity approval; Agent Runtime only guides the user to the platform control."
  - "ServiceManagement registration/status semantics remain owned by the existing implementation; opening System Settings adds no second permission state model."
  - "The existing first-run resume/rollback/recovery/commit lifecycle remains authoritative and no parallel Swift activation lifecycle is introduced."
  - "Default doctor composition and the accepted TASK-0174 pre-commit/post-commit gates remain unchanged."
  - "Canonical Runtime configuration remains ~/Library/Application Support/Agent Runtime/runtime.env, mode 0600, with no secret handling changes."
  - "A valid existing configured install continues to bypass fresh onboarding when no activation continuation is required."
  - "Runtime version, ToolContract Kernel, MCP public surface, telemetry semantics, tunnel identity contract, provenance, and same-UID threat model do not change."
  - "TASK-0173 remains independent and may stay BLOCKED; no Apple distribution credential discovery/provisioning occurs."
  - "MAIN_ONLY topology remains unchanged."

forbidden_changes:
  - "AppleScript, shell commands, private preference URLs, guessed x-apple.systempreferences deep links, Accessibility automation, UI scripting, or other workarounds to toggle or navigate authorization."
  - "Automatically granting, toggling, bypassing, or simulating Background Activity approval."
  - "Treating SMAppService.openSystemSettingsLoginItems() as proof that approval was granted."
  - "Changing ServiceRegistrationCoordinator registration/unregistration semantics merely to support the UI handoff."
  - "Changing candidate_cutover.py, install_release.sh, runtime_config.py, doctor.py, readiness semantics, provenance, tunnel identity, or package architecture."
  - "Adding a permission manager, settings router framework, helper process, daemon, privileged helper, installer framework, observer subsystem, polling service, second state store, or new dependency."
  - "Any live System Settings opening or ServiceManagement mutation during qualification."
  - "Any live Runtime/tunnel/config mutation, Apple credential/notary action, notarization, tag, release, or host dependency installation."
  - "Any branch, PR, force push, amend, squash, tag, or unrelated cleanup."
