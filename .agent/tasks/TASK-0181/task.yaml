structure_authority:
  status: RESOLVED
  source: "Existing package/provenance/cutover/lifecycle/onboarding surfaces"
  rationale: "Implement the accepted architecture by versioning and simplifying current surfaces. Do not add an updater daemon, second installer, second transaction state machine, privileged helper, or parallel lifecycle."

objective: "Productize the accepted zero-cost architecture. Agent Runtime.app becomes the immutable ad-hoc substrate containing native UI, Runtime supervisor, immutable lifecycle/bootstrap/control-plane code, self-contained CPython 3.13, locked third-party/native dependencies, and no mutable first-party agent_runtime package. Runtime logic is installed under user Application Support as an immutable content-addressed pure-Python release selected by one exact pointer. The current background lifecycle becomes one traditional per-user LaunchAgent pointing to the embedded supervisor, which owns the complete Runtime child process group. Initial install, predecessor migration, ordinary payload activation, rollback/recovery, onboarding, readiness, doctor and uninstall must remain fail-closed and reuse the existing transaction/provenance machinery. Qualify the immutable final source once, then build one zero-cost app+payload artifact for a later fresh-install acceptance task."

scope:
  required_changes:
    - "Freshly prove clean canonical main at the exact TASK-0181 base, accepted TASK-0180 review/report ancestry, accepted TASK-0175 onboarding ancestry, MAIN_ONLY topology, and zero live consequence before mutation."
    - "Introduce one versioned current lifecycle contract for the accepted traditional per-user LaunchAgent architecture. The current product path must no longer register the main app or Runtime through SMAppService. Keep only the minimum legacy SMAppService command surface needed to unregister/restore accepted split-v1 predecessors during migration/rollback."
    - "Use exactly one current Runtime label. Materialize exactly one owned plist at ~/Library/LaunchAgents for the current generation. Its ProgramArguments must point to the absolute installed AgentRuntimeRuntimeService path under ~/Applications/Agent Runtime.app. Do not use BundleProgram or AssociatedBundleIdentifiers."
    - "The current user LaunchAgent plist must be a regular non-symlink same-user-owned file with a deterministic restrictive mode and exact expected Label/ProgramArguments/KeepAlive semantics. Candidate lifecycle validation must reject foreign same-label ownership, symlink substitution, path drift, unexpected plist keys that change execution identity, or ambiguous loaded service state."
    - "Refactor AgentRuntimeRuntimeService so it owns the complete Runtime generation. Spawn the immutable Runtime entry process in a dedicated process group, retain exact PID/PGID, forward SIGTERM/SIGINT only to that owned group, wait boundedly, escalate only the exact owned PGID if needed, reap the exact child, and never exit normally while an owned generation remains. Preserve desired-state semantics and KeepAlive recovery behavior."
    - "The helper's owned group must include the tunnel-client and bundled Runtime Python process tree. No broad name/path kill is accepted as normal lifecycle ownership."
    - "Create one canonical payload store beneath ~/Library/Application Support/Agent Runtime, with immutable release directories named by exact lowercase 64-hex closure and one regular non-symlink pointer file containing only the selected closure identity."
    - "Use the TASK-0180 payload boundary exactly: an ordinary release contains only first-party agent_runtime/*.py plus bounded manifest metadata. Reject symlinks, executable bits, Mach-O/native extensions, .so/.dylib/.bundle, interpreter copies, third-party packages, shell scripts, extra files, unsafe paths, wrong modes, malformed manifests, wrong closure names, substrate-contract mismatch, and post-publication mutation."
    - "The payload manifest/closure must bind at minimum: schema, owner, content closure, source revision/tree, requirements.lock SHA-256, required Python major/minor, lifecycle/payload contract versions, expected public tool count/surface identity, and complete relative-path/mode/SHA-256 inventory."
    - "Reuse package_provenance.py for substrate/candidate/payload closure and validation rather than adding a second provenance module. Version schemas so legacy candidates with real TeamIdentifier remain readable/validatable under historical rules while new zero-cost candidates truthfully encode ad-hoc mode, TeamIdentifier absence, exact responsible executable identifiers/designated requirements, substrate closure and initial payload closure."
    - "Zero-cost candidate validation must require strict code-signature verification of the ad-hoc substrate, exact expected signing identifiers/designated requirements for responsible executables and native code, TeamIdentifier absent, exact candidate closure, external handoff hash, substrate manifest identity and payload identity. Ad-hoc sealing must never be described as Apple publisher authentication."
    - "Replace the active supported prebuilt packaging lane with explicit zero-cost ad-hoc packaging. Remove AGENT_RUNTIME_CODESIGN_IDENTITY, Developer ID, notarytool and stapling requirements from the supported current prebuilt path. Historical TASK-0172/TASK-0173 evidence remains untouched."
    - "package_app.sh must build the immutable substrate without copying agent_runtime/*.py into the app. It must still embed immutable start.sh/control-plane package scripts, self-contained CPython 3.13 and the locked third-party/native environment required by the Runtime."
    - "The packaging flow must emit one initial external payload release from the exact same source candidate, content-address it, validate it, and include it in the complete distribution artifact outside Agent Runtime.app. The consumer artifact must contain at minimum Agent Runtime.app, Agent Runtime.candidate.json and the initial payload with its exact manifest/closure authority."
    - "Do not put mutable first-party Runtime source back inside the app as a fallback. Runtime startup must fail closed if the selected external payload is missing, malformed, mutated, wrong-contract, or imports from a location other than the selected release."
    - "Adapt immutable start.sh/bootstrap logic to validate the canonical payload pointer/release before Runtime startup, set PYTHONDONTWRITEBYTECODE=1, expose only the selected release as first-party PYTHONPATH, verify the expected public tool surface/contract, and then start tunnel-client with the bundled Python invoking external agent_runtime.server."
    - "Preserve canonical runtime.env syntax, mode 0600, API key/tunnel/workspace/Git identity, session/parallel limits, telemetry mode, tunnel-client discovery and health/readiness endpoints from the accepted onboarding authority."
    - "Adapt doctor/status/readiness to validate both immutable substrate ownership and the selected external payload closure/contract. Doctor must report actionable fail-closed reason codes for missing/invalid pointer, missing/mutated release, lifecycle ownership mismatch, and substrate/payload incompatibility without exposing secrets."
    - "Extend the existing candidate_cutover/install_release transaction machinery instead of adding a new updater state machine. Initial zero-cost install must transactionally install/swap the substrate app, publish the initial payload release, set the pointer, materialize/bootstrap the user LaunchAgent, start the desired Runtime generation, and support explicit commit/rollback/recovery."
    - "Migration from accepted split-v1 predecessors must use the predecessor app's bounded ServiceManagement unregister commands before app swap where required, wait for predecessor Runtime absence, preserve rollback information, then install the new user LaunchAgent current lifecycle. Historical legacy direct-LaunchAgent predecessor handling must remain version-aware."
    - "Rollback/recovery must validate each snapshot under its own lifecycle/provenance contract. If the new generation fails after app swap, restore the previous app plus previous lifecycle ownership and previous selected payload pointer exactly enough to return to the proven predecessor state."
    - "Implement ordinary local payload activation through the same existing transaction authority, not a parallel updater. The payload-update operation must validate/publish the immutable new release, stop and fully reap the current owned generation, atomically switch the pointer exactly once, start/validate the new generation, and either commit or restore the old pointer/generation on failure."
    - "A payload activation must never modify Agent Runtime.app, bundled Python, native extensions, third-party dependencies, LaunchAgent plist, helper binary, runtime.env or tunnel-client. If the incoming release requires a different substrate/requirements/Python/lifecycle contract, fail closed and require a substrate release instead."
    - "Preserve the native newcomer flow from TASK-0174/TASK-0175: API key, tunnel ID, Git identity and workspace collection; valid config bypass; transaction recovery UI. Remove obsolete Background Activity/SMAppService approval instructions from the current zero-cost flow and replace them only with the bounded Gatekeeper Open/Open Anyway guidance applicable to first substrate launch."
    - "The normal consumer workflow must not require repo checkout, host CPython, Xcode/Swift, local signing identity, Apple developer credentials, manual launchctl commands, sudo/root, quarantine deletion, or global Gatekeeper disable."
    - "Update uninstall to stop/reap the owned generation, boot out and safely remove only the owned current user LaunchAgent plist, remove current payload pointer/releases and owned Runtime state as appropriate, and preserve/validate foreign same-label protection. No system LaunchDaemon or privileged helper."
    - "Update recovery documentation and code for substrate-vs-payload generations, transaction recovery, pointer rollback and migration from split-v1. Keep same-UID threat-model limits explicit."
    - "Remove or make unreachable current-product ServiceManagement registration paths, current BundleProgram assumptions and paid distribution instructions while retaining only bounded historical migration compatibility."
    - "Add focused Python tests for payload closure/publish/selection/tamper rejection, zero-cost candidate provenance, legacy candidate compatibility, current user-LaunchAgent ownership, split-v1 migration/rollback, ordinary payload activation/rollback, uninstall/recovery, doctor/readiness and package closure."
    - "Add focused Swift tests for the new current lifecycle/onboarding semantics and the Runtime supervisor's owned child-process-group behavior. Delete or rewrite ServiceManagement-current tests that are obsolete; preserve migration compatibility tests where still authoritative."
    - "Run relevant focused Python and Swift suites and git diff --check. Preserve causal RED/GREEN evidence for materially new contracts."
    - "Freeze one immutable source candidate after focused qualification. Run canonical ./verify at most once through a direct local non-Agent-Runtime-durable clean carrier consistent with TASK-0175. Any canonical verifier failure blocks candidate manufacture."
    - "After source qualification, build at most one real zero-cost distribution set and one complete archive. Do not install, activate, cut over, restart or otherwise apply it to the live Agent Runtime in TASK-0181."
    - "The final artifact must independently validate exact source revision/tree, requirements lock, zero-cost signing mode, responsible executable identifiers/DRs, TeamIdentifier absence, substrate closure, initial payload closure, handoff SHA-256, complete archive SHA-256, current lifecycle contract, payload contract and 20-tool expected surface."
    - "Do not publish a GitHub Release or tag. Keep the immutable local artifact under ignored build output for the next Fresh-Install Acceptance task."
    - "On complete PASS create report-r1.yaml and stop NEEDS_REVIEW. On any failed lifecycle/provenance/onboarding/verification/artifact predicate stop BLOCKED without falling back to SMAppService current lifecycle, per-update app replacement, paid signing or a second updater."

