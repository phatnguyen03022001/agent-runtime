      command_or_check: "Implement/version the accepted substrate, user-LaunchAgent, payload-store/pointer, provenance and transaction contracts using existing surfaces; add causal focused tests."
      required: true
    - id: CHECK-2
      command_or_check: "Run focused affected Python and Swift suites, onboarding/doctor/migration/payload activation/uninstall/recovery tests, and git diff --check."
      required: true
    - id: CHECK-3
      command_or_check: "Freeze the source candidate and run canonical ./verify at most once through a direct local clean carrier."
      required: true
    - id: CHECK-4
      command_or_check: "After verification PASS, build exactly one zero-cost app+handoff+initial-payload distribution and one complete archive; independently revalidate all identities/contracts without live install."
      required: true
    - id: CHECK-5
      command_or_check: "Validate report-r1, fresh-resolve remote CAS, publish non-force, and reconcile clean synced main."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

