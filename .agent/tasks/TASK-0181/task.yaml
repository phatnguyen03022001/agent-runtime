invariants:
  - "Current product lifecycle has exactly one authority: traditional per-user LaunchAgent pointing to the embedded immutable supervisor."
  - "Ordinary Runtime updates mutate only the validated content-addressed first-party Python payload store and exact release pointer."
  - "App/helper/bootstrap/CPython/native/third-party/LaunchAgent bytes remain immutable across ordinary payload activation."
  - "Previous Runtime generation is fully stopped and reaped before release-pointer mutation."
  - "No current zero-cost path uses SMAppService registration, Developer ID, notarization, fake TeamIdentifier, root/sudo/system daemon, custom trust root, quarantine deletion or global security disable."
  - "Legacy predecessor contracts remain version-aware and rollback-safe."
  - "Native onboarding/config/tunnel/readiness/doctor semantics and the exact 20-tool public surface remain intact."
  - "Same-UID threat-model limitations remain explicit."
  - "No live production consequence occurs in TASK-0181."
  - "MAIN_ONLY topology remains unchanged."

forbidden_changes:
  - "A second updater daemon, installer, transaction state machine, lifecycle, payload selector or provenance subsystem."
  - "Embedding mutable agent_runtime Python source inside the app as a normal fallback."
  - "Native/executable/third-party/interpreter content in ordinary payload releases."
  - "Current-product SMAppService registration or BundleProgram lifecycle."
  - "Per-update replacement of the approved app for ordinary Runtime logic releases."
  - "Developer ID/notarization/stapling/Personal Team/custom trust root/fake TeamIdentifier in the supported current zero-cost path."
  - "Production Runtime/config/tunnel/lifecycle/payload mutation, branch, PR, force push, amend, squash, tag, public release or unrelated cleanup."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: forbidden
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "The packaged current generation is a truthful immutable zero-cost substrate plus one external initial pure-Python payload."
    evidence_required: "Package/provenance tests and one final artifact prove ad-hoc TeamIdentifier-free responsible code identity, strict substrate closure, no embedded mutable agent_runtime package, exact payload closure/manifest, legacy schema compatibility and complete app+handoff+payload archive identity."

  - id: AC-2
    requirement: "Current Runtime lifecycle is one owned user LaunchAgent with complete process-generation ownership."
    evidence_required: "Source/tests prove exact owned plist/program identity, bootstrap/bootout/kickstart behavior, helper dedicated process-group ownership, bounded graceful/forced teardown, no orphan child, and no normal-path SMAppService registration."

  - id: AC-3
    requirement: "Initial install and predecessor migration are transactional and rollback-safe."
    evidence_required: "Tests cover clean install plus accepted split-v1 and legacy predecessor migration, app/payload/plist/pointer transaction snapshots, commit/resume/rollback/recovery, foreign ownership rejection and exact previous-generation restoration."

  - id: AC-4
    requirement: "Ordinary external payload activation is content-addressed, fail-closed and app-immutable."
    evidence_required: "Tests prove publish/validate/activate v1->v2, full old-generation teardown before atomic pointer switch, unchanged substrate/plist/runtime.env, new-generation readiness, rollback to old pointer/generation on failure, and rejection of native/executable/wrong-contract/tampered payloads."

  - id: AC-5
    requirement: "Newcomer onboarding, doctor, readiness, uninstall and recovery remain coherent without ServiceManagement approval UX."
    evidence_required: "Focused Swift/Python tests preserve TASK-0175 config workflow and operational semantics, replace obsolete Background Activity instructions, validate payload/lifecycle state, and safely uninstall/recover owned current resources."

  - id: AC-6
    requirement: "Documentation describes the exact zero-cost trust/update boundary."
    evidence_required: "README/INSTALL/RECOVERY/THREAT_MODEL state first-substrate Gatekeeper approval may be required, ordinary pure-Python payload updates do not replace substrate, substrate/native changes are separate substrate releases that may require approval again, ad-hoc is not publisher authentication, and no security bypass/sudo/manual launchctl is normal workflow."

  - id: AC-7
    requirement: "The immutable final source candidate passes bounded verification."
    evidence_required: "Focused affected suites and Swift tests PASS, git diff --check PASS, canonical ./verify is invoked at most once via the clean direct-local carrier and PASSes, with exact final source revision/tree recorded."

  - id: AC-8
    requirement: "One immutable zero-cost distribution artifact is frozen for fresh-install acceptance."
    evidence_required: "Exactly one final distribution build/archive after source qualification; independent revalidation records app/substrate closure, initial payload closure, handoff/archive SHA-256, source revision/tree, requirements lock, lifecycle/payload contracts, ad-hoc signing IDs/DRs, TeamIdentifier absence and exact artifact paths."

