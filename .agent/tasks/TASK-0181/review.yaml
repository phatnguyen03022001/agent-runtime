blocking_findings:
  - id: B-0181-REV7-ZERO-COST-DESIGNATED-REQUIREMENT
    severity: BLOCKING
    classification: PRODUCT_SOURCE_ARTIFACT_SIGNING_MISMATCH
    summary: "The source candidate passes the complete qualification surface and canonical invocation 3, but the first real zero-cost distribution build fails during seal-zero-cost because package_app.sh ad-hoc signs code with explicit identifiers only. macOS therefore synthesizes CDHash-based designated requirements instead of the stable identifier-based designated requirements required by the zero-cost provenance contract."
    required_authority: "Revision 8 may correct only zero-cost ad-hoc signing in package_app.sh so every signed substrate Mach-O receives an explicit designated requirement equal to its deterministic identifier, add bounded regression coverage, requalify the changed source, and consume one new canonical verification plus one new distribution-build authority."

acceptance_basis:
  - "Report commit 35297f08eaca80a5d6b16390c4d5ae64a209f3c8 is the sole child of source candidate 8e7eebe2a5975ca61d7a07b1b0881e7f2784d9bf and adds only report-r7.yaml."
  - "The source candidate focused suite passed 182 tests across six affected modules; static checks passed; the complete non-canonical pre-sweep passed 62/62 modules and 839 tests."
  - "Canonical ./verify invocation 3 passed 62/62 modules and 839 tests against source candidate 8e7eebe2a5975ca61d7a07b1b0881e7f2784d9bf. Historical TASK-0181 canonical history is exactly FAIL, FAIL, PASS for invocations 1, 2 and 3."
  - "Exactly one real zero-cost distribution build was attempted after canonical PASS. It reached Swift production build, ad-hoc signing and seal-zero-cost, then failed before publication with designated requirement is missing for AgentRuntimeMenuBar. No archive was built."
  - "Current package_app.sh signs native substrate files and the outer app with --sign - and --identifier but without an explicit -r designated requirement."
  - "Current package_provenance.py intentionally requires responsible code to have TeamIdentifier absent, exact identifiers, and exact designated requirements of the form designated => identifier \"<expected identifier>\". Existing unit tests encode this contract."
  - "A disposable current-host probe proved that ad-hoc signing with only --identifier yields a generated CDHash requirement printed as '# designated => cdhash ...', while signing with -r='designated => identifier \"<id>\"' yields the exact stable identifier-based requirement and strict verification passes."
  - "A disposable minimal app-bundle probe proved that applying the same explicit identifier-based requirement when signing the outer app preserves the exact requirement on the main executable after bundle signing."
  - "Therefore provenance is not overly strict; package signing is incomplete relative to the accepted explicit-DR architecture. The correct fix is to make package_app.sh sign every native substrate code object with an explicit identifier-based DR, not to accept CDHash-default requirements."
  - "The pinned Foundation validator exits 3 on report-r7.yaml because focused module records use flow-style YAML mappings. The report's substantive evidence was independently reconciled from the report-only commit, source, build logs and local probes; revision 8 must not rely on a false claim of mechanical report validation."

