filesystem_security:
  result: PASS
  mechanism:
    - "Validated cwd reuses the existing Agent Runtime workspace-root working-directory guard."
    - "Item paths reject absolute, empty, dot, dot-dot, and NUL components."
    - "Traversal is descriptor-relative via dir_fd and O_NOFOLLOW; intermediate opens add O_DIRECTORY."
    - "Final open adds O_NONBLOCK, then os.fstat verifies a regular file before os.read consumes bytes."
    - "The fs_read_batch path mechanism does not use Path.resolve()+ordinary-open as its security boundary."
  adversarial_evidence:
    - "Final-component symlink replacement race returned SYMLINK_DISALLOWED without leaking outside content."
