structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "Both corrections remain inside the existing fs_read_batch implementation and tests; no new component or filesystem framework is authorized."

objective: "Correct the two TASK-0040 revision-1 defects without broadening scope: make selected-range strict UTF-8 behavior independent of internal read chunk boundaries, and make fs_read_batch acquire its validated cwd descriptor with a race-resistant trust anchor. Preserve the accepted six-tool contract and performance admission thresholds."

scope:
  required_changes:
    - "Correct selected-range UTF-8 processing so bytes outside the requested lines cannot change success or INVALID_UTF8 solely because of chunk placement."
    - "Correct cwd descriptor acquisition so intermediate namespace replacement cannot redirect the validated cwd between validation and descriptor acquisition."
    - "Add deterministic focused regressions for both defects and preserve all already-proven fs_read_batch behavior."
    - "Run final canonical verification and a fresh corrected-production real-MCP benchmark, then publish report revision 2."
  allowed_existing_files_or_components:
    - "agent_runtime fs_read_batch read/security implementation and the smallest existing validation helper surface needed for its cwd trust anchor"
    - "existing fs_read_batch security/conformance tests and narrowly focused regressions"
    - ".agent/tasks/TASK-0040/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "Public MCP surface remains exactly terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, fs_read_batch."
  - "Existing five public tool contracts and execution semantics remain unchanged."
  - "fs_read_batch annotations remain readOnly=true, destructive=false, idempotent=true, openWorld=false."
  - "Strict UTF-8 acceptance applies to selected returned line content; unselected bytes before start_line or after end_line must not affect the result solely because of chunk placement."
  - "Invalid UTF-8 inside selected content returns INVALID_UTF8 with no partial text."
  - "The cwd descriptor used as the fs_read_batch trust anchor cannot be redirected by intermediate symlink replacement between validation and descriptor acquisition."
  - "Item traversal remains descriptor-relative, cwd-descendant, no-symlink, regular-file-only, and safe for special-file rejection."
  - "The 128 KiB per-item and 256 KiB aggregate output limits remain unchanged with no caller-controlled override and no silent success truncation."
  - "AGENT_RUNTIME_WORKSPACE_ROOT remains documented as access-selection policy, not general mechanical host filesystem confinement."
  - "No live Runtime, config, runtime.env, tunnel, listener, installed package, main, tag, or release mutation occurs."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

forbidden_changes:
  - "No text_search, fs_stat_batch, or generic filesystem API."
  - "No hashing, globbing, recursive walk, directory listing, binary/base64 reads, arbitrary encoding detection, filesystem writes, watch, index, cache, daemon, service, database, or registry."
  - "No terminal_exec redesign or semantic/capture change."
  - "No general workspace-root sandboxing or second security system."
  - "No third-party dependency."
  - "No live Runtime install, reload, restart, stop, config, tunnel, listener, desired-state, or runtime.env mutation."
  - "No main promotion, tag, or release work."

acceptance_criteria:
  - id: AC-1
    requirement: "Selected-range UTF-8 behavior is deterministic: unselected invalid bytes before or after the requested lines do not affect the result, same-versus-next-chunk placement is equivalent, and invalid selected content returns INVALID_UTF8."
    evidence_required: "Focused regressions force equivalent invalid unselected bytes into different read chunk layouts, cover invalid selected content, and prove identical client-visible semantics."
  - id: AC-2
    requirement: "The cwd trust-anchor descriptor is acquired race-resistently so intermediate-component replacement between validation and descriptor acquisition cannot redirect the authorized cwd."
    evidence_required: "Implementation inspection plus a deterministic adversarial cwd-intermediate-component replacement test where feasible."
  - id: AC-3
    requirement: "All unaffected revision-1 contract predicates remain preserved, including exact six-tool surface, typed results/errors, item-path no-symlink traversal, special-file rejection, output limits, timing attribution, and MCP 2.2 sanitization."
    evidence_required: "Affected existing conformance/security tests and exact correction diff inspection show no unrelated contract or dependency change."
  - id: AC-4
    requirement: "The stabilized corrected candidate passes canonical repository verification."
    evidence_required: "Use targeted tests during iteration; after bytes stabilize, run ./verify once in full. A separate final focused rerun is not required when the full suite includes those regressions."
  - id: AC-5
    requirement: "Corrected production fs_read_batch still beats the optimized one-call terminal_exec baseline by at least 20% median and at least 20 ms absolute median on the bounded real-MCP workload."
    evidence_required: "Fresh real-MCP benchmark with warmup and at least 20 measured calls per path records both medians, absolute and relative improvement, and material variance/outliers."
  - id: AC-6
    requirement: "Correction remains narrowly scoped with no rejected capability, dependency, existing-tool semantic change, live Runtime/config mutation, main promotion, or release work."
    evidence_required: "Exact revision-2-base-to-candidate diff/status inspection and boundary evidence."
  - id: AC-7
    requirement: "Publication is one correction implementation commit followed by one report-revision-2-only commit on dev, non-force, with unchanged main, then stop for Architect review."
    evidence_required: "Fresh remote refs before and after publication plus exact commit/report lineage."

verification:
  executor_checks:
    - id: V-1
      command_or_check: "During implementation, run the minimum focused regressions needed for the two defects and affected fs_read_batch security/conformance behavior."
      required: true
    - id: V-2
      command_or_check: "After implementation stabilizes, run ./verify once in full on the exact correction candidate."
      required: true
    - id: V-3
      command_or_check: "Run a fresh corrected-production real-MCP benchmark with at least 20 measured calls per path and record exact threshold evidence in report revision 2."
      required: true
    - id: V-4
      command_or_check: "Inspect the exact revision-2 base-to-candidate diff for scope, dependency, terminal_exec semantic, rejected-capability, and live-mutation violations."
      required: true
    - id: V-5
      command_or_check: "Fresh-resolve origin/dev and origin/main immediately before non-force publication and again after publication; fail closed on drift."
      required: true
  authoritative_verification:
