objective: "Add exactly one sixth public MCP tool, fs_read_batch, for bounded ordered multi-file UTF-8 reads with heterogeneous line ranges and race-resistant descendant/no-symlink path access. Preserve the accepted five existing tools and MCP 2.2.0 error/conformance behavior, integrate the new tool into existing timing observability, and re-prove the measured real-MCP performance rationale against the best optimized one-call terminal_exec baseline without broadening Agent Runtime into a generic filesystem subsystem."

research_evidence:
  provenance: "Three independent read-only research passes supplied by the operator for this planning decision."
  findings:
    - "Optimized existing terminal_exec one-call baselines measured approximately 47-73 ms median for representative multi-file full/ranged workloads through the real public MCP Client path."
    - "An ephemeral in-process fs_read_batch prototype measured approximately 0.25-1.4 ms on the same MCP Client path."
    - "Representative absolute savings were approximately 48-71 ms per logical workload."
    - "One real five-file heterogeneous-range workload reduced MCP response size from approximately 95.2 KB to approximately 32.1 KB, about 66%, while prototype handler latency remained negligible."
    - "Existing terminal_exec can already provide useful partial-failure attribution in one optimized call; structured partial errors alone are not an admission rationale."
    - "The enduring admitted value is bounded multi-file reading, heterogeneous selected ranges, avoidance of terminal_exec's existing 64 KiB stdout truncation/recovery boundary, and material real-MCP latency improvement."
    - "The measured advantage is partly attributable to current terminal_exec execution/capture overhead, not merely subprocess spawn; production performance must therefore be revalidated rather than assumed."

