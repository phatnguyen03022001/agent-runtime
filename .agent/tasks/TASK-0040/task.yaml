required_design:
  public_surface:
    - "Register exactly one new public MCP tool named fs_read_batch; final public surface is exactly terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, fs_read_batch."
    - "Keep all five existing tool names, signatures, typed output contracts, annotations, execution semantics, and MCP 2.2.0 deliberate/unexpected error behavior unchanged."
    - "fs_read_batch annotations are exactly readOnly=true, destructive=false, idempotent=true, openWorld=false. Annotations are descriptive hints, not authorization."
    - "Keep the implementation inside the existing small MCP/runtime boundary. Do not create a filesystem framework, registry, service, cache, index, daemon, or second security system."

  input_contract:
    - "fs_read_batch accepts a validated absolute cwd and exactly one ordered items list containing 1..20 items."
    - "cwd must satisfy the existing workspace-root working-directory validation applicable to Agent Runtime and identify an existing directory."
    - "Each item contains path plus optional start_line and optional end_line. path is a strict non-empty cwd-relative descendant path, maximum 4096 characters."
    - "Reject absolute item paths, NUL, empty path components, '.' components, and '..' components as deliberate request validation failures."
    - "start_line and end_line are strict 1-based inclusive positive integers. Missing start_line means line 1; missing end_line means EOF. If both are present, end_line must be >= start_line."
    - "Preserve item ordering exactly. The same path may appear multiple times with different or identical ranges."
    - "If start_line is beyond EOF, a valid UTF-8 regular file returns an OK item with empty text. If end_line exceeds EOF, return through EOF. Preserve original decoded text and line terminators; do not normalize newline style."

  filesystem_boundary:
    - "Regular files only. Do not read directories, FIFOs, sockets, block/character devices, or other special files."
    - "Strict UTF-8 only: no replacement decoding, fallback encodings, encoding detection, binary mode response, or base64 response. Content selected for return must decode strictly as UTF-8 or the item fails with the bounded typed INVALID_UTF8 result."
    - "No symlink component may be followed for an item path, including intermediate components."
    - "Descendant and no-symlink semantics must be enforced at open/traversal time, not merely by pre-resolving a path string. Plain Path.resolve() followed by ordinary open() is insufficient because it leaves a namespace TOCTOU race."
    - "Use descriptor-anchored traversal/opening relative to the validated cwd directory or an equivalently race-resistant mechanism. The material invariant is that namespace replacement cannot turn an authorized descendant path into a symlink escape between validation and read."
    - "The final opened object must be verified from the opened handle as a regular file before bytes are consumed. The open strategy must not allow a FIFO/socket/device to block or create read side effects before regular-file verification."
    - "Do not claim that AGENT_RUNTIME_WORKSPACE_ROOT mechanically confines arbitrary host filesystem access. Document that fs_read_batch has its own bounded descendant/no-symlink read boundary while the workspace root remains non-sandbox selection policy for Agent Runtime generally."

  output_contract:
    - "Use closed typed MCP result models consistent with the existing Pydantic contract style."
    - "The top-level result contains exactly an ordered items result list corresponding one-for-one with the input items."
    - "Each successful item is a closed discriminated result containing status='ok', the original relative path, effective start_line, requested end_line or null, and complete text."
    - "Each expected per-item failure is a closed discriminated result containing status='error', the original relative path, effective start_line, requested end_line or null, a stable bounded error_code, and a bounded sanitized message. It contains no partial text."
    - "Stable per-item error codes cover at minimum NOT_FOUND, ACCESS_DENIED, SYMLINK_DISALLOWED, NOT_REGULAR_FILE, INVALID_UTF8, ITEM_OUTPUT_LIMIT_EXCEEDED, BATCH_OUTPUT_LIMIT_EXCEEDED, and READ_FAILED. Do not surface raw OSError text, absolute host paths, tracebacks, or secrets in item messages."
    - "Fixed server-owned returned-text ceilings are 128 KiB UTF-8 bytes per successful item and 256 KiB UTF-8 bytes aggregated across successful items in one call. There are no caller-controlled parameters that can raise either ceiling."
    - "Never silently truncate decoded text to satisfy a ceiling. If an item's complete selected text would exceed the per-item ceiling, return ITEM_OUTPUT_LIMIT_EXCEEDED for that item with no text. If adding an otherwise valid complete item would exceed the aggregate ceiling, return BATCH_OUTPUT_LIMIT_EXCEEDED for that item with no text. Continue processing later ordered items within the remaining aggregate budget."
    - "Output byte accounting is over UTF-8 bytes of returned text, not character count."

  error_contract:
    - "JSON Schema/Pydantic validation and deeper request/config validation use the accepted deliberate ToolError discipline for model-actionable invalid requests such as invalid cwd, item count, lexical path shape, or line-range relationship."
    - "Expected filesystem conditions for individual well-formed items use bounded typed item failures so one bad file does not erase valid sibling results."
    - "Only known expected validation/domain/filesystem failures may be deliberately exposed. Do not broad-catch Exception/BaseException into model-visible item text. Unexpected implementation exceptions must remain sanitized by MCP 2.2.0 and must not expose exception messages, tracebacks, paths, or sentinels."

  observability_and_docs:
    - "Extend existing timing attribution so all six public tools, including the already-public capacity_observer and new fs_read_batch, are recognized by the existing tool-name allowlist. This is a minimal name-consistency repair only; do not add telemetry fields, payload logging, history, persistence, or a new timing system."
    - "Update README tool-surface documentation from five to exactly six tools and document fs_read_batch bounds/path semantics plus the unchanged non-confinement meaning of AGENT_RUNTIME_WORKSPACE_ROOT."
    - "Update server instructions minimally so models can discover the bounded fs_read_batch purpose and constraints. Preserve Agent Runtime name/version and do not use this task to redesign server metadata."

  conformance:
    - "Extend typed-contract and exact-registration tests to assert the final six-tool surface and exact fs_read_batch annotations/schema/closed output contract."
    - "Add focused filesystem tests for ordered multi-file reads, full-file reads, heterogeneous inclusive ranges, duplicate paths, empty-after-EOF ranges, strict UTF-8, item/batch ceilings, and expected partial failures."
    - "Add adversarial filesystem tests for absolute/.. lexical rejection, intermediate/final symlinks, symlink replacement/rename races where deterministically testable, directory/FIFO/socket/device rejection without blocking, and descendant confinement at open time."
    - "Extend the real public MCP Client conformance gate to list/call exactly six tools, validate fs_read_batch schemas/annotations/results, prove deliberate request errors, prove bounded item errors, and prove an injected unexpected exception sentinel remains sanitized."
    - "Preserve the existing five-tool conformance predicates while updating their exact expected surface to six."

performance_acceptance:
  workload: "At least one representative five-file heterogeneous-line-range workload using real repository text fixtures and the same logical requested content for both paths."
  baseline: "Best optimized one-call terminal_exec implementation for the entire workload; do not compare against one terminal_exec call per file."
  path: "Both baseline and fs_read_batch must be invoked through the same public MCP Client path against the production server implementation, not direct handler calls."
  method:
    - "Warm both paths before measurement and collect a bounded repeated sample set sufficient for a stable median; use at least 20 measured calls per path."
    - "Keep workload files/ranges, client path, process, and host conditions materially equivalent. Interleave or otherwise control run-order bias."
    - "Record exact benchmark workload, baseline argv/strategy, sample counts, both medians, relative improvement, absolute median improvement, and any material variance/outliers in the Executor report."
    - "Do not encode host timing thresholds as a permanent unit-test assertion."
  pass_threshold:
    relative_median_improvement_minimum: "20%"
    absolute_median_improvement_minimum: "20 ms"
  failure_policy: "If the production fs_read_batch implementation fails either threshold, the admission rationale is not proven. Executor must report the criterion as failed and stop for Architect review; the task cannot be accepted and the Architect judgment must be REVISION_REQUIRED. Do not waive the failure by citing prototype timing."

