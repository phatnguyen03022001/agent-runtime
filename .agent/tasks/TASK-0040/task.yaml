acceptance_criteria:
  - id: AC-1
    requirement: "The public MCP surface is exactly terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, fs_read_batch; the existing five contracts/semantics remain unchanged and fs_read_batch has exactly readOnly=true, destructive=false, idempotent=true, openWorld=false."
    evidence_required: "Exact public list_tools/schema/annotation assertions through the real MCP Client plus focused registration tests."
  - id: AC-2
    requirement: "fs_read_batch enforces the exact ordered 1..20-item input and 1-based inclusive range semantics, supports duplicate paths/ranges, and returns closed typed ordered success/error results with no caller-controlled ceiling knobs."
    evidence_required: "Focused typed-contract and behavior tests covering 1/20/21 items, range defaults/bounds, duplicate paths, ordering, and closed result schemas."
  - id: AC-3
    requirement: "Filesystem access is regular-file-only, strict UTF-8, cwd-descendant, and no-symlink for every traversed item component at open time; deterministic tests prove Path.resolve()+open()-style TOCTOU/symlink escape is not the security mechanism."
    evidence_required: "Focused adversarial tests for traversal, intermediate/final symlinks, race substitution where deterministic, and non-regular file rejection without blocking, plus implementation diff inspection of the open-time mechanism."
  - id: AC-4
    requirement: "Returned text is never silently truncated: complete selected text is capped at 128 KiB per successful item and 256 KiB aggregate, with typed no-text limit failures when a complete item cannot fit."
    evidence_required: "Boundary tests immediately below/at/above both fixed byte ceilings, including multibyte UTF-8 accounting and assertions that limit errors contain no partial text."
  - id: AC-5
    requirement: "Invalid requests/configuration use deliberate bounded ToolError behavior; expected per-item filesystem failures are typed/sanitized; unexpected exceptions remain MCP 2.2.0-sanitized with no sentinel, traceback, raw OS error, absolute host path, or secret leakage."
    evidence_required: "Real-client deliberate-error, item-error, schema-rejection-before-delegate, and injected unexpected-exception sanitization tests."
  - id: AC-6
    requirement: "Existing timing observability recognizes all six public tool names, including capacity_observer and fs_read_batch, without telemetry expansion or payload logging."
    evidence_required: "Timing tests showing tool_name attribution for capacity_observer and fs_read_batch and diff proof that no new telemetry payload/history surface was added."
  - id: AC-7
    requirement: "README and server instructions document exactly six tools, fs_read_batch semantics/bounds, and that AGENT_RUNTIME_WORKSPACE_ROOT is not general mechanical filesystem confinement."
    evidence_required: "Diff inspection of README/server instructions and exact public metadata assertions."
  - id: AC-8
    requirement: "Focused filesystem/security/contract tests and the real public MCP Client conformance gate pass for the complete six-tool surface, including schema/annotations, representative success/partial failure, deliberate ToolError, and unexpected-exception sanitization."
    evidence_required: "Recorded commands and PASS outputs for focused suites and the real MCP Client conformance suite."
  - id: AC-9
    requirement: "A bounded production real-MCP benchmark on at least one five-file heterogeneous-range workload beats the best optimized one-call terminal_exec baseline by both >=20% median and >=20 ms absolute median; exact benchmark evidence is recorded in report.yaml and is not encoded as a flaky permanent unit-test assertion."
    evidence_required: "Executor report records workload identity, exact optimized one-call baseline strategy, >=20 measured calls per path after warmup, both medians, relative improvement, absolute improvement, and material variance/outliers."
  - id: AC-10
    requirement: "./verify passes in full; no third-party dependency, live Runtime/config/tunnel/listener lifecycle mutation, terminal_exec redesign, rejected filesystem capability, main promotion, or release work is introduced."
    evidence_required: "Full ./verify PASS plus exact base-to-candidate diff/status inspection and repository/runtime boundary evidence."
  - id: AC-11
    requirement: "origin/main remains unchanged; publication is implementation commit plus report-only commit, non-force to dev only, then stop for Architect review."
    evidence_required: "Fresh remote refs before/after push and exact commit lineage showing one implementation commit followed by one report-only commit on dev, with unchanged main."

