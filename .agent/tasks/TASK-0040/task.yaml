structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "The correction remains inside fs_read_batch cwd authorization/trust-anchor acquisition and focused tests; no new component or filesystem framework is authorized."

objective: "Close the remaining fs_read_batch cwd trust-anchor identity race so a validated cwd cannot be redirected to a different ordinary directory object by rename/replacement before descriptor acquisition, while preserving every unaffected TASK-0040 contract and keeping the correction minimal."

scope:
  required_changes:
    - "Bind fs_read_batch cwd authorization to the directory identity actually opened, so pure directory rename/replacement between validation and descriptor acquisition fails closed instead of reading replacement content."
    - "Add a deterministic adversarial regression for replacement of a validated intermediate cwd directory with a different ordinary directory before trust-anchor acquisition."
    - "Preserve revision-2 selected-range UTF-8 behavior and all unaffected six-tool/security/error/output semantics."
    - "Run affected focused verification, one final ./verify on stabilized bytes, a fresh real-MCP performance benchmark, and publish report revision 3."
  allowed_existing_files_or_components:
    - "agent_runtime fs_read_batch cwd trust-anchor/read implementation and the smallest existing cwd validation helper surface needed for identity binding"
    - "existing fs_read_batch adversarial/security/conformance tests"
    - ".agent/tasks/TASK-0040/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "Public MCP surface remains exactly terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, fs_read_batch."
  - "Existing five public tool contracts and terminal execution semantics remain unchanged."
  - "The directory object used as fs_read_batch cwd trust anchor must be the same authorized identity established during cwd validation; pathname reuse alone is insufficient."
  - "Symlink and pure-directory namespace replacement between cwd validation and trust-anchor acquisition must both fail closed."
  - "Selected-range UTF-8, descriptor-relative item traversal, regular-file-only behavior, output ceilings, typed errors, timing attribution, and MCP 2.2 sanitization remain unchanged."
  - "AGENT_RUNTIME_WORKSPACE_ROOT remains access-selection policy, not general host filesystem confinement."
  - "No live Runtime, config, runtime.env, tunnel, listener, installed package, main, tag, or release mutation occurs."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

forbidden_changes:
  - "No text_search, fs_stat_batch, generic filesystem API, hashing, globbing, recursive walk, listing, binary/base64 reads, writes, watch, index, cache, daemon, service, database, or registry."
  - "No terminal_exec redesign or semantic/capture change."
  - "No general workspace-root sandboxing or second filesystem security framework."
  - "No third-party dependency."
  - "No live Runtime install/reload/restart/stop/config/tunnel/listener/runtime.env mutation."
  - "No main promotion, tag, or release work."

acceptance_criteria:
  - id: AC-1
    requirement: "Pure directory rename/replacement after cwd validation cannot redirect fs_read_batch to a different directory identity before trust-anchor acquisition."
    evidence_required: "Deterministic adversarial regression replaces a validated intermediate cwd directory with a different ordinary directory immediately before trust-anchor acquisition and proves replacement content is never returned."
  - id: AC-2
    requirement: "The implementation binds validation to the opened cwd directory identity rather than relying only on pathname resolution or O_NOFOLLOW_ANY."
    evidence_required: "Implementation inspection plus regression evidence showing identity mismatch fails closed; symlink replacement protection remains intact."
  - id: AC-3
    requirement: "All unaffected TASK-0040 revision-2 predicates remain preserved, including selected-range UTF-8 semantics, exact six-tool surface, item no-symlink traversal, special-file rejection, output ceilings, typed errors, timing attribution, and MCP sanitization."
    evidence_required: "Affected focused/conformance tests and exact correction diff show no unrelated contract change."
  - id: AC-4
    requirement: "The stabilized correction passes canonical repository verification."
    evidence_required: "Use targeted tests during iteration; after bytes stabilize, run ./verify once in full."
  - id: AC-5
    requirement: "Corrected production fs_read_batch still beats optimized one-call terminal_exec by at least 20% median and at least 20 ms absolute median on the accepted real-MCP workload."
    evidence_required: "Fresh benchmark with warmup and at least 20 measured calls/path records medians, absolute/relative improvement, and material variance/outliers."
  - id: AC-6
    requirement: "Correction remains narrowly scoped with no dependency, rejected capability, terminal_exec semantic change, live Runtime/config mutation, main promotion, tag, or release work."
    evidence_required: "Exact revision-3-base-to-candidate diff/status and boundary evidence."
  - id: AC-7
    requirement: "Publication is one correction implementation commit followed by one report-revision-3-only commit on dev, non-force, with unchanged main, then stop for Architect review."
    evidence_required: "Fresh remote refs before/after publication and exact lineage."

