blocking_findings:
  - id: UTF8_RANGE_CHUNK_BOUNDARY
    criterion: AC-3
    evidence: "agent_runtime/fs_read.py decodes each entire raw read chunk with the strict UTF-8 decoder before processing end_line. Invalid bytes after the requested range therefore fail when present in the same chunk, while bytes in a later unread chunk may not be validated. Client-visible validity can depend on chunk placement rather than the selected range contract."
    consequence: "The required strict UTF-8 range semantics are not deterministic and are not proven by the current focused tests."
  - id: CWD_DESCRIPTOR_ANCHOR_RACE
    criterion: AC-3
    evidence: "agent_runtime/executor.py validates cwd with Path.resolve(strict=True), then agent_runtime/fs_read.py later opens the resolved cwd by absolute pathname before descriptor-relative item traversal. This leaves an intermediate-component namespace replacement window at the cwd trust anchor. Darwin distinguishes O_NOFOLLOW from O_NOFOLLOW_ANY, so final-component O_NOFOLLOW alone is not a full-path no-symlink guarantee."
    consequence: "The item traversal is descriptor-relative after cwd_fd exists, but the cwd descriptor itself is not yet proven to be acquired with the task's race-resistant descendant/no-symlink invariant."

revision_requirements:
  - "Make UTF-8 range validity deterministic and aligned with the task's selected-content contract: bytes outside the requested selected lines must not change the result merely because of read chunk boundaries, while invalid UTF-8 inside selected returned content must still produce INVALID_UTF8. Add focused regression tests that force the same invalid suffix into the same versus a later read chunk and prove identical client-visible results."
  - "Close the cwd trust-anchor namespace race. Acquire or validate the cwd descriptor with an open-time mechanism that cannot be redirected through an intermediate symlink replacement between pathname validation and descriptor acquisition. Keep the existing workspace-root non-confinement documentation and do not broaden into a second security framework. Add a deterministic adversarial regression covering intermediate cwd-component replacement where feasible."
  - "After correction, rerun only verification invalidated by changed bytes plus the required final canonical verification and performance proof if the changed read path can materially affect benchmark acceptance. Publish a new truthful report revision for Architect review."

