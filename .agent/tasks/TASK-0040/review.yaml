blocking_findings:
  - id: CWD_DIRECTORY_REPLACEMENT_RACE
    criterion: AC-2
    evidence: "After _validated_cwd() resolves and validates the cwd pathname, an intermediate validated directory can be renamed away and a different ordinary directory can be renamed into the same pathname before os.open(... O_NOFOLLOW_ANY | O_DIRECTORY). O_NOFOLLOW_ANY rejects symlinks but does not bind the opened directory identity to the directory object previously validated. Independent Architect reproduction returned RENAMED_SECRET from the replacement namespace."
    consequence: "The cwd trust-anchor claim is false for pure directory namespace replacement: fs_read_batch can acquire and read from a different directory object than the one validated before descriptor acquisition."

revision_requirements:
  - "Acquire the fs_read_batch cwd trust anchor with identity binding that cannot be redirected by pure directory rename/replacement between authorization validation and descriptor acquisition. Symlink-only protection is insufficient."
  - "Add a deterministic adversarial regression that validates a cwd, replaces an intermediate directory with a different ordinary directory before trust-anchor acquisition, and proves redirected content cannot be read."
  - "Keep the correction bounded to fs_read_batch cwd authorization/trust-anchor acquisition and focused tests; do not broaden into general workspace sandboxing or redesign terminal_exec."
  - "Rerun only verification invalidated by the correction plus one final canonical ./verify and a fresh benchmark only if the read path materially changes performance."

