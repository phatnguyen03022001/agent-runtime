    precedence: 3

structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime/executor.py and tests/test_terminal_exec.py"
  rationale: "This is a bounded reliability defect in process-group cleanup/probing. No architecture, public tool surface, installer lifecycle, or policy change is justified."

objective: "Fix the reproduced macOS/Python 3.14 process-group cleanup failure so terminal_exec timeout cleanup handles POSIX process-group existence probing truthfully, does not leak child processes, and ./verify can pass on the operator Mac, without weakening cleanup guarantees or changing the one-tool host architecture."

scope:
  required_changes:
    - "Use the operator-supplied macOS/Python 3.14.6 failure as causal RED evidence. Add a deterministic regression that reproduces the relevant errno/PermissionError semantics without requiring macOS when possible."
    - "Correct process-group existence/probe handling using POSIX semantics: distinguish ESRCH/non-existence from EPERM/existence-without-permission. Do not interpret EPERM as group absence."
    - "Preserve truthful cleanup behavior: timeout must still attempt bounded SIGTERM then SIGKILL escalation as needed, reap the leader, avoid intentional detached descendants, and return timed_out=true only after cleanup handling completes."
    - "If an actual SIGTERM/SIGKILL operation itself is denied rather than only the signal-0 probe, fail explicitly rather than manufacturing successful cleanup."
    - "Keep public MCP surface exactly {terminal_exec}; do not modify install/start lifecycle except if a test-only or documentation correction is strictly required by the defect."
    - "Run focused deterministic tests and root ./verify in the Executor environment. Because the causal failure is Darwin-specific, obtain one final operator-Mac verification of ./verify on the exact candidate implementation before reporting PASS. If direct Mac capability is unavailable, one bounded operator-supplied verification bundle is authorized for this exact command/result only; do not ask for secrets or broad diagnostics."
    - "Publish one implementation commit on dev, then a separate report-only .agent/tasks/TASK-0013/report.yaml commit; stop at Governing Architect review. Do not promote main in this task."

  allowed_existing_files_or_components:
    - agent_runtime/executor.py
    - tests/test_terminal_exec.py
    - tests/test_surface_and_scripts.py
    - README.md
    - verify
    - .agent/tasks/TASK-0013/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "The only public MCP tool remains terminal_exec."
  - "No project registry, sync engine, verifier state engine, command ACL, sandbox, daemon, autostart, policy broker, or orchestration machinery is introduced."
  - "Direct argv/shell=False, cwd realpath guard, minimal child environment, disconnected stdin, bounded output, and bounded timeout/process-group cleanup remain intact."
  - "main remains 8428d698f803250e62c9b387a100f71eb2ef73bb during this task and branches remain exactly {dev, main}."
  - "Historical .agent/tasks evidence remains unchanged except TASK-0013 task/report and later review."

forbidden_changes:
  - "Do not treat PermissionError/EPERM from a signal-0 existence probe as proof that the process group is gone."
  - "Do not swallow permission errors from actual termination signals and claim successful cleanup."
  - "Do not weaken or remove the descendant-leak regression merely to make the suite green."
  - "Do not change MCP surface, dependency versions, tunnel/plugin credentials, local secret files, main, tags, releases, repository metadata, other repositories, or branch topology."
  - "Do not add command-specific policy or platform abstraction frameworks."

