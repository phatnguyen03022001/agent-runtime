authority_sources:
  - source: "Current operator decision on 2026-09-17: Agent Runtime is always-on shared local infrastructure; support roughly 6-10+ connected logical ChatGPT/MCP callers, but hard-bound concurrent heavy execution to six; ordinary agents may inspect/use Runtime but must not start, stop, restart, kill, repair, re-register, or rebind protected port 8080."
    role: "Primary product/operational authority for the x6 supported envelope and lifecycle boundary."
    precedence: 1
  - source: "phatnguyen03022001/agent-runtime@f5697f6e93830413fd98a969b85f638d7a32010b"
    role: "Exact current target source baseline and existing six-tool/runtime/session/capacity behavior."
    precedence: 2
  - source: "phatnguyen03022001/agent-skills@1826d33bd1e467896c133109b37db8b0656b3276"
    role: "Pinned Architect/Executor/reliability/verification/simplicity governance authority."
    precedence: 3

structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime package, existing tests, and existing Runtime documentation."
  rationale: "This is bounded reliability hardening of the current six-tool provider. No scheduler, worker framework, queue, service, database, tenancy layer, or new top-level subsystem is required."

objective: >-
  Harden Agent Runtime so one shared Runtime instance remains responsive under the supported operating envelope of up to six concurrent heavy execution workloads while approximately 6-10+ logical callers may remain connected. Enforce one process-local fail-fast heavy admission boundary shared by terminal_exec and terminal_start, keep persistent PTY work bounded within that same total, preserve read/observe/control availability, and provide graceful cleanup for both persistent PTYs and in-flight one-shot executions. Prove the x6 behavior deterministically without restarting or otherwise lifecycle-mutating the installed live Runtime.

scope:
  required_changes:
    - "Introduce one shared Runtime heavy-execution admission invariant: active terminal_exec workloads plus live terminal_start PTY workloads MUST never exceed six, and any lower operator-configured parallelism remains authoritative."
    - "Admission MUST be non-blocking/fail-fast before subprocess or PTY creation. When no heavy slot is available, the request returns one deterministic Runtime capacity error and performs no Popen/openpty/spawn side effect. Runtime MUST NOT add a queue, retry loop, scheduler, worker pool, or delayed admission path."
    - "terminal_exec MUST hold exactly one heavy permit from immediately before spawn until the process/group cleanup and bounded output-drain lifecycle is complete, releasing exactly once on success, timeout, spawn failure, exception, and graceful Runtime shutdown."
    - "terminal_start MUST acquire one heavy permit before PTY/process creation and transfer ownership of that permit to the session for the entire live PTY lifetime. It releases exactly once on startup failure, natural exit, explicit terminate, idle reap, concurrent cleanup race resolution, or graceful Runtime shutdown. Returning from terminal_start MUST NOT release the permit while the PTY process remains live."
    - "Persistent PTY capacity MUST have an effective hard maximum of six and MUST NOT retain the current 64/unbounded-above policy. Preserve an operator-lowerable setting only if its valid/default semantics can never raise active PTY capacity above six; prefer a direct bounded 1..6 contract over redundant capacity axes."
    - "capacity_observer remains read-only/advisory and must not become a scheduler or admission owner. Its healthy-host recommended ceiling may reach six only when source logic and required x6 evidence support that claim; degraded host signals may continue to recommend lower values. The hard admission boundary remains authoritative even when observer/config values are higher or stale."
    - "terminal_poll, terminal_control, capacity_observer, and fs_read_batch MUST NOT consume a new heavy permit. Existing control operations on an already-live PTY operate on that PTY's existing lease."
    - "Add the minimum bounded active terminal_exec ownership/cleanup state needed so graceful Runtime SIGTERM/SIGINT cleanup covers in-flight one-shot execution process groups as well as persistent PTY sessions. This state is cleanup ownership only, not a job registry, queue, scheduler, durable store, or orchestration layer."
    - "Preserve existing output bounds, timeouts, process-group cleanup, PTY idle reap, completed-session retention, workspace validation, protected-runtime filtering, six public tool names, and truthful MCP tool annotations."
    - "Update README/runtime configuration documentation only as needed to state the x6 hard execution envelope, fail-fast overload behavior, PTY bound, advisory-versus-hard capacity distinction, graceful cleanup boundary, and explicit non-goals for malicious/pathological same-UID children."
    - "Implement deterministic isolated concurrency tests proving x6 admission, mixed exec+PTY accounting, fail-fast overload without spawn, exactly-once permit release across all terminal paths, cleanup races, read/observe/control responsiveness while six heavy slots are occupied, and absence of permit/session/thread/FD leaks over repeated bounded cycles."
    - "Run an isolated x6 MCP/runtime integration proof using test-owned/synthetic subprocesses only. It MUST NOT invoke or stress the installed production Runtime service, secure tunnel, ServiceManagement state, or protected port 8080."
    - "Publish one implementation commit and one report-only direct child to dev, both non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - "agent_runtime execution/admission/session/server/capacity/contracts/error/timing modules as materially required"
    - "tests covering execution/session/server/capacity/runtime lifecycle behavior"
    - "README.md and .env.example only when required to keep the configuration/public contract accurate"
    - ".agent/tasks/TASK-0057/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "The six public MCP tool names remain exactly terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, and fs_read_batch."
  - "At every instant, active terminal_exec roots + live terminal_start PTY roots <= 6."
  - "An operator-configured value below six may lower capacity; no configuration or observer state may raise the hard execution ceiling above six."
  - "The seventh and later concurrent heavy requests fail fast before spawn while all six heavy permits are occupied."
  - "Runtime contains no Runtime-side execution queue and performs no automatic overload retry."
  - "Read/observe/control tools do not require a newly available heavy slot."
  - "No permit is leaked or released twice on success, timeout, spawn failure, natural exit, terminate, idle reap, cleanup race, or graceful shutdown."
  - "Agent Runtime remains same-UID host execution, not a sandbox or hard resource-isolation system. x6 admission does not claim protection from fork bombs, escaped descendants, malicious memory/CPU/disk exhaustion, or kernel/OS failure."
  - "Normal task authority does not grant lifecycle authority over the installed Runtime, secure tunnel, ServiceManagement registration, desired-state marker, runtime.env, or port 8080."

forbidden_changes:
  - "Do not start, stop, restart, kill, signal, repair, reinstall, commit-cutover, rollback, register, unregister, or otherwise lifecycle-mutate the installed live Agent Runtime or tunnel."
  - "Do not mutate protected port 8080, runtime.env, desired-state markers, System Settings, Background Task Management, TCC, launchd/ServiceManagement live state, installed app bytes, or the current live cutover transaction."
  - "Do not change MCP terminal tool annotations to falsely claim read-only/non-destructive/non-open-world behavior or otherwise attempt to bypass OpenAI platform safety gating."
  - "Do not change the six-tool public surface or add a seventh admission/scheduler tool."
  - "Do not add a bounded/unbounded FIFO queue, scheduler, worker pool, daemon supervisor, watchdog, database, durable job registry, per-client tenancy/quota system, per-pair lane system, distributed lock, or orchestration framework."
  - "Do not add OS-level child CPU/RAM/NPROC/NOFILE/FSIZE limits in this task."
  - "Do not claim fairness between callers, malicious-child containment, fork-bomb survival, zero orphaning after SIGKILL/kernel failure, or zero-downtime crash recovery."
  - "Do not fix the separate packaging-artifact overwrite defect in this task; that is an independent acceptance boundary."
  - "Do not modify architect-profile, agent-skills, agent-standards, agent-documents, 01/02/03 planning files, main, tags, releases, branch topology, or unrelated Runtime UX/ServiceManagement code."

