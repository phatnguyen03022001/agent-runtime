structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime.executor implementation and TASK-0057 focused tests."
  rationale: "This revision is one local correctness repair inside the already accepted x6 design; no new component or abstraction is needed."

objective: >-
  Correct the sole blocking TASK-0057 review finding without redesigning the accepted x6 admission architecture: terminal_exec must finish its bounded stdout/stderr reader drain before materializing the returned payload, while its heavy lease remains held through that drain. Add a deterministic regression that proves delayed reader completion cannot produce incomplete returned stdout/stderr. Preserve all other TASK-0057 behavior and keep the installed live Runtime untouched.

scope:
  required_changes:
    - "In agent_runtime/executor.py, ensure terminal_exec completes the existing bounded reader-thread drain/close lifecycle before evaluating the stdout/stderr values placed in the returned result."
    - "The heavy execution lease MUST remain held until process-group cleanup and bounded reader drain are complete, and MUST still release exactly once on every path."
    - "Add a deterministic focused regression in the existing TASK-0057 test area that forces/delays reader completion and fails if returned stdout/stderr are sampled before the drain finishes. Do not rely on timing luck."
    - "Preserve the shared hard x6 admission invariant, fail-fast seventh-request behavior, PTY lifetime accounting, capacity-observer advisory semantics, graceful active-exec cleanup ownership, six public MCP tool names, truthful tool annotations, output bounds, timeouts, workspace validation, and protected-runtime behavior."
    - "Run the focused regression, repository-native ./verify, applicable Swift tests, and git diff --check on the exact corrected candidate."
    - "Publish one corrective implementation commit followed by one report-only direct child with report_revision 2 to dev, non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - "agent_runtime/executor.py"
    - "tests/test_task0057_admission.py"
    - "other existing tests only if materially required to preserve a directly affected contract"
    - ".agent/tasks/TASK-0057/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "active terminal_exec roots + live terminal_start PTY roots <= 6 at every instant."
  - "The seventh and later concurrent heavy requests fail fast before spawn; Runtime adds no execution queue or automatic retry."
  - "terminal_exec returned stdout/stderr reflects the completed bounded drain lifecycle, not a pre-drain snapshot."
  - "The terminal_exec heavy lease is held through process-group cleanup and bounded output drain and released exactly once."
  - "No live Agent Runtime, tunnel, port 8080, runtime.env, desired state, ServiceManagement, launchd, installed app, or pending cutover state is mutated."
  - "No scheduler, worker pool, queue, tenancy layer, OS child resource-limit system, or new subsystem is introduced."

forbidden_changes:
  - "Do not redesign the accepted shared x6 admission model or split exec/PTY into independent heavy pools."
  - "Do not change the six-tool public MCP surface or falsify MCP annotations."
  - "Do not start, stop, restart, kill, signal, repair, reinstall, register, unregister, commit-cutover, rollback, or otherwise lifecycle-mutate the installed live Runtime/tunnel/port 8080."
  - "Do not mutate runtime.env, desired-state markers, ServiceManagement/launchd live state, System Settings, TCC, installed app bytes, or the current live cutover transaction."
  - "Do not fix the separate packaging-artifact overwrite defect in this task."
  - "Do not add dependencies, OS-level child resource limits, scheduler/queue/worker machinery, or unrelated cleanup/refactors."
  - "Do not modify architect-profile, agent-skills, agent-standards, agent-documents, main, tags, releases, or branch topology."

