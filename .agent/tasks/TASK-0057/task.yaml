acceptance_criteria:
  - id: AC-1
    requirement: "One hard process-local heavy admission boundary enforces terminal_exec + live terminal_start <= 6, with lower operator configuration still authoritative and no path above six."
    evidence_required: "Focused deterministic concurrency tests plus direct implementation inspection proving the shared accounting invariant."
  - id: AC-2
    requirement: "The seventh and later concurrent heavy requests fail immediately before process/PTY creation with one stable Runtime capacity error and no Runtime-side queue/retry."
    evidence_required: "Barrier-based overload tests instrument Popen/openpty/spawn calls and prove exactly six admitted roots with all excess requests rejected before spawn."
  - id: AC-3
    requirement: "terminal_start holds its heavy lease for the entire PTY lifetime and terminal_exec holds its lease through process-group cleanup/output drain; every terminal path releases exactly once."
    evidence_required: "Lifecycle matrix covering spawn failure, normal exit, timeout, terminate, idle reap, concurrent cleanup, and graceful shutdown, including double-release/leak detection."
  - id: AC-4
    requirement: "Persistent PTY capacity cannot exceed six and the prior effective default/unbounded-above 64 policy no longer permits >6 active PTYs."
    evidence_required: "Configuration/session tests for default, lower values, boundary six, and >6/malformed behavior plus source/docs inspection."
  - id: AC-5
    requirement: "capacity_observer remains advisory/read-only and its healthy recommendation may reach six without owning scheduling; degraded signals continue to reduce recommendations."
    evidence_required: "Capacity unit tests proving healthy x6 and degraded lower ceilings while the separate hard admission invariant remains authoritative."
  - id: AC-6
    requirement: "Read/observe/control operations remain usable while all six heavy slots are occupied and do not consume additional heavy permits."
    evidence_required: "Deterministic integration test holds six synthetic heavy workloads behind a barrier and completes capacity_observer, fs_read_batch, terminal_poll, and an applicable terminal_control action before releasing the heavy barrier."
  - id: AC-7
    requirement: "Graceful Runtime SIGTERM/SIGINT cleanup owns and cleans both active terminal_exec process groups and persistent PTY sessions without deadlock, leak, or double finalization."
    evidence_required: "Isolated Runtime subprocess tests; no signal is sent to the installed production Runtime."
  - id: AC-8
    requirement: "Repeated bounded x6 cycles do not accumulate active sessions, retained completed sessions beyond the existing bound, Runtime-owned worker threads, PTY FDs, or heavy permits."
    evidence_required: "Deterministic repeated-cycle resource-leak assertions with attributable before/after counts inside the isolated test process."
  - id: AC-9
    requirement: "Existing six-tool names, truthful tool annotations, timeout/output/workspace/protected-runtime contracts, and same-UID non-sandbox threat boundary remain intact."
    evidence_required: "Existing regression suite plus focused contract/source assertions and README consistency check."
  - id: AC-10
    requirement: "Installed/live Runtime infrastructure remains completely untouched during implementation and verification."
    evidence_required: "Execution report explicitly records no install/start/stop/restart/SMAppService/launchd/8080/runtime.env/live-cutover mutation and all load tests are isolated/test-owned."
  - id: AC-11
    requirement: "Repository-native full verification passes on the exact implementation candidate and the implementation diff contains no unrelated packaging, lifecycle, dependency, governance, or UX changes."
    evidence_required: "./verify plus applicable native/runtime focused tests, git diff --check, exact changed-path review, and final clean-tree proof."
  - id: AC-12
    requirement: "Implementation and report are published as one implementation commit followed by one report-only direct child on dev, non-force, with main unchanged."
    evidence_required: "Fresh remote ref and commit-lineage proof after publication."

verification:
