findings:
  - id: FINDING-1
    severity: BLOCKING
    criterion: AC-9
    location: agent_runtime/executor.py
    description: >-
      terminal_exec now builds its returned stdout/stderr dictionary before the
      bounded reader threads are joined in the finally block. In Python the return
      expression is evaluated before finally executes, so stdout_capture.text() and
      stderr_capture.text() can be sampled before the remaining pipe bytes are drained.
      This can return incomplete output even though the finally block later drains and
      releases the lease, regressing the pre-existing terminal_exec output contract.
    required_correction: >-
      Complete bounded reader-thread drain/close handling before materializing the
      returned stdout/stderr values, while preserving the x6 lease through that drain.
      Add a deterministic regression test that would fail if return payload capture is
      evaluated before the delayed reader finishes.

