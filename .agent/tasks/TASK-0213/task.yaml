    - "Replace the fake tunnel-client's sleep-quantized lifetime with a fixture-owned signal-responsive blocking mechanism. TERM/INT must trigger runtime.pid/lock cleanup promptly without relying on the completion of a one-second polling sleep."
    - "Keep the fake tunnel-client process identity, runtime.pid ownership, starts.log behavior, duplicate-start protection and TERM/INT cleanup semantics equivalent to the current fixture."
