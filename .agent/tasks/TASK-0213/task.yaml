proven_problem:
  component: tests/test_supervised_lifecycle.py
  fixture: fake tunnel-client and lifecycle teardown
  current_behavior: "The fixture fake tunnel-client owns runtime.pid cleanup from TERM/INT but remains alive through a Bash loop whose active iteration runs sleep 1. Repeated start/stop/tearDown cycles therefore accumulate scheduler-dependent shutdown latency."
  consequence: "The full 20-test module can remain logically green yet consume enough wall time on a slower hosted runner to exceed its explicit 45-second module deadline."
  boundary: "No evidence requires increasing the verifier timeout or changing start.sh product semantics."

objective: "Make the supervised-lifecycle fake Runtime lifetime and teardown signal-responsive and deterministic enough that the complete retained 20-test module has substantial headroom under its existing 45-second verifier deadline. Preserve every lifecycle assertion and production behavior."

