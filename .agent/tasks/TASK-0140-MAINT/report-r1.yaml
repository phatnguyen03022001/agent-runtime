finding:
  id: F-0140-001
  root_cause: >-
    Unexpected exceptions were only converted at _call_runtime_tool. Public tools
    such as fs_list bypass that helper, allowing the original exception message to
    reach the MCP SDK traceback logger.
  reproducer: tests/test_task0140_qualification.py

repair:
  production_path: agent_runtime/server.py
  description: >-
    _tool, the common Runtime-owned registration boundary for all public MCP tools,
    wraps every registered function with _sanitize_unexpected_tool_exception.
    ToolError, RuntimeValidationError, RuntimeStateError, ProtectedRuntimeDenied,
    and CapabilityFailure retain their existing behavior. Other Exception values
    become RuntimeError("unexpected runtime tool failure") with exception chaining
    suppressed.
  common_wrapper_proof: >-
    The qualification regression verifies the sanitizer marker through the timed
    wrapper for every one of the 19 registered public tools.
  secret_regression_proof:
    terminal_exec:
      delegate: execute_terminal
      sentinel_in_response: false
      sentinel_in_mcp_sdk_server_log: false
      generic_failure_observable: true
    fs_list:
      delegate: list_directory
      sentinel_in_response: false
      sentinel_in_mcp_sdk_server_log: false
      generic_failure_observable: true

