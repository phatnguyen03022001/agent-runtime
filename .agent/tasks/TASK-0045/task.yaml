acceptance_criteria:
  - id: AC-1
    requirement: "Candidate construction has one explicit canonical packaging interpreter contract: CPython 3.13.x, cp313 ABI, macOS, arm64; normal package/install selection is deterministic and no generic unrelated python3 can silently satisfy it."
    evidence_required: "Focused regression fixtures prove canonical interpreter selection/identity validation and conflicting PATH behavior; record the exact interpreter executable and full identity used for final package proof without turning its machine-specific absolute path into cross-machine authority."
  - id: AC-2
    requirement: "An unsupported implementation/version/ABI/platform/architecture fails with a precise diagnostic before any dependency download/install/build."
    evidence_required: "Deterministic negative fixtures exercise at least wrong Python minor/ABI and wrong platform/architecture identity and prove the pip/dependency-install command is never invoked."
  - id: AC-3
    requirement: "requirements.lock is a complete exact-version, SHA-256-authorized transitive runtime closure for the canonical packaging environment and every distribution selected by pip is authorized by that lock."
    evidence_required: "Create a fresh temporary venv with the canonical interpreter and run pip --require-hashes -r requirements.lock successfully; audit installed distributions plus selected/downloaded artifact filenames and SHA-256 values against the lock, including native/platform-sensitive distributions."
  - id: AC-4
    requirement: "The reproduced cffi mismatch is closed by the coherent canonical-environment lock rather than a one-package exception."
    evidence_required: "Regression/evidence records the pre-fix cffi locked hash 661c298b4821edebead0c91edd2b00374d67ad7c5a1f7a91d4442633b79d6a72, the cp313 macOS arm64 wheel hash 19ee6127ee34de7d83ce3d371ebc5ed91addbdcc39f9ab15ce4eb35a4e534971, and proves the corrected lock accepts the canonical selected artifact while the old mismatch would fail."
  - id: AC-5
    requirement: "Lock regeneration/audit has one small documented deterministic procedure bound to CPython 3.13/cp313/macOS/arm64 and does not introduce a new dependency-management subsystem."
    evidence_required: "Source/docs inspection plus one execution of the procedure or its audit half proves complete closure, exact versions, exact selected artifact hashes, and a successful fresh hash-required install."
  - id: AC-6
    requirement: "Immutable Git archive staging uses explicit safe tar extraction semantics supported by CPython 3.13 and preserves existing unsafe-entry rejection."
    evidence_required: "Focused tests prove an explicit extraction filter/API is passed, no extraction deprecation warning is emitted, safe exact-HEAD staging succeeds, and traversal, symlink/hardlink, and unsupported non-regular entries remain rejected."
  - id: AC-7
    requirement: "A clean exact implementation candidate builds one sealed non-installed Agent Runtime.app through the real normal package-construction path under the canonical interpreter."
    evidence_required: "Run the actual package-construction entry used by normal install from a clean exact candidate; package build passes with hash-required dependency installation and records source revision/tree plus corrected requirements.lock SHA-256. Stop before live cutover."
  - id: AC-8
    requirement: "The resulting non-installed candidate preserves TASK-0042 and TASK-0044 integrity/provenance contracts."
    evidence_required: "On the final sealed candidate prove strict deep codesign PASS, runtime-manifest exact closure PASS, external whole-app candidate closure PASS, expected source revision/tree PASS, corrected lock identity PASS, and no checkout/secret leakage."
  - id: AC-9
    requirement: "TASK-0045 does not mutate TASK-0044 cutover semantics or any live/public Runtime boundary."
    evidence_required: "Exact base-to-candidate diff audit confirms no unauthorized candidate_cutover/public MCP/protection/live config/tunnel/listener/port 8080/installed package/LaunchAgent/main/tag/release mutation; any unavoidable compatibility touch to TASK-0044 mechanics must be separately identified and proven minimal or execution stops BLOCKED."
  - id: AC-10
    requirement: "After bytes stabilize, affected package/provenance/interpreter/lock tests and the canonical verification required by repository/task convention pass on the exact implementation candidate."
    evidence_required: "Record targeted regression results during iteration, one broader affected package/provenance set after stabilization, canonical ./verify final result/run count where required by the stabilized task contract, exact candidate SHA/tree, and any invalidated rerun rationale."
  - id: AC-11
    requirement: "Published dev lineage contains one final TASK-0045 implementation candidate commit followed by one report-only commit, non-force, with main unchanged, then stops for Architect review."
    evidence_required: "Fresh remote refs before/after publication plus exact base -> implementation -> report lineage and report-only diff proof."

