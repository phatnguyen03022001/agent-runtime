structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "This is one bounded correction inside the existing package/install/provenance ownership boundary. No new service, framework, package manager, environment manager, container, registry, or source ownership layer is authorized."

objective: "Make Agent Runtime candidate construction use one explicit supported packaging interpreter identity and a complete hash lock valid for that identity, fail fast before dependency installation on unsupported interpreter/platform combinations, and make immutable Git archive extraction semantics explicit and stable across Python-version default changes while preserving TASK-0042 provenance/security and TASK-0044 cutover mechanics."

reproduced_failure:
  workflow_boundary: "Normal installation reached [4/8] Building package-owned Runtime payload and menu-bar app, then package construction failed during pip --require-hashes."
  package: "cffi==2.1.1"
  locked_sha256: "661c298b4821edebead0c91edd2b00374d67ad7c5a1f7a91d4442633b79d6a72"
  selected_artifact: "cffi-2.1.1-cp313-cp313-macosx_11_0_arm64.whl"
  selected_artifact_sha256: "19ee6127ee34de7d83ce3d371ebc5ed91addbdcc39f9ab15ce4eb35a4e534971"
  interpretation: "The checked-in lock authorizes a different distribution artifact than pip selected for the operator packaging interpreter. pip hash rejection is correct fail-closed behavior and is not evidence of PyPI tampering."
  second_signal: "The same packaging run emitted the Python 3.14 tarfile.extractall default-filter DeprecationWarning because immutable Git archive staging does not pass an explicit extraction filter."

root_cause: "The repository declares packaging compatibility as arbitrary first python3 from PATH with Python >= 3.11, but requirements.lock is a one-hash-per-distribution artifact set that is not proven valid across all supported CPython ABIs on macOS arm64. The executable-selection contract and lock-artifact contract therefore disagree. Immutable tar extraction also relies on a Python-version-dependent default rather than an explicit extraction policy."

packaging_interpreter_contract:
  implementation: CPython
  version: "3.13.x"
  abi: cp313
  operating_system: macOS
  architecture: arm64
  rationale: "The reproduced operator packaging environment selected the cp313 macOS arm64 cffi wheel. One explicit CPython 3.13/cp313 Darwin arm64 packaging contract is the smallest correction; broad Python >=3.11 multi-ABI support is not required."
  selection_requirements:
    - "Normal packaging/install candidate construction must resolve a versioned CPython 3.13 interpreter and validate implementation, major/minor version, cp313 ABI, Darwin, and arm64 before any pip dependency download/install/build action."
    - "Generic first python3 from PATH is not a sufficient packaging-interpreter contract and must not be used as a silent fallback for candidate construction."
    - "If the canonical packaging interpreter is unavailable or its identity does not match CPython 3.13/cp313/macOS/arm64, fail immediately with a precise unsupported-packaging-interpreter diagnostic before dependency installation."
    - "Do not mutate global Python installations, require system Python replacement, install a Python environment manager, or silently fall back across unrelated interpreters."
    - "The exact resolver/helper decomposition is Executor-local HOW, but conflicting-PATH tests must prove that an unrelated generic python3 cannot silently become the packaging interpreter."

scope:
  required_changes:
    - "Replace the current candidate-construction contract of command -v python3 plus Python >=3.11 with deterministic selection/validation of the canonical CPython 3.13/cp313/macOS/arm64 packaging interpreter. Apply the same contract wherever the normal install/package path installs requirements.lock for candidate construction or its prerequisite verification environment, so an existing incompatible checkout .venv cannot mask or reintroduce ABI drift."
    - "Regenerate or systematically correct requirements.lock for the complete transitive runtime dependency closure selected by the canonical packaging environment. Preserve exact versions and SHA-256 authorization and preserve pip --require-hashes. Do not patch only cffi; audit native/platform-sensitive packages including cffi, cryptography, pydantic_core, rpds-py and the rest of the closure."
    - "The checked-in lock must authorize every distribution artifact actually selected by pip for the canonical packaging environment. The final proof must map installed distributions to the exact locked version and selected artifact hash; unsupported ABI/platform artifacts must not be treated as implicitly supported merely because they share a package version."
    - "Define the smallest deterministic lock generation/audit procedure using the canonical interpreter and existing pip/standard tooling. The procedure must state the target identity CPython 3.13/cp313/macOS/arm64, resolve the complete closure from requirements.txt, capture exact versions, hash the exact selected artifacts, and verify the resulting lock through a fresh temporary venv install with pip --require-hashes. No dependency-management platform or generalized multi-platform lock system is authorized."
    - "Record the lock target identity in the smallest durable repository surface needed for maintainers to regenerate/audit it, and update package documentation only as required. requirements.txt remains the direct dependency declaration unless current evidence requires the smallest compatible correction."
    - "Make immutable git archive extraction explicit under the canonical interpreter by passing the standard-library safe data extraction filter or an equivalently explicit standard-library filter API supported by CPython 3.13. Preserve the existing pre-extraction rejection of absolute/traversal paths, symlinks, hardlinks, and unsupported non-regular entries. Do not weaken TASK-0042 source-staging security."
    - "Remove the existing regression assumption that export_head must work without the tarfile filter keyword. Replace it with tests that require explicit deterministic extraction semantics, emit no extraction deprecation warning under the canonical interpreter, and retain unsafe-entry rejection."
    - "Make the operator-supported normal candidate-construction boundary that exposed the defect pass from a clean exact candidate. Actual live activation is not required: the proof may run the same package-construction entry used by normal install, validate the resulting sealed non-installed candidate, and stop before live cutover."
    - "Preserve TASK-0042 immutable exact-HEAD staging, fresh package-owned venv, complete transitive dependency locking, pip --require-hashes, no checkout .venv packaging, runtime manifest closure, strict codesign verification, reconstructible provenance, and no-secret guarantees."
    - "Preserve TASK-0044 external post-sign candidate closure, prebuilt activation without rebuild/re-sign, pending transaction, explicit COMMIT/ROLLBACK, known-good rollback retention, and candidate-owned provenance semantics. Modify cutover code only if concrete regression evidence proves the smallest compatibility adjustment is required; otherwise leave it byte-identical."
  allowed_existing_files_or_components:
    - "requirements.txt and requirements.lock"
    - "macos/package_app.sh"
    - "macos/package_provenance.py"
    - "install.sh only where normal install must select/validate the canonical packaging interpreter or keep its prerequisite checkout verification environment ABI-compatible"
    - "tests/test_package_provenance.py, tests/test_surface_and_scripts.py, and narrowly focused package/interpreter/lock regressions"
    - "README.md only as required for the packaging interpreter and lock maintenance contract"
    - ".agent/tasks/TASK-0045/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "pip --require-hashes remains mandatory for package dependency installation; dependency integrity checking is never disabled or downgraded to version-only pinning."
  - "The supported candidate-construction environment is one explicit CPython 3.13/cp313/macOS/arm64 contract. TASK-0045 does not promise arbitrary Python >=3.11 ABI compatibility."
  - "Unsupported packaging interpreter/platform identity fails before dependency download/install/build, not after pip has partially resolved or fetched the runtime closure."
  - "requirements.lock closes over the complete transitive runtime dependency set for the canonical packaging environment, not only the observed cffi wheel."
  - "Tar extraction behavior is explicit and deterministic for the canonical interpreter; future Python default-filter changes cannot silently change immutable source staging semantics."
  - "TASK-0042 immutable exact-HEAD staging security, runtime manifest closure, strict codesign, reconstructible provenance, fresh package-owned venv, no checkout .venv packaging, and no-secret rules remain authoritative."
  - "TASK-0044 sealed-candidate identity, rebuild-free prebuilt activation, transactional pending cutover, COMMIT/ROLLBACK, and known-good rollback retention remain unchanged unless a concrete regression requires the smallest explicitly reported compatibility fix."
  - "Bit-for-bit reproducible builds are not claimed or required."
  - "No live Agent Runtime install, activation, reload, restart, stop, runtime.env mutation, tunnel/listener mutation, desired-state mutation, LaunchAgent mutation, main promotion, tag, or release occurs in TASK-0045."
  - "The downstream AGENT_RUNTIME_MAX_PARALLELISM checkout=4/canonical-live=2 freeze condition remains downstream and is not normalized here."

forbidden_changes:
  - "Do not weaken, remove, bypass, or conditionally disable pip --require-hashes."
  - "Do not solve the defect by appending only the observed cffi hash without proving the complete canonical-environment closure."
  - "Do not add broad hashes for every Python >=3.11 ABI/platform merely to retain an unsupported compatibility claim."
  - "Do not classify the observed hash rejection as PyPI tampering without separate evidence."
  - "Do not add containers, a Python version manager, dependency service, package/dependency-management platform, artifact registry, generalized multi-platform build matrix, reproducible-build framework, custom sandbox, or new daemon/service."
  - "Do not redesign TASK-0044 candidate/cutover mechanics, add a second transaction system, or rebuild/re-sign a sealed candidate during prebuilt activation."
  - "Do not change the six public MCP tools/schemas/semantics, Runtime protection model, fs_read_batch contract, capacity/timing behavior, tunnel identity, listener binding, or protected lifecycle semantics."
  - "Do not run install/cutover against the operator's live Agent Runtime, start/stop/restart/reload the live Runtime, mutate runtime.env, port 8080, live LaunchAgents, installed app, desired state, main, tags, releases, or repository topology."
  - "Do not create TASK-0046, TASK-0047, final freeze proof, final candidate freeze artifact, live active-generation proof, canonical-config proof, post-cleanup stability proof, main promotion, tag, or release in this task."
  - "Do not introduce disposable independent workspace architecture; ordinary temporary test/build directories remain allowed where existing package verification requires them."

