findings:
  - id: FINDING-1
    severity: BLOCKING
    criterion: AC-2
    location: macos/package_provenance.py::publish_candidate
    description: >-
      Publication checks final_root.exists() and then calls os.rename(staging_root, final_root).
      On Unix, renaming a directory onto an existing empty destination directory may silently
      replace that destination. Therefore another publisher or process can create the SHA
      destination between the final existence check and rename, and canonical publication can
      replace that destination instead of deterministically failing closed. The current test
      proves only a pre-existing sequential collision and does not exercise this TOCTOU race.
      This is weaker than TASK-0058's invariant that an existing candidate destination is never
      mutated and collision/reuse fails closed.
    required_correction: >-
      Make final publication an atomic no-replace operation on supported macOS semantics, or an
      equivalently race-safe mechanism that cannot replace an existing destination. Add a
      deterministic regression that injects/creates the destination after preflight but before
      publication and proves failure with all pre-existing destination bytes unchanged. Preserve
      the same-filesystem staged publication model and all other TASK-0058 contracts.

