structure_authority:
  status: RESOLVED
  source: "Existing package_provenance publication boundary and existing TASK-0058 tests."
  rationale: "Correction-only hardening. No new service, subsystem, daemon, database, queue, workspace, worktree, or repository is required."

objective: >-
  Close FINDING-1 only: make SHA-addressed candidate publication atomically no-replace on supported macOS semantics so a destination created after preflight but before publication cannot be replaced. Preserve every other accepted TASK-0058 revision-1 behavior.

scope:
  required_changes:
    - "Replace the vulnerable check-then-os.rename final publication step with an atomic no-replace publication mechanism appropriate for the supported macOS target, or an equivalently race-safe mechanism that cannot replace an already-existing destination."
    - "A candidate destination that appears at any point before the publication commit MUST cause deterministic failure without changing any byte or metadata inside that pre-existing destination."
    - "Preserve run-owned same-filesystem staging, SHA-addressed build/candidates/<candidate_sha256>/ identity, explicit candidate_app/candidate_handoff/candidate_sha256 result contract, exact freeze binding, provenance validation, explicit non-ad-hoc signing semantics, and downstream explicit-path compatibility."
    - "Add a deterministic regression that forces the collision to appear after ordinary preflight/existence checks but before the final publication primitive, then proves the operation fails and the pre-existing destination content remains byte-identical."
    - "Preserve existing sequential collision, two-candidate coexistence, partial-publication failure, TASK-0056 prospective-only truthfulness, TASK-0057 x6 behavior, and live-state non-mutation tests."
    - "Run focused TASK-0058 packaging/freeze/provenance tests, all directly affected packaging/cutover tests, ./verify, git diff --check, and relevant static checks. Swift/native tests remain required only if native source is materially changed."
    - "Publish one corrective implementation commit and one report-only direct child to dev, non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - "macos/package_provenance.py"
    - "macos/package_app.sh only if materially necessary for the atomic no-replace primitive"
    - "macos/freeze_candidate.py only if materially necessary"
    - "tests/test_package_provenance.py"
    - "tests/test_candidate_freeze.py"
    - "other existing TASK-0058-affected packaging tests only when directly required"
    - ".agent/tasks/TASK-0058/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "An existing final candidate destination is never replaced, deleted, merged into, truncated, or mutated by canonical publication, including under a race between preflight and final publication."
  - "Successful publication remains one dedicated immutable SHA-addressed app/handoff pair."
  - "Failed/raced publication leaves no new valid-looking partial final candidate owned by this invocation."
  - "All accepted TASK-0058 revision-1 behavior outside FINDING-1 remains unchanged."
  - "TASK-0056 historical bytes are not reconstructed or claimed restored."
  - "Installed Runtime, tunnel, port 8080, runtime.env, desired state, ServiceManagement/launchd state, live cutover transaction, System Settings, TCC, and installed app bytes remain untouched."

forbidden_changes:
  - "Do not perform a real freeze/signing run, enumerate signing identities, or access Keychain."
  - "Do not lifecycle-mutate Runtime, tunnel, launchd/ServiceManagement, port 8080, desired state, runtime.env, or installed app bytes."
  - "Do not redesign candidate identity, cutover state, x6 concurrency, MCP tools, transport, signing policy, or Runtime lifecycle."
  - "Do not add a registry service, database, daemon, scheduler, queue, worker framework, new repository, branch, worktree, workspace, or top-level subsystem."
  - "Do not mutate main, tags, releases, architect-profile, agent-skills, agent-standards, or agent-documents."

