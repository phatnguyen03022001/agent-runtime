structure_authority:
  status: RESOLVED
  source: "Existing macos packaging/freeze/provenance modules and existing candidate-freeze/package-provenance tests."
  rationale: "This is bounded hardening of an existing packaging boundary. No new service, subsystem, registry, database, branch, or workspace is needed."

objective: >-
  Eliminate the packaging artifact overwrite defect so every successfully frozen Agent Runtime candidate can remain byte-preserved and independently addressable. Canonical packaging/freeze must never silently delete, replace, or reuse an existing frozen candidate app or handoff. Build work may use run-owned temporary staging, but successful publication must produce a dedicated candidate output location and fail closed on collisions. Preserve source/provenance/signing semantics and do not touch the installed live Runtime.

scope:
  required_changes:
    - "Remove the canonical packaging dependency on one mutable singleton pair build/Agent Runtime.app + build/Agent Runtime.candidate.json. A successful candidate must be published to one dedicated output location containing its app and matching external handoff."
    - "The candidate output location MUST be explicit or deterministically derived from immutable candidate/source identity, and the exact resulting app/handoff paths MUST be surfaced by the freeze/package contract. Do not introduce a mutable latest/current alias as authoritative candidate identity."
    - "Packaging MUST construct candidate bytes in run-owned temporary staging first. Publication to the final candidate location occurs only after construction/signing/provenance sealing succeeds sufficiently to identify the intended artifact. A failed packaging run MUST NOT leave a partially published candidate that can be mistaken for a valid frozen artifact."
    - "Existing candidate output MUST be treated as immutable. Canonical package/freeze code MUST NOT rm -rf, rm -f, truncate, replace, merge into, or otherwise mutate an already-existing candidate app/handoff location. Collision/reuse must fail deterministically before mutation of the existing candidate."
    - "freeze_candidate.py MUST validate the exact app/handoff paths produced for the current invocation rather than assuming the old singleton paths. Its stdout/result contract must expose those exact paths plus candidate_sha256 without requiring consumers to infer them."
    - "Preserve the current exact-source revision/tree/requirements.lock checks, package provenance manifest/seal/validate semantics, explicit non-ad-hoc signing requirement, strict codesign validation behavior, responsible executable identity, and candidate SHA-256 semantics."
    - "Preserve compatibility of downstream candidate validation/cutover inputs by using explicit candidate app/handoff paths; do not redesign cutover state, ServiceManagement, signing policy, Runtime service identity, or live lifecycle behavior."
    - "Add deterministic isolated tests proving two separate successful synthetic/fake freeze outputs can coexist unchanged, a later freeze cannot overwrite an earlier candidate, an attempted destination collision fails without changing pre-existing bytes, and a packaging failure leaves no valid-looking partial publication."
    - "Add a regression proving historical accepted-candidate bytes cannot be reconstructed or claimed from overwritten singleton paths; documentation/tests must describe this fix as prospective preservation for new candidates, not restoration of TASK-0056 bytes."
    - "Run focused candidate-freeze/package-provenance tests, repository-native ./verify, applicable Swift/native tests only if directly affected, and git diff --check. No real candidate freeze/signing run is required for this source-only hardening task."
    - "Publish one implementation commit and one report-only direct child to dev, non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - "macos/package_app.sh"
    - "macos/freeze_candidate.py"
    - "macos/package_provenance.py only if materially necessary to preserve/validate the new explicit artifact paths"
    - "tests/test_candidate_freeze.py"
    - "tests/test_package_provenance.py"
    - "other existing packaging/cutover tests only when directly required by an affected contract"
    - "README.md only if the user-facing/internal packaging contract needs correction"
    - ".agent/tasks/TASK-0058/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "A previously published frozen candidate is never mutated by creating another candidate."
  - "Candidate app and external handoff remain one inseparable identity pair; validation never mixes artifacts from different freeze runs."
  - "No successful freeze relies on a mutable singleton candidate path as canonical identity."
  - "A collision with an existing final candidate location fails closed and preserves all existing bytes exactly."
  - "Failed/incomplete packaging does not publish a valid-looking final candidate location."
  - "TASK-0056 historical accepted hashes remain historical evidence only; this task must not recreate bytes and claim identity with the lost TASK-0056 artifact."
  - "TASK-0057 x6 source behavior remains unchanged."
  - "Installed Runtime, tunnel, port 8080, runtime.env, desired state, ServiceManagement/launchd state, live cutover transaction, System Settings, TCC, and installed app bytes remain untouched."

forbidden_changes:
  - "Do not invoke a real freeze/signing flow against the designated repository build outputs in this task. Use isolated/temp fixtures for behavioral proof."
  - "Do not discover/enumerate Keychain identities, run security find-identity, or select a signing identity."
  - "Do not delete, overwrite, clean, move, or repurpose any pre-existing local build candidate merely because it uses the old singleton path. Treat unknown/pre-existing artifacts as retained evidence/user state."
  - "Do not start, stop, restart, kill, signal, repair, reinstall, register, unregister, commit-cutover, rollback, or otherwise lifecycle-mutate the installed Runtime/tunnel/port 8080."
  - "Do not mutate runtime.env, desired-state markers, ServiceManagement/launchd live state, System Settings, TCC, installed app bytes, or current live cutover transaction."
  - "Do not change x6 concurrency semantics, six MCP tools, MCP annotations, execution admission, session behavior, or Runtime transport behavior."
  - "Do not add a candidate database, registry service, daemon, scheduler, queue, worker framework, global cache, new repository, worktree, workspace, or top-level subsystem."
  - "Do not modify architect-profile, agent-skills, agent-standards, agent-documents, main, tags, releases, or branch topology."

