acceptance_criteria:
  - id: AC-1
    requirement: "Canonical packaging/freeze no longer writes/deletes one mutable singleton candidate pair and instead returns exact dedicated app/handoff paths for each successful freeze."
    evidence_required: "Implementation inspection plus deterministic tests of the path/output contract."
  - id: AC-2
    requirement: "Existing frozen candidate bytes are mechanically protected from later packaging/freeze attempts; destination collision fails before existing bytes change."
    evidence_required: "Fixture creates candidate A, records byte hashes, attempts candidate B/collision, and proves candidate A app/handoff hashes remain exact."
  - id: AC-3
    requirement: "Failed packaging cannot leave a final candidate location that passes or appears eligible for canonical validation."
    evidence_required: "Injected failure before publication plus filesystem assertions showing no published candidate pair/partial merge at the intended final destination."
  - id: AC-4
    requirement: "freeze_candidate validates and reports the exact produced app/handoff pair and preserves source/tree/lock/provenance/signing contracts without mixing runs."
    evidence_required: "Focused freeze/provenance tests including two independent candidate outputs and mismatched-pair rejection where applicable."
  - id: AC-5
    requirement: "No task claims restoration/preservation of the already-overwritten TASK-0056 bytes; the fix is prospective and truthful."
    evidence_required: "Report and docs/tests explicitly state historical TASK-0056 bytes are not reconstructed."
  - id: AC-6
    requirement: "TASK-0057 x6 behavior and unrelated Runtime/live lifecycle surfaces remain unchanged."
    evidence_required: "Repository-native verification plus exact changed-path review and explicit live-mutation false evidence."
  - id: AC-7
    requirement: "Implementation and report publish as one implementation commit followed by one report-only direct child on dev, non-force, with main unchanged."
    evidence_required: "Fresh remote ref and exact commit-lineage proof after publication."

verification:
