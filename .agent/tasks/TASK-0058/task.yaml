    requirement: "Final candidate publication is atomically no-replace: a destination created after preflight but before the publication primitive causes failure and is not replaced or modified."
    evidence_required: "Deterministic race regression plus implementation inspection of the final publication primitive."
  - id: AC-2
    requirement: "Revision-1 candidate immutability, SHA-addressed explicit paths, freeze/provenance binding, partial-publication safety, historical TASK-0056 truthfulness, and downstream compatibility remain intact."
    evidence_required: "Focused affected suite and changed-path review."
  - id: AC-3
    requirement: "TASK-0057 x6 semantics and all live Runtime/lifecycle surfaces remain unchanged."
    evidence_required: "Repository-native verification and explicit preservation evidence."
  - id: AC-4
    requirement: "Corrective implementation and report publish as one implementation commit followed by one report-only direct child on dev, non-force, with main unchanged."
    evidence_required: "Fresh remote refs and exact lineage proof after publication."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "RED->GREEN deterministic TOCTOU collision test: inject/create final destination after preflight but before final publication; prove failure and exact preservation of pre-existing bytes."
      required: true
    - id: CHECK-2
      command_or_check: "Run tests.test_package_provenance, tests.test_candidate_freeze, and directly affected packaging/cutover tests."
      required: true
    - id: CHECK-3
      command_or_check: "Run ./verify, git diff --check, and relevant Python/shell static checks."
      required: true
    - id: CHECK-4
      command_or_check: "Fresh-prove implementation -> report-only direct-child lineage, non-force dev publication, clean designated local working copy, and unchanged main."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Architect review of exact report and implementation evidence."
    expected_signal: "No publication race can replace an existing candidate destination."

