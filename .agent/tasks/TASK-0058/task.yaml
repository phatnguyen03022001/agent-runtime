      required: true
    - id: CHECK-3
      command_or_check: "Run ./verify and git diff --check; run Swift/native tests only if changed code can materially affect them."
      required: true
    - id: CHECK-4
      command_or_check: "Fresh-prove implementation -> report-only direct-child lineage, non-force dev publication, clean designated local working copy, and unchanged main."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Architect review of exact report/candidate source evidence."
    expected_signal: "Future candidates are independently addressable and no existing candidate can be overwritten by canonical packaging/freeze."

