correction:
  finding: FINDING-1
  scope: "Atomic no-replace final candidate publication only; all accepted revision-1 behavior is preserved."
  root_cause: >-
    Revision 1 performed existence checks and then used os.rename for final same-filesystem
    directory publication. On macOS, rename can replace an existing empty destination directory,
    leaving a TOCTOU window in which a destination created after preflight could be replaced.
  platform_contract:
    api: "renamex_np"
    flag: RENAME_EXCL
    flag_value: "0x00000004"
    availability: "macOS 10.12+"
    collision_result: EEXIST
    source: "macOS SDK sys/stdio.h and renamex_np(2) semantics"
  implementation: >-
    package_provenance.py now performs the final staging-directory publication through
    renamex_np(source, destination, RENAME_EXCL), loaded from the process C library with ctypes.
    EEXIST is mapped to the existing deterministic candidate-output collision error; every other
    operating-system error fails closed. There is no fallback to replacement-capable os.rename.
  preserved_revision_1_contracts:
    - "Run-owned same-filesystem staging remains unchanged."
    - "Candidate identity remains build/candidates/<candidate_sha256>/."
    - "candidate_app, candidate_handoff, and candidate_sha256 output fields remain unchanged."
    - "freeze_candidate exact path/SHA/source/tree/lock binding remains unchanged."
    - "Candidate provenance, signing, validation, and downstream explicit-path cutover contracts remain unchanged."
    - "Historical TASK-0056 bytes remain historical evidence only and were not reconstructed or claimed restored."

