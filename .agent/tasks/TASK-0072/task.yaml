problem_statement:
  f01_control_finalization_race: >-
    TerminalSessionManager.control() performs running-state checks and then PTY FD operations / protected-input-buffer
    mutation without one serialization boundary shared with _cleanup_process(). Cleanup can terminate/finalize/close the
    PTY between the check and write/ioctl/kill operation. Concurrent write calls can also read the same
    protected_input_buffer snapshot and classify fragments independently before either updates that buffer.
  f02_idle_reaper_stale_activity_race: >-
    reap_idle_once() snapshots idle candidates using last_activity, releases the manager lock, then later cleans each
    candidate without atomically rechecking/claiming expiry against concurrent poll/control activity. A session can be
    refreshed after candidate selection yet still be reaped from the stale decision.

objective: >-
  Close exactly the two session concurrency races with the smallest per-session synchronization change. Make control
  operations and finalization linearizable with respect to PTY FD use and protected-input-buffer mutation, and give
  session activity refresh versus idle-reap claim one deterministic ordering point. Preserve all six public MCP tools,
  schemas, x6 admission semantics, output/cursor behavior and current lifecycle boundaries. Prove both defects with
  deterministic failing regressions before source mutation, make the minimum implementation pass, run canonical
  verification, publish a report-only child, and stop at Architect review.

scope:
  required_checks:
    - "Fresh-resolve GitHub dev, origin/dev and local HEAD; require exact TASK-0072 handoff base and a clean designated working tree before mutation."
    - "Read current agent_runtime/session.py, tests/test_terminal_session.py and tests/test_protected_runtime.py before editing; preserve existing public signatures and result shapes."
    - "TDD RED-1: add a deterministic concurrent-write regression proving two terminal_control write calls cannot both classify from the same protected_input_buffer snapshot. Use synthetic/mock protection identity and harmless fake PTY writes; never execute a real protected command or signal. On the pre-fix source, the test must fail for the race itself, not due to timing flakiness."
    - "TDD RED-2: add a deterministic control-vs-finalization regression using threading Event/Barrier coordination, not sleeps, that forces cleanup/finalization to contend with a write or resize. The required post-fix behavior is linearizable: the control operation either completes before finalization or observes the finalized/non-running state and performs no PTY FD operation after close."
    - "TDD RED-3: add a deterministic idle-reaper regression where a session is selected as stale, then poll/control refreshes activity before the reap claim. On the pre-fix source the stale candidate is incorrectly expired; post-fix it must remain live. Also retain/prove that a genuinely idle session is still reaped."
    - "Record the exact focused failing test names and their pre-fix failure signals in the report before implementation. If any proposed race cannot be reproduced deterministically, STOP and return ARCHITECT_REVIEW rather than changing synchronization speculatively."
    - "Implement one minimal per-session lifecycle/operation ordering mechanism (for example a per-session re-entrant lifecycle lock or an equivalently narrow primitive) shared by control operations and cleanup/finalization. Do not introduce global serialization."
    - "Serialize the entire terminal_control write sequence that must be atomic for correctness: protected_input_buffer snapshot -> guard classification -> running-state proof -> PTY write -> protected_input_buffer update -> activity touch. Concurrent writes must have a single visible order."
    - "Interrupt and resize must not act on a PTY/process after finalization has won the per-session lifecycle ordering. Explicit terminate must compose with the same ordering without self-deadlock."
    - "Make activity refresh and idle-reap claim share one ordering point. Immediately before idle cleanup, revalidate current last_activity under that ordering. A refresh that wins first prevents that reap; a reap claim that wins first may expire the session deterministically."
    - "Do not hold the per-session lifecycle serialization primitive across terminal_poll Condition.wait(wait_ms); a long poll (up to 1000 ms) must not block terminate/control/cleanup merely because it is waiting for output. Activity may be touched before and after the wait using bounded critical sections."
    - "Define and preserve an explicit lock ordering that cannot invert with session.changed / session.lock, manager._lock, cleanup/finalization synchronization, or reader/monitor threads. Add at least one deterministic concurrency regression that would hang on an inversion and complete under the corrected design with a bounded test timeout."
    - "Preserve heavy-execution lease ownership/release, active-session limit, idle TTL, retained completed-session bound, cursor semantics, PTY output bounds and Runtime shutdown cleanup."
    - "Run focused session/protected-runtime tests first, then affected admission/MCP contract tests, then canonical ./verify exactly once for handoff verification unless a failure requires a focused correction."
    - "Publish implementation changes on dev non-force, then publish only .agent/tasks/TASK-0072/report.yaml as the report-only direct child. Stop at ARCHITECT_REVIEW."

