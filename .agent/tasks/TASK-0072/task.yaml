acceptance_criteria:
  - id: AC-1
    requirement: "Concurrent terminal_control writes are linearized across guard classification, PTY write, protected-input-buffer update and activity refresh."
    evidence_required: "Deterministic pre-fix failing concurrent fragmented-write regression; post-fix PASS with one observable write order and no guard bypass caused by shared stale buffer state."
  - id: AC-2
    requirement: "Control operations cannot use a PTY FD/process after cleanup/finalization has won the per-session lifecycle ordering."
    evidence_required: "Deterministic control-vs-cleanup regression covering write or resize plus explicit terminate/finalization; no EBADF/reused-FD window, no deadlock, and linearizable result."
  - id: AC-3
    requirement: "Idle reaping cannot expire a session from a stale last_activity snapshot."
    evidence_required: "Deterministic candidate-selection/activity-refresh race regression proves refreshed session survives; genuinely idle session still expires under unchanged TTL semantics."
  - id: AC-4
    requirement: "The synchronization correction introduces no global serialization or behavioral regression."
    evidence_required: "Existing terminal session, protected Runtime, admission, MCP contract/conformance and cleanup tests PASS; long poll does not hold lifecycle ordering across wait; unrelated sessions remain independently operable."
  - id: AC-5
    requirement: "Canonical repository verification and publication are clean."
    evidence_required: "Canonical ./verify PASS, git diff --check PASS, implementation paths restricted to allowed source/tests, report-only direct child, non-force dev publication, clean tree, main unchanged."

