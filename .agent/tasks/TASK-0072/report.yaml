  synchronization:
    scope: per_session
    primitive: "existing cleanup_lock changed to threading.RLock"
    lock_order: "cleanup_lock -> session.lock/changed -> manager._lock"
    global_serialization_added: false
  f01_correction: >-
    terminal_control write now holds the per-session lifecycle lock across protected-input snapshot, guard
    classification, running-state proof, PTY write, protected-input update, activity refresh and result formation.
    Interrupt and resize use the same lifecycle ordering against finalization, and explicit terminate composes through
    the re-entrant lock without self-deadlock.
  f02_correction: >-
    Activity refresh uses the same per-session lifecycle lock as idle cleanup. Idle cleanup revalidates current
    last_activity while holding that lock immediately before termination; a refresh that wins first cancels the stale
    reap, while a genuinely idle session still follows the existing TTL cleanup path.
  poll_wait_boundary: >-
    poll touches activity before entering Condition.wait and, when it actually waited, again after leaving it. The
    lifecycle lock is never held across the Condition.wait interval.

