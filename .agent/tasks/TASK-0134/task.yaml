objective: >-
  Add a bounded native repository mutation chain:
  repo_stage stages exactly one complete explicit text-file candidate into an initially clean index;
  repo_commit commits only the exact staged state authorized by a repo_diff(staged) ReceiptV1.
  repo_commit must use Git plumbing and compare-and-swap branch ref update. Neither capability may
  use network, implicit git add, hooks, signing, push, fetch, shell, or arbitrary external helpers.
  Grow the public MCP surface from 16 to exactly 18 tools.

architecture:
  chain: >-
    fs_search/fs_patch/fs_write -> repo_stage -> repo_diff(staged receipt) -> repo_commit
    -> later repo_publish.
  invariants:
    - "repo_stage never uses git add or git add -A."
    - "repo_stage accepts the full commit candidate in one bounded explicit batch."
    - "repo_stage requires staged diff empty before mutation."
    - "repo_commit never stages."
    - "repo_commit requires exact expected HEAD and exact staged repo-diff receipt."
    - "repo_commit never pushes or fetches."
    - "Git branch mutation uses update-ref new old compare-and-swap."
    - "Only ordinary UTF-8 regular files/deletes/executable-bit changes are native v1."
    - "Binary files, symlinks, gitlinks/submodules, and special modes remain outside native v1."
    - "ToolContract Kernel v1 remains unchanged."
    - "One authorized repository writer remains an external governance invariant; do not build a scheduler or distributed lock here."

git_execution:
  executable: /usr/bin/git
  shell: false
  network: none
  environment:
    - "Construct a bounded explicit environment; do not blindly inherit GIT_* variables."
    - "GIT_LITERAL_PATHSPECS=1"
    - "GIT_OPTIONAL_LOCKS=0"
    - "GIT_TERMINAL_PROMPT=0"
    - "GIT_PAGER=cat"
    - "PAGER=cat"
    - "GIT_CONFIG_NOSYSTEM=1"
    - "Use fixed -c overrides for core.fsmonitor=false, core.pager=cat, color.ui=false, submodule.recurse=false, core.hooksPath=/dev/null, commit.gpgSign=false, gc.auto=0, maintenance.auto=false."
    - "LC_ALL=C and LANG=C."
  fixed_repo_preconditions:
    - "cwd is exactly repository root inside workspace"
    - "repository non-bare"
    - "attached HEAD"
    - "current branch equals requested branch"
    - "configured upstream equals origin/<branch>"
    - "current HEAD equals expected_head_sha"
    - "no merge/rebase/cherry-pick/bisect"
    - "no conflicts"

repo_stage:
  implementation_path: agent_runtime/repo_stage.py
  contract_constant: REPO_STAGE_CONTRACT
  tool_contract:
    tool_class: repo
    authority:
      workspace_bound: true
      network: none
      mutation: bounded
    annotations:
      read_only: false
      destructive: true
      idempotent: false
      open_world: false

  public_input:
    cwd: AbsoluteCwd
    branch:
      type: strict_string
      max_chars: 255
    expected_head_sha:
      type: lowercase_git_sha40
    items:
      min: 1
      max: 50
      item:
        path:
          type: strict_string
          max_chars: 4096
          semantics: normalized_repo_relative_descendant
        operation:
          enum:
            - present
            - delete
        expected_sha256:
          type: "lowercase_sha256|null"
          present: required
          delete: forbidden

  bounds:
    max_items: 50
    path_chars: 4096
    per_file_bytes: 1048576
    aggregate_present_bytes: 16777216
    metadata_output_bytes: 262144
    deadline_seconds: 5

  preconditions:
    - "All item paths are unique."
    - "No path is absolute, empty, dot, dot-dot, inside .git, or traverses a symlink."
    - "repo_diff(scope=staged) is exactly empty before staging."
    - "All non-ignored tracked worktree changes and non-ignored untracked files are exactly the selected item path set; no unselected candidate path may exist."
    - "For operation=present, target is current regular no-follow file, <=1 MiB, strict UTF-8, NUL-free, and exact raw SHA-256 equals expected_sha256."
    - "For operation=present, if HEAD already contains the path, HEAD mode must be ordinary regular 100644/100755 and HEAD blob must be <=1 MiB strict UTF-8 NUL-free."
    - "For operation=present with path absent from HEAD, path must be a non-ignored untracked file."
    - "For operation=delete, worktree path must be absent, HEAD must track the path as ordinary regular 100644/100755, and HEAD blob must be <=1 MiB strict UTF-8 NUL-free."
    - "Reject symlink/gitlink/submodule/special-mode baseline or candidate entries."

  mutation:
    - "Prevalidate every item completely before index mutation."
    - "Immediately before index mutation, recheck HEAD, branch, operation state, empty staged diff, candidate path set, present-file identity/content SHA, and delete absence."
    - "For each present item, write the exact raw bytes as a Git blob using fixed /usr/bin/git hash-object -w --stdin without path filters. Object writes may leave unreachable blobs if a later state guard fails; this is bounded acceptable Git object-store residue."
    - "Derive Git mode as 100755 when the regular worktree file has executable bits, otherwise 100644."
    - "For delete use index removal entry."
    - "Apply the entire candidate to the index through one fixed git update-index --index-info invocation with NUL-safe input; no git add."
    - "Git index locking is authoritative for the single invocation; do not implement a custom index transaction manager."
    - "HEAD must remain unchanged."

  postconditions:
    - "Staged path set equals exactly selected item path set."
    - "Compute staged state using the exact existing repo_diff(scope=staged) semantics."
    - "Returned staged_diff_receipt must be kind=repo-diff and identical to an immediate public repo_diff(staged) receipt over the same state."
    - "Report whether tracked worktree and non-ignored untracked state are clean after staging."
    - "Normal successful path requires post_stage_clean=true."
    - "If external state changes after the atomic index update, fail STATE_CHANGED / LOCAL_STATE_CHANGED rather than claiming a clean candidate. Do not attempt unsafe rollback over concurrent state."

  public_result:
    schema_version: 1
    fields:
      branch: string
      head_sha: git_sha40
      staged_paths:
        - path
        - operation
        - worktree_sha256
        - git_blob_sha
        - git_mode
      staged_diff_receipt:
        schema_version: 1
        kind: repo-diff
        digest: sha256
      post_stage_clean: true
      network_used: false

  failure_reasons:
    - INVALID_BRANCH
    - INVALID_ITEMS
    - INVALID_PATH
    - DUPLICATE_PATH
    - EXPECTED_SHA_REQUIRED
    - EXPECTED_SHA_FORBIDDEN
    - NOT_REPOSITORY_ROOT
    - BARE_REPOSITORY
    - DETACHED_HEAD
    - BRANCH_MISMATCH
    - UPSTREAM_MISMATCH
    - HEAD_MISMATCH
    - OPERATION_IN_PROGRESS
    - CONFLICTS_PRESENT
    - STAGED_CHANGES_PRESENT
    - UNSELECTED_CHANGES_PRESENT
    - TARGET_NOT_FOUND
    - TARGET_ALREADY_ABSENT
    - EXPECTED_SHA_MISMATCH
    - SYMLINK_DISALLOWED
    - NOT_REGULAR_FILE
    - INVALID_UTF8
    - BINARY_CONTENT
    - INPUT_FILE_LIMIT
    - AGGREGATE_FILE_LIMIT
    - UNSUPPORTED_GIT_MODE
    - IGNORED_PATH
    - LOCAL_STATE_CHANGED
    - GIT_UNAVAILABLE
    - INDEX_UPDATE_FAILED

repo_commit:
  implementation_path: agent_runtime/repo_commit.py
  contract_constant: REPO_COMMIT_CONTRACT
  tool_contract:
    tool_class: repo
    authority:
      workspace_bound: true
      network: none
      mutation: bounded
    annotations:
      read_only: false
      destructive: true
      idempotent: false
      open_world: false

  public_input:
    cwd: AbsoluteCwd
    branch:
      type: strict_string
      max_chars: 255
    expected_head_sha:
      type: lowercase_git_sha40
    expected_diff_receipt:
      closed_object:
        schema_version: 1
        kind: repo-diff
        digest: lowercase_sha256
    message:
      type: strict_utf8_string
      min_utf8_bytes: 1
      max_utf8_bytes: 16384
      nul: forbidden

  runtime_git_identity:
    source: process_environment
    variables:
      name: AGENT_RUNTIME_GIT_NAME
      email: AGENT_RUNTIME_GIT_EMAIL
    rules:
      - "Both must be present and non-empty."
      - "Each must be strict UTF-8, <=256 UTF-8 bytes, and contain no NUL, CR, or LF."
      - "Do not accept author/committer identity from MCP input."
      - "Do not silently fallback to repository/global Git user.name or user.email."
      - "Use the same validated identity as author and committer in v1."
      - "If unavailable or invalid, fail UNAVAILABLE / GIT_IDENTITY_UNAVAILABLE before commit object creation."

  bounds:
    message_utf8_bytes: 16384
    staged_paths: 50
    per_blob_bytes: 1048576
    aggregate_staged_blob_bytes: 16777216
    deadline_seconds: 5

  preconditions:
    - "All fixed repository preconditions above."
    - "Staged diff is non-empty."
    - "Current repo_diff(staged).diff_receipt equals expected_diff_receipt exactly."
    - "No tracked unstaged changes."
    - "No non-ignored untracked files."
    - "Every staged path is ordinary regular UTF-8 text add/modify/delete or executable-mode change."
    - "Reject symlink, gitlink/submodule, special modes, binary content, invalid UTF-8, NUL, >1MiB blob, >50 paths, or >16MiB aggregate staged blob content."
    - "No merge commit: exactly one parent, expected_head_sha."

  mutation:
    - "Capture tree_sha using fixed git write-tree."
    - "Immediately recheck expected staged receipt, HEAD, branch, clean worktree/untracked state, and require a second write-tree equals captured tree_sha."
    - "Create commit object with fixed git commit-tree <tree_sha> -p <expected_head_sha>, message supplied through stdin, validated Runtime identity via environment, no hooks and no signing."
    - "Commit object creation may leave an unreachable object if the final branch CAS fails; this bounded Git object-store residue is acceptable."
    - "Immediately before ref mutation recheck HEAD==expected_head_sha and write-tree==tree_sha."
    - "Update refs/heads/<branch> using fixed git update-ref <new_commit> <expected_head_sha>; expected old SHA is mandatory CAS."
    - "Never call git commit, git add, push, fetch, pull, merge, rebase, reset, checkout, stash, clean, or network transport."

  receipt:
    result_field: commit_receipt
    schema:
      schema_version: 1
      kind: repo-commit
      digest: lowercase_sha256
    make_receipt_v1:
      kind: repo-commit
      subject:
        - repository_root
        - branch
        - commit_sha
      semantic_parameters:
        - parent_sha
        - expected_diff_receipt_digest
        - sha256_of_exact_commit_message_bytes
      observed_state_bytes: "exact commit object content bytes returned by fixed local git cat-file commit <commit_sha>"
    rules:
      - "Do not change repo-diff ReceiptV1 semantics."
      - "Do not require repo_publish to consume commit_receipt; downstream publication identity remains Git commit SHA."

  postconditions:
    - "HEAD == commit_sha."
    - "Current branch unchanged."
    - "Index tree == commit tree."
    - "Tracked worktree clean."
    - "No non-ignored untracked files."
    - "No staged changes."
    - "network_used=false."

  public_result:
    schema_version: 1
    fields:
      branch: string
      parent_sha: git_sha40
      tree_sha: git_sha40
      commit_sha: git_sha40
      diff_receipt:
        schema_version: 1
        kind: repo-diff
        digest: sha256
      commit_receipt:
        schema_version: 1
        kind: repo-commit
        digest: sha256
      network_used: false
      post_commit_clean: true

  failure_reasons:
    - INVALID_BRANCH
    - INVALID_COMMIT_MESSAGE
    - INVALID_DIFF_RECEIPT
    - NOT_REPOSITORY_ROOT
    - BARE_REPOSITORY
    - DETACHED_HEAD
    - BRANCH_MISMATCH
    - UPSTREAM_MISMATCH
    - OPERATION_IN_PROGRESS
    - HEAD_MISMATCH
    - NO_STAGED_CHANGES
    - UNSTAGED_CHANGES_PRESENT
    - UNTRACKED_CHANGES_PRESENT
    - CONFLICTS_PRESENT
    - DIFF_RECEIPT_MISMATCH
    - UNSUPPORTED_STAGED_TYPE
    - BINARY_STAGED_CONTENT
    - INVALID_UTF8_STAGED_CONTENT
    - STAGED_PATH_LIMIT
    - STAGED_BYTES_LIMIT
    - GIT_IDENTITY_UNAVAILABLE
    - HEAD_CHANGED
    - INDEX_CHANGED
    - WORKTREE_CHANGED
    - GIT_UNAVAILABLE
    - TREE_CAPTURE_FAILED
    - COMMIT_OBJECT_FAILED
    - REF_UPDATE_FAILED
    - POST_COMMIT_STATE_INVALID

