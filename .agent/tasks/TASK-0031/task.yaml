structure_authority:
  status: RESOLVED
  source: "Per-user Application Support Runtime configuration authority."
  rationale: "Keep the accepted revision-1 authority model: installed execution reads only $HOME/Library/Application Support/Agent Runtime/runtime.env; the checkout .env is bootstrap/source input only."

objective: "Revise the accepted TASK-0031 source candidate so first-time canonical Runtime configuration publication is actually atomic and the canonical file persists the installer-derived workspace root, while preserving existing canonical configuration and leaving the live Runtime untouched."

canonical_runtime_config:
  path: "$HOME/Library/Application Support/Agent Runtime/runtime.env"
  requirements:
    - "Regular non-symlink file only."
    - "Mode 0600."
    - "Contains CONTROL_PLANE_API_KEY, CONTROL_PLANE_TUNNEL_ID, AGENT_RUNTIME_WORKSPACE_ROOT and optional AGENT_RUNTIME_MAX_ACTIVE_SESSIONS."
    - "Secrets are never logged, committed, embedded into the app bundle, or copied into task evidence."

scope:
  required_changes:
    - "Fresh-bind this exact revision-2 base and preserve the accepted revision-1 authority model, TASK-0029/TASK-0030 evidence, main, and the currently serving Runtime."
    - "Fix first-time runtime.env initialization so the final canonical path is never exposed with partially written/truncated content. Publication must be atomic at the final path, must not overwrite an already-existing canonical file, and must preserve a concurrently appearing valid canonical file rather than clobber it."
    - "Before first-time publication only, persist the installer-derived AGENT_RUNTIME_WORKSPACE_ROOT into the canonical runtime.env payload even if the checkout bootstrap input contains a blank, stale, or different workspace-root value."
    - "When canonical runtime.env already exists, validate and preserve its bytes unchanged; do not silently rewrite its workspace root from the checkout or installer-derived value."
    - "Add deterministic fixture coverage proving no partial canonical publication, interrupted/failed initialization cleanup, existing-file race/no-clobber behavior, first-bootstrap workspace-root persistence, blank/stale checkout workspace-root correction, and preservation of an existing canonical file."
    - "Retain revision-1 package/source behavior: no env-path.txt, no checkout credential pointer in the app bundle, installed execution derives canonical runtime.env, fail-closed symlink/mode/config validation, exact four MCP tools, protection boundary, singleton lifecycle and tunnel identity semantics."
    - "Run focused tests, ./verify, Swift tests, release build/package, package checkout-reference scan and strict codesign. Publish candidate/report non-force to dev and stop for Architect review."

invariants:
  - "Revision 2 remains source/package/test only: no ./install.sh activation and no Runtime start/stop/restart/reload/cutover."
  - "Do not create or modify the live canonical runtime.env under the operator's real Application Support directory."
  - "Do not mutate the existing checkout .env bytes, permissions or ownership."
  - "The live Runtime, tunnel, listener 127.0.0.1:8080 and currently installed app remain untouched."
  - "No Keychain use, privileged helper, daemon redesign, dedicated OS account, container, database, queue, new network service or new dependency."
  - "TASK-0029 and TASK-0030 task/report/review artifacts remain unchanged."
  - "No branch, worktree, clone, tag, release or main promotion."

forbidden_changes:
  - "No Runtime lifecycle action or installer activation."
  - "No tunnel/key/profile rotation or recreation."
  - "No weakening of Runtime ownership or protected-port semantics."
  - "No fallback from installed Runtime to checkout .env when canonical runtime.env is missing or invalid; installed execution must fail closed."
  - "No secret material in Git, logs, reports, tests, fixtures or app bundle."
  - "Do not broaden the revision beyond the two Architect review findings except for directly necessary tests/documentation."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "First-time canonical config publication is truly atomic and no-clobber."
    evidence_required: "Deterministic tests prove readers cannot observe a partially written final runtime.env, failed/interrupted initialization leaves no partial final authority, and an already/concurrently existing canonical file is preserved rather than overwritten."
  - id: AC-2
    requirement: "First bootstrap persists the installer-derived workspace root."
    evidence_required: "Fixture tests prove blank, stale, or different checkout AGENT_RUNTIME_WORKSPACE_ROOT input results in a first-time canonical runtime.env containing the derived workspace root while preserving credentials/session-limit semantics."
  - id: AC-3
    requirement: "Existing canonical authority remains authoritative."
    evidence_required: "Tests prove an existing valid mode-0600 runtime.env is byte-preserved and is not rewritten from checkout/bootstrap values."
  - id: AC-4
    requirement: "Revision-1 accepted Runtime contracts remain intact."
    evidence_required: "Package/source scans show no checkout config dependency; ./verify, exact four MCP tools, protected-runtime tests, Swift tests, release package and strict codesign remain green."
  - id: AC-5
    requirement: "Live infrastructure remains untouched."
    evidence_required: "Before/after read-only evidence shows the serving Runtime remains live/ready with no lifecycle/config mutation attributable to TASK-0031 revision 2."
  - id: AC-6
    requirement: "Publication is bounded and reconstructible."
    evidence_required: "Exact base/candidate/report lineage, non-force dev publication, unchanged main, clean canonical checkout and no auxiliary worktree/clone are proven."

