  - id: ATOMIC_CANONICAL_CONFIG_INITIALIZATION
    severity: material
    finding: "macos/runtime_config.py creates the final runtime.env path with O_CREAT|O_EXCL and then writes bytes directly into that visible final file. This does not satisfy the task requirement for atomic initialization: readers can observe a partially written file, and process/power failure can leave a truncated canonical authority that blocks later validation."
    required_change: "Initialize through a private temporary file in the canonical directory, validate/write/fsync/chmod it, then publish with an atomic no-clobber strategy that preserves an already-existing canonical file. Add deterministic coverage for interrupted/partial-publication avoidance and existing-file race preservation."
  - id: WORKSPACE_ROOT_BOOTSTRAP_PERSISTENCE
    severity: material
    finding: "install.sh derives AGENT_RUNTIME_WORKSPACE_ROOT and overrides it only in the in-memory validation map after runtime.env has already been initialized from checkout .env, so the canonical file may retain stale or blank workspace-root bytes."
    required_change: "Ensure first-time canonical initialization persists the derived workspace root while preserving existing canonical runtime.env unchanged on subsequent installs. Add deterministic fixture coverage for blank/stale checkout workspace-root input and existing canonical preservation."

