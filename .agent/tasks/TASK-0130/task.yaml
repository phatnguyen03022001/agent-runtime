  - new_pr
  - merge_pr
  - update_ref_main
  - direct_main_mutation
  - workflow_mutation
  - changes_outside_tests/test_candidate_cutover.py
  - Agent Runtime
  - Desktop Commander
  - Codex
  - local_shell
  - local_filesystem_mutation
  - workflow_rerun
  - package_install_restart_cutover

failure_policy:
  - "If update_file is platform-blocked before GitHub execution, stop PLATFORM_BLOCK; do not switch mutation surface."
  - "If branch or PR state differs, stop SOURCE_CLOSURE_FAILED."
  - "If CI fails, stop VERIFICATION_FAILED and preserve branch/PR intact; do not patch again."
  - "Never create additional remote debris as fallback."

terminal_states:
  success: NEEDS_REVIEW
  platform_block: PLATFORM_BLOCK
  source_closure_failed: SOURCE_CLOSURE_FAILED
  verification_failed: VERIFICATION_FAILED

reporting:
