protocol_version: 3

task_id: TASK-0130
task_revision: 2
state: APPROVED

target:
  repository: phatnguyen03022001/agent-runtime
  governance_branch: control
  source_branch: main

execution_surface:
  id: CHATGPT_GITHUB
  controller: CHATGPT
  transport: GITHUB
  model: GPT-5.6 Sol
  effort: HIGH

governance_identity:
  control: SELF_GOVERNANCE_HEAD
  rule: >-
    The immutable governance_head is supplied externally by the launch packet and used to resolve this task.
    The task must never literalize the SHA of its own containing commit.

revision_2_delta:
  predecessor_review: "f846ba4cc30683dee8d7ffee4abdb0f8e16edbcd"
  operator_bootstrap: "2678ce0d805f76e5a4de59d12ec405d919bbd056"
  preserved_candidate: "3bd8e7928dfe1f47831f5d4d94e137da13d7883f"
  reason: >-
    Revision 1 produced a correct atomic three-file candidate, but low-level main ref publication was
    blocked before GitHub execution. Revision 2 changes only publication architecture to ephemeral
    branch + PR + CI. The exact fixed file contents from the preserved candidate are transplanted
    onto the new main base that contains pull_request CI.

delivery_authority:
  source_base: "14e51a439b3ee2cd830b204169af7426cdce556b"
  source_expected_branch: main
  allowed_source_paths:
    - install.sh
    - tests/test_tunnel_identity.py
    - tests/test_terminal_session.py

preserved_fixed_blobs:
  install.sh: "57a42016d17c169780db4b5434de87aed4baf529"
  tests/test_tunnel_identity.py: "3a7713472be63f729e87d5ff3ecf119967acf9e8"
  tests/test_terminal_session.py: "528d41451b74d0598e8b0ac41f955776de5dd234"

source_base_tree: "8912531d7669cda0878d180a07b20b06f724bebd"

objective: >-
  Rebuild the already-reviewed TASK-0130 portability fixes on top of main@14e51a4,
  publish them only to one ephemeral GitHub branch, open one PR to main, and require the
  existing Agent Runtime Verify pull_request workflow to pass. Do not merge the PR in this Executor task.

preconditions:
  - "Resolve this task from the exact governance_head supplied by the operator."
  - "Require live control == supplied governance_head."
  - "Require main == 14e51a439b3ee2cd830b204169af7426cdce556b."
  - "Require dev == 0030238d4be37f8b6e37362bf81f31fc9459dace."
  - "Require repository delete_branch_on_merge == true."
  - "Require .github/workflows/verify.yml at source_base contains both push:main and pull_request:main."
  - "Require preserved candidate commit 3bd8e7928dfe1f47831f5d4d94e137da13d7883f is readable."
  - "Require the three preserved files at that commit match the pinned blob SHAs above."
  - "Require remote branch task-0130-r2 is absent."
  - "Do not inspect or mutate local checkout state."

candidate_rebuild:
  - "Fetch complete UTF-8 contents of the three preserved files from commit 3bd8e7928dfe1f47831f5d4d94e137da13d7883f."
  - "Create one tree based on source_base_tree with inline content for exactly the three allowed paths."
  - "Preserve existing source-base file modes, including install.sh executable mode."
  - "Create exactly one candidate commit whose sole parent is source_base."
  - "Compare source_base...candidate before branch creation."
  - "Require ahead_by=1, behind_by=0, merge-base=source_base, and exactly the three allowed changed paths."
  - "Require .github/workflows/verify.yml unchanged from source_base."
  - "Do not use create_blob or Contents API mutation."

ephemeral_branch:
  name: task-0130-r2
  rules:
    - "Create exactly one remote branch directly at the rebuilt candidate commit."
    - "Do not create any local branch or worktree."
    - "Do not advance main directly."
    - "If execution stops before merge, report branch existence explicitly for Architect cleanup."

pull_request:
  base: main
  head: task-0130-r2
  draft: false
  title: "fix: make canonical verification portable on clean macOS"
  rules:
    - "Create exactly one PR."
    - "PR body must state TASK-0130 scope, source base, and the three changed paths."
    - "Do not request reviewers automatically."
    - "Do not merge in the Executor task."

verification:
  - "Observe the Agent Runtime Verify workflow triggered by this PR."
  - "Require event=pull_request and association with task-0130-r2 / the created PR."
  - "Require job canonical-verify."
  - "Wait for that exact run to complete."
  - "Require workflow conclusion=success and job conclusion=success."
  - "Fetch final job logs and capture canonical test count."
  - "Require zero failures and at least the 454-test baseline."
  - "Prove the prior six PINNED_ARGS failures and one idle-reaper timing failure are absent."
  - "Do not rerun a failed workflow."
  - "If CI fails, return VERIFICATION_FAILED and leave PR/branch intact; do not patch again."

architect_merge_boundary:
  executor_merge_authority: false
  required_terminal: NEEDS_REVIEW
  architect_expected_merge:
    method: rebase
    expected_head_sha: rebuilt_candidate_commit
  post_merge_expectation:
    - "main advances through GitHub PR merge semantics."
    - "push-to-main Agent Runtime Verify runs on final main."
    - "task-0130-r2 auto-deletes because repository delete_branch_on_merge=true."
    - "Architect verifies final main CI before ACCEPTED."

forbidden:
  - update_ref_main
  - direct_main_publication
  - Agent Runtime
  - Desktop Commander
  - Codex
  - local shell or local source mutation
  - create_blob
  - Contents API source mutation
  - workflow mutation
  - source paths outside allowed_source_paths
  - control mutation from Executor
  - dev mutation
  - force push
  - second branch
  - second PR
  - PR merge by Executor
  - workflow rerun
  - package/install/restart/cutover

failure_policy:
  - "If create_tree/create_commit is platform-blocked, stop PLATFORM_BLOCK."
  - "If create_branch is platform-blocked before GitHub execution, stop PLATFORM_BLOCK; do not substitute update_ref."
  - "If PR creation is platform-blocked, stop PLATFORM_BLOCK and report whether the branch exists."
  - "If main moves after preflight and before PR creation, stop SOURCE_CLOSURE_FAILED; do not rebuild automatically."
  - "If CI fails, stop VERIFICATION_FAILED; no retry."
  - "Never change safety surface solely to obtain a different platform judgment."

terminal_states:
  success: NEEDS_REVIEW
  platform_block: PLATFORM_BLOCK
  source_closure_failed: SOURCE_CLOSURE_FAILED
  verification_failed: VERIFICATION_FAILED
  publication_failed: PUBLICATION_FAILED

reporting:
  - "Return one bounded Vietnamese result packet."
  - "Include governance_head, source_base, rebuilt candidate tree/commit, exact changed paths, ephemeral branch creation, PR number/URL, PR workflow run/job IDs, test count/result, current main/control/dev refs, and whether task-0130-r2 exists."
  - "Do not create report/review files; Architect persists governance evidence on control."

successor:
  architect_action: "Independent review, merge with expected_head_sha, verify push-main CI, confirm branch auto-deletion, then ACCEPT or REWORK."
  if_accepted_next_task: TASK-0131
  next_intent: "ToolContract Kernel v1 via GitHub-native ephemeral-PR delivery."

execution_ready: true
