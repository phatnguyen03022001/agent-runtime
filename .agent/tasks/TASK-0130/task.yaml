  path: tests/test_candidate_cutover.py
  test: test_prebuilt_install_contract_keeps_strict_form_and_requires_exact_pinned_pair
  requirements:
    - "Preserve assertions for strict 3-argument and 7-argument forms."
    - "Preserve assertions validating $4 == --expected-candidate-sha256 and $6 == --expected-handoff-sha256."
    - "Preserve is_lower_sha256 validation assertions for $5 and $7."
    - "Remove the stale assertion requiring the literal implementation detail \"\${PINNED_ARGS[@]}\"."
    - "Add assertions proving the explicit invocation forwards --expected-candidate-sha256 \"$5\" and --expected-handoff-sha256 \"$7\"."
    - "Assert PINNED_ARGS does not appear in the --install-prebuilt branch."
    - "Preserve assertions forbidding --skip-trust and --no-verify."
    - "Do not weaken the test to merely search generic flag names already present in input parsing; bind the assertions to the explicit forwarding values $5 and $7."

authoring:
  method: GITHUB_CONTENTS_UPDATE_ON_EPHEMERAL_BRANCH
  rules:
    - "Fetch the complete current test file from task-0130-r2."
    - "Construct exactly one complete replacement with only the required test assertion update."
    - "Use update_file on branch task-0130-r2 with exact expected content blob SHA."
    - "Commit message: test: align prebuilt install contract with portable argv forwarding"
    - "Do not mutate main directly."
    - "Do not use update_ref, create_blob, create_tree, local tools, Agent Runtime, Desktop Commander, or Codex."

post_authoring_proof:
  - "Require task-0130-r2 advances by exactly one commit from 586c22af8a3d2c9a18294103045fe80ac0023b02."
  - "Require PR #1 remains open and now reports four changed paths total."
  - "Require the original three portability-fix blobs remain unchanged."
  - "Require the only newly changed path relative to revision-2 head is tests/test_candidate_cutover.py."
  - "Require .github/workflows/verify.yml remains unchanged."

verification:
  - "Observe the new Agent Runtime Verify pull_request run caused by the branch update."
  - "Require exact PR #1 association, event=pull_request, job=canonical-verify."
  - "Do not rerun any prior failed run."
  - "Wait for the new exact run to complete."
  - "Require workflow conclusion=success and job conclusion=success."
  - "Fetch final job logs."
  - "Require canonical test count >=454 and failures=0."
  - "Confirm the stale candidate-cutover test now passes."
  - "Confirm the six tunnel/install portability failures remain absent."
  - "Confirm the idle-reaper timing test remains passing."

