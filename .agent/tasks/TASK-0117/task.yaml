    path: macos/candidate_cutover.py
    requirements:
      - "Keep strict validation as the default when no pinned identities are supplied."
      - "Allow cutover to receive optional expected candidate SHA-256 and expected handoff SHA-256 only as a pair; one without the other must fail before product mutation."
      - "When both are supplied, use the pinned validator for every candidate validation checkpoint owned by that cutover transaction, including pre-swap, post-swap, resume, and commit validation."
