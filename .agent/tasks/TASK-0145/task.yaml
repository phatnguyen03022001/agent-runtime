acceptance_criteria:
  - id: AC-1
    requirement: "One internal lifecycle owns PTY and pipe execution; the legacy independent terminal_exec process engine is gone."
    evidence_required: "Source inspection plus focused process-ownership tests across both backends."
  - id: AC-2
    requirement: "Keyed pipe start and keyed terminal_exec never double-dispatch within the retained Runtime incarnation; conflicts fail before effect."
    evidence_required: "Deterministic concurrent same/different-spec, lost-ACK, fast-completion, and reserve-before-Popen tests."
  - id: AC-3
    requirement: "The public terminal contracts evolve exactly as authorized, retain PTY compatibility, and preserve separate pipe streams and terminal_exec stdout/stderr semantics."
    evidence_required: "Schema/export/MCP conformance plus byte-bound, stream, UTF-8, cursor-expiry, and PTY regression tests."
  - id: AC-4
    requirement: "Timeout, cancellation, descendant cleanup, shutdown, hard wall, completion retention, admission limits, process-end timing, and lease release remain bounded and truthful under races."
    evidence_required: "Barrier/fake-clock/fake-subprocess tests and representative real subprocess/process-group tests; no multi-second sleep as the sole oracle."
  - id: AC-5
    requirement: "Pre-effect vs post-effect/unknown failures follow TASK-0144 effect semantics and cannot authorize blind retry; key eviction/restart limitations are explicit."
    evidence_required: "Fault-injection tests at dispatch/reader/cleanup boundaries plus source-facing recovery documentation."
  - id: AC-6
    requirement: "Exact source candidate passes focused tests and canonical ./verify; non-force publication and report-only child are remotely proven. Installed Runtime remains unchanged."
    evidence_required: "Candidate SHA/tree, focused results, structured full verifier completion, fresh remote identity, report, and source/live provenance."

