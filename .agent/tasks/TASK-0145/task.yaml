structure_authority:
  status: RESOLVED
  source: "Operator handoff and accepted TASK-0144 review"
  rationale: "GAP-01 and GAP-02 are one coherent outcome: one process lifecycle with PTY and pipe I/O. Splitting them would temporarily create a third lifecycle."

live_runtime_authority:
  installed_version: "0.2.2"
  installed_revision: "90a87fca8755ddc673e749bb5bf3e4489045a9b8"
  installed_kernel: 1
  source_kernel: 2
  rule: "Source development only. No build, install, restart, plugin reload, or cutover."

objective: "Close GAP-01 and GAP-02 by making keyed PTY sessions, keyed pipe sessions, and terminal_exec use one recoverable in-process execution lifecycle, while preserving accepted process safety and installed Runtime 0.2.2 unchanged."

scope:
  required_changes:
    - "Converge launch, admission, process ownership, I/O readers, hard wall, timeout, termination, reaping, retention, timing, and lease release in one internal lifecycle core with PTY and pipe backends. Remove the independent terminal_exec process registry/engine."
    - "terminal_start request v3 accepts mode=pty|pipe, default pty. Existing PTY calls and merged-output behavior remain compatible. Pipe mode requires caller-provided start_identity, closes stdin, and keeps stdout and stderr separately identifiable."
    - "terminal_exec request v2 requires caller-provided start_identity and remains a bounded synchronous facade over the same pipe core. Its result v2 keeps existing cwd/argv/exit_code/timed_out/stdout/stderr/truncation meanings and adds start_identity plus session_id."
    - "Use one identity namespace. Bind start_identity before Popen to an exact validated specification including canonical cwd, argv, mode, entry surface, and normalized timeout when applicable. Same identity/specification reuses one operation; any mismatch fails before a new effect."
    - "A duplicate terminal_exec call while the first operation is running joins the original bounded wait and never resets its deadline or launches again. Callers may observe/reconcile via terminal_poll(start_identity). After terminal completion, a same-spec call returns the retained original result."
    - "terminal_start and terminal_poll result v3 identify mode. For pipe, output is an empty compatibility field and output_chunks contains ordered {stream: stdout|stderr, text: string} entries under the existing single raw-byte cursor. For PTY, output retains merged PTY text and output_chunks is omitted. Existing next_cursor/cursor_expired/dropped_output_bytes meanings and 16 KiB poll bound remain."
    - "terminal_control permits interrupt/terminate for running pipe sessions but rejects pipe write before effect; terminal_resize remains PTY-only. Existing PTY controls remain unchanged."
    - "Represent pre-effect capacity/validation/start failure as absent; post-Popen ambiguous failure as unknown with reconciliation_required=true, using TASK-0144 typed errors and the keyed pollable lifecycle state. A lost response never becomes retry permission merely because the caller did not see it."
    - "Keep process-local key retention bounded by the existing completed-session age/count rules. Document that an unknown key after eviction or Runtime restart cannot prove absence and requires external consequence reconciliation before any repeated mutation."
    - "Update source contract/schema projections, focused tests, and source-facing documentation for the new contracts. Keep installed-product instructions truthful until Cutover A."
    - "Commit a coherent candidate after focused PASS, run canonical ./verify on the exact candidate through a recoverable carrier, publish non-force after fresh remote reconciliation, then publish report-r1 as a report-only child and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "agent_runtime execution/session/server/contracts/capability/schema/timing components and a small internal transport module only if needed"
    - "directly affected focused tests and contract/schema projections"
    - "README.md, docs/AGENT.md, docs/OPERATIONS.md, docs/RECOVERY.md only where source/live truth or recovery procedure needs correction"
    - ".agent/tasks/TASK-0145 task/report artifacts"

invariants:
  - "No new public tool; advertised inventory remains 19 and ToolContract Kernel remains 2 in source."
  - "Literal argv with shell=false, workspace cwd check, protected-command guard, minimal child environment, and host-authority limits remain intact on both backends."
  - "A caller-known key is reserved before process dispatch. No duplicate process effect for the same retained key/specification, including concurrent callers and lost ACK."
  - "One process group has one owner, one terminalization, one attributable process-end event, and exactly one admission-lease release across exit, timeout, control, start failure, shutdown, and race paths."
  - "A leader exit does not leave an uncontrolled descendant group or pipe reader; cleanup and output draining are bounded and truthful."
  - "Existing configured session ceiling 1..6, running hard wall 3600s, completed retention 3600s/16 results, retained session output 64 KiB, poll output 16 KiB, terminal_exec timeout 1..3600s with default 300s, and 30s terminal_poll max wait remain unchanged."
  - "terminal_exec keeps separate bounded stdout/stderr and their truncation flags. PTY output remains merged and may have terminal-specific echo/newline behavior."
  - "No claim of recovery across Runtime restart or after key eviction. No blind mutation retry after an unknown outcome."
  - "Public success and failure contracts outside the terminal tool family remain unchanged."
  - "No source mutation concurrently with authoritative long verification."

forbidden_changes:
  - "GAP-03 and GAP-05 through GAP-13 implementation"
  - "terminal_poll output=none|incremental or caller max_output_bytes (TASK-0146)"
  - "new daemon, database, scheduler, persistent process registry, MCP Tasks integration, or cross-restart ownership"
  - "live Runtime package/install/service/plugin/configuration or macOS permission changes"
  - "new branch, PR, force push, amend, squash, or blind publication retry"

