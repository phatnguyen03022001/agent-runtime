structure_authority:
  status: RESOLVED
  source: "existing executor/session shared cwd guard, current four-tool MCP surface, and operator Mac capability evidence"
  rationale: >-
    The current executor validates only cwd and explicitly permits child commands to access other host paths. The smallest
    architecture that preserves arbitrary literal argv and shell workflows while enforcing the requested boundary is one
    shared per-invocation OS-level confinement wrapper used by terminal_exec and terminal_start. On the current operator Mac,
    /usr/bin/sandbox-exec exists; because sandbox-exec/SBPL is deprecated/private Apple surface, this task treats it as a
    current-machine internal mechanism only, requires adversarial proof, and fails closed if it is unavailable, aborts, or
    cannot satisfy the contract. No argv/path-string filtering or insecure fallback is permitted.

objective: >-
  Replace Agent Runtime's cwd-only guard with real per-repository filesystem confinement for every spawned one-shot or PTY
  command and all descendants. A call whose cwd is /Users/tienphat/Developer/<repo>/... derives exactly that first-level
  repository directory as its execution root; user/project filesystem reads and writes outside that root must be denied by
  the OS sandbox even for bash/zsh/Python/Node/nested children, while a minimal explicit read-only system/toolchain support
  surface and the existing network behavior may remain available. Preserve the four-tool MCP API and fail closed rather than
  weakening confinement for compatibility.

scope:
  required_changes:
    - >-
      Add one small shared confinement module used by both terminal_exec and terminal_start. Derive execution_root from the
      first realpath component below AGENT_RUNTIME_WORKSPACE_ROOT; reject cwd equal to the workspace root, paths outside it,
      symlink escapes, missing/non-directory roots, and any ambiguous root identity.
    - >-
      Wrap the actual child process with /usr/bin/sandbox-exec using a deny-by-default dynamically parameterized profile.
      The profile may grant read-write access only to execution_root for user/project data. Non-repository filesystem grants
      must be an explicit minimal read-only system/toolchain allowlist required to execute macOS binaries/interpreters and
      perform current network behavior; do not grant blanket /Users, /private, /Applications, /Library, or HOME access.
    - >-
      Ensure confinement is inherited by nested shells, subprocesses, grandchildren, and persistent PTY sessions. shell=False
      remains the host launch rule; callers may still deliberately execute bash/zsh with -c/-lc inside the sandbox.
    - >-
      Give children a repository-local private HOME and TMPDIR below <execution_root>/.agent-runtime/, with containment,
      symlink/type, and 0700 guards. Add only the ignore rule required for this owned runtime-local directory. Do not expose
      the operator's real HOME through child environment variables as an accessible filesystem capability.
    - >-
      Preserve network semantics as currently open-world, but do not add Keychain/securityd/home-config access merely to make
      authenticated Git work. Prove git status and unauthenticated Git/network behavior where available. Also run git push
      --dry-run against the bound repository as a compatibility gate: if it cannot work without broadening filesystem or
      credential access, stop BLOCKED and report the exact compatibility gap for separate Architect treatment.
    - >-
      Update README security semantics so it no longer states that executable arguments can access arbitrary host paths.
      Document precisely: repository user-data confinement, read-only system/toolchain exceptions, unchanged network scope,
      current macOS sandbox-exec dependency/fail-closed behavior, and no claim of container/VM isolation or cross-version
      sandbox-exec support.
    - >-
      Follow TDD strictly: add focused causal RED tests first and observe them fail on the exact base because sibling/outside
      access currently succeeds; implement the smallest shared confinement; observe focused GREEN; then run the full suite.
    - >-
      Publish one exact implementation candidate on dev and one report-only child. Main remains unchanged. This task does not
      activate the candidate ecosystem-wide; promotion and architect-profile lock activation require later accepted authority.
  allowed_existing_files_or_components:
    - "agent_runtime/executor.py"
    - "agent_runtime/session.py"
    - "agent_runtime/server.py"
    - "agent_runtime/confinement.py"
    - "tests/test_terminal_exec.py"
    - "tests/test_terminal_session.py"
    - "tests/test_surface_and_scripts.py"
    - ".gitignore"
