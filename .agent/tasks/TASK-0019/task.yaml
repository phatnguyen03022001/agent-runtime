    - ".agent/tasks/TASK-0019/report.yaml"

invariants:
  - "Public MCP tool names and signatures remain exactly terminal_exec, terminal_start, terminal_poll, terminal_control."
  - "Tool annotations remain truthful: exec/start/control are mutating/destructive/open-world as applicable; poll remains non-mutating in effect."
  - "For cwd /Users/tienphat/Developer/<repo>/..., user/project filesystem read-write authority is exactly /Users/tienphat/Developer/<repo> after realpath resolution."
  - "Sibling repositories, the operator home outside the exact repo, Desktop/Documents/Downloads/Pictures/Movies/Music/Photos-library paths, arbitrary /Users paths, and synthetic outside sentinels are not readable or writable by sandboxed descendants."
  - "A symlink inside the repo pointing outside the repo does not expand access."
  - "The system/toolchain exception surface is read-only, explicit, code-reviewed, and contains no blanket user-data subtree."
  - "No argv parser, shell parser, command allowlist, regex denylist, path-token scan, or cooperative-only convention is accepted as filesystem confinement."
  - "No sandbox-exec failure, absence, unsupported behavior, profile compilation failure, child abort, or ambiguous postcondition falls back to unsandboxed execution."
  - "Network policy is not expanded or redesigned by this task."
  - "No secret values, real home file contents, Keychain values, Photos/media contents, SSH keys, or unrelated repository contents are read or printed during verification."
  - "Main remains c49d777efa09db7f6c51bd8d8616db4623499fb8 and topology remains exactly {dev, main}."

forbidden_changes:
  - "Do not implement confinement by inspecting or filtering argv/path strings alone."
  - "Do not add Docker/OrbStack containers, VMs, App Sandbox/Xcode app bundles, Endpoint Security extensions, launch daemons, privileged helpers, root/sudo requirements, or new services in this task."
  - "Do not allow blanket read access to /Users/tienphat, HOME, sibling repositories, /private, /Applications, or /Library."
  - "Do not add Keychain/securityd access, credential export, token files, SSH-key access, or secret forwarding to rescue Git authentication."
  - "Do not change bare ./verify interpreter semantics in this task; the known hermeticity defect remains the next separate item. Use PYTHON=.venv/bin/python ./verify for this task's full gate."
  - "Do not change dependencies, MCP tool signatures, timing protocol, session limits/TTL, output bounds, timeout/process-group cleanup, tunnel profile architecture, install/start lifecycle, repository settings, tags, releases, or main."

