      required: true
    - id: CHECK-3
      command_or_check: >-
        Implement the smallest shared confinement module and integration in terminal_exec/terminal_start, then run focused GREEN
        adversarial tests for direct/shell/nested/grandchild/PTY/symlink cases, sandbox failure paths, repo-local HOME/TMPDIR,
        and public surface preservation.
      required: true
    - id: CHECK-4
      command_or_check: >-
        On the operator Mac, run bounded sandbox compatibility smoke without sensitive file contents: repo read/write, bash -lc,
        git status, .venv Python, ordinary remote read, and git push --dry-run. Any need to broaden user-data/credential access is
        a BLOCKED gap, not auto-fix authority.
      required: true
    - id: CHECK-5
