acceptance_criteria:
  - id: AC-1
    requirement: >-
      Causal RED proves the exact base is cwd-guard-only: focused tests using synthetic test-owned sibling/outside sentinels
      demonstrate that a child or nested shell can currently read/write outside the derived repository root while cwd itself
      remains admitted. No sensitive real user file is used as the sentinel.
    evidence_required: "Exact failing focused tests on the base with expected outside-access symptom and no unrelated error."
  - id: AC-2
    requirement: >-
      terminal_exec and terminal_start share one OS-enforced per-repository confinement implementation; direct, shell-nested,
      Python-nested, subprocess/grandchild, PTY, and symlink-escape attempts cannot read or write synthetic sibling/outside
      sentinels, while normal repo-local read/write remains functional.
    evidence_required: "Focused GREEN adversarial suite covering one-shot and PTY descendants plus symlink escape."
  - id: AC-3
    requirement: >-
      The sandbox profile is deny-by-default, has only exact repo read-write plus minimal enumerated read-only system/toolchain
      support, has no blanket user-data grants, and fails closed on sandbox-exec absence/abort/profile error. Repo-local HOME/TMPDIR
      are contained, non-symlink private directories and no real HOME filesystem access is required.
    evidence_required: "Source inspection, profile/allowlist assertions, failure-path tests, directory mode/type/containment tests."
  - id: AC-4
    requirement: >-
      Current intended developer workflows still work inside confinement: bash -lc with repo-local commands, git status, the
      repository .venv Python, focused/full tests, and network behavior needed for ordinary remote reads. Authenticated
      git push --dry-run must also pass without broad home/Keychain/credential access; otherwise the task stops BLOCKED rather
      than weakening the sandbox.
    evidence_required: "Operator-Mac sandboxed compatibility smoke with no secret output plus exact git push --dry-run result."
  - id: AC-5
    requirement: >-
      README and MCP metadata describe the actual risk boundary without overstating sandbox strength. The four public tools,
      signatures, annotations, terminal timeout/output/session semantics, network scope, and tunnel architecture remain unchanged
      except for the new filesystem confinement guarantee.
    evidence_required: "Exact surface tests, README/source comparison, and diff inspection."
  - id: AC-6
    requirement: >-
      PYTHON=.venv/bin/python ./verify, py_compile/shell checks included by that gate, git diff --check, exact scope, candidate
      lineage, report-only lineage, final clean local state, unchanged main, and exact {dev, main} topology all pass.
    evidence_required: "Fresh exact-candidate and post-report Git/verification evidence."

