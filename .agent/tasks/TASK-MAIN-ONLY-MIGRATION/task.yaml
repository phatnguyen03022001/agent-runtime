      -> Executor report on main -> independent Architect review on main.

remote_retirement:
  desired:
    ruleset_id: 22462972
    ruleset_include_only:
      - refs/heads/main
    retain_rules:
      - deletion
      - non_fast_forward
    delete_refs:
      - control
      - dev
  capability_boundary: >-
    The current connected GitHub execution surface has read access to the ruleset but no
    exposed administrative action for ruleset mutation or branch deletion. Do not retain
    old authority because of that limitation and do not route around it.
  operator_transition_if_required:
    terminal: OPERATOR_TRANSITION_REQUIRED
    exact_steps:
      - >-
        Edit repository ruleset 22462972 so its include set contains only refs/heads/main;
        retain deletion and non_fast_forward.
      - "Delete remote branch control."
      - "Delete remote branch dev."
      - "Do not create a replacement branch or preservation tag."
    rule: >-
      Return this transition only after stage 2 has been published and fresh proof shows
      main contains the complete preserved governance history and current task material.

