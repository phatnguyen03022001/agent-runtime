      - ".agent/tasks/TASK-0130 -> control_task_subtrees.TASK-0130"
      - ".agent/tasks/TASK-0131 -> control_task_subtrees.TASK-0131"
      - ".agent/tasks/TASK-0132 -> control_task_subtrees.TASK-0132"
      - ".agent/tasks/TASK-0133 -> control_task_subtrees.TASK-0133"
      - ".agent/tasks/TASK-0134 -> control_task_subtrees.TASK-0134"
    rules:
      - "Use the nine existing tree SHAs directly; do not rebuild 50 individual governance blobs."
      - "No other path may change."
      - ".agent/tasks/TASK-0135/task.yaml must remain absent."
  commit:
    message: "migrate: converge governance to MAIN_ONLY"
    first_parent: "exact stage-1 workflow commit"
    second_parent: "e69bf4865ad4b0a6302253e14e36f5cba0766ae7"
    creation:
