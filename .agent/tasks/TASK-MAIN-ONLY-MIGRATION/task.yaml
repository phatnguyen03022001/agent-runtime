    - "Do not retry the same blocked primitive solely to obtain a different safety judgment."
  REMOTE_MAIN_DRIFT:
    - "Remote main differs from the exact parent required for the pending ref update."
    - "Do not recreate against the drifted head and do not retry automatically."
  PUBLICATION_FAILED:
    - "Git object creation succeeded but the intended non-force main ref update failed for a non-drift reason."
