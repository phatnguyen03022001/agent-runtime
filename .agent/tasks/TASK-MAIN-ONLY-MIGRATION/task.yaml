architecture:
  final_history:
    - >-
      The final migration commit MUST have the exact workflow-only commit as first
      parent and exact control_head as second parent.
    - >-
      Its tree MUST descend from the current main source tree and may replace only the
      nine TASK-0126..TASK-0134 subtrees with the exact pinned control subtree SHAs.
    - >-
      The second parent exists only to preserve complete control/dev historical
      reachability. Never use a normal recursive merge result from control or dev.
    - >-
      Because dev_head is an ancestor of control_head, no preservation tag or replacement
      ref is required.
  current_tree_authority:
    - "Product/source/test bytes come only from main."
    - "Current governance for TASK-0126..TASK-0134 comes from the pinned exact control subtrees."
    - "TASK-0135 revision 1 remains historical-only through the second parent and MUST remain absent from the final current tree."
    - "TASK-MAIN-ONLY-MIGRATION remains present from main."
    - "No new governance framework, metadata store, integration branch, staging branch, or preservation tag."

stage_1_manual_ci:
  purpose: >-
    Disable automatic hot-path CI before governance materialization using one exact-parent
    commit, without relying on GitHub Contents API latest-head semantics.
  required_workflow_content: |
    name: Agent Runtime Verify

    on:
      workflow_dispatch:

    permissions:
      contents: read

    jobs:
      canonical-verify:
        runs-on: macos-14
        timeout-minutes: 30

        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Set up Python 3.13
            uses: actions/setup-python@v5
            with:
              python-version: "3.13"

          - name: Upgrade pip
            run: python -m pip install --upgrade pip

          - name: Install locked dependencies
            run: python -m pip install --require-hashes -r requirements.lock

          - name: Canonical verify
            run: PYTHON=python PYTHONDONTWRITEBYTECODE=1 ./verify
  git_data_sequence:
    - "Create exactly one UTF-8 blob for the required workflow content."
    - "Create one tree from the exact execution_base tree changing only .github/workflows/verify.yml to that blob."
    - "Create one commit with exact execution_base as its sole parent."
    - "Commit message: chore: make canonical verify manual-only"
    - "Before ref mutation freshly require remote main still equals exact execution_base."
    - "Move main to the workflow-only commit with update_ref(force=false) only."
    - "Freshly prove remote main equals that exact commit and workflow has workflow_dispatch only."
  failure_semantics:
    - >-
      If platform safety blocks before the main ref update, classify PLATFORM_BLOCK with
      zero canonical repository consequence.
    - >-
      If stage 1 is already published and a later stage fails, never roll it back.
      Report the exact durable partial state for forward repair.

