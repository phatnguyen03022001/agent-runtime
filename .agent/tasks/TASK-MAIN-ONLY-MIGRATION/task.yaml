      - "Before ref mutation freshly require remote main still equals exact stage-1 commit."
      - "Move main with update_ref(force=false) only."
      - "No force, reset, rebase, amend, squash, PR, or merge API."
  proofs:
    - "Final commit parents are exactly [stage-1 commit, control_head] in that order."
    - "control_head is reachable from final main."
    - "dev_head is reachable through control_head."
    - "Nine current task subtree SHAs exactly equal the pinned control_task_subtrees."
    - ".agent/tasks/TASK-0135/task.yaml is absent from final tree."
    - ".agent/tasks/TASK-MAIN-ONLY-MIGRATION/task.yaml remains present."
    - "Workflow remains workflow_dispatch only."
    - >-
      Every path outside .github/workflows/verify.yml and
      .agent/tasks/TASK-0126..TASK-0134 has the same blob/tree identity as execution_base.
    - "No product/source/test path from control/dev is imported."

