    - "Require control and dev remain pinned."
    - "Require no open pull request was created."
  tree_construction:
    base: "exact stage-1 tree"
    replace_exact_subtrees:
      - ".agent/tasks/TASK-0126 -> control_task_subtrees.TASK-0126"
      - ".agent/tasks/TASK-0127 -> control_task_subtrees.TASK-0127"
      - ".agent/tasks/TASK-0128 -> control_task_subtrees.TASK-0128"
