  - "The accepted public archive and source tag identities remain exact; no rebuild, asset replacement or tag movement."
  - "All live changes go through package-owned transactional installation/recovery; no manual deletion of app, pointer, payload, service or transaction."
  - "No tunnel-client, credentials, Gatekeeper/TCC/Keychain, host dependency or sibling-repository mutation."
