scope:
  required_changes:
    - "Freshly bind clean synchronized main, exact task base, fixed origin, public release ID 398093294, tag v0.5.0 at source 092b761cdc7e3f1085abe38948d9613fefe9e875, and archive SHA-256 3f179015534d81d6baee3faf78a57f8300451739afdda53a5940ee91ec7c3746."
    - "Freshly prove the installed predecessor is Runtime 0.5.0 revision b1879b5c185e93457bb634a7ab0508f7220416af, its package-owned doctor is healthy 10/10, transaction absent, and its ServiceManagement state unambiguous. The newer checkout doctor expects an external payload and is not the predecessor health authority."
    - "Record only hash, mode, owner and existence of canonical runtime.env before the operation; never print or copy its contents. Validate its existing Git identity and workspace through the package-owned prebuilt helper. Require the same bytes, owner and mode 0600 after every consequential step."
    - "Download or reuse a freshly hash-checked public archive, verify its checksum, extract exactly one complete app/handoff/payload bundle under ignored build/TASK-0183-install, and validate schema-3 zero-cost provenance before live mutation."
    - "Run the packaged read-only prebuilt preflight against the existing configured workspace. Fail closed on any actionable preflight failure, unknown predecessor, foreign service/port, changed configuration, or unrecognized transaction."
    - "Use SentinelX as the independent live carrier. Invoke the packaged install_release.sh --workspace-root at most once and reconcile its transaction status before any further action. Do not uninstall first, clear configuration, or simulate a new user's missing-configuration onboarding."
    - "At PENDING, require readiness ready and package-owned doctor with no failures and only recognized CUTOVER_TRANSACTION_PRESENT warning for the exact transaction. Then invoke the packaged commit-cutover at most once. If the supported transaction cannot pass, use one recognized rollback/recovery path only when its state is unambiguous; otherwise stop BLOCKED preserving evidence."
    - "After commit, prove no transaction, readiness ready, doctor healthy, Runtime 0.5.0 with twenty public tools, strict ad-hoc codesign/provenance, selected payload and exact packaged source identity. Prove canonical runtime.env retains the exact original bytes, owner and mode 0600."
    - "Do not consume canonical ./verify or any package/archive build; reuse accepted TASK-0181 qualification and independently validate this downloaded artifact."
    - "Publish only .agent/tasks/TASK-0183/report.yaml as the report-only direct child of the execution base, using pinned Foundation validation and non-force main publication. Record precise live invocation/effect counts, failures/recovery if any, env preservation and final clean synchronized Git state."

