    sole non-pass check is exactly cutover_identity /
    CUTOVER_TRANSACTION_PRESENT describing the same recognized schema-5
    PENDING/APP_SWAPPED transaction. Any other warning or any failure blocks.
  rationale: >
    doctor.py intentionally composes status=degraded when a recognized cutover
    transaction is present. Requiring status=healthy before commit would
    contradict the required transaction-present state.

