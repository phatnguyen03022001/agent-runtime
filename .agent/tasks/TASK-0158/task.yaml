    - "Require transaction absent."
    - "Require installed Runtime 0.5.0 at exact revision 58027d5... and tree 230f73f9...."
    - "Require ServiceManagement enabled/enabled."
    - "Require healthz=live and readyz=ready."
    - "Require installed-bundle clean-environment doctor status=healthy with all 10 checks pass and zero warn/fail."
    - "Require package provenance still binds exact accepted package/source."
  retry_policy: >
    No second commit-cutover is authorized. If result is ambiguous, reconcile
    transaction and installed state. Transaction absent + exact installed
    identity + healthy 10/10 doctor is terminal success.

