acceptance_criteria:
  - id: AC-1
    requirement: "CODEX_LOCAL containment is empirically identified and no full-access bypass is active."
    evidence_required: "Current-session runtime evidence identifies the effective macOS containment boundary; documentation or self-report alone is insufficient."
  - id: AC-2
    requirement: "CODEX_LOCAL lacks permission to interrupt the live canonical Runtime process."
    evidence_required: "A non-destructive permission-only process-control probe against the positively identified canonical serving process is denied by the mechanical boundary; Runtime identity and health remain unchanged."
  - id: AC-3
    requirement: "CODEX_LOCAL lacks write capability over critical Runtime identity/lifecycle assets."
    evidence_required: "Non-writing write-capability probes are denied for .env, desired-state marker, Runtime LaunchAgent plist, and installed Runtime payload; pre/post bytes/metadata prove no mutation."
  - id: AC-4
    requirement: "Ordinary repository engineering remains usable inside the authorized workspace."
    evidence_required: "A disposable repository-local fixture proves normal scoped file operations plus required deterministic test/build execution remain available without sandbox bypass."
  - id: AC-5
    requirement: "Agent Runtime remains uninterrupted throughout verification."
    evidence_required: "Before/after proof shows the same canonical serving identity where stable identity observation is available, one MCP child, one listener on 127.0.0.1:8080, desired RUNNING, health=live, ready=ready, unchanged tunnel fingerprint, and no lifecycle event attributable to TASK-0030."
  - id: AC-6
    requirement: "Containment verification is reproducible and fail-closed."
    evidence_required: "When containment is available, a minimal repository-owned verifier/documented procedure safely detects missing/bypassed/insufficient containment and exits nonzero without mutating protected resources; when containment is unavailable, report BLOCKED instead of manufacturing PASS."
  - id: AC-7
    requirement: "Publication is bounded and reconstructible."
    evidence_required: "Exact task/base/candidate/report lineage, non-force dev publication, unchanged main, clean canonical checkout, and no auxiliary worktree/clone are proven."

