structure_authority:
  status: RESOLVED
  source: "Existing CODEX_LOCAL native execution sandbox/OS containment plus existing Agent Runtime self-protection; no new privileged Runtime architecture in this task."
  rationale: "First prove the actual current CODEX_LOCAL kernel-enforced boundary and reuse it when sufficient. Do not introduce privilege separation, a second service architecture, or another control plane in this task. If current containment cannot mechanically deny the required capabilities, fail closed with exact evidence for a later Architect decision."

objective: "Prove and, within the existing supported CODEX_LOCAL containment model, close the accidental native-Executor path to Agent Runtime lifecycle/resource destruction without interrupting the live Runtime, while preserving ordinary repository engineering capability."

scope:
  required_changes:
    - "Fresh-bind TASK-0030 revision 1 at the exact handoff base. Prove dev/main identity, canonical single-checkout topology, current TASK-0029 review identity, and live Agent Runtime singleton/health/readiness before repository mutation."
    - "Determine the actual CODEX_LOCAL execution containment from current runtime evidence. Do not infer sandboxing from documentation, prompt text, model identity, or historical behavior. Record whether kernel-enforced sandboxing is active and whether a full-access bypass is active."
    - "Perform only non-destructive permission probes against the live canonical Runtime. Process-control proof must use a permission-only/no-effect probe; no lifecycle-changing signal or service action may be sent."
    - "Prove whether CODEX_LOCAL can obtain write capability without changing bytes for each critical asset: checkout-local .env, desired-state marker, canonical Runtime LaunchAgent plist, and installed Runtime payload. Capture pre/post metadata/hash where applicable and prove no mutation."
    - "Prove whether CODEX_LOCAL can reach protected service-lifecycle and protected-port mutation surfaces without executing those mutations."
    - "If current CODEX_LOCAL containment mechanically denies every required dangerous capability, add only the smallest repository-owned deterministic boundary verifier/documentation needed to make the proof reproducible for future execution. It must be non-destructive and fail closed when containment is absent, bypassed, or insufficient."
    - "If any required dangerous capability remains available, stop with RESULT=BLOCKED after collecting exact safe evidence. Do not compensate by introducing privileged services, ownership redesign, new OS accounts, containers, or other architecture changes; those require separate Architect authority."
    - "Preserve tunnel identity, singleton behavior, exact four MCP tools, installed-runtime source independence, session capacity behavior, and protected-port semantics."
    - "Publish an Executor report non-force to dev after required checks; stop for Architect review and do not promote main."
  allowed_existing_files_or_components:
    - "README.md"
    - "verify"
    - "tests/"
    - "agent_runtime/protection.py"
    - ".agent/tasks/TASK-0030/report.yaml"
    - "minimal existing macOS/test support required only for non-destructive containment verification"

invariants:
  - "TASK-0030 must not intentionally interrupt, restart, replace, or lifecycle-transition the live canonical Agent Runtime/tunnel/MCP tree."
  - "No acceptance probe may create a reconnect/cutover for other active chats."
  - "Secure MCP Tunnel identity remains unchanged; no connector, tunnel, key, app, or profile recreation/rotation is permitted."
  - "The existing Agent Runtime MCP self-protection boundary remains intact."
  - "Behavioral instructions alone do not count as mechanical containment proof."
  - "No privileged helper, root daemon, dedicated OS user, EndpointSecurity extension, container, new network service, database, queue, scheduler, or second control plane is introduced."
  - "Private operator data, Photos/hidden photos, Keychain, SSH material, browser sessions, and unrelated filesystem state remain out of scope."
  - "main, tags, releases, sibling repositories, and unrelated services remain unchanged."

forbidden_changes:
  - "Do not perform any lifecycle-changing process signal or service action against Agent Runtime."
  - "Do not invoke Agent Runtime lifecycle transitions during TASK-0030."
  - "Do not free, occupy, or rebind protected endpoint 127.0.0.1:8080."
  - "Do not mutate permissions, ownership, location, or bytes of .env, desired-state marker, Runtime LaunchAgent plists, installed Runtime payload, or tunnel-client."
  - "Do not enable or request full-access/sandbox-bypass mode merely to make the task pass."
  - "Do not create a branch, worktree, clone, alternate checkout, privileged helper, privileged service, dedicated OS account, container, or external service."
  - "Do not modify TASK-0029 task/report/review artifacts."
  - "Do not promote main, force-push, tag, or release."

