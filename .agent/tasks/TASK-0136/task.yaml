authority_sources:
  - source: ".agent/tasks/TASK-0135/review-r2.yaml@3207b315f453e6a32a1cbe7e1b6ae3a76475ff90"
    role: "Accepted exact-CAS publication and native MAIN_ONLY mutation chain."
    precedence: 1
  - source: "agent_runtime/tool_contract.py@3207b315f453e6a32a1cbe7e1b6ae3a76475ff90"
