finding_F_0225_003:
  classification: bootstrap_exit_state_fixture_target_lifetime_race
  test: tests.test_durable_pipe.DurablePipeTests.test_bootstrap_exit_before_state_reconciles_state_published_after_exit
  remote_run: 37004430402
  remote_signature: "manager.start -> DURABLE_OWNER_LOST because persisted state remained running after the short-lived target process had already exited"
  existing_fixture:
    bootstrap_parent_exit: immediate
    state_publication_delay_seconds: 0.35
    target_lifetime_seconds: 2.0
  evidence:
    - "The test's intended race is bootstrap-parent exit before durable state publication, not target finalization."
    - "Remote run 37004430402 failed only this durable-pipe test while the companion delayed-valid, stuck/no-state, owner-transient, corruption and terminal-outcome regressions all passed."
    - "The target is currently held alive only by time.sleep(2.0), so host contention can let target finalization overtake manager-side owner reconciliation."
    - "A controlled probe preserving the same immediate bootstrap-parent exit and 0.35-second state-publication delay, but keeping the target alive behind an explicit release marker, returns manager.start status=running, observes durable state=running, bootstrap parent returncode=0, and after explicit release terminalizes exited/0."
    - "No production owner-reconciliation mutation is required by current evidence."
  root_cause: "The fixture conflates bootstrap-exit-before-state ordering with an unrelated scheduler-dependent target lifetime. Under contention the 2-second target can exit before the test reaches the state it intends to assert."

lane_a_fixture_correction:
  mode: MUTATING_TEST_ONLY
  allowed_file:
    - tests/test_durable_pipe.py
  required_design:
    - "Modify only test_bootstrap_exit_before_state_reconciles_state_published_after_exit."
    - "Preserve the bootstrap wrapper behavior: parent exits before durable state publication and the worker publishes state only after the existing bounded delay."
    - "Replace the target child time.sleep(2.0) lifetime with explicit release synchronization so the target remains alive through manager.start and the running-state assertion."
    - "The child-side synchronization must have a finite monotonic deadline and fail nonzero if release never arrives."
    - "Require manager.start returns status=running."
    - "Require the bootstrap parent exits successfully."
    - "Require the authoritative durable state observed before release is running and owner bindings can be recorded by the existing helper."
    - "Release the target only after all bootstrap-exit/state-reconciliation assertions have completed."
    - "Release signaling and cleanup must execute from finally paths so failed assertions cannot strand the target."
    - "Observe target terminalization through bounded condition-based polling, not by substituting another arbitrary sleep."
    - "Require cleanup terminal state exited with exit_code=0."
  forbidden_interpretations:
    - "Do not weaken the test to accept running-or-exited."
    - "Do not increase target sleep from 2 seconds to another arbitrary duration."
    - "Do not modify session.py, durable_pipe.py or durable_pipe_runner.py."
    - "Do not change bootstrap reconciliation constants or owner-verification semantics."
    - "Do not modify any other durable-pipe test unless required solely for deterministic cleanup of this exact fixture."

  focused_verification:
