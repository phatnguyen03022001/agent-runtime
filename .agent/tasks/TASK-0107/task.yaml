    requirement: "Blindness and fixture identity are preserved."
    evidence_required: "Known fixture SHA-256 binding and explicit attestation that no token oracle/alternate visual path was accessed."
  - id: AC-2
    requirement: "The existing fixture is displayed without semantic inspection outside production screen_capture."
    evidence_required: "Exactly one bounded fixture-open terminal_exec through CHATGPT_LOCAL."
  - id: AC-3
    requirement: "Production screen_capture executes exactly once through CHATGPT_LOCAL."
    evidence_required: "One typed screen_capture result or exact typed/platform failure; no retry."
  - id: AC-4
    requirement: "For successful capture, the ChatGPT model receives semantic PNG ImageContent and freezes a first 8-character uppercase candidate without self-scoring."
    evidence_required: "Capture metadata plus observed_visual_token verbatim."
  - id: AC-5
    requirement: "Production/runtime/repository state remains untouched except report publication and opening the non-sensitive fixture window."
    evidence_required: "All mutation counters zero except fixture-open consequence and report publication."
  - id: AC-6
    requirement: "Independent Architect can make the decisive visual judgment after report publication."
    evidence_required: "NEEDS_REVIEW report contains blind provenance and observed token or exact typed failure."

