  model_facing_instruction: "Inspect only the image returned by screen_capture. Read the exact text visibly rendered in the captured window's top title bar and return that title text verbatim, with no explanation."
  observation_rule: "Freeze the first title candidate verbatim as observed_window_title. Executor must not derive, query, hash-compare, or otherwise obtain the expected title outside the returned image."

