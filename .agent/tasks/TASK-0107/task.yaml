scope:
  required_changes:
    - "Resolve TASK-0107 revision 1 from GitHub at exact planning HEAD. Do not synchronize the local checkout."
    - "Before any visual observation, preserve the expected-token embargo exactly. Do not read tests/test_image_transport.py, historical private/ignored handoff evidence, or any artifact/history containing the expected token or derivation. Do not search the repository for the token."
    - "Before the screen_capture result, do not open/render/OCR/vision-inspect/decode the fixture through filesystem viewers, image tools, Python image libraries, browser data URLs, external models, screenshots, Quick Look or any route other than the authorized Preview -> production screen_capture path below."
    - "The known fixture SHA-256 is authority metadata and may be verified without opening or decoding image pixels."
    - "Invoke exactly one Agent Runtime terminal_exec to open the exact fixture in macOS Preview and allow a bounded one-second settle. The command may only perform /usr/bin/open -a Preview on the exact fixture path followed by /bin/sleep 1. It must not inspect, transform, OCR or read pixel content."
    - "If the fixture-open terminal_exec is platform-blocked before Agent Runtime/host, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE. Do not use operator/manual or alternate-surface fallback."
    - "After Preview settle, invoke production screen_capture exactly once with target=application_window and application_bundle_id=com.apple.Preview. Do not invoke frontmost/display/region fallback and do not retry."
    - "If screen_capture returns typed SCREEN_CAPTURE_PERMISSION_REQUIRED, stop SCREEN_RECORDING_PERMISSION_REQUIRED. Do not mutate TCC, open System Settings automatically, retry, restart Runtime or use another capture path."
    - "If screen_capture is platform-blocked before Agent Runtime/host, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE with no retry."
    - "If screen_capture reaches Agent Runtime but returns another typed capture error or no semantic image result, record SCREEN_CAPTURE_LIVE_PROOF_UNPROVEN with exact non-sensitive typed evidence."
    - "For a successful screen_capture result, require one PNG ImageContent semantic observation plus closed metadata indicating status=captured, permission=granted, capture_api=ScreenCaptureKit and target=application_window. Do not use metadata text as a token oracle."
    - "The Executor/model must inspect only the image delivered by that production screen_capture result and freeze its first answer to the model_facing_instruction as observed_visual_token. Do not ask a leading retry or use OCR."
    - "A syntactically valid candidate is exactly 8 uppercase ASCII characters. Syntax validity is not correctness. Executor must not self-score."
    - "After the observation is frozen, still do not open/read/derive the expected-token oracle. Publish report with observed_visual_token verbatim and stop NEEDS_REVIEW."
    - "Do not close, manipulate or automate Preview after observation; avoid adding a second GUI-control consequence. The operator may close the non-sensitive fixture window later."
    - "Publish TASK-0107 report on remote dev as the only tracked repository mutation."

