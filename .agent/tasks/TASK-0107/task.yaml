    - "If fixture-open terminal_exec is platform-blocked before Agent Runtime/host, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE. No retry or fallback."
    - "After Preview settle, invoke production screen_capture exactly once with target=application_window and application_bundle_id=com.apple.Preview."
    - "No frontmost/display/region fallback and no retry."
    - "If screen_capture returns SCREEN_CAPTURE_PERMISSION_REQUIRED, stop SCREEN_RECORDING_PERMISSION_REQUIRED. Do not mutate TCC or open System Settings automatically."
    - "If screen_capture is platform-blocked before Agent Runtime/host, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE."
    - "If screen_capture reaches Agent Runtime but returns another typed error or no semantic image result, stop SCREEN_CAPTURE_LIVE_PROOF_UNPROVEN."
    - "For successful capture, require PNG ImageContent plus closed metadata status=captured, permission=granted, capture_api=ScreenCaptureKit and target=application_window."
    - "Inspect only the image returned by production screen_capture and freeze the first answer to the model-facing instruction as observed_visual_token."
    - "A syntactically valid candidate is exactly 8 uppercase ASCII characters. Syntax validity is not correctness."
    - "Do not self-score or read the expected-token oracle after observation. Publish observed_visual_token verbatim and stop NEEDS_REVIEW."
    - "Publish TASK-0107 report on remote dev as the only tracked repository mutation."

