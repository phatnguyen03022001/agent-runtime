structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "GitHub repository metadata and release-integrity policy hardening only; no product/source structure change is authorized."

objective: "Close the remaining GitHub publication-integrity debt without rewriting the already-published v0.5.1 release. Add platform-enforced protection against update/delete of version tags, enable immutable releases for future publications, and populate concise repository About metadata. Preserve the exact existing v0.5.1 tag target, release record, release assets, source/package/runtime bytes, and main ruleset."

scope:
  required_changes:
    - "Freshly bind clean synchronized main at the exact task base and re-read GitHub truth before mutation: v0.5.1 release immutable=false; tag refs/tags/v0.5.1 targets commit 674095e739533e100c2cf75f434dd0bc825a3de3; archive asset 595362326 is 17,798,890 bytes with SHA-256 9518e1cf4f28033cbec97b8906e55e1a4da6ad3a9067485fb6ef7c4fcfac58e8; checksum asset 595362324 has SHA-256 3da6a20d35b369c722c182a8a4afd3b31ee216a65c7ae31e08aa9c486626f83e; repository immutable releases are disabled; ruleset 22462972 remains main-ref-integrity targeting only refs/heads/main."
    - "Create exactly one active repository tag ruleset named release-tag-integrity targeting refs/tags/v* with no bypass actors and exactly the update and deletion restriction rules. Do not restrict tag creation: future version tags must remain creatable through the authorized release flow, but once created they must not be movable or deletable under the ruleset."
    - "Enable repository immutable releases using the official repository-level immutable-releases setting. Freshly verify enabled=true after the mutation. Record enforced_by_owner exactly as GitHub returns it."
    - "Do not claim or attempt retroactive conversion of v0.5.1 into an immutable release. Freshly prove the already-published v0.5.1 release still reports immutable=false if GitHub continues to expose it that way; this is an expected platform limitation, not a task failure."
    - "Update the GitHub repository About description to exactly: Bounded local execution runtime for ChatGPT and MCP on macOS — 20 tools, transactional installs, package provenance, and OpenAI Secure MCP Tunnel."
    - "Set repository topics to exactly this normalized set, with no duplicates: agent-runtime, chatgpt, developer-tools, local-execution, macos, mcp, openai, python, secure-tunnel, swift."
    - "Leave homepageUrl unchanged unless GitHub requires an existing value to be preserved during the metadata mutation. Do not invent a homepage."
    - "After every GitHub metadata/policy mutation, re-read remote state. If a request returns unknown/ambiguous status, reconcile actual GitHub state before any retry. Never blindly repeat a metadata mutation."
    - "After completion, prove refs/tags/v0.5.1 still targets exactly 674095e739533e100c2cf75f434dd0bc825a3de3; the release ID, archive/checksum asset IDs, byte sizes and SHA-256 digests are unchanged; public release remains non-draft/non-prerelease; main-ref-integrity ruleset 22462972 is byte-semantically unchanged; new release-tag-integrity is active and targets refs/tags/v* with only update+deletion restrictions; repository immutable releases are enabled."
    - "Freshly prove installed Runtime remains 0.5.1/revision 674095e739533e100c2cf75f434dd0bc825a3de3, doctor healthy 10/10, readiness ready, transaction absent, and runtime.env hash/owner/mode unchanged. This task must have zero source/package/runtime lifecycle effects."
    - "Do not create, move, delete, annotate, sign, replace or otherwise mutate v0.5.1 or any existing tag. Do not edit the v0.5.1 release body, name, assets, checksum, draft/prerelease state or timestamps. Do not manufacture a new release solely to obtain retroactive attestation."
    - "Write and validate only .agent/tasks/TASK-0189/report.yaml as tracked execution output. The task performs GitHub repository metadata/policy effects only; no implementation/source/docs/test commit is authorized. Report exact before/after GitHub identities, ruleset ID returned by GitHub, immutable-release setting, repository About metadata, zero forbidden effects, and the non-retroactive v0.5.1 limitation. Publish the report as the sole direct child of the unchanged execution base, non-force to main, then reconcile clean synchronized main."
  allowed_existing_files_or_components:
    - "GitHub repository About description and topics"
    - "GitHub repository immutable-releases setting"
    - "GitHub repository rulesets"
    - "Read-only existing v0.5.1 release/tag/assets"
    - "Read-only installed Runtime state"
    - ".agent/tasks/TASK-0189/report.yaml"
  expected_files_are_restrictive: true

structure_policy:
