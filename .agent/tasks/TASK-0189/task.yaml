invariants:
  - "Existing v0.5.1 tag target, release record, release assets, archive bytes and checksum bytes remain unchanged."
  - "Existing main-ref-integrity ruleset 22462972 remains unchanged."
  - "The new tag ruleset protects release tags without blocking creation of future version tags."
  - "Enabling repository immutable releases is future-facing and must not be represented as retroactively making v0.5.1 immutable."
  - "Architecture, source, docs, tests, dependencies, package bytes, Runtime state and operator configuration remain unchanged."
  - "Main-only topology; no branch, PR, force push or amend."

forbidden_changes:
  - "Any edit, replacement, deletion, movement, annotation or signing conversion of v0.5.1 or any existing tag."
  - "Any edit/delete/re-upload of the existing v0.5.1 release or its assets."
  - "Any product/source/docs/test/dependency/package/archive change or canonical ./verify invocation."
  - "Any Runtime install, cutover, restart, rollback, recovery, runtime.env mutation, tunnel-client mutation, host-security mutation or dependency installation."
  - "Any modification or replacement of ruleset 22462972 main-ref-integrity."
  - "Any tag-creation restriction in release-tag-integrity; only update and deletion restrictions are authorized."
  - "Any bypass actor in release-tag-integrity."
  - "Any claim that v0.5.1 itself has acquired GitHub immutable-release attestation after this task."

