acceptance_criteria:
  - id: AC-1
    requirement: "Existing v0.5.1 publication identity is unchanged."
    evidence_required: "Fresh before/after tag target, release ID/state, asset IDs/sizes/digests and lightweight-tag object identity are byte/semantically identical."
  - id: AC-2
    requirement: "Version tags gain platform-enforced no-update/no-delete protection without blocking future tag creation."
    evidence_required: "One active release-tag-integrity tag ruleset targets refs/tags/v*, has no bypass actors, and contains exactly update and deletion restriction rules."
  - id: AC-3
    requirement: "Future GitHub releases are configured for immutable publication."
    evidence_required: "Repository immutable-releases endpoint returns enabled=true after the authorized mutation; report records enforced_by_owner exactly."
  - id: AC-4
    requirement: "GitHub About metadata describes the product clearly without changing product semantics."
    evidence_required: "Exact description and exact ten-topic set are visible in fresh GitHub readback; homepage remains unchanged."
  - id: AC-5
    requirement: "Non-retroactive limitation is explicit and no forbidden effects occurred."
    evidence_required: "Existing v0.5.1 remains unchanged and may still report immutable=false; report states it is retroactively tag-protected but not a GitHub immutable release/attested immutable publication. Source/package/runtime/release assets remain untouched."
  - id: AC-6
    requirement: "Repository and Runtime closure remain exact."
    evidence_required: "Only report.yaml tracked; report validator PASS; clean synchronized main; Runtime 0.5.1 healthy/ready with transaction absent and runtime.env unchanged."

