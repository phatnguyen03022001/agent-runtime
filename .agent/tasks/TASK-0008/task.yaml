structure_authority:
  status: RESOLVED
  source: "Accepted decommission evidence and current agent-runtime tree."
  rationale: "This task retires the active runtime implementation on dev and removes only positively classified inactive runtime-namespaced machine-local support state. Historical .agent/tasks evidence and LICENSE remain. README becomes a minimal historical tombstone. GitHub repository deletion, main promotion, primary checkout deletion, target-local secret files, and unrelated tunnel-client state are not authorized here."

objective: "Decommission agent-runtime as an active capability with the smallest irreversible surface: remove active runtime source/install/start/config/test/verification artifacts from dev, replace README with a minimal historical tombstone, and remove only the exact inactive runtime-namespaced machine-local support artifacts classified by accepted TASK-0007 evidence. Preserve historical task evidence, operator-local secret-bearing target files, the primary repository checkout, tunnel-client itself, unrelated tunnel profiles, main, and repository history."

scope:
  required_changes:
    - "Retire the current dev tree so the only non-.agent tracked files remaining are LICENSE and README.md. Preserve every existing .agent/tasks/** historical task/report/review artifact and the new TASK-0008 authority/report/review lineage."
    - "Replace README.md with a concise historical tombstone stating that agent-runtime is retired, is no longer part of the active engineering-agent ecosystem, must not be installed/started/used for new work, generic trusted direct Terminal/local execution plus current agent-skills/architect-profile superseded its responsibility, and .agent/tasks history is intentionally retained as historical evidence. Do not create replacement architecture or migration guidance."
    - "Delete all other tracked active runtime/support artifacts from dev, including .env.example, .gitignore, agent_runtime/**, config/**, install.sh, requirements.txt, start.sh, tests/**, verify, and any other tracked non-.agent/non-LICENSE/non-README runtime artifact found at the exact base. Do not rewrite historical .agent/tasks content."
    - "Before any machine-local deletion, establish fresh bounded evidence that no agent-runtime server process and no agent-runtime tunnel process is active. If an active or ambiguous process is found, stop BLOCKED before local deletion; this task does not authorize signaling or stopping a process."
    - "Remove only these accepted runtime support artifacts when their identity remains consistent with TASK-0007 evidence: $HOME/.config/agent-runtime/; $HOME/.local/state/agent-runtime/; $HOME/.local/share/agent-runtime/; and $HOME/.config/tunnel-client/agent-runtime.yaml. Deletion must be containment-checked and must refuse symlinks, unexpected owner/type, path escape, or identity ambiguity."
    - "Do not delete or inspect contents of the primary bound checkout's .env. Do not delete the primary /Users/tienphat/Developer/agent-runtime checkout, its .venv, or other untracked/ignored target-local files in this task. Do not delete tunnel-client/Homebrew packages, ~/.config/tunnel-client itself, or any non-agent-runtime tunnel profile."
    - "If direct authorized Mac execution is unavailable, use one operator Terminal decommission bundle for the exact authorized local checks/removals. The bundle must print only safe path/result metadata, never secret values or .env contents. Treat returned output as OPERATOR_SUPPLIED evidence and never claim Executor-direct Mac execution. At most one narrower follow-up bundle is allowed for a concrete unresolved fact."
    - "Order work so canonical dev retirement is built and verified before machine-local support deletion. Refresh dev/base immediately before publishing the implementation and again immediately before local deletion."
    - "Do not promote or mutate main. Do not archive/delete the GitHub repository. Those consequences require post-review authority."
    - "Produce TASK-0008/report.yaml in a separate report-only commit after implementation and authorized local cleanup are complete. Verify exact implementation parent/diff/final retired tree, local cleanup outcome, report sole parent/diff, final refs/topology, and stop at Governing Architect review."

  allowed_existing_files_or_components:
