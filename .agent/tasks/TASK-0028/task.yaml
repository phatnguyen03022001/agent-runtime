structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0027 architecture plus current installed ~/.config/tunnel-client/agent-runtime.yaml and repository-local .env"
  rationale: "No new architecture is required. This task performs one live reconciliation of legacy split-brain state, proves canonical stable identity, and performs restart acceptance."

objective: "Eliminate the current installation's split-brain tunnel identity, restore Agent Runtime startup using the already-accepted canonical profile-file design, and prove that the same ChatGPT conversation can call Agent Runtime before and after one controlled restart without a restart-induced 403."

scope:
  required_changes:
    - "Fresh-bind exact TASK-0028 revision 1 and exact dev/main state. Re-resolve accepted TASK-0027 review, current start.sh/install.sh semantics, live .env, canonical ~/.config/tunnel-client/agent-runtime.yaml, current process tree, port 8080, and current control-plane reachability before mutation."
    - "Use redacted values or fingerprints in evidence. Never print API keys or full secret-bearing configuration. Tunnel IDs may be compared internally but reports should prefer stable short fingerprints unless an exact ID is materially required for operator recovery."
    - "Determine the one-time migration target fail-closed. The legacy .env tunnel identity may become canonical only if fresh read-only control-plane metadata using the current Runtime key resolves that tunnel as the intended Agent Runtime and this is consistent with the historical successful ChatGPT tool traffic. Read-only-check the currently configured canonical-profile tunnel as well. If evidence is ambiguous or contradicts the expected target, do not mutate either identity; stop BLOCKED with exact redacted evidence."
    - "When the migration target is proven, atomically update ~/.config/tunnel-client/agent-runtime.yaml so control_plane.tunnel_id equals that proven existing tunnel identity. Preserve all unrelated profile settings and permissions. Do not create, delete, rotate, rename, or clone a tunnel."
    - "After profile identity is proven correct, remove legacy CONTROL_PLANE_TUNNEL_ID and AGENT_RUNTIME_TUNNEL_PROFILE entries from repository-local .env while preserving CONTROL_PLANE_API_KEY, AGENT_RUNTIME_WORKSPACE_ROOT, unrelated configuration, and mode 0600. This is convergence, not deletion of the tunnel identity: the canonical profile becomes the sole persistent tunnel-ID owner."
    - "Run the accepted start path exactly through ./start.sh and prove it uses --profile-file ~/.config/tunnel-client/agent-runtime.yaml, starts exactly one tunnel-client and one MCP server, owns one listener on 127.0.0.1:8080, and reaches /healthz=200 plus /readyz=200."
    - "Use an out-of-band local execution surface that remains available while Agent Runtime is stopped, preferably Remote Desktop Commander, for lifecycle commands and evidence. Do not use Agent Runtime to terminate or restart itself."
    - "After initial restored startup, in the same ChatGPT conversation invoke one harmless read-only Agent Runtime terminal_exec probe and record success. Then perform exactly one controlled Agent Runtime restart cycle using the already-accepted lifecycle/start path and the out-of-band surface. Do not restart unrelated processes or services."
    - "After that restart, in the same ChatGPT conversation invoke the same harmless Agent Runtime probe again without reconnecting, recreating, refreshing, or replacing the ChatGPT app/connector/tunnel. PASS requires the call to reach the same logical tunnel identity and complete successfully without 403."
    - "Prove the canonical tunnel-ID fingerprint is unchanged across the restart, exactly one Runtime/tunnel instance exists afterward, health/readiness are green, the four-tool MCP surface is unchanged, and .env no longer owns tunnel identity."
    - "If the post-restart call fails with a ChatGPT/developer-MCP capability or authorization 403 while canonical tunnel identity, control-plane authorization, process health, and tool schema remain stable, capture the exact error and classify it as outside the local split-brain mechanism. Do not hide it by recreating the app, connector, tunnel, or API key; stop BLOCKED for Architect judgment."
    - "Repository product source changes are not expected. If fresh execution proves another product-code defect is required, do not broaden scope locally; stop BLOCKED with minimal reproducer. If no product change is needed, do not manufacture a no-op implementation commit."
    - "Write .agent/tasks/TASK-0028/report.yaml in English with exact before/after fingerprints, mutation evidence, initial-start proof, same-chat pre/post restart probe result, final process/port/health state, and git state. Publish the report non-force to dev and stop at NEEDS_REVIEW only if all acceptance criteria pass."
  allowed_existing_files_or_components:
