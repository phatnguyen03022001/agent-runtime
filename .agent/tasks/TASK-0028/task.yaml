acceptance_criteria:
  - id: AC-1
    requirement: "Migration target is proven rather than guessed."
    evidence_required: "Fresh redacted/fingerprint comparison of legacy .env identity and canonical profile identity plus read-only control-plane metadata for both; selected target must resolve as the intended Agent Runtime and align with prior successful ChatGPT traffic."
  - id: AC-2
    requirement: "Current installation is converged to one persistent tunnel identity owner."
    evidence_required: "After atomic migration, canonical profile contains the proven existing tunnel identity; .env contains neither CONTROL_PLANE_TUNNEL_ID nor AGENT_RUNTIME_TUNNEL_PROFILE; API key/workspace configuration remain present; permissions are preserved."
  - id: AC-3
    requirement: "Agent Runtime starts cleanly through the accepted canonical path."
    evidence_required: "./start.sh succeeds with --profile-file; exactly one tunnel-client and one MCP server are present; one 127.0.0.1:8080 listener exists; /healthz and /readyz return 200; control-plane metadata remains the intended Agent Runtime."
  - id: AC-4
    requirement: "Same-chat pre-restart Agent Runtime access works."
    evidence_required: "One harmless terminal_exec probe from the active Executor conversation completes successfully after restored startup before the restart cycle."
  - id: AC-5
    requirement: "Restart no longer causes the historical 403 for the same conversation."
    evidence_required: "Using an out-of-band control surface, perform exactly one controlled Agent Runtime restart. Without connector/app refresh or recreation, the same ChatGPT conversation successfully invokes the same harmless Agent Runtime probe afterward."
  - id: AC-6
    requirement: "Identity and topology are stable across restart."
    evidence_required: "Canonical tunnel-ID fingerprint before and after restart is identical; final state has exactly one tunnel-client, one MCP server, one intended 8080 listener, healthy/readiness 200, and exact four-tool surface unchanged."
  - id: AC-7
    requirement: "No hidden platform-side workaround or unrelated mutation occurred."
    evidence_required: "Explicit evidence that no ChatGPT connector/app, tunnel object, API key, main/tag/release, dependency, or product source was mutated. If post-restart 403 persists despite stable local evidence, result is BLOCKED rather than masked by reconnect/recreate actions."
  - id: AC-8
    requirement: "Operational evidence is durable and reviewable."
    evidence_required: "TASK-0028 report validates under the pinned protocol, binds the exact task/base, records redacted before/after evidence and same-chat restart outcome, is the only repository change after the task base, is published non-force to dev, main remains unchanged, and result is NEEDS_REVIEW only when AC-1 through AC-7 pass."

