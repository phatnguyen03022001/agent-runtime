structure_authority:
  status: RESOLVED
  source: "Existing Agent Runtime menu-bar app plus canonical runtime_config.py/install_release.sh/candidate_cutover.py/doctor surfaces."
  rationale: "The smallest sufficient design is one bounded first-run native setup surface inside the existing app. No companion app, second configuration system, installer framework, helper service, or parallel lifecycle is required."

objective: "Make the accepted prebuilt-consumer path usable by a newcomer without Terminal configuration: when a fresh prebuilt launch lacks usable canonical Runtime configuration, present one native first-run setup flow inside Agent Runtime.app that securely collects the required Runtime values, selects an existing workspace through the macOS folder picker, validates before persistence, writes only the existing canonical mode-0600 runtime.env through the existing configuration authority, enters the existing prebuilt/candidate lifecycle, uses the existing recognized-transaction doctor warning plus readiness as the pre-commit gate, and declares terminal success only after the existing cutover commit removes the transaction and package-owned Runtime doctor is healthy. Existing valid configured installs must continue directly to the current control panel."

scope:
  required_changes:
    - "Implement the first-run setup as a native surface owned by the existing AgentRuntimeMenuBar app. On a fresh prebuilt launch, present it automatically rather than requiring the newcomer to discover the menu-bar control first. Do not create a separate setup application or installer product."
    - "Trigger onboarding only when the prebuilt consumer path cannot use a valid canonical Runtime configuration. A valid existing canonical runtime.env remains authoritative and must not be rewritten, migrated, or re-prompted merely because the new UI exists."
    - "For a fresh configuration, collect CONTROL_PLANE_API_KEY through a secure non-echoing native secret input. CONTROL_PLANE_TUNNEL_ID must receive equivalent no-log/no-report treatment consistent with the existing tunnel security boundary. Do not place either value in command-line arguments, repository files, UserDefaults, task evidence, or logs."
    - "Select AGENT_RUNTIME_WORKSPACE_ROOT with an NSOpenPanel-style directory-only macOS selection flow. The user must not type the workspace path in the normal first-run path. Cancellation performs no configuration or lifecycle mutation."
    - "Require the selected workspace to resolve through the existing canonical validation rules to an explicit existing absolute directory. Reject invalid/unsafe selections before persistence or cutover and surface actionable user-facing feedback."
    - "Request AGENT_RUNTIME_GIT_NAME and AGENT_RUNTIME_GIT_EMAIL only when the canonical configuration being created or validated requires that pair. Preserve existing validation semantics for pair completeness and malformed values."
    - "Reuse or minimally extend macos/runtime_config.py as the single canonical parser/validator/private writer for Runtime configuration. Native UI may orchestrate it, but must not implement a second independent runtime.env schema, validator, writer, or alternate configuration store."
    - "Validate all required values before the canonical file becomes visible. Preserve atomic/private-write behavior, non-symlink regular-file checks, canonical path ~/Library/Application Support/Agent Runtime/runtime.env, and final mode 0600."
    - "On validation failure, persist no partial canonical configuration, begin no candidate cutover, and start no Runtime. Surface a bounded reason that identifies the invalid field or prerequisite without reproducing secret values."
    - "Reuse the package-embedded prebuilt installer/preflight/provenance/candidate-cutover path for installation and activation, including the accepted external Agent Runtime.candidate.json handoff beside the release app. If that handoff is absent or unsafe, fail closed with an instruction to reopen the complete release bundle; do not synthesize, relocate, or replace provenance. Do not reimplement signing, provenance, candidate copying, ServiceManagement, transaction, resume, rollback, recovery, or commit semantics in Swift."
    - "The native flow may supply validated first-run values to existing packaged helpers through a bounded non-echoing process boundary, but secret material must remain absent from argv, stdout/stderr, unified logging, crash-oriented diagnostic strings authored by this flow, and repository evidence."
    - "Preserve the accepted pending-cutover safety boundary. Do not claim setup success while the transaction is unresolved. Any resume/rollback/recovery action must call the existing lifecycle path and must reconcile unknown effects before retry."
    - "Preserve default package-owned doctor semantics. Before finalizing a recognized PENDING/APP_SWAPPED cutover, require Runtime readiness to be ready and require doctor to contain no fail checks and no warning other than the existing cutover_identity warning with reason_code=CUTOVER_TRANSACTION_PRESENT for that exact recognized transaction. Overall doctor may therefore be degraded at this pre-commit boundary solely because of CUTOVER_TRANSACTION_PRESENT."
    - "Only after that bounded pre-commit gate passes may onboarding invoke the existing cutover commit. After commit, require transaction absence, Runtime readiness ready, and package-owned Runtime doctor overall status healthy before showing terminal setup success. Any post-commit degraded/unhealthy doctor is non-success and must surface the existing bounded recovery/action path rather than being relabeled healthy."
    - "If Background Activity approval or another existing macOS human prerequisite blocks progress, show one actionable state and allow bounded continuation through the existing resume path after the user completes that platform action. Do not automate around macOS approval."
    - "Keep the external official tunnel-client prerequisite and accepted tunnel identity checks unchanged. Missing/invalid tunnel prerequisites fail closed with actionable setup feedback; this task does not install or update tunnel-client."
    - "Update the prebuilt-user documentation so the primary newcomer path is open Agent Runtime.app -> native setup -> workspace selection -> activation/success. Remove shell exports, manual runtime.env editing, and typed workspace paths from the required fresh-user path while preserving a clearly separate maintainer/source path."
    - "Qualify this source change without a live host install, real Runtime credentials, Apple signing/notary credentials, notarization, release publication, or mutation of the currently installed Runtime. Use fixtures/temp homes/sentinel secrets for end-to-end source tests."
    - "TASK-0173 may remain BLOCKED. Do not read, provision, enumerate, or change Developer ID/notary credentials and do not make this source candidate depend on completing Apple account bureaucracy."

  allowed_existing_files_or_components:
    - "macos/Sources/AgentRuntimeMenuBar/**"
    - "macos/Sources/AgentRuntimeCore/** only if a narrow reusable non-UI boundary is materially required"
