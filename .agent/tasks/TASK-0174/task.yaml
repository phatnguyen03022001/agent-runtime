invariants:
  - "Canonical Runtime configuration remains ~/Library/Application Support/Agent Runtime/runtime.env and remains operator-owned mode 0600."
  - "No second configuration store, credential daemon, setup daemon, privileged helper, installer framework, package manager, updater, or parallel lifecycle is introduced."
  - "API key and tunnel identity values are never printed, logged, committed, included in reports, or passed as command-line arguments."
  - "The accepted candidate provenance, external handoff, transactional cutover, resume/rollback/recovery/commit, ServiceManagement, and tunnel security boundaries remain authoritative."
  - "Default doctor composition remains unchanged: a recognized pending cutover continues to emit CUTOVER_TRANSACTION_PRESENT as warn and therefore yields degraded overall status until the transaction is committed or otherwise resolved."
  - "A valid existing configured install continues to the current menu-bar control panel without mandatory onboarding or destructive config rewrite."
  - "Fresh prebuilt use requires no agent-runtime checkout, Git clone, host CPython 3.13, Xcode/Swift toolchain, local Developer ID identity, or notarytool credentials."
  - "The app may use only the Runtime Python/helpers already embedded by the accepted prebuilt package architecture."
  - "The official tunnel-client remains an external prerequisite; this task neither vendors nor upgrades it."
  - "Runtime version, ToolContract Kernel, MCP public surface, telemetry semantics, and same-UID threat model do not change."
  - "TASK-0173 Apple distribution authority remains independent and may stay BLOCKED."
  - "MAIN_ONLY topology remains unchanged."

forbidden_changes:
  - "Manual runtime.env editing, shell export, repository checkout, or typed workspace path as a required fresh-user onboarding step."
  - "Storing Runtime credentials in UserDefaults, plist preferences, a second env file, Keychain, repository state, logs, reports, or a new credential service."
  - "Passing CONTROL_PLANE_API_KEY or CONTROL_PLANE_TUNNEL_ID in process argv or embedding either value in user-facing error text."
  - "Silently replacing an existing canonical runtime.env that fails validation or has unsafe ownership/type/mode."
  - "Reimplementing candidate cutover, ServiceManagement, provenance, signing, tunnel enrollment, doctor, or readiness logic in a parallel Swift lifecycle."
  - "Changing default doctor warning/status composition, suppressing CUTOVER_TRANSACTION_PRESENT, adding a special healthy-while-pending doctor mode, or treating unrelated doctor warnings as acceptable pre-commit health."
  - "Adding a companion setup app, installer package/framework, privileged helper, launch daemon, updater, package manager, or background credential process."
  - "Installing host dependencies or requiring CPython/Xcode/Swift/signing/notary tooling on the consumer Mac."
  - "Real Developer ID provisioning, Keychain identity/profile enumeration, notarytool credential creation, notarization, stapling, tag/release publication, or TASK-0172 execution."
  - "Any live Runtime/tunnel/config mutation during source qualification."
  - "Any branch, PR, force push, amend, squash, tag, or unrelated cleanup."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: forbidden
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "A fresh prebuilt user can complete required Runtime configuration from the existing macOS app without Terminal configuration."
    evidence_required: "Native UI/source tests prove the first-run path collects the required fresh configuration, requires no manual runtime.env edit, shell export, checkout, or typed workspace path, and a valid existing configured install bypasses onboarding."

  - id: AC-2
    requirement: "Runtime secrets remain non-echoing and non-leaking while canonical persistence semantics stay unchanged."
    evidence_required: "Tests with sentinel API key/tunnel values prove secure native entry and no occurrence in argv, stdout/stderr, logs/diagnostic messages, reports, preferences, repository files, or non-canonical temp artifacts; the only durable configured destination is canonical runtime.env mode 0600 through the existing helper authority."

  - id: AC-3
    requirement: "Workspace selection is explicit, native, and fail-closed."
    evidence_required: "UI tests or deterministic presentation/controller tests prove directory-only macOS selection, cancel-with-zero-effect behavior, and rejection of nonexistent/non-directory/invalid workspace input before persistence or lifecycle mutation."

  - id: AC-4
    requirement: "Git identity is requested only when required and existing configuration remains compatible."
    evidence_required: "Tests cover fresh required name/email pair validation, malformed/partial rejection, and an already-valid canonical configuration path that is neither re-prompted nor rewritten."
  - id: AC-5
    requirement: "Invalid configuration cannot create partial product state."
    evidence_required: "End-to-end fixture tests prove validation precedes canonical visibility and cutover; invalid/missing values leave no canonical partial file or transaction and return actionable redacted feedback."

  - id: AC-6
    requirement: "Installation and activation reuse the accepted Runtime lifecycle rather than duplicating it."
    evidence_required: "Source/fixture evidence proves onboarding dispatches the existing package-embedded preflight/config/provenance/candidate-cutover/resume/commit path; transaction ambiguity remains fail-closed and no parallel lifecycle implementation appears."

  - id: AC-7
    requirement: "The pending cutover is finalized only from a narrowly recognized pre-commit state, and terminal success is backed by healthy post-commit Runtime state."
    evidence_required: "Deterministic integration tests prove the pre-commit gate accepts only readiness=ready plus a package-owned doctor report with zero fail checks and exactly the existing recognized CUTOVER_TRANSACTION_PRESENT warning as the sole warning for PENDING/APP_SWAPPED; any additional warning/failure blocks commit. Tests then prove commit uses the existing lifecycle, removes/resolves the transaction, and terminal success requires readiness=ready plus post-commit doctor overall status=healthy. Background Activity approval and other failures remain non-success actionable states using existing resume/rollback/recovery semantics."

  - id: AC-8
    requirement: "The prebuilt consumer path remains checkout- and toolchain-independent."
    evidence_required: "Isolated prebuilt fixtures prove the flow requires no agent-runtime repository, Git checkout, host CPython 3.13, Xcode/Swift, local signing identity, notary profile, or Apple credential; packaged Runtime Python/helpers are sufficient apart from the existing external tunnel-client/macOS prerequisites."

  - id: AC-9
    requirement: "Security, provenance, and public Runtime contracts remain unchanged."
    evidence_required: "Directly affected regressions prove canonical runtime.env mode/ownership, tunnel identity validation, candidate provenance/handoff, transaction semantics, Runtime/Kernel/capability contracts, and existing configured-install behavior remain green."

  - id: AC-10
    requirement: "One coherent onboarding source candidate is fully qualified with no live consequence."
    evidence_required: "Relevant native Swift tests plus installer/config/cutover/doctor regressions PASS, git diff --check PASS, canonical ./verify PASS once on the immutable final candidate, and report evidence records zero live Runtime/config/tunnel mutation, zero Apple credential/notary effects, and zero release/tag effects."

