acceptance_criteria:
  - id: AC-1
    requirement: "Incremental mode defaults to prior behavior and enforces caller budget and 16 KiB hard cap with truthful raw-byte cursor progression for PTY and pipe."
    evidence_required: "Schema export/MCP conformance, boundary/large-output/stream tests, exact byte and cursor assertions."
  - id: AC-2
    requirement: "None mode returns zero output text without losing unread bytes or lifecycle/termination/expiry information."
    evidence_required: "Status-only polling through running, exit, expiry, and subsequent incremental read tests."
  - id: AC-3
    requirement: "Valid UTF-8 code points are not corrupted by budget or chunk boundaries, and context-size improvement is measurable without weakening hard bounds."
    evidence_required: "Multibyte boundary and bounded serialized-result comparison tests."
  - id: AC-4
    requirement: "Existing TASK-0145 process lifecycle, keyed execution, tool inventory and nonterminal public contracts remain intact."
    evidence_required: "Focused regressions, schema inventory and canonical ./verify."
  - id: AC-5
    requirement: "Exact candidate passes focused and canonical verification, is published non-force, and canonical report-only child is remotely proven while installed Runtime stays unchanged."
    evidence_required: "Candidate SHA/tree, structured verifier completion, fresh remote identity, validated canonical report, source/live provenance."

