  status: RESOLVED
  source: "Accepted TASK-0145 unified lifecycle and operator TASK-0146 roadmap"
  rationale: "This is a bounded terminal_poll contract change inside the existing session, contract, server, and registry components. No new service or public tool is needed."

live_runtime_authority:
  installed_version: "0.2.2"
  installed_revision: "90a87fca8755ddc673e749bb5bf3e4489045a9b8"
  installed_kernel: 1
  source_kernel: 2
  rule: "Source development only in TASK-0146 execution. Cutover A is a later Architect-controlled activation boundary after acceptance."

objective: "Close the execution portion of GAP-05 by letting callers request bounded incremental or status-only terminal_poll results, reducing model context use without changing the underlying process lifecycle, cursor truth, or installed Runtime before Cutover A."

scope:
  required_changes:
    - "Add terminal_poll request v4 output=incremental|none, default incremental, and max_output_bytes as a caller raw-byte budget capped at the existing 16 KiB hard poll limit. Implement through server schema, session manager, capability registry, tool-contract projection, and source-facing docs. Keep terminal_poll result v3 unless a material new field is required by the frozen semantics below."
    - "For incremental mode, return at most the effective raw-byte budget and advance next_cursor only over bytes actually emitted. Preserve PTY merged output, pipe stream identity/order, cursor_expired/dropped_output_bytes, and existing lifecycle/exit metadata. Default omitted fields reproduce current 16 KiB incremental behavior."
    - "For output=none, return no PTY text and no pipe text chunks while preserving status/lifecycle/mode/exit information, cursor expiry and dropped-byte accounting. Do not consume unread output: next_cursor is the greater of requested cursor and base_cursor, bounded by retained end. Wait semantics remain governed by wait_for rather than silently changing timeout behavior."
    - "Avoid splitting valid UTF-8 code points at the emitted budget boundary or pipe chunk boundary. If a caller budget cannot fit the next complete code point, do not advance past its bytes; document that a larger budget is needed. Invalid byte sequences may retain the established replacement-decoding behavior."
    - "Use one shared byte-budget rule for terminal polling across PTY and pipe; preserve terminal_exec's existing separate 64 KiB per-stream capture/truncation contract and terminal_start's existing initial result. Do not add new public knobs to terminal_exec or terminal_start in this task."
    - "Add focused tests for exact byte caps, small budget/UTF-8 boundaries, large stdout/stderr, no-output cursor/lifecycle behavior, default compatibility, retention expiry and a bounded model-result-size regression. Update only directly affected source documentation and schema fixtures."
    - "Commit coherent candidate after focused PASS, run canonical ./verify on that exact candidate through a recoverable carrier, publish candidate non-force after fresh remote reconciliation, then publish a canonical Foundation-conforming report-r1.yaml as report-only child and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "agent_runtime session, server, contracts, capability registry and tool contract projection components"
    - "directly affected focused tests/schema fixtures"
    - "README.md, docs/AGENT.md, docs/OPERATIONS.md, docs/RECOVERY.md where source/live and output contract need correction"
    - ".agent/tasks/TASK-0146 task/report artifacts"

invariants:
  - "No new public tool; advertised inventory remains 19 and source ToolContract Kernel remains 2."
  - "terminal_poll request schema becomes 4; result schema remains 3 absent a justified result-contract change. terminal_exec stays 2/2 and terminal_start stays 3/3."
  - "All process admission, key binding, execution, cleanup, timeout, lease, and failure-effect semantics accepted in TASK-0145 remain unchanged."
  - "Hard poll output cap remains 16 KiB raw bytes and completed retained output remains 64 KiB; caller budget never raises either bound."
  - "No bytes are silently consumed by output=none or by an insufficient incremental budget; next_cursor remains a truthful raw-byte position."
  - "No tail mode, universal summary flag, new daemon or persistence mechanism."
  - "No build, install, restart, plugin reload or live Runtime cutover during source task."

forbidden_changes:
  - "GAP-05 collection-side, GAP-03, GAP-06 through GAP-13 implementation"
  - "terminal_exec public schema change, terminal_start public schema change, new public tool, or ToolContract Kernel version change"
  - "live Runtime package/install/service/plugin/configuration or macOS permission changes"
  - "new branch, PR, force push, amend, squash, or blind publication retry"

