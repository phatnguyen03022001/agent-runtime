structure_authority:
  status: NOT_APPLICABLE
  source: "Activation-only continuation"
  rationale: "No product source structure change is authorized. This task packages and activates already-accepted source bytes and records evidence."

objective: "Build one exact sealed Runtime package from this task's canonical base HEAD, whose product/source bytes are proven equivalent to accepted TASK-0168 candidate 06cb31e5... except for governance artifacts, activate it transactionally over the live schema-1 2044df22... Runtime, and prove the resulting installed schema-2 package self-describes service_management_contract=split-v1 while its runtime_revision is not present in the legacy SHA allowlists. This closes the recurring predecessor-SHA admission loop without a second activation. Do not modify product source."

scope:
  required_changes:
    - "Freshly prove exact base, clean main-only topology, accepted TASK-0168 review, unchanged live schema-1 Runtime and absent transaction."
    - "Prove no package-input/product source path changed between accepted source candidate 06cb31e5... and this task-authoring base; only task/report/review governance descendants may differ."
    - "Do not rerun canonical source ./verify while product bytes remain unchanged; reuse accepted TASK-0168 exact-SHA qualification."
    - "Build exactly one successful signed/sealed candidate from the canonical task-authoring base with the existing package pipeline and explicit signing identity."
    - "Validate package provenance, strict codesign, candidate handoff/closure, manifest schema=2 and service_management_contract=split-v1."
    - "Before live mutation, prove the exact installed schema-1 predecessor 2044df22... classifies split-v1 through the final one-time legacy bridge."
    - "Use SentinelX for live install/cutover. Invoke install-prebuilt at most once and commit-cutover at most once; reconcile any unknown outcome before considering another action."
    - "After activation, prove transaction absent, doctor healthy 10/10, ServiceManagement enabled/enabled, Runtime 0.5.0, Kernel/capability counts 2 / 21 / 20 / 20, strict codesign/provenance and zero pycache/pyc drift."
    - "Read the installed schema-2 manifest and prove service_management_contract=split-v1."
    - "Prove the newly installed runtime_revision is absent from AGGREGATE_ONLY_SERVICE_MANAGEMENT_REVISIONS and SPLIT_SERVICE_MANAGEMENT_REVISIONS while _predecessor_service_contract(installed_app) still returns split-v1. This is the live proof that future generation-changing refreshes no longer require new SHA admission."
    - "Do not perform a second Runtime upgrade merely to prove compatibility."
    - "On PASS, create report-r1.yaml as the sole tracked child after the activation/package source boundary, validate/publish non-force, and stop NEEDS_REVIEW."

  allowed_existing_files_or_components:
    - "macos/package_app.sh and existing package/provenance validation surfaces, read-only except generated build artifacts"
    - "install.sh existing activation commands"
    - "installed Agent Runtime package/service state"
    - "SentinelX independent carrier"
    - "build/candidates existing package output boundary"
    - ".agent/tasks/TASK-0169/report-r1.yaml"

structure_policy:
  expected_new_files: []
  unlisted_new_files:
    allowed: false
    max: 0
    within: []
    purpose: "No tracked source files are authorized beyond the report artifact."
  allow_new_top_level_directories: false
  allow_new_shared_modules: false

effect_authority:
  successful_package_build_max: 1
  install_prebuilt_max: 1
  commit_cutover_max: 1
  connector_reconnect_max: 1
  rollback_cutover_max: 1
  blind_retry: false
  source_mutation_max: 0

invariants:
  - "No tracked product/source/test/doc/dependency/verification-policy file changes."
  - "Runtime version remains 0.5.0 and ToolContract Kernel remains 2."
  - "Known/advertised/available capability counts remain 21/20/20."
  - "Manifest schema remains 2 with service_management_contract=split-v1."
  - "No future/new installed runtime_revision is added to legacy ServiceManagement SHA allowlists."
  - "No tunnel-client/Homebrew mutation."
  - "Telemetry remains off."
  - "No branch, PR, force push, amend, squash, tag or release."

forbidden_changes:
  - "Any edit to agent_runtime/, macos/, tests/, README.md, docs/, start.sh, install.sh, verify*, requirements* or .env*."
  - "Any new SHA admission for the new installed revision."
  - "Any second activation or synthetic live generation-changing upgrade."
  - "Any source requalification rerun unless product bytes are proven changed."
  - "Any package rebuild after a successful exact package has already been sealed unless that package is proven invalid and Architect authority is revised."
  - "Any telemetry/collector/tunnel work."
  - "Any weakening of codesign, provenance, manifest, cutover or doctor checks."

gap_policy:
  local_auto_fix: false
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: forbidden
  public_contract_change: forbidden
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Package source is exact and already qualified."
    evidence_required: "Task-authoring base differs from accepted source candidate only by governance artifacts; no package-input/product source bytes differ. No redundant source ./verify is run."

  - id: AC-2
    requirement: "One exact schema-2 package is produced and sealed."
    evidence_required: "Candidate package/handoff hashes, strict codesign, provenance and manifest schema 2 / split-v1 all PASS from one successful package build."

  - id: AC-3
    requirement: "Schema-1 -> schema-2 live migration succeeds transactionally."
    evidence_required: "Exact 2044df22... predecessor is recognized through the final legacy bridge; one install-prebuilt and one commit-cutover at most; final transaction absent and services healthy."

  - id: AC-4
    requirement: "Live Runtime remains functionally healthy after activation."
    evidence_required: "Doctor 10/10, ServiceManagement enabled/enabled, Runtime 0.5.0, Kernel 2, 21/20/20 capability counts, strict codesign/provenance and zero bytecode contamination."

  - id: AC-5
    requirement: "The recurring SHA-admission loop is proven dead on the installed package."
    evidence_required: "Installed runtime_revision is absent from both legacy SHA sets; installed manifest explicitly says split-v1; _predecessor_service_contract(installed_app) returns split-v1."

  - id: AC-6
    requirement: "Proof does not manufacture another release cycle."
    evidence_required: "No second upgrade, no new allowlist edit, no source mutation and no canonical source requalification rerun."

  - id: AC-7
    requirement: "Canonical closure is minimal."
    evidence_required: "report-r1.yaml is the sole tracked child, validates against Foundation 22fc4d88..., publishes non-force, and final main reconciles cleanly."

