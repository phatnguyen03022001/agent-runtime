      required: true

  authoritative_verification:
    required: true
    mechanism: "Exact sealed-package identity + transactional live activation + post-activation package/doctor/codesign/capability proof + live revision-independent predecessor classification."
    expected_signal: "Schema-2 Runtime is live and healthy, its revision is not in legacy SHA allowlists, and its signed manifest alone supplies split-v1 predecessor compatibility."

