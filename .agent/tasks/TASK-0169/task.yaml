      required: true
    - id: CHECK-2
      command_or_check: "Prove package-input/product-source equivalence between 06cb31e5... and task-authoring base. If any package-input/source byte changed, STOP BLOCKED; do not reuse qualification."
      required: true
    - id: CHECK-3
      command_or_check: "Build one successful package with existing signing pipeline; record exact candidate/handoff hashes and validate strict codesign/provenance/schema-2 split-v1 metadata."
      required: true
    - id: CHECK-4
      command_or_check: "Pre-mutation classify installed 2044df22... predecessor as split-v1 through legacy bridge and prove rollback/cutover state is unambiguous."
      required: true
    - id: CHECK-5
      command_or_check: "Through SentinelX perform bounded install-prebuilt then commit-cutover as required. Reconcile unknown outcomes; never blind-retry."
      required: true
    - id: CHECK-6
      command_or_check: "After connector recovery if needed, prove final live health, codesign/provenance, no pycache/pyc, exact runtime/capability identity and transaction absence."
      required: true
    - id: CHECK-7
