    - "Fresh-resolve local HEAD and origin/dev and require both equal the exact TASK-0065 handoff base. Require designated working tree clean."
    - "Before mutation, require the cutover transaction path to be absent and prove no symlink substitutes for it. Any transaction presence invalidates authority and requires ARCHITECT_REVIEW without mutation."
    - "Before mutation, prove the installed app rollback closure SHA-256 is 3815c89912b20ad343ca4f321f34672003abec2ee8a3ca1dab318fdb409faa8b with 1224 records and runtime revision 4fbf5b1b0ef3708c8fff479ca6718344f3bfd3c0."
    - "Before mutation, prove runtime.env exists, mode 0600, SHA-256 b47b144549659070c759407da4ba0dbedbf3c00014a948d615cff7823f97b2ed, without reading or printing its values."
    - "Before mutation, prove the desired-state marker exists, mode 0600, and record its current SHA-256. Treat any drift from the TASK-0064 accepted checkpoint as a blocker unless the accepted review explicitly permits it."
    - "Before mutation, canonical-validate the accepted candidate app/handoff pair and require candidate SHA-256 8017f53872635db2963d101682c09ee95aa0ed367d23523aff8f674fbfd16660 and handoff SHA-256 d8bd8885b4cd0d78e6f419496a97bbc5bda021f37f243f796420b05b851774f3."
    - "Before mutation, run strict deep codesign verification on the exact accepted candidate and require non-null consistent TeamIdentifier ownership; record only digest/equality evidence, never the literal TeamIdentifier."
    - "Before mutation, prove /bin/launchctl exists and current UID is exactly 501. Resolve /opt/homebrew/bin/tunnel-client, require it is usable as the canonical cutover tunnel-client argument, and record its launcher/source identity without starting a second tunnel client."
    - "Observe bounded pre-cutover ServiceManagement/launchd/process/listener/health state read-only. Do not repair or normalize predecessor state."
    - "Immediately before lifecycle mutation, re-prove exact HEAD/origin-dev, clean tree, absent transaction, exact predecessor closure, accepted candidate identity, runtime.env identity, and tunnel-client argument binding."
    - "Invoke exactly one canonical candidate_cutover.py cutover using the exact accepted candidate app/handoff, --home /Users/tienphat, --launchctl /bin/launchctl, --tunnel-client /opt/homebrew/bin/tunnel-client, and --uid 501. No retry is permitted."
    - "Treat any non-successful cutover result, approval-required result, partial result, or command failure as a genuine blocker. Do not follow it with rollback, resume, recover, commit, a second cutover, reinstall, manual launchctl/ServiceManagement repair, process start/restart/kill, or hand-edited transaction state."
    - "After the single invocation, inspect the transaction directory and installed app read-only. If a transaction exists, record schema/status/phase, metadata SHA-256, candidate handoff SHA-256, candidate SHA-256, source revision/tree, operation ledger, and prove it binds exactly to accepted candidate 8017f538...."
    - "After the single invocation, canonical-validate the installed app against the transaction-owned handoff when present and require the installed candidate identity to equal accepted candidate 8017f538... before reporting PASS."
    - "Observe post-cutover ServiceManagement, relevant launchd labels, Runtime/tunnel process tree, listener ownership for 127.0.0.1:8080, /healthz and /readyz, and actual running tunnel executable path when available. Do not start/restart/repair anything after observation."
    - "When a tunnel process exists, record SHA-256 for the actual executable image path reported by the running process, including libexec/tunnel-client when that is the executable image. Keep launcher fingerprint and running-image fingerprint as separate evidence fields."
    - "Revalidate the immutable accepted candidate after the live invocation and prove its app/handoff bytes remain unchanged."
    - "Record runtime.env and desired-state post identities without printing secret values; distinguish changes owned by canonical cutover from manual Executor edits."
    - "Publish only .agent/tasks/TASK-0065/report.yaml to dev, non-force, then stop at ARCHITECT_REVIEW."

