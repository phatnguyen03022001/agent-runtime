objective: >-
  Execute exactly one fresh canonical cutover invocation for the accepted immutable TASK-0062 candidate
  8017f53872635db2963d101682c09ee95aa0ed367d23523aff8f674fbfd16660 after freshly proving that the
  TASK-0064 rollback closure still holds and that no cutover transaction exists. Observe and report the
  exact canonical result and resulting live state without commit-cutover, rollback, resume, recover,
  retry, manual repair, or any second lifecycle invocation. This task does not declare final freeze readiness.

scope:
