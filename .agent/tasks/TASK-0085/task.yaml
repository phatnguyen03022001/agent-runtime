  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Public MCP surface becomes exactly eight tools with repo_observer registered using truthful read-only/non-destructive/idempotent/closed-world annotations and timing telemetry inclusion."
    evidence_required: "Generated MCP schemas, PUBLIC_TOOL_NAMES, ALLOWED_TOOL_NAMES and exact-surface/client-conformance tests all agree on the eight-tool set."
  - id: AC-2
    requirement: "repo_observer exposes a closed bounded input schema and a fixed closed success result schema covering repo/root safety, branch/head, local tracking state, canonical changes, diff summary, repository/operation state, worktree topology, observation flags and truncation."
    evidence_required: "Draft202012 schema validation plus successful MCP call structuredContent validated against generated output schema."
  - id: AC-3
    requirement: "Repository observation is local-only and mutation-free even under hostile Git/user configuration."
    evidence_required: "Tests prove no fetch/network command, index/ref/worktree content stability, GIT_OPTIONAL_LOCKS=0, fsmonitor disabled, pager suppressed, external diff/textconv disabled and sentinel helper scripts are never executed."
  - id: AC-4
    requirement: "Observation remains bounded for large/dirty repositories."
    evidence_required: "One five-second monotonic call deadline, remaining-time propagation, incremental output parsing, max_paths enforcement, bounded subprocess bytes, explicit truncation and non-exact-total semantics when enumeration is incomplete."
  - id: AC-5
    requirement: "Git semantics are not flattened incorrectly."
    evidence_required: "Focused fixtures cover clean, staged, unstaged, index+worktree simultaneous modification, untracked, deleted, rename/original path, conflict, detached HEAD, no upstream, ahead/behind local refs, shallow/bare rejection or representation, merge/rebase/cherry-pick/bisect state and subdirectory cwd."
  - id: AC-6
    requirement: "Workspace and worktree topology are policy-safe."
    evidence_required: "cwd outside workspace fails with typed OUTSIDE_WORKSPACE; cwd inside repo resolves correctly; repo root/safety fields are accurate; extra worktree outside workspace is counted/redacted without exposing or reading its absolute path."
  - id: AC-7
    requirement: "Expected failures are machine-classified at the MCP wire result."
    evidence_required: "MCP tests prove isError=true and structuredContent.error={code,message,retryable} while successful repo_observer retains its fixed generated output schema."
  - id: AC-8
    requirement: "No unrelated Runtime, lifecycle, candidate or repository authority is consumed."
    evidence_required: "Diff boundary contains only authorized source/tests/docs/report paths; TASK-0084/live transaction untouched; one worktree/dev preserved; origin/main unchanged."

verification:
  executor_checks:
    - id: CHECK-RED
      command_or_check: "On the exact clean execution base, add focused tests first and record genuine RED proving repo_observer/public-tool-8/error/deadline contracts are absent or failing before production implementation."
      required: true
    - id: CHECK-FOCUSED
      command_or_check: "Run only new repo_observer implementation/MCP tests plus directly affected MCP contract, client-conformance, timing, surface and boundedness tests until GREEN."
      required: true
    - id: CHECK-ADVERSARIAL
      command_or_check: "Run hostile-config/boundedness fixtures proving no fsmonitor/pager/external-diff/textconv execution, no network/ref/index mutation, redacted external worktrees, deadline behavior and truncated large-status behavior."
      required: true
    - id: CHECK-DIFF
      command_or_check: "Run git diff --check and inspect final tracked diff for exact authorized scope and no dependency/lifecycle/packaging changes."
      required: true
    - id: CHECK-CANONICAL
      command_or_check: "After focused GREEN and stable diff, invoke canonical PYTHON=.venv/bin/python PYTHONDONTWRITEBYTECODE=1 ./verify exactly once as the final broad source verification. Capture durable stdout/stderr, PID/launch identity and exit status under ignored build/.task-0085-*; do not replay merely because a client/tool transport times out after physical launch."
      required: true
    - id: CHECK-FINAL
      command_or_check: "Validate report with pinned agent-skills validator; publish implementation then report-only successor on dev; prove HEAD=origin/dev, clean tree, one worktree and unchanged origin/main."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Independent Architect review of implementation diff, generated schemas, focused/canonical verification evidence and boundary preservation."
    expected_signal: "Architect ACCEPT before any packaging/freeze/install authority is created for the new eight-tool source."

