objective: >-
  Determine the exact read-only cause, or the narrowest evidence-backed cause class, of the accepted installed
  generation's modern Runtime repeatedly exiting with launchd last exit code 1. Preserve the current schema-5
  PENDING / APP_SWAPPED transaction and all live lifecycle state exactly. Produce the smallest safe canonical
  next-action classification for Architect review. Do not start, restart, repair, recover, resume, rollback,
  commit-cutover, reinstall, execute the Runtime helper manually, or otherwise mutate Runtime/tunnel lifecycle state.

scope:
  required_changes:
    - "Fresh-resolve local HEAD and origin/dev and require both equal the exact TASK-0066 handoff base. Require designated working tree clean."
    - "Fresh-observe the cutover transaction before diagnosis. Require schema=5, status=PENDING, phase=APP_SWAPPED, metadata SHA-256=589436ead0cc3c53ea0c32a26eda98e19e2ead5564f6ae298752903566e8f661, candidate handoff SHA-256=d8bd8885b4cd0d78e6f419496a97bbc5bda021f37f243f796420b05b851774f3, and candidate SHA-256=8017f53872635db2963d101682c09ee95aa0ed367d23523aff8f674fbfd16660. Drift is a blocker; do not mutate."
    - "Canonical-validate the installed app against the transaction-owned handoff and require exact accepted candidate identity 8017f538.... Revalidate the immutable repository candidate too."
    - "Record fresh ServiceManagement status and bounded launchctl print evidence for com.picmao.agent-runtime-runtime-service, including state, runs, last exit code, program/bundle-program identity where exposed, throttle/restart fields where exposed, and loaded ownership. Never print unrelated environment values."
    - "Use bounded read-only macOS unified-log inspection for the accepted Runtime generation around the post-cutover failure window and current retries. Filter narrowly to AgentRuntimeRuntimeService / Agent Runtime relevant process, subsystem, or executable evidence. Persist only lines necessary to prove the failure cause; redact any credential, token, key, password, secret, API-key, or unrelated personal data before report persistence."
    - "Inspect the installed accepted Runtime helper and launchd contract read-only: existence/type/mode, strict codesign, TeamIdentifier equality by digest only, LaunchAgent plist label and BundleProgram, resolved executable path, xattrs/quarantine presence, and dynamic-library dependencies when relevant. Do not modify xattrs or permissions."
    - "Inspect the exact candidate-source startup/config code at revision b5ac0ed5b461d3a259e4111e1a8f13933985f81f needed to interpret the observed exit path. Read only the minimum files/functions necessary; do not infer from newer task metadata."
    - "Validate runtime.env only through a bounded secret-safe read path. Record path, mode, file SHA-256, duplicate-key/malformed-line status, required-key presence/non-empty booleans or value digests only when necessary to distinguish the failure. Never echo, source, persist, or print literal secret/config values."
    - "Inspect the canonical tunnel-client argument and actual Homebrew runtime image files read-only: launcher path/hash, launcher source path/hash, libexec/tunnel-client existence/type/mode/hash/version if available. Do not launch or authenticate tunnel-client."
    - "Inspect current process/listener/health state read-only and record whether launchd autonomous retry observations change during diagnosis. Autonomous OS retries are observations, not Executor lifecycle actions. Do not trigger them."
    - "Correlate launchd/log/config/package/source evidence into one cause classification. Use PROVEN_* only when direct evidence closes the causal chain. Otherwise return INSUFFICIENT_EVIDENCE with the exact missing proof boundary; do not guess."
    - "Classify the smallest next canonical route as exactly one of: SOURCE_OR_PACKAGING_FIX_REQUIRED, LOCAL_CONFIG_FIX_REQUIRED, OS_APPROVAL_OR_POLICY_REQUIRED, BOUNDED_LIFECYCLE_RETRY_REQUIRED, ROLLBACK_REQUIRED, or NO_SAFE_MUTATING_ROUTE_YET. This route is advisory only and authorizes no mutation."
    - "Re-prove transaction metadata/handoff, installed accepted-candidate identity, repository candidate identity, runtime.env SHA-256, desired-state SHA-256, and absence of manual lifecycle mutation before publication."
    - "Publish only .agent/tasks/TASK-0066/report.yaml to dev, non-force, then stop at ARCHITECT_REVIEW."

forbidden_changes:
  - "Do not invoke candidate_cutover cutover, commit, rollback, resume, or recover."
  - "Do not start, stop, restart, kill, signal, kickstart, bootstrap, bootout, register, unregister, repair, reinstall, or manually execute AgentRuntimeRuntimeService or tunnel-client."
  - "Do not open/launch the Agent Runtime app to induce lifecycle behavior."
  - "Do not edit runtime.env, desired-state markers, transaction metadata/handoff, installed-app bytes, candidate bytes, LaunchAgent plists, ServiceManagement state, launchd state, xattrs, permissions, TCC, BTM, or System Settings."
  - "Do not source runtime.env or print its literal values."
  - "Do not enumerate Keychain identities or disclose signing identity/TeamIdentifier literals."
  - "Do not modify production source, tests, dependencies, packaging/lifecycle implementation, README, tags, releases, main, architect-profile, agent-skills, agent-standards, or agent-documents."
  - "Do not delegate to Codex, Claude, Antigravity, another ChatGPT, or nested executors."

