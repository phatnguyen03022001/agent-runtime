  - "Require requirements.lock SHA-256 remains 80820ea3355dbdb76183347eaf8c0e32c47e43744520462ee52a4a199052ba2e."
  - "Require canonical packaging interpreter resolves to CPython 3.13.x/cpython-313/macOS arm64."

signing_authority:
  discovery_authority: "0/1"
  extraction_contract:
    - "Invoke /usr/bin/security find-identity -v -p codesigning exactly once."
    - "Capture stdout only in process memory; do not echo or persist raw output."
    - "Parse valid identity lines by regex searching for standalone 40-hex SHA-1 tokens, independent of surrounding index/quotes/spacing."
    - "Ignore the final '<N> valid identities found' summary when extracting fingerprints."
    - "Require the command summary count is exactly 1 and the set of distinct 40-hex fingerprint tokens from valid identity lines has cardinality exactly 1."
    - "If either condition fails, stop PACKAGING_AUTHORITY_UNAVAILABLE or SIGNING_IDENTITY_AMBIGUOUS as appropriate."
    - "Do not print or persist the fingerprint or human-readable identity literal."
    - "Bind AGENT_RUNTIME_CODESIGN_IDENTITY to the sole fingerprint only within the one package_app.sh child process environment."
  disclosure:
    raw_security_output: FORBIDDEN
    human_readable_identity: FORBIDDEN
    fingerprint: FORBIDDEN
    report_allowed: "valid_identity_count=1 and exactly_one_fingerprint_bound=true"

packaging:
  package_invocation_authority: "0/1"
  command: "./macos/package_app.sh"
  requirements:
    - "Invoke package_app.sh exactly once after signing extraction passes."
    - "No retry."
    - "Do not mutate AGENT_RUNTIME_PACKAGING_PYTHON."
    - "Require package output yields candidate_app, candidate_handoff and candidate_sha256."

post_package_verification:
  required:
    - "Candidate app and handoff are siblings under build/candidates/<candidate_sha256>/."
    - "Run strict codesign --verify --deep --strict on frozen candidate."
    - "Run package_provenance.py validate-candidate."
    - "Require candidate source_revision equals exact revision-3 planning HEAD."
    - "Require source tree, requirements lock hash, runtime manifest, external handoff and immutable candidate closure all pass."
    - "Require main app, AgentRuntimeRuntimeService and AgentRuntimeScreenCapture have one matching non-null TeamIdentifier."
    - "Record candidate SHA-256, app path, handoff path, handoff SHA-256, source revision/tree and lock SHA without disclosing signing identity/fingerprint."

scope:
