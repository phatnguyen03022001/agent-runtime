    - "Capture candidate_app, candidate_handoff and candidate_sha256 from package output."
    - "Do not retry package_app.sh after any non-zero result."

post_package_verification:
  required:
    - "Candidate app path and handoff path must both be under build/candidates/<candidate_sha256>/ and be non-symlink product-owned artifacts."
    - "Run strict read-only /usr/bin/codesign --verify --deep --strict on the frozen candidate."
    - "Run package_provenance.py validate-candidate against the frozen app and external handoff."
    - "Require candidate provenance source revision equals exact TASK-0109 planning HEAD."
    - "Require source tree, requirements lock hash, runtime manifest, package identity and handoff closure are internally consistent."
    - "Require main app, AgentRuntimeRuntimeService and AgentRuntimeScreenCapture are signed under the same non-null TeamIdentifier."
    - "Do not print the signing identity literal."
    - "Require candidate directory is immutable/frozen according to the existing package/freeze contract."
    - "Record candidate SHA-256, candidate app path, handoff path, handoff SHA-256, source revision, source tree and requirements lock SHA-256."

