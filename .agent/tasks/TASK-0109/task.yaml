  - "No source/test/doc implementation commit."

forbidden_changes:
  - "Do not modify source, tests, README, requirements.txt or requirements.lock."
  - "Do not print or persist raw security output, signing identity literal or fingerprint."
  - "Do not use ad-hoc signing."
  - "Do not invoke security find-identity more than once."
  - "Do not invoke package_app.sh more than once."
  - "Do not install-prebuilt or install/replace Agent Runtime.app."
  - "Do not create/mutate cutover transaction state."
  - "Do not commit-cutover, rollback, resume or recover."
  - "Do not restart/stop/signal Runtime."
  - "Do not refresh ChatGPT plugin."
  - "Do not invoke live screen_capture or mutate TCC."
  - "Do not mutate main/tags/releases/sibling repositories."
  - "Do not force-push."

