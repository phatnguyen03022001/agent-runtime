acceptance_criteria:
  - id: AC-1
    requirement: "Runtime 0.5.0 core remains exactly frozen and healthy."
    evidence_required: "Before/after exact revision/tree, absent transaction, doctor 10/10, Kernel 2 and 21/20/20 capability counts."
  - id: AC-2
    requirement: "Transport supply-chain identity is exact and official."
    evidence_required: "Homebrew formula and official OpenAI release independently bind v0.0.14, commit 0f870e50..., exact darwin-arm64 URL and SHA-256 b540493c...."
  - id: AC-3
    requirement: "The host adopts exact tunnel-client 0.0.14 safely."
    evidence_required: "One bounded upgrade and at most one forward restart through SentinelX; live version/SHA exact; rollback path proven before mutation; no blind retry."
  - id: AC-4
    requirement: "MCP transport remains functionally correct."
    evidence_required: "Exact Runtime reachable, 20 tools advertised, representative read-only/terminal calls succeed, no material local transport failure, doctor/readiness healthy."
  - id: AC-5
    requirement: "Latency is causally attributed."
    evidence_required: "Identical before/after matrix separates direct-local from controller-live cost and records raw samples plus min/median/max without unsupported inference."
  - id: AC-6
    requirement: "No unnecessary Runtime implementation is introduced."
    evidence_required: "If local MCP remains fast and residual live latency dominates externally, report EXTERNAL_TRANSPORT_DOMINANT with zero Runtime source changes."
  - id: AC-7
    requirement: "Failure cannot strand the substrate."
    evidence_required: "On material v0.0.14 regression, one rollback restores 0.0.11 and healthy Runtime and task returns BLOCKED; on PASS rollback is unused."
  - id: AC-8
    requirement: "Canonical repository closure is minimal."
    evidence_required: "report-r1.yaml is the sole tracked child, validates against Foundation 22fc4d88..., publishes non-force, final main reconciles cleanly."

