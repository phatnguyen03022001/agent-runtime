benchmark_contract:
  purpose: "Causal attribution, not a brittle network SLA."
  direct_local_mcp:
    warmup_allowed: 1
    measured_samples_per_operation: 5
  controller_live_mcp:
    measured_samples_per_operation: 5
    unavailable_rule: "If controller-side wall time cannot be captured truthfully, record UNAVAILABLE; never estimate."
  operations:
    - runtime_capabilities_summary
    - capacity_observer
    - fs_list_small
    - repo_observer_clean
    - terminal_exec_usr_bin_true
    - terminal_exec_sleep_1
  statistics: [min, median, max]
  rules:
    - "Use identical operation shape before and after."
    - "Benchmark commands must be read-only/no-effect except bounded /usr/bin/true and /bin/sleep 1 processes."
    - "Do not infer model thinking time from MCP timing."
    - "Do not infer unobserved network/control-plane internals."
    - "Any future Runtime source optimization requires separate Architect authority."

