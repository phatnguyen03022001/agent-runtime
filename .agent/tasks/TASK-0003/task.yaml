  - id: AC-1
    requirement: "README reload guidance accurately separates runtime process/config reload from ChatGPT capability freshness and removes unconditional fresh-chat ceremony."
    evidence_required: "Exact final README inspection against user-approved semantics and relevant startup/config source."
  - id: AC-2
    requirement: "Current-callability proof is condition-based: get_head(project) first, with sync/run_verify/get_last_log only as needed, and a successful post-change get_head in the same conversation can satisfy callability when no later runtime-changing event occurred."
    evidence_required: "Exact final README text contains the narrow rule without ritual all-tool invocation."
  - id: AC-3
    requirement: "No runtime/public-contract/source behavior changes occur."
    evidence_required: "Exact handoff-base-to-final implementation diff changes only README.md."
  - id: AC-4
    requirement: "Repository verification remains green on the exact final implementation state."
    evidence_required: "Fresh ./verify and git diff --check results with exact final_execution_head."
  - id: AC-5
    requirement: "Git lineage remains bounded: main unchanged, branches exactly {dev, main}, and report commit is the sole report-only child after final_execution_head."
    evidence_required: "Fresh refs plus report parent/diff verification."

