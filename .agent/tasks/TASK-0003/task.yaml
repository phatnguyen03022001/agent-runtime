structure_authority:
  status: RESOLVED
  source: "Existing README.md and repository structure."
  rationale: "This is a bounded operational-documentation correction. No production/runtime/test/config structure change is needed."

objective: "Reconcile the pending README runtime reload guidance with actual startup behavior and the approved condition-based capability-freshness rule, without changing agent-runtime behavior or public contracts."

scope:
  required_changes:
    - "Before mutation, confirm dev contains exactly the known pending README-only commit relative to main, branches are exactly {dev, main}, and no existing TASK-0001/TASK-0002 authority is retrofitted to the README delta."
    - "Inspect README.md, start.sh, and only the minimum relevant runtime/config source needed to distinguish process reload requirements from ChatGPT capability-exposure freshness."
    - "Update only README.md so runtime/config/profile changes are documented as requiring the runtime/tunnel process to restart or reload before new runtime configuration is trusted when the running process would otherwise retain old state. Preserve the existing clarification that a shell/terminal reset is not inherently required unless the setup depends on shell-exported environment outside .env."
    - "Replace the unconditional fresh-chat instruction with the approved condition-based rule: use a fresh-capability context when runtime/config/profile changed, current capability exposure is absent/plausibly stale/ambiguous, or current conversation has not proven the restarted runtime callable. A successful get_head(project) in the current conversation after the latest relevant change is sufficient callability evidence when no later runtime-changing event occurred; do not require a fresh chat merely as ceremony."
    - "Keep get_head(project) as the first runtime smoke/preflight action; mention sync(project), run_verify(project), and get_last_log(project) only when their evidence is materially needed. Do not turn README guidance into a requirement to call every runtime tool every time."
    - "Run the repository verifier and deterministic documentation/diff checks on the exact final implementation state, then create/update and commit/push .agent/tasks/TASK-0003/report.yaml as Executor-owned evidence."
  allowed_existing_files_or_components:
    - README.md
    - start.sh
    - verify
    - agent_runtime/
    - config/
    - .agent/tasks/TASK-0003/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Public MCP surface remains exactly get_head(project), sync(project), run_verify(project), get_last_log(project)."
  - "No runtime behavior, startup script behavior, config schema, tests, dependencies, workflows, installer behavior, or public API is changed."
  - "The README must distinguish process/config reload from ChatGPT capability-exposure freshness; fresh conversation is condition-based, not ceremonial."
  - "Installed/known/mentioned capability is not evidence of current callability; evidence must come from an actual successful current capability invocation when local runtime evidence matters."
  - "TASK-0001 and TASK-0002 artifacts remain immutable historical evidence."
  - "Long-lived branches remain exactly {dev, main}; main remains read-only during execution."

forbidden_changes:
  - "Do not modify start.sh, verify, agent_runtime/, config/, tests/, requirements, workflows, installer files, or any production/runtime code."
  - "Do not modify TASK-0001 or TASK-0002 artifacts."
  - "Do not create a new skill, framework, capability registry, reload subsystem, plugin abstraction, or runtime feature."
  - "Do not require a fresh ChatGPT conversation when current callability has already been proven after the latest relevant runtime/config/profile change."
  - "Do not create branches, mutate main, force-push, rewrite history, tag, release, promote, or mutate repository metadata."

