structure_authority:
  status: RESOLVED
  source: "Existing Agent Runtime native macOS app + existing start.sh + one minimal repository-owned protected-runtime lifecycle layer using macOS-native facilities."
  rationale: "Do not build a remote MCP gateway or another control plane. Keep Secure MCP Tunnel. The durable product change is local lifecycle hardening: one canonical supervised Runtime instance, explicit operator desired-state control from the menu bar, and bounded self-protection/audit against accidental agent actions. Prefer macOS-native launchd/SMAppService mechanisms and existing Swift/Python boundaries over a new daemon framework."

objective: "Make Agent Runtime operationally persistent and collision-safe on the operator's Mac: exactly one canonical Runtime/tunnel instance may serve 127.0.0.1:8080; accidental process death is automatically recovered while desired state is RUNNING; only direct operator menu-bar actions intentionally change desired lifecycle state; concurrent Executors cannot create duplicate instances or use Agent Runtime itself to kill/rebind its protected Runtime; blocked attempts are visible to the operator; Secure MCP Tunnel identity remains stable."

scope:
  required_changes:
    - "Fresh-bind TASK-0029 revision 3 at the exact handoff base while preserving all existing revision-1/revision-2 WIP and deterministic evidence. Fresh-prove dev/main identity, current live Runtime/process/port/launchd state, local .env identity ownership, absence of ~/.config/tunnel-client/agent-runtime.yaml, current menu-bar package state, and required execution capability before mutation."
    - "Define one canonical protected resource identity for the installation: Agent Runtime's canonical tunnel-client launch through start.sh using the .env-owned CONTROL_PLANE_TUNNEL_ID, its MCP child, and protected listener 127.0.0.1:8080. Do not protect unrelated processes merely because they use a similar name."
    - "Implement a single-instance guarantee that is safe under concurrent starts. Ten simultaneous start attempts must converge to one serving Runtime or one already-running result, never multiple tunnel-client/MCP instances. Use an atomic OS/filesystem/process primitive appropriate for macOS; PID existence or port occupancy alone is not sufficient authority."
    - "Add one minimal macOS-native supervisor/KeepAlive path for the canonical Runtime. While operator desired state is RUNNING, accidental termination of the canonical Runtime/tunnel must be recovered automatically without rotating tunnel identity, changing connector/app binding, creating a second instance, or requiring a chat reconnect. This supersedes TASK-0026's prior prohibition on Runtime KeepAlive only to the extent required by this task."
    - "Desired lifecycle state must remain operator-owned. The native menu-bar app is the normal control surface for explicit Start, Stop, and Restart. Start changes desired state to RUNNING and ensures the singleton exists; Stop changes desired state to STOPPED and prevents supervisor resurrection; Restart performs one intentional bounded restart and returns desired state to RUNNING. UI launch, polling, health refresh, repository updates, install verification, Executor activity, or app relaunch must not silently change desired state."
    - "Preserve a bounded CLI recovery path for the operator, but do not create a generic network/MCP/URL/AppleScript lifecycle API. If start.sh remains directly callable, make its relationship to singleton/supervisor semantics explicit and collision-safe; it must not bypass canonical identity or spawn a second Runtime."
    - "Add Agent Runtime self-protection at the terminal execution boundary so commands executed through Agent Runtime cannot intentionally or accidentally terminate, signal, launchctl-stop/bootout, replace, rebind, or free the protected Runtime/tunnel/port 8080. Detection must be semantic and conservative enough to block clear destructive targets while avoiding a broad shell blacklist. Return a stable machine-readable/user-readable denial such as PROTECTED_RUNTIME rather than executing the destructive action."
    - "The self-protection boundary must cover at minimum direct PID/process-group kill or signal of the canonical tunnel/MCP processes, pkill/killall patterns that resolve to those canonical processes, lifecycle operations against the canonical launchd service if one is introduced, and explicit attempts to terminate/free/rebind the protected 8080 listener through Agent Runtime. It must not claim to control arbitrary out-of-band root/sudo shells or third-party local tools outside this repository."
    - "Record bounded blocked-attempt audit events without secrets/private command payload leakage beyond what is required to explain the denial. The native menu-bar app must surface a concise warning/count/last-event state so the operator can see that an unauthorized/protected lifecycle attempt was blocked. Do not create a database or unbounded log."
    - "Handle stale historical Runtime instances safely. The bounded recovery path must prove canonical executable/argv/.env tunnel identity, process-tree/listener ownership, expected tunnel fingerprint, exact launchd label, temporary-fixture provenance where applicable, and service state before mutation. Any ambiguity is BLOCKED. Foreign or ambiguous 8080 owners remain fail-closed. Recovery must understand the revision-4 no-profile canonical command and remain idempotent."
    - "Revision 4 preserves the operator correction that reverses the prior profile-file ownership decision. The checkout-local .env is the sole persistent owner of CONTROL_PLANE_API_KEY, CONTROL_PLANE_TUNNEL_ID, and AGENT_RUNTIME_WORKSPACE_ROOT. ~/.config/tunnel-client/agent-runtime.yaml must remain absent and must not be recreated by install/start/recovery. Launch tunnel-client directly from sanitized environment/explicit CLI configuration while preserving the same tunnel identity, MCP stdio command, loopback health listener on 127.0.0.1:8080, and no connector/app/key/tunnel recreation or rotation."
    - "Fix the native LaunchAgent execution environment so canonical Runtime startup resolves the installed tunnel-client under launchd without depending on an interactive shell PATH. The implementation may use a verified absolute tunnel-client path or a deterministic PATH including standard Homebrew locations plus system paths; tests must prove launchd-like PATH behavior on Apple Silicon and fail closed if the binary is unavailable."
    - "Start/Restart must not report success merely because desired state was written or launchd kickstart returned. After an explicit operator Start/Restart, perform a bounded readiness check and return success only when exactly one canonical Runtime owns 127.0.0.1:8080 and health/readiness is green. On startup failure return nonzero with a useful bounded diagnostic; do not mask launchd exit failures as RUNNING."
    - "Update .env.example/documentation so CONTROL_PLANE_TUNNEL_ID is explicitly present as an operator-owned secret/config placeholder. Never write the real ID into Git or logs."
    - "Preserve exactly four public MCP tools and existing MCP signatures. Self-protection may change terminal execution outcome only for commands that materially target the protected Runtime lifecycle/resource; ordinary terminal behavior must remain compatible."
    - "Update installer/packaging/uninstall behavior only as needed for the supervised singleton and menu-bar integration. Revision 4 retains the bounded service-recovery mode that reconciles only the canonical runtime service registration and does not require replacing the preserved .venv symlink, rebuilding the Python environment, or performing a generic reinstall. Installation/update/migration must be idempotent and must not create duplicate launchd jobs or duplicate live Runtime instances. Uninstall/recovery must be explicit and must not affect unrelated processes or user data."
    - "Add deterministic tests for: concurrent start collapse; desired RUNNING/STOPPED semantics; accidental-death recovery; intentional Stop suppressing recovery; one controlled Restart; stale/foreign 8080 fail-closed behavior; exact tunnel identity preservation; self-protection denial cases; ordinary-command non-regression; bounded audit behavior; menu-bar warning presentation; and installer idempotence. Use isolated ports/process fixtures for tests; do not repeatedly kill the operator's live Runtime during unit/integration suites."
    - "Perform one bounded live migration/acceptance only after deterministic verification is green and only through an out-of-band local control surface. First prove the current revision-4 live preconditions and converge only through the repository-owned recovery path. Prove the existing canonical Runtime stays on the same tunnel identity, accidental termination recovers to one instance, explicit operator-style Stop suppresses resurrection, explicit Start restores one instance, and no other service/process is touched. Do not perform more lifecycle mutations than acceptance requires."
    - "Run ./verify, Swift tests, release build/package/signature verification, shell syntax/diff checks, exact four-tool proof, and focused protected-runtime tests. Publish implementation candidate and report non-force to dev, prove lineage and unchanged main, then stop at NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "start.sh"
    - "install.sh"
    - "verify"
    - "README.md"
    - ".env.example"
    - ".gitignore"
    - "existing macos/ Swift package/app sources and tests"
    - "agent_runtime terminal execution boundary only where required for protected-runtime self-defense"
    - "existing Python tests plus focused new protection tests"
    - "minimal macOS launchd/SMAppService plist/template/helper files required for one supervised singleton"
    - "minimal bounded local audit/status storage owned by Agent Runtime"
    - ".agent/tasks/TASK-0029/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "Secure MCP Tunnel remains the transport. No remote MCP gateway redesign is introduced."
  - "Canonical tunnel identity remains unchanged but is now .env-owned. CONTROL_PLANE_TUNNEL_ID in checkout-local .env is the sole persistent tunnel-ID authority; no persistent tunnel profile is allowed."
  - "Exactly one canonical Agent Runtime tunnel-client and one MCP child may serve the installation while desired state is RUNNING."
  - "Port 8080 is a protected Agent Runtime resource, but port occupancy alone never grants authority to kill a process."
  - "Direct human operator intent controls desired lifecycle state. Background recovery may restore RUNNING after accidental death, but may never override an explicit STOPPED state."
  - "Agent Runtime's own MCP terminal tools cannot be used to stop/kill/rebind their protected serving Runtime."
  - "Protection is defense-in-depth against accidental/concurrent Executor actions and normal unprivileged use. It must not falsely claim immunity against root/sudo, a malicious same-host administrator, kernel compromise, or third-party tools outside the enforcement boundary."
  - "No app/connector/tunnel/key recreation or automatic ChatGPT reconnect workaround is introduced."
  - "Exactly terminal_exec, terminal_start, terminal_poll, and terminal_control remain the four public MCP tools."
  - "No Docker/OrbStack dependency, Docker socket, remote lifecycle server, database, queue, scheduler framework, cross-repository runtime dependency, or new cloud service is introduced."
  - "Private operator data, Photos, hidden photos, credentials, and unrelated filesystem state remain out of scope."
  - "main, tags, releases, repository metadata, sibling repositories, and unrelated services remain unchanged."

forbidden_changes:
  - "Do not remove Secure MCP Tunnel or expose Agent Runtime as a public remote MCP server."
  - "Do not create/rotate/delete/rename/clone tunnels, Runtime/API keys, ChatGPT apps/connectors, or app versions."
  - "Do not remove CONTROL_PLANE_TUNNEL_ID from .env, recreate ~/.config/tunnel-client/agent-runtime.yaml, or add another persistent tunnel-ID/config authority."
  - "Do not implement kill-anything-on-8080 behavior. Foreign/ambiguous listeners fail closed."
  - "Do not add a broad arbitrary command blacklist unrelated to protected-runtime lifecycle."
  - "Do not add an MCP lifecycle tool, HTTP lifecycle endpoint, public local socket, URL scheme, AppleScript surface, or other automation API for Start/Stop/Restart."
  - "Do not claim that user-space policy can prevent root/sudo or malicious local administrators from terminating a process."
  - "Do not silently change desired state during install/update, menu-bar launch, login, health polling, code checkout, test execution, or error handling."
  - "Do not use Agent Runtime itself as the sole control channel for live acceptance lifecycle operations."
  - "Do not create branches, force-push, promote main, create tags/releases, or mutate sibling repositories."

