  - "RuntimeStatus and RuntimePolicy decision behavior remain unchanged."
  - "Protection persistence/decision behavior remains unchanged from revision 15."
  - "Public MCP surface remains terminal_exec, terminal_start, terminal_poll and terminal_control."
  - "Accepted application icon/audio resources remain unchanged."
  - "No new dependency, framework, service, branch, worktree, clone, main promotion, tag or release."

