structure_authority:
  status: RESOLVED
  source: "Existing AppKit menu-bar implementation in macos/Sources/AgentRuntimeMenuBar plus existing package/install path."
  rationale: "Revision 11 is a bounded native UX refinement plus activation/UI closure. Reuse the existing status item, NSPopover, RuntimeController, package/install path and lifecycle policy. Do not add a UI framework, settings subsystem, service, daemon, dependency, architecture layer or alternate control plane."

objective: "Refine the existing Agent Runtime menu-bar UX into a compact, scan-first native macOS control surface without changing Runtime lifecycle/protection semantics; deterministically verify the new UX candidate, then, only after native AX capability and explicit operator confirmation, activate it once and obtain truthful live native UI evidence while preserving Runtime/tunnel identity and continuity."

scope:
  required_changes:
    - "Fresh-bind TASK-0029 revision 11 at the exact handoff base. Prove current dev/main identity, revision-10 report/review lineage, one canonical checkout/worktree topology, reviewed revision-9 candidate ancestry, and TASK-0030 frozen historical status."
    - "Implement a bounded UX refinement using the existing AppKit menu-bar surface. Keep the popover compact and native; improve visual hierarchy and scanability so current state, serving endpoint, serving PID when owned, live/ready health, session capacity and protection status are understandable without dense prose or duplicated information."
    - "Preserve truthful state semantics. Stopped, owned/running, externally-owned/read-only, ambiguous/unavailable and busy transitions must remain distinguishable. The UI must never imply ownership, health, readiness or lifecycle authority that RuntimeController does not report."
    - "Keep lifecycle controls in one compact group with policy-driven enablement. Start, Stop and Restart must remain the same RuntimeAction semantics; do not add alternate lifecycle paths. Destructive controls must not become easier to trigger accidentally, and busy state must disable lifecycle actions until the current action resolves."
    - "Keep secondary information visually secondary: session capacity and protection audit should not compete with the primary Runtime state. When there are blocked attempts, surface the count/category clearly; when there are none, keep the protection line quiet. Keep Quit visually de-emphasized from lifecycle controls."
    - "Preserve the status-item state icon behavior and native template rendering unless a minimal accessibility/clarity correction is required. Maintain or improve explicit accessibility labels/value discoverability so native AX can identify the status item, popover state and lifecycle controls without relying on color alone."
    - "Do not introduce oversized hero cards, decorative dashboards, new windows, settings pages, onboarding, animations, custom design systems, web views, SwiftUI migration, third-party UI dependencies or unrelated visual features. Target a compact popover width in the existing small menu-bar range and let content determine the smallest practical height."
    - "Limit product-source mutation to the existing native menu-bar presentation surface and directly necessary presentation verification. AppDelegate.swift may change only where needed for native presentation/accessibility behavior; Runtime/protection/backend/server/install authority semantics must not change."
    - "Before any live activation, run deterministic repository verification for the new source candidate: Swift package build/tests that apply, repository full verify, diff/scope inspection, and evidence that protected-runtime behavior and the exact four-tool MCP public contract remain unchanged."
    - "After the source candidate is green, preflight native current-login Accessibility/AX capability against the live AgentRuntimeMenuBar using the actual CODEX_LOCAL host. If macOS permission is missing, stop before activation, ask the operator to grant Accessibility to the exact host surfaced by macOS, publish truthful BLOCKED evidence if the capability cannot be established, and do not bypass TCC."
    - "Before activation, capture a read-only live baseline: desired state RUNNING, exactly one canonical tunnel/MCP/listener, current listener PID, 127.0.0.1:8080 health=live and ready=ready, current menu-bar PID, accepted tunnel fingerprint without disclosing complete identity/secrets, installed manifest identity, and absence of legacy profile."
    - "When and only when source verification and native AX preflight are green, stop exactly once at the consequence boundary and request explicit operator confirmation to activate. Copying this task prompt is not activation approval."
    - "After explicit operator confirmation, use only the repository's existing canonical package/install path. Exactly one bounded installer-driven Runtime cutover/UI refresh is authorized. Do not perform extra manual Stop, Restart, kill, signal, rebind, tunnel rotation, profile migration or repeated lifecycle cycling."
    - "After activation, prove installed product bytes correspond to the revision-11 source candidate, while the previously reviewed Runtime/protection behavior remains intact. Record both the new candidate identity and the preserved revision-9 behavioral lineage."
    - "Immediately after activation, prove desired RUNNING survived; exactly one canonical tunnel, one MCP child and one listener return; health=live and ready=ready; tunnel fingerprint is unchanged; endpoint remains 127.0.0.1:8080; installed payload/LaunchAgents remain package-owned; and no unrelated service/process was intentionally changed."
    - "Using native UI/AX, directly prove the activated status item and popover: compact layout is readable; primary Runtime state is prominent; actual PID/endpoint/live-ready values are truthful; Start/Stop/Restart availability matches RuntimePolicy; protection/session information is present and secondary; repeated refresh remains responsive; click-outside dismisses the popover; healthy state has no stale warning/error; and no stuck process-discovery child remains. Do not click live Stop or Restart for acceptance."
    - "Revision 11 does not claim CHATGPT_LOCAL Agent Runtime MCP transport closure. If UX activation/native UI closure passes, record live MCP transport closure as the expected remaining TASK-0029 gate for the next revision."
    - "Publish the revision-11 report non-force to dev and stop for Architect review. Do not modify TASK-0030."
  allowed_existing_files_or_components:
    - "macos/Sources/AgentRuntimeMenuBar/ControlPanelController.swift"
    - "macos/Sources/AgentRuntimeMenuBar/AppDelegate.swift only when directly required for presentation/accessibility behavior"
    - "existing macOS tests and narrowly scoped presentation verification without new dependencies"
