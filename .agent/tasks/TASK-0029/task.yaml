structure_authority:
  status: RESOLVED
  source: "Existing AppKit menu-bar implementation and existing protection audit storage."
  rationale: "Revision 15 is source-only and replaces revision 14 before execution."

objective: "Produce a minimal, balanced two-column macOS menu-bar candidate with a single state action, green/red tunnel status icon and bounded tertiary protection history while preserving Runtime, tunnel and MCP behavior."

scope:
  required_changes:
    - "Fresh-bind exact base; preserve revision-13 evidence, unchanged main and frozen TASK-0030."
    - "Use a compact content-fit popover with deliberate row/column alignment and no excess vertical stretch."
    - "Header presents Agent Runtime at left and one status icon at right. Do not add a separate CONNECTED/OFFLINE headline."
    - "Status icon uses green only when the canonical tunnel/runtime is serving and health/readiness are confirmed; otherwise use red. Tooltip and accessibility text must still state the condition so color is not the sole signal."
    - "Facts use a two-column grid: labels left-aligned in the left column; values right-aligned and pushed flush toward the right content edge with stable row spacing."
    - "Keep endpoint, PID, health/readiness, session capacity and bounded protection history concise. Protection stays tertiary and must not expose raw internal category identifiers as prominent text."
    - "Expose exactly one lifecycle button in the popover: Stop when the Runtime is operator-owned/running and stoppable; Start when stopped and startable. Do not expose Restart in the UI. External/unavailable states expose no enabled lifecycle action. Backend compatibility may retain restart behavior outside the popover."
    - "The single Start/Stop button row spans the available content width; the button title is centered and the surrounding button frame/container stretches symmetrically toward both content edges."
    - "Keep Quit visually secondary below a separator."
    - "Bound protection history to at most 20 retained events. Persisted/displayed blocked_count represents retained history, not an unbounded lifetime total. No manual clear control."
    - "Preserve accepted application icon, notification sound and one-shot offline audio behavior."
    - "Add focused deterministic tests for two-column alignment contract, single-action state presentation, green/red status mapping, accessibility text, and audit rollover beyond 20 events."
    - "Run applicable Swift tests/build, protection tests, full repository verification, package/codesign, exact four-tool MCP contract and diff/scope checks."
    - "Publish candidate and report non-force to dev, then stop for Architect review. Do not install or activate the candidate in revision 15."
    - "Do not modify TASK-0030."

invariants:
  - "Live Runtime remains unchanged during revision 15."
  - "RuntimeStatus and RuntimePolicy remain authoritative for state and action availability."
  - "Protection decision/classifier behavior is unchanged; only bounded audit-history accounting/presentation may change."
  - "Public MCP surface remains terminal_exec, terminal_start, terminal_poll and terminal_control."
  - "Accepted icon/audio resources remain unchanged."
  - "No new dependency, framework, service, branch, worktree, clone, main promotion, tag or release."

forbidden_changes:
  - "No live installation or Runtime lifecycle mutation."
  - "No Restart control in the popover."
  - "No Runtime backend/server/RuntimePolicy/public-MCP/tunnel/env/port-ownership behavior change."
  - "No TCC workaround and no TASK-0030 mutation."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Popover is compact, content-fit and visually balanced."
    evidence_required: "Presentation tests/source inspection prove stable rows, left labels, right-flush values and no stretch gap."
  - id: AC-2
    requirement: "Status presentation is one green/red icon with non-color tooltip/accessibility semantics."
    evidence_required: "Tests cover healthy serving versus every non-serving/unconfirmed state."
  - id: AC-3
    requirement: "Exactly one lifecycle action is exposed when applicable."
    evidence_required: "Connected shows one centered full-width Stop; stopped shows one centered full-width Start; Restart is absent; external/unavailable expose no enabled action."
  - id: AC-4
    requirement: "Protection history is bounded and tertiary."
    evidence_required: "Audit tests prove retained events and displayed blocked_count never exceed 20 and enforcement decisions are unchanged."
  - id: AC-5
    requirement: "Existing Runtime/MCP/resource behavior remains preserved."
    evidence_required: "Focused tests, Swift build/tests, full verify, package/codesign and exact four-tool checks pass with bounded diff."
  - id: AC-6
    requirement: "Publication is reconstructible."
    evidence_required: "Exact base/candidate/report lineage, non-force dev publication, unchanged main, clean checkout and no auxiliary worktree."

