  - id: AC-1
    requirement: "Approved resources are repository-owned and staged correctly."
    evidence_required: "Staged app contains valid icon/audio resources, application metadata resolves the icon, and no original external path remains in runtime behavior."
  - id: AC-2
    requirement: "Menu-bar state presentation is truthful and accessible."
    evidence_required: "Connected/offline/external/unavailable/transitional states have native template presentation plus textual tooltip/AX state."
  - id: AC-3
    requirement: "Popover hierarchy and controls match operator intent."
    evidence_required: "No redundant normal ownership line; state then endpoint/PID/live-ready; secondary capacity/protection; policy-driven action presentation."
  - id: AC-4
    requirement: "Offline audio behavior is one-shot and non-disruptive."
    evidence_required: "Deterministic evidence covers transition and non-transition cases; missing resource is non-fatal."
  - id: AC-5
    requirement: "Runtime/protection/MCP behavior is unchanged."
    evidence_required: "Build/tests/full verify/four-tool/protection checks pass with no unauthorized backend diff."
  - id: AC-6
    requirement: "Publication is bounded and reconstructible."
    evidence_required: "Exact base/candidate/report lineage, non-force dev publication, unchanged main, clean canonical checkout and no auxiliary worktree/clone."

