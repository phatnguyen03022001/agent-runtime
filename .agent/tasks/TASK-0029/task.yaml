    evidence_required: "Package/static/live proof shows LaunchAgent and menu-bar lifecycle execute installed/package-owned start/runtime/Python payload rather than source-checkout implementation paths; temporarily testing against an isolated packaged fixture proves source checkout implementation bytes are not required; /Users/tienphat/Developer/agent-runtime/.env remains the only source-checkout runtime dependency; official tunnel-client/system dependencies are explicitly enumerated."
