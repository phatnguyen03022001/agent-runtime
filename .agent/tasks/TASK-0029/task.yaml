acceptance_criteria:
  - id: AC-1
    requirement: "Revision 11 produces a bounded native UX candidate without changing Runtime/protection behavior."
    evidence_required: "Exact diff proves product-source changes are confined to authorized menu-bar presentation files/direct presentation verification; repository verification passes; protected Runtime behavior and exact four-tool MCP contract remain green."
  - id: AC-2
    requirement: "The menu-bar popover is compact, scan-first, truthful and accessible."
    evidence_required: "Source-level/build evidence plus post-activation native AX evidence show clear primary Runtime state, truthful endpoint/PID/live-ready information, policy-driven lifecycle controls, secondary capacity/protection information, de-emphasized Quit, and accessibility discoverability without color-only meaning."
  - id: AC-3
    requirement: "Activation is gated by native AX capability and explicit operator approval."
    evidence_required: "Executor records successful AX preflight against the actual CODEX_LOCAL host, explicit operator confirmation after the candidate is green, one canonical installer-driven activation only, and no TCC workaround or extra lifecycle action."
  - id: AC-4
    requirement: "Runtime identity and service continuity recover correctly after activation."
    evidence_required: "Post-activation read-only proof shows desired RUNNING, one canonical tunnel/MCP/listener, health=live, ready=ready, endpoint 127.0.0.1:8080, unchanged tunnel fingerprint and package-owned installed execution."
  - id: AC-5
    requirement: "The activated native UI is directly proven truthful and responsive."
    evidence_required: "Native AX proves status item/popover access, truthful current values, correct control availability, repeated refresh responsiveness, click-outside dismissal, no stale warning/error and no stuck discovery child without clicking live Stop/Restart."
  - id: AC-6
    requirement: "No unrelated or additional lifecycle mutation occurs."
    evidence_required: "Execution evidence attributes the only authorized lifecycle transition to the installer cutover and shows no additional Stop/Restart/signal/rebind/profile/tunnel mutation or unrelated service change."
  - id: AC-7
    requirement: "Publication is bounded and reconstructible."
    evidence_required: "Exact task/base/revision-10 report+review/new candidate/report lineage, non-force dev publication, unchanged main, clean canonical checkout and no auxiliary worktree/clone are proven."

