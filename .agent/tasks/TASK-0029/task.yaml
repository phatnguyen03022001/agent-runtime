acceptance_criteria:
  - id: AC-1
    requirement: "The activated product remains byte-equivalent to the reviewed revision-9 product candidate."
    evidence_required: "Exact Git/product-path comparison proves no product-source drift after 37d4420022d4aa10550e605ac1d60f81d4418dfa, and installed package ownership/manifest/hash evidence binds the activated payload to those candidate-equivalent bytes."
  - id: AC-2
    requirement: "Activation is explicitly operator-controlled and bounded to the existing installer path."
    evidence_required: "Executor records successful preflight, explicit operator confirmation before activation, one installer-driven activation/cutover only, and no extra manual Runtime lifecycle action."
  - id: AC-3
    requirement: "Runtime identity and service continuity recover correctly after activation."
    evidence_required: "Post-activation read-only proof shows desired RUNNING, one canonical tunnel/MCP/listener, health=live, ready=ready, protected endpoint 127.0.0.1:8080, unchanged tunnel fingerprint and package-owned installed execution."
  - id: AC-4
    requirement: "Native current-login menu-bar UI is directly proven truthful and responsive on the activated payload."
    evidence_required: "Native AX evidence proves status item/popover access, actual serving PID/endpoint/live-ready display, correct healthy-state control availability, repeated refresh responsiveness, click-outside dismissal, no stale warning/error, and no stuck process-discovery child."
  - id: AC-5
    requirement: "No unrelated or additional lifecycle mutation occurs."
    evidence_required: "Execution evidence attributes the only authorized lifecycle transition to the installer cutover and shows no additional Stop/Restart/signal/rebind/profile/tunnel mutation or unrelated service change."
  - id: AC-6
    requirement: "Publication is bounded and reconstructible."
    evidence_required: "Exact task/base/reviewed-candidate/report lineage, non-force dev publication, unchanged main, clean canonical checkout and no auxiliary worktree/clone are proven."

