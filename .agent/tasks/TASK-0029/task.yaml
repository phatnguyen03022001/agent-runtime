structure_authority:
  status: RESOLVED
  source: "Existing AppKit menu-bar implementation and macOS AppBundle packaging."
  rationale: "Source/package candidate only; live Runtime state is out of mutation scope."

objective: "Create a bounded native macOS presentation/resource candidate with coherent state hierarchy, branded application metadata, stateful menu-bar presentation, and one-shot offline audio feedback while preserving Runtime/protection/MCP behavior."

scope:
  required_changes:
    - "Fresh-bind exact base and preserve revision-11 accepted lineage."
    - "Use only the exact operator-provided icon and audio inputs. If they are not available to the execution host, stop and ask the operator instead of substituting other assets."
    - "Copy the approved inputs into repository-owned AppBundle resources under stable names; installed code must not depend on their original external location."
    - "Package a valid macOS application icon and bind it through Info.plist. Keep the menu-bar status item a native template icon rather than a full-color application icon."
    - "Derive menu-bar presentation only from existing RuntimeStatus: owned=connected, stopped=offline, external=external/read-only, ambiguous=attention/unavailable. Tooltip and accessibility value must state the condition textually."
    - "Refine popover hierarchy: remove redundant normal ownership prose; primary state first; endpoint/PID and health/readiness next; capacity and protection audit secondary. Historical protection counts must not resemble an active failure."
    - "Keep RuntimePolicy as the sole lifecycle authority. Running state presents Stop and secondary Restart; stopped presents Start; external/ambiguous has no enabled mutation. Busy state disables lifecycle actions. Quit remains visually secondary."
    - "Bundle the approved audio resource and implement edge-triggered playback: after a prior serving/owned observation, transition to stopped or ambiguous requests playback once. Do not play on first observation, repeated unchanged offline state, external/read-only state, healthy refresh, or a restart that returns to serving. Missing audio must be non-fatal."
    - "Do not exercise live lifecycle controls for audio verification. Use deterministic source/test evidence and staged-bundle inspection."
    - "Limit changes to AgentRuntimeMenuBar presentation files, Info.plist, package_app.sh, AppBundle resources and directly necessary presentation/resource tests."
    - "Run Swift tests/build, release build, full verify, staged package/resource/codesign checks, exact diff review, protected-runtime checks and exact four-tool MCP contract verification."
    - "Publish the source/package candidate and report non-force to dev, then stop for Architect review. Do not install the candidate or mutate live Runtime state in revision 12."
    - "Do not modify TASK-0030."

invariants:
  - "Revision-11 accepted Runtime/protection/lifecycle behavior remains unchanged."
  - "RuntimeStatus and RuntimePolicy remain authoritative."
  - "Public MCP surface remains terminal_exec, terminal_start, terminal_poll and terminal_control."
  - "Live Runtime state is read-only during revision 12."
  - "No new dependency, framework migration, service, branch, worktree, clone or control plane."
  - "main, TASK-0030, tags and releases remain unchanged."

forbidden_changes:
  - "No live installation or Runtime lifecycle mutation."
  - "No server/protection/backend/RuntimePolicy/public-MCP/tunnel/env/port-ownership change."
  - "No TCC bypass, main promotion, tag, release or force-push."

gap_policy:
