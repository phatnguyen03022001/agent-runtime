      required: true
    - id: CHECK-2
      command_or_check: "Run deterministic isolated tests for 10-way concurrent start, desired-state recovery/stop/restart, stale/foreign port behavior, self-protection denial, audit bounds, installer idempotence, and ordinary terminal non-regression."
      required: true
    - id: CHECK-3
      command_or_check: "Run ./verify, Swift tests, release build/package/signature, shell syntax/diff checks, exact four-tool surface proof, dependency inspection, no-profile/.env-SSOT proof, launchd-like PATH startup tests, bounded readiness-success tests, and static proof of no remote/public lifecycle control surface or tunnel-identity regression."
      required: true
    - id: CHECK-4
      command_or_check: "Perform one minimal out-of-band live recovery/acceptance after deterministic gates: prove .env is the sole tunnel-ID owner and the persistent profile remains absent; prove launchd starts the canonical Runtime with the same identity; explicit Start reaches health/readiness before reporting success; accidental-death auto-recovery returns to one instance; explicit Stop suppresses resurrection; explicit Start restores one instance; no unrelated process/service is touched."
      required: true
    - id: CHECK-5
