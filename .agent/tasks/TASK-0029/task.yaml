structure_authority:
  status: RESOLVED
  source: "Existing install.sh, macos/package_app.sh, installed Agent Runtime.app, LaunchAgents, and native menu-bar UI."
  rationale: "Revision 10 is activation plus native UI closure only. It authorizes no product-source implementation change, dependency, architecture, service, privilege, or configuration-authority redesign."

objective: "Activate the already-reviewed TASK-0029 revision-9 product candidate through the existing package/install path under explicit operator control, then obtain truthful native current-login UI/Accessibility evidence while preserving tunnel identity, desired RUNNING semantics, singleton ownership, and bounded cutover behavior."

scope:
  required_changes:
    - "Fresh-bind TASK-0029 revision 10 at the exact handoff base. Prove current dev/main identity, revision-9 report/review lineage, canonical single-checkout topology, and TASK-0030 frozen historical status."
    - "Prove there is no product-source drift after reviewed source candidate 37d4420022d4aa10550e605ac1d60f81d4418dfa. Later task/report/review artifacts may differ, but installed/package/runtime product bytes must remain candidate-equivalent."
    - "Before any activation, preflight native current-login Accessibility/AX capability against AgentRuntimeMenuBar using the actual CODEX_LOCAL host. If macOS permission is missing, stop before activation and ask the operator to grant Accessibility to the exact host surfaced by macOS; if capability still cannot be proven, publish a truthful BLOCKED report and do not activate."
    - "Before activation, capture read-only live baseline: desired state RUNNING, exactly one canonical tunnel/MCP/listener, current listener PID, 127.0.0.1:8080 health/live and ready/ready, menu-bar process, accepted tunnel fingerprint, installed manifest identity, and absence of the legacy profile. Never print complete API key or tunnel ID."
    - "After all preflight gates are green, stop exactly once at the activation consequence boundary and request explicit operator confirmation to proceed. Copying the task prompt is not itself activation approval. Do not run the installer or any Runtime lifecycle-changing action until that confirmation is received in the Executor conversation."
    - "After explicit confirmation, use only the repository's existing canonical package/install activation path. One bounded installer-driven Runtime LaunchAgent refresh/cutover and UI refresh are authorized because the installed payload must change. Do not perform extra manual Stop, Restart, process signaling, port manipulation, tunnel rotation, profile migration, or repeated lifecycle cycling outside the installer's own bounded behavior."
    - "Prove the activated installed package contains product bytes equivalent to reviewed candidate 37d4420022d4aa10550e605ac1d60f81d4418dfa despite later task/report/review commits. Record the installed manifest revision truthfully and separately record the reviewed product candidate identity."
    - "Immediately after activation, prove desired RUNNING survived; exactly one canonical tunnel, one MCP child and one listener return; health=live and ready=ready; tunnel fingerprint is unchanged; protected endpoint remains 127.0.0.1:8080; installed payload and LaunchAgents remain package-owned; and no unrelated service/process was intentionally changed."
    - "Using native UI/AX, prove the Agent Runtime status item exists and opens its popover; the popover shows the actual serving PID, 127.0.0.1:8080 and live/ready; healthy-state Start/Stop/Restart availability matches policy; repeated refresh remains responsive; no stuck process-discovery child remains; click-outside dismisses the popover; and healthy state shows no stale warning/error. Reuse deterministic revision-7 evidence for warning/error transition semantics rather than inducing a destructive live error solely for visual proof."
    - "Do not click live Stop or Restart and do not perform another lifecycle transition for UI acceptance. Do not use TCC bypasses, database edits, synthetic accessibility injection, or other privacy-control workarounds."
    - "Revision 10 does not attempt live Agent Runtime MCP transport closure because CODEX_LOCAL is the native activation/UI surface and must not pretend to expose CHATGPT_LOCAL's Agent Runtime transport. Record live MCP closure as the sole expected remaining TASK-0029 gate for a subsequent revision if activation/UI closure passes."
    - "Publish the revision-10 report non-force to dev and stop for Architect review. Do not touch TASK-0030."
  allowed_existing_files_or_components:
    - "install.sh and its existing package/install path"
    - "macos/package_app.sh and existing native build/package inputs"
    - "installed ~/Applications/Agent Runtime.app"
    - "existing Agent Runtime LaunchAgents and desired-state marker only through the authorized installer activation path"
    - ".agent/tasks/TASK-0029/report.yaml"

invariants:
  - "Revision-9 source candidate 37d4420022d4aa10550e605ac1d60f81d4418dfa is already technically reviewed; revision 10 must not edit product source."
  - "Activation is operator-controlled and may cause one bounded reconnect/cutover. No extra lifecycle cycle is authorized."
  - "Secure MCP Tunnel identity and accepted fingerprint remain unchanged; checkout-local .env remains the authority and its secret values must not be printed or rotated."
  - "Desired state remains RUNNING before and after activation."
  - "Exactly one canonical Runtime/tunnel tree may serve 127.0.0.1:8080 after cutover; foreign/ambiguous ownership fails closed."
  - "TASK-0030 remains frozen historical evidence until TASK-0029 reaches final ACCEPTED."
  - "No branch, worktree, clone, alternate checkout, dependency, daemon, service, container, database, queue, scheduler, control plane, or architecture is introduced."
  - "main, tags, releases, sibling repositories and unrelated services remain unchanged."

forbidden_changes:
  - "Do not activate before native UI/AX capability is proven and explicit operator activation confirmation is received."
  - "Do not modify product source, tests, README, dependencies, public MCP surface, protection semantics, tunnel identity, connector/app binding, .env authority, desired-state semantics, or port ownership."
  - "Do not perform manual Runtime lifecycle actions beyond the single existing installer-driven cutover authorized after confirmation."
  - "Do not bypass or alter macOS TCC databases or privacy protections."
  - "Do not modify TASK-0030 artifacts."
  - "Do not create branches/worktrees/clones, force-push, promote main, tag, or release."

