structure_authority:
  status: RESOLVED
  source: "Existing AppKit menu-bar implementation and existing protection audit storage."
  rationale: "Revision 14 is source-only. Live Runtime state is out of mutation scope."

objective: "Produce a compact native menu-bar candidate with content-fit layout, state-adaptive lifecycle controls and bounded protection-history presentation while preserving existing Runtime, tunnel and MCP behavior."

scope:
  required_changes:
    - "Fresh-bind exact base and preserve revision-13 evidence, unchanged main and frozen TASK-0030."
    - "Remove excess vertical whitespace. Current condition, endpoint/PID and live/ready facts must form one compact scan path."
    - "Do not repeat the same condition as a separate oversized heading."
    - "Keep session capacity and protection history tertiary and visually quiet. Internal protection category identifiers must not be prominent user-facing text."
    - "Make lifecycle controls state-adaptive while keeping RuntimePolicy authoritative: connected presents Stop plus secondary Restart; stopped presents Start; external or unavailable state presents no enabled mutation; busy state suppresses mutation until completion."
    - "Keep Quit visually secondary."
    - "Bound protection history to the existing maximum of 20 retained events. Persisted and displayed blocked_count must represent retained history, not an unbounded lifetime total. Do not add a manual clear/settings surface."
    - "Do not change protection decision behavior; only audit-history accounting and presentation may change."
    - "Preserve accepted icon, notification sound and one-shot offline audio behavior."
    - "Add focused tests for presentation states and audit rollover beyond 20 events."
    - "Run applicable Swift tests/build, protection tests, full repository verification, package/codesign, exact four-tool MCP contract and diff/scope checks."
    - "Publish candidate and report non-force to dev, then stop for Architect review. Do not install the candidate in revision 14."
    - "Do not modify TASK-0030."

invariants:
  - "Live Runtime remains unchanged during revision 14."
  - "RuntimeStatus and RuntimePolicy remain authoritative."
  - "Protection decision behavior is unchanged; retained audit history is capped at 20."
  - "Public MCP surface remains terminal_exec, terminal_start, terminal_poll and terminal_control."
  - "Accepted icon/audio resources remain unchanged."
  - "No new dependency, framework, service, branch, worktree, clone, main promotion, tag or release."

forbidden_changes:
  - "No live installation or Runtime lifecycle mutation."
  - "No Runtime backend/server/RuntimePolicy/public-MCP/tunnel/env/port-ownership change."
  - "No TCC workaround and no TASK-0030 mutation."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Popover is compact and content-fit."
    evidence_required: "Presentation tests and source inspection prove no excess vertical gap and a compact state-to-endpoint-to-health hierarchy."
  - id: AC-2
    requirement: "Lifecycle controls adapt to RuntimeStatus while preserving RuntimePolicy authority."
    evidence_required: "Tests cover connected, stopped, external, unavailable and busy presentation."
  - id: AC-3
    requirement: "Protection history is bounded and tertiary."
    evidence_required: "Audit tests prove event history and blocked_count remain at or below 20 through rollover; UI avoids prominent raw internal category text."
  - id: AC-4
    requirement: "Existing behavior remains preserved."
    evidence_required: "Focused tests, Swift build/tests, full verify, package/codesign and exact four-tool checks pass with bounded diff."
  - id: AC-5
    requirement: "Publication is reconstructible."
    evidence_required: "Exact base/candidate/report lineage, non-force dev publication, unchanged main, clean checkout and no auxiliary worktree."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Bind exact base and prove revision-13 lineage plus zero live Runtime mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Implement compact state-adaptive presentation and bounded audit-history accounting only."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused presentation/audit tests and full repository verification."
      required: true
    - id: CHECK-4
      command_or_check: "Publish candidate/report without activation and stop for Architect review."
      required: true
  authoritative_verification:
    required: false

