  status: RESOLVED
  source: "Existing AppKit menu-bar implementation plus RuntimePolicy."
  rationale: "Revision 17 is source-only. It corrects presentation without changing lifecycle authority or backend behavior."

objective: "Restore the established Agent Runtime menu-bar glyph, use green/red tint for serving state, keep a stable single Start/Stop action slot, and place the popover status indicator at the trailing edge while preserving all accepted revision-15 behavior."

