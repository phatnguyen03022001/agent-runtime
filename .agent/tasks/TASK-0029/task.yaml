  - "Do not modify agent_runtime protection/server behavior, Runtime backend/lifecycle semantics, public MCP contract, tunnel identity, connector/app binding, .env authority, desired-state semantics, port ownership or session-capacity semantics."
  - "Do not redesign the app into another framework or add a second lifecycle/control path."
  - "Do not perform manual Runtime lifecycle actions beyond the single existing installer-driven cutover authorized after confirmation."
  - "Do not bypass, reset, edit or otherwise work around macOS TCC/Accessibility databases or privacy protections."
  - "Do not modify TASK-0030 artifacts."
  - "Do not create branches/worktrees/clones, force-push, promote main, tag or release."

