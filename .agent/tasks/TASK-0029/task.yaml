    - ".agent/tasks/TASK-0029/report.yaml"

invariants:
  - "The revision-9 protected-runtime classifier correction and all non-UI Runtime/protection semantics remain unchanged by revision 11."
  - "The exact public MCP surface remains terminal_exec, terminal_start, terminal_poll and terminal_control."
  - "Secure MCP Tunnel identity and accepted fingerprint remain unchanged; checkout-local .env remains current authority for TASK-0029 and its secret values must not be printed or rotated."
  - "Desired state remains RUNNING before and after the single authorized activation."
  - "Exactly one canonical Runtime/tunnel tree may serve 127.0.0.1:8080 after cutover; foreign or ambiguous ownership fails closed."
  - "Lifecycle enablement remains derived from RuntimePolicy/RuntimeStatus; presentation code must not invent an independent lifecycle policy."
  - "TASK-0030 remains frozen historical evidence until TASK-0029 reaches final ACCEPTED."
  - "No branch, worktree, clone, alternate checkout, dependency, daemon, service, container, database, queue, scheduler, control plane or architecture is introduced."
  - "main, tags, releases, sibling repositories and unrelated services remain unchanged."

forbidden_changes:
