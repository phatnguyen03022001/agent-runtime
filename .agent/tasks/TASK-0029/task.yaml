    - "Popover header spans the full content width: title leading, single status indicator trailing at the right content edge."
    - "Popover keeps one full-width lifecycle-button slot visible at all times so layout does not collapse. RuntimePolicy remains authoritative: owned shows enabled Stop; stopped shows enabled Start; external/ambiguous show visible Stop but disabled. Do not enable an action when RuntimePolicy forbids it."
    - "Do not expose Restart in the popover."
    - "Preserve two-column facts with values right-aligned at the right content edge, compact spacing, secondary Quit, bounded protection history, accepted app icon/audio resources and one-shot offline audio behavior."
    - "Add focused deterministic tests proving menu-bar glyph preservation, green/red tint mapping, full-width trailing header indicator, persistent Start/Stop slot, correct enabled/disabled mapping, and existing bounded audit behavior."
    - "Run applicable Swift tests/build, protection tests, full repository verification, package/codesign, exact four-tool MCP contract and bounded diff checks."
    - "Publish candidate and report non-force to dev, then stop for Architect review. Do not install or activate the candidate in revision 17."
    - "Do not modify TASK-0030."

