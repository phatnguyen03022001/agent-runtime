    - id: CHECK-3
      command_or_check: "Run ./verify, Swift tests, release build/package/signature, shell syntax/diff checks, exact four-tool surface proof, dependency inspection, and static proof of no remote/public lifecycle control surface or tunnel-identity regression."
      required: true
