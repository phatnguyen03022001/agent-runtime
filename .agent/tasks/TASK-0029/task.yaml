    evidence_required: "Pre-reconciliation hashes prove no WIP loss; source/test superset is present in /Users/tienphat/Developer/agent-runtime; git worktree list contains only that canonical checkout; prior /private/tmp, ~/.codex/worktrees, and /Users/tienphat/Developer/.agent-worktrees registrations/directories for agent-runtime are removed or absent; git worktree prune is clean; no replacement worktree/clone was created."
  - id: AC-12
    requirement: "The native menu-bar app is actually usable immediately after install/update."
    evidence_required: "Live current-login acceptance proves exactly one AgentRuntimeMenuBar process/registration is available without logout/reboot, the status item/popover opens, status reflects the real Runtime, Start/Stop/Restart availability follows policy, click-outside dismissal works, error presentation is bounded, and app launch/refresh does not mutate desired state."
  - id: AC-13
