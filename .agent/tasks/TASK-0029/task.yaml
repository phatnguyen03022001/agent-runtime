acceptance_criteria:
  - id: AC-1
    requirement: "Agent Runtime is a true singleton under concurrent start pressure."
    evidence_required: "Deterministic concurrency test with at least 10 simultaneous start attempts proves one canonical serving instance, no duplicate tunnel/MCP process, stable canonical identity, and stable protected-port ownership semantics."
  - id: AC-2
    requirement: "Desired RUNNING is self-healing while explicit STOPPED remains stopped."
    evidence_required: "Fixture/integration proof plus one bounded live acceptance show accidental canonical Runtime death recovers automatically to exactly one instance, while explicit operator Stop suppresses restart until explicit Start."
  - id: AC-3
    requirement: "Menu bar is the normal intentional lifecycle authority and exposes clear protected-runtime status."
    evidence_required: "Swift tests/build and bounded app inspection prove explicit Start/Stop/Restart semantics, no silent desired-state changes, and visible singleton/protection/warning status."
  - id: AC-4
    requirement: "Agent Runtime cannot use its own terminal tools to destroy or rebind the protected Runtime."
    evidence_required: "Focused tests prove direct kill/signal, matching pkill/killall, canonical launchd stop/bootout if applicable, and protected-port destructive attempts are denied with stable PROTECTED_RUNTIME-style evidence, while ordinary terminal commands continue to work."
  - id: AC-5
    requirement: "Stale and foreign process handling is safe."
    evidence_required: "Tests and live proof show foreign/ambiguous 8080 remains fail-closed; stale fixture provenance and non-serving state are positively proven before removal; the canonical unsupervised Runtime is positively proven before one controlled cutover; STOPPED remains STOPPED through migration; explicit Start establishes exactly one supervised canonical instance; rerunning migration is idempotent."
  - id: AC-6
    requirement: "Tunnel identity remains stable and split-brain cannot regress."
    evidence_required: "Profile/.env/static/startup proof shows one canonical profile-file identity owner, unchanged tunnel fingerprint across supervised recovery/restart, no legacy .env selectors, and no connector/tunnel/key recreation."
  - id: AC-7
    requirement: "Protection/audit is bounded and truthful."
    evidence_required: "Inspection proves bounded storage/no database/no secret leakage, menu-bar warning reflects denied attempts, and documentation explicitly states the enforcement boundary does not defeat root/sudo or malicious out-of-band administrators."
  - id: AC-8
    requirement: "Existing runtime contract remains compatible."
    evidence_required: "./verify passes, exact four-tool surface is unchanged, ordinary terminal execution tests pass, no unrelated Python runtime semantics or dependencies change, and release Swift build/package/signature checks pass."
  - id: AC-9
    requirement: "Install/update is idempotent and does not create duplicate services or instances."
    evidence_required: "Repeated isolated install/package/migration verification proves one canonical launchd/supervisor registration, one menu-bar app, no duplicate Runtime, no mutation of unrelated services, and fixture tests cannot register or overwrite the production Runtime launchd label."
  - id: AC-10
    requirement: "Publication is bounded and reconstructible."
    evidence_required: "Task/report validation, exact changed-path/dependency proof, candidate/report direct lineage, non-force dev publication, final dev proof, unchanged main proof, and clean worktree."

