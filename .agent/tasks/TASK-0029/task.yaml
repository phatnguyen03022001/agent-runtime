  - "Do not mutate tunnel identity, connector/app binding, Runtime/API keys, checkout-local .env authority, desired-state semantics, or protected endpoint ownership."
  - "Do not weaken protection by treating all lsof-containing shell text as safe when the command composition can still perform a protected lifecycle or rebind action."
  - "Do not bypass or alter macOS TCC/Accessibility configuration."
  - "Do not modify TASK-0030 artifacts."
