structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime/protection.py and existing protection regression tests."
  rationale: "Revision 9 is a narrow classifier correction. No new service, daemon, privilege boundary, parser framework, dependency, configuration axis, or architecture is authorized."

objective: "Correct the TASK-0029 protected-port classifier so ordinary read-only inspection of 127.0.0.1:8080 is allowed while commands that can terminate, free, replace, rebind, or lifecycle-mutate the canonical Runtime/port remain denied; produce a deterministic candidate without interrupting the live Runtime."

scope:
  required_changes:
    - "Fresh-bind TASK-0029 revision 9 at the exact handoff base. Prove current dev/main identity, revision-8 report/review lineage, canonical single-checkout topology, and that TASK-0030 remains historical only."
    - "Reproduce the revision-8 false-positive deterministically against the current protection classifier before the fix: a literal read-only listener inspection using lsof for TCP 8080 must be shown to classify as protected_port_lifecycle or otherwise be denied by the current implementation."
    - "Apply the smallest existing-component correction so read-only lsof inspection of the protected listener is not denied merely because it mentions lsof and 8080."
    - "Preserve protection for commands and shell compositions that materially signal/terminate canonical processes, lifecycle-mutate the canonical launchd service, free the protected listener, or bind/rebind 127.0.0.1:8080. The correction must not turn lsof-derived PID selection into a bypass for a following destructive action."
    - "Add focused regression evidence that covers direct read-only lsof, shell-wrapped read-only lsof, and representative destructive compositions involving lsof-derived protected-port/process targeting. Ordinary health/read-only inspection must remain usable; protected lifecycle/rebind behavior must remain fail-closed."
    - "Run the focused protection tests and the repository's full deterministic verification. Run any syntax/compile checks already required by the repository for the touched Python code."
    - "Do not install/update/reload the live Agent Runtime and do not Stop, Restart, kill, signal, replace, rebind, or otherwise lifecycle-transition the serving Runtime/tunnel/MCP tree in revision 9. This revision produces a source candidate only; live activation is operator-controlled and belongs to later closure after Architect review."
    - "Do not attempt to bypass macOS TCC or weaken native UI acceptance. Record the existing UI/AX blocker as remaining closure evidence only; revision 9 does not waive AC-2 from the prior closure contract."
    - "Publish the revision-9 report non-force to dev and stop for Architect review. TASK-0029 remains not finally accepted until a later closure proves the activated candidate through live MCP and native UI/AX evidence."
  allowed_existing_files_or_components:
    - "agent_runtime/protection.py"
    - "existing protection tests under tests/"
    - "verify"
    - ".agent/tasks/TASK-0029/report.yaml"

invariants:
  - "The live serving Runtime/tunnel/MCP tree is operator-only lifecycle infrastructure and must remain uninterrupted throughout revision 9."
  - "No acceptance action may knowingly cause reconnect/cutover for other active chats."
  - "Secure MCP Tunnel identity, checkout-local .env authority, exact four-tool surface, installed-runtime source independence, singleton semantics, desired RUNNING semantics, configured session capacity, and protected endpoint 127.0.0.1:8080 remain unchanged."
  - "Read-only observability is not a protected lifecycle mutation; destructive composition using observability output must still be denied."
  - "TASK-0030 remains frozen historical evidence and is not resumed or modified."
  - "No branch, worktree, clone, alternate checkout, dependency, daemon, service, container, database, queue, scheduler, or control plane is introduced."
  - "main, tags, releases, sibling repositories, and unrelated services remain unchanged."

forbidden_changes:
