revision_2:
  supersedes_historical_revision_1_delivery_mechanics: true
  historical_revision_1_must_not_be_restored: true
  executor_fit: FIT
  rationale: >-
    Exact remote compare-and-swap publication and the native mutation-chain proof form one
    coherent independently reviewable outcome. Capability registry, doctor, and cutover
    remain separate successor outcomes.

objective: >-
  Harden repo_publish so publication of one exact direct-child commit to fixed origin uses
  an explicit expected-old remote compare-and-swap lease, while preserving the existing
  public API and bounded consequence model. Prove the complete native mutation chain from
  fs_write/fs_patch through repo_publish on a disposable Git fixture.

scope:
  expected_files_are_restrictive: false
  required_changes:
    - >-
      Change repo_publish publication from an unguarded single-ref push to one exact
      expected-old lease bound to refs/heads/<branch>:<expected_remote_head>.
    - >-
      Preserve exact local-candidate, branch/upstream, clean-state, operation-state,
      commit-existence, and sole-direct-child preconditions.
    - >-
      Refresh mutable local and remote state at the publication consequence boundary,
      push exactly one destination ref with the exact expected-old lease, and freshly
      observe remote state after any push attempt before classification.
    - >-
      Add bounded focused proof for stale state, publication races, replay, rejected pushes,
      transport ambiguity, lineage rejection, exact push authority, and the end-to-end
      native mutation chain.
    - >-
      Update publication documentation only if required to keep the public contract accurate.
  allowed_existing_files_or_components:
    - agent_runtime/repo_publish.py
    - tests/test_repo_publish.py
    - tests/test_repo_publish_mcp.py
    - tests
    - README.md
    - .agent/tasks/TASK-0135/report-r2.yaml

invariants:
  - "Canonical repository topology remains MAIN_ONLY; branch is main."
  - "repo_publish public input remains exactly cwd, branch, expected_remote_head, commit."
  - "commit remains the exact local publication candidate and must equal current local HEAD."
  - "Do not add expected_local_head or any compatibility alias."
  - "ToolContract Kernel v1 is unchanged."
  - "ReceiptV1 semantics are unchanged."
  - "No publication receipt is added; Git commit SHA plus fresh exact remote ref identity remain sufficient composition evidence."
  - "The publication commit must have exactly one parent and that parent must equal expected_remote_head."
  - "The expected-old lease authorizes only exact remote CAS; it does not authorize arbitrary force push or history rewriting."
  - "No fetch is introduced."
  - "No generic shell mutation surface is added."
  - "Exact public MCP surface remains 18 tools in the accepted order."
  - "screen_capture remains governance-blocked."
  - "repo_stage, repo_diff, and repo_commit semantics remain unchanged."

publication_contract:
  required_push_authority:
    lease: "--force-with-lease=refs/heads/<branch>:<expected_remote_head>"
    refspec: "<commit>:refs/heads/<branch>"
    destination_refs: 1
  forbidden_authority:
    - "--force"
    - "-f"
    - "bare --force-with-lease"
    - "+refspec"
    - arbitrary remote
    - arbitrary refspec
    - multi-ref publication
    - tags
    - mirror
    - history rewrite
  preconditions:
    - "cwd is the exact repository root inside workspace."
    - "current branch equals requested branch."
    - "upstream equals origin/<branch>."
    - "local HEAD equals commit."
    - "local tracking origin/<branch> equals expected_remote_head before publication."
    - "commit exists locally."
    - "commit has exactly one parent equal to expected_remote_head."
    - "working tree/index satisfy the existing repo_publish clean-state contract."
    - "no conflicting or in-progress Git operation exists."
  remote_observation:
    normal_before: "remote_before == expected_remote_head"
    replay_before: "remote_before == commit"
    replay_rule: "Return already_published without another push after fresh observation."
  consequence_boundary:
    - "Immediately before publication refresh every mutable local predicate required by the contract."
    - "Freshly observe the fixed origin branch before publication."
    - "Push exactly one destination ref using the exact expected-old lease."
    - "Do not automatically retry."
    - "Freshly observe the fixed origin branch after any push attempt before classifying consequence."
  outcomes:
    success: "remote_after == commit"
    transport_ambiguity_success: >-
      A transport error may be classified as success only when fresh post-attempt remote
      observation independently proves remote_after == commit.
    push_failed: >-
      If publication fails and fresh remote_after remains expected_remote_head, return the
      existing bounded PUSH_FAILED failure.
    remote_conflict: >-
      If fresh remote_after is an unexpected third commit, return the existing deterministic
      remote-state conflict behavior and leave that remote history untouched.
    publication_ambiguous: >-
      If post-attempt remote state cannot be established, return PUBLICATION_AMBIGUOUS.

bootstrap_publication:
  rule: >-
    TASK-0135 hardens repo_publish itself. Do not require the not-yet-implemented exact-lease
    behavior as a precondition for publishing the implementation commit or Executor report.
    Use the currently accepted bounded repo_publish capability available at execution time,
    under its existing direct-child and expected-state guards.
  after_publication: >-
    The new exact-CAS behavior must be exercised and proven on disposable fixtures before
    Architect acceptance. Do not invent a second publication mechanism.

acceptance_criteria:
  - id: AC-1
    requirement: "repo_publish public API and output schema remain unchanged."
    evidence_required: "MCP contract/schema tests prove exact four-field input and unchanged closed success/error shapes."
  - id: AC-2
    requirement: >-
      The single publication push contains exactly
      --force-with-lease=refs/heads/<branch>:<expected_remote_head> and exactly one
      <commit>:refs/heads/<branch> refspec.
    evidence_required: >-
      Focused argv-level proof shows the exact lease and one refspec, with no unguarded push,
      arbitrary force authority, +refspec, extra destination ref, tags, mirror, or alternate remote.
  - id: AC-3
    requirement: >-
      Local publication remains bound to current branch/upstream, current HEAD == commit,
      clean repository state, and a sole direct-child commit whose parent is expected_remote_head.
    evidence_required: >-
      Focused negative proofs reject two-commit publication, merge commits, local state drift,
      dirty/conflicted/in-progress state, and mismatched branch/upstream/HEAD.
  - id: AC-4
    requirement: >-
      Remote compare-and-swap is race-safe and consequence classification is based on fresh
      post-attempt remote observation.
    evidence_required: >-
      Focused proofs cover stale remote before push, a race between observation and push
      without overwrite, successful fresh postcondition, exact replay without a second push,
      rejected remote push as bounded PUSH_FAILED, unexpected third-commit conflict, transport
      ambiguity recovered only by exact remote proof, and unobservable post-push state as
      PUBLICATION_AMBIGUOUS.
  - id: AC-5
    requirement: "repo_publish introduces no fetch and performs no automatic retry."
    evidence_required: "Focused call/argv assertions prove no fetch path and at most one push attempt per invocation."
  - id: AC-6
    requirement: >-
      One bounded disposable Git fixture proves fs_write or fs_patch -> repo_stage ->
      repo_diff(staged ReceiptV1) -> repo_commit -> exact Git commit SHA -> repo_publish
      exact expected-old CAS -> fresh remote == commit.
    evidence_required: "End-to-end reproducible test using only disposable repositories; never the live agent-runtime repository."
  - id: AC-7
    requirement: >-
      Existing repo_stage, repo_diff ReceiptV1, repo_commit, exact 18-tool MCP surface,
      and screen_capture governance block remain green.
    evidence_required: "Focused regression suites plus canonical ./verify."
  - id: AC-8
    requirement: "Canonical local ./verify completes with zero failures."
    evidence_required: "Observed local verifier result and exact test totals recorded in Executor report."

