objective: >-
  Harden repo_publish so the remote branch update is exact expected-old compare-and-swap,
  closing the observation-to-push race while preserving the existing direct-child publication
  contract and the accepted eighteen-tool public MCP surface. Prove the complete native mutation
  chain from bounded filesystem mutation through staged receipt, commit identity, and exact remote
  publication.

architecture:
  chain: >-
    fs_patch/fs_write -> repo_stage -> repo_diff(staged ReceiptV1) -> repo_commit
    -> Git commit SHA -> repo_publish exact expected-old remote CAS.
  invariants:
    - "Runtime and task authority remain separate."
    - "The existing public repo_publish input field commit remains the exact expected local HEAD; do not add a duplicate expected_local_head field."
    - "Current local branch equals requested branch and upstream equals origin/<branch>."
    - "Current local HEAD equals commit."
    - "Local origin/<branch> tracking observation equals expected_remote_head before publication."
    - "commit is the sole direct child of expected_remote_head."
    - "Working tree/index cleanliness and operation-state guards remain at least as strict as the accepted contract."
    - "Live remote observation before publication equals expected_remote_head unless the same commit is already published."
    - "The push itself carries an exact expected-old lease for refs/heads/<branch> at expected_remote_head."
    - "A remote ref change between observation and push must fail closed without overwriting the newer remote history."
    - "Fresh live remote observation after publication must equal commit before success is returned."
    - "Exact expected-old lease is CAS protection only; it never grants arbitrary force-push or history-rewrite authority."
    - "Do not add a repo_publish ReceiptV1; Git commit SHA plus fresh remote ref identity are already authoritative composition evidence."
    - "ToolContract Kernel v1, ReceiptV1 semantics, repo_stage, repo_diff, repo_commit, and public tool count remain unchanged."

repo_publish:
  implementation_path: agent_runtime/repo_publish.py
  public_schema:
    change: false
    request_fields:
      - cwd
      - branch
      - expected_remote_head
      - commit
    note: >-
      commit already denotes the exact local publication candidate and is required to equal local HEAD.
      Do not rename it or introduce a compatibility alias in this task.

  preconditions:
    - "cwd is the exact repository root inside workspace."
    - "Repository is non-bare, attached, clean, conflict-free, and has no merge/rebase/cherry-pick/bisect in progress."
    - "Current branch equals requested branch."
    - "Configured upstream equals origin/<branch>."
    - "Current HEAD equals commit."
    - "Local tracking ref origin/<branch> resolves exactly expected_remote_head."
    - "commit exists locally and is exactly one-parent direct child of expected_remote_head."
    - "Fresh fixed-origin ls-remote observation equals expected_remote_head, unless it already equals commit for exact replay."

  publication:
    git:
      executable: /usr/bin/git
      shell: false
      remote: origin
      exact_lease: "--force-with-lease=refs/heads/<branch>:<expected_remote_head>"
      exact_refspec: "<commit>:refs/heads/<branch>"
    required_argv_properties:
      - "Use exactly one named destination branch ref."
      - "Include exact expected-old --force-with-lease=refs/heads/<branch>:<expected_remote_head>."
      - "Do not use bare --force-with-lease or --force-with-lease=<ref> without the explicit expected SHA."
      - "Do not use --force, -f, a '+' refspec, --mirror, --all, --tags, --delete, or arbitrary push options."
      - "Keep hooks disabled and recurse-submodules disabled as in the accepted contract."
      - "Do not fetch, pull, merge, rebase, reset, checkout, stash, clean, or invoke generic shell."
    semantics:
      - "The lease is the authoritative remote compare-and-swap guard at update time."
      - "Direct-child lineage remains independently mandatory, so the lease cannot authorize non-fast-forward history rewriting."
      - "No credential material may be accepted through MCP input or emitted in results/errors."
      - "No retry is performed automatically."

  race_and_result:
    - "If the remote changes after pre-observation but before the push update, the lease must reject the update."
    - "After any attempted push, perform fresh bounded remote observation before classifying the result."
    - "remote_after == commit => published success, including transport ambiguity where exact publication is independently proven."
    - "remote_after == expected_remote_head after failed push => bounded PUSH_FAILED remains valid."
    - "remote_after is another commit => fail REMOTE_HEAD_MISMATCH or the existing equivalent deterministic state-drift code; never claim publication."
    - "Post-observation failure after a push attempt remains PUBLICATION_AMBIGUOUS."
    - "Exact replay where the remote already equals commit performs no second push."

  public_surface:
    tool_count: 18
    order_change: false
    input_schema_change: false
    output_schema_change: false
    annotation_change: false

documentation:
  path: README.md
  requirement: >-
    Update only the repo_publish description needed to state exact expected-old remote CAS semantics
    while preserving repository/task authority outside Runtime and the existing public surface description.

tests:
  canonical_baseline: 615
  required_existing_updates:
    - tests/test_repo_publish.py
    - tests/test_repo_publish_mcp.py
  required_new_files:
    - tests/test_native_mutation_chain.py

  repo_publish_proofs:
    - "Push argv contains exact --force-with-lease=refs/heads/<branch>:<expected_remote_head>."
    - "Push argv contains exactly one commit:refs/heads/<branch> refspec."
    - "No plain unguarded push path exists."
    - "No --force, -f, '+' refspec, bare lease, mirror/all/tags/delete authority exists."
    - "Local tracking ref must equal expected_remote_head."
    - "Existing sole-direct-child, two-commit-range, merge-commit, dirty-state, detached, branch/upstream, and replay guards remain green."
    - "Remote stale before push fails without push."
    - "Remote race after pre-observation fails lease and does not overwrite raced remote history."
    - "Successful publication fresh-observes remote_head_after == commit."
    - "Rejected push with unchanged remote remains bounded PUSH_FAILED."
    - "Transport ambiguity resolves to success only when fresh remote observation proves commit."
    - "Unobservable post-push state remains PUBLICATION_AMBIGUOUS."
    - "No fetch is introduced."

  native_chain_proof:
    - "Use a bounded disposable Git fixture; never the live agent-runtime repository."
    - "Exercise at least one accepted fs_write or fs_patch mutation."
    - "Stage the exact candidate with repo_stage."
    - "Obtain/verify repo_diff(staged) ReceiptV1."
    - "Commit exactly that receipt-authorized staged state with repo_commit."
    - "Verify the resulting Git commit SHA has the expected parent."
    - "Publish that exact commit with repo_publish using expected-old lease CAS."
    - "Fresh remote observation equals the published commit."
    - "No extra receipt layer is invented for publication."

  regression_proofs:
    - "repo_stage focused suite remains green."
    - "repo_diff receipt suite remains green."
    - "repo_commit focused and MCP suites remain green."
    - "Exact eighteen-tool surface remains unchanged."
    - "screen_capture remains VISUAL_PERCEPTION_BLOCKED."
    - "Agent Runtime Verify runs more than 615 tests with zero failures."

