  proof_executor:
    type: CHATGPT_LOCAL
    native_tool: Agent Runtime MCP direct
    authority:
      - direct_live_mcp_acceptance_only
      - task_owned_harmless_process_workloads_only
    repository_writer: false
    live_runtime_lifecycle_writer: false
    remote_desktop_commander_allowed: false
    alternate_mcp_client_allowed: false
    delegation: forbidden
  handoff_protocol: >-
    Control Executor performs Phase A and stops with a valid schema-5 PENDING transaction at
    LIVE_PROOF_REQUIRED. Operator carries the exact bounded checkpoint into one fresh proof Executor.
    Proof Executor returns structured DIRECT_MCP_PROOF_PASS, DIRECT_MCP_PROOF_EXTERNAL_GAP, or
    OPERATOR_INPUT_REQUIRED evidence only. Operator then carries that proof result back into the SAME
    control Executor session. Control Executor must attribute it as OPERATOR_SUPPLIED_DIRECT_MCP_EVIDENCE,
    revalidate all mutable live predicates itself, and may commit only if the proof satisfies this task.

