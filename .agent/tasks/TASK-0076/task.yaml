  - "Do not invoke cutover more than once or commit-cutover more than once."
  - "Do not invoke rollback, resume, recover, reinstall, repair, bootstrap, uninstall, a second cutover or a second commit."
  - "Do not manually start, stop, restart, reload, signal, kickstart, bootout, register, unregister or repair Runtime/tunnel/ServiceManagement/launchd outside effects owned by the one canonical cutover."
  - "Proof Executor must not use Remote Desktop Commander or an alternate/local MCP client."
  - "Control Executor must not substitute Remote Desktop Commander/local stdio for direct MCP proof."
  - "Do not import installed agent_runtime from a host Python diagnostic process or create bytecode in the signed bundle."
