    - "Resolve /bin/launchctl, current UID, /opt/homebrew/bin/tunnel-client and exact candidate paths. Require the canonical prebuilt cutover path can bind these exact authorities without starting a second tunnel client."
    - "Invoke exactly once: ./install.sh --install-prebuilt <exact candidate app> <exact candidate handoff>. No retry is authorized."
    - "Treat any command failure, PARTIAL result, AWAITING_APPROVAL result, unexpected transaction schema/status/phase, or failure to converge to a healthy new generation as a blocker. Do not invoke rollback, resume, recover, repair, reinstall, a second cutover, manual launchctl repair, or manual tunnel startup. Preserve transaction evidence and stop at ARCHITECT_REVIEW/OPERATOR_INPUT_REQUIRED as appropriate."
    - "After successful cutover, require schema-5 transaction status PENDING with the expected accepted candidate binding and an installed app that validates exactly against the transaction/candidate handoff. Require strict deep codesign PASS and installed runtime-manifest revision e6365f9...."
    - "Require the new live Runtime/tunnel generation to converge without manual repair to one canonical listener on 127.0.0.1:8080 with /healthz=200 and /readyz=200. Record bounded non-secret process/generation identity."
    - "Re-prove runtime.env mode/SHA and desired-state mode/SHA are byte-identical to pre-cutover values unless the canonical cutover contract explicitly owns a documented change. Any unexplained drift blocks commit."
    - "Prove there are zero .pyc files and no agent_runtime/__pycache__ directory inside the installed signed Runtime package after the new generation becomes healthy. Never import the installed Runtime from a host diagnostic process."
    - "Use Agent Runtime MCP directly for live acceptance. Do not substitute Remote Desktop Commander, local stdio Python, curl, another MCP client, or a nested agent for the direct MCP proof."
    - "Require the direct live MCP public surface to expose exactly six tools: terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer, fs_read_batch."
    - "Run one benign direct capacity_observer call and require bounded schema_version=1 output with capacity_parallelism_ceiling <=6 and no process-history payload."
    - "Run one benign direct fs_read_batch against a repository text file under the authorized workspace and require bounded successful read semantics without candidate/installed-app mutation."
    - "Run one benign direct terminal_exec using literal argv and a non-mutating command; require exit_code=0 and truthful bounded result."
    - "Run one bounded direct terminal_start -> terminal_poll -> terminal_control terminate lifecycle using only a task-owned harmless sleep process. Require truthful session state and cleanup."
    - "Attempt one bounded x6 live heavy proof only through direct Agent Runtime MCP: hold up to six task-owned harmless heavy workloads simultaneously, then if all six are admitted attempt one seventh heavy call and require stable capacity failure before target workload creation. While x6 is held, issue capacity_observer and fs_read_batch and require responsiveness. Clean up every test-owned workload exactly."
    - "If the ChatGPT/platform tool-safety layer prevents reaching x6 before Runtime receives the calls, record the platform guard as EXTERNAL_GAP with exact observed call count. Do not evade it, use alternate clients, retry repeatedly, or manufacture x6 evidence. This external guard alone does not invalidate the already accepted TASK-0057/TASK-0059 deterministic x6 envelope; all required six-tool live smoke checks above must still pass."
    - "If the direct Agent Runtime MCP namespace is unavailable after cutover due connector/reload state, do not fake the proof and do not commit. Leave the valid PENDING transaction intact and return OPERATOR_INPUT_REQUIRED with instructions to reconnect/reload the same Agent Runtime plugin, then continue from the exact checkpoint without repeating cutover."
    - "After all direct MCP probes, re-run strict deep codesign and canonical installed-candidate validation. Require exact candidate SHA 8ba16e69..., revision/tree/lock binding, zero PYC drift, preserved config/desired-state identity, singleton listener, healthz=200 and readyz=200."
    - "Only if every mandatory gate passes, invoke exactly once: ./install.sh --commit-cutover. No retry is authorized."
    - "Require COMMITTED semantics and transaction directory absence after commit. Do not invoke commit-cutover a second time for confirmation."
    - "After commit, prove installed candidate validation and strict deep codesign still PASS; installed runtime revision remains e6365f9...; runtime.env and desired-state remain preserved; zero PYC drift remains; one canonical listener remains; healthz/readyz remain 200."
    - "Perform three bounded post-commit stability observations separated by short waits. Require the same accepted generation identity, one listener, green health/readiness, exact candidate validation and no transaction reappearance or installed drift."
    - "Fresh-resolve dev/main, require main unchanged, publish only .agent/tasks/TASK-0076/report.yaml non-force as the report-only direct child, and stop at ARCHITECT_REVIEW."

