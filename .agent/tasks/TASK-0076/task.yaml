      invocation_count_max: 1
    transaction_commit:
      canonical_command: "./install.sh --commit-cutover"
      invocation_count_max: 1
    repository_publication:
      - ".agent/tasks/TASK-0076/report.yaml"
  proof_executor:
    direct_mcp_test_workloads:
      max_simultaneous_heavy: 6
      seventh_probe_max: 1
      ownership: task_owned_harmless_only
      cleanup_required: true

