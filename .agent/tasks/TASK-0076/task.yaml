objective: >-
  Use one control Executor to install the exact retained TASK-0075 candidate through one canonical
  transactional cutover and preserve a valid PENDING rollback envelope. Use a separate direct Agent
  Runtime proof Executor to validate the installed generation's exact six-tool MCP behavior without
  giving that proof context lifecycle or repository mutation authority. Return the proof to the same
  control Executor, revalidate integrity/config/health, commit exactly once only if all mandatory gates
  pass, prove three bounded post-commit stability observations, publish one report-only commit and stop
  at ARCHITECT_REVIEW. Do not claim final system freeze.

phases:
  phase_a_control_cutover:
    owner: control_executor
    required:
      - "Fresh-resolve GitHub dev, origin/dev and local HEAD; require all equal exact TASK-0076 revision-2 planning base and require a clean designated working tree."
      - "Fresh-confirm main remains c49d777efa09db7f6c51bd8d8616db4623499fb8."
      - "Fresh-read TASK-0075 review and require ACCEPTED, source_freeze_ready=true and exact candidate 8ba16e69...."
      - "Require cutover transaction path absent and not a symlink."
      - "Fresh canonical candidate/handoff validation: exact candidate SHA, source revision/tree/lock, handoff SHA, strict deep codesign, TeamIdentifier digest, session.py SHA and protection.py SHA. Candidate bytes must remain immutable."
      - "Fresh predecessor proof: installed revision b5ac0ed5..., strict deep codesign PASS, singleton canonical listener, healthz=200, readyz=200, bounded ServiceManagement/launchd ownership observation."
      - "Record runtime.env mode/full-file SHA without printing values; require mode 0600, exactly one active-sessions=6 target entry and exactly one parallelism=6 target entry with no duplicates/malformed target entries."
      - "Record desired-state marker presence/mode/SHA and require RUNNING; preserve exact bytes."
      - "Resolve exact candidate paths, /bin/launchctl, UID and /opt/homebrew/bin/tunnel-client; do not start a second tunnel."
      - "Invoke exactly once: ./install.sh --install-prebuilt <exact candidate app> <exact candidate handoff>. No retry."
      - "Any failure/PARTIAL/AWAITING_APPROVAL/unexpected transaction or health convergence blocks. Do not rollback/resume/recover/repair/reinstall/retry/manual-start."
      - "After successful cutover require schema=5, status=PENDING, expected candidate binding, installed canonical validation PASS, strict deep codesign PASS, installed runtime revision e6365f9..., singleton listener, healthz=200, readyz=200."
      - "Re-prove runtime.env and desired-state byte identities, zero installed .pyc and no agent_runtime/__pycache__."
      - "Stop at LIVE_PROOF_REQUIRED. Do not commit-cutover yet. Emit one bounded checkpoint bundle for the proof Executor containing only non-secret transaction/candidate/generation facts."
  phase_b_direct_mcp_proof:
    owner: proof_executor
    required:
      - "Use Agent Runtime MCP directly only. Do not use Remote Desktop Commander, shell outside Runtime, local stdio Python, curl, alternate MCP client or nested executor."
      - "Accept the operator-supplied LIVE_PROOF_REQUIRED checkpoint and require candidate 8ba16e69..., runtime revision e6365f9..., transaction schema=5/PENDING and control mutation counts install=1/1 commit=0/1."
      - "Require the direct public MCP surface to expose exactly terminal_exec, terminal_start, terminal_poll, terminal_control, capacity_observer and fs_read_batch."
      - "Run one benign direct capacity_observer call and require bounded schema_version=1 output with ceiling <=6 and no process-history payload."
      - "Run one benign direct fs_read_batch against a repository text file under the authorized workspace."
      - "Run one benign direct terminal_exec literal-argv non-mutating command and require exit_code=0."
      - "Run one task-owned harmless terminal_start -> terminal_poll -> terminal_control terminate lifecycle and prove exact cleanup."
      - "Attempt one bounded x6 direct live proof: hold up to six task-owned harmless heavy workloads; if six are admitted, attempt exactly one seventh heavy call and require capacity failure before target workload creation; while x6 is held, require capacity_observer and fs_read_batch responsiveness; clean every task-owned workload exactly."
      - "If ChatGPT/platform safety prevents reaching six before Runtime receives the calls, report DIRECT_MCP_PROOF_EXTERNAL_GAP with exact observed admitted/call count. Do not evade, retry loops, use alternate clients or manufacture evidence. Accepted TASK-0057/TASK-0059 deterministic x6 evidence remains supporting evidence."
      - "If direct Agent Runtime MCP is unavailable due connector/reload state, return OPERATOR_INPUT_REQUIRED_CONNECTOR. Do not attempt lifecycle repair."
      - "Return a structured proof packet only. Do not write repository files, run git mutations, cutover, commit, rollback, resume, recover, repair, reinstall, start/stop/restart/reload/signal Runtime/tunnel, or mutate config/candidate/installed bytes."
  phase_c_control_commit:
    owner: control_executor
    required:
      - "Resume the SAME control Executor session. Do not repeat cutover."
      - "Receive the proof packet from the operator and record provenance as OPERATOR_SUPPLIED_DIRECT_MCP_EVIDENCE. Do not claim control-session direct observation of proof-plane calls."
      - "Require exact-six-tool smoke PASS. An x6 EXTERNAL_GAP is acceptable only if caused by platform safety with no evasion and all mandatory six-tool smoke checks/cleanup passed."
      - "Freshly re-prove transaction schema=5/PENDING and exact candidate binding before any commit action."
      - "Freshly re-prove strict deep codesign, canonical installed-candidate validation at 8ba16e69..., revision/tree/lock, zero PYC drift, preserved runtime.env/desired-state, singleton canonical listener, healthz=200 and readyz=200."
      - "Only if every mandatory gate passes invoke exactly once: ./install.sh --commit-cutover. No retry."
      - "Require COMMITTED semantics and transaction directory absence. Never invoke commit-cutover a second time for confirmation."
      - "After commit re-prove installed candidate validation, strict deep codesign, runtime revision e6365f9..., preserved runtime.env/desired-state, zero PYC drift, singleton listener and 200/200 health/readiness."
      - "Perform three bounded post-commit stability observations separated by short waits. Each must retain exact accepted generation/candidate identity, no transaction reappearance, zero drift, singleton listener and green health/readiness."
      - "Fresh-resolve dev/main, require main unchanged, publish only .agent/tasks/TASK-0076/report.yaml non-force as the report-only direct child, and stop at ARCHITECT_REVIEW."

allowed_mutation:
