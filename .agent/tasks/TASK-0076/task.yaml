acceptance_criteria:
  - id: AC-1
    requirement: "Control preflight proves exact predecessor/config/transaction absence and exact accepted candidate before mutation."
    evidence_required: "Exact refs/clean tree, predecessor identity/codesign/health, candidate/handoff validation and hashes, runtime.env/desired-state identities and exact command bindings."
  - id: AC-2
    requirement: "Exactly one canonical prebuilt cutover installs candidate 8ba16e69... and reaches a healthy PENDING generation without repair."
    evidence_required: "Single cutover/no retry, schema-5 PENDING transaction, installed candidate/codesign/provenance, e6365f9 revision, singleton listener, 200/200 health/readiness, preserved config and zero bytecode drift."
  - id: AC-3
    requirement: "Separate direct proof Executor validates the exact six-tool live MCP contract against the PENDING post-audit generation."
    evidence_required: "Operator-supplied direct-MCP packet with exact six tools plus capacity_observer, fs_read_batch, terminal_exec and bounded terminal_start/poll/control PASS; proof provenance retained; no alternate client."
  - id: AC-4
    requirement: "Fresh x6 live behavior is attempted exactly once without platform-safety evasion and classified truthfully."
    evidence_required: "Either x6 hold + seventh fail-fast + cheap responsiveness + exact cleanup, or platform EXTERNAL_GAP with exact observed limit/no evasion and retained TASK-0057/TASK-0059 supporting evidence."
  - id: AC-5
    requirement: "Control Executor independently revalidates all mutable precommit integrity/configuration/health predicates after proof handoff."
    evidence_required: "PENDING exact transaction, codesign, installed candidate validation, revision/tree/lock, zero PYC, runtime.env/desired-state, singleton listener and 200/200 health/readiness."
  - id: AC-6
    requirement: "Exactly one commit-cutover terminalizes the transaction only after every mandatory gate passes."
    evidence_required: "Single commit/no retry, COMMITTED semantics, transaction absence and zero rollback/resume/recover/repair invocations."
  - id: AC-7
    requirement: "Committed exact generation remains stable and publication is bounded."
    evidence_required: "Three stability observations retain candidate/generation identity, codesign, zero drift, listener/health/readiness; report-only child, clean tree, dev non-force and main unchanged."

verification:
  control_executor_checks:
    - id: CONTROL-PREFLIGHT
      required: true
      command_or_check: "Exact-base/clean-tree, absent transaction, predecessor, candidate, config, desired-state and exact cutover binding proof."
    - id: CONTROL-CUTOVER
      required: true
      command_or_check: "Exactly one canonical install-prebuilt; prove healthy exact PENDING generation then stop LIVE_PROOF_REQUIRED."
    - id: CONTROL-PRECOMMIT
      required: true
      command_or_check: "After proof handoff, fresh transaction/candidate/codesign/config/PYC/listener/health verification."
    - id: CONTROL-COMMIT
      required: true
      command_or_check: "Exactly one commit-cutover; prove transaction terminalized."
    - id: CONTROL-STABILITY
      required: true
      command_or_check: "Three post-commit stability observations plus report-only publication/fresh refs."
  proof_executor_checks:
    - id: PROOF-SIX-TOOLS
      required: true
      command_or_check: "Direct Agent Runtime MCP exact-six-tool smoke with benign calls and one bounded PTY lifecycle."
    - id: PROOF-X6
      required: true
      command_or_check: "Exactly one x6/seventh/cheap-call attempt or truthful platform EXTERNAL_GAP; exact cleanup; no evasion."
  authoritative_verification:
    required: false
    mechanism: "Architect independent review of split-surface control report, direct-MCP proof provenance, transaction terminalization and post-commit live stability."
    expected_signal: "Exact post-audit candidate is the committed healthy live generation and is eligible for final Architect system-freeze judgment."

