    - "If 0.0.14 causes a material readiness, doctor, connector, tool-semantic, or transport regression, use only the pre-proven rollback path through SentinelX, restart once if required, prove exact 0.0.11 health restoration, report BLOCKED/ROLLED_BACK, and do not blind retry the upgrade."
