    - "Use SentinelX for at most one Runtime restart required to adopt the new tunnel binary. Do not reinstall/rebuild/reseal/cut over Agent Runtime."
    - "After restart, prove healthz/readyz, doctor healthy 10/10, Runtime 0.5.0 / b1879b5c..., Kernel 2, 21/20/20 capabilities, ServiceManagement enabled/enabled, transaction absent, strict installed package identity unchanged, and no bytecode contamination."
