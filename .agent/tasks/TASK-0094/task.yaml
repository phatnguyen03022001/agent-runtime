    requirement: "repo_publish is exact public tool 10 with a closed four-field input and truthful annotations."
    evidence_required: "Real MCP listing/order, exact annotations, closed input/output schemas and absence of generic Git/push knobs."
  - id: AC-2
    requirement: "A clean bound direct-child commit publishes exactly once to the existing fixed origin branch."
    evidence_required: "Local bare-origin integration proves expected remote head -> exact commit non-force publication, one ref only, correct post-remote proof and closed result."
  - id: AC-3
    requirement: "Replay and stale-state semantics fail closed."
    evidence_required: "Same-input replay returns already_published without a second push; missing/third remote head, local mismatch, local race and non-direct-child/merge/root/two-commit lineage are rejected."
  - id: AC-4
    requirement: "Publication execution is bounded and cannot become a generic Git/remote surface."
    evidence_required: "Source/tests prove fixed /usr/bin/git, shell=False, fixed origin, exact branch ref, hooks disabled, submodule recursion disabled, no force/tags/multi-ref/arbitrary config or caller transport controls, bounded deadline and sanitized errors."
  - id: AC-5
    requirement: "All pre-existing public-tool contracts and global exact-surface regressions remain correct with exactly ten tools."
    evidence_required: "Focused MCP/conformance/timing/docs suites PASS and tools 1-9 retain exact prior order/annotations/schemas."
  - id: AC-6
    requirement: "The final exact candidate passes canonical verification exactly once."
    evidence_required: "Atomic guard/detached durable evidence proves one physical canonical command, exit 0 and full suite PASS."
  - id: AC-7
    requirement: "Exact verified source content and report are published with truthful lineage."
    evidence_required: "One content-identity implementation commit direct child of TASK-0094 planning commit changes exactly authorized implementation paths; report-only direct child validates; fresh dev/main/lineage closure PASS."
  - id: AC-8
    requirement: "No live lifecycle or unrelated roadmap consequence occurs."
    evidence_required: "No package/install/restart/reload/tunnel/port/main/tag/release/sibling mutation and no Vision/screen capability work."

