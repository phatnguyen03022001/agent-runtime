      command_or_check: "Fresh-bind exact TASK-0094 planning dev/main and require a clean local dev checkout at the exact planning HEAD before implementation mutation."
      required: true
    - id: CHECK-RED
      command_or_check: "Add focused contract test first and capture genuine RED showing source surface has nine tools and repo_publish is absent."
      required: true
    - id: CHECK-FOCUSED
      command_or_check: "Iterate targeted repo_publish behavior/MCP and all directly affected exact-surface regression suites to GREEN."
      required: true
    - id: CHECK-SAFETY
      command_or_check: "Inspect fixed Git argv/environment/deadline/error behavior and prove no force/tags/multi-ref/arbitrary remote/refspec/config surface."
      required: true
    - id: CHECK-DIFF
      command_or_check: "git diff --check PASS and exact restrictive path audit before canonical verification."
      required: true
    - id: CHECK-CANONICAL
      command_or_check: "Use atomic once-guard plus detached worker to execute PYTHON=.venv/bin/python PYTHONDONTWRITEBYTECODE=1 ./verify exactly once and retain durable evidence."
      required: true
    - id: CHECK-PUBLISH
      command_or_check: "On PASS, publish exact verified implementation bytes as one typed GitHub content-identity commit direct child of planning commit, non-force, then prove exact remote path/blob identity."
      required: true
    - id: CHECK-FINAL
      command_or_check: "Create/validate/publish TASK-0094 report-only direct child, fresh-resolve dev/main/lineage and stop NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Independent Architect review of TASK-0094 exact implementation tree, local verifier evidence, report validator result and remote lineage."
    expected_signal: "Architect ACCEPT of source-level repo_publish tool 10 only; live activation remains separately gated."

