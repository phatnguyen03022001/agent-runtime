structure_authority:
  status: RESOLVED
  source: "Accepted agent-runtime feature-based layout and TASK-0093 public MCP surface."
  rationale: "Add one bounded source module and two focused test modules. Update only directly affected contract/server/timing/docs and pre-audited exact-surface regressions."

objective: "Add public source tool 10 repo_publish: a replay-safe expected-state-guarded fixed-origin publication capability that may publish exactly the current clean branch HEAD when that commit is the sole direct child of the caller-bound existing remote branch head. It must perform no force update, branch creation/deletion, tag publication, arbitrary refspec or generic Git command execution. Verify with focused tests and exactly one replay-safe canonical verifier run, publish exact verified content, and stop for independent Architect review."

public_contract:
  name: repo_publish
  position: 10
  input:
    signature: "repo_publish(cwd, branch, expected_remote_head, commit)"
    exact_fields:
      - cwd
      - branch
      - expected_remote_head
      - commit
    forbidden_caller_controls:
      - remote
      - url
      - refspec
      - argv
      - command
      - timeout
      - timeout_seconds
      - force
      - force_with_lease
      - atomic
      - tags
      - push_options
      - recurse_submodules
      - receive_pack
      - upload_pack
      - config
      - environment
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: true
    openWorldHint: true
  result:
    exact_fields:
      - schema_version
      - status
      - repository_root
      - branch
      - remote
      - upstream
      - expected_remote_head
      - commit
      - head
      - remote_head_before
      - remote_head_after
      - network_used
      - push_attempted
      - published
      - deadline_seconds
    status_values:
      - published
      - already_published

scope:
  required_changes:
    - "Add agent_runtime/repo_publish.py implementing only the repo_publish contract."
    - "Add closed Pydantic input aliases/result contract and bounded publish-specific typed error codes in agent_runtime/contracts.py."
    - "Register repo_publish as exact public tool 10 after repo_fast_forward in agent_runtime/server.py; annotations are exactly readOnly=false, destructive=true, idempotent=true, openWorld=true."
    - "Add repo_publish to timing allowlist and SERVER_INSTRUCTIONS without changing tools 1-9 semantics."
    - "Update README from exactly nine to exactly ten public tools and document repo_publish as expected-state-guarded fixed-origin exact direct-child publication; Runtime executes the consequence but repository/task authority remains external."
    - "Use fixed /usr/bin/git, shell=False, disconnected stdin, bounded output where output is read, fixed call deadline, GIT_TERMINAL_PROMPT=0, no pager/color, no caller environment or Git-argument injection."
    - "Require cwd to resolve to the repository root inside AGENT_RUNTIME_WORKSPACE_ROOT; reject bare and shallow repositories."
    - "Require legal bounded branch, current non-detached branch exactly equals branch, upstream exactly origin/<branch>, zero tracked/staged/untracked/conflicted changes and no merge/rebase/cherry-pick/bisect state."
    - "Require expected_remote_head and commit to be exact lowercase 40-hex commit SHAs, local HEAD exactly equals commit, and commit exists locally."
    - "Require commit to have exactly one parent and that sole parent equals expected_remote_head. Reject merge commits, root commits, two-or-more-commit publication ranges and any other lineage as PUBLICATION_LINEAGE_MISMATCH before push."
    - "Observe the remote branch using fixed literal origin and exact refs/heads/<branch>. The remote branch must already exist; branch creation is forbidden."
    - "Fresh remote state may equal only expected_remote_head or commit. If it equals commit after all local/lineage guards, return already_published without push. Any third remote value or missing branch fails REMOTE_HEAD_MISMATCH."
    - "Immediately before push, re-check local branch/HEAD/clean/operation state. Any change from the bound initial state fails LOCAL_STATE_CHANGED."
    - "When remote equals expected_remote_head, execute exactly one non-force push of commit to refs/heads/<branch> using fixed origin and an explicit single refspec. Disable local hooks and submodule recursion. Do not publish tags or any other ref."
    - "The push command MUST contain no --force, -f, --force-with-lease, deletion refspec, wildcard refspec, --mirror, --all, --tags, --follow-tags or caller-supplied push option."
    - "After the push attempt, freshly observe the remote branch. If remote equals commit, publication is proven and may return published even when the transport process result was ambiguous. If remote remains expected_remote_head after a definite push failure, return PUSH_FAILED. If remote is any third value, fail REMOTE_HEAD_MISMATCH. If post-push remote state cannot be established, fail PUBLICATION_AMBIGUOUS and require re-observation before another consequence."
    - "Same-input replay after success must freshly verify local binding/lineage and remote state and return already_published with push_attempted=false; it must not perform a second push."
    - "Never return or embed remote URLs, credentials, credential-helper output, arbitrary Git config, stdout/stderr, environment values or secret-bearing transport diagnostics."
    - "Errors remain closed TypedToolErrorEnvelope with bounded message and retryable flag. Add only publication errors actually needed by the implementation."
    - "Add regression-first tests and capture genuine RED before implementation: production surface must initially expose nine tools and lack repo_publish."
    - "Use local temporary repositories and local bare origins only for repo_publish behavioral tests. No test may publish to canonical GitHub or another real remote."
    - "Focused coverage must include success, exact replay/no second push, stale remote before push, missing remote branch, remote race, rejected remote push, transport ambiguity recovered by remote==commit, ambiguous post-push observation, dirty/staged/untracked/conflicted/in-progress state, cwd subdirectory, detached HEAD, branch/upstream mismatch, local HEAD mismatch, root/merge/two-commit lineage rejection, fixed-origin/single-refspec/no-force command safety, bounded deadline/child cleanup, closed schemas/errors and tools 1-9 non-regression."
    - "Update every pre-audited exact-surface regression from nine to ten tools without weakening existing assertions: tests/test_mcp_contracts.py, tests/test_timing.py, tests/test_mcp_client_conformance.py, tests/test_surface_and_scripts.py, tests/test_repo_observer_mcp.py, tests/test_fs_read_batch_mcp.py, tests/test_fs_read_batch.py and tests/test_repo_fast_forward_mcp.py."
    - "Run targeted/focused tests during iteration. Before canonical verification require focused GREEN, git diff --check PASS and exact authorized implementation path scope."
    - "Canonical verification authority is exactly 0/1 -> 1/1. The command is exactly PYTHON=.venv/bin/python PYTHONDONTWRITEBYTECODE=1 ./verify."
    - "Canonical verification MUST use ignored build/.task-0094-* atomic once-guard plus detached/background worker and durable command/PID/start/finish/stdout/stderr/exit evidence. Duplicate/replayed launcher invocation must be ALREADY_LAUNCHED/no-op and cannot execute a second physical verifier."
    - "If canonical verification fails, stop BLOCKED_AFTER_CANONICAL_VERIFICATION. No repair and no second TASK-0094 canonical run."
    - "On canonical PASS, rehash all implementation paths and freeze those exact bytes as publication input."
    - "TASK-0094 implementation publication identity is CONTENT_IDENTITY. Do not require a local implementation commit and do not use generic terminal git push."
    - "Fresh-resolve canonical remote dev immediately before publication and require it still equals TASK-0094 planning commit."
    - "Using typed GitHub Git Data primitives, publish one implementation commit whose sole parent is TASK-0094 planning commit and whose tree differs at exactly the authorized implementation paths with bytes exactly equal to the verified local files. Update dev non-force."
    - "After exact implementation publication, create and validate only .agent/tasks/TASK-0094/report.yaml as the report-only direct child, fresh-resolve dev/main/lineage and stop NEEDS_REVIEW."
