  - "Do not implement repo_remote_observer, screen_capture, model-vision Stage B, Accessibility, UI control, repo_diff_read or other roadmap capabilities."
  - "Do not change requirements, requirements.lock, MCP SDK pin, workspace policy, lifecycle code, installer, packaging, tunnel configuration or port ownership."
  - "Do not weaken or delete existing tests to accommodate tool 10."
  - "Do not run canonical ./verify more than once."
  - "Do not package/install/restart/reload/cut over/rollback/recover the live Runtime."
  - "Do not mutate main, tags, releases or sibling repositories."

