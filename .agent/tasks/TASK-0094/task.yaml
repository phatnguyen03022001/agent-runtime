invariants:
  - "repo_publish is publication consequence, not repository/task authority and not a generic Git wrapper."
  - "Public source surface after implementation is exactly ten tools; tools 1-9 retain their accepted contracts."
  - "repo_publish can update only existing origin/<branch> and only from expected_remote_head to its exact sole direct child commit."
  - "No force semantics, branch creation/deletion, tag operation, multi-ref publication or arbitrary refspec exists."
  - "Same-input replay performs fresh observation and no second push."
  - "A stale/third remote head is never followed automatically."
  - "No local working-tree mutation is performed by repo_publish itself."
  - "No live Runtime package/install/activation/restart/reload/service/tunnel/port-8080 action is authorized."
  - "main, tags, releases and sibling repositories remain unchanged."
  - "Exactly one physical TASK-0094 canonical verifier may execute."
  - "Platform safety blocks are capability evidence only; no obfuscation, command splitting, permission widening, protection disabling or provider-hopping for a different safety judgment."

forbidden_changes:
