required_classification:
  exactly_one_of:
    - ARTIFACT_SIGNATURE_INVALID
    - CODEX_LOCAL_TRUST_CONTEXT_MISMATCH
    - HOST_TRUST_STORE_CHANGED
    - TRUST_ROOT_CAUSE_UNPROVEN

classification_rules:
  ARTIFACT_SIGNATURE_INVALID:
    require_all:
      - "Independent structural signature evidence proves the accepted app or a required nested executable has an invalid/malformed signature or sealed-resource mismatch, not merely an untrusted certificate chain."
      - "The conclusion must reconcile how the unchanged accepted candidate closure previously passed strict validation."
  CODEX_LOCAL_TRUST_CONTEXT_MISMATCH:
    require_all:
      - "The candidate closure remains exact."
      - "Signature structure and embedded signer chain remain internally coherent."
      - "Evidence identifies a CODEX_LOCAL-specific keychain/trust/search-list/security-session visibility difference sufficient to explain why trust cannot chain to the required root/intermediate while prior accepted CHATGPT_LOCAL verification succeeded."
  HOST_TRUST_STORE_CHANGED:
    require_all:
      - "Evidence proves a host/user trust-store or trust-settings change material to the signer chain, not merely that CODEX_LOCAL cannot see a keychain."
      - "The relevant signer chain is otherwise structurally valid."
  TRUST_ROOT_CAUSE_UNPROVEN:
    use_when:
      - "The evidence narrows the failure but cannot satisfy another classification without speculation."

preconditions:
  - "Resolve this task directly from GitHub at the exact TASK-0115 planning HEAD."
