  - "Do not treat the TASK-0114 strict codesign failure as evidence of artifact corruption by itself."

diagnostic_scope:
  required:
    - "Inspect code-signature metadata for the app and the three responsible executables using read-only codesign display operations. Capture identifier, signature type/class, TeamIdentifier consistency, timestamp presence, Authority-chain count/class, CDHash or equivalent signature-structure evidence as appropriate."
    - "Do not persist the literal leaf signing identity, certificate serial number, private-key information, or full certificate fingerprint. Hash or redact identity-bearing values where they are not already accepted public repository identities."
    - "Inspect CODEX_LOCAL process identity and read-only keychain search-list/default-keychain visibility sufficient to determine whether the expected user trust context is visible."
    - "Inspect user and admin trust-settings read-only. Record only whether material trust overrides exist and bounded hashes/sanitized evidence needed for the conclusion; do not change them."
    - "Inspect whether the signer chain's required root/intermediate classes are available through the CODEX_LOCAL-visible trust/keychain context. Do not download or install certificates."
    - "Use the already accepted TASK-0111 CHATGPT_LOCAL strict PASS as prior cross-surface evidence. Do not claim current CHATGPT_LOCAL state unless separately observed by an authorized task."
    - "One diagnostic /usr/bin/codesign --verify --deep --strict --verbose=4 invocation on the exact candidate is authorized only if needed to bind detailed failure diagnostics. This is diagnosis of a changed question, not an installation trust-gate retry. Do not invoke it more than once."
    - "If certificate extraction is indispensable, ephemeral files are allowed only under one task-specific /tmp directory, must contain public certificate material only, and must be removed before publication. No repository/product/keychain mutation is allowed."

