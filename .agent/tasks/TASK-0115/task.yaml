origin:
  type: architect_rework
  predecessor_task_revision: 1
  predecessor_report_commit: "1a7b4525f8046b358e1d45846dd311ffe320cee4"
  predecessor_review_commit: "05ee6df7a450bb32b523896ccfcb2b27e5cfc44f"

target:
  repository: phatnguyen03022001/agent-runtime
  branch:
    name: dev
    role: trust_context_diagnosis_rework

execution_surface:
  id: CODEX_LOCAL
  controller: CODEX
  location: LOCAL
  transport: NATIVE

objective: "Resolve the TASK-0115 revision-1 classification overreach with direct read-only trust discriminators. Preserve all accepted candidate-identity and no-mutation evidence. Prove CODEX_LOCAL_TRUST_CONTEXT_MISMATCH only if the execution context itself is directly implicated; otherwise conclude TRUST_ROOT_CAUSE_UNPROVEN. Do not install, rebuild, re-sign, alter trust/keychain state, or touch Stage B."

accepted_revision_1_evidence:
  candidate_sha256: "0e0fb14a551f2567b2f3a68665287b64793d840a30267d9c4eac1dbf41720a77"
  handoff_sha256: "f8e75129f942fe67541229a598ed8761be574ec5547ffd306c606131718130a8"
  record_count: 1035
  cms_structure_coherent: true
  embedded_chain_classes:
    - apple-development
    - apple-wwdr-intermediate
    - apple-root
  prior_strict_diagnostic: CSSMERR_TP_NOT_TRUSTED
  prior_strict_diagnostic_invocations: 1
  candidate_mutation: false
  host_security_state_mutation: false

architect_correction:
  - "security find-identity is evidence about signing identities visible through keychain-file identity search; it is not sufficient proof of the trust anchors available to code verification."
  - "A verifier does not require access to the signer's private signing identity."
  - "SystemRootCertificates.keychain not appearing in an ordinary search-list dump is not by itself evidence that built-in macOS trust anchors are unavailable."
  - "Revision 1 therefore did not directly prove CODEX_LOCAL_TRUST_CONTEXT_MISMATCH."

required_classification:
  exactly_one_of:
    - CODEX_LOCAL_TRUST_CONTEXT_MISMATCH
    - ARTIFACT_SIGNATURE_INVALID
    - HOST_TRUST_STORE_CHANGED
    - TRUST_ROOT_CAUSE_UNPROVEN

classification_rules:
  CODEX_LOCAL_TRUST_CONTEXT_MISMATCH:
    require_all:
      - "Candidate identity remains exact and certificate validity/policy is not independently invalid."
      - "Direct evidence demonstrates that the same CODEX_LOCAL process context fails to resolve/evaluate a chain that succeeds when evaluated with the relevant built-in anchor/chain material explicitly supplied, or another equally direct context-specific discriminator is proven."
      - "Do not use zero signing identities or ordinary search-list absence as the deciding evidence."
  ARTIFACT_SIGNATURE_INVALID:
    require_all:
      - "Read-only evidence proves a malformed/cryptographically invalid signature, sealed-resource mismatch, invalid certificate time/policy for the signing event, or another artifact-local defect."
      - "CSSMERR_TP_NOT_TRUSTED alone is insufficient."
  HOST_TRUST_STORE_CHANGED:
    require_all:
      - "A material host/user trust-store change is proven from durable before/after evidence or an equivalent authoritative host-state discriminator."
  TRUST_ROOT_CAUSE_UNPROVEN:
    use_when:
      - "No other classification reaches its evidence threshold."

preconditions:
  - "Resolve canonical TASK-0115 revision 2 from GitHub at the exact planning HEAD."
  - "Fresh-resolve dev/main; require dev equals the planning HEAD and main remains c49d777efa09db7f6c51bd8d8616db4623499fb8."
  - "Synchronize clean local dev by ordinary fast-forward only."
  - "Require revision-1 report 1a7b4525f8046b358e1d45846dd311ffe320cee4 and Architect REWORK review 05ee6df7a450bb32b523896ccfcb2b27e5cfc44f in ancestry."
  - "Recompute candidate closure and handoff SHA read-only before diagnosis. Stop CANDIDATE_IDENTITY_CHANGED on mismatch."

diagnostic_scope:
  required:
    - "Do not repeat /usr/bin/codesign --verify --deep --strict on the exact candidate; revision 1 already consumed the diagnostic needed to bind CSSMERR_TP_NOT_TRUSTED."
    - "Extract only public certificates from the already embedded CMS into one task-specific /tmp directory if needed; delete the directory before publication."
    - "Record sanitized certificate validity windows, key usage / extended-key-usage classes, basic constraints, issuer relationships, and signature-algorithm classes for leaf/intermediate/root. Do not persist subject identity literals, serials, full fingerprints, or private material."
    - "Cryptographically verify leaf -> intermediate -> root relationships with a read-only certificate verifier independent of codesign."
    - "Prove whether the exact embedded root certificate DER is byte-identical to a certificate present in macOS built-in SystemRootCertificates.keychain. Use hashes only in the report."
    - "Perform one explicit read-only trust evaluation of the extracted leaf/intermediate chain against macOS trust / the matching built-in root using the appropriate code-signing policy when supported. Record bounded sanitized result."
    - "Inspect the currently installed predecessor app under the same CODEX_LOCAL context as a control: preserve its bytes, inspect its signer-chain class/hash relationship to the candidate, and run at most one strict codesign verification on that predecessor. This is a control artifact, not a retry of the candidate trust judgment."
    - "Optionally verify one Apple-signed system executable as a second control only if needed to distinguish a generally broken trust service from a development-certificate-specific failure."
    - "Do not infer CODEX-specific behavior merely because the prior CHATGPT_LOCAL task passed. That prior PASS is historical evidence, not a current matched-context control."
    - "If the explicit chain evaluation succeeds but candidate codesign had CSSMERR_TP_NOT_TRUSTED, identify the narrow observable boundary that differs. If that boundary cannot be attributed specifically to CODEX_LOCAL rather than host-wide code-sign policy/trust state, select TRUST_ROOT_CAUSE_UNPROVEN."

limits:
  exact_candidate_strict_codesign_invocations: 0
  installed_predecessor_strict_codesign_invocations_max: 1
  system_control_strict_codesign_invocations_max: 1
  certificate_downloads: 0
  certificate_imports: 0
  keychain_mutations: 0
  trust_setting_mutations: 0
  keychain_unlock_or_search_list_mutations: 0
  candidate_mutations: 0
  installed_app_mutations: 0
  package_app_invocations: 0
  resign_invocations: 0
  install_prebuilt_invocations: 0
  lifecycle_mutations: 0
  service_management_mutations: 0
  launchd_mutations: 0
  plugin_refreshes: 0
  screen_capture_invocations: 0
  stage_b_probes: 0
  tcc_mutations: 0
  click_type_scroll_invocations: 0

scope:
  allowed_repository_mutation:
    - ".agent/tasks/TASK-0115/report.yaml"
  expected_files_are_restrictive: true
  product_state_mutation: NONE
  host_security_state_mutation: NONE

forbidden_changes:
  - "Do not install/reinstall, rebuild, copy-over, modify, or re-sign the candidate."
  - "Do not import/delete/trust/untrust/unlock/relock/reset certificates, keychains, or trust settings."
  - "Do not alter HOME, environment, security session, keychain search lists, CODEX configuration, permissions, or execution surface to seek a different trust result."
  - "Do not mutate source/tests/docs/dependencies."
  - "Do not invoke Stage B, live screen_capture, plugin refresh, TCC changes, base64-in-text, OCR, click, type, or scroll."
  - "Do not mutate main/tags/releases/sibling repositories or force-push."

verification:
  - id: IDENTITY
    requirement: "Exact candidate/handoff identity remains unchanged before and after revision-2 diagnosis."
  - id: CERTIFICATE_POLICY
    requirement: "Certificate time/policy/chain cryptography is bounded independently from codesign trust."
  - id: BUILTIN_ROOT
    requirement: "Matching embedded root presence or absence in macOS built-in roots is proven by DER/hash equality, not subject-name search."
  - id: DIRECT_TRUST
    requirement: "At least one explicit trust-chain evaluation is recorded with bounded sanitized evidence."
  - id: CONTROL
    requirement: "A same-CODEX_LOCAL signed-artifact control is evaluated without mutation."
  - id: CLASSIFICATION
    requirement: "Exactly one classification is returned. If CODEX_LOCAL-specific causality is not directly established, select TRUST_ROOT_CAUSE_UNPROVEN."
  - id: PRESERVATION
    requirement: "Zero product/security/lifecycle/media mutation and no remaining temporary certificate files."

publication:
  - "Replace/update .agent/tasks/TASK-0115/report.yaml with report_revision: 2 and truthful revision-2 evidence."
  - "Publish one report-only commit as the sole direct child of the revision-2 planning HEAD."
  - "No implementation commit is authorized."

terminal_states:
  success: NEEDS_REVIEW
  candidate_identity_changed: CANDIDATE_IDENTITY_CHANGED
  capability_failure: CURRENT_PHASE_CAPABILITY_UNAVAILABLE

acceptance_criteria:
  - id: AC-1
    requirement: "Revision-1 accepted identity/preservation evidence remains true."
  - id: AC-2
    requirement: "Root presence and certificate chain/policy are evaluated directly rather than inferred from find-identity/search-list output."
  - id: AC-3
    requirement: "A same-context control distinguishes artifact-local failure from broader CODEX_LOCAL trust behavior where possible."
  - id: AC-4
    requirement: "Classification obeys the revised evidence threshold without speculation."
  - id: AC-5
    requirement: "Only TASK-0115 report mutates dev; main and host/product security state remain unchanged."

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

execution_ready: true
