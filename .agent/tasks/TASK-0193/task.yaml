structure_authority:
  status: RESOLVED
  source: "Existing package-owned start.sh status observation, NativeRuntimeBackend adaptation, menu-bar presentation, and current upstream tunnel-client loopback health surface."
  rationale: "Extend the existing canonical read-only status path with one orthogonal transport observation. Do not add a daemon, remote monitor, active heartbeat service, or second status owner."

objective: "Expose truthful tunnel transport state independently from local Runtime availability and lifecycle ownership. A locally healthy Runtime may remain Running while the OpenAI control-plane transport is degraded or unconfirmed; the UI must show that distinction without disabling safe lifecycle ownership or falsely claiming ChatGPT end-to-end connectivity."

scope:
  required_changes:
    - "Preserve TASK-0191/TASK-0192 local Runtime state and control semantics exactly. Local availability and positive lifecycle ownership remain the only inputs to Start/Stop/Restart policy."
    - "Extend the single package-owned canonical status observation with an orthogonal read-only tunnel transport field. Use an explicit internal schema revision if the JSON shape changes; update all internal consumers/tests atomically."
    - "When the canonical Runtime is not serving, report transport as not-running and do not probe tunnel component health."
    - "When the canonical Runtime is serving, obtain transport evidence only from the existing loopback tunnel-client operator surface. Prefer the upstream /health/control-plane component contract at schema_version 1. Do not contact OpenAI directly from Agent Runtime status code."
    - "Map upstream control-plane component status conservatively: ok -> healthy; degraded -> degraded; unknown/disabled/unobserved -> unconfirmed. Treat 404/unsupported component-health surfaces as unsupported/unconfirmed, not as Runtime failure. Treat timeout, malformed JSON, unsupported schema, or local read failure as unconfirmed."
    - "Accept additive unknown upstream JSON fields within the supported schema, but validate the fields that drive the transport classification. Do not infer success from arbitrary HTTP 200 alone."
    - "Keep the transport probe bounded and read-only. It must not start MCP discovery, trigger tool calls, run tunnel-client doctor, mutate configuration, create remote traffic beyond the already-running tunnel-client's own behavior, or repair/restart the tunnel."
    - "Do not equate tunnel transport health with a specific ChatGPT app/workspace connection. Human/UI wording must distinguish 'Tunnel transport healthy/polling' from 'ChatGPT connected'. Actual product reachability requires an actual product-originated MCP request and is outside passive status proof."
    - "Update menu-bar presentation with an explicit Tunnel fact independent from Endpoint/Health/Ready. A locally Running Runtime with healthy transport may present fully healthy; a locally Running Runtime with degraded or unconfirmed transport must present attention/degraded visually while retaining the same lifecycle action permissions derived from local ownership."
    - "Remove or correct any wording that currently says 'Connected' solely because local healthz/readyz are green. Accessibility text must carry the same truthful distinction."
    - "Keep read-only/external Runtime semantics: local Runtime may be serving read-only and transport health may still be observed, but destructive controls remain disabled because ownership is separate."
    - "Keep doctor as an installed-package/configuration diagnostic; do not make doctor fail merely because the manually started Runtime is stopped or tunnel transport is currently unobserved."
    - "Update operator docs to explain three distinct facts: local Runtime availability, lifecycle-control ownership, and tunnel control-plane transport health. State explicitly that passive local health cannot prove ChatGPT/plugin linkage or future tool-call success."
    - "Add deterministic status/parser tests for: local stopped; local running + control-plane ok; local running + control-plane degraded; local running + control-plane unknown; component route unsupported/404; timeout; malformed payload; unsupported schema; additive unknown fields; read-only/external local Runtime with healthy/degraded transport."
    - "Add deterministic Swift presentation tests proving degraded/unconfirmed tunnel state changes operator-visible presentation but never grants or removes lifecycle authority beyond the existing RuntimePolicy result."
    - "Preserve TASK-0192 StatusRefreshCoalescer bounds; tunnel observation must remain inside the same one-active-plus-one-follow-up refresh budget and must not create a second polling loop."
    - "Run focused shell/Python status tests and focused Swift Core/MenuBar tests before full Swift verification."
    - "Run xcrun swift test --package-path macos after focused tests pass."
    - "Run exactly one new canonical ./verify invocation through a durable/reconcilable execution path after focused proof is green. If the controlling response is ambiguous, reconcile the same execution before any retry; blind replay is forbidden."
    - "Do not mutate the live installed Runtime, tunnel-client process, configuration, app registration, lifecycle service, or network settings during implementation or verification."

