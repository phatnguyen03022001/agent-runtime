  - "Any synthetic MCP call, connector discovery, or ChatGPT call generated by passive status refresh."
  - "Calling tunnel-client doctor on every refresh."
  - "Any new background polling loop separate from TASK-0192 menu-bar refresh."
  - "Treating /healthz or /readyz alone as proof of healthy control-plane transport."
  - "Treating transport health as proof that a specific ChatGPT workspace/app is linked."
  - "Any weakening of Runtime ownership checks or lifecycle fail-closed behavior."
  - "Any public MCP tool/schema change, capacity change, tunnel credential/configuration mutation, dependency change, version/tag/release change."
  - "Any live Runtime Start/Stop/Restart/install/cutover/reboot or tunnel-client restart/update during this task."
  - "Any continuation of TASK-0190 revision 8."

