acceptance_criteria:
  - id: AC-1
    requirement: "Canonical status exposes tunnel transport truth as an independent read-only axis."
    evidence_required: "Focused status tests prove local Running/Stopped/control ownership semantics remain unchanged while control-plane ok/degraded/unconfirmed/unsupported are represented independently."
  - id: AC-2
    requirement: "Transport classification uses authoritative local tunnel-client component evidence conservatively."
    evidence_required: "Tests cover schema_version 1 /health/control-plane ok, degraded, unknown, additive fields, 404, timeout, malformed data, and unsupported schema; arbitrary HTTP success cannot manufacture transport healthy."
  - id: AC-3
    requirement: "Menu-bar presentation no longer overclaims local readiness as ChatGPT connectivity."
    evidence_required: "Swift tests prove an explicit Tunnel fact and truthful accessibility/summary wording; local Running plus tunnel degraded/unconfirmed is visually attention/degraded while lifecycle controls remain determined only by existing ownership policy."
  - id: AC-4
    requirement: "Passive status remains bounded, coalesced, and side-effect free."
    evidence_required: "Tests/source inspection prove no new polling loop, no direct OpenAI request, no doctor/tool/discovery call, no repair/restart, and TASK-0192 one-active-plus-one-follow-up refresh bound remains intact."
  - id: AC-5
    requirement: "Diagnostic boundary is explicit."
    evidence_required: "Docs state that control-plane polling health proves observed tunnel transport health, not a specific ChatGPT app/workspace link or guaranteed future tool call; actual end-to-end product proof requires a real product-originated MCP request."
  - id: AC-6
    requirement: "Unrelated product contracts remain unchanged."
    evidence_required: "No MCP public-surface, capacity, lifecycle, dependency, credential/configuration, version, release, or live-state change."
  - id: AC-7
    requirement: "Canonical verification closes without replay ambiguity."
    evidence_required: "Focused suites PASS, full Swift PASS, then exactly one durable/reconcilable ./verify invocation completes PASS with no blind retry."
  - id: AC-8
    requirement: "Repository closure is minimal and canonical."
    evidence_required: "One reviewable implementation candidate, truthful report, non-force publication on main, final clean synchronized MAIN ONLY topology."

