  - "Tunnel transport state never grants destructive lifecycle authority."
  - "A degraded/unconfirmed tunnel does not falsely turn a healthy local Runtime into Stopped."
  - "A healthy local Runtime alone never produces a claim that ChatGPT is connected."
  - "No active end-to-end synthetic request is emitted by passive status refresh."
  - "No new daemon, service, watcher, scheduler, remote monitor, dependency, or persistence mechanism is introduced."
  - "TASK-0192 manual lifecycle semantics and bounded refresh coalescing remain unchanged."
  - "The six-session/product capacity semantics and twenty advertised MCP tools remain unchanged."
  - "MAIN ONLY; no branch or PR creation."
  - "TASK-0190 revision-8 effect authority remains untouched."

forbidden_changes:
