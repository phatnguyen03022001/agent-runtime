structure_authority:
  status: RESOLVED
  source: "Operator/Architect TASK-0144 execution packet"
  rationale: "Evolve the existing typed Runtime failure contract minimally; do not create a parallel error subsystem or widen later roadmap scope."

objective: >-
  Close GAP-04 only by evolving the existing Runtime typed failure contract into one stable,
  machine-readable failure/effect contract shared by public Runtime tools, while preserving MCP
  protocol-level tool-error semantics, success-response behavior, TASK-0143 execution invariants,
  and the currently installed Runtime activation.

scope:
  required_changes:
    - "Inspect and reuse ContractErrorCode, ContractError, CapabilityFailure, RuntimeValidationError, RuntimeStateError, TypedToolErrorEnvelope, TypedToolErrorPayload, server sanitization/error translation, and ToolContract Kernel."
    - "Define stable structured failure fields equivalent to code, reason_code, message, retryable, effect_state, reconciliation_required, and safe_next_action."
    - "Use effect_state closed values absent|present|unknown."
    - "Use safe_next_action closed values fix_request|retry|wait|reconcile|unsupported|report_defect."
    - "Classify invalid requests as no-effect, non-retryable, fix_request failures."
    - "Classify authority/precondition conflicts without converting expected state conflicts into internal errors."
    - "Classify capacity rejection as pre-dispatch effect_state=absent, retryable=true, safe_next_action=wait and prove admission occurs before consequence-bearing dispatch."
    - "Preserve TASK-0142 pre-effect start-failure semantics as effect_state=absent without silently making the identity respawnable."
    - "Classify any possible post-effect/lost-outcome failure as effect_state=unknown, reconciliation_required=true, safe_next_action=reconcile; retryable must never override reconciliation."
    - "Represent known effect presence as effect_state=present without equating that fact to higher-level verification success."
    - "Classify capability/governance unavailability as absent, non-reconciling, safe_next_action=unsupported."
    - "Classify unexpected internal failures from an explicit execution boundary: absent/report_defect only when no consequence-bearing effect was possible; otherwise unknown/reconcile."
    - "Preserve MCP failure semantics using the strongest supported mcp==2.2.0 mechanism: CallToolResult isError=true plus structuredContent. Never encode a covered failure as a normal successful result."
    - "Keep message bounded, sanitized, diagnostic, and unnecessary for machine action selection."
    - "Inventory current public failure producers across all 19 public tools and prove the shared contract covers their public failure paths."
    - "Add deterministic focused tests for required classifications, serialization/schema exactness, message sanitization/bounds, and MCP 2.2.0 transport compatibility."
    - "Commit a coherent implementation candidate immediately after focused PASS; later corrections must be child commits."
    - "Run canonical ./verify on the exact candidate using recoverable Runtime or SentinelX background carrier and require structured completion with exit_code=0 plus verifier postconditions PASS."
    - "Publish the exact verified candidate non-force after fresh remote reconciliation."
    - "Create and publish .agent/tasks/TASK-0144/report-r1.yaml as a report-only child and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "agent_runtime/tool_contract.py"
    - "agent_runtime/contracts.py"
    - "agent_runtime/errors.py"
    - "agent_runtime/server.py"
    - "Existing public tool modules only where required to supply explicit effect-boundary classification."
    - "Directly affected tests, schema projections, generated contract metadata, and documentation."
    - ".agent/tasks/TASK-0144 task/report artifacts"

invariants:
  - "TASK-0144 owns GAP-04 only."
  - "No live Runtime build, package, install, restart, plugin reload, cutover, or runtime.env change is authorized."
  - "Installed live Runtime remains 0.2.2 at activation revision 90a87fca8755ddc673e749bb5bf3e4489045a9b8."
  - "Success responses remain semantically unchanged unless a directly coupled error-schema projection requires metadata evolution."
  - "Public tool count/order and TASK-0143 execution behavior remain unchanged."
  - "start_identity reserve-before-Popen semantics, running hard wall, completed retention, output cursor behavior, terminal_or_deadline behavior, and MAX_WAIT_MS=30000 remain unchanged."
  - "No covered machine decision depends on parsing English message text."
  - "Exception occurrence alone never implies effect_state=absent."
  - "Timeout or lost response alone never implies retry is safe."
  - "When absence or presence cannot be proven from an explicit boundary, effect_state=unknown."
  - "retryable cannot override reconciliation_required."
  - "Expected state conflicts are not internal defects."
  - "Governance/capability denial is not an internal defect."
  - "MCP failure semantics require isError=true together with structured machine-readable content under pinned mcp==2.2.0."
  - "Do not introduce a private wire protocol."
  - "Use the smallest closed vocabulary needed for current Runtime failure classes; do not proliferate dozens of new codes."
  - "ToolContract Kernel may advance from 1 to 2 only if genuinely required by the semantic contract; if advanced, document only the exact delta and update projections/tests consistently."
  - "No source mutation may run concurrently with authoritative long verification."
  - "Consequence-bearing publication with lost response is OUTCOME_UNKNOWN and requires fresh remote observation before retry."
  - "No amend, reset-away, squash, branch creation, PR, force push, or blind publication retry."

forbidden_changes:
  - "GAP-01 pipe execution"
  - "GAP-02 terminal_exec lifecycle redesign"
  - "GAP-03 repo_remote_observer"
  - "GAP-05 output budgets"
  - "GAP-06 read SHA metadata"
  - "GAP-07 continuation cursors"
