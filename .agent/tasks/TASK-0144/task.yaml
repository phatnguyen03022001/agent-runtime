acceptance_criteria:
  - id: AC-1
    requirement: "A single shared structured failure/effect contract exposes code, reason_code, message, retryable, effect_state, reconciliation_required, and safe_next_action with closed effect/action vocabularies."
    evidence_required: "Focused contract/model/schema tests."
  - id: AC-2
    requirement: "Invalid request, authority/precondition, capacity, pre-effect start, post-effect unknown, known-present, unsupported capability, and internal-defect paths follow the Architect-approved effect/reconciliation semantics."
    evidence_required: "Deterministic boundary-aware failure tests covering all required classes."
  - id: AC-3
    requirement: "MCP transport remains a tool error while preserving machine-readable structured Runtime error content under pinned mcp==2.2.0."
    evidence_required: "SDK/API inspection plus MCP conformance test asserting isError=true and exact structuredContent."
  - id: AC-4
    requirement: "Covered machine decisions require zero English-string parsing; messages are bounded and sanitized."
    evidence_required: "Tests derive actions solely from structured fields and assert message bounds/sanitization."
  - id: AC-5
    requirement: "Current public failure producers across all 19 tools are mapped to the shared contract without execution-behavior redesign or later-gap implementation."
    evidence_required: "Internal mapping inventory plus focused regression coverage."
  - id: AC-6
    requirement: "Exact implementation candidate passes focused verification and canonical ./verify, is published non-force, and the repository report records exact candidate/tree/schema/kernel/transport evidence."
    evidence_required: "Candidate SHA/tree, focused results, structured verifier completion, remote publication evidence, and report-only child."
  - id: AC-7
    requirement: "Live Runtime remains unchanged at 0.2.2 / 90a87fca8755ddc673e749bb5bf3e4489045a9b8."
    evidence_required: "Report records live_runtime=UNCHANGED and accepted activation revision."

