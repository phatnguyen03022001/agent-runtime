  - "Durable evidence records launcher identity, worker/verifier PID or equivalent unique launch identity, exact command, start time, finish time, stdout, stderr and exit status."
  - "If the launcher outcome is ambiguous before the once-guard state can be proven, inspect the guard/evidence/process state. Never issue an unguarded fallback."
  - "If canonical verification fails, STOP with BLOCKED_AFTER_CANONICAL_VERIFICATION. No repair, retry, second verify or report claiming success."
  - "TASK-0084/live Runtime/tunnel/candidate/cutover state remains untouched."
  - "Exactly one worktree at /Users/tienphat/Developer/agent-runtime on dev; origin/main unchanged."

