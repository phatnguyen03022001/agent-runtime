  - "Canonical verification MUST NOT be launched directly through one long synchronous tool call."
  - "Before launching verify, create an ignored replay-safe launcher whose first operation is an atomic filesystem once-guard under build/.task-0088-* using mkdir or O_CREAT|O_EXCL semantics."
