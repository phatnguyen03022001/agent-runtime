    - github-workflow

structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0058 immutable candidate packaging/freeze contract plus accepted TASK-0057/TASK-0059 x6 evidence."
  rationale: "This task creates and proves one real signed immutable candidate only. It does not install, activate, restart, cut over, promote, or release it."

objective: >-
  Produce exactly one real, signed, immutable Agent Runtime candidate from the exact TASK-0060 handoff base using the accepted SHA-addressed freeze pipeline. Prove source/tree/requirements.lock identity, strict code-sign validity, non-null matching TeamIdentifier ownership for the app and Runtime helper, package provenance closure, exact candidate app/handoff paths, and byte preservation after freeze. Do not install or activate the candidate and do not mutate the live Runtime, tunnel, port 8080, ServiceManagement/launchd, desired state, runtime.env, or live cutover transaction.

operator_input:
  signing_identity:
    required: true
    source: "Operator must explicitly provide the exact AGENT_RUNTIME_CODESIGN_IDENTITY value in the Executor conversation."
    discovery_forbidden: true
    behavior_if_absent: OPERATOR_INPUT_REQUIRED
    rules:
      - "Do not enumerate Keychain identities."
      - "Do not run security find-identity."
      - "Do not infer or select an identity from prior repository state, environment history, or another conversation."
      - "Use exactly the operator-supplied identity and no alternative."

scope:
  required_changes:
    - "Fresh-resolve local HEAD and origin/dev. Require both to equal the exact handoff base before any freeze action; require designated working tree clean."
    - "Treat the exact handoff base as the candidate source revision. Compute and record its exact Git tree identity and requirements.lock SHA-256 before freeze."
    - "Require an explicit operator-supplied AGENT_RUNTIME_CODESIGN_IDENTITY. If absent, stop at OPERATOR_INPUT_REQUIRED without discovering identities or mutating candidate/live state."
    - "Invoke the canonical macos/freeze_candidate.py flow exactly once for the accepted source identity, with only the operator-supplied signing identity in the authorized environment. Do not run a second real freeze merely to gather additional evidence."
    - "Require the resulting candidate to publish under build/candidates/<candidate_sha256>/ with exact sibling Agent Runtime.app and Agent Runtime.candidate.json paths returned by the freeze contract."
    - "Record exact candidate_sha256, candidate app path, candidate handoff path, source revision, source tree, requirements.lock SHA-256, app bundle identifier, candidate record count, and relevant provenance identity fields."
    - "Prove /usr/bin/codesign --verify --deep --strict succeeds for the frozen app."
    - "Prove the main app and bundled Runtime service/helper have non-null TeamIdentifier values and that all required signed executable identities match the operator-authorized team ownership. Do not expose unrelated certificate/key material."
    - "Re-run canonical candidate validation against the exact frozen app/handoff pair after signing/freeze and prove candidate_sha256 remains exact."
    - "Hash the external handoff and a bounded set of identity-critical immutable files sufficient to prove the frozen candidate remains byte-stable across the post-freeze verification window; at minimum include the handoff, main executable, Runtime service executable, Runtime start.sh, runtime-manifest.json, and bundled requirements.lock when present."
    - "Do not reconstruct, reuse, overwrite, or claim restoration of historical TASK-0056 candidate bytes. This candidate is a new prospective immutable artifact produced under TASK-0058 semantics."
    - "Do not modify production source merely to make the real freeze pass. Any source defect, signing defect, provenance mismatch, immutable-output collision, or environment blocker must be reported and returned to Architect review rather than patched in this task."
    - "Run only verification materially needed for this real freeze plus repository-native verification if the canonical task protocol requires it. Avoid redundant rebuild/freeze invocations."
    - "Publish the canonical report to dev, non-force, then stop for Architect review. No installation or live activation is authorized."
  allowed_existing_files_or_components:
    - ".agent/tasks/TASK-0060/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Exactly one real candidate freeze invocation occurs after operator signing identity is supplied."
  - "The candidate source revision equals the exact TASK-0060 handoff base."
  - "The frozen candidate is SHA-addressed and immutable under the accepted TASK-0058 publication contract."
  - "No existing candidate directory is deleted, replaced, merged, truncated, or repurposed."
  - "No historical TASK-0056 bytes are reconstructed or claimed restored."
  - "TASK-0057 x6 source semantics remain unchanged."
  - "TASK-0059 transport evidence remains unchanged."
  - "Installed Runtime, live tunnel/control-plane connection, port 8080, runtime.env, desired-state marker, ServiceManagement/launchd state, live transaction, installed app bytes, System Settings, TCC, and BTM remain untouched."

forbidden_changes:
  - "Do not install the candidate."
  - "Do not start, stop, restart, kill, signal, repair, reinstall, register, unregister, commit-cutover, rollback, or otherwise lifecycle-mutate the live Runtime or tunnel."
  - "Do not read or disclose runtime.env secret values, control-plane credentials, or unrelated Keychain material."
  - "Do not enumerate signing identities or run security find-identity."
  - "Do not modify production Runtime, packaging, lifecycle, Swift, test, dependency, or configuration source."
  - "Do not create a new branch, worktree, workspace, repository, candidate registry, queue, scheduler, daemon, database, or service."
  - "Do not modify main, tags, releases, architect-profile, agent-skills, agent-standards, or agent-documents."

gap_policy:
  local_auto_fix: false
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: ARCHITECT_REVIEW

structure_policy:
  expected_new_files:
    - ".agent/tasks/TASK-0060/report.yaml"
  unlisted_new_files:
    allowed: false
  allow_new_top_level_directories: false
  allow_new_shared_modules: false

acceptance_criteria:
  - id: AC-1
    requirement: "One real immutable candidate is frozen from the exact handoff base and exact tree/requirements.lock identity using the operator-supplied signing identity."
    evidence_required: "Exact source revision/tree/lock identity, one freeze invocation record, exact candidate app/handoff paths, and candidate_sha256."
  - id: AC-2
    requirement: "The frozen app is strictly code-sign valid and required app/helper executable ownership has non-null matching TeamIdentifier values consistent with the operator-authorized identity."
    evidence_required: "codesign strict verification plus bounded TeamIdentifier evidence without Keychain enumeration."
  - id: AC-3
    requirement: "The exact frozen app/handoff pair validates after freeze and remains byte-stable through the verification window."
    evidence_required: "Canonical provenance validation, repeated candidate identity equality, handoff SHA-256, and critical-file hash comparison before/after verification."
  - id: AC-4
    requirement: "TASK-0058 candidate immutability contract is preserved and no prior candidate or TASK-0056 historical artifact is overwritten/reconstructed."
    evidence_required: "Candidate destination identity, collision/non-overwrite observation, and explicit historical-truthfulness statement."
  - id: AC-5
    requirement: "No installed/live Runtime, tunnel, port 8080, lifecycle/configuration, credential, or ServiceManagement state is mutated."
    evidence_required: "Explicit preservation evidence and no install/cutover invocation."
  - id: AC-6
    requirement: "Canonical report publishes non-force to dev from the exact handoff lineage with main unchanged."
    evidence_required: "Fresh remote refs and report commit lineage."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Preflight exact handoff base, clean working tree, exact tree, exact requirements.lock SHA-256, and explicit operator-supplied signing identity."
      required: true
    - id: CHECK-2
      command_or_check: "Invoke canonical real freeze exactly once and capture exact candidate_app, candidate_handoff, and candidate_sha256."
      required: true
    - id: CHECK-3
      command_or_check: "Run strict codesign and bounded TeamIdentifier ownership proof on the frozen candidate."
      required: true
    - id: CHECK-4
      command_or_check: "Validate the exact app/handoff pair and prove critical-file byte stability through post-freeze verification."
      required: true
    - id: CHECK-5
      command_or_check: "Fresh-prove no live install/cutover mutation, report publication lineage, clean designated local working tree after report commit, and unchanged main."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Architect review of exact report, freeze identity, signing/provenance evidence, immutable paths, and preservation evidence."
    expected_signal: "One exact signed immutable candidate is ready for a separately authorized live activation task."

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

blocking_decisions: []
execution_ready: true
