acceptance_criteria:
  - id: AC-1
    requirement: "Opt-in durable pipe execution survives MCP Runtime process restart without duplicate effect."
    evidence_required: "Real subprocess chaos proves one runtime_restart pipe job continues while manager/runtime A disappears, manager/runtime B reattaches by caller-known identity, same session identity is preserved and one target process only exists."
  - id: AC-2
    requirement: "Durable output/state semantics remain bounded and truthful across restart."
    evidence_required: "Before/after-restart output, stream ordering, cursor continuation, truncation/dropped bytes, exit code/termination reason and completed retention tests match accepted pipe semantics; runner independently enforces hard wall."
  - id: AC-3
    requirement: "Ownership/recovery fails closed under ambiguity."
    evidence_required: "Native process-instance verification rejects PID reuse/mismatch; runner disappearance, corrupt/partial state and symlink/permission attacks return structured reconciliation-required failures with no signal, respawn or duplicate launch."
  - id: AC-4
    requirement: "Capacity/session accounting remains coherent across restart."
    evidence_required: "Recovered live durable jobs reacquire exactly one heavy lease each and count as active sessions; new work respects the same ceilings; completion releases once; over-capacity recovery fails closed; capacity_observer remains truthful."
  - id: AC-5
    requirement: "Process-local compatibility remains intact."
    evidence_required: "PTY, normal pipe and terminal_exec regression suites preserve prior behavior; default durability=process; terminal_exec 2/2; no PTY durability; no new tools; source inventory remains 21 known/20 advertised."
  - id: AC-6
    requirement: "Exact candidate is canonically verified and published without installed activation."
    evidence_required: "Focused chaos/security/schema/regression PASS, git diff --check, canonical ./verify PASS on exact candidate, source Runtime 0.4.0/Kernel2 unchanged, report-only child, installed Runtime unchanged, NEEDS_REVIEW."

