  - "Known capabilities remain 21 and advertised tools remain 20."
  - "terminal_exec remains 2/2 and process-local."
  - "PTY semantics remain process-local and unchanged; no PTY reattachment is claimed."
  - "Only terminal_start pipe mode may opt into runtime_restart durability."
  - "Caller-known start_identity remains the pre-effect/lost-ACK authority; no server-generated-only identity can create a durable effect."
  - "HeavyExecutionAdmission remains the single Runtime heavy ceiling and recovered durable jobs count against it."
  - "Existing hard wall, output bounds, completed retention and max-session ceilings are not increased."
  - "No arbitrary shell, network, launchd/ServiceManagement mutation or new privileged helper."
  - "No user command/content is placed on runner argv."
  - "No host-reboot durability claim; lost owner is explicit unknown effect, never guessed completion."
  - "Optional telemetry remains fail-open and privacy-bounded."
  - "No MCP Tasks, telemetry backend, package activation or later cutover."

forbidden_changes:
  - "Any generic job daemon, new launchd/ServiceManagement service, tmux dependency or external database."
  - "Any durable PTY/stdin-write/resize architecture."
  - "Any automatic respawn after ambiguous runner ownership or host reboot."
  - "Any PID-only ownership check or signal without exact process-instance revalidation."
  - "Any unbounded state directory scan, output file, polling loop or metadata growth."
  - "Any command/cwd/argv/user output in telemetry."
  - "Any public tool addition or removal."
  - "Any Runtime version/Kernel bump, install/restart/cutover/plugin reload."
  - "Any MCP Tasks implementation."
  - "Any branch/PR/force push/amend/squash/tag/release."

