    precedence: 5

structure_authority:
  status: RESOLVED
  source: "Existing terminal session manager plus one per-job external runner and one bounded durable-state owner"
  rationale: "Do not add a generic daemon, tmux dependency, third ServiceManagement job or durable PTY architecture. A per-job detached runner is the smallest external owner that can retain pipe FDs/output and hard-wall control when the MCP Runtime process disappears. Runtime reattaches through bounded local state."

objective: "Close GAP-13 for noninteractive keyed pipe jobs only by adding an opt-in runtime_restart durability mode whose external per-job runner survives MCP Runtime process restart, preserves bounded output/state and caller-known recovery identity, restores admission accounting on reattach, and fails closed on stale/ambiguous ownership without changing PTY or terminal_exec semantics."

scope:
  required_changes:
    - "Extend terminal_start with durability='process'|'runtime_restart', default 'process'. Increment terminal_start request schema 3->4. runtime_restart is valid only when mode='pipe' and start_identity is present. PTY + runtime_restart is INVALID_ARGUMENT."
    - "Add durability to TerminalSessionResult and increment terminal_start result schema 3->4 and terminal_poll result schema 3->4. terminal_poll request remains 4. Existing process-local PTY/pipe calls return durability='process'; recovered durable pipe jobs return durability='runtime_restart'."
    - "terminal_exec remains request/result 2/2 and process-local. Do not make a synchronous MCP request cross-restart durable. terminal_control remains 1/1 and terminal_resize 1/1."
    - "Do not add an MCP tool. Known capabilities remain 21 and advertised tools remain 20. ToolContract Kernel remains 2 and Runtime source version remains 0.4.0."
    - "Implement one narrow durable pipe runner as an external process owner. It is launched detached from the MCP Runtime process with shell=false, stdin=/dev/null, no network authority, an isolated process group/session and the same minimal child environment/protected-runtime command filtering as accepted pipe execution."
    - "Do not pass user argv/cwd/content on the runner command line. Runtime reserves one secure per-job directory under ~/Library/Application Support/Agent Runtime/durable-jobs, mode 0700 root and 0700 job directory, writes a transient 0600 no-follow specification, then launches the runner using only opaque bounded identifiers/fixed state-root authority. Runner reads/validates the spec, dispatches the target, then removes the raw spec after durable dispatch state is established."
    - "Persist only the minimum durable recovery state after dispatch: state schema version, session_id, start_identity, exact canonical execution-spec digest, durability/mode, lifecycle/status, runner/process ownership identity, hard-wall deadline, output-journal state/cursors, dropped-output count, exit code/termination reason when known, created/completed timestamps and integrity/version fields. Do not persist environment, stdout/stderr outside the bounded journal, exception text, telemetry IDs or secrets."
    - "The execution-spec digest must bind normalized cwd, exact argv, mode='pipe', durability='runtime_restart', entry surface and hard-wall semantics. Repeating terminal_start with the same start_identity and identical spec joins the exact existing durable job before effect; a different spec returns START_IDENTITY_CONFLICT and never launches another process."
    - "Use atomic write+rename/fsync semantics for durable state transitions and O_NOFOLLOW/lstat/fstat-style checks so state/spec/journal paths cannot be redirected through symlinks. Reject malformed ownership, modes, file types, schema versions or partial/corrupt records fail-closed."
    - "The per-job runner owns target stdout/stderr for the whole process lifetime and drains both independently of MCP Runtime lifetime. Preserve the accepted bounded pipe semantics: ordered stream-labelled chunks, total retained-output hard bound, truthful dropped_output_bytes/cursor_expired behavior, UTF-8 replacement semantics, and continued draining after retention cap so the child cannot block on full pipes."
    - "Runner independently enforces the existing one-hour running hard wall and bounded TERM->KILL process-group cleanup even while no Runtime server exists. A Runtime restart must never reset the job hard-wall deadline."
    - "Runner records final exit_code and exact accepted termination_reason when known, atomically finalizes state, closes journal and exits. Completed durable state remains recoverable for the existing completed retention period; Runtime opportunistically enforces existing completed-retention/max-retained bounds. No completed runner process is kept sleeping solely for retention."
    - "Implement Darwin process-instance verification for durable ownership that is stronger than PID existence: at minimum pid + process-group id + process start seconds/microseconds + executable identity, using bounded native process inspection rather than an unbounded /bin/ps hot path. PID reuse or identity mismatch is never treated as ownership."
    - "Runtime startup/first terminal-manager construction scans only the bounded durable-jobs root, validates at most a fixed small ceiling consistent with existing session capacity, and reconstructs live durable proxy sessions only for positively verified runner ownership. No arbitrary filesystem scan."
    - "Recovered running durable jobs consume the same HeavyExecutionAdmission ceiling and active-session ceiling as ordinary Runtime jobs. Reacquire one process-local HeavyExecutionLease per positively recovered live durable job before admitting new heavy work. capacity_observer active_heavy/active_sessions/available_heavy must therefore remain truthful after Runtime restart."
    - "If the number of positively recovered live jobs exceeds configured heavy/session capacity, Runtime readiness for terminal execution must fail closed rather than silently overcommit or kill jobs. Observation/doctor must surface a stable reason; no automatic destructive reconciliation."
    - "The terminal session reaper must release recovered/current heavy leases exactly once when durable state becomes terminal or is positively removed. Restart/recovery must never underflow/double-release HeavyExecutionAdmission."
    - "terminal_poll must resolve durable jobs by either session_id or start_identity after Runtime restart and preserve cursor/output/status semantics. wait_ms/wait_for remain bounded; implement durable wait by bounded local state/journal observation, never unbounded filesystem polling or busy-spin."
    - "terminal_control for a running durable pipe job supports existing interrupt/terminate semantics only. pipe write remains rejected and resize remains PTY-only. Before signaling, revalidate exact runner/process ownership; ambiguity returns structured UNKNOWN/reconciliation_required and sends no signal."
    - "shutdown_terminal_sessions / normal MCP server shutdown must terminate process-local sessions exactly as today but leave runtime_restart durable jobs running. This is the intended ownership boundary. Product uninstall/cutover remains separately authoritative and is not modified in TASK-0153."
    - "A clean Runtime process restart while a durable job runs must reattach without duplicate spawn, output loss within the retained bound, cursor reset, hard-wall reset or capacity-accounting loss."
    - "An abrupt Runtime process kill while a durable job runs must have the same recovery semantics as a clean Runtime restart."
    - "Host reboot survival is NOT claimed. After host reboot or external runner loss, a durable record whose owner cannot be positively revalidated returns structured DURABLE_OWNER_LOST / effect_state=unknown / reconciliation_required=true. Do not invent exit_code, auto-respawn, or reuse the same start_identity for a new effect."
    - "A malformed/partial durable record returns structured DURABLE_STATE_CORRUPT / effect_state=unknown / reconciliation_required=true. Do not delete it and do not launch a replacement under the same identity automatically."
    - "Stale completed records beyond retention may be removed only after their terminal state is fully readable and no owner is live. Stale ambiguous/running records are never silently deleted."
    - "Add bounded durable lifecycle timing/telemetry integration by reusing existing timing events. process_kind may add durable_pipe as a fixed enum if needed. Do not add payload/high-cardinality telemetry and do not require telemetry to be enabled for durability."
    - "Add restart-chaos integration tests with real subprocesses under temporary state roots: Runtime manager A starts a durable pipe job; manager A is destroyed/restarted while runner stays alive; manager B reattaches by start_identity/session_id; output emitted before and after restart is observed exactly within bounds; final exit is recovered."
    - "Add lost-ACK test: dispatch occurs, caller receives no start result, a fresh manager repeats the identical start_identity/spec and joins one runner/process only."
    - "Add tests for different-spec identity conflict, hard-wall across restart, terminate after restart, completed-result recovery, cursor continuation after restart, capacity recovery, PID-reuse identity mismatch, runner disappearance, corrupt/partial state, symlink/state permission attacks, output truncation and cleanup/retention."
    - "Do not package/install/restart the installed product or perform a live cutover in TASK-0153. Restart-chaos proof occurs in isolated source test harnesses. Installed Runtime remains activation cf6aba7e9ca22bf5f0c1202ed7b6ac40433053b0 until later convergence."
    - "Do not implement MCP Tasks in TASK-0153. GAP-12 remains for TASK-0154 admission/adapter after durable pipe semantics are accepted."
    - "After focused PASS, commit one coherent implementation candidate, run canonical ./verify on that exact clean candidate, fresh-reconcile remote main, publish exact verified candidate non-force, publish report-r1.yaml as sole report-only child, and stop NEEDS_REVIEW."

