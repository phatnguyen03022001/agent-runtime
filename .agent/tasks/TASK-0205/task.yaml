objective: "Stabilize only the initial durable runner/target process-identity observation before publishing active durable state. Do not weaken identity contents or exact verification, do not extend owner-loss grace, and do not change terminal lifecycle/control semantics."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with clean synchronized MAIN ONLY."
    - "Modify production behavior only in agent_runtime/durable_pipe_runner.py."
    - "Preserve observe_process_identity and verify_process_identity in agent_runtime/durable_pipe.py byte-for-byte unless a test import formatting change is strictly necessary; no identity-schema change is authorized."
    - "Replace the current first-non-None behavior of durable_pipe_runner._identity_with_retry with bounded stability admission."
    - "A newly spawned owner identity is publishable only after two consecutive non-None observe_process_identity(pid) observations are exactly equal."
    - "Use a total observation budget of exactly 0.5 seconds and poll interval of exactly 0.01 seconds."
    - "A None observation or a different identity resets the consecutive-stability candidate; never coerce or partially compare identities."
    - "Return the exact stable identity dict only after the second equal observation. Return None when no stable identity is established within the bound."
    - "Apply the same stabilized helper to both the durable runner's own identity and the spawned target process identity."
    - "Preserve all identity fields exactly: pid, pgid, start_sec, start_usec, executable_dev, executable_ino."
    - "Do not drop executable identity, pgid, start-time fields, or change verify_process_identity equality semantics."
    - "Do not increase session._DURABLE_FINALIZATION_GRACE_SECONDS and do not make DURABLE_OWNER_LOST retryable/ignored."
    - "Preserve the existing behavior for a target that exits before a stable identity can be sealed: if process.poll() proves it already exited, do not fabricate a running owner identity and allow the existing natural-exit/finalization path to proceed."
    - "Preserve pre-effect fail-closed behavior when the durable runner itself cannot establish a stable identity."
    - "Add deterministic regression coverage in tests/test_durable_pipe.py for identity stabilization using patched durable_pipe_runner.observe_process_identity."
    - "Regression must prove sequence A -> B -> B seals B, never A."
    - "Regression must prove A -> None -> B -> B seals B."
    - "Regression must prove stable A -> A seals A."
    - "Regression must prove two different non-None observations do not count as stable."
    - "Preserve the existing process-instance mismatch test and all TASK-0203 privacy/argv/explicit-terminate assertions."
    - "Preserve tests that intentionally kill/lose a durable owner and require DURABLE_OWNER_LOST; do not rewrite those expectations."
    - "Run the exact TASK-0203 owner test 25/25 in fresh unittest processes."
    - "Then run 10 stress rounds where four fresh processes execute that exact owner test concurrently; require 40/40 PASS."
    - "Run full tests.test_durable_pipe and tests.test_durable_pipe_restart once each."
    - "Run git diff --check."
    - "Only after all focused/stress proof passes, run exactly one canonical ./verify under HOME=$PWD/.h TMPDIR=$PWD/.v."
    - "Canonical verifier must PASS all classified modules. Never blind-replay ambiguity."
    - "Remove .h/.v before final observation."
    - "Publish one implementation commit and then only .agent/tasks/TASK-0205/report.yaml as report child."
    - "Final main clean/synchronized MAIN ONLY."

  allowed_existing_files_or_components:
