error_contract:
  expected_domain_errors:
    result: PASS
    classification:
      - RuntimeValidationError
      - RuntimeStateError
      - ProtectedRuntimeDenied
    sdk_path: ToolError
    proof: >-
      A real Client call to terminal_poll with a schema-valid but unknown session id returned
      is_error=true with bounded model-readable text containing "unknown or expired session_id"
      and no traceback.
  unexpected_errors:
    result: PASS
    proof: >-
      A deterministic plain RuntimeError injected into terminal_exec contained a unique sentinel.
      The real Client received exactly "Error executing tool terminal_exec"; the sentinel,
      RuntimeError detail, and traceback were absent from both client-visible text and the
      serialized client result.
  schema_invalid_arguments:
    result: PASS
    proof: >-
      A real Client terminal_exec call with timeout_seconds=0 was rejected as an input-schema
      error before the patched Runtime delegate executed.
  broad_exception_to_model_conversion_added: false
  protection_denial_weakened: false

