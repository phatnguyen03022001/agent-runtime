protocol_version: 3

task_id: TASK-0053
task_revision: 1
state: APPROVED

origin:
  type: architect_bounded_macos_presentation_polish
  accepted_predecessor_task: TASK-0052
  accepted_predecessor_review: "b1eb7e889caf42e207ccf29ccb34a42188f3df85"

architect_binding:
  target_repository: phatnguyen03022001/agent-runtime

target:
  repository: phatnguyen03022001/agent-runtime
  branch:
    name: dev
    role: integration

execution_base:
  mode: handoff_snapshot
  capture: after_final_planning_commit
  require_exact_match: true

classification: BOUNDED

objective: "Polish the existing macOS Agent Runtime presentation without changing Runtime semantics: show the configured parallel limit in the popover, use a simple popover-only online/offline status dot instead of reusing the menu-bar symbol, and associate the existing legacy LaunchAgents with the Agent Runtime app bundle so System Settings can present the app name/icon rather than the internal AgentRuntimeMenuBar executable identity."

approved_design:
  popover:
    user_facing_name: "Agent Runtime"
    facts_order:
      - Endpoint
      - PID
      - Health
      - Ready
      - Sessions
      - Parallel
      - Protection
    parallel_value_semantics: "Configured operator maximum only; render as '<N> max'. It is not current in-flight work and must not be labeled active jobs."
    live_expected_value: "4 max"
    status_indicator:
      scope: POPOVER_HEADER_ONLY
      symbol: "circle.fill"
      online_color: systemGreen
      offline_color: systemRed
      semantics: "owned Runtime => online; stopped/external/ambiguous => offline/unconfirmed"
    menu_bar_symbol_behavior: "Preserve the existing menu-bar status symbol and behavior unchanged."
  login_item_presentation:
    bundle_identifier: com.picmao.agent-runtime
    user_facing_name: "Agent Runtime"
    existing_app_icon: "macos/AppBundle/Resources/AppIcon.png"
    internal_executable_name: AgentRuntimeMenuBar
    launchagent_attribution: "Add AssociatedBundleIdentifiers containing com.picmao.agent-runtime to both generated legacy LaunchAgent plists while preserving existing labels, ProgramArguments, lifecycle semantics, and paths."
    migration_policy: "Do not migrate to SMAppService or rename the internal executable/module in this task."
    signing_policy: "Do not access Keychain, discover signing identities, or introduce a new signing identity. Preserve the repository's existing signing model."

current_repo_facts:
  - "ControlPanelController currently renders Endpoint/PID/Health/Ready/Sessions/Protection and reuses RuntimeStatusIndicator.symbolName for the popover header."
  - "AppDelegate separately uses RuntimeStatusIndicator for the menu-bar status item."
  - "Info.plist already declares CFBundleDisplayName and CFBundleName as 'Agent Runtime' and CFBundleIdentifier as com.picmao.agent-runtime."
  - "candidate_cutover.py currently generates two legacy LaunchAgent plists without AssociatedBundleIdentifiers."
  - "The internal executable/module name AgentRuntimeMenuBar is implementation detail and must remain internal."

required_changes:
  - "Add a small Core-level configured-parallelism reader analogous to RuntimeSessionCapacity, reading AGENT_RUNTIME_MAX_PARALLELISM from the canonical env file with fallback 2 and valid range 1..10. Do not call capacity_observer from the UI."
  - "Expose the configured parallel limit through RuntimeConfiguration so AppDelegate can pass it into popover presentation without introducing a second config parser in the UI layer."
  - "Add the Parallel fact in the approved order for every Runtime status, rendered exactly as '<N> max'."
  - "Separate popover header status presentation from the menu-bar status icon so the popover uses circle.fill while the menu-bar icon remains unchanged."
  - "Preserve accessibility labels/tooltips with truthful online/offline/unconfirmed wording."
  - "Add AssociatedBundleIdentifiers = [com.picmao.agent-runtime] to both UI and Runtime LaunchAgent plist payloads generated by the canonical cutover code."
  - "Preserve CFBundleDisplayName/CFBundleName 'Agent Runtime', existing AppIcon.png, bundle identifier, LaunchAgent labels, ProgramArguments, desired-state behavior, and internal executable name."
  - "Update focused Swift presentation/config tests and Python cutover/plist tests first; run broader affected verification before final canonical verification."
  - "Run canonical full verification once on the final implementation tree, then freeze exactly one deterministic candidate using the existing provenance workflow."

must_not:
  - "Do not change Runtime MCP semantics, six-tool public surface, capacity policy, evidence ceiling, session semantics, protection semantics, or port 8080 behavior."
  - "Do not change live AGENT_RUNTIME_MAX_PARALLELISM=4."
  - "Do not start/stop/restart/reload/cutover/install the live Runtime in this task."
  - "Do not rename AgentRuntimeMenuBar Swift target/module/executable."
  - "Do not migrate LaunchAgents to SMAppService in this task."
  - "Do not add a signing identity, inspect Keychain, or change certificate policy."
  - "Do not create a new app icon or alter the approved AppIcon.png asset."
  - "Do not touch main/tags/releases."
  - "Do not alter unrelated .env.example drift."
  - "Do not content-read, stage, commit, stash, clean, reset, move, delete, overwrite, or adopt chatgpt-sample.txt or vscode-gpu-sample.txt."

acceptance_criteria:
  - id: AC-1
    requirement: "Execution starts from the exact TASK-0053 handoff snapshot; main and operator files remain preserved."
  - id: AC-2
    requirement: "Popover facts are Endpoint/PID/Health/Ready/Sessions/Parallel/Protection and configured live parallelism 4 is presented as '4 max', never as active work."
  - id: AC-3
    requirement: "Popover header uses a simple circle.fill status indicator with correct online/offline accessibility semantics, while the existing menu-bar status symbol/behavior is unchanged."
  - id: AC-4
    requirement: "RuntimeConfiguration obtains configured parallelism from the canonical env file with fallback 2 and range 1..10, without querying capacity_observer or duplicating parsing in the UI layer."
  - id: AC-5
    requirement: "Both generated legacy LaunchAgent plists include AssociatedBundleIdentifiers [com.picmao.agent-runtime] and otherwise preserve their canonical labels/program/lifecycle semantics."
  - id: AC-6
    requirement: "App bundle identity remains CFBundleDisplayName/CFBundleName 'Agent Runtime', CFBundleIdentifier com.picmao.agent-runtime, existing AppIcon.png, and internal executable AgentRuntimeMenuBar."
  - id: AC-7
    requirement: "Focused presentation/config/cutover tests pass, broader affected verification passes, and exact six-tool/public Runtime semantics remain unchanged."
  - id: AC-8
    requirement: "Canonical full verification passes once on the final implementation tree and exactly one deterministic candidate is frozen with identity/provenance/codesign validation."
  - id: AC-9
    requirement: "Candidate is not installed or activated live; report publishes non-force on dev and stops at ARCHITECT_REVIEW."

verification:
  iteration_strategy: "Use TDD with minimum affected tests: macOS presentation/config and LaunchAgent plist/cutover tests."
  handoff_strategy: "Run broader affected macOS/cutover/public-surface verification."
  acceptance_strategy: "Run canonical full verification once on the final tree, then deterministic candidate/provenance validation."
  visual_live_proof_in_this_task: false
  note: "System Settings name/icon presentation requires live installation/registration and belongs to a separate activation task after Architect acceptance. If later live proof shows macOS still cannot attribute the legacy item under the existing signing model, stop and report that limitation rather than self-authorizing signing or ServiceManagement migration."

publication:
  implementation_commit_required: true
  report_path: .agent/tasks/TASK-0053/report.yaml
  required_report_revision: 1
  push: non_force_dev
  stop_for_architect_review: true

candidate_boundary:
  build_and_freeze: true
  candidate_count: 1
  live_install: false
  live_activation: false
  successor_activation_task: TASK-0054

git_authority:
  create_branch: false
  create_worktree: false
  commit: true
  push: true
  promote_to_main: false

blocking_decisions: []
execution_ready: true
