acceptance_criteria:
  - id: AC-1
    requirement: "Sensitive dotenv policy is deterministic, narrow and shared."
    evidence_required: "One filename-only shared classifier; exact deny/allowlist behavior; no secret scanner/framework."
  - id: AC-2
    requirement: "fs_read_batch no longer returns sensitive dotenv content."
    evidence_required: "Synthetic .env/.env.local/nested/case variants return existing ACCESS_DENIED before content read; public templates and ordinary files remain readable."
  - id: AC-3
    requirement: "fs_search content mode no longer returns or scans sensitive dotenv content."
    evidence_required: "Synthetic content matches in protected dotenv files produce no result/hash/line text and zero sensitive content-byte contribution; path mode remains discoverable."
  - id: AC-4
    requirement: "Public schemas and unrelated filesystem safety remain stable."
    evidence_required: "fs_read 1/2 and fs_search 2/2 unchanged; existing focused/adversarial/MCP tests PASS."
  - id: AC-5
    requirement: "Security documentation is accurate and non-misleading."
    evidence_required: "README/THREAT_MODEL state defense-in-depth only and preserve same-UID/terminal limitations."
  - id: AC-6
    requirement: "Canonical verification passes with zero live/release effects."
    evidence_required: "Focused suites PASS followed by exactly one ./verify PASS; no version/package/release/install/lifecycle/plugin/permission/reboot effects."
  - id: AC-7
    requirement: "Repository closure is minimal and canonical."
    evidence_required: "Only authorized files plus report change; final main clean/synchronized MAIN ONLY."

