source_and_package_freeze:
  - "Do not edit product source, tests, docs, dependencies, package scripts, version projections or verification policy."
  - "Do not rebuild, reseal or replace the accepted package."
  - "Do not rerun focused tests, candidate profile or full qualification."
  - "Do not call macos/package_app.sh."
  - "Reuse TASK-0155 accepted qualification and immutable package evidence exactly."
