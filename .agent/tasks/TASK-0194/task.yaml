structure_authority:
  status: RESOLVED
  source: "Existing content-addressed payload store, exact transaction-staged candidate payload, zero-cost candidate handoff, and current candidate_cutover transaction schema."
  rationale: "Fix the incorrect validation coupling in place. Do not change payload schema, content-closure definition, storage key shape, pointer format, transaction schema, or introduce a second payload store."

objective: "Close F-0194-003 by allowing zero-cost cutover to reuse an immutable canonical payload entry when it has the exact candidate content closure and compatibility contract but a different historical source_revision/source_tree, while preserving exact source provenance through the transaction-staged candidate payload. Obtain focused regression proof and one canonical ./verify PASS. Do not touch the live installation in this revision."

scope:
  required_changes:
    - "Fresh-bind the exact revision-4 base and confirm the live predecessor remains healthy after revision-3 automatic rollback. Observation is read-only only; no live lifecycle/cutover mutation is authorized."
    - "Change only macos/candidate_cutover.py and tests/test_candidate_cutover.py, plus the eventual TASK-0194 report artifact."
    - "Preserve package_provenance._payload_closure exactly: canonical payload identity remains content-addressed by file path/mode/size/content hashes and intentionally does not include source_revision/source_tree."
    - "Preserve provenance.validate_zero_cost_candidate and _zero_cost_validate_input exact external-candidate semantics. The candidate app + handoff + supplied external payload must still require matching source_revision/source_tree before any cutover mutation."
    - "Preserve payload manifest schema, zero-cost candidate schema, transaction schema, current-payload pointer format, payload directory naming, lifecycle contract, public surface, and rollback model."
    - "When zero-cost cutover reaches an already-existing canonical final payload path for the candidate closure, validate that canonical release by exact closure and the candidate substrate compatibility contract: requirements_lock_sha256, required Python major/minor, lifecycle/payload contract, expected public tool count, expected public surface, complete immutable files inventory and content closure. Historical source_revision/source_tree on that canonical content object must not be required to equal the candidate revision/tree."
    - "Do not overwrite, replace, rename, chmod-mutate, or republish the pre-existing canonical payload merely to make its source metadata match the candidate. The existing content-addressed object must remain byte-for-byte unchanged when reused."
    - "Retain the transaction-staged candidate payload when the canonical closure already exists. That staged payload remains the exact source_revision/source_tree provenance witness for the candidate through the PENDING boundary and commit."
    - "At commit, validate the installed app/handoff against exact candidate provenance using the transaction-owned staged candidate payload when the canonical payload was reused. Separately validate that the canonical payload selected by current-payload is content/compatibility-valid for the installed substrate."
    - "If the transaction created the canonical payload because the closure did not previously exist, existing exact candidate behavior may remain unchanged; do not weaken the normal new-payload path."
    - "If an existing canonical payload has the same content closure but incompatible requirements lock, Python contract, lifecycle/payload contract, public tool count, public surface, malformed manifest, mutated files, wrong modes, or other compatibility defect, cutover/commit must still fail closed."
    - "Rollback semantics must remain correct. A reused pre-existing canonical payload must never be deleted on rollback; a transaction-created payload retains existing bounded deletion behavior."
    - "Do not alter LaunchServices behavior in revision 4. F-0194-002 has a separate accepted architectural disposition; no package_app.sh or lsregister source change is authorized here."
    - "Add a deterministic regression reproducing the live collision: publish two payload manifests from identical Python file bytes and identical compatibility fields but different source_revision/source_tree, confirm they share one content_closure, seed the canonical store with the older identity, then install a candidate whose exact staged payload carries the newer identity."
    - "The regression must prove cutover reaches PENDING and commit reaches COMMITTED while metadata records payload.created=false, current-payload selects the shared closure, the pre-existing canonical payload bytes/manifest remain byte-for-byte unchanged, and exact candidate provenance is still proven by the staged transaction payload."
    - "Add or preserve a negative regression proving a same-closure canonical payload with incompatible non-source compatibility metadata is rejected rather than silently reused."
    - "Add or preserve a negative regression proving the external candidate payload itself cannot carry mismatched source_revision/source_tree even though canonical-store reuse may carry historical source metadata."
    - "Run focused exact regression tests first, then the complete tests.test_candidate_cutover module."
    - "Run tests.test_package_provenance to prove the external zero-cost provenance and content-addressed payload contracts remain intact."
    - "Only after focused suites pass, run exactly one new canonical ./verify invocation through a durable/reconcilable path. Reconcile an ambiguous carrier response against the same execution and never blind-replay."
    - "If canonical ./verify fails conclusively, stop with truthful evidence. Do not perform live activation, candidate build, install-prebuilt, rollback, commit, menu-bar relaunch, or Runtime Start in revision 4."
    - "Publish one reviewable implementation candidate and report. MAIN ONLY; no branch/PR."

