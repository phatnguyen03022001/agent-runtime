acceptance_criteria:
  - id: AC-1
    requirement: "The live collision is reproduced deterministically and closed without changing payload identity architecture."
    evidence_required: "Regression creates identical payload content/closure with different source revision/tree, seeds older canonical payload, supplies newer exact candidate payload, and zero-cost cutover reaches PENDING then COMMITTED."
  - id: AC-2
    requirement: "Canonical reuse is content/compatibility based and immutable."
    evidence_required: "Reused canonical payload passes all compatibility/content validation, payload.created=false, pointer selects the shared closure, and the canonical payload tree including manifest remains byte-for-byte unchanged across cutover/commit."
  - id: AC-3
    requirement: "Exact candidate provenance remains fail-closed."
    evidence_required: "Transaction-staged candidate payload retains exact source revision/tree and is used to prove candidate identity through commit; an externally supplied mismatched-source candidate payload still fails before mutation."
  - id: AC-4
    requirement: "Incompatible canonical collisions remain blocked."
    evidence_required: "Negative regression proves same content closure cannot bypass incompatible requirements/Python/public-surface/contract metadata or payload integrity checks."
  - id: AC-5
    requirement: "Rollback ownership remains correct."
    evidence_required: "Regression/source inspection proves reused payload is never transaction-deleted, while existing created-payload rollback behavior remains unchanged."
  - id: AC-6
    requirement: "Focused and canonical verification pass."
    evidence_required: "Targeted collision tests PASS, complete tests.test_candidate_cutover PASS, tests.test_package_provenance PASS, then exactly one durable/reconcilable ./verify invocation PASSes with no blind retry."
  - id: AC-7
    requirement: "Revision 4 has zero live/product activation effects."
    evidence_required: "No package build, install-prebuilt, cutover, rollback, commit, Runtime lifecycle action, menu-bar relaunch, LaunchServices mutation, reboot, release, or permission effect."
  - id: AC-8
    requirement: "Repository closure is minimal and canonical."
    evidence_required: "One implementation candidate changing only authorized source/test files, truthful report, clean synchronized MAIN ONLY topology."

