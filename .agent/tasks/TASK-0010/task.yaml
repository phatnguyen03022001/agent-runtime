structure_authority:
  status: RESOLVED
  source: "Accepted decommission/promotion reviews and exact known operator checkout path."
  rationale: "The active runtime, process, tunnel profile, runtime config/state/share, and main repository surface are already retired. The remaining primary checkout is stale local residue containing runnable historical code plus local ignored files such as .env/.venv. Removing that exact checkout reduces residual executable/secret-bearing state while preserving canonical GitHub history. GitHub repository deletion/archive and unrelated local state remain out of scope."

objective: "Remove the exact retired operator-Mac primary checkout /Users/tienphat/Developer/agent-runtime after proving repository/path identity, absence of active process use, and absence of uncommitted/non-ignored local work; do not read secret contents; preserve the canonical GitHub tombstone/history and all unrelated local state; publish only canonical cleanup evidence on dev."

scope:
  required_changes:
    - "Refresh GitHub truth and require dev equals the exact handoff base, main equals b52cdc73b0589d9e14adfbb3647fcccdb0ee65ab, and branches exactly {dev, main}. Resolve accepted TASK-0008 and TASK-0009 reviews."
    - "Use direct authorized operator-Mac execution when available; otherwise use one bounded OPERATOR_SUPPLIED Terminal bundle, with at most one narrower follow-up for one concrete unresolved fact."
    - "Bind exactly /Users/tienphat/Developer/agent-runtime: lexical path and realpath must both equal that exact path; the checkout root itself must not be a symlink; git rev-parse --show-toplevel must equal the same exact path; canonical remote identity must normalize to phatnguyen03022001/agent-runtime."
    - "Before deletion, prove no active process has cwd/executable/module attribution to the checkout or agent-runtime server/tunnel. Do not stop or signal anything in this task; any active/ambiguous process blocks deletion."
    - "Before deletion, inspect only Git metadata/status and safe top-level path metadata. Do not read .env contents, keychain, arbitrary environment, SSH material, shell history, or tunnel credentials."
    - "Require no tracked modifications and no non-ignored untracked files in the checkout. If any such local work exists, stop BLOCKED and report the bounded paths/status only; do not delete or auto-clean it. Ignored/local files inside this exact checkout, including .env and .venv, are explicitly authorized for deletion with the checkout and must not be read merely to delete them."
    - "Delete exactly /Users/tienphat/Developer/agent-runtime and all contents only after all identity/process/local-work guards pass. Refuse path escape, symlinked checkout root, identity mismatch, or ambiguity."
    - "After deletion, verify the exact checkout path is absent and that /Users/tienphat/Developer still exists. Make no absence claim beyond the exact authorized checkout."
    - "Do not delete/archive/rename the GitHub repository; do not mutate main, branches, tags, releases, repository metadata, tunnel-client installation, unrelated tunnel profiles/state, sibling repositories, or other Developer paths."
    - "Create/push only .agent/tasks/TASK-0010/report.yaml as a separate report-only commit on dev after local deletion succeeds. Record Mac evidence provenance truthfully, verify final refs/topology, and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - .agent/tasks/**
    - LICENSE
    - README.md
  expected_files_are_restrictive: true

invariants:
  - "Canonical GitHub main remains the retired tombstone candidate b52cdc73b0589d9e14adfbb3647fcccdb0ee65ab."
  - "GitHub repository and historical evidence remain intact."
  - "Only exact local checkout /Users/tienphat/Developer/agent-runtime is deleted."
  - "No active process is stopped/signaled."
  - "No .env or other secret content is read or printed."
  - "Local tracked modifications or non-ignored untracked work block deletion rather than being discarded."
  - "Sibling repositories and unrelated local state remain untouched."
  - "Final branches remain exactly {dev, main}."

forbidden_changes:
  - "Do not mutate implementation/tombstone content, main, existing historical task/report/review artifacts, other repositories, tags, releases, archive state, or repository metadata."
  - "Do not delete or archive the GitHub repository."
  - "Do not delete any path other than /Users/tienphat/Developer/agent-runtime."
  - "Do not read/print .env contents, secrets, arbitrary environment, keychain, SSH material, shell history, or tunnel credentials."
  - "Do not use rm patterns/globs whose resolved target can exceed the exact checkout; do not follow a symlinked checkout root."
  - "Do not use git reset/clean to erase local work as a prelude to deletion."
  - "Do not stop, signal, restart, or launch agent-runtime/tunnel processes."

