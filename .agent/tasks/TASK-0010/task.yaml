    - "Before deletion, inspect only Git metadata/status and safe top-level path metadata. Do not read .env contents, keychain, arbitrary environment, SSH material, shell history, or tunnel credentials."
    - "Require no tracked modifications and no non-ignored untracked files in the checkout. If any such local work exists, stop BLOCKED and report bounded paths/status only; do not delete or auto-clean it. Ignored/local files inside this exact checkout, including .env and .venv, are explicitly authorized for deletion with the checkout and must not be read merely to delete them."
