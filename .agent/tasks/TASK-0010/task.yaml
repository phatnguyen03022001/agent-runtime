    requirement: "The deleted path is exactly the retired agent-runtime primary checkout."
    evidence_required: "Bounded evidence proves exact lexical path, realpath, non-symlink root, git top-level, and remote owner/repo identity before deletion."
  - id: AC-2
    requirement: "Deletion does not discard live process use or uncommitted canonicalizable local work."
    evidence_required: "No active/ambiguous agent-runtime or checkout-attributed process; git status has no tracked modifications and no non-ignored untracked files before deletion."
  - id: AC-3
    requirement: "Secret-bearing/local ignored residue is removed without secret inspection."
    evidence_required: "Exact checkout becomes absent; report records deletion of checkout including ignored local residue such as .env/.venv without printing or reading secret contents."
  - id: AC-4
    requirement: "Canonical/history boundaries remain intact."
    evidence_required: "main remains b52cdc73..., GitHub repository remains present, branches {dev, main}, no other repo/metadata/tag/release/local sibling mutation."
  - id: AC-5
    requirement: "Evidence provenance is truthful and bounded."
    evidence_required: "Direct Mac evidence is identified as such when available; otherwise operator Terminal output is labeled OPERATOR_SUPPLIED; only safe identity/status/path metadata is recorded."
  - id: AC-6
