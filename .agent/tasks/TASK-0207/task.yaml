    - "The regression must inspect LiquidGlassSupport.swift and PresentationTests.swift and reject any static '.effectIsInteractive' member access."
    - "The regression must require the production source to retain the macOS 27 availability guard, setEffectIsInteractive: selector existence check, responds(to:) guard, and KVC assignment for effectIsInteractive."
    - "Do not add a new Python test module."
    - "Do not change Package.swift deployment floor, workflow runner, Xcode selection, release-gate workflow, compatibility matrix, version, schemas or public Runtime behavior."
    - "Record local xcodebuild -version, xcrun swift --version and macOS SDK version as evidence. Local proof is source/current-SDK proof only and must not be described as SDK26 compilation proof."
