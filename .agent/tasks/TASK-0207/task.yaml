    - "Keep the standard NSView fallback and constraints on macOS 13-15 unchanged."
    - "Remove every static Swift member access to NSGlassEffectView.effectIsInteractive from production source."
    - "On macOS 27+, preserve interactive glass visual feedback using a bounded dynamic Objective-C path: resolve selector setEffectIsInteractive:, require glassView.responds(to:) before mutation, then set the KVC key effectIsInteractive to true."
    - "The dynamic path must remain inside an #available(macOS 27.0, *) runtime guard."
    - "If the selector is unexpectedly unavailable, do not crash and do not use undefined selector dispatch; leave the glass effect at the system default."
    - "Do not use objc_msgSend, unsafeBitCast, reflection over private ivars, private API, or undocumented selector names."
    - "Do not change LiquidGlassSupport.isLiquidGlassSupported semantics: true on macOS 26+, false below."
    - "Update the LiquidGlassSupport comments so they accurately state that the optional macOS 27 interaction knob is dynamically bound to retain build compatibility with the macOS 26 SDK."
