objective: >-
  Implement the minimal ToolContract Kernel v1, deterministic ReceiptV1 canonicalization,
  and one internal reference adoption for fs_read_batch. Preserve every existing public
  fs_read_batch request/result/error contract and preserve the exact eleven-tool public MCP surface.
  Do not migrate the other ten tools and do not implement Wave 1 capabilities.

architecture:
  principles:
    - "contract kernel != tool implementation"
    - "success payload remains tool-specific"
    - "existing public TypedToolErrorEnvelope remains unchanged"
    - "kernel is internal metadata/composition infrastructure, not a policy engine"
    - "ReceiptV1 binds subject identity + semantic parameters + complete observed state"
    - "no new runtime dependency"

kernel:
  path: agent_runtime/tool_contract.py
  required_public_symbols:
    - ToolClass
    - NetworkAuthority
    - MutationAuthority
    - Authority
    - ContractErrorCode
    - ContractError
    - ReceiptV1
    - ToolAnnotations
    - ToolContract
    - canonical_structured_bytes
    - frame_bytes
    - make_receipt_v1
  ToolClass:
    exact_values:
      - read
      - write
      - process
      - repo
      - host
  NetworkAuthority:
    exact_values:
      - none
      - bounded
  MutationAuthority:
    exact_values:
      - none
      - bounded
      - destructive
  Authority:
    immutable: true
    exact_fields:
      workspace_bound: bool
      network: NetworkAuthority
      mutation: MutationAuthority
  ContractErrorCode:
    exact_values:
      - INVALID_ARGUMENT
      - OUTSIDE_WORKSPACE
      - PRECONDITION_FAILED
      - STATE_CHANGED
      - CONFLICT
      - LIMIT_EXCEEDED
      - TIMEOUT
      - PERMISSION_DENIED
      - NOT_FOUND
      - UNAVAILABLE
      - INTERNAL_ERROR
  ContractError:
    immutable: true
    exact_fields:
      code: ContractErrorCode
      reason_code: stable_nonempty_string
      retryable: bool
    note: "This is kernel metadata, not a replacement for current public tool error envelopes."
  ReceiptV1:
    immutable: true
    exact_fields:
      schema_version: 1
      kind: stable_nonempty_string
      digest: lowercase_sha256_hex
  ToolAnnotations:
    immutable: true
    exact_fields:
      read_only: bool
      destructive: bool
      idempotent: bool
      open_world: bool
  ToolContract:
    immutable: true
    required_fields:
      name: stable_nonempty_string
      tool_class: ToolClass
      authority: Authority
      annotations: ToolAnnotations
      preconditions: canonical_structured_value
      bounds: canonical_structured_value
      postconditions: canonical_structured_value

structured_canonicalization:
  accepted_in_memory_types:
    - dict_with_string_keys
    - list
    - string
    - integer
    - boolean
    - null
  rejected:
    - float
    - NaN
    - Infinity
    - bytes_inside_structured_values
    - tuple
    - set
    - datetime_or_timestamp_objects
    - enum_objects
    - arbitrary_objects
    - non_string_object_keys
    - invalid_utf8_or_unpaired_surrogate_strings
  rules:
    - "boolean must remain distinct from integer semantics despite Python bool subclassing int"
    - "object keys sort deterministically"
    - "dict insertion order does not affect canonical bytes"
    - "ordered lists preserve order"
    - "serializer never guesses set semantics"
    - "set-like values must be normalized explicitly by callers before canonicalization"
    - "UTF-8 encoding is deterministic"
    - "no whitespace-dependent encoding"
    - "duplicate JSON keys must never be introduced by this module"
  representation: >-
    Use one documented deterministic UTF-8 structured representation. JSON is acceptable only if
    emitted with deterministic sorted object keys, compact separators, no NaN/Infinity, and strict
    rejection of unsupported values before serialization.

receipt_v1:
  namespace_utf8: "agent-runtime.receipt.v1"
  frame_definition: "uint64_be(byte_length(payload)) || payload"
  digest_definition: >-
    lowerhex(SHA256(frame(namespace) || frame(kind) || frame(canonical(subject))
    || frame(canonical(semantic_parameters)) || frame(observed_state_bytes)))
  make_receipt_v1:
    required_inputs:
      kind: stable_nonempty_string
      subject: canonical_structured_value
      semantic_parameters: canonical_structured_value
      observed_state_bytes: exact_bytes
    requirements:
      - "observed_state_bytes must be bytes, not text or an arbitrary buffer object"
      - "digest must hash complete provided observed_state_bytes without truncation"
      - "no timestamp, random value, process identity, host path, or prose is added implicitly"
      - "same semantic inputs produce exactly the same digest"
      - "changing namespace semantics, kind, subject, semantic parameters, or observed bytes changes digest"
      - "frame_bytes rejects payload lengths outside uint64 range"
      - "ReceiptV1 schema_version is exactly 1"

fs_read_reference_adoption:
  contract_location: agent_runtime/fs_read.py
  constant_name: FS_READ_BATCH_CONTRACT
  requirements:
    - "Define exactly one immutable ToolContract constant for fs_read_batch."
    - "tool_class=read"
    - "authority.workspace_bound=true"
    - "authority.network=none"
    - "authority.mutation=none"
    - "annotations read_only=true, destructive=false, idempotent=true, open_world=false"
    - "Preconditions/bounds/postconditions must describe only behavior enforced by current source."
    - "Use existing fs_read constants as the source for numeric bounds; do not duplicate magic numbers where imports/constants suffice."
    - "Represent max items=20 from the current request contract."
    - "Represent ITEM_OUTPUT_LIMIT_BYTES=128KiB, BATCH_OUTPUT_LIMIT_BYTES=256KiB, ITEM_SCAN_LIMIT_BYTES=1MiB, BATCH_SCAN_LIMIT_BYTES=4MiB."
    - "Represent current cwd-relative descendant path requirement, no empty/dot/dot-dot components, no symlink traversal, regular-file only, strict UTF-8 output, ordered results, and per-item filesystem failures."
    - "Do not claim atomic snapshots, inode stability across the entire batch, network isolation beyond the actual no-network implementation, or any guarantee not enforced today."
    - "Do not add ReceiptV1 to fs_read_batch public output."

server_adoption:
  path: agent_runtime/server.py
  requirements:
    - "Use FS_READ_BATCH_CONTRACT.annotations as the source of all four fs_read_batch MCP annotation booleans."
    - "A tiny adapter from ToolAnnotations to existing _tool(...) keyword arguments is allowed."
    - "Do not generalize or migrate annotation registration for other tools in this task unless required to avoid duplication in the fs_read_batch call site."
    - "fs_read_batch function signature, docstring semantics, delegate, result type, request schema, result schema, and error behavior must remain unchanged."

public_contract_invariants:
  tool_count: 11
  exact_order:
    - terminal_exec
    - terminal_start
    - terminal_poll
    - terminal_control
    - terminal_resize
    - capacity_observer
    - fs_read_batch
    - repo_observer
    - repo_fast_forward
