tests:
  new_file: tests/test_tool_contract.py
  required_kernel_proofs:
    - "Exact enum value sets are frozen."
    - "Immutable metadata objects reject invalid or empty stable-string fields."
    - "ReceiptV1 rejects invalid schema/digest/kind states."
    - "canonical_structured_bytes is identical across dict insertion orders."
    - "Canonical object-key sorting is recursive."
    - "Ordered lists remain order-sensitive."
    - "bool and int serialize with their correct distinct structured semantics."
    - "float, bytes, tuple, set, non-string keys, unsupported objects, and invalid surrogate strings are rejected."
    - "frame_bytes uses 8-byte unsigned big-endian byte length and prevents concatenation ambiguity."
    - "make_receipt_v1 is deterministic for equivalent structured values."
    - "Changing kind changes digest."
    - "Changing subject changes digest."
    - "Changing semantic parameters changes digest."
    - "Changing observed_state_bytes changes digest."
  fs_read_proofs:
    - "FS_READ_BATCH_CONTRACT exactly matches current read/no-network/no-mutation authority."
    - "All four MCP annotations for fs_read_batch still resolve to true/false/true/false."
    - "Numeric metadata bounds are bound to current source constants and max-items request contract."
    - "Existing fs_read_batch behavior tests remain unchanged except minimal contract assertions if needed."
    - "Public request/result/error schemas remain byte/structure-equivalent to the accepted pre-task contract."
    - "Exact eleven-tool surface/order remains unchanged."
    - "screen_capture guard tests remain green."

