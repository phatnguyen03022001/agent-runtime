acceptance_criteria:
  - {id: AC-1, requirement: "One fresh remote run is uniquely bound to the authorized TASK-0206 source identity.", evidence_required: "Both historical runs remain attempt 1; one new workflow_dispatch attempt 1; exact head SHA; no rerun/second dispatch; terminal success."}
  - {id: AC-2, requirement: "Remote canonical verification and candidate build gate succeed.", evidence_required: "build-release success with full canonical verify, exactly one candidate build, deterministic double-build comparison, release_bundle verify and upload."}
  - {id: AC-3, requirement: "ARM64 compatibility matrix succeeds.", evidence_required: "macOS 14/15/26 jobs all materialized and PASS checksum, bundle verification, strict codesign/provenance and Python 3.13 arm64 smoke."}
  - {id: AC-4, requirement: "Remote release artifact is complete and source-bound.", evidence_required: "Exactly one artifact with exactly three payload files; checksum/manifest/local read-only release_bundle verify PASS; manifest source_revision equals new run head SHA."}
  - {id: AC-5, requirement: "No publication or live effect occurs.", evidence_required: "All release/live/config/plugin/reboot effect counts zero."}
  - {id: AC-6, requirement: "Canonical closure.", evidence_required: "Only report changes; evidence bytes removed; clean synchronized MAIN ONLY."}

verification:
  authoritative_verification:
    required: true
    mechanism: "Exactly one fresh remote release-gate workflow_dispatch plus job/log/artifact inspection."
    expected_signal: "Remote exact-SHA build-release and macOS 14/15/26 compatibility matrix succeed with one coherent release artifact."

continuation_policy:
  mode: MANUAL
  stop_conditions: [BLOCKED, STALE_STATE, AUTHORITY_REQUIRED, CURRENT_PHASE_CAPABILITY_UNAVAILABLE, REVIEW_REQUIRED, USER_STOP]

