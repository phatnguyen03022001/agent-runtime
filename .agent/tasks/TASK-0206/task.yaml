objective: "Dispatch exactly one NEW release-gate run at the exact authorized TASK-0206 source identity and prove the accepted remote release pipeline succeeds end-to-end through canonical verification, one frozen candidate, deterministic bundle proof, ARM64 macOS 14/15/26 compatibility lanes and artifact verification. No source fix, rerun or release publication is authorized."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with local main and origin/main clean/synchronized MAIN ONLY and one worktree."
    - "Confirm accepted TASK-0205 durable owner identity stabilization is present."
    - "Confirm agent_runtime/durable_pipe_runner.py requires two consecutive non-None exact-equal observations with 0.5-second total identity budget and 0.01-second polling."
    - "Confirm .github/workflows/release-gate.yml blob is exactly fa0c6bc61bb660b103f3a45b239ac52def7ae1b8 and remains workflow_dispatch-only with contents:read."
    - "Fetch pre-dispatch workflow run inventory."
    - "Require historical run 36912032079 remains run_attempt=1 and was never rerun."
    - "Require historical run 36956517661 remains run_attempt=1 and was never rerun."
    - "Record the complete pre-dispatch run-id set."
    - "Dispatch .github/workflows/release-gate.yml exactly once with ref=main. This must create a NEW run."
    - "Do not invoke any rerun API/action and do not dispatch a second run."
    - "Identify exactly one newly created run and require event=workflow_dispatch, run_attempt=1, head_branch=main, workflow path=.github/workflows/release-gate.yml, and head_sha equal the exact authorized TASK-0206 base."
    - "If the run identity is ambiguous, reconcile by exact run inventory/id only; never redispatch."
    - "Observe only that exact new run until terminal."
    - "Require final conclusion success."
    - "Require exactly one successful build-release job and three successful compatibility jobs materialized for macos-14, macos-15 and macos-26."
    - "Inspect build-release logs/steps and prove PASS for checkout, ARM64 assertion, Python 3.13, locked dependencies, canonical ./verify, exactly one zero-cost candidate build, deterministic bundle build twice, byte comparisons, release_bundle verify and upload."
    - "Record remote canonical verify classified/completed module count and test total."
    - "Require tests.test_durable_pipe PASS and tests.test_durable_pipe_restart PASS if module-level evidence is available."
    - "Require tests.test_product_qualification PASS if module-level evidence is available."
    - "Record bounded candidate identity evidence including candidate_sha256 and candidate_root or equivalent workflow output."
    - "Inspect all three compatibility jobs and require each to PASS ARM64 assertion, exact artifact download, SHA256SUMS verification, release_bundle verify, strict codesign --verify --deep --strict, package_provenance validate-zero-cost and bundled Python 3.13 arm64 smoke."
    - "Require exactly one artifact named agent-runtime-release-assets for the new run."
    - "Download that artifact exactly once."
    - "Treat the GitHub artifact ZIP as transport only. Require exactly three release payload files: one .tar.gz, release-manifest.json and SHA256SUMS.txt."
    - "Reject any extra release payload file."
    - "Inspect only in isolated run-owned evidence storage and do not commit binary assets."
    - "Verify SHA256SUMS against the archive and require release-manifest archive filename/hash/size agreement."
    - "Run accepted macos/release_bundle.py verify locally read-only against the downloaded assets. Do not build a candidate locally."
    - "Record release-manifest fields: runtime_version, source_revision, source_tree, candidate_sha256, initial_payload_closure, requirements_lock_sha256, expected_public_tool_count, expected_public_surface_sha256, substrate_manifest_schema, candidate_handoff_schema, payload_schema, archive_filename, archive_sha256, archive_size_bytes, archive_member_count."
    - "Require release-manifest source_revision equals the new workflow run head_sha under the accepted provenance contract."
    - "Any failure in canonical verify, candidate build, deterministic bundle proof, compatibility matrix, artifact or source identity is BLOCKED. Do not fix or rerun within TASK-0206."
    - "Delete downloaded/materialized evidence after recording bounded hashes/facts."
    - "Publish only .agent/tasks/TASK-0206/report.yaml as tracked repository mutation."
    - "Final main clean/synchronized MAIN ONLY, one worktree, no residue."

  allowed_existing_files_or_components:
    - ".agent/tasks/TASK-0206/report.yaml"

invariants:
  - "Historical runs 36912032079 and 36956517661 remain attempt 1 and are never rerun."
  - "Exactly one new release-gate dispatch."
  - "Accepted TASK-0205 source remains unchanged."
  - "Accepted release-gate workflow remains unchanged."
  - "No source/test/workflow/policy/docs/version/schema mutation."
  - "No local canonical ./verify or package build."
  - "No tag/release/publication/live install/cutover/lifecycle/plugin/config/credential/permission/reboot effect."
  - "TASK-0196 remains paused."
  - "MAIN ONLY."

forbidden_changes:
  - "Any tracked file other than eventual TASK-0206 report."
  - "Any source/test/workflow/policy/docs/dependency/version/schema change."
  - "Rerun of run 36912032079 or 36956517661."
  - "Any GitHub Actions rerun API/action."
  - "Any second new workflow dispatch."
  - "Any local package_app.sh build or local canonical ./verify."
  - "Any tag, GitHub Release or release publication."
  - "Any live install/cutover/menu launch/Runtime Start/Stop/Restart/plugin/config/credential/permission/reboot effect."
  - "Any branch or PR."

