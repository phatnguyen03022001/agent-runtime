    unrelated_cleanup: false

rollback_recovery_constraints:
  - "Preserve forward Git history; no reset/force-push/squash of shared dev history."
  - "Modern-registration source must retain tested rollback compatibility with the exact legacy predecessor state until a later live activation is accepted."
  - "A future activation failure must restore the previous known-good package/registration/desired-state facts or stop with attributable pending transaction evidence; this task performs no such live recovery."
  - "Uninstall is not rollback, rollback is not uninstall, and neither implies deletion of retained runtime.env or unrelated host state."

