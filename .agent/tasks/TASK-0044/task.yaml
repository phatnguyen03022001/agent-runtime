structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "The task tightens the existing package/install/cutover pipeline and may add only a narrowly scoped helper inside the existing macos ownership boundary; no new service, daemon, framework, or source ownership layer is authorized."

objective: "Make one finalized signed Agent Runtime application bundle a stable external candidate that can be verified, handed off, installed, and later accepted or rolled back without rebuilding or re-signing it, while retaining recoverable known-good package and launch state until an explicit post-cutover commit."

scope:
  required_changes:
    - "Separate package construction from prebuilt-candidate installation/activation. Provide an explicit install/cutover path that consumes an already-built Agent Runtime.app plus an expected external candidate identity and that cannot invoke package_app.sh, rebuild Python/Swift payloads, regenerate manifests, or re-sign candidate bytes. Existing convenience build-and-install behavior may remain only as composition of distinct build then prebuilt-install phases; the prebuilt path itself must remain rebuild-free."
    - "Define one deterministic external post-sign candidate-closure identity over the complete logical Agent Runtime.app bundle. The closure contains every regular file below the app root, including _CodeSignature and every other signing-owned regular file; symlinks and unsupported non-regular entries are rejected. Directories are implicit. Each canonical record is relative POSIX path + TAB + four-digit lowercase octal permission mode + TAB + decimal byte size + TAB + lowercase SHA-256 + LF. Paths must be relative, UTF-8, unique, contain no NUL/TAB/CR/LF or dot/dot-dot traversal component, and records are sorted by UTF-8 path bytes. The external candidate digest is SHA-256 of the concatenated canonical records. Ownership, timestamps, directory metadata, and extended attributes are not candidate identity."
    - "Candidate closure is external to the app bundle and is computed only after payload construction, runtime-manifest generation, all required candidate-mutating probes, signing, strict codesign verification, and final runtime-manifest closure verification. A machine-readable handoff may carry schema version, bundle identifier, source revision/tree, record count, and closure digest, but the app must not contain its own final external digest."
    - "Preserve TASK-0042 embedded provenance as an independent layer: exact source revision/tree, requirements.lock identity, runtime-manifest file closure, and strict codesign remain mandatory. External whole-bundle closure augments rather than replaces runtime manifest or codesign. Bit-for-bit reproducible build is not claimed or required."
    - "Decouple prebuilt-candidate validation from the invoking checkout HEAD. The installer must validate candidate-owned embedded revision/tree/lock provenance plus the caller-supplied expected external candidate identity; current git rev-parse HEAD of the checkout running the installer must not be the sole or required candidate identity. A valid candidate built from an accepted earlier immutable commit must remain installable from a later checkout containing only planning/review artifacts."
    - "Recompute and verify the same external candidate closure after candidate staging and again after placement at the installed app path. Reject omitted, substituted, mode-changed, content-changed, unexpected, symlinked, post-sign mutated, invalid-codesign, invalid-manifest, or wrong-candidate state before it can be certified."
    - "Make post-seal candidate mutation fail closed. No live install/activation path may silently repair, rebuild, regenerate, or re-sign a sealed candidate. Any byte/mode mutation after seal invalidates the candidate identity and requires a new candidate to be built and sealed by the later freeze-candidate task."
    - "Provide the smallest transactional cutover mechanism that establishes verified rollback material and transaction metadata before the first destructive package/LaunchAgent mutation, stages the accepted candidate, swaps/validates installed bytes, updates only the required UI/Runtime LaunchAgent state, and leaves the transaction pending for an external caller to commit only after later live acceptance. Exact CLI/function decomposition is Executor-local HOW."
    - "Retain the previous verified Agent Runtime.app and the minimum previous UI/Runtime LaunchAgent file/loaded-state plus persisted desired-Runtime-state facts necessary to restore the pre-cutover state. Do not copy or log secret runtime.env values into transaction metadata. Canonical runtime.env itself is not mutated by this task's cutover mechanism."
    - "Expose an explicit bounded COMMIT and ROLLBACK contract, or an equivalently simple caller-visible boundary. Until COMMIT, the previous known-good state remains recoverable and must not be deleted. COMMIT may discard rollback material only after the caller has completed downstream live acceptance. ROLLBACK restores the prior package and relevant launch/desired-state state and verifies the restored known-good ownership/readiness predicates available without running downstream freeze proof."
    - "Reject a second cutover while one transaction remains pending. Pending rollback material must not be auto-deleted merely because a process exits or a later command starts. If rollback itself cannot complete, fail closed, preserve remaining forensic/rollback material, and report partial state rather than claiming success."
    - "Support deterministic synthetic failure injection or equivalent fixture control for material post-mutation stages so rollback behavior can be proven without lifecycle-mutating the operator's live Runtime. At minimum cover failure after app swap, failure after installed-candidate verification, LaunchAgent registration failure, and activation/refresh failure."
    - "Assess whether existing PID/process start identity, LaunchAgent ownership, executable path, listener ownership, health/readiness, and installed-artifact closure facts are sufficient for downstream TASK-0046 to distinguish the pre-cutover Runtime generation from the freshly activated generation. Add only the smallest non-secret observability support if current source cannot expose those facts; do not perform the live generation proof in TASK-0044."
    - "Preserve the accepted live-freeze configuration blocker as an explicit downstream condition. TASK-0044 must not overwrite canonical runtime.env or force checkout/live AGENT_RUNTIME_MAX_PARALLELISM equality for cosmetic consistency. If implementation discovers a source coupling that makes later proof of the intended canonical value impossible, stop BLOCKED for Architect judgment rather than silently choosing 2 or 4."
    - "Update README/package/install documentation only as required to describe prebuilt candidate identity, no-rebuild activation, pending cutover, commit/rollback semantics, and downstream freeze ownership."
  allowed_existing_files_or_components:
    - "install.sh"
    - "macos/package_app.sh"
    - "macos/package_provenance.py and at most one narrowly scoped package/cutover helper under existing macos/ ownership if justified by simplicity"
    - "macos/runtime_config.py, macos/recover_runtime_service.py, start.sh, and existing Swift process-ownership/lifecycle surfaces only when the required cutover/observability contract materially needs them"
    - "tests/test_package_provenance.py, tests/test_surface_and_scripts.py, tests/test_runtime_config.py, tests/test_service_recovery.py, tests/test_supervised_lifecycle.py, tests/test_tunnel_identity.py, existing macOS lifecycle/ownership tests, and narrowly focused new regressions"
    - "README.md"
    - ".agent/tasks/TASK-0044/report.yaml"
  expected_files_are_restrictive: false

invariants:
  - "TASK-0041 bounded MCP contracts, TASK-0042 provenance/bootstrap semantics, and TASK-0043 defense-in-depth threat contract remain unchanged except where TASK-0044 explicitly strengthens package/install/cutover behavior."
  - "One sealed candidate identity denotes one exact logical app-bundle file/mode closure after signing; same Git revision/tree alone is not treated as proof of same candidate bytes."
  - "Codesign, embedded runtime-manifest closure, and external whole-bundle candidate closure are independent mandatory checks at their applicable boundaries."
  - "The prebuilt install/cutover path never rebuilds, re-signs, or mutates the accepted candidate."
  - "Until explicit COMMIT, previous known-good package and required launch/desired-state rollback material remain recoverable."
  - "Failure before COMMIT never certifies the candidate; rollback is deterministic where the previous state was mutated, and rollback failure is a fail-closed partial-state result."
  - "A pending transaction cannot be silently superseded by another cutover."
  - "Canonical runtime.env, tunnel identity, credentials, port 8080, and the operator's installed/live Runtime are not mutated during TASK-0044 execution."
  - "No credential/tunnel secret may appear in candidate identity, rollback metadata, logs, tests, task/report artifacts, or Git."
  - "Protected Runtime remains a defense-in-depth recognized-intent filter, not a sandbox, privilege boundary, syscall filter, or complete same-UID isolation mechanism."
  - "CHATGPT_LOCAL local execution/file operations use Agent Runtime by default. OpenAI execution sandbox is not authorized for ordinary TASK-0044 work; lack of a required current-phase capability fails closed or uses only an already-authorized sufficient fallback."

forbidden_changes:
  - "Do not create TASK-0045/TASK-0046, CI freeze workflows, final candidate artifacts, live freeze evidence, promotion artifacts, tags, or releases in this task."
  - "Do not run install/cutover against the operator's live Agent Runtime, start/stop/restart/reload the live Runtime, mutate port 8080, runtime.env, tunnel identity, listener state, desired-state marker, live LaunchAgents, or installed app. Use synthetic/temp fixtures only."
  - "Do not change public MCP tools/schemas/semantics, fs_read_batch contracts, capacity/timing behavior, or ProtectedRuntimeGuard enforcement."
  - "Do not add interpreter-specific deny rules, custom sandbox/SBPL/Seatbelt policy, privilege-separation architecture, containers, syscall filters, or any platform-policy bypass/evasion mechanism."
  - "Do not add a deployment service, orchestrator, queue, generalized transaction framework, artifact registry, cache manager, generalized workspace manager, or dependency merely to implement this contract."
  - "Do not claim bit-for-bit reproducible builds."
  - "Do not change requirements/dependencies unless a revised Architect contract explicitly authorizes it."
  - "Do not promote to main or mutate main, tags, releases, repository metadata, or branch topology."


