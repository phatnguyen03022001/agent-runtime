acceptance_criteria:
  - id: AC-1
    requirement: "Package construction and prebuilt installation are mechanically separable; the prebuilt candidate path accepts a caller-supplied candidate/expected identity and cannot invoke build/package/signing regeneration."
    evidence_required: "Focused tests instrument the build/package path and prove zero build/re-sign invocation during valid prebuilt installation; source inspection proves any convenience build-and-install entry composes the two phases rather than hiding rebuild inside activation."
  - id: AC-2
    requirement: "External candidate identity deterministically closes over every regular signed app-bundle file and relevant permission mode after all mutating probes/signing, with unambiguous canonical records and no self-reference."
    evidence_required: "Independent fixture recomputation matches the implementation digest exactly; tests cover stable ordering, mode inclusion, symlink/non-regular rejection, path ambiguity rejection, signing metadata inclusion, and digest change for one-file or mode mutation."
  - id: AC-3
    requirement: "A prebuilt candidate is validated from candidate-owned embedded provenance plus the expected external candidate identity rather than requiring equality with the invoking checkout HEAD."
    evidence_required: "Fixture/integration tests accept one valid sealed candidate while the invoking checkout identity is intentionally different, and independently reject wrong expected revision/tree/lock/closure identity, invalid codesign, or invalid runtime manifest."
  - id: AC-4
    requirement: "Candidate identity is preserved through staging and installed placement and post-seal mutation cannot be silently repaired or certified."
    evidence_required: "Tests independently reject omitted, extra, substituted, mode-changed, byte-mutated, symlinked, and post-sign/post-seal state at staging or installed validation; exact source inspection proves live activation has no rebuild/re-sign fallback."
  - id: AC-5
    requirement: "Cutover retains a verified known-good rollback envelope before the first destructive mutation and exposes explicit pending, commit, and rollback semantics sufficient for later live acceptance."
    evidence_required: "Synthetic/temp-fixture tests prove previous app plus minimum launch/desired-state facts exist before mutation, survive through pending cutover, are removed only after explicit COMMIT, and a second cutover is rejected while pending."
  - id: AC-6
    requirement: "Material failures after mutation fail closed and restore the previous known-good package/launch/desired-state state without operator-live mutation."
    evidence_required: "Deterministic injected failures after app swap, after installed validation, during LaunchAgent registration, and during activation/refresh each prove candidate success is withheld and rollback restores the fixture's prior state; rollback-failure injection proves partial state/evidence is retained and success is not reported."
  - id: AC-7
    requirement: "TASK-0044 leaves downstream active-generation proof achievable without inventing sandbox/process-attestation infrastructure."
    evidence_required: "Report identifies the exact existing or minimally added non-secret facts TASK-0046 can use to distinguish pre/post Runtime generations and listener ownership; if those facts cannot be supplied inside authorized scope, execution stops BLOCKED rather than weakening downstream proof."
  - id: AC-8
    requirement: "No candidate probe or source-test path mutates a sealed candidate unnoticed, including Python bytecode creation."
    evidence_required: "Regression proves the chosen probe/test strategy either suppresses writes or probes a disposable pre-seal copy, then final codesign, embedded manifest closure, and external candidate closure remain unchanged after all candidate validation probes."
  - id: AC-9
    requirement: "The accepted AGENT_RUNTIME_MAX_PARALLELISM checkout/live mismatch is neither silently normalized nor forgotten, and TASK-0044 performs no live config mutation."
    evidence_required: "Exact diff/live-boundary audit plus report handoff records the mismatch as a downstream freeze condition unless an explicit later Architect decision resolves the intended canonical value."
  - id: AC-10
    requirement: "The stabilized implementation passes focused rollback/candidate-identity tests, broader affected package/install/lifecycle verification, and canonical ./verify once on the exact final implementation candidate without touching the live Runtime."
    evidence_required: "Record focused/affected test counts, one stabilized ./verify result/count, exact implementation SHA/tree, and explicit evidence that all activation/rollback tests used synthetic/temp fixtures."
  - id: AC-11
    requirement: "Published dev lineage contains one final implementation candidate commit followed by one report-only commit, non-force, with main unchanged, then stops for Architect review."
    evidence_required: "Fresh remote refs before/after publication and exact implementation/report lineage."

verification:
  executor_checks:
    - id: V-1
      command_or_check: "During iteration run only minimum targeted candidate-closure, prebuilt-install, transaction, rollback, and affected ownership/config regressions against synthetic/temp fixtures. Do not use the live installation as a test target."
      required: true
    - id: V-2
      command_or_check: "After implementation bytes stabilize, run the broader affected package/provenance/install/recovery/lifecycle test set once; group independent deterministic checks only when they share no mutable state."
      required: true
    - id: V-3
      command_or_check: "Create the final implementation candidate commit, ensure exact candidate state is clean, then run canonical ./verify once on that exact implementation candidate. If bytes change, rerun only invalidated final gates on the replacement exact candidate."
      required: true
    - id: V-4
      command_or_check: "Build one non-installed test package only as needed to prove the new source mechanics; finish all candidate-mutating probes before computing its external closure, then prove strict codesign + embedded manifest closure + external whole-bundle closure. No live install/activation is permitted."
      required: true
    - id: V-5
      command_or_check: "Run deterministic synthetic rollback failure cases for post-swap, post-validation, LaunchAgent-registration, activation/refresh, concurrent-pending, and rollback-failure boundaries; preserve attributable result per injected stage."
      required: true
    - id: V-6
      command_or_check: "Inspect exact task-base-to-candidate diff for public MCP/protection/dependency/CI/live-Runtime/main/tag/release violations and prove no sealed-candidate rebuild/re-sign fallback remains."
      required: true
    - id: V-7
      command_or_check: "Fresh-resolve origin/dev and origin/main immediately before non-force publication and again after publication; fail closed on drift."
      required: true
  authoritative_verification:
    required: false
    mechanism: "NONE"
    expected_signal: "NOT_REQUIRED_FOR_THIS_EXECUTION_TASK"

