executive_verdict: RECOMMEND_WITH_CONDITIONS
verdict_rationale: >-
  Add a tiny read-only stateless Capacity Observer only as an advisory machine-capacity ceiling, not as a scheduler or a proof that arbitrary work is safe. On this 8-active-core, 16-GiB Mac, bounded x2 execution produced substantial wall-clock improvement for every tested workload class while failures remained zero, thermal state remained nominal, and no swap-in or swap-out activity was observed during the focused load windows. The required host signals can mostly be obtained from stable public macOS facilities with low steady-state probe overhead. However, a one-shot supported API for the exact current macOS memory-pressure level was not proven, and a stable public API for enumerating only Runtime-owned descendant processes was not found. Runtime commands can also have unbounded resource demand that no instantaneous host snapshot can predict. Therefore revision 1 should cap its recommendation at 2, omit private process enumeration and unsupported pressure signals, expose bounded reason codes plus an auditable signal summary, fail conservatively on unknown/acute-pressure inputs, and leave all semantic independence and execution decisions with Architect/Executor. Raising the ceiling above 2 requires real-task evidence on representative hardware.

evidence_classification:
  CONFIRMED:
    - "Foundation ProcessInfo exposes public activeProcessorCount, processorCount and thermalState APIs on macOS; thermalState reports nominal/fair/serious/critical."
    - "The current macOS SDK exposes public Mach host_statistics/HOST_CPU_LOAD_INFO and host_statistics64/HOST_VM_INFO64 interfaces, including VM swap-in/swap-out counters and compressor-page counts."
    - "The current macOS SDK exposes getloadavg through libc and statfs with f_bavail for filesystem capacity."
    - "The current SDK exposes vm.swapusage and struct xsw_usage in the public portion of sys/sysctl.h."
    - "The local memory_pressure manual documents pressure-generation/simulation modes but does not document the observed -Q query option; therefore -Q is not accepted as a production contract by this spike."
    - "The local libproc.h explicitly labels its process-information interfaces private and subject to change; proc_listchildpids is among those interfaces."
    - "Agent Runtime terminal_exec creates a new process session for each one-shot command and owns timeout/process-group cleanup, but it does not maintain a global active one-shot task registry."
    - "TerminalSessionManager already tracks Runtime-owned persistent PTY sessions in memory, but that state is specific to PTY lifecycle and is not a complete count of all active task children."
    - "Current Runtime protection performs global ps command-line inspection for its existing narrow protection purpose; reusing that mechanism for capacity reporting would expand privacy scope and is rejected."
    - "Architect semantic independence and host capacity are separate predicates: machine headroom cannot prove that two tasks have no ordering or shared-mutable-state dependency."
  MEASURED:
    - "Research host: macOS 26.6.2 build 25G83, 8 physical/logical active processors reported by local probes, and 17179869184 bytes physical memory."
    - "The host had approximately 3.77 GB of 4.00 GiB configured swap already in use during the benchmark while bounded workloads completed without observed new swap-in/swap-out activity; existing swap occupancy alone is therefore not a sufficient serialize signal."
    - "Eighty warm standalone instant native helper probes had external mean 3.872 ms, p50 3.271 ms, p95 6.674 ms and max 13.292 ms; internal API collection averaged 0.204 ms. Spawned-helper CPU consumption totaled 205.685 ms across 80 probes, about 2.571 ms per probe."
    - "Twenty standalone probes with an intentional 50 ms sampling window had external mean 69.492 ms and p95 76.804 ms; internal duration averaged 54.793 ms and includes the deliberate 50 ms wait."
    - "Cold first-launch standalone helper outliers of about 601-717 ms were observed in two independent temporary fixtures; their cause was not isolated."
    - "Across three repeats of four independent jobs, x2 median wall-clock speedups were 1.991x light, 1.943x CPU, 1.939x memory and 1.672x I/O versus serial."
    - "Across the same runs, x4 median wall-clock speedups were 3.900x light, 3.768x CPU, 3.353x memory and 2.625x I/O versus serial."
    - "x2 median per-worker latency ratios versus serial were 0.998 light, 1.024 CPU, 1.027 memory and 1.277 I/O."
    - "x4 median per-worker latency ratios versus serial were 1.002 light, 1.052 CPU, 1.092 memory and 1.796 I/O, showing substantial I/O contention despite improved aggregate wall time."
    - "All serial/x2/x4 synthetic jobs completed with zero failures and all sampled thermal states remained nominal."
    - "A focused x4 CPU run produced 24 instant observer samples with p50 11.604 ms, p95 23.594 ms and max 41.341 ms external latency; scheduler-monitor jitter p95 was 5.477 ms; thermal remained nominal and swap-in/swap-out deltas were zero."
    - "A focused x4 memory run used four 128 MiB workers, produced 19 instant observer samples with p50 15.250 ms, p95 36.493 ms and max 105.504 ms; scheduler-monitor jitter p95 was 5.221 ms; thermal remained nominal and swap-in/swap-out deltas were zero."
    - "memory_pressure -Q reported 46% before, during and after both focused x4 CPU and memory runs, but the undocumented option is diagnostic evidence only and is not proposed for production."
    - "Both synthetic benchmark roots were deleted by guarded trap cleanup; generated I/O workload files were absent before final whole-root deletion."
  INFERRED:
    - "A v1 ceiling of 2 captures most of the measured parallel speedup while materially reducing the risk exposed by x4 I/O contention and by unmeasured real-task resource footprints."
    - "A 50 ms two-sample CPU/swap window is small enough for on-demand use and gives materially better current-load evidence than load average alone."
    - "The observer should treat non-nominal thermal state, active swap-out, insufficient CPU headroom and probe failure as conservative reasons to return 1."
    - "The observer should keep disk capacity as a veto/headroom guard rather than treating free disk as a positive reason to increase concurrency."
    - "A bounded JSON result with one advisory parallelism ceiling, reason codes and a small normalized signal summary is sufficient for v1; persistent history and adaptive control would add state without proving safer decisions."
    - "If active Runtime work count is later required, an existing spawn/ownership path could maintain a tiny ephemeral scalar/set scoped to Runtime-owned calls more cleanly than OS-wide process enumeration, but that implementation is outside this research revision."
  UNKNOWN:
    - "A supported one-shot API that returns the exact current system memory-pressure level without persistent event state was not proven."
    - "The semantics and support contract of vm.memory_pressure and kern.memorystatus_* sysctls were not established; their observed raw values are not interpreted."
    - "A stable public macOS API for enumerating only Runtime-owned descendant processes was not found."
    - "Production in-process observer latency and CPU overhead are NOT_MEASURED; the helper-process benchmarks bound a practical prototype path but include process-launch cost."
    - "GUI interaction latency and end-user responsiveness under parallel execution are NOT_MEASURED; scheduler jitter and instant-probe latency are only bounded non-GUI proxies."
    - "Real Agent Runtime task distributions, dependency installs, Xcode builds, large Node/Rust builds, network-heavy jobs and other machines are NOT_MEASURED."
    - "Safe automatic x4 admission for production workloads is NOT_MEASURED."

stable_macos_metric_sources:
  cpu_topology:
    classification: CONFIRMED
    preferred_source: "Foundation ProcessInfo.activeProcessorCount and processorCount"
    supportability: PUBLIC_SUPPORTED
    measured_host: {active_processors: 8, processor_count: 8}
    notes:
      - "Use activeProcessorCount for currently available logical CPU capacity rather than hard-coding hardware assumptions."
      - "The observer should not infer task independence from CPU count."
    official_source: "https://developer.apple.com/documentation/foundation/processinfo/activeprocessorcount"
  current_cpu_busy:
    classification: CONFIRMED
    preferred_source: "Two HOST_CPU_LOAD_INFO samples through host_statistics across a short bounded window."
    supportability: PUBLIC_SUPPORTED
    notes:
      - "CPU tick counters require a delta; one sample is not a utilization percentage."
      - "A short sample adds deliberate latency but avoids relying only on lagging load averages."
    official_source: "https://developer.apple.com/documentation/kernel/1502546-host_statistics"
  load_average:
    classification: CONFIRMED
    preferred_source: "getloadavg"
    supportability: PUBLIC_SUPPORTED_LIBC
    notes:
      - "Useful as a coarse sustained run-queue signal."
      - "It is inherently lagging and should not be the sole admission signal."
    official_source: "https://developer.apple.com/library/archive/documentation/System/Conceptual/ManPages_iPhoneOS/man3/getloadavg.3.html"
  vm_counters:
    classification: CONFIRMED
    preferred_source: "host_statistics64(HOST_VM_INFO64)"
    supportability: PUBLIC_SUPPORTED
    useful_fields: [free_count, inactive_count, purgeable_count, compressor_page_count, swapins, swapouts]
    limitation: "These are memory/VM counters, not a documented exact memory-pressure severity level."
    official_source: "https://developer.apple.com/documentation/kernel/1502863-host_statistics64"
  exact_memory_pressure:
    classification: UNKNOWN
    production_source: NOT_PROVEN
    supported_event_facility:
      source: "DispatchSourceMemoryPressure"
      classification: CONFIRMED
      limitation: "Apple documents a memory-pressure event source, but this spike did not prove a stateless one-shot query contract for the exact current pressure level."
      official_source: "https://developer.apple.com/documentation/dispatch/dispatchsourcememorypressure"
    rejected_sources:
      - source: "memory_pressure -Q"
        reason: "Works on this host but -Q is absent from the local manual; benchmark diagnostic only."
      - source: "vm.memory_pressure and kern.memorystatus_* sysctls"
        reason: "Observed locally but stable public semantics/support were not established."
      - source: "os_proc_available_memory"
        reason: "Apple's API is unavailable on macOS; it is not a macOS solution."
  swap_capacity_and_activity:
    classification: CONFIRMED
    preferred_sources:
      - "sysctlbyname(vm.swapusage) into public struct xsw_usage for total/used/available bytes."
      - "HOST_VM_INFO64 swapins/swapouts deltas across the same bounded sampling window for current activity."
    supportability: PUBLIC_SDK_SURFACES
    policy_note: "Prefer current swap activity over absolute nonzero occupancy; this host already had heavy historical swap occupancy without new swapping during successful x2/x4 fixtures."
  thermal_state:
    classification: CONFIRMED
    preferred_source: "Foundation ProcessInfo.thermalState"
    supportability: PUBLIC_SUPPORTED
    values: [nominal, fair, serious, critical]
    official_source: "https://developer.apple.com/documentation/foundation/processinfo/thermalstate-swift.enum"
  disk_free_space:
    classification: CONFIRMED
    preferred_source: "statfs on the actual workspace filesystem, using f_bavail * f_bsize"
    supportability: PUBLIC_SUPPORTED
    privacy_note: "Filesystem-capacity APIs can be privacy-manifest relevant in distributed apps; any packaged product use must follow current Apple required-reason API rules."
    official_source: "https://developer.apple.com/documentation/foundation/fileattributekey/systemfreesize"
  runtime_owned_active_task_children:
    classification: UNKNOWN
    stable_os_source: NOT_PROVEN
    current_runtime_facts:
      - "Persistent PTY sessions are explicitly tracked by TerminalSessionManager."
      - "One-shot terminal_exec children are directly owned while each call runs but are not represented in a global active-task counter."
    rejected_sources:
      - source: "global ps process/command-line inventory"
        reason: "Violates the new observer privacy boundary and scans unrelated processes."
      - source: "proc_listchildpids/libproc"
        reason: "libproc.h explicitly declares the interfaces private and subject to change."
    v1_disposition: "Omit active-task-child count rather than adopting a private or privacy-expanding source."

privacy_and_scope_boundary:
  classification: INFERRED
  allowed:
    - "Aggregate host CPU topology/load/counter values."
    - "Aggregate VM and swap counters."
    - "Aggregate thermal state."
    - "Available bytes on the workspace filesystem."
    - "A future ephemeral count of positively Runtime-owned active calls only, if implemented without global inventory."
  forbidden:
    - "Unrelated process enumeration."
    - "Process command lines, executable paths or environment harvesting for capacity reporting."
    - "User files, browsing data, application inventories or private user content."
    - "Raw telemetry history, timestamps of historical samples, per-process resource history or persistent profiling."
    - "Using the existing protection subsystem's global ps scan as a capacity-observer data source."
  retention: "None. Return one bounded snapshot to the caller and discard probe-local intermediate samples after the response is formed."

snapshot_schema_recommendation:
  classification: INFERRED
  integer_plus_reason_codes_alone: INSUFFICIENT_FOR_AUDITABLE_DECISIONS
  explanation: >-
    One integer plus reason codes is sufficient for a caller's immediate branch choice but too opaque for debugging false serialization or an unsafe recommendation. The smallest useful contract is an advisory integer, bounded reason codes and a compact normalized current-signal block. It should not expose raw process data or retain history.
  naming_preference: "capacity_parallelism_ceiling is semantically safer than safe_parallelism; if safe_parallelism is retained, document that it means advisory current-host ceiling, not a guarantee for arbitrary workloads."
  bounded_json_example:
