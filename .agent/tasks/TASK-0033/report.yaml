  result: RECOMMENDED_ONLY_UNDER_VERDICT_CONDITIONS
  scope:
    - "Add exactly one read-only on-demand Capacity Observer surface returning one versioned bounded JSON object."
    - "Use only supported/public host APIs for CPU topology, CPU tick deltas, load average, VM counters, swap usage/activity, thermal state and workspace-filesystem availability."
    - "Do not use global ps, command-line harvesting, libproc child enumeration, undocumented memory-pressure sysctls or memory_pressure -Q."
    - "Keep v1 capacity ceiling in {1,2}; do not expose x4 as automatic capacity even though synthetic x4 wall-clock results were positive."
    - "Omit runtime-owned active-child count and exact memory-pressure-level fields in v1 rather than filling them from fragile sources."
    - "Return bounded reason codes plus a small normalized signal block; retain no history."
    - "Unit-test schema bounds, reason-code decisions, signal failures and fail-to-1 behavior with injected probe values."
    - "Add a bounded real-task benchmark gate before any later proposal to raise the ceiling above 2."
  explicit_non_scope:
    - "No scheduler, worker spawner, queue, daemon, database, persistent task registry, telemetry history, adaptive controller or automatic semantic task analysis."
    - "No live Runtime service/configuration changes as part of this research revision."

