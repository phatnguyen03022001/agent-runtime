task_graph_vs_capacity_separation:
  classification: CONFIRMED
  architect_responsibility:
    - "Determine whether tasks are semantically independent."
    - "Reject shared mutable state, ordering dependencies, conflicting externally rate-limited dependencies and other correctness hazards before considering parallel execution."
  capacity_observer_responsibility:
    - "Report only current bounded machine-capacity evidence and an advisory host ceiling."
    - "Never infer semantic independence from low load or idle cores."
    - "Never spawn, schedule, queue, reorder, retry or cancel work."
  executor_responsibility:
    - "Apply the smaller of the already-proven independent work set and the current advisory capacity ceiling, and remain free to serialize when task-specific resource knowledge is worse than the host snapshot implies."
  invariant: "parallel_allowed = semantic_independence AND executor_authority AND host_capacity; no one predicate substitutes for another."

safe_parallelism_policy:
  classification: INFERRED
  v1_ceiling: 2
  semantic_definition: "Advisory maximum concurrent independent workers based on current host evidence, not a guarantee that arbitrary commands cannot exhaust resources."
  default_on_probe_failure: 1
  candidate_x2_requires_all:
    - "activeProcessorCount >= 2."
    - "Thermal state is nominal; fair/serious/critical/unknown returns 1."
    - "Short-window CPU utilization leaves at least two logical-processor equivalents of headroom. For N active processors, require busy_fraction <= 1 - 2/N."
    - "One-minute load average is below activeProcessorCount; load average is a supporting sustained-load guard, not the primary instantaneous CPU signal."
    - "No swap-out activity is observed during the bounded sampling window. Any positive swap-out delta returns 1."
    - "VM counters needed by the policy are successfully readable; exact thresholds for free/inactive/compressed memory remain conservative implementation constants that require separate validation before production."
    - "Workspace filesystem has a conservative emergency free-space floor; free disk can veto x2 but never raises the ceiling. The exact production floor is NOT_MEASURED."
  reason_code_candidates:
    capacity: [CAPACITY_X2_AVAILABLE, LIMIT_V1_MAX_2]
    limits: [LIMIT_CPU_HEADROOM, LIMIT_SUSTAINED_LOAD, LIMIT_THERMAL, LIMIT_SWAP_ACTIVITY, LIMIT_MEMORY_HEADROOM, LIMIT_DISK_HEADROOM, LIMIT_SIGNAL_UNKNOWN]
  deliberately_not_used:
    - "Absolute swap-used > 0 as an automatic serial condition."
    - "Private libproc child enumeration."
    - "Global ps/process-command inspection."
    - "Undocumented vm.memory_pressure/kern.memorystatus raw values."
    - "Undocumented memory_pressure -Q output."
  falsifiability:
    - "Reject or tighten x2 if representative real tasks show swap-out, thermal escalation, user-visible responsiveness regression, material failure increase or wall-clock regression versus serial."
    - "Do not raise the v1 ceiling above 2 until representative real-task x4 evidence exists across the machines that Runtime actually supports."
    - "If conservative memory/disk thresholds create frequent false serialization, measure and revise those constants rather than adding adaptive history."

failure_modes_and_counterarguments:
  - finding: "Host snapshot cannot predict arbitrary workload footprint."
    classification: CONFIRMED
    attempted_disproof_effect: "This prevents safe_parallelism from being a universal safety guarantee and is the strongest reason to keep the value advisory and capped."
  - finding: "Higher parallelism can hurt per-worker latency despite lower total wall time."
    classification: MEASURED
    evidence: "x4 I/O worker latency ratio was 1.796 versus serial while aggregate wall time improved 2.625x."
    attempted_disproof_effect: "Reject a simple cores-to-workers mapping and automatic x4 in v1."
  - finding: "Exact supported stateless current memory-pressure level is unproven."
    classification: UNKNOWN
    attempted_disproof_effect: "The observer must work with stable VM/swap counters and conservative uncertainty rather than depending on undocumented pressure keys or becoming a resident event-monitor daemon."
  - finding: "Scoped Runtime-child enumeration has no proven stable public OS API."
    classification: UNKNOWN
    attempted_disproof_effect: "Omit it from v1; do not trade privacy/supportability for one metric."
  - finding: "Helper-process cold start can dominate probe latency."
    classification: MEASURED
    evidence: "Two first launches measured about 601-717 ms."
    attempted_disproof_effect: "A later implementation should prefer a tiny in-process path if supportable; spawned-helper architecture is not automatically justified."
  - finding: "Absolute swap use is misleading."
    classification: MEASURED
    evidence: "Approximately 3.77 GB historical swap remained allocated throughout successful bounded runs with no observed new swap activity."
    attempted_disproof_effect: "Use swap-rate deltas for acute pressure and treat absolute occupancy only as context."
  - finding: "Observer can become an orchestration subsystem through scope creep."
    classification: INFERRED
    impact: "Adding history, adaptive scoring, queues, scheduling or automatic worker management would create synchronization, stale-state and operational failure modes that this spike does not justify."
  - finding: "Synthetic success is not production-task proof."
    classification: CONFIRMED
    impact: "x2 is a conservative starting ceiling; real task evidence remains required for policy calibration and any higher ceiling."

technical_debt_1_month_and_1_year:
  one_month:
    severity: LOW_TO_MODERATE_IF_SCOPE_HELD
    likely_debt:
      - "Threshold semantics and false-positive/false-negative calibration are the main debt, not the probe itself."
      - "Production in-process access to Foundation/Mach signals must stay small; choosing a spawned native helper without measuring cold-start cost would add avoidable packaging and latency debt."
      - "Reason-code and schema tests must prove fail-closed behavior for unavailable/invalid signals."
      - "The exact memory-headroom and emergency disk floors are NOT_MEASURED and need bounded validation before implementation."
      - "If the Runtime is distributed as an app/product, current Apple privacy-manifest required-reason rules for filesystem-capacity APIs must be checked."
    rejected_growth: [daemon, scheduler, queue, database, telemetry_history, global_process_inventory, adaptive_controller]
  one_year:
    severity: MODERATE_IF_SCOPE_HELD
    likely_debt:
      - "Hardware heterogeneity and real workload drift can invalidate one threshold set even while the underlying public APIs stay stable."
      - "Apple Silicon core counts, memory sizes and thermal behavior vary; policy must normalize to activeProcessorCount rather than encode this host."
      - "The unsupported-pressure and private-child-enumeration gaps may tempt private API adoption; that should remain rejected unless Apple publishes a stable contract."
      - "Reason-code/schema creep can become a pseudo-observability product; preserve a versioned bounded contract and delete unused signals."
      - "x4 or higher should remain evidence-gated rather than becoming a configuration knob by demand."
      - "A future need for historical optimization should be treated as a separate architecture decision, not quietly added to Capacity Observer."

