research_class: SPIKE

objective: >-
  Determine whether Agent Runtime should add a tiny stateless read-only Capacity Observer that samples stable macOS host/resource signals and returns a bounded capacity snapshot to Architect/Executor so independent task work can be parallelized safely for lower wall-clock time without reducing quality or creating persistent telemetry/state.

research_questions:
  - "Which macOS signals are stable, low-overhead and useful: CPU topology/load, memory pressure, swap pressure, thermal pressure, disk free space, and count of Runtime-owned active task children?"
  - "Which sources are supported/stable APIs or commands versus private/deprecated/fragile interfaces?"
  - "What is the latency/CPU overhead of one on-demand snapshot?"
  - "Can a simple safe_parallelism recommendation improve wall-clock time for independent workloads versus serial execution?"
  - "Compare serial, x2 and one higher bounded level where safe; record wall-clock, failures and pressure/thermal observations."
  - "Separate semantic task independence from machine capacity: Architect decides dependency safety; Observer only reports capacity."
  - "Can the observer be fully stateless: probe -> bounded JSON -> return, with no database, daemon, history store, queue or scheduler?"
  - "What data should be omitted to avoid privacy leakage and useless telemetry?"
  - "What is the smallest falsifiable safe_parallelism policy using coarse pressure signals plus a small integer recommendation?"
  - "What technical debt and failure modes appear at one month and one year?"

candidate_minimum:
  behavior:
    - "Read-only, on-demand and stateless."
    - "No scheduling authority, no automatic worker spawning, no repo mutation and no persistent telemetry history."
    - "Return only a bounded snapshot plus recommendation; Architect/Executor decides whether to use it."
  forbidden_growth:
    - "scheduler/queue framework"
    - "background monitoring daemon"
    - "persistent telemetry database"
    - "global process inventory"
    - "adaptive control system"

research_method:
  - "Fresh-bind exact task base and inspect current Runtime execution/session ownership paths."
  - "Use official Apple documentation, local man pages and safe read-only host probes. Label claims CONFIRMED, MEASURED, INFERRED or UNKNOWN."
  - "Use only harmless bounded synthetic workloads in a dedicated temporary root for parallelism benchmarks."
  - "Measure repeated snapshot overhead and serial-vs-parallel wall-clock where practical."
  - "Remove every synthetic artifact before completion."
  - "Do not implement production observer code in revision 1."

invariants:
  - "Research only; do not alter live Runtime configuration or service state."
  - "Do not access private user data or unrelated files."
  - "Do not persist raw machine telemetry history or unrelated process metadata."
  - "No privileged components, VM/container, new daemon, database, queue or scheduler."
  - "No production source/product/test implementation change."
  - "No branch, worktree, clone, tag, release or main promotion in the canonical repository."

required_output:
