  - id: AC-4
    requirement: "Parallelism claims are benchmarked rather than assumed."
  - id: AC-5
    requirement: "Task dependency and machine capacity remain separate decisions."
  - id: AC-6
    requirement: "Recommendation does not create telemetry garbage or privacy expansion."
  - id: AC-7
    requirement: "Safe parallelism policy is minimal, conservative and falsifiable."
  - id: AC-8
    requirement: "Research leaves canonical repo and host clean except the report artifact."

