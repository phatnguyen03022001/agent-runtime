    - "evidence_classification: CONFIRMED / MEASURED / INFERRED / UNKNOWN"
    - "stable_macos_metric_sources"
    - "privacy_and_scope_boundary"
    - "snapshot_schema_recommendation"
    - "probe_overhead_benchmarks"
    - "serial_vs_parallel_benchmarks"
    - "cpu_memory_swap_thermal_findings"
    - "task_graph_vs_capacity_separation"
    - "safe_parallelism_policy"
    - "failure_modes_and_counterarguments"
    - "technical_debt_1_month_and_1_year"
    - "statelessness_and_garbage_analysis"
    - "minimal_next_implementation_slice_if_recommended"
  publication: "Report-only non-force commit to dev; stop for Architect review."

acceptance_criteria:
  - id: AC-1
    requirement: "Metric choices are grounded in supported/stable macOS facilities."
  - id: AC-2
    requirement: "Observer remains read-only and stateless."
  - id: AC-3
