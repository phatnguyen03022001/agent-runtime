structure_authority:
  status: RESOLVED
  source: "Existing Python MCP feature layout plus SwiftPM macOS package."
  rationale: "Screen capture is one public MCP feature backed by a dedicated native Swift helper and AgentRuntimeCore capture logic. Keep ScreenCaptureKit out of server.py and keep the helper fixed/package-owned."

objective: "Add public read-only tool 11 screen_capture. Capture one macOS frontmost window, explicit window, application window, display, or bounded region through ScreenCaptureKit; return exactly one image/png ImageContent plus closed coordinate/application metadata. Package a fixed signed native helper with Agent Runtime. Do not perform Stage-B model-vision proof, click/type/scroll, permission-setting automation, live installation, or lifecycle activation in this task."

public_contract:
  name: screen_capture
  position: 11
  input:
    signature: "screen_capture(target='frontmost_window', window_id=None, application_bundle_id=None, display_id=None, x=None, y=None, width=None, height=None)"
    exact_fields:
      - target
      - window_id
      - application_bundle_id
      - display_id
      - x
      - y
      - width
      - height
    target_values:
      - frontmost_window
      - window
      - application_window
      - display
      - region
    cross_field_rules:
      frontmost_window: "No selector or geometry field may be supplied."
      window: "Exactly window_id is required; all other selector/geometry fields are absent."
      application_window: "Exactly application_bundle_id is required; select the deterministic frontmost normal on-screen window for the unique matching application."
      display: "Exactly display_id is required."
      region: "display_id plus x, y, width, height are required; region must be finite, positive-area and fully contained within that display."
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  success_content:
    image_blocks: 1
    image_type: ImageContent
    mime_type: image/png
    text_blocks: 0
    structured_content: ScreenCaptureMetadata
  structured_metadata:
    exact_fields:
      - schema_version
      - status
      - target
      - mime_type
      - raw_bytes
      - sha256
      - coordinate_space
      - bounds
      - pixel_width
      - pixel_height
      - scale_factor
      - display_id
      - window_id
      - active_application
      - captured_application
      - permission
      - capture_api
      - deadline_seconds
    constants:
      schema_version: 1
      status: captured
      mime_type: image/png
      coordinate_space: cg_global_points
      permission: granted
      capture_api: ScreenCaptureKit
    bounds_fields:
      - x
      - y
      - width
      - height
    application_fields:
      - pid
      - bundle_identifier
      - name
  payload_limits:
    max_png_bytes: 16777216
    max_pixels: 16777216
    silent_downscale: false
    rationale: "Preserve exact point-to-pixel mapping. Oversized captures fail closed instead of silently changing coordinates."

coordinate_contract:
  name: cg_global_points
  semantics:
    - "Bounds and region inputs use Core Graphics global display coordinates compatible with CGEvent location/set-location semantics, not AppKit unflipped coordinates and not image pixels."
    - "Multiple displays may produce negative global point coordinates."
    - "scale_factor is the actual uniform image-pixels-per-global-point ratio for the returned target."
    - "For any image pixel coordinate (u,v), global point mapping is x=bounds.x+u/scale_factor and y=bounds.y+v/scale_factor, subject only to integer pixel rounding at the final edge."
    - "No hidden letterboxing, shadow padding, silent crop, rotation transform or rescale may make the declared mapping false."
    - "A window spanning displays resolves to the display with greatest intersection area; an exact tie fails CAPTURE_TARGET_AMBIGUOUS."

native_contract:
  framework: ScreenCaptureKit
  permission:
    - "Use Screen Recording permission only."
    - "The public tool MUST preflight and fail with SCREEN_CAPTURE_PERMISSION_REQUIRED when permission is unavailable."
    - "The public tool MUST NOT automatically open System Settings, call a permission-request loop, mutate TCC, or claim permission was granted."
    - "macos/AppBundle/Info.plist MUST contain NSScreenCaptureUsageDescription with a concise user-facing reason."
  helper:
    product: AgentRuntimeScreenCapture
    package_location: "Contents/MacOS/AgentRuntimeScreenCapture"
    execution:
      - "Python invokes only the fixed package-owned helper path derived from the installed Runtime/app layout. No caller field may choose executable path, argv, framework, file destination, output format or timeout."
      - "Use shell=False, disconnected stdin, bounded stdout, suppressed/bounded stderr, fixed deadline, and child termination on timeout."
      - "The helper returns one single-line bounded JSON header followed by exactly raw_bytes PNG bytes on stdout. Success has no other stdout framing. Error responses contain a bounded JSON header and no image payload."
      - "No temporary screenshot file is created."
      - "Python validates header length, exact PNG byte count, PNG signature, SHA-256, metadata types, pixel limits and coordinate invariants before constructing MCP ImageContent."
  capture:
    - "Prefer SCScreenshotManager single-frame capture where available; preserve macOS 13 package compatibility with a bounded SCStream one-frame fallback when required."
    - "Capture video/image only; no system audio or microphone."
    - "Do not include mouse cursor."
    - "PNG encoding uses native Apple image APIs; no third-party image dependency."
  target_resolution:
    - "frontmost_window: resolve NSWorkspace frontmost application, then choose its topmost visible normal-layer window by Core Graphics z-order cross-matched to SCWindow."
    - "window: resolve exactly the requested SCWindow windowID; fail if unavailable or not capturable."
    - "application_window: application_bundle_id must resolve to one running application; choose its topmost visible normal-layer window deterministically; duplicate matching applications fail CAPTURE_TARGET_AMBIGUOUS."
    - "display: resolve exactly SCDisplay.displayID."
    - "region: resolve exactly display_id and require the global-point rectangle to be fully contained by that display."
    - "Browser capture has no special browser/DOM semantics; browsers are captured through frontmost_window, window, or application_window."
  metadata_privacy:
    - "Return active and captured application pid/bundle_identifier/name, target bounds, IDs and scale only."
    - "Do not return window title, OCR text, accessibility tree, clipboard contents, URL, DOM, keystrokes or unrelated window inventories."

