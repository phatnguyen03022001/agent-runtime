scope:
  required_changes:
    - "Fresh-resolve local HEAD and origin/dev and require both equal the exact TASK-0063 handoff base. Require designated working tree clean before observation."
    - "Read-only validate the exact accepted candidate app/handoff pair using canonical provenance tooling. Require candidate SHA-256 and handoff SHA-256 equality with accepted TASK-0062 evidence. Do not rebuild, freeze, reseal, republish, chmod, touch, or otherwise mutate candidate bytes."
    - "Freshly inspect the canonical installed target at ~/Applications/Agent Runtime.app without changing it. Record existence, bundle identifier, bounded runtime-manifest revision/tree identity when available, strict codesign validity, TeamIdentifier non-null/equality digest-only evidence when available, and identity-critical hashes needed to distinguish installed bytes from the accepted candidate."
    - "Freshly inspect ~/Library/Application Support/Agent Runtime/cutover-transaction. If absent, record ABSENT. If present, read only canonical transaction metadata and record schema, status, phase, candidate/predecessor identity fields, transaction-owned paths, and any approval/recovery markers needed to determine the legal canonical next route. Do not edit, rename, remove, recover, commit, resume, or rollback the transaction."
    - "Inspect canonical source macos/candidate_cutover.py at the exact handoff base sufficiently to map the observed transaction state to the available cutover/commit/resume/rollback/recover commands. Do not execute any candidate_cutover subcommand."
    - "Read-only inspect ServiceManagement state using only a status/query surface if the installed app exposes one. Inspect launchd with launchctl print for com.picmao.agent-runtime-ui, com.picmao.agent-runtime-runtime, and com.picmao.agent-runtime-runtime-service. Record loaded/absent state and loaded program path where available. Do not bootstrap, bootout, kickstart, enable, disable, register, unregister, repair, or approve services."
    - "Read-only observe relevant Agent Runtime UI/helper/server/tunnel processes and the listener on local port 8080. Record process identity/PID/program path only as needed; redact environment/arguments if they contain secrets. Do not signal, kill, restart, spawn, or attach a debugger."
    - "Resolve the tunnel-client path using the same current source selection order and record executable path, resolved path, version/build identity, and SHA-256 without reading control-plane credentials. Do not start a second tunnel client or authenticate/reconnect."
    - "If an already-running local health endpoint on port 8080 can be queried with a side-effect-free GET/read-only probe, record its bounded status. Do not make requests that mutate Runtime or tunnel state."
    - "Do not read or print runtime.env secret values, .env unrelated values, API keys, tunnel credentials, private keys, certificate bodies, or signing identity literal. File existence/mode/hash metadata may be recorded only when needed and non-secret."
    - "Report raw observed state and one bounded route classification for Architect decision: FRESH_CUTOVER_ELIGIBLE, RESUME_CANDIDATE, ROLLBACK_REQUIRED, RECOVERY_REQUIRED, APPROVAL_REQUIRED, ALREADY_ON_ACCEPTED_CANDIDATE, or BLOCKED_UNKNOWN_STATE. The classification is evidence, not authority to execute that route."
    - "Publish only .agent/tasks/TASK-0063/report.yaml to dev non-force, then stop for Architect review."
  allowed_existing_files_or_components:
    - ".agent/tasks/TASK-0063/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "This task is read-only with respect to installed/live Runtime, tunnel, launchd, ServiceManagement, candidate bytes, cutover transaction, runtime.env, desired state, System Settings, TCC, BTM, and Keychain."
  - "No candidate_cutover cutover/commit/resume/rollback/recover subcommand executes."
  - "No Runtime or tunnel lifecycle mutation occurs."
  - "No new process/service is intentionally spawned except bounded read-only inspection commands and the canonical report commit/push workflow."
  - "Historical live state is not treated as current evidence; all conclusions use fresh observations from this task."
  - "Accepted candidate 8017f53872635db2963d101682c09ee95aa0ed367d23523aff8f674fbfd16660 remains byte-identical and unmodified."

forbidden_changes:
  - "Do not install, activate, start, stop, restart, kill, signal, register, unregister, resume, rollback, recover, commit-cutover, bootout, bootstrap, kickstart, enable, disable, repair, or replace live Runtime/tunnel/app/service state."
