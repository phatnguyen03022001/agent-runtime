objective: >-
  Perform a strictly read-only preflight for activation of accepted candidate
  8017f53872635db2963d101682c09ee95aa0ed367d23523aff8f674fbfd16660. Prove the local candidate
  and handoff still match accepted TASK-0062 evidence; freshly observe the installed Agent Runtime app,
  schema-5 cutover transaction state if any, ServiceManagement/launchd ownership, Runtime/tunnel process
  state, selected tunnel-client identity, and port-8080 availability; then report the exact canonical
  next lifecycle route without executing it. Do not start, stop, restart, register, unregister, resume,
  rollback, recover, commit-cutover, install, activate, replace app bytes, or otherwise mutate live state.

