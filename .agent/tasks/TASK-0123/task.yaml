    requirement: "Current official OpenAI documentation is checked directly and dated."
  - id: AC-2
    requirement: "Repository evidence is used only to establish existing Runtime/MCP wire semantics and accepted Stage B state."
  - id: AC-3
    requirement: "MCP protocol validity, ChatGPT host ingestion, optional UI/component delivery, and model semantic vision are analyzed as separate layers."
  - id: AC-4
    requirement: "Exactly one allowed terminal classification is selected, with explicit evidence and uncertainty."
  - id: AC-5
    requirement: "The next architecture, if any, uses a documented supported path and does not rely on OCR/base64/manual side channels."
  - id: AC-6
    requirement: "No Runtime, repository, connector, host, visual, or permission mutation occurs."

