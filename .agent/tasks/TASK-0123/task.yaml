research_questions:
  - id: RQ-1
    question: "Does current official OpenAI documentation explicitly state that ChatGPT custom-app/plugin MCP tool-result content supports image content semantically as model vision input, rather than merely preserving MCP Content[] or exposing it to UI/components?"
  - id: RQ-2
    question: "If Content[] is documented as model-visible, does official documentation explicitly define image/image/png MCP content as semantically inspectable by the model in ChatGPT custom apps?"
  - id: RQ-3
    question: "Is there a documented supported alternative for tool-produced images, such as a UI resource, file/image input promotion, computer-tool screenshot output, or another OpenAI-supported media result shape?"
  - id: RQ-4
    question: "Would adopting any documented alternative require changing Agent Runtime transport semantics, adding a UI layer, changing only the ChatGPT integration layer, or using an API integration outside ChatGPT custom apps?"
  - id: RQ-5
    question: "Given accepted repository evidence that MCP ImageContent survives the Runtime/client boundary, what is the narrowest evidence-supported location of the remaining gap?"
  - id: RQ-6
    question: "Is there enough public documentation to classify this as a ChatGPT host limitation/bug, or must the result remain PUBLIC_CONTRACT_INSUFFICIENT?"

classification:
  allowed_terminal_classifications:
    - CHATGPT_MCP_IMAGECONTENT_MODEL_VISION_DOCUMENTED
    - SUPPORTED_ALTERNATE_MEDIA_PATH_IDENTIFIED
    - CHATGPT_HOST_BEHAVIOR_CONTRADICTS_DOCUMENTED_CONTRACT
    - PUBLIC_CONTRACT_INSUFFICIENT
  rules:
    - "Do not classify absence of documentation as proof of unsupported behavior."
    - "Do not classify a single Stage B failure as a ChatGPT platform bug unless official documentation establishes the expected semantic behavior."
    - "Do not claim Agent Runtime regression unless repository evidence contradicts previously accepted wire/image output behavior."
    - "Separate MCP protocol validity, ChatGPT host ingestion, component/UI rendering, and model semantic vision as distinct layers."
    - "Distinguish normative documentation from examples, implementation hints, and inference."

required_output:
  format: bounded_research_packet
  fields:
    - exact_planning_head
    - official_sources_with_access_date
    - repository_evidence_used
    - per_research_question_findings
    - normative_vs_inferred_claims
    - classification
    - narrowest_supported_gap_location
    - supported_next_architecture
    - unsupported_or_rejected_workarounds
    - whether_runtime_change_is_justified
    - whether_stage_b_retry_is_justified
    - whether_visual_control_may_be_unblocked
  constraints:
    - "Every current OpenAI product/contract claim must cite an official source."
    - "If documentation is ambiguous, say ambiguous and choose PUBLIC_CONTRACT_INSUFFICIENT."
    - "Do not create a recommendation that depends on undocumented host behavior."
    - "Do not recommend OCR, base64-in-text, textual image descriptions, file-upload side channels, Google Drive/ZIP handoffs, or manual operator RPC as a substitute for semantic image delivery."
    - "Do not recommend changing screen_capture solely to work around the host."

forbidden_actions:
  - "Do not invoke Agent Runtime tools."
  - "Do not invoke screen_capture."
  - "Do not use CODEX_LOCAL, Remote Desktop Commander, SentinelX, operator Terminal, or another local execution surface."
  - "Do not mutate repository files."
  - "Do not create report.yaml, commit, push, branch, tag, release, or PR."
  - "Do not mutate Runtime, connector, tunnel, TCC, permissions, browser state, or host UI."
  - "Do not implement UI/resources or alternate media transport in this task."
  - "Do not enter visual-control implementation."

