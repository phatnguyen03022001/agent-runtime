acceptance_criteria:
  - id: AC-1
    requirement: "One user approval authorizes quarantined v1 app execution."
    evidence_required: "v1 launches normally after at most one documented operator approval; exact main PID/path/hash is proven."

  - id: AC-2
    requirement: "Embedded helper and bundled CPython run after v1 app approval."
    evidence_required: "Disposable LaunchAgent reaches running state; helper PID/path/hash and child bundled-Python PID/path/hash are exact and healthy."

  - id: AC-3
    requirement: "One approval survives byte-distinct quarantined v2."
    evidence_required: "v2 main/helper bytes differ; v2 remains under the stable identity/DR contract; v2 app/helper/Python run with zero second operator approval."

  - id: AC-4
    requirement: "Disposable execution state is cleaned."
    evidence_required: "Disposable PIDs, LaunchAgent label/plist, app, and run root are absent; production state is untouched."

  - id: AC-5
    requirement: "Repository closure is report-only."
    evidence_required: "No product/test/doc/dependency change; report validates with pinned Foundation, publishes non-force after fresh remote proof, and final main is clean/synced."

