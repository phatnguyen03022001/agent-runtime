    role: "Agent Runtime embeds a self-contained CPython 3.13 runtime; the fixture must cover representative bundled Python execution."
    precedence: 6

structure_authority:
  status: RESOLVED
  source: "Disposable fixture under ignored build output only"
  rationale: "Qualify the unresolved app-approval boundary before any product redesign."

objective: "Prove or reject a zero-cost one-approval model: one fresh quarantined ad-hoc app bundle is explicitly allowed by the user once; afterward a traditional user LaunchAgent must run an embedded ad-hoc helper and that helper must run bundled CPython from the same app. A quarantined byte-distinct v2 with the same explicit identifiers/designated requirements must then work without a second user approval. No product mutation is authorized."

scope:
  required_changes:
    - "Freshly prove clean canonical main at the exact base, TASK-0178 BLOCKED review ancestry, and zero surviving TASK-0178 product mutation."
    - "Create exactly one disposable run root under ignored build output with one fresh bundle identifier and one fresh LaunchAgent label. Do not use production Agent Runtime identifiers or state."
    - "Build disposable v1 and v2 app bundles with the same bundle identifier, main signing identifier/explicit designated requirement, helper signing identifier/explicit designated requirement, helper relative path, bundled-Python relative path, and LaunchAgent label. v1 and v2 main/helper bytes must differ."
    - "Materialize a representative self-contained CPython 3.13 runtime inside each app at Contents/Resources/runtime/.venv using existing packaging materialization logic or an equivalent byte-faithful disposable copy."
    - "The disposable helper must stay running and spawn the bundled Python executable in a long-running minimal mode. Evidence must expose main/helper/Python PID, exact executable path, and SHA-256."
    - "Ad-hoc sign the responsible nested code and app bundle with stable explicit identifiers/designated requirements. TeamIdentifier must remain absent."
    - "Apply quarantine to disposable v1 using Foundation quarantineProperties. Do not remove quarantine as part of qualification."
    - "Attempt normal v1 app launch. If macOS requires the documented manual approval, stop with OPERATOR_INPUT_REQUIRED and ask the operator only to use System Settings -> Privacy & Security -> Open Anyway/Open for the exact disposable app. Exactly one such operator approval is authorized."
    - "After approval, require v1 main app to run with exact PID/path/hash."
    - "Create one disposable plist in the current user's Library/LaunchAgents with ProgramArguments pointing directly to the embedded helper path. Use the fresh label only."
    - "Bootstrap v1 and require exact-label state=running with helper PID/path/v1 hash. Require the helper child to be the bundled .venv/bin/python with exact PID/path/hash and remain healthy."
    - "Boot out v1 and require label absence plus helper/Python termination before update testing."
    - "Prepare byte-distinct v2 with the same stable identity/DR contract and apply quarantine to v2. Replace v1 at the same disposable installed app path."
    - "Launch v2 normally without another operator approval. If another manual approval is required, stop BLOCKED with classification PER_UPDATE_APPROVAL_REQUIRED."
    - "If v2 app launches without new approval, bootstrap the same disposable LaunchAgent contract and prove v2 helper PID/path/hash plus bundled-Python PID/path/hash."
    - "Cleanup must terminate disposable processes, boot out the disposable service, remove its plist, remove the disposable app/run root, and prove those identities absent. Do not attempt to erase the operating system's remembered approval entry."
    - "No product source/tests/docs/dependencies/package logic, Runtime state, runtime.env, tunnel-client, production lifecycle state, Apple developer authority, tag, release, or repository topology may change."
    - "Do not run canonical ./verify or build a real product candidate."
    - "Create report-r1.yaml only on terminal PASS/BLOCKED. While waiting for the one human approval, preserve the exact disposable fixture and communicate OPERATOR_INPUT_REQUIRED instead of writing a terminal report."

  allowed_existing_files_or_components:
    - "macos/packaging_python.sh for read/reuse"
    - "build/ ignored disposable qualification root"
    - "$HOME/Library/LaunchAgents/<fresh TASK-0179 disposable plist>"
