objective: "Prepare a minimal, technically precise standards-conformance/support packet for OpenAI that asks whether MCP ImageContent returned by a ChatGPT custom app is contractually promoted to semantic model vision input. Use only accepted existing evidence. Do not perform another capture, do not modify Runtime, and do not claim a ChatGPT bug."

accepted_authority:
  task_0120_review: "a838b7750a086bb1e83f34731d349ee15340a7af"
  task_0121_review: "18db9ab9a78683a87c893899571591c5fd469491"
