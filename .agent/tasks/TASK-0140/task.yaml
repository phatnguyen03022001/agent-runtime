qualification_outcome:
  allowed_values:
    - PASS
    - FAIL
    - BLOCKED
  PASS_requires:
    - "F-0140-001 is closed."
    - "No new unresolved HIGH correctness/security finding exists."
    - "Every mandatory revision-2 gate is freshly proven."
    - "Every reused revision-1 gate has explicit valid carry-forward reasoning."
    - "Canonical ./verify is green."
    - "Final source and frozen public contract are coherent."
  FAIL_when: >-
    A new reproducible frozen-contract, correctness, security, boundedness, lifecycle,
    sanitization or governance defect is demonstrated. Do not repair it in this task.
  BLOCKED_when: >-
    A mandatory fresh gate cannot be proven because an externally controlled platform
    capability is unavailable and no equivalent authoritative evidence exists.

no_self_repair_rule: >-
