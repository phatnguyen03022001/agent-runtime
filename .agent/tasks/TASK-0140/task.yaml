    - "Record fresh-vs-carried evidence gate by gate."
    - "Remove task-owned ephemeral state."
    - "Prove no production/dependency/install/cutover/transport mutation."
    - "Fresh-prove local = origin/main, clean, main-only, open PRs = 0 after publication."

