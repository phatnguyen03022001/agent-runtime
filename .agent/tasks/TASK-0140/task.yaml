objective: >-
  Resume independent qualification of the frozen Agent Runtime after the accepted
  F-0140-001 repair. Use evidence-preserving delta qualification: freshly prove all
  predicates touched or plausibly affected by the maintenance change, carry forward
  only revision-1 PASS evidence that remains logically valid, and finish with one
  explicit PASS, FAIL or BLOCKED outcome without repairing production defects.

execution_strategy:
  mode: EVIDENCE_PRESERVING_DELTA
  rules:
    - >-
      Do not blindly rerun expensive revision-1 experiments merely to reproduce
      already-valid evidence.
    - >-
      Carry forward revision-1 evidence only when the invariant was PASS, the
      maintenance diff cannot materially invalidate the proof, and the exact prior
      evidence remains applicable to the same frozen contract.
    - >-
      If the maintenance implementation materially touches a carried-forward
      predicate, rerun that predicate.
    - >-
      Any uncertainty about whether an invariant is materially affected resolves in
      favor of a fresh bounded proof, not assumption.
    - >-
      Canonical ./verify on the exact final revision-2 tree is always required and is
      the final regression authority.

mandatory_fresh_proof:
  - id: R2-F1
    name: "Canonical identity"
    requirements:
      - "Runtime version remains 0.2.0."
      - "Exactly 19 public tools remain registered in canonical order."
      - "ToolContract Kernel remains version 1."
      - "Schema bundle/export identity matches the frozen hashes and length exactly."
      - "runtime_capabilities matches the frozen capability identity."
      - "Canonical ./verify exits 0 on the exact final revision-2 tree."

  - id: R2-F2
    name: "F-0140-001 closure / G10"
    requirements:
      - "Run the terminal_exec unexpected-exception sentinel regression."
      - "Run the fs_list unexpected-exception sentinel regression."
      - "Sentinel must be absent from client response serialization."
      - "Sentinel must be absent from MCP SDK/server logs."
      - "A bounded generic unexpected-runtime failure remains observable."
      - "All 19 registered public tools must traverse the common sanitizer."

  - id: R2-F3
    name: "Expected error semantics"
    requirements:
      - "RuntimeValidationError behavior remains unchanged."
      - "RuntimeStateError behavior remains unchanged."
      - "ProtectedRuntimeDenied behavior remains unchanged."
      - "CapabilityFailure typed result/error paths remain unchanged."
      - "Existing ToolError behavior remains unchanged."
    rule: >-
      Use focused deterministic tests or representative in-process MCP calls. Do not
      broaden scope into a new error architecture.

  - id: R2-F4
    name: "MCP contract and conformance regression"
    requirements:
      - "Representative safe tools/call succeeds."
      - "Representative malformed/invalid input preserves validation behavior."
      - "Representative result/error representation remains contract-compatible."
      - "runtime_capabilities remains deterministic and coherent."
      - "Registered schemas/annotations remain byte-identical to the frozen identity."

  - id: R2-F5
    name: "Capacity smoke after common-wrapper change"
    requirements:
      - "Prove six heavy operations are simultaneously admitted."
      - "The seventh heavy request fails before seventh process/session ownership or spawn."
      - "At least one representative cheap call remains responsive while saturated."
      - "Cleanup returns task-owned heavy/session state to quiescence."
    scope_rule: >-
      This is a bounded smoke replay. Do not repeat the full revision-1 churn/stress
      program unless the smoke reveals drift.

  - id: R2-F6
    name: "No architecture drift"
    requirements:
      - "No new public tools."
      - "No Runtime version change."
      - "No ToolContract/schema/annotation drift."
      - "No transport change."
      - "No install/cutover redesign."
      - "No Cloudflare resurrection."
      - "No new Runtime dependency."

  - id: R2-F7
    name: "Verification harness"
    requirements:
      - "Use the accepted canonical ./verify."
      - "The implemented parallel fast lane may be used exactly as accepted."
      - "Host-sensitive/unknown tests remain serialized by the canonical harness."
      - "Canonical ./verify remains the final PASS authority."

revision_1_carry_forward:
  source_report: .agent/tasks/TASK-0140/report-r1.yaml
  general_rule: >-
    These are candidate carry-forwards, not automatic truth. The Executor must record
    explicit reasoning in report-r2 showing why the maintenance diff cannot invalidate
    each reused proof. If that reasoning fails, rerun the affected gate.
  candidates:
    G4_terminal_churn_and_retention:
      prior_status: PASS
      default_disposition: CARRY_FORWARD
      rationale: >-
        Maintenance changed the common MCP registration wrapper and verification
        harness, not terminal session retention, cursor, output or reaper internals.
        The 160-cycle stress need not be repeated unless fresh capacity/error proof
        exposes lifecycle drift.
    G5_owned_resource_cleanup:
      prior_status: PASS
      default_disposition: CARRY_FORWARD
      rationale: >-
        No process/session/PTY ownership or cleanup implementation changed.
    G6_long_running_cancellation_failure:
      prior_status: PASS
      default_disposition: PARTIAL_CARRY_FORWARD
      rationale: >-
        Lifecycle and cancellation evidence may carry forward; expected typed error
        semantics at the new wrapper boundary must be freshly proven by R2-F3.
    G7_filesystem_confinement_boundedness:
      prior_status: PASS
      default_disposition: PARTIAL_CARRY_FORWARD
      rationale: >-
        Filesystem confinement/bounds internals did not change. Fresh representative
        validation/result semantics are still required by R2-F3/R2-F4 because the
        common wrapper now encloses fs tools.
    G8_repository_CAS_receipt_red_team:
      prior_status: PASS
      default_disposition: CARRY_FORWARD
      rationale: >-
        Repository CAS/receipt implementations did not change; canonical regression
        still covers them. Do not rerun the full race matrix unless fresh regression
        identifies drift.
    G9_protected_runtime_governance:
      prior_status: PASS
      default_disposition: PARTIAL_CARRY_FORWARD
      rationale: >-
        Broad protected-runtime red-team evidence may carry; ProtectedRuntimeDenied
        behavior across the wrapper must be freshly proven by R2-F3.
    G11_screen_capture_governance:
      prior_status: PASS
      default_disposition: CARRY_FORWARD
      rationale: >-
        Screen-capture implementation and governance state did not change; frozen
        runtime_capabilities/schema identity and canonical regression remain the
        current checks.
    G12_external_MCP_tools:
      prior_status: PASS
      default_disposition: CARRY_FORWARD
      rationale: >-
        Inspector/scanner evidence targeted the same byte-identical public
        metadata/schema surface. Do not reinstall or rerun expensive external tools
        unless fresh R2-F4 evidence reveals a material MCP-surface discrepancy.
    G13_installed_macOS_OpenAI_continuity:
      prior_status: PASS
      default_disposition: CARRY_FORWARD
      rationale: >-
        Maintenance did not install, cut over, restart or mutate package/service
