  focused:
    - "Run R2-F1 through R2-F6 with the smallest deterministic/focused commands."
    - "Use existing tests first; do not create redundant stress infrastructure."
  canonical:
    command: "./verify"
    required: true
    authority: FINAL
    rule: >-
      PASS requires exit 0 on the exact final qualification tree. The accepted
