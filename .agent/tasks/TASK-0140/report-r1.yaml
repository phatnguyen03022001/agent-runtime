    name: Canonical identity and regression
    status: FAIL
    evidence: >-
      Runtime/schema identity is byte-exact and unchanged, but canonical ./verify
      exits 1 because the TASK-0140 G10 reproducer fails. There is no schema or
      public-contract drift.
  G2:
    name: Heavy-capacity hard ceiling
    status: PASS
    evidence: >-
      Six disposable PTY roots were simultaneously status=running with six active
      heavy leases immediately before the seventh probe. The seventh request returned
      "configured maximum 6 active terminal sessions reached"; pty.openpty was proven
      not called and lease/session ownership remained at six.
  G3:
    name: Cheap-call responsiveness under saturation
    status: PASS
    evidence: >-
      While six heavy roots remained held, capacity observation, bounded filesystem
      read, terminal poll and terminal resize/control all completed successfully.
  G4:
    name: Terminal/session churn and retention
    status: PASS
    evidence: >-
      160 cycles completed: 144 natural exits and 16 explicit terminates.
      Max retained completed sessions=16, max retained output/session=65536 bytes,
      max terminal_poll output=16384 bytes. Overflow polling reported
      cursor_expired=true with 24464 dropped bytes, and oldest completed-session
      eviction returned an unknown/expired session truthfully. Deterministic idle
      reaping also passed.
  G5:
    name: Owned-resource cleanup
    status: PASS
    evidence: >-
      Post-quiescence state: sessions=0, heavy_leases=0, alive task-owned children=0,
      zombies=0, fd_before=4, fd_after=4, fd_delta=0, and terminal worker-thread
      before/after inventories were both empty.
  G6:
    name: Long-running/cancellation/failure semantics
    status: PASS
    evidence: >-
      Existing terminal admission/session tests cover natural completion, terminate,
      interrupt, timeout, spawn/PTY failures, idle reap and Runtime SIGTERM cleanup.
      Q3 also completed a safe bounded 0.5-second terminal call within a 5-second
      timeout.
  G7:
    name: Filesystem confinement and boundedness red team
    status: PASS
    evidence: >-
      Existing fs_read_batch/fs_list/fs_search/fs_patch/fs_write and boundedness
      suites cover traversal/outside-workspace rejection, symlink substitution,
      invalid UTF-8/NUL, sparse/no-newline inputs, input/output/scan ceilings,
      identity drift and serialization bounds.
  G8:
    name: Repository CAS/receipt red team
    status: PASS
    evidence: >-
      repo_stage/repo_diff/repo_commit/repo_fast_forward/repo_publish suites cover
      stale expected state, receipt mismatch, staged/untracked drift, wrong
      branch/upstream, binary/symlink candidates, remote CAS mismatch, local/remote
      publication races and no-replace semantics without unintended publication.
  G9:
    name: Protected-runtime/governance red team
    status: PASS
    evidence: >-
      Protected-runtime tests reject compound shell wrappers, launchctl lifecycle
      mutation, protected port 8080 mutation, direct PID/process-group signals,
      matching pkill/killall and fragmented terminal-control shell intent while
      preserving read-only observation. The documented same-UID interpreter
      limitation was not misrepresented as solved.
  G10:
    name: Secret/error sanitization
    status: FAIL
    evidence: >-
      tests/test_task0140_qualification.py injects a controlled sentinel through a
      mocked unexpected terminal_exec exception. The MCP CallToolResult is sanitized
      and does not contain the sentinel, but logger mcp.server.mcpserver.server emits
      the exception traceback containing the sentinel. The failure reproduced
      directly and again inside canonical ./verify. Existing accepted unexpected-
      exception tests also visibly log their TASK0039/TASK0040 sentinels, corroborating
      that response sanitization does not imply log sanitization.
  G11:
    name: Screen-capture governance
    status: PASS
    evidence: >-
      runtime_capabilities reports supported=true, available=false and
      VISUAL_PERCEPTION_BLOCKED. A live invocation returned the same typed reason
      before native capture. Focused screen-capture MCP tests passed.
  G12:
    name: Independent MCP black-box/adversarial evidence
    status: PASS
    evidence: >-
      MCP Inspector 2.7.0 passed stdio initialize, tools/list and safe
      capacity_observer tools/call. Cisco mcp-scanner 4.8.4 completed local-only
      stdio scanning with external API/LLM credentials explicitly removed; YARA-only
      scanning classified all 19 tools SAFE with zero findings. Readiness HIGH labels
      were deterministically triaged as description/metadata heuristics rather than
      Runtime defects.
  G13:
    name: Installed macOS/OpenAI continuity
    status: PASS
    evidence: >-
      Canonical configured doctor reports healthy with all ten checks passing.
      Live runtime_capabilities remains 0.2.0/19 tools, read and bounded terminal calls
      passed, strict deep codesign passed, no cutover transaction is pending, and
      installed config/package/service fingerprints are unchanged.
  G14:
    name: Qualification leaves no product mutation
    status: PASS
    evidence: >-
      No production Python, dependency, package, ServiceManagement, runtime.env,
      tunnel or public-contract changes were made. build/.task-0140 was removed before
      publication. Repository publication contains only the authorized durable
      qualification reproducer and this TASK-0140 report.

finding:
  id: F-0140-001
  dimension: secret_error_sanitization
  severity: HIGH
  reproducible: true
  invariant: >-
    G10 / AC-8 requires secret-like sentinels injected through disposable unexpected
    failures not to appear in validation errors, audit events, scanner output or
    qualification-visible logs.
  evidence:
    durable_reproducer: tests/test_task0140_qualification.py
    direct_runs:
      - "1 test; FAILED (failures=1); sentinel absent from MCP response but present in captured MCP server logs"
      - "recovery rerun reproduced the same failure"
    canonical_verify: "650 tests in 186.247s; FAILED (failures=1, skipped=1); sole failure is the durable G10 reproducer"
    corroboration: >-
      Existing unexpected-exception test output visibly includes controlled
      TASK0039_UNEXPECTED_SECRET_SENTINEL and TASK0040_UNEXPECTED_SECRET_SENTINEL
      in MCP SDK traceback logging.
  disposition: >-
    FAIL_NO_SELF_REPAIR. Preserve the smallest reproducer and stop for independent
    Architect judgment; production Runtime is intentionally unchanged.

