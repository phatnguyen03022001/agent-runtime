  mode: handoff_snapshot
  capture: after_final_planning_commit
  require_exact_match: true

authority_sources:
  - source: "phatnguyen03022001/agent-runtime@4c8a92153180c4c225bdc0285e6c79076dc2ee3a:.agent/tasks/TASK-0037/review.yaml"
    role: "Accepted live five-tool Capacity Observer closure."
