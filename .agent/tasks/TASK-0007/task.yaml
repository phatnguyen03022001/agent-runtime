    evidence_required: "Report records exact installer-defined support paths inspected, existence/type/runtime ownership and safe current-use evidence, while proving no broad HOME/secret dump or local mutation occurred."
  - id: AC-3
    requirement: "Q-3 cross-repository reconciliation inventory is exact and minimal."
    evidence_required: "Report lists exact current canonical repository/path references that a later deletion task must reconcile and distinguishes them from historical evidence that must remain."
  - id: AC-4
