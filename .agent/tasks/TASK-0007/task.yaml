    evidence_required: "Only TASK-0007/report.yaml changes; runtime, external repositories, local support state/processes, main, and topology remain unchanged."
  - id: AC-5
    requirement: "Closure produces a decision-useful result without inventing architecture."
    evidence_required: "Exactly one closure disposition is emitted and any remaining blocker/compatibility obligation is concrete and minimal; no replacement runtime or migration framework is proposed."

