structure_authority:
  status: RESOLVED
  source: "Existing agent-runtime task/report/review structure only."
  rationale: "This is a bounded pre-deletion evidence-closure task. No runtime, cross-repository, machine-local, tunnel, profile, config, process, or documentation mutation is authorized. The only Executor mutation is TASK-0007/report.yaml."

objective: "Resolve exactly the three pre-deletion questions accepted from TASK-0006: whether any live consumer still depends on agent-runtime's four-tool interface; which installer-created machine-local runtime/tunnel/config/state artifacts currently exist and whether they are active/runtime-owned/ambiguous; and which canonical cross-repository references would become stale if agent-runtime is deleted. Produce sufficient exact evidence for the Governing Architect to decide whether a later deletion task may be authorized."

scope:
  required_changes:
    - "Resolve Q-1 using bounded read-only evidence only. Search canonical known ecosystem references and the operator-authorized /Users/tienphat/Developer workspace for concrete live references to agent-runtime or the distinctive public interface get_head/sync/run_verify/get_last_log. Workspace search must return candidate paths first and avoid dumping file contents broadly. Exclude .git, .agent-scratch, dependency/build/cache/virtualenv directories, and obvious generated artifacts."
    - "Candidate files under sibling repositories may be inspected read-only only as necessary to classify an exact consumer reference; no sibling repository becomes an active mutation target and no sibling Git state may be changed. Secret-bearing files such as .env, credential/key files, SSH material, keychains, token stores, or shell-history databases must not be opened merely because a path search finds them. Record only safe path/existence metadata for such candidates and classify unresolved if needed."
    - "Resolve Q-2 by read-only inspection of only the installer-defined agent-runtime machine-local support surface and current process/use evidence. Authorized exact support paths are: $HOME/.config/agent-runtime/runtime.local.toml; $HOME/.config/agent-runtime/; $HOME/.local/state/agent-runtime/; $HOME/.local/share/agent-runtime/checkouts/; $HOME/.config/tunnel-client/agent-runtime.yaml; and the bound agent-runtime checkout's .env existence/metadata only. These exact paths are authorized only for bounded decommission evidence; this does not authorize broad HOME enumeration."
    - "For Q-2, do not print or expose CONTROL_PLANE_API_KEY, CONTROL_PLANE_TUNNEL_ID, arbitrary environment values, .env contents, keychain data, private keys, or tunnel credentials. Do not use env/printenv or broad secret discovery. Safe evidence may include path existence/type/owner/mode/mtime, non-secret runtime config fields defined by install.sh (version, state_dir, project id, repository, checkout, remote, expected_remote_url, branch, verify argv, timeout, disposable), bounded state filenames/status metadata, checkout repository identity/branch/cleanliness, and boolean current-process/profile-use checks that do not print secret-bearing command lines."
    - "Do not stop, restart, signal, delete, clean, edit, migrate, reload, doctor-repair, reinitialize, or otherwise mutate any runtime/tunnel process, config, state, checkout, profile, .env, Homebrew package, or local filesystem artifact. This task is inspection only."
    - "Resolve Q-3 by exact read-only GitHub search/inspection of agent-skills, architect-profile, agent-documents, agent-standards, and agent-runtime for canonical references that would become stale after deletion. Record exact repository/path and the semantic reason each reference must be removed, rewritten, or deliberately retained as historical evidence. Do not mutate those repositories."
    - "Distinguish current live compatibility obligations from historical references. Historical task/report/review evidence is not a consumer and must not be rewritten merely because runtime is later deleted."
    - "Return exactly one closure disposition in the report: READY_FOR_DELETION_PLANNING, LIVE_COMPATIBILITY_OBLIGATION, or INSUFFICIENT_EVIDENCE. READY_FOR_DELETION_PLANNING requires no concrete live four-tool consumer found in the authorized search scope, machine-local state classified sufficiently to avoid guess-deletion, and an exact bounded cross-repository reconciliation inventory."
    - "If a live consumer is found, identify only the minimum compatibility fact needed for Architect judgment; do not migrate or disable it. If machine-local ownership/use remains ambiguous, identify the exact ambiguity; do not guess cleanup authority."
    - "Commit/push only .agent/tasks/TASK-0007/report.yaml as a report-only commit after refreshing exact dev/main/topology. Then verify sole parent, report-only diff, final refs/topology and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - .agent/tasks/TASK-0007/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Runtime implementation, docs, tests, config examples, workflows, branches, main, external repositories, and machine-local state remain unchanged."
  - "No cleanup/deletion/deprecation/migration is authorized."
  - "No broad HOME scan, shell-history scan, env dump, keychain query, secret-file content read, or credential disclosure."
  - "No runtime-v2, replacement broker, sandbox, wrapper, registry, orchestrator, or migration subsystem is designed."
  - "Historical task/report/review evidence remains immutable historical evidence and is not classified as a live consumer."
  - "Absence of evidence is stated only for the exact authorized search scope."
  - "Branches remain exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not modify any file other than the new .agent/tasks/TASK-0007/report.yaml."
  - "Do not mutate agent_runtime/*, tests/*, README.md, install.sh, start.sh, verify, requirements.txt, config/*, .github/*, prior task/report/review artifacts, or repository metadata."
  - "Do not mutate architect-profile, agent-skills, agent-documents, agent-standards, or any target repository discovered during consumer search."
  - "Do not delete or alter ~/.config/agent-runtime, ~/.local/state/agent-runtime, ~/.local/share/agent-runtime, ~/.config/tunnel-client/agent-runtime.yaml, repository .env, processes, tunnel profiles, Homebrew packages, or disposable checkouts."
  - "Do not create branches, mutate main, promote, tag, release, force-push, rebase, rewrite history, or change permissions."

