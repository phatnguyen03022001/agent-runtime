structure_authority:
  status: RESOLVED
  source: "Existing tool_contract ReceiptV1 plus fs_list/fs_search/repo_diff/repo_observer components"
  rationale: "Continuation is a bounded extension of four existing read-only collection surfaces. Reuse ReceiptV1 and one small stateless cursor codec adjacent to existing tool-contract machinery; no new service, datastore, snapshot subsystem, workflow framework or generic result framework is justified."

objective: "Close GAP-07 and the collection-side remainder of GAP-05 by adding one bounded, stateless, receipt-bound continuation convention to fs_list, fs_search, repo_diff and repo_observer so callers can retrieve truncated results without model-heavy repeated full calls, while remaining truthful under parameter drift and local state mutation and preserving the installed Runtime until a later cutover."

scope:
  required_changes:
    - "Extend exactly fs_list, fs_search, repo_diff and repo_observer with the common continuation contract. Initial requests omit both cursor and continuation_receipt. Resume requests provide both; providing only one is INVALID_ARGUMENT."
    - "The common successful result shape includes truncated, next_cursor and continuation_receipt. next_cursor is null when no resumable page remains. continuation_receipt is a closed ReceiptV1 projection and remains evidence/state binding only, never authorization."
    - "Use a stateless opaque continuation cursor with one tool-specific/versioned payload, bounded to at most 1024 ASCII characters. The cursor must bind the tool identity, cursor format version, page position, original semantic request parameters, relevant ReceiptV1 digest and expiry. Use deterministic integrity checking sufficient to reject accidental/tampered token bytes, but do not introduce secrets, HMAC keys, credential state or authorization semantics."
    - "Continuation cursors expire after a bounded 300-second TTL. Expiry, malformed cursor, wrong tool/version, receipt tampering, cursor/receipt mismatch, or semantic parameter mismatch fails closed with existing structured TASK-0144 error/effect semantics and stable reason codes; no English-string parsing."
    - "Reuse make_receipt_v1 and canonical structured/framing machinery. Add only the smallest shared cursor/continuation helper needed to prevent four divergent encodings. Do not broaden ReceiptV1 into a generic workflow token or change repo_commit receipt authorization semantics."
    - "fs_list continuation must bind the normalized cwd-relative directory, semantic parameters and complete deterministic sorted directory observation within existing scan bounds. Resume only when the recomputed receipt matches; an invalidating directory change returns STATE_CHANGED. Pages must have no duplicate or missing entries."
    - "fs_search continuation_consistency is revalidated, not point-in-time snapshot. Resume deterministically revalidates traversed state through the prior boundary and rejects any mutation that invalidates already-issued traversal/results with STATE_CHANGED. Do not silently continue across an invalidated prefix. Do not retain snapshots. A later-state change beyond the validated boundary may be observed only when it does not invalidate prior ordering/results."
    - "repo_diff must reuse the existing full raw-diff ReceiptV1 as the continuation state identity. Continuation pages expose the bounded patch without duplicate/missing bytes or corrupted valid UTF-8 boundaries; any raw diff/head/scope state change that invalidates the receipt returns STATE_CHANGED. Preserve diff_receipt and repo_commit semantics."
    - "repo_observer continuation remains local-only with network=NONE and mutation=NONE, binds to a deterministic local observation ReceiptV1 and pages only exact resumable collection state. Existing nested truncation/exactness fields remain truthful. If an existing hard observation bound prevents an exact resumable state identity, do not manufacture a cursor; preserve truthful terminal truncation or existing bounded failure semantics."
    - "Preserve existing hard scan/state/output limits. Pagination may expose additional pages only through bounded revalidated calls; it must not create unbounded in-memory retention, background work, persistent cursor state, snapshot retention, or a way to bypass existing per-observation safety ceilings."
    - "Bump source request/result schema versions for fs_list, fs_search, repo_diff and repo_observer from 1/1 to 2/2. Preserve omitted-continuation default behavior for existing callers and preserve all pre-existing result fields. For repo_diff/repo_observer add the common top-level truncated field without deleting or weakening existing patch_truncated/nested truncation truth."
    - "Update capability registry/schema export/MCP conformance and directly affected source documentation. Source ToolContract Kernel remains 2, public tool inventory remains 19, Runtime source version remains 0.3.0, and no installed Runtime/plugin cutover occurs in this task."
    - "Add focused deterministic tests for multi-page no-duplicate/no-gap behavior, deterministic pagination, cursor/receipt pairing, semantic parameter mismatch, malformed/tampered/expired cursor, receipt tampering, local file/directory/Git mutation between pages, STATE_CHANGED behavior, fs_search revalidated semantics, UTF-8/page boundaries, cursor/result byte bounds, schema/export compatibility, default first-page behavior and absence of unbounded snapshot retention."
    - "After focused PASS, commit one coherent source candidate, run canonical ./verify on that exact clean candidate, fresh-reconcile remote main, publish the exact verified candidate non-force, then publish report-r1.yaml as the sole report-only child and stop NEEDS_REVIEW."

