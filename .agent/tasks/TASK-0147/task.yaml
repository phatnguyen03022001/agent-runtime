invariants:
  - "TASK-0144 structured failure/effect semantics remain authoritative; continuation decisions never parse English error text."
  - "TASK-0145 unified execution lifecycle and TASK-0146 terminal_poll behavior remain unchanged."
  - "Installed Runtime remains 0.3.0 at runtime_activation_revision 89111218720ddb2f12961f9375549733edd23ada throughout TASK-0147; no install/restart/plugin reload/cutover."
  - "Source Runtime version remains 0.3.0, ToolContract Kernel remains 2, and public tool inventory remains exactly 19."
  - "Only fs_list, fs_search, repo_diff and repo_observer source request/result schema versions change in this task, each from 1/1 to 2/2."
  - "Continuation cursor/receipt is never authorization and cannot expand workspace, filesystem, Git, network or mutation authority."
  - "ReceiptV1 namespace/hash semantics remain compatible. repo_diff ReceiptV1 and repo_commit exact staged-state authorization semantics remain unchanged."
  - "fs_search does not claim strict snapshot semantics; continuation_consistency remains explicitly revalidated."
  - "repo_observer remains local-only, fetched=false, network_used=false and repository mutation=false."
  - "No global cache, TTL cache, persistent cursor store, database, daemon, scheduler, snapshot service, workflow engine or generic repository-provider abstraction."
  - "No GAP-03, GAP-06, GAP-08, GAP-09, GAP-10, GAP-11, GAP-12 or GAP-13 implementation."
  - "TASK-0148 and later roadmap tasks are not authored or executed by Executor."

