acceptance_criteria:
  - id: AC-1
    requirement: "All four target tools implement one compatible request-side cursor+continuation_receipt pairing and result-side truncated/next_cursor/continuation_receipt contract with bounded stateless tokens."
    evidence_required: "Focused unit/schema/MCP tests prove 2/2 schemas, pair validation, <=1024-character cursor bound, 300-second expiry, tool/version binding, parameter binding and default first-page compatibility."
  - id: AC-2
    requirement: "Continuation produces deterministic complete pages without duplicates or gaps under unchanged state and fails closed when prior state is invalidated."
    evidence_required: "Multi-page fixtures for fs_list, fs_search, repo_diff and repo_observer plus parameter mismatch, tamper, expiry and mutation-between-pages tests; invalidating mutation emits structured STATE_CHANGED where specified."
  - id: AC-3
    requirement: "fs_search is truthfully revalidated rather than snapshot-backed."
    evidence_required: "Tests re-run deterministic traversal through the prior boundary, prove invalidating prefix mutation returns STATE_CHANGED, prove no snapshot/cache/store retention, and document continuation_consistency=revalidated."
  - id: AC-4
    requirement: "Existing receipt, Git, authority and boundedness semantics remain intact."
    evidence_required: "repo_diff continuation reuses full raw-diff receipt; repo_commit ReceiptV1 regressions PASS; repo_observer remains network/mutation free; existing hard scan/output bounds and structured failure/effect tests remain PASS."
  - id: AC-5
    requirement: "Exact source candidate is canonically verified and published while installed Runtime stays unchanged."
    evidence_required: "Focused PASS, git diff --check, canonical ./verify exit_code=0 on exact candidate, fresh non-force publication reconciliation, source Kernel=2/tools=19/version=0.3.0, read-only installed observation still Runtime 0.3.0 activation revision 89111218720ddb2f12961f9375549733edd23ada, canonical report-only child and NEEDS_REVIEW."

