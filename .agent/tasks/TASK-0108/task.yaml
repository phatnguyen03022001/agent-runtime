canonical_verification:
  authority: "0/1"
  launcher_authority: "0/1"
  repository_path: "/Users/tienphat/Developer/agent-runtime"
  helper_script: "/Users/tienphat/Developer/.task-0108-r5-verify.sh"
  launch_file: "/Users/tienphat/Developer/.task-0108-r5-verify.launch"
  state_file: "/Users/tienphat/Developer/.task-0108-r5-verify.state"
  log_file: "/Users/tienphat/Developer/.task-0108-r5-verify.log"
  receipt_file: "/Users/tienphat/Developer/.task-0108-r5-verify.receipt"
  temp_receipt_file: "/Users/tienphat/Developer/.task-0108-r5-verify.receipt.tmp"
  helper_contract:
    - "The helper is created before launch, is a regular non-symlink file, and passes /bin/bash -n."
    - "The helper's first executable action after strict fixed-variable initialization is to atomically write state=STARTED with its own PID."
    - "It then cd's to the fixed repository path and invokes literal ./verify exactly once."
    - "Full ./verify stdout/stderr is redirected only to the fixed log file."
    - "Immediately after ./verify returns, it captures exit_code, computes completed log SHA-256 and byte size, atomically writes FINISHED receipt via the fixed temp receipt path, then exits with the same exit code."
    - "Any helper failure before ./verify must atomically write a FINISHED receipt with verify_invoked=false and a non-zero launcher/helper exit code; it must never silently disappear."
  launch_contract:
    - "Before launch, all six revision-5 helper/launch/state/log/receipt/temp paths must be absent. If any exists, stop VERIFY_RECEIPT_PRECONDITION_FAILED without deleting/overwriting it."
    - "After creating and bash -n validating the helper, atomically write launch_file with state=PREPARED plus helper_sha256 before detachment."
    - "Launch exactly one helper process using Python subprocess.Popen(['/bin/bash', helper_script], stdin=DEVNULL, stdout=DEVNULL, stderr=DEVNULL, start_new_session=True, close_fds=True)."
    - "The Python launcher must atomically update launch_file to state=LAUNCHED with child_pid and helper_sha256 before returning."
    - "The launcher must perform no ./verify invocation itself."
    - "After LAUNCHED is durably recorded, launcher authority is consumed 1/1 even if the child later fails."
  observation_contract:
    - "Poll only child liveness plus fixed launch/state/receipt/log metadata. Never invoke ./verify or launch another helper."
    - "Use at most 300 observations with exactly 2 seconds sleep before each observation; no observation 301."
    - "If FINISHED receipt appears, validate its schema, helper_sha256 binding, verify_invoked boolean, exit_code, log_sha256 and log_bytes; recompute and require exact log hash/size equality when verify_invoked=true."
    - "Only verify_invoked=true AND exit_code=0 is canonical PASS."
    - "verify_invoked=true AND exit_code!=0 is CANONICAL_VERIFICATION_FAILED."
    - "verify_invoked=false is CANONICAL_VERIFICATION_LAUNCH_FAILED."
    - "If the child is absent after LAUNCHED but no valid FINISHED receipt exists, stop CANONICAL_VERIFICATION_RESULT_UNAVAILABLE."
    - "If the child remains alive through observation 300 without FINISHED receipt, stop CANONICAL_VERIFICATION_STILL_RUNNING. Preserve all artifacts/process; do not relaunch."

