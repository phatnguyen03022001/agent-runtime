structure_authority:
  status: RESOLVED
  source: "Existing screen_capture tool and pinned MCP SDK."
  rationale: "No new public tool, UI, helper, dependency or transport service is needed. Correct the existing tool from mixed structured+media output to an unstructured media-first result."

objective: "Correct the production screen_capture MCP result contract so ChatGPT receives model-facing image content without a competing structured output schema. Preserve the existing capture helper, input surface, native/TCC behavior, eleven-tool public surface and bounded metadata semantics. Verify the source correction and freeze one immutable signed successor candidate. Do not install or activate it."

execution_surface:
  id: CODEX_LOCAL
  controller: CODEX
  location: LOCAL
  transport: NATIVE

contract_change:
  tool: screen_capture
  public_tool_count: 11
  input_contract_change: false
  annotations_change: false
  native_capture_change: false
  success_output:
    output_schema: null
    structured_content: null
    content_order:
      - "exactly one ImageContent containing byte-exact PNG image/png payload"
      - "exactly one TextContent containing deterministic minified JSON of the validated ScreenCaptureMetadata"
  error_output:
    output_schema: null
    structured_content: null
    is_error: true
    content:
      - "exactly one bounded TextContent containing deterministic minified JSON error envelope with code/message/retryable"
  metadata_text:
    deterministic: true
    sorted_keys: true
    utf8_bound: "must remain within the existing MAX_HEADER_BYTES ceiling"
  rationale: "The live ChatGPT app path surfaced structured metadata while semantic ImageContent was absent. Removing outputSchema/structuredContent makes screen_capture media-first and model-facing while preserving metadata as bounded text content."

scope:
  required_changes:
    - "Fresh-resolve canonical TASK-0108 planning HEAD and remote dev/main. Synchronize the canonical local dev checkout to the exact planning HEAD using ordinary CODEX_LOCAL native Git only if clean and exact fast-forward; fail closed on ambiguity."
    - "Capture a genuine RED focused test state before production changes: current tests must fail after expressing the new media-first contract and before implementation is corrected."
    - "In agent_runtime/server.py, make screen_capture truthfully return CallToolResult rather than ScreenCaptureMetadata, without altering its input parameters or read-only/closed-world annotations."
    - "In agent_runtime/screen_capture.py, preserve helper invocation/parsing/native metadata validation and PNG integrity exactly. Change only MCP result construction: success must carry ImageContent first plus deterministic bounded metadata TextContent and no structuredContent."
    - "For screen_capture typed failures, preserve stable error code/message/retryable semantics but emit them as deterministic bounded JSON TextContent with isError=true and no structuredContent."
    - "Do not put PNG base64, file paths, OCR text, or image descriptions in TextContent. The image bytes must exist only in ImageContent."
    - "Keep the metadata text within MAX_HEADER_BYTES UTF-8 bytes. If deterministic metadata serialization would exceed that bound, fail closed with CAPTURE_PROTOCOL_ERROR rather than truncating."
    - "Update tests/test_screen_capture.py for content-only capture_screen behavior and exact metadata/error bounds."
    - "Update tests/test_screen_capture_mcp.py to require screen_capture output_schema is None, structured_content is None on success/error, exactly one byte-exact ImageContent plus exactly one deterministic metadata TextContent on success, and one deterministic bounded error TextContent on failure."
    - "Update tests/test_mcp_contracts.py so generic output-schema assertions explicitly exempt only screen_capture as the intentional media-first unstructured tool while every other structured tool remains closed/schema-validated."
    - "Update README.md screen_capture documentation to state success is unstructured media-first: PNG ImageContent plus bounded JSON metadata TextContent, with no outputSchema/structuredContent. Do not change the eleven-tool count."
    - "No dependency version change. Keep mcp==2.2.0 and requirements.lock byte-identical."
    - "Run focused affected Python tests during iteration; do not repeatedly run canonical full verification."
    - "Before handoff, run canonical ./verify exactly once. It must PASS. Canonical verification authority is 0/1 -> 1/1."
    - "After verification PASS, perform canonical package/sign/freeze using the existing package_app.sh path with an already-configured explicit non-ad-hoc AGENT_RUNTIME_CODESIGN_IDENTITY. Do not discover/select a signing identity or print the signing literal."
    - "Packaging must use canonical CPython 3.13.x / cp313 / macOS arm64 and locked dependencies. Require package provenance, strict codesign verification and immutable candidate freeze PASS."
    - "If the explicit signing identity is unavailable, do not weaken signing or use ad-hoc signing. Publish the verified implementation/report with terminal IMPLEMENTATION_VERIFIED_PACKAGING_UNAVAILABLE."
    - "If packaging succeeds, record candidate SHA-256, candidate path, handoff path/hash and package provenance in the report. Do not install it."
    - "Publish implementation commit and TASK-0108 report on dev. Report must bind the exact implementation commit and candidate identity if produced."

