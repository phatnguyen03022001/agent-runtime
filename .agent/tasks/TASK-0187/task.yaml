acceptance_criteria:
  - id: AC-1
    requirement: "Exact accepted public v0.5.1 artifact and healthy predecessor are proven before mutation."
    evidence_required: "Fresh remote tag/release/asset identity, archive hash/size, complete bundle/provenance, installed 0.5.0 package-owned doctor/readiness and no transaction."
  - id: AC-2
    requirement: "Prebuilt preflight preserves the accepted app seal and release trust."
    evidence_required: "Fresh-copy preflight PASS, sealed app snapshot unchanged, strict deep codesign and zero-cost provenance PASS afterward, zero live cutover effects."
  - id: AC-3
    requirement: "One bounded transactional public-release installation succeeds or fails closed with exact reconciliation."
    evidence_required: "At most one install and one commit, recognized PENDING gates, no blind retry, and only deterministic package-owned rollback/recovery when actually required."
  - id: AC-4
    requirement: "Successful activation matches the accepted public v0.5.1 package and preserves operator configuration."
    evidence_required: "No transaction, readiness ready, package-owned doctor healthy, Runtime 0.5.1, 20 advertised tools/21 known capabilities, accepted package/provenance identity, and unchanged runtime.env SHA/owner/mode."
  - id: AC-5
    requirement: "Repository and effect closure are exact."
    evidence_required: "Only report.yaml tracked during execution, validated report-only direct child, clean synchronized main, exact live invocation/effect counts, and zero unauthorized release/source/security/dependency effects."

verification:
