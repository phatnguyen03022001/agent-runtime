invariants:
  - "Architecture, package design, signing/provenance semantics, lifecycle semantics, public tool contracts and accepted release bytes remain unchanged."
  - "The exact public v0.5.1 archive/tag/assets are immutable inputs and must never be replaced, edited or republished."
  - "Canonical runtime.env bytes, owner and mode 0600 remain unchanged."
  - "Every live Runtime consequence uses package-owned transactional install/cutover/recovery; no manual app, payload pointer, LaunchAgent, service, process or transaction surgery."
  - "No tunnel-client, credentials, Gatekeeper, TCC, Keychain, Apple signing/notarization, host dependency or sibling-repository mutation."
  - "Main-only topology; no branch, PR, force push or amend."

forbidden_changes:
  - "Any product source, package, provenance, test, documentation, dependency, version or public-contract change."
  - "Any package/archive rebuild, canonical ./verify invocation, new tag, release publication, asset replacement or v0.5.0/v0.5.1 tag movement."
  - "Blind reinstall, repeated commit after unknown effect, blind rollback/recovery, uninstall-first flow, configuration reset, runtime.env rewrite or credentials disclosure."
  - "Bypassing strict codesign/provenance, deleting generated evidence to manufacture PASS, disabling security controls, or widening host permissions."
  - "Using the Agent Runtime process being replaced as the sole consequence-bearing carrier for its own install/cutover."
  - "Continuing into documentation/version-truth cleanup after live qualification; that is a separate post-review task."

