structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "Qualification-only activation of the already accepted public v0.5.1 package; no product/source structure change is authorized."

objective: "Install and transactionally activate the exact accepted public v0.5.1 macOS arm64 release over the healthy installed v0.5.0 predecessor while preserving canonical runtime.env byte-for-byte, then prove the installed package is healthy and matches the accepted public artifact. Do not change architecture, product source, documentation, package bytes, release assets or host security policy."

scope:
  required_changes:
    - "Freshly bind clean synchronized main at the exact task base and accepted TASK-0186 review. Re-resolve public release v0.5.1, tag target 674095e739533e100c2cf75f434dd0bc825a3de3, archive asset 595362326, checksum asset 595362324, archive size 17798890 and SHA-256 9518e1cf4f28033cbec97b8906e55e1a4da6ad3a9067485fb6ef7c4fcfac58e8 before any live mutation."
    - "Freshly prove the installed predecessor is Runtime 0.5.0 revision b1879b5c185e93457bb634a7ab0508f7220416af, package-owned doctor is healthy with its expected complete PASS set, readiness is ready, no cutover transaction exists, and Runtime/tunnel/listener ownership is unambiguous."
    - "Record only canonical runtime.env existence, SHA-256, owner and mode before mutation; never print or copy credential/configuration values. Require the exact original bytes, owner and mode 0600 after every consequential live step."
    - "Download or reuse a freshly remote-verified public v0.5.1 archive only after matching its exact accepted SHA-256 and size. Extract one complete bundle under ignored build/TASK-0187-install and validate the app, external handoff and initial payload with the package-owned zero-cost provenance path before live mutation."
    - "Run the packaged read-only prebuilt preflight on a fresh extracted bundle against the existing configured workspace. Prove normal preflight does not add or modify sealed app resources, strict deep codesign remains valid afterward, release trust/provenance remains PASS, and no cutover transaction was created."
    - "Use an independent connected host carrier for all consequence-bearing install/cutover/recovery actions because Agent Runtime itself is the product being replaced. Invoke the packaged install_release.sh transactional install at most once. After the invocation, reconcile the actual transaction/service state before any further consequence; an unknown response never authorizes a blind retry."
    - "If the installation reaches the recognized PENDING state, require readiness ready and package-owned doctor with no failure and no warning other than the exact recognized CUTOVER_TRANSACTION_PRESENT condition attributable to this transaction. Then invoke package-owned commit-cutover at most once."
    - "If the supported transaction cannot complete, use at most one package-owned rollback-cutover or one package-owned recover-partial-cutover only when the observed transaction state deterministically selects that documented recovery. If state is ambiguous or recovery would require manual lifecycle surgery, stop BLOCKED and preserve evidence."
    - "After successful commit, prove the cutover transaction is absent, readiness is ready, package-owned doctor is healthy, Runtime reports version 0.5.1 with twenty advertised public tools and twenty-one known capabilities, and installed package/provenance identifies the accepted v0.5.1 source and payload. Prove canonical runtime.env retains its exact pre-task bytes, owner and mode 0600."
    - "Do not consume canonical ./verify, rebuild source/package/archive, modify release/tag/assets, modify product/docs/tests, mutate tunnel-client or host security state, or install dependencies. This task qualifies only the already accepted public artifact."
    - "Write and validate only .agent/tasks/TASK-0187/report.yaml as tracked execution output. Publish the report as the sole direct child of the unchanged execution base, non-force to main, then reconcile clean synchronized main. Record exact invocation/effect counts, any recognized recovery, final live identity, environment preservation and result NEEDS_REVIEW only on complete PASS; otherwise BLOCKED."
  allowed_existing_files_or_components:
    - "Public v0.5.1 release archive, checksum, app, handoff and initial payload as immutable read-only inputs"
    - "Installed Agent Runtime app, package-owned lifecycle, transaction and recovery state"
    - "Canonical runtime.env for read-only preservation evidence"
    - "build/TASK-0187-install/ ignored qualification evidence"
    - ".agent/tasks/TASK-0187/report.yaml"
  expected_files_are_restrictive: true

structure_policy:
  expected_new_files:
