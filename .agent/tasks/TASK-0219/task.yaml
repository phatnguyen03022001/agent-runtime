    - "package_app.sh creates a CPython 3.13 venv with --copies and preserves pyvenv.cfg home/executable values from the packaging interpreter."
    - "materialize_packaging_python_runtime copies relative libpython bytes from sys.base_prefix/lib but preserves the copied dylib absolute LC_ID_DYLIB."
    - "The final candidate contains third-party site-packages but does not contain a package-owned CPython standard library/lib-dynload tree."
  forensic_reproduction:
    - "Existing zero-cost candidates from the accepted packaging lineage contain operator HOME bytes in runtime/.venv/pyvenv.cfg and runtime/.venv/lib/libpython3.13.dylib."
    - "pyvenv.cfg points home/executable at the builder CPython prefix."
    - "libpython3.13.dylib install identity is the absolute builder prefix."
    - "The bundled interpreter reports sys.base_prefix and stdlib outside the candidate and imports os.py from the builder prefix."
    - "The source CPython stdlib contains builder-prefix literals in _sysconfigdata__darwin_darwin.py, so blind stdlib copying is insufficient."
  preserved_gate: "macos/release_bundle.py HOME-path rejection is correct and must remain unchanged."

objective: "Convert the package-owned Python payload from a host-bound copied venv into a self-contained relocatable CPython 3.13 runtime prefix while preserving the validated interpreter version/architecture, hash-locked dependency installation, candidate provenance, public Runtime behavior and deterministic release-bundle gate."

