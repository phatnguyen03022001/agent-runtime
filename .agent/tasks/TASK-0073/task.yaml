acceptance_criteria:
  - id: AC-1
    requirement: "Protected Runtime classification no longer performs eager host process inspection."
    evidence_required: "Deterministic pre-fix failing provider-call regression; post-fix benign and argv/text-only protected classifications complete with zero process_rows_provider calls, while kill/pkill/killall-sensitive cases still request inspection."
  - id: AC-2
    requirement: "The default macOS process snapshot path is bounded before output materialization."
    evidence_required: "Tests prove explicit finite byte, row and deadline bounds; above-bound or deadline-exceeded synthetic ps output stops/reaps the helper without reading an unbounded remainder or leaking a process/pipe."
  - id: AC-3
    requirement: "Process-inspection failure is fail-closed for destructive process-sensitive classification."
    evidence_required: "Deterministic tests cover nonzero/timeout/overflow or equivalent failure classes and prove kill/pkill/killall-style requests are denied before execution when canonical process identity cannot be determined safely."
  - id: AC-4
    requirement: "Existing protection semantics and public Runtime behavior are preserved."
    evidence_required: "Existing direct PID/PGID, pkill/killall, shell/wrapper, launchd/start.sh, canonical relaunch, port, audit, terminal guard, admission and MCP contract/conformance tests PASS with no public schema/config expansion."
  - id: AC-5
    requirement: "Canonical repository verification and publication are clean."
    evidence_required: "Canonical ./verify PASS, git diff --check PASS, implementation paths restricted to protection.py plus the authorized test file, report-only direct child, non-force dev publication, clean tree, main unchanged."

