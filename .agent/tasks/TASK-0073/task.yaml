problem_statement:
  f03_eager_scan: >-
    ProtectedRuntimeGuard._classify() calls _canonical_processes() before determining whether the command can possibly
    require PID/process-name matching. Benign commands, direct canonical relaunch detection, unrelated launchctl reads,
    port checks, and each recursively classified shell segment therefore pay for a host-wide process snapshot even when
    no process identity is needed.
  f03_unbounded_scan: >-
    The default _read_process_rows() uses subprocess.run(... capture_output=True, text=True) over host-wide /bin/ps
    output. The Runtime has no explicit maximum captured bytes, row count, or scan deadline before materializing and
    parsing that output. This violates the bounded-work requirement for a guard that runs on terminal execution paths.
  f03_failure_semantics: >-
    The current default reader converts a nonzero ps exit into an empty process list. For destructive process-targeting
    commands this is indistinguishable from proving that no canonical Runtime process exists. The correction must not
    turn scan failure, timeout, overflow, or malformed bounded snapshot state into an unsafe allow decision.

objective: >-
  Close F-03 with the smallest protection.py-only production correction: process inspection must be lazy, bounded in
  memory/work/time, and fail closed for commands whose safety decision genuinely depends on canonical PID/process-name
  inspection. Preserve the existing six-tool public MCP surface, current deny semantics for canonical process signals,
  pkill/killall matches, launchd/start.sh lifecycle commands, canonical relaunches, port protection, shell wrappers and
  command unwrapping. Prove the eager and unbounded behaviors with deterministic RED tests before source mutation, make
  the minimal implementation pass, run affected/canonical verification, publish a report-only child, and stop at
  ARCHITECT_REVIEW. Do not claim final freeze.

scope:
  required_checks:
    - "Fresh-resolve GitHub dev, origin/dev and local HEAD; require the exact TASK-0073 handoff base and a clean designated working tree before mutation."
    - "Read current agent_runtime/protection.py and tests/test_protected_runtime.py before editing; inspect executor/session guard call sites read-only only as needed to confirm affected behavior."
    - "TDD RED-1: add a deterministic laziness regression using an injected process_rows_provider that raises or records calls. Prove benign classification and non-process-sensitive protected classifications do not need a process snapshot. The unmodified base must fail because _classify() eagerly invokes the provider."
    - "TDD RED-2: add deterministic bounded-reader coverage for the default process reader. The test must prove host process output is consumed through a hard byte bound rather than subprocess.run(capture_output=True) or any equivalent unbounded whole-output materialization. Exercise below/at/above the chosen bound without spawning a real huge host process table."
    - "TDD RED-3: add deterministic fail-closed coverage for process-sensitive commands when process inspection cannot produce a trustworthy bounded snapshot because of nonzero exit, timeout/deadline, byte/row overflow, or equivalent bounded-reader failure. No actual signal, pkill, killall, Runtime mutation, or protected command may execute in the test."
    - "Record exact RED test names and pre-fix failure signals in the report before production-source mutation. If the eager/unbounded defect cannot be demonstrated deterministically, STOP at ARCHITECT_REVIEW rather than changing the design speculatively."
    - "Move process inspection behind the narrowest classification branches that require canonical PID/process-command knowledge. Ordinary commands and classifications decidable from argv/text alone must not invoke the process_rows_provider."
    - "Preserve shell segmentation and wrapper unwrapping behavior. A shell command containing a process-sensitive segment may perform the bounded snapshot only when that segment is reached; unrelated segments must not cause eager scans."
    - "Replace the default whole-output ps capture with a bounded binary/byte-oriented reader or equivalent design that has explicit finite byte and row bounds plus a finite scan deadline. Do not merely truncate after capture_output has already materialized the full stdout."
    - "The bounded reader must close/reap its own ps child cleanly on success, timeout, overflow and error; no helper process leak, pipe leak, background worker, cache, or long-lived scanner is allowed."
    - "Choose conservative fixed internal bounds sufficient for normal macOS process tables and state them in source/tests. Do not expose new operator knobs, environment variables, MCP arguments, public schemas, or configuration surface."
    - "A trustworthy complete snapshot preserves current canonical-root/descendant derivation and pkill/killall command matching semantics. Do not weaken exact canonical tunnel argv matching."
    - "If a process-sensitive classification cannot obtain a complete trustworthy snapshot, fail closed before the requested destructive command can spawn/write. Use one bounded internal denial/error path that does not include process-table contents, argv payloads, credentials, or secrets in audit output."
    - "Preserve existing bounded audit behavior: at most MAX_AUDIT_EVENTS, category/tool only, no command payload."
    - "Do not add caching of process snapshots in this task. Each process-sensitive classification may obtain one fresh bounded snapshot; measurement/performance tuning is a separate follow-up."
    - "Run focused protection tests first, then affected terminal/MCP/admission tests, then canonical ./verify exactly once for handoff verification unless a failure requires a focused correction."
    - "Publish implementation changes on dev non-force, then publish only .agent/tasks/TASK-0073/report.yaml as the report-only direct child. Stop at ARCHITECT_REVIEW."

