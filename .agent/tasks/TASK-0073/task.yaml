    that eager/unbounded process-inspection path. Cutover crash consistency and performance optimization remain separate.
  operator_authorization: >-
    Operator replied "ok" after the Architect proposed handling only F-03 next, without bundling cutover or performance
    work. This authorizes the bounded repository correction defined by this task; it does not authorize live Runtime,
    tunnel, installer, transaction, or lifecycle mutation.

