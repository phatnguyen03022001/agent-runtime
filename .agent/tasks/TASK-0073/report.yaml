implementation:
  commit: "39fbb42954775a12801ccdba8377f92fc3eaf8e9"
  parent: "00f20b5ba000171bfe86fa8a0d796989295b2eef"
  changed_paths:
    - agent_runtime/protection.py
    - tests/test_protected_runtime.py
  fixed_internal_bounds:
    max_bytes: 4194304
    max_rows: 8192
    deadline_seconds: 2.0
    read_chunk_bytes: 65536
  lazy_inspection: >-
    ProtectedRuntimeGuard no longer obtains a process snapshot at classifier entry. Canonical relaunch, shell parsing,
    wrappers, launchd/start.sh lifecycle checks, port checks and ordinary argv-only decisions do not inspect the host
    process table. kill inspects only when it has numeric targets; pkill only when it has a pattern; killall only when
    it has a name.
  bounded_reader: >-
    The default reader now launches /bin/ps with Popen and a binary stdout pipe, waits only within a finite monotonic
    deadline, reads incrementally with os.read, rejects byte or materialized-row overflow before unbounded output can
    accumulate, and parses only the bounded complete payload.
  helper_cleanup: >-
    Success, nonzero exit, timeout, overflow, parse error and other bounded-reader failures all close the stdout pipe;
    a still-running helper is killed and every helper is waited/reaped in the reader finally path.
  failure_semantics: >-
    Process snapshot failures are normalized internally and process-sensitive classification returns the payload-free
    process_inspection_unavailable denial category rather than allowing a destructive command from an empty or missing
    snapshot.
  snapshot_freshness: "No cache was added; each process-sensitive classification obtains at most one fresh snapshot."

