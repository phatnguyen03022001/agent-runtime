      required: true
    - id: V-3
      command_or_check: "Create the final implementation candidate commit, ensure the worktree is clean at that exact HEAD, then run ./verify once on that exact candidate. If a code fix becomes necessary, replace/amend the unpublished candidate and rerun the invalidated final gates on the new exact candidate."
      required: true
    - id: V-4
      command_or_check: "On the clean exact implementation candidate, run one non-installed macos/package_app.sh build from immutable staging; independently verify strict codesign, manifest identity/closure, absence of checkout references/secrets, and fresh lock-owned runtime environment."
      required: true
    - id: V-5
      command_or_check: "Inspect exact task-base-to-candidate diff for public-MCP/protection/CI/live-Runtime/main/tag/release violations and confirm no checkout .venv packaging remains."
      required: true
    - id: V-6
      command_or_check: "Fresh-resolve origin/dev and origin/main immediately before non-force publication and again after publication; fail closed on drift."
      required: true
