structure_authority:
  status: RESOLVED
  source: "Existing agent_runtime server entrypoint and TerminalSessionManager shutdown implementation"
  rationale: "Use the existing singleton session manager and its TERM to bounded grace to KILL process-group cleanup. No new process manager, supervisor, registry, service, or persistent state is authorized."

objective: "Ensure a normally signal-terminated runtime invokes existing terminal-session cleanup before exit, so persistent session process groups do not outlive SIGTERM or SIGINT runtime termination."

scope:
  required_changes:
    - "Fresh-bind TASK-0024 revision 1 at its exact handoff base, resolve remote dev and main immediately before mutation, and prove clean exact target identity and required execution capability."
    - "Use the existing server lifecycle and TerminalSessionManager shutdown path to make runtime SIGTERM and SIGINT termination invoke process-group cleanup before the runtime exits. Preserve TERM to bounded grace to KILL semantics and ordinary termination behavior."
    - "Add an exact subprocess regression boundary that creates a persistent session with a descendant, signals the runtime process with SIGTERM and SIGINT separately, and proves the descendant process group cannot survive either catchable termination path. Keep normal child completion, explicit terminal_control terminate, and manager shutdown coverage truthful."
    - "Run the repository-native verification suite and the exact new signal regression. Validate the actual report, publish the candidate and report-only direct child non-force to dev, then stop at NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "agent_runtime/server.py"
    - "agent_runtime/session.py"
    - "tests/test_terminal_session.py"
    - ".agent/tasks/TASK-0024/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Persistent terminal sessions remain memory-only and use the existing single TerminalSessionManager."
  - "The runtime does not introduce a daemon supervisor, persistent process registry, process database, sandbox, container, scheduler, retry engine, orchestration layer, watchdog, or custom init system."
  - "Explicit terminal_control terminate and manager shutdown retain their existing cleanup semantics."
  - "SIGKILL remains an uncatchable boundary and is not represented as cleanup success."
  - "No branch, main ref, tag, release, repository metadata, dependency, workflow, authority lock, or sibling repository is mutated."

forbidden_changes:
  - "Do not create a duplicate process manager or broaden the public MCP tool surface."
  - "Do not weaken workspace confinement, terminal argument validation, or process-group cleanup failure handling."
  - "Do not add CI, background services, databases, registries, migration machinery, new top-level directories, dependencies, or unrelated cleanup."
  - "Do not force-push, rewrite history, create a branch, promote to main, create tags or releases, or modify prior task/report/review artifacts."

