acceptance_criteria:
  - id: AC-1
    requirement: "Runtime catchable termination reuses the existing manager shutdown path without creating another lifecycle owner."
    evidence_required: "Exact source diff and focused regression prove SIGTERM and SIGINT each invoke cleanup before runtime exit while existing process-group TERM to grace to KILL behavior remains in use."
  - id: AC-2
    requirement: "A persistent session descendant cannot survive a SIGTERM or SIGINT delivered to the runtime process."
    evidence_required: "A subprocess regression starts a session and descendant, sends each signal in a separate case, and demonstrates no surviving descendant/process group after bounded observation."
  - id: AC-3
    requirement: "Existing terminal lifecycle behavior remains correct."
    evidence_required: "Repository-native verification passes, including normal child completion, explicit termination, manager shutdown, and the new signal boundary."
  - id: AC-4
    requirement: "The candidate and evidence publication are bounded and reconstructible."
    evidence_required: "Actual task/report validation, git diff check, candidate and report-only direct-child lineage, non-force dev publication, and fresh remote dev/main proof."

