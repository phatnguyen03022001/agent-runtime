executive_verdict: DO_NOT_RECOMMEND
verdict_rationale: >-
  Do not adopt the exact proposed architecture as Agent Runtime's production security foundation. Disposable per-task workspaces are empirically cheap on this repository and improve cleanliness and reproducibility, and custom Seatbelt profiles mechanically confined the tested non-PTY and PTY descendant trees. However, the dynamic custom policy mechanism available on this host is sandbox-exec/SBPL: the host marks sandbox-exec DEPRECATED, the current SDK marks sandbox.h deprecated and no-longer-supported, and Apple DTS states custom sandbox facilities and SBPL are not supported for third-party product development. The supported App Sandbox is real and inherited by children, but this spike did not prove it can express Agent Runtime's dynamic arbitrary task-root policy while preserving the four generic engineering tools. Adopting now would add workspace lifecycle and unsupported policy debt while current Runtime protection still has to remain.

evidence_classification:
  CONFIRMED:
    - "executor.py:159-163 states the cwd guard is not filesystem confinement; terminal_exec spawns argv directly with shell=False."
    - "session.py:119-143 applies the same cwd guard to PTY processes; terminal_control(write) currently applies Runtime protection before delivering bytes."
    - "protection.py implements shell parsing, wrapper handling, canonical Runtime identity recognition, service/process protection and protected-listener patterns."
    - "protection.py is 327 lines and tests/test_protected_runtime.py is 212 lines at the exact base."
    - "Accepted TASK-0030 proves CODEX_LOCAL has a separate mechanical Seatbelt boundary; accepted TASK-0031 places live runtime.env authority outside the checkout."
    - "Apple documents App Sandbox as supported kernel-enforced access control and documents child-process inheritance."
    - "Git documents linked-worktree administrative metadata and warns that shared/reference clones depend on source object lifetime."
  MEASURED:
    - "Host: macOS 26.6.2 build 25G83, arm64, 16 GiB RAM, Git 2.55.0."
    - "/usr/bin/sandbox-exec exists; its local man page marks it DEPRECATED."
    - "Current SDK sandbox.h says the header is deprecated and may be removed; related APIs are annotated No longer supported."
    - "Non-PTY synthetic profile allowed an allowed-subtree write but denied Python child and shell grandchild writes to a denied subtree."
    - "PTY synthetic profile allowed an allowed-subtree write but denied a shell grandchild write with Operation not permitted."
    - "Eight-run medians: detached worktree create 31.342 ms / 1360 KiB / cleanup 13.250 ms; shared clone 39.832 ms / 1480 KiB / 8.356 ms; independent no-hardlinks clone 75.270 ms / 3392 KiB / 26.525 ms."
    - "Crash-like deletion of a linked-worktree directory left stale metadata until git worktree prune."
    - "Five fresh-workspace focused-test medians: worktree 4634.225 ms, shared clone 4621.433 ms, independent clone 4608.838 ms; all runs passed 26/26 tests."
    - "Current checkout is 425268 KiB, including .venv 54072 KiB and build 36028 KiB; ignored state also includes macos/.build and Python caches."
    - "PYTHONDONTWRITEBYTECODE=1 ./verify passed 118/118 tests in 55.266 s plus compile and shell-syntax checks."
    - "All TASK-0032 synthetic roots were removed; final residue scan was empty."
  INFERRED:
    - "Whole-root deletion after durable publication materially reduces dirty-checkout recovery and stale generated-state ambiguity."
    - "Independent local clone is the cleanest measured Git strategy because task metadata and object lifetime are self-contained; its roughly 44 ms median create penalty over worktree is negligible beside multi-second tests here."
    - "A useful custom SBPL policy would likely accumulate tool-specific filesystem, network and process exceptions, moving complexity rather than eliminating it."
  UNKNOWN:
    - "Whether a fully supported Apple API can express the exact dynamic per-task file/process/network boundary without forbidden heavier infrastructure."
    - "Whether every compiler, package manager, debugger, code-signing flow and future build tool remains usable under a minimal supported policy."
    - "When Apple might remove or materially change sandbox-exec/custom-profile behavior."
    - "Cross-repository dependency-install and full build-cache cold costs."

