acceptance_criteria:
  - id: AC-1
    requirement: "Research is grounded in current Agent Runtime implementation and current host behavior."
    evidence_required: "Exact current code paths and host observations are cited; claims distinguish measured facts from inference."
  - id: AC-2
    requirement: "Seatbelt supportability and process-tree boundary are resolved enough for an architecture decision."
    evidence_required: "Report states what mechanism is available, what is unsupported/deprecated/unknown, and whether children/PTY/subprocesses inherit the intended boundary."
  - id: AC-3
    requirement: "Workspace alternatives are compared rather than assuming one implementation."
    evidence_required: "At least three strategies are assessed; creation/disk/cleanup/publication trade-offs are measured where practical."
  - id: AC-4
    requirement: "Security, garbage, time, simplicity, and quality claims are evidence-based."
    evidence_required: "Each claimed benefit has measurement, current-code evidence, or explicit inference with limitations."
  - id: AC-5
    requirement: "Technical debt and failure modes are explicit."
    evidence_required: "Report covers API/macOS coupling, policy maintenance, cleanup risk, cold-cache cost, debugging, loss of WIP, Git metadata/residue, and operator recovery."
  - id: AC-6
    requirement: "The proposed lifecycle has a precise deletion boundary."
    evidence_required: "Report defines success publication, publication failure, normal failure, crash/reboot, orphan detection, and when deletion is safe."
  - id: AC-7
    requirement: "Research remains non-invasive and leaves the machine/repo clean."
    evidence_required: "No live Runtime lifecycle/config mutation; all synthetic artifacts removed; only report artifact is committed/pushed."
  - id: AC-8
    requirement: "Recommendation is minimal and falsifiable."
    evidence_required: "If recommended, next slice is small enough to implement/test independently and includes rollback/rejection criteria; if not recommended, report names the blocking debt or missing capability."

