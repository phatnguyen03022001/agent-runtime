acceptance_criteria:
  - id: AC-1
    requirement: "Telemetry is optional, default-off and operationally non-authoritative."
    evidence_required: "Disabled tests prove no SDK/exporter/network initialization; enabled exporter failures/collector absence cannot alter tool/process outcomes, health/readiness or cleanup."
  - id: AC-2
    requirement: "Telemetry exports only fixed privacy-safe low-cardinality semantics."
    evidence_required: "Tests inspect spans/metric points and prove only authorized attributes; secret/argv/path/cwd/args/results/stdout/stderr/error-text sentinels never appear."
  - id: AC-3
    requirement: "Existing timing correlation is reused rather than replaced."
    evidence_required: "MCP request/tool/process events remain behavior-compatible; runtime_call_id correlates traces but never metric labels; timing tool allowlist exactly matches twenty advertised tools."
  - id: AC-4
    requirement: "Metrics/traces cover the execution signals needed for future survival work."
    evidence_required: "Deterministic tests prove request counts/durations, tool outcomes, process completion/termination state and request/process trace lifetimes including terminal_start returning before process end."
  - id: AC-5
    requirement: "Canonical configuration and production topology stay bounded."
    evidence_required: "runtime.env/start accept off|otlp only; otlp fixed to 127.0.0.1:4318; collector/backend not started by Runtime; dependency lock fully hashed; docs show optional external collector topology."
  - id: AC-6
    requirement: "Exact candidate is canonically verified and published without live activation."
    evidence_required: "Focused PASS, git diff --check, canonical ./verify PASS on exact candidate, Runtime 0.4.0/Kernel2/21-known/20-advertised unchanged, report-only child, installed activation unchanged, NEEDS_REVIEW."

