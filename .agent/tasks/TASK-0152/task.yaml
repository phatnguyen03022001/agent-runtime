invariants:
  - "Runtime source remains 0.4.0; ToolContract Kernel remains 2."
  - "Known capabilities remain 21; advertised MCP tools remain exactly 20."
  - "No public ToolContract/schema changes."
  - "Telemetry disabled by default and never required for Runtime correctness/readiness."
  - "No user payload, command/file/repository content, secrets or high-cardinality identifiers enter metrics."
  - "Existing timing JSON stderr events remain bounded and behavior-compatible."
  - "OTLP network authority is telemetry-only, loopback-only and absent when mode=off."
  - "Collector/Prometheus/Grafana lifecycle is external to Runtime."
  - "No OpenTelemetry logs signal in TASK-0152."
  - "No GAP-12 MCP Tasks or GAP-13 durable-execution implementation."
  - "No package/install/cutover or plugin reload."

forbidden_changes:
  - "Any new MCP/public capability or tool."
  - "Any tool schema/result/failure/effect semantic change."
  - "Any payload/content/error-message/argv/path/cwd/result/stdout/stderr telemetry export."
  - "Any arbitrary OTLP endpoint, exporter headers, auth secret or remote-network telemetry configuration."
  - "Any synchronous exporter call on MCP/process critical paths."
  - "Any mandatory collector/backend dependency."
  - "Any bundled Collector, Prometheus, Grafana, Loki, Tempo or dashboard service."
  - "Any auto-instrumentation/monkey-patching."
  - "Any durable process/task supervisor, restart reattachment or MCP Tasks implementation."
  - "Any Runtime version/Kernel bump, install/restart/cutover, branch/PR/force-push/tag/release."

