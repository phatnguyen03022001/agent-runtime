structure_authority:
  status: RESOLVED
  source: "Existing timing middleware + one optional telemetry adapter"
  rationale: "Observability must reuse accepted TimingContext/events. Add no MCP tool and no second event pipeline. Telemetry is an optional sink over the existing bounded event model, not a new execution/control subsystem."

objective: "Add a low-overhead, privacy-preserving, optional OpenTelemetry traces+metrics substrate over the existing timing events so Runtime behavior can be measured during long executions and future restart-chaos work without changing tool semantics, exposing user payloads, or requiring Prometheus/Grafana/Collector inside Agent Runtime."

scope:
  required_changes:
    - "Create one optional telemetry adapter owned by agent_runtime/telemetry.py and integrate it with existing agent_runtime/timing.py. Existing bounded JSON stderr diagnostics remain authoritative and must continue even when telemetry is disabled or exporter initialization/export fails."
    - "Do not add a public MCP tool, capability descriptor or advertised surface. Known capabilities remain 21; advertised tools remain 20; ToolContract Kernel remains 2; source Runtime version remains 0.4.0."
    - "Telemetry is disabled by default. Disabled mode must not initialize an OpenTelemetry SDK provider, exporter thread, network client or collector connection."
    - "Enable telemetry only through canonical Runtime configuration with one bounded mode field: AGENT_RUNTIME_TELEMETRY=off|otlp, default off. Do not accept arbitrary exporter URL, headers, auth tokens, service names, resource attributes or user-supplied labels in this task."
    - "OTLP mode exports only to fixed loopback OTLP/HTTP endpoint http://127.0.0.1:4318 using standard OpenTelemetry Python SDK/exporter packages. The local Collector is external/operator-managed and optional. Agent Runtime must not install, launch, supervise or configure Collector, Prometheus or Grafana."
    - "Add only the minimum pinned OpenTelemetry dependencies required for manual traces/metrics plus OTLP/HTTP export. Prefer versions matching the already locked opentelemetry-api line. All new direct/transitive dependencies must be fully hash-locked for canonical CPython/macOS packaging."
    - "Do not use auto-instrumentation. Manual instrumentation only. Do not monkey-patch subprocess, HTTP, MCP, logging or standard libraries."
    - "OpenTelemetry logs are explicitly out of scope because the current Python logs signal is not treated as stable authority for this task. Keep existing bounded JSON stderr events as the log-like diagnostic stream."
    - "Exported telemetry MUST NOT include argv, command strings, cwd/path/file names, repository URLs, request arguments, results, stdout/stderr content, exception messages, environment variables, Git identity, API keys/tokens, runtime.env values, raw_request_id, session_id, start_identity or continuation receipts."
    - "Allowed exported attributes are fixed low-cardinality values only: service.name='agent-runtime', runtime.version, runtime.revision when available, tool.name from the static advertised-tool allowlist, outcome, process.kind and termination.state from bounded enums. runtime_call_id may be used only as trace correlation, never as a metric attribute."
    - "Converge timing.py tool-name allowlisting with the exact twenty advertised tool names without importing capability_registry in a way that creates cycles. Add a regression that the timing allowlist equals the advertised surface at source import/test time."
    - "Metrics must be fixed-name and low-cardinality. Minimum set: MCP requests total by tool/outcome; MCP request duration histogram by tool/outcome; tool executions total by tool/outcome; process completions total by tool/process_kind/termination_state. Do not place runtime_call_id or any user-derived value in metric labels."
    - "Traces must represent tools/call request lifetime and retained process lifetime where an accepted TimingContext exists. A terminal_start request may finish before its spawned process; process lifetime tracing may remain open only while the already-bounded Runtime session/process record exists. No new unbounded trace registry."
    - "Exporter behavior is fail-open relative to Runtime operations: exporter initialization, queue saturation, collector absence, timeout or export error must never change tool result/effect, process lifecycle, admission, cleanup or server readiness."
    - "Use bounded asynchronous batching from the OpenTelemetry SDK. Do not perform synchronous network export on the tool request/process cleanup path. Fix queue/batch/export timeout constants in source; do not add a configuration matrix in v1."
    - "Collector absence in otlp mode must not make healthz/readyz fail. Doctor may report telemetry mode/config validity as informational evidence but must not require a live collector to declare Runtime healthy."
    - "Canonical runtime.env validation/start.sh installed serve must accept and propagate only AGENT_RUNTIME_TELEMETRY=off|otlp. Unknown value fails before Runtime start. The setting contains no secret and may be included in bounded doctor evidence as the mode only."
    - "Add deterministic tests using in-memory/fake span/metric exporters. Tests must prove correlation, low-cardinality attribute allowlist, no payload leakage, exporter failure isolation, disabled zero-export behavior, bounded process-span lifetime, and no tool-surface/schema change."
    - "Add a lightweight performance guard: telemetry disabled must add no measurable exporter/network work and preserve current timing behavior; enabled instrumentation test must remain bounded without sleeps or external collector dependency. Do not establish a brittle wall-clock microbenchmark as a release gate."
    - "Document the production topology succinctly: Agent Runtime -> optional OTLP/HTTP loopback Collector -> optional Prometheus/Grafana/other backend. Grafana/Prometheus are not Runtime dependencies and are not required for Runtime operation."
    - "Do not package/install/restart/reload/cutover Runtime in TASK-0152. Installed Runtime remains accepted 0.4.0 at activation revision cf6aba7e9ca22bf5f0c1202ed7b6ac40433053b0 until a later convergence/cutover task."
    - "After focused PASS, commit one coherent implementation candidate, run canonical ./verify on that exact clean candidate, fresh-reconcile remote main, publish exact verified candidate non-force, publish report-r1.yaml as sole report-only child, and stop NEEDS_REVIEW."

  allowed_existing_files_or_components:
