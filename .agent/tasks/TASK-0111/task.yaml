objective: "Repair the exact Swift↔Python screen_capture wire-contract bug for display/region targets by emitting explicit null keys for nullable-required metadata fields, add regression coverage, run canonical verification once, and package/sign/freeze one new immutable candidate. Do not install or activate it."

root_cause:
  classification: "OPTIONAL_NIL_JSON_KEY_OMISSION"
  evidence:
    - "Swift resolveDisplay() sets windowID=nil and capturedApplication=nil for display and region targets."
    - "Synthesized Codable omits Optional nil keys from JSON."
    - "Python ScreenCaptureMetadata declares window_id: int | None and captured_application: ScreenCaptureApplication | None without defaults, therefore nullable but required."
    - "ScreenCaptureMetadata.model_validate(header) rejects missing keys and returns CAPTURE_PROTOCOL_ERROR invalid screen capture metadata."
    - "Window-based targets serialize both keys because values are non-nil."
    - "Existing Swift wire test covers only non-nil window metadata and therefore misses this contract."
  platform_block_indicated: false
  production_png_path_indicated: true

required_fix:
  - "Preserve the Python ScreenCaptureMetadata contract exactly; do not weaken required nullable fields by adding defaults."
  - "Implement explicit Swift encoding for ScreenCaptureMetadata so window_id and captured_application are always present in the JSON object, using JSON null when nil."
  - "Preserve existing snake_case wire names, all other fields, ordering irrelevance, framing, PNG bytes and bounded header behavior."
  - "Do not change public MCP tool name, input schema, output_schema=None, media-first ImageContent+TextContent result shape or target semantics."

required_tests:
  - "Add Swift wire regression proving display-style metadata with windowID=nil and capturedApplication=nil serializes both keys explicitly as JSON null."
  - "Add or extend Python/native integration regression so display and region framed metadata with explicit null keys validates successfully."
  - "Preserve existing window/frontmost/application capture tests."
  - "Require no regression in media-first ImageContent first, TextContent metadata second contract."

