blocking_findings:
  - id: B-0180-001
    severity: BLOCKING
    summary: "The immutable-substrate/external-payload architecture passed v1 execution, but the disposable native helper did not own termination of its long-running bundled-Python child. launchctl bootout removed the helper while Python survived as PPID 1, so the task correctly stopped before pointer=v2."
    required_authority: "TASK-0180 revision 2 must keep the same architecture and repeat qualification with a helper that owns the Python child process group and performs bounded signal-forwarding, wait, and forced cleanup before exiting."

acceptance_basis:
  - "Fresh review resolution proves HEAD, origin/main, and remote main at exact report commit 2f69dfc5f8f6b008cb83143de25208e2b8f6df52 with a clean main worktree."
  - "The reviewed report is the sole child of revision-1 execution base 79076a166575be3225b0c9214f30edec7d876699; its only tracked change is report-r1.yaml, pinned Foundation report validation passes, and git diff --check passes."
  - "Revision 1 establishes the central architecture predicate rather than failing it: one frozen TeamIdentifier-free ad-hoc substrate loaded quarantined external content-addressed first-party Python payload v1, imported agent_runtime from outside the app, and exposed the exact 20-tool surface while helper/Python/substrate hashes stayed frozen."
  - "The blocker occurred only at the mandatory v1 shutdown boundary. Exact evidence shows launchctl bootout removed the service, helper PID 63510 terminated, and child Python PID 63515 remained alive as PPID 1."
  - "No release-pointer mutation or v2 bootstrap occurred after the failed shutdown gate, and the orphan child was cleaned only after exact identity reconciliation. No product/test/doc/dependency/canonical-verify/real-candidate/production consequence occurred."
  - "This is a fixture lifecycle-ownership defect, not a Gatekeeper or external-payload rejection. A native supervisor can own its spawned Python generation by placing the child in a dedicated process group, forwarding termination to that group, waiting boundedly for child exit, escalating only the exact owned group if necessary, and reaping the child before the supervisor exits."
  - "The repository already uses bounded process-group termination patterns in agent_runtime/executor.py and durable execution code; revision 2 should reuse that ownership principle in the disposable helper rather than invent another lifecycle architecture."
  - "A corrected qualification must still require helper and Python both absent before pointer mutation, so no stale generation can execute after v2 selection."

