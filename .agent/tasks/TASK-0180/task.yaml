invariants:
  - "The substrate app/helper/bootstrap/Python/third-party/native dependency bytes are identical for v1 and v2 payload execution."
  - "Ordinary payloads are pure first-party Python only."
  - "Exactly one manual substrate approval is allowed; payload v2 must run with zero additional approval."
  - "External payload selection is content-addressed and fail-closed."
  - "Payload updates do not modify the app bundle."
  - "No product mutation occurs in TASK-0180."
  - "MAIN_ONLY topology remains unchanged."

forbidden_changes:
  - "Replacing or modifying the substrate app between payload v1 and v2."
  - "Putting CPython, native extensions, third-party dependencies, helper binaries, shell scripts, or executable files into the external payload."
  - "Using product Agent Runtime app or TeamIdentifier-signed production bytes as the zero-cost proof substrate."
  - "Using SMAppService or a second operator approval."
  - "Paid Apple distribution authority, custom trust authority, or fake TeamIdentifier."
  - "Product implementation, tracked fixture code, canonical verify, product candidate build, branch, PR, force push, tag, or release."

