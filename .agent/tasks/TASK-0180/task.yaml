structure_authority:
  status: RESOLVED
  source: "One immutable disposable app substrate + one immutable bootstrap + content-addressed external pure-Python release directories"
  rationale: "The experiment isolates the only remaining fast zero-cost update boundary. App/helper/Python/native dependency bytes do not change between v1 and v2; only first-party Python payload bytes and one atomic release pointer change."

objective: "Prove whether one user-approved ad-hoc executable/native substrate can execute multiple quarantined content-addressed first-party Python releases without another Gatekeeper approval. Build one disposable app containing an embedded helper, self-contained CPython 3.13, installed third-party/native dependencies, and an immutable bootstrap. After at most one operator approval, a disposable user LaunchAgent must run the helper; bundled Python must validate and import external quarantined payload v1. Then, without changing any app/substrate byte or requesting another approval, switch only the content-addressed release pointer to quarantined payload v2 and prove the same helper/Python loads v2. This task is qualification-only."

scope:
  required_changes:
    - "Freshly prove clean canonical main at the exact TASK-0180 base, TASK-0179 BLOCKED review ancestry, and zero surviving product mutation."
    - "Create exactly one disposable substrate app identity, one fresh LaunchAgent label, and one fresh disposable application-support root. Never use production Agent Runtime identifiers, paths, config, or lifecycle state."
    - "The disposable substrate app must contain one long-running native helper, one immutable Python bootstrap script, one self-contained CPython 3.13 environment, and the current third-party dependencies needed to import agent_runtime.server. Do not embed the first-party agent_runtime package in the substrate."
    - "Use existing packaging_python.sh/materialization behavior where practical. The fixture may copy read-only bytes from existing local packaging inputs, but must not mutate the installed production app or Runtime."
    - "Ad-hoc sign nested native code, bundled Python/native libraries, and the containing app with stable explicit identifiers/designated requirements. TeamIdentifier must remain absent."
    - "Apply quarantine to the disposable substrate app with the documented Foundation quarantineProperties API and attempt normal app launch. If the host requires manual approval, stop OPERATOR_INPUT_REQUIRED and request exactly one System Settings -> Privacy & Security -> Open Anyway/Open action for this exact disposable substrate app. No second substrate approval is authorized."
    - "After approval, prove the substrate app runs and record its exact main PID/path/hash. The substrate app bytes must then remain immutable for the rest of TASK-0180."
    - "Create payload v1 and payload v2 outside the app under one fresh disposable application-support root. Each payload consists only of regular non-executable first-party Python files copied from current agent_runtime/*.py plus one fixture-only pure-Python release marker. No symlink, executable bit, Mach-O, .so, .dylib, .bundle, copied interpreter, third-party package, shell script, or native extension is allowed in either payload."
    - "Payload v1 and v2 must differ only in pure-Python payload bytes needed to prove generation change. Their third-party/native substrate contract remains identical."
    - "For each payload, compute a deterministic canonical closure over relative path, file mode, and SHA-256. Name the release directory by its 64-hex closure identity and persist a small manifest containing the closure identity plus expected substrate contract facts. The release directory must be immutable after closure."
    - "Apply quarantine using Foundation quarantineProperties to each external release root and its payload files. Do not remove quarantine to make the experiment pass."
    - "The immutable bootstrap inside the approved app must read one exact 64-hex release pointer, resolve only the matching release directory beneath the disposable releases root, reject symlinks/unlisted/native/executable payload members, recompute the canonical closure, verify the manifest/substrate contract, disable bytecode writes, prepend only that release directory to sys.path, import external agent_runtime.server, and import the fixture release marker."
    - "The bootstrap must prove that agent_runtime was imported from the external selected release rather than from the substrate app and must verify the expected 20-tool public surface before entering a bounded long-running state for observation."
    - "Create one disposable traditional user LaunchAgent whose ProgramArguments point only to the immutable embedded helper. The helper may invoke only the immutable bundled Python/bootstrap and must obtain release selection through the external pointer; no app byte may encode v1 versus v2."
    - "With pointer=v1, bootstrap the LaunchAgent and require exact-label state=running, helper PID/path/hash, bundled-Python child PID/path/hash, imported agent_runtime path beneath release v1, exact v1 release marker, exact v1 closure identity, and 20-tool surface witness."
    - "Boot out v1 and require exact-label absence plus helper/Python termination. The substrate app and all substrate bytes must remain unchanged."
    - "Atomically replace only the release pointer with the exact v2 closure identity. Do not modify the app, helper, bootstrap, Python environment, requirements/native dependencies, plist, or LaunchAgent label."
    - "Bootstrap the same disposable LaunchAgent again with no operator approval. Require new helper/Python PIDs, the same immutable executable hashes, imported agent_runtime path beneath release v2, exact v2 release marker, exact v2 closure identity, and the same 20-tool surface witness."
    - "Any Gatekeeper/manual-approval prompt after the one substrate approval, trusted-execution rejection, payload closure mismatch, fallback import from the app, native file in payload, or failure to load v2 returns BLOCKED."
    - "Cleanup must terminate disposable app/helper/Python processes, boot out the disposable LaunchAgent, remove its plist, remove the application-support root and fixture app/run root, and prove all exact disposable process/service/filesystem identities absent. The host's remembered approval record may remain."
    - "No product source/tests/docs/dependencies/package logic, canonical runtime.env, live Runtime, tunnel-client, production lifecycle state, Apple developer authority, tag, release, or repository topology may change."
    - "Do not run canonical ./verify and do not build a real Agent Runtime product candidate."
    - "Create report-r1.yaml only on terminal PASS/BLOCKED. While waiting for the single human approval, preserve the exact fixture and report OPERATOR_INPUT_REQUIRED instead of fabricating a terminal report."

