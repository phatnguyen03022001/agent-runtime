structure_authority:
  status: RESOLVED
  source: "Revision-1 architecture plus corrected disposable helper child ownership"
  rationale: "Do not change architecture. Correct only the supervisor lifecycle defect: the LaunchAgent-owned helper must own, terminate, and reap its bundled-Python child before the helper exits."

objective: "Repeat the immutable-approved-substrate plus external pure-Python v1-to-v2 qualification with one fresh disposable identity and a corrected native helper that durably owns its bundled-Python child process group. Prove v1 external payload execution, clean launchctl bootout with helper and Python both terminated before pointer mutation, atomic pointer switch to v2, v2 external payload execution through byte-identical substrate with no new approval, and clean v2 teardown. No product mutation is authorized."

scope:
  required_changes:
    - "TASK-0180 revision 1 is superseded for execution. Preserve report-r1 and review.yaml as immutable evidence; do not resume or reinterpret the cleaned revision-1 fixture."
    - "Freshly prove revision-2 exact base, revision-1 report/review ancestry, TASK-0179 review ancestry, clean canonical main, and zero surviving product mutation."
    - "Reuse revision-1 evidence only for architecture direction and demonstrated predicates. Revision 2 must use one fresh disposable app/support/LaunchAgent identity because revision-1 fixture state was cleaned."
    - "Recreate the same bounded substrate contract: one ad-hoc app, long-running native helper, immutable bootstrap, self-contained CPython 3.13, current locked third-party/native dependencies, TeamIdentifier absent, stable explicit identifiers/designated requirements, and no embedded first-party agent_runtime package."
    - "The corrected helper must spawn bundled Python as one exact owned child generation in a dedicated process group whose PGID equals the child PID and differs from the helper's process group. Both parent and child may set the child PGID defensively before exec, but ownership must converge before the helper reports healthy state."
    - "The helper must retain the exact child PID and PGID for its generation. It must never discover or kill children by broad name/path scanning as its normal teardown mechanism."
    - "On SIGTERM or SIGINT from launchd, the helper must initiate shutdown of only its owned child process group, forward SIGTERM, and wait boundedly for the exact child to exit. Signal-handler work must remain async-signal-safe; bounded waiting/reaping belongs in normal control flow."
    - "If the exact owned child group does not exit within the bounded graceful interval, the helper may send SIGKILL only to that exact owned PGID, then must reap the exact child before exiting. Record whether escalation was required."
    - "The helper must not report normal exit or terminate itself before its exact child has been reaped or independently proven already absent. Child disappearance by PID reuse ambiguity is not PASS."
    - "No unrelated process may be signaled. Process-group identity and child ancestry must be established before teardown; cleanup fallback after a failed task predicate may use exact command-line binding only as terminal hygiene, not as lifecycle acceptance evidence."
    - "Build two external payload generations with the same revision-1 contract: content-addressed immutable release directories containing only regular non-executable first-party agent_runtime/*.py plus the pure-Python generation marker and manifest. No interpreter, native extension, third-party package, shell script, symlink, or executable payload member."
    - "Validate canonical closure, substrate contract, containment, file modes, quarantine, and exact 20-tool expected surface for both v1 and v2 before execution."
    - "Apply quarantine to the fresh substrate and payload roots with the same documented Foundation API. If the fresh substrate requires human Gatekeeper approval, at most one Open Anyway/Open action is authorized. No approval after substrate acceptance is allowed."
    - "Freeze and record substrate closure plus main/helper/Python/bootstrap/native component hashes before v1 LaunchAgent execution. These exact bytes must remain unchanged through v2."
    - "With release pointer=v1, bootstrap one disposable traditional user LaunchAgent pointing only to the corrected immutable helper. Require exact-label state=running, helper PID/path/hash, bundled-Python child PID/path/hash/PPID/PGID, external agent_runtime import under v1 release, exact v1 closure/marker, and exact 20-tool surface."
    - "Boot out v1. Before any pointer change, require exact label absent, helper PID absent, Python PID absent, exact owned child PGID absent, and no fixture generation process remaining. A surviving/reparented Python child is BLOCKED."
    - "Only after v1 shutdown PASS, atomically replace the single release pointer from exact v1 closure to exact v2 closure. No other app/substrate/plist/support contract byte may change."
    - "Bootstrap the same LaunchAgent contract for v2 with zero additional approval. Require new helper/Python PIDs, the same helper/Python/substrate hashes, external import under v2 release, exact v2 closure/marker, and exact 20-tool surface."
    - "Boot out v2 and require the same full owned-child teardown predicate: label/helper/Python/PGID/generation absent before terminal cleanup."
    - "Any Gatekeeper prompt after substrate acceptance, substrate hash drift, payload validation failure, orphaned child, wrong process group, broad/unowned signal consequence, fallback import from app, or v2 failure returns BLOCKED."
    - "Cleanup all disposable process/service/plist/app/application-support/run-root state. The operating system's remembered trust record may remain; do not reset security databases."
    - "No product source/tests/docs/dependencies/package logic, live Runtime, canonical runtime.env, tunnel-client, production lifecycle state, Apple developer authority, release/tag, or repository topology may change."
    - "Do not run canonical ./verify and do not build a real Agent Runtime product candidate."
    - "Create report-r2.yaml on terminal PASS/BLOCKED. If waiting for the one allowed fresh-substrate human approval, preserve the exact fixture and report OPERATOR_INPUT_REQUIRED instead of serializing a terminal result."

