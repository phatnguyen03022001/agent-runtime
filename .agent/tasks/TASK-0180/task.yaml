acceptance_criteria:
  - id: AC-1
    requirement: "One approved immutable ad-hoc substrate is executable and remains byte-identical throughout qualification."
    evidence_required: "At most one operator approval; exact app/helper/Python/bootstrap/native-substrate identities recorded; no substrate byte changes between v1 and v2 phases."

  - id: AC-2
    requirement: "Quarantined content-addressed pure-Python payload v1 executes through the approved substrate."
    evidence_required: "LaunchAgent/helper/Python exact witnesses plus external agent_runtime import path under release v1, exact closure/marker, and 20-tool surface."

  - id: AC-3
    requirement: "Quarantined content-addressed pure-Python payload v2 executes with no additional approval and no substrate change."
    evidence_required: "Only pointer changes from v1 closure to v2 closure; same helper/Python hashes, new PIDs, external import path under release v2, exact closure/marker, 20-tool surface, and zero new approval prompt."

  - id: AC-4
    requirement: "The payload boundary excludes native/executable drift and fails closed."
    evidence_required: "Both payload inventories contain only permitted regular non-executable Python/manifest files; bootstrap verifies closure/substrate contract and imports no first-party package from the app."

  - id: AC-5
    requirement: "Qualification leaves no disposable execution/filesystem/service residue and no production consequence."
    evidence_required: "Disposable PIDs/label/plist/app/application-support/run-root absent; product/test/doc/dependency/verify/build/production effect counts zero."

  - id: AC-6
    requirement: "Repository closure is report-only."
    evidence_required: "report-r1 validates with pinned Foundation, report-only diff-check passes, publication is non-force after fresh remote CAS proof, and final main is clean/synced."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Build one quarantined immutable ad-hoc substrate with helper/bootstrap/self-contained CPython+dependencies, obtain at most one operator approval, and freeze substrate hashes."
      required: true
    - id: CHECK-2
      command_or_check: "Build/quarantine content-addressed pure-Python payloads v1/v2 and prove their bounded inventories/closures/substrate contract."
      required: true
    - id: CHECK-3
      command_or_check: "Run v1 through one disposable LaunchAgent, boot out, atomically switch only the release pointer, then run v2 through the same immutable substrate with no new approval."
      required: true
    - id: CHECK-4
      command_or_check: "Clean all disposable state, validate report-only closure, publish non-force after fresh remote proof, and reconcile clean main."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

