  expected_files_are_restrictive: true

invariants:
  - "agent-runtime is optional capability, never workflow authority or required dependency."
  - "Plugin/offline absence is normal; fallback to ordinary ChatGPT/GitHub execution requires no runtime-specific ceremony."
  - "The only public MCP tool is terminal_exec."
  - "No shell command string interface, caller-controlled child environment, daemon/autostart, project registry/profile system, sync primitive, verifier state engine, orchestrator, queue, database, sandbox, or policy broker is introduced."
  - "AGENT_RUNTIME_WORKSPACE_ROOT/cwd validation is not described as hard confinement; authority and secret discipline remain behavioral governance outside the runtime."
  - "Tunnel/control-plane secret values are never printed or committed."
  - "Historical .agent/tasks evidence remains immutable."
  - "main remains b52cdc73b0589d9e14adfbb3647fcccdb0ee65ab and branches remain exactly {dev, main}."

forbidden_changes:
  - "Do not restore historical agent_runtime/config.py, git_ops.py, runner.py, state.py behavior or any equivalent project-profile/sync/verify/state architecture."
  - "Do not expose get_head, sync, run_verify, get_last_log, arbitrary environment mutation, interactive stdin/TTY, daemon control, plugin-management, GitHub mutation, or task/governance tools through agent-runtime."
  - "Do not create a command allowlist/denylist framework, per-command governance schema, approval broker, capability registry, filesystem virtualization, container/sandbox layer, orchestration service, shared mutable authority state, or another runtime generation."
  - "Do not hard-code operator secrets, plugin IDs, tunnel credentials, or username-specific absolute paths in tracked source."
  - "Do not read or print existing .env secret values during verification."
  - "Do not mutate main, other repositories, branches, tags, releases, repository metadata, or GitHub repository archive/delete state."
  - "Do not start a long-lived tunnel as part of deterministic verification or leave background processes running."

