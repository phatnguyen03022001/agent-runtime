structure_authority:
  status: RESOLVED
  source: "Current operator objective plus historical foreground tunnel mechanics and accepted subtraction evidence."
  rationale: "The smallest useful responsibility is an optional manually-started local MCP host exposing one generic bounded Terminal execution tool. Reintroducing trusted project profiles, disposable checkout sync, detached verification state, four project-ID tools, orchestration, command-specific governance, or a hard sandbox would recreate complexity not justified by the new trusted-agent objective."

objective: "Restore agent-runtime on dev as a small optional manually-started macOS local plugin host. It exposes one generic terminal_exec capability sufficient for normal local engineering work when ./start.sh is foreground-live, while normal ChatGPT/GitHub execution remains fully valid when the plugin is off. Provide modest mechanical safety without claiming hard filesystem confinement or making agent-runtime an authority/governance root."

scope:
  required_changes:
    - "Replace the retired README tombstone with concise active documentation describing agent-runtime as an optional local accelerator, never a required workflow dependency: operator starts ./start.sh in a foreground Terminal; while that process/tunnel and the existing ChatGPT plugin exposure are live, ChatGPT may use the current source tool surface; when off/unavailable/not useful, ordinary ChatGPT/GitHub Executor capability is the fallback."
    - "Implement exactly one public MCP tool named terminal_exec. Do not restore get_head, sync, run_verify, get_last_log, trusted project profiles, disposable checkout management, verification state/log machinery, or runtime generation/locking systems."
    - "terminal_exec accepts a non-empty argv list of strings, an absolute cwd, and a bounded timeout. Execute argv directly with shell=False; do not accept a shell command string and do not implicitly wrap with sh/bash/zsh."
    - "Require AGENT_RUNTIME_WORKSPACE_ROOT to be an absolute existing directory. terminal_exec cwd must resolve to an existing directory at or below that root. Refuse a cwd outside the root after realpath resolution. This is a cwd/path-selection guard only; document explicitly that arbitrary executable arguments can still access host paths and this is not a mechanical filesystem sandbox."
    - "Launch child commands non-interactively with stdin disconnected, in a dedicated process group/session suitable for bounded timeout cleanup. On timeout, terminate the child process group and return a timeout result; do not leave a detached child intentionally."
    - "Use a minimal child environment rather than inheriting tunnel/runtime secrets wholesale. Preserve only ordinary execution variables needed for local tools (at minimum PATH, HOME, USER, TMPDIR when present, LANG/LC_* when present) plus no CONTROL_PLANE_*, AGENT_RUNTIME_*, token/key/credential variables by default. Do not expose an API for caller-selected environment variables."
    - "Bound stdout/stderr capture and return explicit truncation metadata. Avoid unbounded memory/log growth. Return structured cwd, argv, exit_code, timed_out, stdout, stderr, and truncation signals without manufacturing success."
    - "Mark the generic Terminal tool conservatively in MCP annotations as non-read-only/destructive-capable/open-world when the installed MCP version supports annotations. Do not claim command safety from annotations."
    - "Restore a minimal macOS install/start surface. ./start.sh remains foreground and execs tunnel-client run for the configured profile; no daemon, LaunchAgent, background service, autostart, watcher, scheduler, or automatic restart is authorized."
    - "install.sh may prepare only the primary checkout .venv, Python dependency, ignored .env, and exact agent-runtime tunnel-client profile needed to launch the current MCP server. It may reuse the existing CONTROL_PLANE_API_KEY / CONTROL_PLANE_TUNNEL_ID from operator-supplied environment or existing .env without printing literal values. It must derive AGENT_RUNTIME_WORKSPACE_ROOT from the parent directory of the exact bound checkout and set the agent-runtime tunnel profile to execute the current .venv Python module."
    - "Do not recreate ~/.config/agent-runtime, ~/.local/state/agent-runtime, ~/.local/share/agent-runtime, trusted TOML project profiles, disposable verification checkouts, or old runtime state/log files."
    - "Preserve all existing .agent/tasks/** historical evidence byte-for-byte except TASK-0011 task/report and later Architect review. Preserve LICENSE."
    - "Add focused deterministic tests for exact one-tool public surface, argv validation, workspace-root/cwd realpath guard, shell=False/direct argv semantics, minimal environment stripping, non-interactive execution, output bounds, timeout/process cleanup, and foreground start/install structure where feasible without requiring a live tunnel/control-plane secret."
    - "Provide a root verify entry point that runs the focused test suite and cheap compile/static checks. Verification must not require live tunnel credentials or a live ChatGPT plugin."
    - "After implementation verification, publish TASK-0011/report.yaml as a separate report-only commit and stop at Governing Architect review. Do not promote main in this task."

  allowed_existing_files_or_components:
    - .agent/tasks/**
    - LICENSE
    - README.md
    - .gitignore
    - .env.example
    - agent_runtime/**
