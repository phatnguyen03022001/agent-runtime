acceptance_criteria:
  - id: AC-1
    requirement: "Fresh preflight proves exact execution base/dev, one worktree, clean repo, no concurrent writer/Git lock, exact accepted candidate identity/handoff, predecessor transaction identity, candidate-original immutability, runtime.env/desired-state identities, singleton listener and healthy predecessor."
