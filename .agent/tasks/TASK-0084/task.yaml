  - id: AC-2
    requirement: "The predecessor TASK-0077 transaction is committed exactly once and only after validation."
    evidence_required: "One ./install.sh --commit-cutover invocation returning COMMITTED; predecessor transaction directory absent afterward; predecessor installed app closure unchanged across commit; runtime.env/desired-state unchanged; no lifecycle restart attributable to commit."
  - id: AC-3
    requirement: "The exact accepted successor candidate is installed exactly once through the canonical prebuilt path with no rebuild/re-sign."
    evidence_required: "One ./install.sh --install-prebuilt exact-app exact-handoff invocation; return status PENDING; no second install; immutable source candidate pre/post closure identical."
  - id: AC-4
    requirement: "The newly installed generation is bound exactly to the accepted candidate and a valid new schema-5 PENDING / APP_SWAPPED transaction."
    evidence_required: "Installed validate-candidate PASS against successor transaction handoff; candidate SHA/source revision/source tree/requirements lock equal TASK-0083 accepted identities; new transaction status/phase exact; rollback previous-app evidence present and valid."
  - id: AC-5
    requirement: "Post-install control-plane health is minimally healthy without claiming direct MCP acceptance."
    evidence_required: "Exactly one port-8080 listener, healthz=200, readyz=200, installed Runtime process/service ownership consistent with the installed app; no direct MCP semantic acceptance claim."
  - id: AC-6
    requirement: "No unauthorized lifecycle/repository/filesystem mutation occurs."
    evidence_required: "runtime.env/desired-state unchanged; old forensic candidates and accepted source candidate unchanged; exactly one target worktree/dev branch; no sibling repo/out-of-repo task artifacts; main unchanged."
  - id: AC-7
    requirement: "The task stops with the successor transaction still PENDING for independent direct MCP acceptance."
    evidence_required: "New transaction directory exists at final checkpoint, schema 5 / PENDING / APP_SWAPPED; successor commit-cutover count=0; rollback/resume/recover counts=0; report-only tracked delta."

