structure_authority:
  status: RESOLVED
  source: "Existing TerminalSessionManager completed-session lifecycle and its focused terminal-session tests"
  rationale: "The smallest sufficient correction stays inside the existing in-memory session manager and test module. It creates no new lifecycle owner, storage, public API, or service boundary."

objective: "Mechanically bound aggregate retained completed-session state after natural persistent-session exit, while preserving recent post-exit inspection and every existing active-session, process-group/PTY cleanup, output-bound, signal-cleanup, and public-MCP-surface guarantee."

scope:
  required_changes:
    - "Fresh-bind TASK-0025 revision 1 at its exact handoff base; fresh-resolve GitHub dev/main, current selected runtime authority, TASK-0024 accepted review, current locked protocol, clean target state, and required native EXECUTION capability before mutation."
    - "Reproduce the completed-session defect before implementation: create many naturally exited persistent sessions, prove active count returns to zero, observe retained completed-record cardinality, test repeated exited-session polling with controlled time, and distinguish retained metadata/output from live process or PTY leakage."
    - "Add a deterministic regression boundary before the production correction. It must fail on the exact base for the missing aggregate bound, then prove that any number of sequential natural exits leaves at most one fixed finite completed-session retention bound selected by the Executor within the existing manager."
    - "Implement the smallest local in-memory correction in the existing TerminalSessionManager. Retained recent exited sessions remain pollable; a record evicted by the completed-state bound fails truthfully as unknown or expired; polling an exited record cannot defeat the aggregate cardinality bound."
    - "Preserve MAX_ACTIVE_SESSIONS behavior, natural-exit process-group and PTY reclamation, explicit terminate, idempotent shutdown, SIGTERM/SIGINT runtime cleanup, bounded retained/poll output, and exactly four public MCP tools."
    - "Run focused regressions and repository-native verification. An ignored checkout-local virtual environment using the unmodified existing requirements may be provisioned only if necessary for native verification; do not alter dependency manifests or publish environment artifacts."
    - "Validate the actual report, publish the source candidate and report-only direct child non-force to dev, fresh-prove remote candidate/report lineage and unchanged main, then stop at NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "agent_runtime/session.py"
    - "tests/test_terminal_session.py"
    - ".agent/tasks/TASK-0025/report.yaml"
  expected_files_are_restrictive: true

invariants:
  - "Persistent-session state remains memory-only inside the existing TerminalSessionManager; no database, file persistence, registry, cache, queue, scheduler, daemon, supervisor, service, or recovery mechanism is introduced."
  - "The public MCP surface remains exactly terminal_exec, terminal_start, terminal_poll, and terminal_control, with no API or signature change."
  - "MAX_ACTIVE_SESSIONS remains exactly three active sessions; completed-state retention must not affect active-session admission."
  - "Natural exit, explicit terminate, idle reap, shutdown, SIGTERM, and SIGINT retain existing process-group and PTY cleanup semantics; no live child, process group, or PTY leak is reclassified as completed-state retention."
  - "MAX_RETAINED_OUTPUT_BYTES and MAX_POLL_OUTPUT_BYTES behavior remains bounded and truthful."
  - "No dependency, requirements, workflow, branch, main ref, tag, release, repository metadata, authority lock, or sibling repository is mutated."

forbidden_changes:
  - "Do not add persistence, a database, files, a registry, a cache service, a queue, a scheduler, a daemon, a supervisor, a workflow engine, or a new top-level/component boundary."
  - "Do not broaden the MCP public tool surface or alter terminal tool signatures, workspace checks, literal argv behavior, child environment filtering, output limits, or process-group cleanup failure handling."
  - "Do not modify agent_runtime/server.py, agent_runtime/executor.py, requirements.txt, install.sh, start.sh, verify, prior task/report/review artifacts, or any file outside the restrictive allowed list."
  - "Do not force-push, rewrite history, create a branch, promote main, create a tag/release, mutate rulesets or repository metadata, or modify support repositories."

