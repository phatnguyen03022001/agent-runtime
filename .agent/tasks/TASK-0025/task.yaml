acceptance_criteria:
  - id: AC-1
    requirement: "Aggregate completed-session retention has one explicit fixed finite cardinality bound enforced by the existing in-memory manager, independent of the number of sequential natural exits."
    evidence_required: "Focused deterministic regression creates substantially more natural exits than the fixed bound, proves no active sessions remain, and proves retained completed records never exceed that bound."
  - id: AC-2
    requirement: "Completed-session post-exit inspection remains useful while a record is retained, and evicted record IDs fail truthfully without keeping aggregate metadata unbounded."
    evidence_required: "Focused regression proves a recent exit is pollable with its exit result, a deterministically evicted ID returns unknown-or-expired behavior, and repeated polling of exited sessions cannot defeat the completed-record cardinality bound."
  - id: AC-3
    requirement: "The correction preserves active admission, process/PTY reclamation, output bounds, explicit termination, shutdown, and runtime SIGTERM/SIGINT cleanup behavior."
    evidence_required: "Focused affected tests plus repository-native verification cover MAX_ACTIVE_SESSIONS, natural exit, output retention, explicit terminate, idempotent shutdown, and both runtime signal cases."
  - id: AC-4
    requirement: "The public MCP surface and dependency/persistence boundaries remain unchanged."
    evidence_required: "Repository-native surface checks, exact candidate diff proof, unchanged dependency-manifest proof, and source inspection show exactly four tools and no new persistence or service boundary."
  - id: AC-5
    requirement: "The candidate and evidence publication are bounded and reconstructible."
    evidence_required: "Task/report YAML validation, candidate/report-only direct-child lineage, git diff check, non-force dev publication, and fresh remote dev/main proof."

