      command_or_check: "If AC-1 passes, implement the single user-LaunchAgent lifecycle plus zero-cost provenance/migration changes and run focused affected tests; otherwise stop BLOCKED."
      required: true
    - id: CHECK-3
      command_or_check: "Run relevant Swift tests, Python focused suites, git diff --check, then canonical ./verify at most once on immutable final source through the TASK-0175 clean carrier."
