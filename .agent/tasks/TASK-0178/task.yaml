invariants:
  - "Distribution remains zero-cost: no Apple Developer Program, Developer ID, notarization, notarytool, stapling, paid signing service, Personal Team reprovisioning, or consumer Apple developer credential."
  - "TASK-0177 closes the SMAppService plus ad-hoc current lifecycle path. TASK-0178 may use SMAppService only to migrate/rollback an already-installed accepted predecessor, never as the new normal lifecycle."
  - "The current Runtime lifecycle has exactly one authority: a per-user launchd LaunchAgent owned by Agent Runtime."
  - "No root/sudo/system LaunchDaemon or privileged helper is introduced."
  - "Native onboarding config, canonical runtime.env, tunnel identity, desired-state semantics, transactionality, readiness, doctor, rollback/recovery, and the 20-tool public surface remain intact."
  - "No fake TeamIdentifier or Apple publisher-authentication claim is permitted for ad-hoc zero-cost artifacts."
  - "Same-UID threat-model limitations remain explicit and are not weakened by claims of protection that a user-writable LaunchAgent plist cannot provide."
  - "No production Runtime/ServiceManagement/LaunchAgent/config/tunnel/Apple/trust-root/tag/release state is mutated during qualification."
  - "MAIN_ONLY topology remains unchanged."

forbidden_changes:
  - "Any fourth SMAppService/ad-hoc viability probe or normal-product SMAppService fallback."
  - "Developer ID, notarization, stapling, paid Apple membership, Personal Team distribution, consumer developer credentials, custom CA/trust root, or fake TeamIdentifier."
  - "System LaunchDaemon, sudo/root installation, privileged helper, daemon architecture, second updater/installer/state machine, or parallel lifecycle."
  - "AssociatedBundleIdentifiers used to imply app responsibility when signing identity requirements are not satisfied."
  - "Global Gatekeeper disable, quarantine removal as supported flow, or AMFI/security bypass."
  - "Production Runtime/config/tunnel/SMAppService/user-LaunchAgent mutation during TASK-0178."
  - "MCP surface/kernel/capability/tunnel architecture changes unrelated to lifecycle migration."
  - "Branch creation, PR, force push, amend, squash, tag, public release, or unrelated cleanup."

