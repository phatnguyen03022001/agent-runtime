structure_authority:
  status: RESOLVED
  source: "Existing candidate_cutover.py legacy LaunchAgent machinery + AgentRuntimeRuntimeService + install_release.sh + native onboarding flow"
  rationale: "Replace only the lifecycle authority that is incompatible with zero-cost distribution. Use one canonical per-user LaunchAgent contract, not SMAppService plus fallback. Preserve old SMAppService code only as bounded predecessor migration/rollback compatibility where required."

objective: "Replace the blocked zero-cost SMAppService lifecycle with one zero-cost per-user launchd LaunchAgent lifecycle that runs the existing Runtime service helper from the installed app, preserves transactional cutover/rollback/recovery/config/readiness/doctor semantics, and requires no Apple developer authority. First prove on the current host that a fresh non-production ad-hoc native helper launched through a traditional user LaunchAgent can execute, remain running, be booted out, be replaced by byte-distinct v2, and launch again without the SMAppService AMFI constraint. Only after that gate passes, evolve Agent Runtime to the new single lifecycle, redesign zero-cost package provenance truthfully, qualify the final source, and freeze one immutable local prebuilt artifact for Fresh-Install Acceptance."

scope:
  required_changes:
    - "Freshly prove clean canonical main at the exact TASK-0178 base, TASK-0177 BLOCKED review 5c2fbf360dea00e0fc115fde6c43b9de329890fd ancestry, and accepted TASK-0175 onboarding authority before any effect."
    - "TASK-0177 is terminal history. Do not run a fourth SMAppService/ad-hoc probe and do not treat registration success as launch viability."
    - "Before product mutation, execute exactly one disposable direct user-LaunchAgent probe with fresh identifiers. The probe must use a unique plist under the current user's Library/LaunchAgents directory and an ad-hoc-signed long-running native helper under ignored build output; it must not use SMAppService, BundleProgram, production labels, production app paths, or production configuration."
    - "The disposable plist must use ProgramArguments with the absolute helper path, a unique Label, and only the minimum lifecycle keys needed to model the Runtime job. Do not use AssociatedBundleIdentifiers as a fake responsibility binding; zero-cost ad-hoc code has no TeamIdentifier to satisfy Apple's reliable attribution contract."
    - "Record v1 helper SHA-256 and code-signing facts, bootstrap the exact plist into gui/<uid>, and prove exact-label launchd state=running with a concrete PID. Resolve that PID to the exact helper path and re-hash the helper to the v1 SHA-256."
    - "Boot out v1, require exact-label absence and PID termination, replace the helper bytes with byte-distinct v2 at the same path, record v2 SHA-256 != v1, bootstrap the same plist again, and prove state=running + new PID + exact path + v2 SHA-256."
    - "The direct LaunchAgent proof must explicitly distinguish the TASK-0177 SMAppService failure: absence of AMFI Launch Constraint Violation for the disposable direct-launchd helper is required. Any CODESIGNING/AMFI rejection, failure to reach running state, failure to bootout/rebootstrap, or cleanup failure returns BLOCKED before product mutation."
    - "Cleanup must boot out the disposable service, prove label/PIDs absent, remove the disposable plist from ~/Library/LaunchAgents, remove all run-owned build files, and leave no active disposable job. Read-only Background Task Management residue/history may be recorded but must not be reset or globally mutated to manufacture cleanliness."
    - "If and only if the direct user-LaunchAgent gate passes, make it the sole current Runtime lifecycle authority. Normal current-product behavior must not register mainApp or Runtime through SMAppService and must not keep an SMAppService fallback."
    - "Keep Agent Runtime.app as the user-launched native setup/control surface. The Runtime background service alone is persisted through the per-user LaunchAgent; the menu-bar app need not auto-launch at login for Runtime health."
    - "Use one canonical current LaunchAgent label and one plist in ~/Library/LaunchAgents. Prefer reuse of the already-owned historical Runtime label/mechanics when that minimizes migration and remains unambiguous; do not introduce multiple current labels."
    - "The current LaunchAgent plist must use ProgramArguments with the absolute installed AgentRuntimeRuntimeService path. Preserve the existing helper's supervision of runtime/start.sh --serve, tunnel-client discovery, canonical runtime.env, desired-state marker, and SIGTERM behavior unless direct evidence requires a smaller equivalent change."
    - "Preserve fail-closed ownership: current plist must be a regular non-symlink file with exact expected Label/ProgramArguments and restrictive owner-controlled mode; launchd service identity must resolve to the exact installed helper path; candidate/cutover logic must reject foreign or ambiguous same-label jobs before mutation."
    - "Same-UID security semantics remain explicit: a malicious process running as the same user is outside the protection boundary already documented by Agent Runtime. Moving the plist into ~/Library/LaunchAgents must not be described as privilege isolation."
    - "Migrate accepted installed SMAppService predecessors transactionally. Before app swap, use the predecessor app's supported ServiceManagement commands to unregister predecessor Runtime/main-app registrations as required; snapshot enough state for rollback; after swap, install/bootstrap the new user LaunchAgent. If the transaction fails, restore the previous app and previous lifecycle ownership exactly enough to return to the proven predecessor state."
    - "Historical direct LaunchAgent predecessors and current SMAppService predecessors must remain distinguishable. Version the service-management/lifecycle contract rather than silently reinterpreting split-v1."
    - "Remove SMAppService registration from the new normal onboarding/install/cutover path. Swift ServiceManagement code may remain only where needed for bounded migration/unregister compatibility; stale current-product Background Activity instructions must be removed or rewritten."
    - "Evolve zero-cost package provenance without fake TeamIdentifier. New candidates must record a truthful zero-cost signing mode and exact artifact/source/closure identity. Strict ad-hoc code-signature validation may be used only as sealing/integrity evidence, never Apple publisher authentication."
    - "Legacy candidates with real TeamIdentifier remain validated under their historical schema/rules. New zero-cost candidates use a versioned schema that does not require or fabricate TeamIdentifier. Cutover/rollback validates each generation under the identity contract actually recorded for it."
    - "Candidate closure, external handoff, source revision/tree, requirements-lock identity, Runtime manifest, responsible executable paths, and tamper rejection remain fail-closed. A modified plist/helper/app/handoff must not pass by relying only on label or bundle identifier."
    - "Replace the active paid Developer-ID/notarization/stapling package path with one zero-cost prebuilt path. Remove active AGENT_RUNTIME_CODESIGN_IDENTITY dependence from the supported prebuilt flow. Preserve TASK-0172/TASK-0173 historical artifacts unchanged."
    - "The final package must require no checkout, host CPython 3.13, Xcode/Swift, local signing identity, Apple developer credentials, notary profile, custom trust root, or periodic reprovisioning on the consumer Mac."
    - "Document the truthful consumer flow: download/extract complete app+handoff bundle, perform only bounded Gatekeeper Open/Open Anyway if required, launch Agent Runtime manually, complete API key/tunnel/Git/workspace setup, install/bootstrap the per-user Runtime LaunchAgent, and reach readiness + healthy doctor. Background Items UI may display the executable rather than trusted app attribution under zero-cost signing; do not claim otherwise."
    - "Do not instruct global Gatekeeper disable, quarantine stripping, custom certificate trust, sudo/system LaunchDaemon installation, or manual launchctl commands as the normal consumer workflow."
    - "Update uninstall/recovery so the current user LaunchAgent is booted out and its owned plist removed safely; preserve rollback/recovery invariants and reject foreign same-label ownership."
    - "Add focused regression coverage for direct LaunchAgent install/bootstrap/bootout/identity, migration from split-v1 SMAppService, legacy rollback, zero-cost provenance schema, no-fake-TeamIdentifier behavior, uninstall/recovery, onboarding, readiness, doctor, and tunnel identity."
    - "Run relevant Swift and Python focused suites. Reuse unaffected TASK-0175 evidence only where exact bytes/predicates remain equivalent."
    - "Run canonical ./verify at most once on the immutable final source candidate through a direct local non-Agent-Runtime-durable carrier consistent with TASK-0175."
    - "After final source qualification, build at most one real zero-cost candidate and one complete archive containing Agent Runtime.app plus Agent Runtime.candidate.json. Do not install or activate that real candidate against the production Runtime in TASK-0178."
    - "Independently record/revalidate exact final source revision/tree, signing mode, candidate closure SHA-256, handoff SHA-256, archive SHA-256, Runtime manifest identity, current lifecycle contract, and exact local artifact paths."
    - "Do not publish a GitHub Release or create a tag. Keep the immutable artifact locally under ignored build output for the next Fresh-Install Acceptance task."
    - "On complete PASS create report-r1.yaml and stop NEEDS_REVIEW. On any failed viability/security/lifecycle predicate stop BLOCKED without falling back to SMAppService, paid signing, system daemons, or a second lifecycle."

