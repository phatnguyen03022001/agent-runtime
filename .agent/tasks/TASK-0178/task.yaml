acceptance_criteria:
  - id: AC-1
    requirement: "Traditional per-user launchd can execute and refresh the selected zero-cost ad-hoc helper contract on the current host without the TASK-0177 SMAppService launch constraint."
    evidence_required: "One disposable ~/Library/LaunchAgents fixture proves v1 running PID/path/hash, bootout+absence, byte-distinct v2 at same path, v2 running new PID/path/hash, no enforcing AMFI Launch Constraint Violation, and full cleanup with zero production identifiers touched."

  - id: AC-2
    requirement: "The new product has exactly one current zero-cost Runtime lifecycle with transactional migration from accepted predecessors."
    evidence_required: "Source/tests prove current installs materialize one owned user LaunchAgent plist using ProgramArguments to the installed Runtime helper; bootstrap/bootout/identity are fail-closed; normal path contains no SMAppService registration; split-v1 predecessor migration and rollback restore correct previous lifecycle ownership."

  - id: AC-3
    requirement: "Zero-cost provenance is truthful and backward-safe."
    evidence_required: "Versioned candidate/handoff validation proves new ad-hoc candidates do not contain/fake TeamIdentifier, preserve exact closure/source/manifest identity and tamper rejection, while legacy real-TeamIdentifier candidates remain validated under historical rules."

  - id: AC-4
    requirement: "Native newcomer setup and operational semantics remain coherent."
    evidence_required: "Setup/install, desired-state, Runtime supervision, tunnel identity, readiness, doctor, uninstall, recovery, and relevant Swift behavior tests PASS with a single LaunchAgent lifecycle; no consumer launchctl/sudo/build/signing credential is required."

  - id: AC-5
    requirement: "Documentation states the actual zero-cost security and macOS UX boundaries."
    evidence_required: "README/INSTALL/RECOVERY/THREAT_MODEL accurately describe manual Gatekeeper approval if required, user LaunchAgent persistence, possible Background Items executable-name attribution under ad-hoc signing, same-UID limits, no notarization/Developer ID trust, and no global security bypass."

  - id: AC-6
    requirement: "The immutable final source is qualified without production consequence."
    evidence_required: "Focused affected Python/Swift suites PASS, git diff --check PASS, canonical ./verify runs at most once via the clean direct-local carrier and PASSes, and all production effect counters remain zero."

  - id: AC-7
    requirement: "One immutable zero-cost prebuilt release artifact is frozen for Fresh-Install Acceptance."
    evidence_required: "Exactly one final real candidate and one complete archive are built after source qualification; report revalidates source revision/tree, zero-cost signing mode, lifecycle contract, manifest, candidate SHA-256, handoff SHA-256, archive SHA-256, and local artifact paths."

