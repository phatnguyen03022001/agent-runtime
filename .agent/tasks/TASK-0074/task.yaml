problem_statement:
  pre_replace_window: >-
    In cutover_candidate(), metadata phase PRE_SWAP is persisted before mutation. If a predecessor app exists, the code
    then removes target_app with shutil.rmtree(). A process death before os.replace(staged, target_app) leaves a valid
    transaction/previous-app snapshot but no installed target. _restore_transaction() currently rejects that PRE_SWAP
    state as "installed app is missing or unsafe" rather than restoring the validated predecessor snapshot.
  post_replace_pre_phase_window: >-
    If os.replace(staged, target_app) succeeds and the process dies before metadata["phase"] = "APP_SWAPPED" is
    durably persisted, the exact sealed candidate is installed while metadata still says PRE_SWAP. Current PRE_SWAP
    restore compares target_app only with the predecessor closure and therefore rejects this second reachable state too.
  scope_boundary: >-
    This is crash-consistency/state-convergence work, not a redesign of lifecycle ownership, ServiceManagement,
    candidate provenance, transaction schema, or public CLI behavior. The correction must preserve fail-closed behavior
    for ambiguous/tampered PRE_SWAP states while allowing only evidence-backed reachable swap interruption states to
    rollback to the exact predecessor.

objective: >-
  Close the PRE_SWAP swap-transition crash window with the smallest schema-5-compatible correction. Deterministically
  reproduce both interruption states on the exact base before production mutation, then make rollback converge to the
  exact predecessor without weakening candidate/rollback closure validation or ServiceManagement compensation. Preserve
  existing transaction schema, public lifecycle commands, candidate provenance, operation-ledger semantics and all
  unrelated Runtime behavior. Publish a report-only child and stop at ARCHITECT_REVIEW. Do not claim final freeze.

scope:
  required_checks:
    - "Fresh-resolve GitHub dev, origin/dev and local HEAD; require the exact TASK-0074 handoff base and a clean designated working tree before mutation."
    - "Read current macos/candidate_cutover.py and tests/test_candidate_cutover.py before editing; inspect install.sh only read-only if needed to confirm rollback command wiring."
    - "TDD RED-1: deterministically simulate process death after predecessor target removal but before staged-candidate placement. Use a test-only interruption that escapes the cutover Exception rollback handler (for example a BaseException/SystemExit-class injection around the exact staged->target os.replace boundary) so persisted state represents a real process interruption rather than an ordinary handled exception. Prove on the unmodified base that metadata remains PRE_SWAP, target_app is absent, the previous-app snapshot remains valid, and canonical rollback cannot converge."
    - "TDD RED-2: deterministically simulate process death after staged-candidate has been moved into target_app but before APP_SWAPPED phase persistence. Prove on the unmodified base that metadata remains PRE_SWAP, target_app validates as the exact transaction candidate, staged-candidate is no longer present, the predecessor snapshot remains valid, and canonical rollback cannot converge."
    - "Record exact RED test names, exact persisted phase/target/staged state, and exact pre-fix failure signals before production-source mutation. If either reachable crash state cannot be reproduced deterministically, STOP at ARCHITECT_REVIEW rather than changing recovery semantics speculatively."
    - "Implement one narrow PRE_SWAP recovery classifier inside the existing rollback path. It must distinguish at minimum: intact predecessor; absent target after removal; exact transaction candidate installed before phase persistence; and ambiguous/unsafe target."
    - "For app_present=true and an absent target, restore only from transaction_dir/previous-app after its closure has already been validated against the rollback envelope. Verify the restored target closure equals expected_closure before any later ownership/state convergence work."
    - "For PRE_SWAP with a target that is not the predecessor, recognize the post-replace/pre-phase state only when the installed target validates as the exact transaction candidate against candidate-handoff.json and the staged-candidate move evidence is consistent with replacement having occurred. Do not treat arbitrary directories, symlinks, tampered candidates, or an ambiguous duplicate staged+installed state as a recoverable swap."
    - "When the exact candidate-installed PRE_SWAP interruption is recognized, rollback must follow the same compensation/restoration safety semantics required after APP_SWAPPED: compensate only transaction-recorded operations, remove only the validated transaction candidate at target, restore the validated predecessor snapshot, restore predecessor files/desired state/loaded state as applicable, and verify final predecessor closure."
    - "Do not create a new transaction schema or public phase unless source evidence proves the current schema cannot safely represent the two interruption states. If that unexpected gap is found, STOP at ARCHITECT_REVIEW for an Architect decision instead of expanding architecture."
    - "Preserve first-install semantics (previous app absent). Do not invent a predecessor when previous.app_present=false. Existing unexpected-target PRE_SWAP states for first install must remain fail-closed."
    - "Preserve PRE_SWAP fail-closed behavior for symlink targets, non-directory targets, wrong predecessor closure, wrong/tampered candidate identity, malformed rollback snapshot, changed transaction paths, and ownership/config/desired-state drift."
    - "Update the existing PRE_SWAP candidate-mismatch regression only as narrowly necessary: an evidence-consistent exact moved candidate may now be a recoverable interrupted swap, while ambiguous or tampered candidate states must continue to fail closed."
    - "Add a deterministic GREEN regression showing ordinary handled os.replace failure after predecessor removal auto-rolls back cleanly instead of stranding a PARTIAL transaction, if this behavior follows naturally from the same fix. Do not add unrelated recovery features."
    - "Do not invoke a real installed-app cutover, rollback, recovery, ServiceManagement operation or Runtime lifecycle action. All crash/recovery proofs must run in isolated temporary fixtures through the existing test harness/mocks."
    - "Run focused candidate-cutover tests first, then the existing cutover/lifecycle/provenance affected suites, then canonical ./verify exactly once for handoff verification unless a failure requires a focused correction."
    - "Publish implementation changes on dev non-force, then publish only .agent/tasks/TASK-0074/report.yaml as the report-only direct child. Stop at ARCHITECT_REVIEW."

