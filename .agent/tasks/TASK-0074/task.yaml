acceptance_criteria:
  - id: AC-1
    requirement: "The target-absent PRE_SWAP interruption is deterministically proven and recoverable."
    evidence_required: "Pre-fix RED captures PRE_SWAP + previous.app_present=true + absent target after predecessor removal and proves rollback failure. Post-fix the same persisted state restores the exact predecessor closure and removes the transaction without broadening authority."
  - id: AC-2
    requirement: "The post-replace/pre-phase PRE_SWAP interruption is deterministically proven and recoverable."
    evidence_required: "Pre-fix RED captures PRE_SWAP + exact transaction candidate installed + staged candidate moved away and proves rollback failure. Post-fix rollback validates that candidate identity, compensates only recorded operations, restores the exact predecessor, and removes the transaction."
  - id: AC-3
    requirement: "PRE_SWAP recovery remains fail-closed for ambiguous or tampered states."
    evidence_required: "Focused tests cover symlink/unsafe targets, wrong predecessor closure, tampered/wrong candidate, malformed rollback snapshot and an ambiguous candidate/staged state as applicable; none is silently normalized into a trusted crash state."
  - id: AC-4
    requirement: "Existing schema-5 cutover, rollback, resume, approval, ServiceManagement ownership and provenance semantics are preserved."
    evidence_required: "Existing candidate-cutover and affected lifecycle/provenance suites PASS with no schema/public-command expansion and no unrelated source mutation."
  - id: AC-5
    requirement: "Canonical repository verification and publication are clean."
    evidence_required: "Canonical ./verify PASS, git diff --check PASS, implementation paths restricted to candidate_cutover.py plus the authorized test file, report-only direct child, non-force dev publication, clean tree and main unchanged."

