origin:
  type: architect_audit_followup
  predecessor_task: TASK-0073
  predecessor_review: "99cba90e441314b4ff10433919211a0fe45da1b2"
  predecessor_review_state: ACCEPTED
  audit_basis: >-
    Independent architecture/security red-team review identified the final known freeze blocker in schema-5 cutover:
    transaction metadata remains PRE_SWAP while cutover removes the predecessor app, moves staged-candidate into the
    installed target, and only then persists APP_SWAPPED. A process death between predecessor removal and candidate
    placement leaves PRE_SWAP with target absent; a process death after os.replace succeeds but before the APP_SWAPPED
    metadata write leaves PRE_SWAP with the exact candidate installed. Current PRE_SWAP rollback accepts only the intact
    predecessor (or no app when none existed), so both reachable interruption states fail to converge. TASK-0072 and
    TASK-0073 have already closed the session-race and process-inspection blockers; this task addresses only swap crash
    consistency.
  operator_authorization: >-
    After TASK-0073 Architect acceptance, the Architect stated that cutover PRE_SWAP crash consistency was the one
    remaining known freeze blocker. Operator replied "Tiếp", authorizing this next bounded repository correction only.
    This does not authorize any live Runtime/tunnel lifecycle action or a real installed-app cutover.

