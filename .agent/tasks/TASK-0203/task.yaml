objective: "Make the durable-pipe owner test deterministic about the lifecycle predicate it asserts: the child must remain running until explicit terminate is issued. Preserve every Runtime/source/workflow behavior and all existing privacy/argv/file-mode assertions."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with clean synchronized MAIN ONLY."
    - "Modify only tests/test_durable_pipe.py before report."
    - "Do not change agent_runtime/session.py, durable_pipe.py, durable_pipe_runner.py or any production Runtime behavior."
    - "In test_runner_argv_is_opaque_and_durable_files_are_private, remove the incidental finite two-second target lifetime."
    - "Use a deterministic blocking child body that remains alive until the Runtime explicitly terminates it, such as a Python threading.Event().wait() after printing/flushing the existing secret payload. Do not introduce shell=True or extra external executables."
    - "Give this test's manager a bounded durable hard wall of exactly 30 seconds rather than relying on the suite default 5 seconds. The hard wall remains only a test-fixture safety bound; the test must still terminate explicitly and promptly."
    - "Immediately after manager.start, require the returned session status/lifecycle to represent an active durable execution before the test proceeds to privacy/control assertions."
    - "Preserve all existing assertions proving: runner argv contains only opaque job identity and no user secret/cwd; runner env remains minimal; durable root/job/state/journal permissions are 0700/0600; spec.json is absent after dispatch; pipe write and resize reject with existing typed reasons; explicit terminate yields termination_reason=explicit_terminate."
    - "Do not weaken manager.control semantics. A naturally exited durable session must continue to reject interrupt/terminate as not running."
    - "Do not add arbitrary sleep-based synchronization as the repair."
    - "Run the exact formerly failing test 25 consecutive times in fresh unittest processes or isolated test instances; all 25 must PASS."
    - "Run the complete tests.test_durable_pipe owner module once; all tests must PASS."
    - "Run tests.test_durable_pipe_restart once to ensure restart/lost-ack owner semantics remain PASS."
    - "Run git diff --check."
    - "Only after focused/repeated proof passes, run exactly one canonical ./verify under the proven short-path HOME=$PWD/.h TMPDIR=$PWD/.v environment."
    - "Canonical ./verify must PASS all classified modules; never blind-replay ambiguity."
    - "Remove .h/.v before final observation."
    - "Publish only .agent/tasks/TASK-0203/report.yaml after the test implementation commit."
    - "Final main clean/synchronized MAIN ONLY."

  allowed_existing_files_or_components:
    - "tests/test_durable_pipe.py"
    - ".agent/tasks/TASK-0203/report.yaml"

