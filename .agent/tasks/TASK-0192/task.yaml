structure_authority:
  status: RESOLVED
  source: "Existing start.sh lifecycle owner, Runtime supervisor helper, native menu-bar app, candidate cutover/uninstall lifecycle ownership, and existing tests/docs."
  rationale: "Simplify existing owners in place. Do not add another daemon, supervisor, state store, status service, registry, or orchestration layer."

objective: "Make Runtime lifecycle explicitly manual and session-scoped while preserving TASK-0191 status truth and positive ownership safety. The menu-bar app may continue to launch at user login for visibility, but Runtime itself must never rely on persistent desired-state, reboot/login survival, or automatic crash restart. Menu-bar refresh must remain truthful without allowing slow probes to build an unbounded stale-work queue."

scope:
  required_changes:
    - "Preserve TASK-0191 availability/control separation and canonical status ownership. Runtime serving truth still comes from the package-owned status observation; lifecycle intent must not become availability truth again."
    - "Remove the steady-state protected-runtime-running desired-state marker from the current lifecycle contract. New Runtime start/stop/restart/status behavior must not create, require, restore, or infer current availability from that marker."
    - "Keep the menu-bar main-app login item behavior unchanged so the operator can still see Runtime status after login. This task removes Runtime persistence, not operator-visible UI startup."
    - "Keep one exact per-user Runtime LaunchAgent as the explicit invocation/ownership mechanism, but change the current contract to RunAtLoad=false and KeepAlive=false. It may be loaded/registered while idle; it must run only after explicit Start/Restart or other separately authorized lifecycle action."
    - "Change AgentRuntimeRuntimeService so an explicit launch runs one owned Runtime generation, performs the existing bounded child/process-group cleanup, then exits. Unexpected child exit must not request automatic launchd restart. Reboot/login must not start Runtime automatically."
    - "Keep Start explicit and fail-closed: validate installed/current lifecycle identity, refuse foreign/ambiguous port ownership, launch exactly one owned generation, and wait for canonical readiness."
    - "Keep Stop explicit and fail-closed: signal only positively proven canonical lifecycle ownership, wait for owned listener/supervisor absence, and treat an already-stopped canonical state as a safe no-op. Never kill or adopt foreign/read-only Runtime state."
    - "Keep Restart as explicit Stop plus Start semantics if the CLI retains it; no implicit restart policy may remain."
    - "Simplify the canonical status JSON so it no longer carries persistent desired-state as a semantic field. If the shape changes, use an explicit internal schema revision and update the Swift decoder/tests together. MCP public tool contracts must not change."
    - "Update current install/cutover/uninstall lifecycle ownership for the new non-persistent LaunchAgent contract. New committed steady state must contain no desired-state marker. Predecessor rollback compatibility may preserve or restore predecessor desired-state only when strictly necessary to restore an older pre-task lifecycle during an in-progress rollback; it must not leak into the new steady-state contract."
    - "Do not redesign candidate cutover. Delete/merge obsolete desired-state accounting where it is no longer required; retain only narrowly proven predecessor compatibility needed for safe rollback."
    - "Make menu-bar refresh coalescing explicit. At most one status observation may be running/queued at a time, with at most one pending follow-up request. Timer ticks or popover refreshes arriving during an in-flight observation must coalesce rather than accumulate stale status work."
    - "Lifecycle button actions must not be trapped behind an unbounded refresh backlog. Preserve serialized lifecycle mutation and truthful post-action refresh."
    - "Keep the existing refresh cadence unless focused evidence requires a small adjustment; do not add event monitors, filesystem watchers, XPC, sockets, background daemons, or new status processes merely to avoid polling."
    - "Update focused shell/Python/Swift tests and operator documentation for the new manual lifecycle semantics. Required proof includes: login/UI may start while Runtime remains stopped; explicit Start reaches running managed; explicit Stop reaches stopped; crash/child failure does not auto-restart; reboot/login semantics do not claim Runtime survival; external/read-only state remains non-controllable; repeated slow refresh requests remain bounded/coalesced."
    - "Run focused lifecycle, cutover/uninstall contract, Swift Core/MenuBar and relevant regression tests before canonical verification."
    - "Run exactly one new canonical ./verify invocation only after focused tests pass. The verifier must run through a durable/reconcilable path; if outcome becomes unknown, reconcile existing execution before any retry and never blind-replay."
    - "Do not install, cut over, restart, stop, or otherwise mutate the operator's live installed Runtime while implementing or verifying this source task."
    - "TASK-0190 revision 8 remains superseded. Do not consume its physical reboot or lifecycle effect authority."

