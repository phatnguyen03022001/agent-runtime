acceptance_criteria:
  - id: AC-1
    requirement: "Current Runtime lifecycle is manual/session-scoped, not persistent."
    evidence_required: "Source/tests prove the new current LaunchAgent is RunAtLoad=false and KeepAlive=false; no steady-state desired-state marker is created or required; Runtime does not auto-start after login/reboot or auto-restart after an unexpected child exit."
  - id: AC-2
    requirement: "Explicit lifecycle control remains safe and correct."
    evidence_required: "Focused tests prove Start reaches one healthy managed Runtime, Stop safely no-ops when already stopped and stops only positive canonical ownership when running, Restart is explicit bounded Stop+Start, and foreign/read-only Runtime remains non-controllable."
  - id: AC-3
    requirement: "TASK-0191 status truth is preserved without persistent-intent baggage."
    evidence_required: "Canonical status and Swift presentation tests prove Running/Stopped/Attention/read-only semantics remain correct and no persistent desired-state field drives availability; any internal status schema change is exact and synchronized."
  - id: AC-4
    requirement: "Menu-bar refresh cannot accumulate stale work."
    evidence_required: "Deterministic Swift tests prove many timer/popover refresh requests during a slow in-flight observation produce at most one active observation plus one coalesced follow-up, and lifecycle actions are not queued behind an unbounded refresh backlog."
  - id: AC-5
    requirement: "Install/cutover/uninstall ownership matches the simplified current lifecycle without weakening rollback safety."
    evidence_required: "Focused tests prove new current-state materialization/validation uses the non-persistent LaunchAgent contract and no current desired marker; any predecessor marker handling exists only in bounded rollback compatibility and new committed steady state is marker-free."
  - id: AC-6
    requirement: "No live operator state or unrelated product contract is mutated."
    evidence_required: "Execution report records zero live install/cutover/restart/reboot effects, unchanged MCP public surface/capacity contract, and unchanged TASK-0190 effect accounting."
  - id: AC-7
    requirement: "Canonical source verification passes without replay ambiguity."
    evidence_required: "Focused relevant suites PASS, then exactly one new durable/reconcilable ./verify invocation completes PASS with no blind retry."
  - id: AC-8
    requirement: "Repository closure is minimal and canonical."
    evidence_required: "One reviewable implementation candidate, truthful report, non-force publication on main, final clean synchronized MAIN ONLY topology."

