proven_root_cause:
  component: agent_runtime/durable_pipe_runner.py
  distinction_from_task_0205: "TASK-0205 stabilized only initial runner/target identity admission before RUNNING publication. Later target-owner revalidation still calls observe_process_identity(process.pid) once."
  one_shot_sites:
    - {purpose: hard_wall, current_behavior: "single observe_process_identity then exact compare; mismatch returns runner exit 2 before terminal persistence"}
    - {purpose: interrupt, current_behavior: "single observe_process_identity then exact compare before signal delivery"}
    - {purpose: terminate, current_behavior: "single observe_process_identity then exact compare; mismatch returns runner exit 2 before terminal persistence"}
  failure_projection: "A transient None or transient differing observation at hard-wall/terminate can make the durable runner exit before writing terminal state. Persisted state remains running; restart recovery then correctly fails closed with DURABLE_OWNER_LOST."
  preserved_security_boundary: "A genuinely stable different process identity must still fail exact ownership revalidation and must never receive a signal."

objective: "Stabilize only post-bootstrap target-process identity revalidation in the durable runner by using bounded stable exact observation semantics before hard-wall/control signaling decisions. Preserve exact identity contents, fail-closed true-mismatch behavior, deadlines, durable state schema, manager reconciliation/grace semantics and all public terminal APIs."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with clean synchronized MAIN ONLY and one worktree."
    - "Modify production behavior only in agent_runtime/durable_pipe_runner.py."
    - "Reuse the accepted TASK-0205 bounded stability semantics for post-bootstrap target identity revalidation: a usable observation requires two consecutive non-None exactly equal process identities within the existing 0.5-second total observation budget and 0.01-second poll interval."
    - "At hard-wall, interrupt and terminate revalidation points, do not make a signal/ownership decision from one raw observe_process_identity(process.pid) sample."
    - "A stabilized observed identity is authorized for signaling only when it exactly equals the originally persisted process_identity across all six fields."
    - "A stabilized different identity remains a hard ownership mismatch. Never signal that process group and never partially compare identity fields."
    - "Failure to establish the expected stable identity within the existing bound must remain fail-closed; do not convert unknown ownership into success or retry the effect."
    - "Preserve the existing hard-wall deadline value and durable hard-wall deadline persistence. The bounded identity observation may delay signal delivery only by the already accepted 0.5-second identity-observation bound; do not add another grace/sleep/retry budget."
    - "Preserve interrupt, terminate and hard-wall termination_reason semantics when the corresponding signal/effect is actually authorized and delivered."
    - "Preserve true owner-loss behavior: a real stable identity mismatch must still project through existing durable recovery as DURABLE_OWNER_LOST / effect_state unknown / reconciliation_required."
    - "Do not change agent_runtime/durable_pipe.py process identity schema, observe_process_identity implementation or verify_process_identity exact equality."
    - "Do not change agent_runtime/session.py, including _DURABLE_FINALIZATION_GRACE_SECONDS=2.0 or owner-loss reconciliation semantics."
    - "Do not change durable state/control/spec schemas, public ToolContract/API behavior, capacity semantics, output retention or process-group model."
    - "Add deterministic regression coverage in tests/test_durable_pipe.py and/or tests/test_durable_pipe_restart.py."
    - "The deterministic regression must prove a late revalidation sequence with a transient first None or differing observation followed by two exact expected observations succeeds rather than taking the pre-fix one-shot mismatch path."
    - "The deterministic regression must prove a stable different identity is rejected and never authorized for signal delivery."
    - "Cover both remote failure consequences: hard-wall after restart and terminate after restart. The regression must fail against pre-fix behavior for the one-shot observation defect rather than relying on scheduler luck."
    - "Where practical, cover interrupt revalidation under the same stable-observation rule because it is the third identical one-shot call site; do not broaden terminal control semantics."
    - "Preserve all TASK-0205 bootstrap-stability regressions and intentional owner-loss/reused-process protections."
    - "Run test_hard_wall_deadline_survives_restart 25/25 in fresh unittest processes."
    - "Run test_terminate_after_restart_revalidates_and_finalizes 25/25 in fresh unittest processes."
    - "Then run 10 stress rounds with four fresh processes per round, each executing both exact remote failing tests; require 40/40 process invocations PASS with both tests passing in every invocation."
    - "Run full tests.test_durable_pipe once."
    - "Run full tests.test_durable_pipe_restart once."
    - "Run git diff --check."
    - "Only after deterministic/focused/stress proof passes, run exactly one canonical ./verify under HOME=$PWD/.h TMPDIR=$PWD/.v."
    - "Canonical verifier must PASS all classified modules; never blind-replay ambiguity."
    - "Remove .h/.v and all TASK-0211 test scratch/residue before final observation."
    - "Confirm release-gate workflow blob remains exactly fa0c6bc61bb660b103f3a45b239ac52def7ae1b8."
    - "Publish one implementation commit and then only .agent/tasks/TASK-0211/report.yaml as report child."
    - "Final main clean/synchronized MAIN ONLY."

