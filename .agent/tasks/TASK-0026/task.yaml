acceptance_criteria:
  - id: AC-1
    requirement: "Normal operator use no longer requires keeping ./start.sh open in a Terminal: a native menu-bar Agent Runtime.app provides status plus explicit Start, Stop, and Restart controls."
    evidence_required: "Native build/package proof plus UI/controller tests and local non-destructive launch proof show an LSUIElement app with the required states/actions and no Dock presence."
  - id: AC-2
    requirement: "Runtime lifecycle is strictly explicit-action-only and fail-closed for non-owned processes."
    evidence_required: "Deterministic tests prove app launch/login/refresh/relaunch/error paths perform no lifecycle mutation, an external Runtime is read-only, and only positively owned synthetic processes respond to explicit Start/Stop/Restart paths."
  - id: AC-3
    requirement: "Owned lifecycle cleanup is correct across normal stop/restart and app relaunch without permitting stale/PID-reused ownership to signal an unrelated process."
    evidence_required: "Synthetic process-tree tests prove child cleanup and ownership invalidation/revalidation, including stale metadata and PID-reuse-equivalent negative cases."
  - id: AC-4
    requirement: "The existing MCP runtime contract and security/environment boundaries are unchanged."
    evidence_required: "./verify passes, exact four-tool surface proof passes, Python runtime-core diff is absent or limited only to Architect-approved blocking revision, requirements remain unchanged, and workspace/env/session bounds remain covered by existing tests."
  - id: AC-5
    requirement: "Installation and login integration add only the native UI lifecycle surface and preserve the CLI rollback path."
    evidence_required: "Installer/package tests or bounded local proof show Agent Runtime.app plus UI-only login launch are reproducible, ./start.sh remains usable, login does not start Runtime, and no live Runtime lifecycle mutation occurred during installation/verification."
  - id: AC-6
    requirement: "No new control plane, service framework, secret store, persistence engine, third-party dependency, or cross-repository coupling is introduced."
    evidence_required: "Exact candidate diff/dependency inspection plus bundle/runtime inspection prove the allowed native component boundary and absence of prohibited mechanisms."
  - id: AC-7
    requirement: "Publication and evidence remain reconstructible and bounded."
    evidence_required: "Task/report validation, exact changed-path proof, non-force dev publication, candidate/report parentage proof, fresh dev/main resolution, and unchanged main proof."

