  - id: AC-1
    requirement: "Terminal process-launch authority is no longer misleading."
    evidence_required: "terminal_exec and terminal_start Authority.workspace_bound are false; network/mutation authority unchanged."
  - id: AC-2
    requirement: "cwd remains workspace-bound."
    evidence_required: "Contract precondition remains explicit and focused behavior test proves outside-workspace cwd is rejected."
  - id: AC-3
    requirement: "No sandbox claim or execution behavior change is introduced."
    evidence_required: "Diff is metadata/docs/tests only apart from the two contract literals; no execution path changes."
  - id: AC-4
    requirement: "Public capability schemas remain stable."
    evidence_required: "runtime_capabilities 2/3, descriptor schema 2, kernel 2 and existing public tool schemas unchanged; focused registry tests PASS."
  - id: AC-5
    requirement: "Documentation states the authority boundary precisely."
    evidence_required: "README and THREAT_MODEL explicitly distinguish cwd binding from operator-UID host effect authority."
  - id: AC-6
    requirement: "Canonical verification passes with zero live/release effects."
    evidence_required: "Focused tests PASS then exactly one ./verify PASS; effect accounting zero outside verifier."
  - id: AC-7
    requirement: "Canonical closure."
    evidence_required: "Truthful report; final main clean/synchronized MAIN ONLY."

