problem_statement:
  - "terminal_exec and terminal_start currently publish Authority.workspace_bound=True."
  - "Implementation only requires cwd to resolve inside AGENT_RUNTIME_WORKSPACE_ROOT; the spawned process still runs with the operator UID and can address host paths/effects available to that account."
  - "README/THREAT_MODEL already disclaim sandboxing, but the capability authority bit can mislead clients into treating terminal execution as workspace effect confinement."

objective: "Make the existing authority metadata truthful without adding a sandbox or changing terminal execution behavior: terminal process-launch authority must no longer claim workspace-bounded effects, while cwd remains strictly workspace-descendant and documentation/tests state that distinction explicitly."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with clean synchronized MAIN ONLY."
    - "Change only terminal_exec and terminal_start ToolContract authority from workspace_bound=True to workspace_bound=False."
    - "Do not change cwd validation: terminal_exec and terminal_start must continue rejecting cwd outside AGENT_RUNTIME_WORKSPACE_ROOT."
    - "Do not change terminal argv, environment, protected-runtime filtering, network authority, mutation authority, process/session lifecycle, PTY/pipe behavior, limits or schemas."
    - "Do not redefine structured fs/repo workspace authority. Existing tools whose path/effect semantics are actually workspace-scoped retain their current workspace_bound values."
    - "Add explicit contract wording to terminal_exec and terminal_start preconditions/postconditions or bounds only where semantically appropriate so source truth states: cwd is workspace-bound; filesystem/host effects are not mechanically confined; process executes with operator-account authority. Do not add a new contract framework or descriptor schema."
    - "Update focused ToolContract/capability-registry tests to assert terminal_exec and terminal_start publish workspace_bound=false while their cwd precondition remains validated-workspace-descendant."
    - "Add a focused behavior regression proving terminal cwd outside workspace is still rejected after the metadata correction. Reuse an existing terminal owner test when possible."
    - "Update README.md and THREAT_MODEL.md with one concise canonical statement: for terminal tools, workspace_root constrains cwd only; it does not confine absolute-path filesystem/process/network effects available to the operator UID."
    - "Do not describe this as a security hardening or sandbox. This is a truthful-contract correction."
    - "Preserve runtime_capabilities request/result schema 2/3, descriptor schema 2, ToolContract kernel version 2, all public tool request/result schemas and the twenty-tool surface."
    - "Run focused tool-contract, capability-registry and terminal cwd-bound tests first."
    - "Then run exactly one canonical ./verify through a durable/reconcilable carrier. Never blind-replay ambiguity."
    - "Publish one implementation candidate and truthful TASK-0199 report. Final repository clean/synchronized MAIN ONLY."
    - "Do not bump version, build/package/archive, tag/release, install/cut over, relaunch menu, Start/Stop/Restart live Runtime, reload plugin, rotate credentials, mutate LaunchServices, request permissions or reboot."

  allowed_existing_files_or_components:
    - "agent_runtime/executor.py"
    - "agent_runtime/session.py"
    - "tests/test_tool_contract.py"
    - "tests/test_capability_registry.py"
    - "tests/test_task0057_admission.py or tests/test_terminal_session.py only if needed for the existing cwd rejection regression"
    - "README.md"
    - "THREAT_MODEL.md"
    - ".agent/tasks/TASK-0199/report.yaml"

invariants:
  - "terminal_exec and terminal_start continue to require cwd inside AGENT_RUNTIME_WORKSPACE_ROOT."
  - "terminal_exec and terminal_start advertise workspace_bound=false because process effects are not mechanically confined to the workspace."
  - "Network and mutation authority values remain unchanged."
  - "No execution/sandbox behavior change."
  - "No descriptor/result/tool schema version bump."
  - "TASK-0197 and TASK-0198 accepted behavior remains unchanged."
  - "TASK-0196 remains paused."
  - "MAIN ONLY."

forbidden_changes:
  - "Implementing App Sandbox, sandbox-exec/SBPL, chroot, containerization, syscall filtering, path rewriting or filesystem confinement."
  - "Changing terminal process environment, executable resolution, argv validation, protected-runtime semantics, network behavior, session lifecycle or resource limits."
  - "Changing CapabilityAuthority fields or descriptor schema."
  - "Changing workspace_bound semantics for non-terminal tools."
  - "Any version/package/release/live/plugin/credential/permission/reboot effect."
  - "Any second canonical ./verify after a conclusive result or blind replay after ambiguity."
  - "Any branch or PR."

