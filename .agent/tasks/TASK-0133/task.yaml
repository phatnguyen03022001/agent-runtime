objective: >-
  Add one bounded native fs_write capability for whole-file strict-UTF-8 create or replace.
  Create must be atomic no-overwrite. Replace must be exact expected-SHA guarded and use the accepted
  immediate revalidation + atomic replacement pattern. Emit deterministic fs-write ReceiptV1 evidence.
  Grow the public MCP surface from 15 to exactly 16 tools. Do not implement staging, repo_commit,
  repo_publish hardening, capability discovery, doctor, packaging, install, restart, or cutover.

architecture:
  relationship:
    fs_patch: "existing-file localized exact-once UTF-8 edits"
    fs_write: "whole-file UTF-8 create or replace"
    terminal_exec: "escape hatch for binary/chmod/chown/xattr/generators/bulk operations"
  principles:
    - "fs_write is not upsert"
    - "fs_write is not append"
    - "fs_write is not a binary/blob API"
    - "fs_write does not create parent directories"
    - "fs_write does not accept mode/chown/xattr/ACL controls"
    - "expected state is mandatory by operation: create=absence, replace=exact SHA"
    - "policy/preconditions resolve before exact filesystem mutation"
    - "no ToolContract Kernel rewrite"

fs_write:
  implementation_path: agent_runtime/fs_write.py
  contract_constant: FS_WRITE_CONTRACT
  tool_contract:
    tool_class: write
    authority:
      workspace_bound: true
      network: none
      mutation: bounded
    annotations:
      read_only: false
      destructive: true
      idempotent: false
      open_world: false

  public_input:
    cwd: AbsoluteCwd
    path:
      type: strict_string
      max_chars: 4096
      semantics: "normalized cwd-relative descendant file path"
    operation:
      exact_values:
        - create
        - replace
    content:
      type: strict_utf8_string
      max_utf8_bytes: 1048576
      nul: forbidden
    expected_sha256:
      type: "lowercase_sha256|null"
      default: null
      create: forbidden
      replace: required

  public_validation:
    - "Pydantic input schema must remain closed extra=forbid."
    - "operation=create with non-null expected_sha256 => INVALID_ARGUMENT / EXPECTED_SHA_FORBIDDEN."
    - "operation=replace with null expected_sha256 => INVALID_ARGUMENT / EXPECTED_SHA_REQUIRED."
    - "content must encode strict UTF-8; invalid surrogate => INVALID_ARGUMENT / INVALID_UTF8_CONTENT."
    - "content containing U+0000 => INVALID_ARGUMENT / NUL_CONTENT_DISALLOWED."
    - "content exact UTF-8 bytes must be <=1 MiB."

  shared_safety:
    - "Reuse existing fs_safety descriptor-relative/no-follow primitives."
    - "Do not modify agent_runtime/fs_safety.py in this task."
    - "Parent directory must already exist and remain within validated cwd/workspace."
    - "Reject absolute path, NUL path, empty/dot/dot-dot path components, and symlink traversal."
    - "No network, subprocess, shell, or external utility."

  create_semantics:
    precondition: target_absent
    requirements:
      - "Do not perform check-then-os.replace."
      - "Create a same-directory temporary regular file with O_CREAT|O_EXCL|O_NOFOLLOW."
      - "Use requested creation mode 0666 subject to the process umask/default directory policy; do not expose a mode input."
      - "Write complete content bytes and fsync the temp file before publication."
      - "Publish with an atomic no-overwrite primitive. A same-directory hard-link publication using dir_fd + EEXIST semantics is acceptable."
      - "If target exists as any filesystem type at publication time, fail PRECONDITION_FAILED / TARGET_ALREADY_EXISTS without altering target."
      - "After successful publication, remove the temp name and fsync the parent directory."
      - "If post-publication temp-name cleanup fails, perform bounded compensation only when the target still identifies the just-published inode; never delete an unrelated replacement. If clean compensation cannot be proven, return INTERNAL_ERROR / CREATE_CLEANUP_AMBIGUOUS with truthful mutation ambiguity in the bounded message."
      - "Do not claim stronger isolation than atomic no-overwrite publication."
    mode:
      - "Report actual final POSIX mode bits observed from the published file."
      - "Do not claim ownership, ACL, xattr, resource-fork, or extended metadata preservation."

  replace_semantics:
    preconditions:
      - "target exists"
      - "target is regular file"
      - "no symlink traversal"
      - "target size <=1 MiB"
      - "target content strict UTF-8 and NUL-free"
      - "SHA256(exact original raw bytes) == expected_sha256"
    requirements:
      - "Preserve original POSIX mode bits exactly."
      - "If replacement bytes == original bytes, revalidate exact original identity + SHA and return status=unchanged without replacing."
      - "Otherwise create same-directory temp, write full bytes, fsync temp, preserve mode bits."
      - "Immediately before os.replace, re-open target with no-follow semantics and require original dev/inode identity and original SHA still match."
      - "Any drift => STATE_CHANGED / LOCAL_STATE_CHANGED and target remains unreplaced."
      - "Use same-directory atomic os.replace after successful immediate revalidation."
      - "fsync parent directory after replacement."
      - "Best-effort cleanup temp on all failure paths."
      - "Document/encode no stronger guarantee than immediate pre-replace identity+hash revalidation; arbitrary external same-UID mutation in the tiny revalidation-to-replace window is outside v1 isolation."

  replay_semantics:
    - "Capability annotation remains idempotent=false."
    - "Successful create replay must not mutate again and returns TARGET_ALREADY_EXISTS."
    - "Successful replace replay using old expected SHA must not mutate again and returns EXPECTED_SHA_MISMATCH, unless original and replacement bytes were identical and the expected SHA still matches."
    - "status=unchanged is allowed only when requested final bytes already exactly equal accepted original bytes."

  hard_bounds:
    path_chars: 4096
    content_utf8_bytes: 1048576
    replace_input_file_bytes: 1048576
    output_file_bytes: 1048576

  receipt:
    result_field: write_receipt
    schema:
      schema_version: 1
      kind: fs-write
      digest: lowercase_sha256
    make_receipt_v1:
      kind: fs-write
      subject:
        - validated_absolute_cwd
        - normalized_relative_path
      semantic_parameters:
        - operation
        - expected_sha256_or_expected_absent
      observed_state_bytes: >-
        frame(canonical_structured_bytes({"mode_bits": final_mode_bits}))
        concatenated with frame(exact_final_file_bytes)
    requirements:
      - "Use ToolContract Kernel v1 helpers; do not modify tool_contract.py."
      - "Receipt hashes exact final content and final mode evidence."
      - "No timestamp/random/process identity is included in receipt semantics."
      - "Receipt is evidence, not a mandatory downstream authorization token."
      - "Same semantic final state produces same digest."

  public_result:
    schema_version: 1
    fields:
      status: "created|replaced|unchanged"
      path: string
      sha256_before: "lowercase_sha256|null"
      sha256_after: lowercase_sha256
      bytes_before: "integer|null"
      bytes_after: integer
      mode_before: "integer|null"
      mode_after: integer
      write_receipt:
        schema_version: 1
        kind: fs-write
        digest: lowercase_sha256

  error_contract:
    use: CapabilityErrorEnvelope
    reason_mapping:
      INVALID_PATH: INVALID_ARGUMENT
      INVALID_UTF8_CONTENT: INVALID_ARGUMENT
      NUL_CONTENT_DISALLOWED: INVALID_ARGUMENT
      EXPECTED_SHA_REQUIRED: INVALID_ARGUMENT
      EXPECTED_SHA_FORBIDDEN: INVALID_ARGUMENT
      PATH_OUTSIDE_WORKSPACE: OUTSIDE_WORKSPACE
      TARGET_NOT_FOUND: NOT_FOUND
      TARGET_ALREADY_EXISTS: PRECONDITION_FAILED
      EXPECTED_SHA_MISMATCH: PRECONDITION_FAILED
      SYMLINK_DISALLOWED: PRECONDITION_FAILED
      NOT_REGULAR_FILE: PRECONDITION_FAILED
      INVALID_UTF8_TARGET: PRECONDITION_FAILED
      NUL_TARGET_DISALLOWED: PRECONDITION_FAILED
      LOCAL_STATE_CHANGED: STATE_CHANGED
      INPUT_FILE_LIMIT: LIMIT_EXCEEDED
      OUTPUT_FILE_LIMIT: LIMIT_EXCEEDED
      FILESYSTEM_PERMISSION_DENIED: PERMISSION_DENIED
      FILESYSTEM_UNAVAILABLE: UNAVAILABLE
      ATOMIC_WRITE_FAILED: INTERNAL_ERROR
      CREATE_CLEANUP_AMBIGUOUS: INTERNAL_ERROR

