  required_changes:
    - "Fresh-resolve GitHub dev/main and require local HEAD=origin/dev=exact TASK-0078 execution base, clean tree and main unchanged before mutation."
    - "Read the generated MCP input schemas for terminal_exec, terminal_start and fs_read_batch before editing; do not reason only from source annotations."
    - "TDD RED-A: add a connector-portability regression requiring public cwd schemas to avoid the connector-fragile absolute-path regex while Runtime still rejects relative cwd and cwd outside the configured workspace."
    - "TDD RED-B: add a public-contract regression requiring benign PTY resize to have truthful non-destructive/closed-world/idempotent tool-level semantics while write, interrupt and terminate remain available only through a truthfully destructive/open-world contract."
    - "TDD RED-C: add deterministic x6 admission regressions using Event/Barrier coordination or equivalent explicit hold state. Prove six heavy roots are simultaneously held and accounted before issuing the seventh request."
    - "TDD RED-D: prove the seventh heavy root is rejected before child/session creation and prove mixed terminal_exec plus terminal_start roots share the same global HeavyExecutionAdmission ceiling."
    - "TDD RED-E: prove capacity_observer and fs_read_batch remain responsive while six heavy roots are held and prove cleanup returns heavy admission to zero."
    - "Record exact failing test names and failure signals on the unmodified exact TASK-0078 execution base before production-source mutation. Preauthority dirty content is not valid RED evidence."
    - "Move absolute-cwd enforcement from connector-fragile public-schema regex to existing Runtime-side validation only as needed. Preserve non-empty absolute path, strict resolution, workspace containment and fail-closed invalid/outside-workspace behavior before execution/read."
    - "Preserve fs_read_batch descriptor-relative no-symlink traversal, regular-file requirement, UTF-8 validation and existing scan/output bounds."
    - "Refactor the PTY public contract minimally so resize has truthful safe semantics and write/interrupt/terminate keep truthful destructive semantics. Do not remove any action."
    - "A public-tool count change is allowed only if required for truthful tool-level safety semantics. If changed, update PUBLIC_TOOL_NAMES, timing allowlist, MCP/client conformance tests and README consistently."
    - "Do not change the accepted heavy execution ceiling of six, queue semantics, HeavyExecutionAdmission ownership model or advisory-only role of capacity_observer."
    - "Keep terminal_exec roots plus live terminal_start PTY roots accounted under the same Runtime-owned admission domain."
    - "Use targeted affected tests during iteration; run canonical ./verify exactly once for final handoff unless a final failure requires focused correction and one re-run."
    - "Publish implementation changes on dev non-force, then publish only .agent/tasks/TASK-0078/report.yaml as the report-only direct child and stop at ARCHITECT_REVIEW."

