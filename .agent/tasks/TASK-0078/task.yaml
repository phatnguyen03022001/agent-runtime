structure_authority:
  status: NOT_APPLICABLE
  source: "Current agent_runtime package/tests/README structure."
  rationale: "No new top-level module/framework is needed. The correction must reuse existing contracts, server, path validation, session, capacity and verification structure."
problem_statement:
  schema_portability: "Public cwd schemas currently expose JSON Schema pattern ^/. Codex connector validation rejected a valid absolute cwd before the request reached Runtime, while Runtime already owns stricter absolute, workspace-root and path-identity validation. The public schema must become connector-portable without weakening Runtime-side fail-closed path validation."
  pty_control_safety: "terminal_control currently combines resize with write/interrupt/terminate under one destructive/open-world tool classification. Tool-level annotations therefore cannot truthfully distinguish benign bounded resize from destructive terminal mutation. All four capabilities must remain available, but their public contract must have truthful safety semantics."
  deterministic_capacity_proof: "Prior TASK-0077 live evidence did not establish that six PTY sessions were simultaneously running immediately before the seventh probe. Source/test correction must preserve the accepted hard heavy ceiling of six and make the concurrency proof deterministic with explicit hold/barrier state before seventh admission."
  live_boundary: "TASK-0077 currently owns a real installed schema-5 PENDING APP_SWAPPED generation. TASK-0078 is strictly repository source/test/public-contract work and must not mutate, commit, rollback, recover, replace, restart, or otherwise alter that live state."
objective: "Implement the smallest comprehensive Runtime contract correction that improves MCP connector portability, separates safe PTY resize semantics from destructive control semantics without removing capability, and proves the accepted x6 heavy-execution ceiling deterministically. Preserve all path/workspace, protected-runtime, capacity, session, lifecycle and security boundaries. Publish implementation plus report on dev and stop at ARCHITECT_REVIEW. Do not package, install, activate, commit or freeze a new candidate in this task."
