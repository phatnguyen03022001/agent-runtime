root_cause:
  classification: child_exit_pipe_drain_race
  source: agent_runtime/repo_diff.py
  function: _run_git
  former_behavior: "A selector turn with no events checked process.poll(); if the child had exited, stdout/stderr were unregistered and the loop broke without requiring EOF."
  consequence: "Buffered Git stdout could be discarded after successful child exit, causing valid rev-parse HEAD output to become empty and fail strict HEAD validation."
  resolution: "A no-event selector turn now only continues bounded observation. Streams are unregistered only when os.read returns EOF; existing deadline and output-limit paths remain authoritative."

