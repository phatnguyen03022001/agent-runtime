    scenario: "Child is already exited; selector intentionally yields one no-event turn before exposing buffered stdout/stderr and then EOF."
    asserts:
      - "Complete buffered stdout is returned after the no-event turn."
      - "Buffered stderr is drained under the same exited-child condition."
      - "Both streams remain registered until explicit EOF."
      - "The selector requires three turns: no-event, data, EOF."

