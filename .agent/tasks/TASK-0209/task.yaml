objective: "Fix only the repo_diff bounded subprocess reader so child exit never causes unread stdout/stderr pipe bytes to be discarded. Preserve Git validation, output bounds, deadline, command arguments, object-format policy and all repo_commit semantics."

scope:
  required_changes:
    - "Fresh-bind exact revision-1 base with clean synchronized MAIN ONLY and one worktree."
    - "Modify production behavior only in agent_runtime/repo_diff.py."
    - "In repo_diff._run_git, remove the child-exited/no-selector-event branch that unregisters stdout/stderr and breaks before EOF."
    - "A selector turn with no events must not discard or unregister either stream solely because process.poll() is non-None."
    - "Continue bounded observation until each registered stream is explicitly consumed to EOF by os.read returning empty bytes, or until the existing deadline/error/output-limit path terminates the call."
    - "Preserve the existing rule that selector.unregister(stream) occurs when that stream's os.read returns EOF."
    - "Preserve CALL_DEADLINE_SECONDS=5.0, stdout/stderr limits, fixed /usr/bin/git, shell=False, Git argv hardening and Git environment exactly."
    - "Do not add Git retries, subprocess retries, sleeps, grace periods or output-validation relaxations."
    - "Do not change repo_diff HEAD validation: a valid HEAD remains exactly lowercase 40-hex under the existing product contract."
    - "Do not change repo_stage, repo_commit, repo_fast_forward, repo_observer or repo_remote_observer production code."
    - "Do not introduce a shared subprocess abstraction in this reliability task."
    - "Add deterministic regression coverage in tests/test_repo_diff.py."
    - "The regression must exercise _run_git through a controlled exited-child + buffered-pipe scenario where the selector deliberately yields one no-event turn after child exit before exposing readable stdout/EOF."
    - "The regression must prove valid buffered stdout is returned completely after that no-event turn and is not dropped."
    - "Where practical, prove stderr is also drained/bounded under the same exited-child condition without weakening existing limit semantics."
    - "The regression must fail against the pre-fix branch because the old implementation unregisters/breaks on that first no-event-after-exit turn."
    - "Preserve all existing repo_diff validation and continuation tests."
    - "Do not modify tests/test_repo_commit.py unless a dedicated regression cannot be expressed in test_repo_diff.py; if modification becomes necessary, stop AUTHORITY_REQUIRED rather than expanding scope silently."
    - "Run the exact remote failing test 50 times in fresh unittest processes; require 50/50 PASS."
    - "Then run 10 stress rounds with four fresh processes concurrently executing that exact repo_commit test; require 40/40 PASS."
    - "Run full tests.test_repo_diff once."
    - "Run full tests.test_repo_commit once."
    - "Run full tests.test_repo_stage once because repo_commit's staged-state path is an upstream owner of the same Git identity contract."
    - "Run git diff --check."
    - "Only after focused/stress proof passes, run exactly one canonical ./verify under HOME=$PWD/.h TMPDIR=$PWD/.v."
    - "Canonical verifier must PASS all classified modules; never blind-replay ambiguity."
    - "Remove .h/.v and all TASK-0209 test scratch/residue before final observation."
    - "Confirm release-gate workflow blob remains exactly fa0c6bc61bb660b103f3a45b239ac52def7ae1b8."
    - "Publish one implementation commit and then only .agent/tasks/TASK-0209/report.yaml as report child."
    - "Final main clean/synchronized MAIN ONLY."

