    - "Require deterministic release-bundle build #1 and #2 PASS, archive/manifest/SHA256SUMS byte comparisons PASS, release_bundle verify PASS and upload PASS."
    - "Inspect each compatibility lane and require PASS for ARM64 assertion, exact artifact download, SHA256SUMS verification, release_bundle verify, codesign --verify --deep --strict, package_provenance validate-zero-cost and bundled Python 3.13 arm64 smoke."
    - "Require exactly one workflow artifact named agent-runtime-release-assets for the new run."
    - "Download that artifact exactly once."
    - "Treat the GitHub artifact ZIP as transport only. Require exactly three release payload files: one .tar.gz, release-manifest.json and SHA256SUMS.txt; reject any extra release payload file."
    - "Inspect only in isolated run-owned evidence storage; do not commit binary assets."
    - "Verify SHA256SUMS against the archive and require release-manifest filename/hash/size agreement."
    - "Run accepted macos/release_bundle.py verify locally read-only against the downloaded assets; do not build a candidate locally."
    - "Record manifest fields: runtime_version, source_revision, source_tree, candidate_sha256, initial_payload_closure, requirements_lock_sha256, expected_public_tool_count, expected_public_surface_sha256, substrate_manifest_schema, candidate_handoff_schema, payload_schema, archive_filename, archive_sha256, archive_size_bytes, archive_member_count."
