    - "Delete downloaded/materialized artifact evidence after recording bounded hashes/facts."
    - "Publish only .agent/tasks/TASK-0208/report.yaml as tracked repository mutation."
    - "Final main clean/synchronized MAIN ONLY, one worktree, no residue."

