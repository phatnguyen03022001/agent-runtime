acceptance_criteria:
  - id: AC-1
    requirement: "Apple distribution authority is explicitly operator-owned and selection is deterministic."
    evidence_required: "The report records the explicit TeamIdentifier, exact Developer ID Application identity label, and exact notarytool keychain-profile locator; no broad Keychain/profile enumeration, arbitrary discovery, or silent selection occurred."

  - id: AC-2
    requirement: "The exact Developer ID Application locator is usable for Agent Runtime distribution signing semantics."
    evidence_required: "One disposable bounded Mach-O probe signed with the exact identity passes strict codesign verification; signature Authority is Developer ID Application, TeamIdentifier matches the selected team, runtime flag is present, and trusted timestamp is present."

  - id: AC-3
    requirement: "The exact notarytool profile is reusable and authenticated without a notarization submission."
    evidence_required: "The exact profile locator either passes store-credentials validation during creation or an authentication-only validation as an explicitly selected existing profile; no submission is created and no credential material appears in evidence."

  - id: AC-4
    requirement: "The durable repository authority record is minimal, non-secret, and directly consumable by future TASK-0172 continuation."
    evidence_required: ".agent/distribution-authority.yaml exists and contains only the allowed non-secret fields; its exact identity label, TeamIdentifier and keychain-profile locator match the validated authorities; secret-content checks PASS."

  - id: AC-5
    requirement: "Credential and account ownership boundaries are preserved."
    evidence_required: "Signing private key and notarytool credentials remain in macOS Keychain/operator custody; Apple login/2FA/account selection/API-key creation or certificate issuance was performed only by the operator at explicit human boundaries."

  - id: AC-6
    requirement: "TASK-0172 and live Agent Runtime consequences remain untouched."
    evidence_required: "Agent Runtime candidate builds=0, Apple notarization submissions=0, stapling=0, TASK-0172 build/submission/staple counters remain zero, live Runtime/tunnel mutations=0, source mutations=0, releases/tags=0, and TASK-0171 verification reruns=0."

  - id: AC-7
    requirement: "Canonical closure is minimal and reviewable."
    evidence_required: "Only .agent/distribution-authority.yaml and .agent/tasks/TASK-0173/report-r1.yaml are tracked execution outputs; report contains no secrets, validates, publishes non-force, and final main is clean/synced before independent Architect review."

verification:
  authoritative_verification:
    required: true
    mechanism: "Exact-locator disposable Developer ID signing probe plus exact-profile notarytool authentication validation, with no Agent Runtime build and no notarization submission."
    expected_signal: "The exact persisted Developer ID Application label and TeamIdentifier prove hardened-runtime/timestamp signing on a disposable probe, and the exact persisted notarytool keychain-profile authenticates successfully without exposing credentials or submitting an artifact."

report_requirements:
