operator_boundary:
  required_selection:
    - "Exact Apple Developer TeamIdentifier."
    - "Existing exact Developer ID Application identity label, or explicit authorization to provision one new certificate for that team."
    - "Existing exact notarytool keychain-profile locator, or explicit authorization to create agent-runtime.notarytool.<TeamIdentifier>."
    - "For new notarytool provisioning, explicit operator-selected Team App Store Connect API key authority and its credential material supplied only at the interactive/provisioning boundary."
  stop_conditions:
    - "Apple login, 2FA, account/team selection, role grant, API access grant, certificate issuance approval, Team API key creation/download, private-key import, or any other authentication step requires human action."
    - "The operator-selected team cannot create Developer ID Application certificates or cannot create/use a Team App Store Connect API key suitable for notarytool."
    - "The deterministic notarytool profile locator already exists but was not explicitly selected for reuse or overwrite."
    - "The exact Developer ID label or exact notarytool profile cannot be validated without broad identity/profile discovery."
  behavior: "STOP BLOCKED at the human boundary, preserve all zero consequence counters, and report one precise operator action. Resume the same task only after explicit operator authority is supplied."

invariants:
  - "No Agent Runtime product/source/package-input/test/doc/dependency/workflow bytes change."
  - "TASK-0171 verification is not rerun."
  - "TASK-0172 remains BLOCKED and its distribution build/notarization/staple consequence counters remain zero."
  - "No Agent Runtime candidate is built and no artifact is submitted to Apple's notarization service."
  - "Live Runtime, ServiceManagement state, transaction state, and tunnel-client remain untouched."
  - "Keychain remains the durable credential boundary for signing private key and notarytool profile."
  - "Operator retains ownership of Apple Developer and App Store Connect account authority."
  - "No arbitrary Keychain identity/profile enumeration or credential discovery occurs."
  - "No secret credential material is printed, persisted in Git, copied into report evidence, or stored in .agent/distribution-authority.yaml."
  - "The persisted signing locator is the exact Developer ID Application label actually used to sign the probe."
  - "The persisted TeamIdentifier is extracted from and matches the signed probe."
  - "The persisted notarytool locator is the exact profile that successfully authenticated."
  - "No branch, PR, force push, amend, squash, tag, GitHub Release, or unrelated repository metadata mutation."

forbidden_changes:
  - "Any edit under agent_runtime/, macos/, tests/, docs/, README.md, THREAT_MODEL.md, install.sh, start.sh, requirements*, verification_policy.py, verify*, .github/, .env*, or .agent/capability-policy.yaml."
  - "Any invocation of macos/package_app.sh distribution mode or any Agent Runtime package/candidate build."
  - "Any Apple notarization submission, stapling action, Gatekeeper qualification of an Agent Runtime candidate, fresh install, activation, rollback, cutover, reconnect, or recovery."
  - "Any Keychain-wide identity enumeration, certificate/profile search, password dump, raw Keychain item read, or arbitrary credential discovery."
  - "Any silent selection among multiple identities, teams, profiles, API keys, or Apple accounts."
  - "Any certificate/private-key export, API private-key serialization, password/token logging, or credential material committed to Git."
  - "Any automated Apple login/2FA/account-selection bypass or browser scraping around authentication."
  - "Any replacement of Keychain with a repository secret file, environment-secret contract, signing daemon, release service, credential broker, or parallel configuration architecture."
  - "Any TASK-0172 execution or TASK-0171 source requalification in this task."

