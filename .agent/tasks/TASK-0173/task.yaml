structure_authority:
  status: AUTHORIZED_MINIMAL_GOVERNANCE_RECORD
  source: ".agent is the existing repository governance/config surface"
  rationale: "Persist one small non-secret distribution authority record under the existing .agent surface. Do not extend capability-policy.yaml with unrelated credential metadata and do not create a credential subsystem."

objective: "Establish and prove one durable operator-owned Apple distribution authority contract for Agent Runtime: one exact Developer ID Application signing identity and one exact reusable notarytool keychain-profile locator, persist only their non-secret binding metadata in .agent/distribution-authority.yaml, and prove both exact locators are usable without building, notarizing, stapling, installing, or activating an Agent Runtime distribution candidate. Preserve Keychain as the credential boundary and leave all TASK-0172 consequence counters untouched."

scope:
  required_changes:
    - "Freshly prove the exact task base, clean canonical main topology, TASK-0172 BLOCKED review identity, and that TASK-0172 distribution build/notarization/staple counters remain zero before any authority provisioning."
    - "Do not rerun TASK-0171 focused verification or canonical ./verify. Do not modify any product, package-input, test, documentation, dependency, workflow, Runtime, tunnel-client, release, tag, or candidate bytes."
    - "Require the operator to explicitly select the Apple Developer team/TeamIdentifier that owns this Agent Runtime distribution authority before any certificate or notary credential provisioning. Never infer a team from arbitrary Keychain or account state."
    - "For Developer ID Application authority, accept either: (a) an exact operator-supplied existing identity label; or (b) explicit operator authorization to provision one new Developer ID Application certificate for the selected team through Apple's supported workflow. Do not enumerate Keychain identities or select an identity by search/ranking."
    - "If new Developer ID Application issuance requires Apple account login, account/role selection, certificate issuance, 2FA, CSR approval, certificate download, private-key creation/import, or Keychain Access interaction, stop at that human boundary and report the exact operator action required. Do not bypass, scrape, automate around, or guess authentication. Resume only after the operator explicitly supplies the resulting exact Developer ID Application identity label."
    - "A newly provisioned Developer ID Application private key must remain in the operator's macOS Keychain. Never export, print, copy into the repository, or serialize its private key material."
    - "Validate the exact Developer ID Application locator without identity enumeration by signing one disposable bounded Mach-O probe under build/authority-validation/TASK-0173 using the exact supplied label, hardened runtime options, and trusted timestamp semantics."
    - "After probe signing, independently inspect only that probe signature and require: codesign verification PASS; Authority is Developer ID Application; TeamIdentifier equals the explicitly selected TeamIdentifier; runtime flag is present; and a trusted timestamp is present. Apple Development, Mac Developer, ad-hoc, or unsigned results are rejection conditions."
    - "For notarization authority, accept either: (a) an exact operator-supplied existing notarytool keychain-profile locator; or (b) explicit operator authorization to create the deterministic profile locator agent-runtime.notarytool.<TeamIdentifier> for the selected team."
    - "Prefer a Team App Store Connect API key for new notarytool authority. Do not use an Individual App Store Connect API key for notarytool. Do not persist API private-key contents, Apple passwords, app-specific passwords, tokens, API key IDs, issuer IDs, or private-key paths in Git or task/report evidence."
    - "If creation of a Team App Store Connect API key, App Store Connect API access, account/role selection, login, 2FA, private-key download, or other Apple authentication requires operator interaction, stop at that human boundary and report the precise required action. Resume only after the operator explicitly authorizes the selected Team API key material for one bounded notarytool store-credentials operation."
    - "Create a new notarytool profile only with xcrun notarytool store-credentials using the exact deterministic profile locator and validation enabled, so credentials are validated before durable Keychain storage. The Executor must not echo credential material and must not persist the provisioning inputs."
    - "For an explicitly supplied existing notarytool profile, validate only that exact locator. An authentication-only notarytool request may be used with response content suppressed; record only PASS/FAIL and command exit status needed for evidence. Do not enumerate stored profiles or persist unrelated notarization history."
    - "No real notarization submission is authorized. No Agent Runtime archive, app, package, DMG, ZIP, candidate, handoff, or release artifact may be submitted to Apple in this task."
    - "After both exact locators validate, create .agent/distribution-authority.yaml as the sole durable authority binding. It may contain only protocol/record identity, repository, status, exact Developer ID Application identity label, exact TeamIdentifier, exact notarytool keychain-profile locator, notary authority type, provisioning/validation status, optional trustworthy validation timestamps, credential_boundary=macOS Keychain, and secrets_persisted=false."
    - "Before committing the authority record, mechanically reject secret-like or prohibited fields/content: certificate private keys, .p8 contents, Apple IDs/passwords, app-specific passwords, API private keys, bearer/JWT tokens, API key IDs, issuer IDs, environment credential values, or raw Keychain item contents."
    - "Create report-r1.yaml with exact non-secret evidence, zero TASK-0172 consequences, zero Agent Runtime candidate build/submission/stapling effects, and exact authority-record identity. Validate, commit, publish non-force, reconcile clean main, and stop NEEDS_REVIEW for independent Architect acceptance."
    - "After independent acceptance of TASK-0173, TASK-0172 may be revised/resumed separately using only the exact persisted identity label and keychain-profile locator. TASK-0173 itself never executes TASK-0172 packaging."

  allowed_existing_files_or_components:
