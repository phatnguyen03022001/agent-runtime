    - "exact task/base/report lineage"
    - "TASK-0172 BLOCKED review identity and proof its build/notarization/staple counters remain zero"
    - "explicit operator-selected TeamIdentifier"
    - "exact Developer ID Application identity label and whether reused or newly provisioned"
    - "disposable probe path/hash or equivalent bounded identity, strict codesign result, Developer ID authority, TeamIdentifier, runtime flag and trusted timestamp evidence"
    - "exact notarytool keychain-profile locator, authority type, reused/new status and authentication validation PASS/FAIL without response payload or credentials"
    - ".agent/distribution-authority.yaml hash and allowed-field/secret-scan result"
    - "human-boundary actions requested/performed without secret material"
    - "zero Agent Runtime candidate build, notarization submission, stapling, TASK-0172 consequence, live Runtime/tunnel, source, release/tag and TASK-0171 verification effects"
    - "report-only/authority-record publication and final clean/synced reconciliation"

