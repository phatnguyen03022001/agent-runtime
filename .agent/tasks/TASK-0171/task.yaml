structure_authority:
  status: RESOLVED
  source: "Existing package/candidate/cutover architecture"
  rationale: "Productization must extend the existing package and transactional install boundaries. Do not create a parallel package format, updater service, privileged helper, installer daemon, package manager, control plane, or second lifecycle."

objective: "Add a production-grade prebuilt distribution lane for provisioned macOS operators while preserving the current source-build maintainer lane. A release artifact must be capable of becoming Developer-ID-signed, hardened-runtime-enabled, notarized and stapled before final candidate sealing, and must carry a checkout-independent transactional installer path that uses the candidate's packaged Runtime substrate rather than requiring the target operator to clone agent-runtime or install CPython 3.13, Xcode/Swift, or a local signing identity. This task is source-only: implement and verify the distribution/install architecture, but do not submit to Apple notarization, publish a release, mutate the installed Runtime, or require operator signing/notary credentials."

scope:
  required_changes:
    - "Preserve the existing developer/source-build path for maintainers. Source qualification and local candidate packaging remain available and must not become dependent on Apple notarization or external release infrastructure."
    - "Add an explicit distribution/release packaging mode rather than silently changing every package build. Distribution mode must fail closed unless an explicit Developer ID Application signing identity and explicit notarization authority locator/profile are supplied by the caller; never enumerate or guess Keychain identities or credentials."
    - "Distribution mode must sign the complete final executable code graph with Developer ID-compatible hardened-runtime/timestamp semantics suitable for Apple notarization. Do not weaken existing strict codesign or responsible TeamIdentifier checks."
    - "Apple notarization/stapling must occur before final candidate sealing/publication, because stapling mutates the app bytes. The final candidate closure/handoff must therefore bind the exact post-staple app, not the pre-notarization app."
    - "Keep notarization credentials out of product configuration and repository artifacts. They are build/release authority only and must never enter runtime.env, candidate metadata, logs, docs examples containing secrets, or installed product state."
    - "Provide deterministic distribution verification hooks/commands that a later qualification task can use to require strict codesign, hardened-runtime Developer ID identity, successful Gatekeeper assessment, successful stapler validation and unchanged embedded Runtime provenance before sealing."
    - "Create a checkout-independent prebuilt installation path for an extracted release bundle. The installer may be CLI-based, but it must not require the target operator to have a Git checkout of agent-runtime, Git repository identity for the product checkout, CPython 3.13, Swift/Xcode, or any local code-signing identity."
    - "Reuse the candidate app's embedded Python/runtime helpers for provenance/config/cutover work where Python is required. Do not add a second bundled Python or depend on a host-installed Python solely for prebuilt installation."
    - "The prebuilt installer may require only the supported macOS arm64 platform, ordinary system tools already required for lifecycle operation, the official OpenAI tunnel-client, provisioned CONTROL_PLANE_API_KEY / CONTROL_PLANE_TUNNEL_ID, explicit Runtime Git name/email, an explicit existing absolute workspace root, and any unavoidable human Background Activity approval."
    - "Preserve the current exact tunnel identity/security policy. This is a distributable installer for provisioned authorized operators, not a generic public tunnel registration mechanism."
    - "The prebuilt installer must initialize/validate the canonical ~/Library/Application Support/Agent Runtime/runtime.env with mode 0600 without printing secrets, validate the release candidate against its external handoff, and enter the same existing transactional cutover semantics as install.sh --install-prebuilt."
    - "Fresh first-install from a release bundle must not derive AGENT_RUNTIME_WORKSPACE_ROOT from an agent-runtime checkout. Require an explicit absolute existing workspace root as operator input/config and preserve existing Runtime workspace semantics."
    - "Release-bundle installation must retain the same explicit pending cutover decision: successful install is not automatically committed. Existing commit/rollback/recovery authority remains unchanged."
    - "Keep the release artifact minimal. Reuse existing .env.example semantics or a bounded release-specific template only if necessary; do not bundle source history, tests, build toolchain, signing credentials, notary credentials, or unrelated repository content."
    - "Update README/docs so operator paths are clearly separated: prebuilt release installation for provisioned operators versus build-from-source for maintainers. Permanent docs must describe invariant prerequisites rather than one machine's installed state."
    - "Add deterministic tests for distribution-mode command ordering and fail-closed credential/identity requirements, final-seal-after-staple ordering, post-staple candidate identity, checkout-independent prebuilt install preflight, explicit workspace requirement, secret non-disclosure, source-build compatibility, and transactional cutover reuse."
    - "Run focused tests and canonical ./verify exactly once on the immutable final source candidate unless tracked source bytes change afterward."
    - "Do not perform a real notarization submission, release publication, live Runtime install/cutover/restart, tunnel-client mutation, telemetry change, or host signing-credential mutation in TASK-0171."
    - "On PASS, publish one coherent source candidate and a report-only child, then stop NEEDS_REVIEW."

