  allow_new_top_level_directories: false
  allow_new_shared_modules: false

invariants:
  - "Runtime product version remains 0.5.0; ToolContract Kernel and MCP public surface are unchanged."
  - "Existing source-build maintainer path remains supported and does not require notarization by default."
  - "Existing candidate schema, manifest schema-2 ServiceManagement contract, provenance closure, TeamIdentifier binding and transactional cutover semantics remain authoritative."
  - "Distribution mode never seals/publishes a candidate before all distribution-signing/notarization/stapling mutations are complete."
  - "Prebuilt installation requires no agent-runtime Git checkout, build toolchain, CPython 3.13, Swift/Xcode or local signing identity on the target machine."
  - "No secrets are printed, committed, embedded in release artifacts, or copied outside canonical runtime.env."
  - "No root/sudo requirement, privileged helper, installer daemon or blanket TCC permission is introduced."
  - "Official OpenAI tunnel-client remains an external supported dependency; it is not vendored into Agent Runtime."
  - "No live host/product activation effect occurs in this task."
  - "MAIN_ONLY topology remains unchanged."

forbidden_changes:
  - "Real notarization submission, notary credential creation, Keychain enumeration, signing-certificate discovery, or release publication."
  - "Any installed Runtime/package/tunnel-client/service mutation."
  - "Automatic cutover commit after prebuilt installation."
  - "Generic arbitrary tunnel enrollment or weakening of the accepted tunnel identity boundary."
  - "New update daemon, privileged helper, launch daemon, installer service, package manager, auto-updater, release database or remote control plane."
  - "Bundling Homebrew, tunnel-client, Apple credentials, source Git history, tests or build toolchain into the release artifact."
  - "Requiring end users to install the source build dependencies merely to consume a prebuilt release."
  - "Changing MCP tools, Runtime execution semantics, protection semantics, telemetry semantics or same-UID threat-model boundary."

