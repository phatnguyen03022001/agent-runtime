acceptance_criteria:
  - id: AC-1
    requirement: "Distribution packaging is an explicit fail-closed lane and source packaging remains compatible."
    evidence_required: "Tests prove default/source packaging behavior remains available while distribution mode separately requires explicit Developer ID and notary authority inputs and never enumerates/guesses credentials."

  - id: AC-2
    requirement: "The final distributable candidate can be notarized without invalidating its identity."
    evidence_required: "Deterministic package-order proof shows Developer-ID/hardened-runtime signing -> notarization submission -> stapling -> Gatekeeper/stapler/provenance verification -> candidate seal/publication, with final closure calculated only after stapling."

  - id: AC-3
    requirement: "A provisioned operator can install a prebuilt bundle without the source-development toolchain."
    evidence_required: "Fixture/isolated prebuilt-install tests prove no dependency on an agent-runtime Git checkout, Git remote, CPython 3.13, Swift/Xcode or local signing identity; embedded app Runtime substrate performs required Python validation/cutover logic."

  - id: AC-4
    requirement: "Prebuilt configuration and first-install authority remain safe."
    evidence_required: "Tests prove explicit absolute existing workspace input, exact required provisioned credentials/identity validation without disclosure, canonical mode-0600 runtime.env initialization, official tunnel-client prerequisite and unchanged pending commit/rollback semantics."

  - id: AC-5
    requirement: "Existing provenance/security boundaries are preserved."
    evidence_required: "Candidate handoff/provenance/TeamIdentifier/strict codesign regressions remain green; distribution lane cannot seal an unstapled/incompletely verified release candidate and introduces no privileged/TCC/tunnel-policy broadening."

  - id: AC-6
    requirement: "Operator documentation makes release install simpler and separates it from maintainer build."
    evidence_required: "README/INSTALL describe a checkout-independent prebuilt path with its actual remaining prerequisites and a separate source-build path; no docs claim release/notarization is active before TASK-0172 qualification."

  - id: AC-7
    requirement: "No live distribution consequence occurs in source qualification."
    evidence_required: "No notarization submission, GitHub release, installed Runtime mutation, restart/cutover, tunnel mutation or host credential mutation occurs; live Runtime remains exact and healthy."

  - id: AC-8
    requirement: "One coherent final source candidate is verified."
    evidence_required: "Focused distribution/install regressions PASS, existing directly affected package/cutover regressions PASS, git diff --check PASS, and canonical ./verify PASS exactly once on the immutable final candidate unless tracked source bytes change."

verification:
  authoritative_verification:
    required: true
    mechanism: "Focused distribution/install source tests plus canonical ./verify on the immutable final source candidate; no real notarization or live installation in this task."
    expected_signal: "Source contains a fail-closed Developer-ID/notarization-capable distribution lane and a checkout-independent transactional prebuilt installer while existing Runtime/source-build behavior remains green."

