invariants:
  - "TASK-0144 structured failure/effect semantics remain authoritative."
  - "repo_observer stays local-only and source schema 2/2; no network behavior is added to it."
  - "repo_remote_observer never fetches and never mutates repository/config/ref/index/worktree state."
  - "Fixed origin is the only network remote; no user-provided URL or arbitrary remote execution."
  - "ahead and behind remain null when commit graph relation is not freshly known. Fresh ref equality is not a substitute for graph traversal."
  - "Source Runtime remains 0.3.0 and Kernel 2; source public tool inventory becomes exactly 21."
  - "Installed Runtime remains 0.3.0 at activation revision 89111218720ddb2f12961f9375549733edd23ada on the nineteen-tool live surface; no TASK-0149 live activation."
  - "No dependency addition, cache, remote-state database, credential broker, background polling, watcher, provider abstraction or generic git_tool."
  - "No GAP-09, GAP-10, GAP-11, GAP-12 or GAP-13 implementation."
  - "TASK-0150+ is not authored or executed by Executor."
  - "TASK-0148 installed-doctor self-containment follow-up remains open for TASK-0151 before Cutover B."

