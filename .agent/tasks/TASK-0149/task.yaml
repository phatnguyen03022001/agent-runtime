acceptance_criteria:
  - id: AC-1
    requirement: "repo_remote_observer returns fresh exact fixed-origin branch-ref truth without fetch or local mutation."
    evidence_required: "Positive fixtures prove current-branch present/absent and exact branch topology while refs/FETCH_HEAD/index/config/worktree remain byte/state unchanged; result states fetched=false, network_used=true, local_refs_mutated=false."
  - id: AC-2
    requirement: "Remote observation is strictly bounded and fail-closed."
    evidence_required: "Tests prove fixed /usr/bin/git, prompt-disabled environment, origin-only command construction, 10-second deadline or stricter, <=1000 refs, <=256 KiB stdout, <=16 KiB stderr, structured timeout/limit/process failures and no partial-success topology when exactness is lost."
  - id: AC-3
    requirement: "Graph relation is never fabricated from fresh refs alone."
    evidence_required: "Result contract/tests require ahead=null and behind=null when no graph fetch occurs; local_head==remote_head may report exact equality only; stale local tracking refs cannot override fresh ls-remote truth."
  - id: AC-4
    requirement: "Existing repository capability authority remains unchanged."
    evidence_required: "repo_observer regressions preserve source 2/2, fetched=false/network_used=false/mutation=NONE; repo_fast_forward/repo_publish focused regressions preserve their expected-state mutation contracts; no generic Git executor introduced."
  - id: AC-5
    requirement: "Exact source candidate is canonically verified and published with no live cutover."
    evidence_required: "Focused PASS, git diff --check, canonical ./verify exit_code=0 on exact candidate, source Runtime 0.3.0/Kernel 2/tools 21 with repo_remote_observer 1/1, non-force publication reconciliation, installed Runtime still nineteen-tool pre-task live surface, report-only child and NEEDS_REVIEW."

