  - "Any public tool addition other than repo_remote_observer, or removal/rename of existing tools."
  - "Any fetch/pull/push/clone/submodule/archive behavior in repo_remote_observer."
  - "Any caller-supplied remote name, URL, refspec command fragment or arbitrary Git argv."
  - "Any branch/PR/tag/release creation, force push, amend or squash."
  - "Any Runtime version/Kernel bump, dependency/package/install/cutover/runtime.env/ServiceManagement/TCC/plugin/permission change."
  - "Any fix to installed-doctor packaging in TASK-0149."
  - "Any later roadmap implementation or broad unrelated refactor."

