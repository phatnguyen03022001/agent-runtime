structure_authority:
  status: RESOLVED
  source: "Existing repository capability family plus one separate repo_remote_observer module"
  rationale: "Fresh remote truth is a materially different network authority from local repo_observer. Add one dedicated read-only tool rather than overloading repo_observer or building a generic Git/network abstraction."

objective: "Close GAP-03 by adding one bounded read-only repo_remote_observer capability that observes fresh fixed-origin branch refs over the network without fetch, without mutating local refs or repository state, and without pretending to know commit-graph ahead/behind when no graph fetch occurred."

scope:
  required_changes:
    - "Add exactly one new public tool repo_remote_observer with request/result schema 1/1. Source public inventory becomes 21; ToolContract Kernel remains 2; Runtime source version remains 0.3.0."
    - "Do not overload or change repo_observer semantics. repo_observer remains local-only, fetched=false, network_used=false, mutation=NONE and source schema 2/2."
    - "repo_remote_observer is workspace-bound, read-only, idempotent, network=BOUNDED, mutation=NONE, fixed remote=origin only, no caller-supplied URL/remote name, no fetch/pull/push/clone/submodule/archive or credential-prompt interaction."
    - "Require cwd to resolve to the exact non-bare Git repository root inside workspace and require an attached current branch. Observe that current branch plus exact remote branch topology from fixed origin."
    - "Use a fixed bounded git ls-remote --symref --branches origin execution path or repository-native equivalent with identical consequences. Set GIT_TERMINAL_PROMPT=0, use fixed /usr/bin/git, bounded deadline and bounded stdout/stderr processing, and do not invoke shell=True."
    - "Success result must include repository_root, local_branch, local_head, remote='origin', remote_branch_head for the current branch or null when absent, remote_branch_exists, exact bounded remote branch refs as name+sha pairs, branch_count when exact, fetched=false, network_used=true, local_refs_mutated=false, ahead=null and behind=null unless a future separately authorized graph observation exists. Equality of local_head and remote_branch_head may be reported directly but must not be converted into graph claims beyond exact equality."
    - "A successful result is exact only while branch enumeration fits fixed hard limits. Bound branch entries to at most 1000, stdout to at most 256 KiB, stderr to at most 16 KiB and total call deadline to at most 10 seconds. If exact enumeration cannot fit those limits, fail with structured LIMIT_EXCEEDED instead of returning a misleading partial topology or adding continuation/snapshot state."
    - "Parse only exact refs/heads/<name> records with lowercase 40-hex object IDs. Reject malformed, duplicate or contradictory ref output. Do not parse stderr text to drive control flow."
    - "Remote current-branch absence is a successful fresh observation with remote_branch_exists=false and remote_branch_head=null. Network/process/deadline/output failures use existing TASK-0144 structured failure/effect semantics with effect_state=absent, reconciliation_required=false and stable reason codes."
    - "Prove no repository mutation: HEAD, refs/heads, refs/remotes, FETCH_HEAD, index, config and worktree identity remain unchanged across successful and failing observation calls. No fetch means local tracking refs may remain stale and must never be presented as fresh remote truth."
    - "Reuse existing bounded fixed-origin Git environment/process helpers where consequence-equivalent, but do not broaden repo_fast_forward/repo_publish mutation authority or introduce a generic Git command executor."
    - "Update contracts, capability registry, MCP/schema conformance, server instructions and only directly affected documentation/tests. Add focused tests for current-branch present/absent, multi-branch exact parsing, malformed/duplicate refs, timeout, output/branch limits, fixed-origin enforcement, prompt-disabled environment, no local ref/FETCH_HEAD mutation and graph-unknown null ahead/behind semantics."
    - "Do not package/install/restart/reload/cutover Runtime in TASK-0149. Installed Runtime remains the accepted pre-TASK-0148 nineteen-tool surface until Cutover B."
    - "Preserve TASK-0148 review follow-up INSTALLED_DOCTOR_SELF_CONTAINMENT for TASK-0151; do not fix or erase it during TASK-0149."
    - "After focused PASS, commit one coherent implementation candidate, run canonical ./verify on that exact clean candidate, fresh-reconcile remote main, publish exact verified candidate non-force, publish report-r1.yaml as sole report-only child, and stop NEEDS_REVIEW."

  allowed_existing_files_or_components:
    - "new agent_runtime/repo_remote_observer.py"
    - "agent_runtime/contracts.py"
    - "agent_runtime/server.py"
    - "agent_runtime/capability_registry.py"
